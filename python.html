thon that they installed. This lesson is the bridge from the playground to that real workflow.</p>\r\n<p>There are two halves. The <b>first</b> is a short, one-time setup: install Python and install <b>VS Code</b> (the free editor most Python developers use). The <b>second</b>, and bigger, half is a set of <b>warm-up exercises</b> that prepare you for the next lesson's mini-project — a small <b>to-do / task manager</b>. You will still run those exercises here in the browser so you keep the instant checking while you practise the pieces you'll soon assemble.</p>\r\n<p>From here on your <b>homework moves into real VS Code</b> instead of being auto-graded on the site — so getting the tools working is the important first step. Take your time with the setup; everything after it is familiar list, loop and string work aimed at one goal: a working task list.</p>\r\n\r\n<h4>1. Get your tools (one-time setup)</h4>\r\n<p>You only do this once. Three small steps:</p>\r\n<table class=\"res\">\r\n<thead><tr><th>Step</th><th>What to do</th></tr></thead>\r\n<tbody>\r\n<tr><td>1. Install Python</td><td>Go to <code>python.org/downloads</code>, download the latest version, run the installer, and <b>tick “Add Python to PATH”</b> before clicking Install.</td></tr>\r\n<tr><td>2. Install VS Code</td><td>Go to <code>code.visualstudio.com</code>, download and install <b>Visual Studio Code</b>.</td></tr>\r\n<tr><td>3. Add the Python extension</td><td>Open VS Code → Extensions (the squares icon) → search <b>“Python”</b> (by Microsoft) → Install.</td></tr>\r\n</tbody>\r\n</table>\r\n<p>To check it worked, open a terminal in VS Code (menu <b>Terminal → New Terminal</b>) and type <code>python --version</code>. You should see something like <code>Python 3.12.x</code>. That's the whole setup — the rest of this lesson is practice.</p>\r\n\r\n<h4>2. How code runs from a file</h4>\r\n<p>In the browser, your code ran the moment you pressed ▶. On your computer the loop is slightly longer but just as simple: you <b>write</b> code into a <code>.py</code> file, VS Code hands that file to <b>Python</b>, and Python <b>runs</b> it top to bottom and shows the output in the terminal.</p>\r\n<figure class=\"diagram\">\r\n<svg viewBox=\"0 0 380 120\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11\">\r\n  <defs>\r\n    <marker id=\"ah9\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\">\r\n      <path d=\"M0 0 L10 5 L0 10 z\" fill=\"#F5B942\"/>\r\n    </marker>\r\n  </defs>\r\n  <g stroke=\"#22304C\" text-anchor=\"middle\">\r\n    <rect x=\"8\" y=\"40\" width=\"78\" height=\"46\" rx=\"6\" fill=\"#121C30\"/>\r\n    <rect x=\"118\" y=\"40\" width=\"78\" height=\"46\" rx=\"6\" fill=\"#121C30\"/>\r\n    <rect x=\"228\" y=\"40\" width=\"72\" height=\"46\" rx=\"6\" fill=\"#121C30\"/>\r\n    <rect x=\"322\" y=\"40\" width=\"52\" height=\"46\" rx=\"6\" fill=\"#121C30\"/>\r\n  </g>\r\n  <g fill=\"#E8E4D8\" text-anchor=\"middle\">\r\n    <text x=\"47\" y=\"60\">tasks.py</text><text x=\"47\" y=\"76\" fill=\"#8FA0BC\">your file</text>\r\n    <text x=\"157\" y=\"60\" fill=\"#7FD1C0\">VS Code</text><text x=\"157\" y=\"76\" fill=\"#8FA0BC\">editor</text>\r\n    <text x=\"264\" y=\"60\" fill=\"#F5B942\">Python</text><text x=\"264\" y=\"76\" fill=\"#8FA0BC\">runs it</text>\r\n    <text x=\"348\" y=\"60\">Output</text><text x=\"348\" y=\"76\" fill=\"#8FA0BC\">terminal</text>\r\n  </g>\r\n  <g stroke=\"#F5B942\" stroke-width=\"1.5\" marker-end=\"url(#ah9)\" fill=\"none\">\r\n    <line x1=\"88\" y1=\"63\" x2=\"114\" y2=\"63\"/>\r\n    <line x1=\"198\" y1=\"63\" x2=\"224\" y2=\"63\"/>\r\n    <line x1=\"302\" y1=\"63\" x2=\"320\" y2=\"63\"/>\r\n  </g>\r\n</svg>\r\n<figcaption>The edit → run → read loop. You type code into a <code>.py</code> file inside VS Code, press ▶ Run (or type <code>python tasks.py</code> in the terminal), and Python prints the result. Edit, run again, repeat.</figcaption>\r\n</figure>\r\n<p>The good news: the Python language is <b>exactly the same</b> as in this playground. Everything you already know — lists, loops, <code>if</code>, f-strings — works identically in a file. So let's warm up on the building blocks of a task manager.</p>\r\n\r\n<h4>3. A task list is just a list of strings</h4>\r\n<p>A to-do app is, at heart, a <b>list of strings</b> where each string is one task. You already know how to grow a list with <code>append</code>.</p>\r\n<pre class=\"run\">tasks = []\r\ntasks.append(\"Buy milk\")\r\ntasks.append(\"Call Anna\")\r\nprint(tasks)   # ['Buy milk', 'Call Anna']</pre>\r\n<figure class=\"diagram\">\r\n<svg viewBox=\"0 0 300 190\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"IBM Plex Mono, monospace\" font-size=\"12\">\r\n  <text x=\"150\" y=\"18\" text-anchor=\"middle\" fill=\"#8FA0BC\">tasks — a list of strings</text>\r\n  <g stroke=\"#22304C\">\r\n    <rect x=\"70\" y=\"30\" width=\"180\" height=\"30\" rx=\"5\" fill=\"#121C30\"/>\r\n    <rect x=\"70\" y=\"66\" width=\"180\" height=\"30\" rx=\"5\" fill=\"#121C30\"/>\r\n    <rect x=\"70\" y=\"102\" width=\"180\" height=\"30\" rx=\"5\" fill=\"#121C30\"/>\r\n    <rect x=\"70\" y=\"140\" width=\"180\" height=\"30\" rx=\"5\" fill=\"#0E1626\" stroke-dasharray=\"4 3\"/>\r\n  </g>\r\n  <g fill=\"#7FD1C0\" font-size=\"11\" text-anchor=\"end\">\r\n    <text x=\"60\" y=\"50\">[0]</text><text x=\"60\" y=\"86\">[1]</text><text x=\"60\" y=\"122\">[2]</text><text x=\"60\" y=\"160\">[3]</text>\r\n  </g>\r\n  <g fill=\"#E8E4D8\">\r\n    <text x=\"82\" y=\"50\">\"Buy milk\"</text>\r\n    <text x=\"82\" y=\"86\">\"Call Anna\"</text>\r\n    <text x=\"82\" y=\"122\">\"Wash car\"</text>\r\n    <text x=\"82\" y=\"160\" fill=\"#8FA0BC\">append adds here →</text>\r\n  </g>\r\n  <text x=\"150\" y=\"186\" text-anchor=\"middle\" fill=\"#F5B942\">tasks.append(\"...\") always adds to the end</text>\r\n</svg>\r\n<figcaption>Each task sits at an index (0, 1, 2, …). <code>append</code> always adds a new task at the <b>end</b> of the list.</figcaption>\r\n</figure>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 1.</b> Start with <code>tasks = []</code> and <code>append</code> three tasks in order: <code>\"Buy milk\"</code>, <code>\"Call Anna\"</code>, <code>\"Wash car\"</code>. Result <code>['Buy milk', 'Call Anna', 'Wash car']</code>.</span>\r\n<template class=\"st\">tasks = []\r\n# append the three tasks\r\n</template>\r\n<template class=\"ts\">assert tasks == [\"Buy milk\", \"Call Anna\", \"Wash car\"]\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 2.</b> Given <code>tasks = [\"Buy milk\", \"Call Anna\"]</code>, add <code>\"Pay bills\"</code> to the end. Result <code>['Buy milk', 'Call Anna', 'Pay bills']</code>.</span>\r\n<template class=\"st\">tasks = [\"Buy milk\", \"Call Anna\"]\r\n# add \"Pay bills\" to the end\r\n</template>\r\n<template class=\"ts\">assert tasks == [\"Buy milk\", \"Call Anna\", \"Pay bills\"]\r\n</template></div>\r\n\r\n<h4>4. Removing and finding a task</h4>\r\n<p>Users also finish or cancel tasks. <code>list.remove(value)</code> deletes the first matching item; to know <b>where</b> a task is, walk the list and compare.</p>\r\n<pre class=\"run\">tasks = [\"Buy milk\", \"Call Anna\", \"Wash car\"]\r\ntasks.remove(\"Call Anna\")\r\nprint(tasks)                 # ['Buy milk', 'Wash car']\r\nprint(\"Wash car\" in tasks)   # True — membership check</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 3.</b> Given <code>tasks = [\"Buy milk\", \"Call Anna\", \"Wash car\"]</code>, remove <code>\"Call Anna\"</code>. Result <code>['Buy milk', 'Wash car']</code>.</span>\r\n<template class=\"st\">tasks = [\"Buy milk\", \"Call Anna\", \"Wash car\"]\r\n# remove \"Call Anna\"\r\n</template>\r\n<template class=\"ts\">assert tasks == [\"Buy milk\", \"Wash car\"]\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 4.</b> Given <code>tasks = [\"Buy milk\", \"Call Anna\", \"Wash car\"]</code>, set <code>has_call</code> to whether <code>\"Call Anna\"</code> is in the list. Result <code>True</code>.</span>\r\n<template class=\"st\">tasks = [\"Buy milk\", \"Call Anna\", \"Wash car\"]\r\nhas_call = None\r\n# is \"Call Anna\" in the list?\r\n</template>\r\n<template class=\"ts\">assert has_call == True\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 5.</b> Given <code>tasks = [\"Buy milk\", \"Call Anna\", \"Wash car\"]</code>, find the <b>index</b> of <code>\"Wash car\"</code> by looping, and store it in <code>pos</code> (start <code>pos = -1</code>). Result <code>2</code>.</span>\r\n<template class=\"st\">tasks = [\"Buy milk\", \"Call Anna\", \"Wash car\"]\r\npos = -1\r\n# loop to find the index of \"Wash car\"\r\n</template>\r\n<template class=\"ts\">assert pos == 2\r\n</template></div>\r\n\r\n<h4>5. Showing a numbered menu</h4>\r\n<p>People count from 1, but list indexes start at 0 — so a menu line for the task at index <code>i</code> shows the number <code>i + 1</code>. Build each line with an f-string.</p>\r\n<pre class=\"run\">tasks = [\"Buy milk\", \"Call Anna\"]\r\nfor i in range(len(tasks)):\r\n    print(f\"{i + 1}. {tasks[i]}\")\r\n# 1. Buy milk\r\n# 2. Call Anna</pre>\r\n<table class=\"res\">\r\n<thead><tr><th>index i</th><th>tasks[i]</th><th>menu line</th></tr></thead>\r\n<tbody>\r\n<tr><td>0</td><td>\"Buy milk\"</td><td>1. Buy milk</td></tr>\r\n<tr><td>1</td><td>\"Call Anna\"</td><td>2. Call Anna</td></tr>\r\n</tbody>\r\n</table>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 6.</b> Given <code>tasks = [\"Buy milk\", \"Call Anna\", \"Wash car\"]</code>, build a list <code>lines</code> of menu strings <code>\"1. Buy milk\"</code>, <code>\"2. Call Anna\"</code>, <code>\"3. Wash car\"</code> (use <code>i + 1</code> and an f-string).</span>\r\n<template class=\"st\">tasks = [\"Buy milk\", \"Call Anna\", \"Wash car\"]\r\nlines = []\r\n# build \"1. ...\", \"2. ...\", \"3. ...\"\r\n</template>\r\n<template class=\"ts\">assert lines == [\"1. Buy milk\", \"2. Call Anna\", \"3. Wash car\"]\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 7.</b> Given <code>tasks = [\"Buy milk\", \"Call Anna\"]</code>, <b>print</b> the numbered menu (one line per task, like <code>1. Buy milk</code>). Check the printed output.</span>\r\n<template class=\"st\">tasks = [\"Buy milk\", \"Call Anna\"]\r\n# print each task as \"N. task\"\r\n</template>\r\n<template class=\"ts\">assert _OUT_.strip() == \"1. Buy milk\\n2. Call Anna\"\r\n</template></div>\r\n\r\n<h4>6. Marking a task done</h4>\r\n<p>A common trick: mark a finished task by putting a tag in front of its text, like <code>\"[x] \"</code>. Then a task is \"done\" when it <b>starts with</b> that tag (<code>task.startswith(\"[x] \")</code>).</p>\r\n<pre class=\"run\">tasks = [\"Buy milk\", \"Call Anna\"]\r\ndone = []\r\nfor t in tasks:\r\n    done.append(\"[x] \" + t)\r\nprint(done)   # ['[x] Buy milk', '[x] Call Anna']</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 8.</b> Given <code>tasks = [\"Buy milk\", \"Call Anna\", \"Wash car\"]</code>, build <code>done</code> where every task is prefixed with <code>\"[x] \"</code> → <code>['[x] Buy milk', '[x] Call Anna', '[x] Wash car']</code>.</span>\r\n<template class=\"st\">tasks = [\"Buy milk\", \"Call Anna\", \"Wash car\"]\r\ndone = []\r\n# prefix each task with \"[x] \"\r\n</template>\r\n<template class=\"ts\">assert done == [\"[x] Buy milk\", \"[x] Call Anna\", \"[x] Wash car\"]\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 9.</b> Given <code>tasks = [\"[x] Buy milk\", \"Call Anna\", \"[x] Wash car\"]</code>, count how many are <b>done</b> (start with <code>\"[x] \"</code>) into <code>done_count</code>. Result <code>2</code>.</span>\r\n<template class=\"st\">tasks = [\"[x] Buy milk\", \"Call Anna\", \"[x] Wash car\"]\r\ndone_count = 0\r\n# count tasks that start with \"[x] \"\r\n</template>\r\n<template class=\"ts\">assert done_count == 2\r\n</template></div>\r\n\r\n<h4>7. A little summary</h4>\r\n<p>The last piece before the mini-project: a summary line. Count the total and the done tasks, then format one clear sentence.</p>\r\n<pre class=\"run\">tasks = [\"[x] Buy milk\", \"Call Anna\", \"[x] Wash car\"]\r\ntotal = len(tasks)\r\ndone = 0\r\nfor t in tasks:\r\n    if t.startswith(\"[x] \"):\r\n        done += 1\r\nprint(f\"{done} of {total} tasks done\")   # 2 of 3 tasks done</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 10.</b> Given <code>tasks = [\"[x] Buy milk\", \"Call Anna\", \"[x] Wash car\", \"Pay bills\"]</code>, build the string <code>summary</code> = <code>\"2 of 4 tasks done\"</code> using <code>len</code>, a loop and an f-string.</span>\r\n<template class=\"st\">tasks = [\"[x] Buy milk\", \"Call Anna\", \"[x] Wash car\", \"Pay bills\"]\r\nsummary = \"\"\r\n# build \"2 of 4 tasks done\"\r\n</template>\r\n<template class=\"ts\">assert summary == \"2 of 4 tasks done\"\r\n</template></div>\r\n<div class=\"ex stretch\" data-kind=\"py\"><span class=\"exq\"><b>🔥 Stretch (status report).</b> Given <code>tasks = [\"[x] Buy milk\", \"Call Anna\", \"[x] Wash car\"]</code>, build a list <code>report</code> of lines <code>\"N. STATUS name\"</code> where STATUS is <code>DONE</code> if the task starts with <code>\"[x] \"</code> (and its name has that tag removed with <code>task[4:]</code>) or <code>TODO</code> otherwise → <code>['1. DONE Buy milk', '2. TODO Call Anna', '3. DONE Wash car']</code>.</span>\r\n<template class=\"st\">tasks = [\"[x] Buy milk\", \"Call Anna\", \"[x] Wash car\"]\r\nreport = []\r\n# for each task build \"N. STATUS name\"\r\n</template>\r\n<template class=\"ts\">assert report == [\"1. DONE Buy milk\", \"2. TODO Call Anna\", \"3. DONE Wash car\"]\r\n</template></div>\r\n\r\n<div class=\"recap\">Recap of lesson 9: install <b>Python</b> (tick “Add to PATH”) + <b>VS Code</b> + the Python extension · check with <code>python --version</code> · a program is a <code>.py</code> file that Python runs top to bottom · a to-do list is a <b>list of strings</b>: grow with <code>append</code>, delete with <code>remove</code>, test with <code>in</code> · number a menu with <code>i + 1</code> · mark done with a <code>\"[x] \"</code> prefix and test with <code>startswith</code>. Next: assemble these pieces into the <b>to-do / task manager</b> mini-project.</div>\r\n\r\n<h4>🏠 Homework</h4>\r\n<p><b>From this lesson on, homework is done in real VS Code</b> on your computer (not auto-graded here). Create a folder for the course and a file <code>tasks.py</code>, then complete the tasks below. Run your file after each step with the ▶ Run button or <code>python tasks.py</code> in the terminal.</p>\r\n<ol class=\"hw\">\r\n<li><b>Hello, tools.</b> In <code>tasks.py</code>, print <code>\"My task manager\"</code>. Run the file and confirm you see the line in the terminal.</li>\r\n<li><b>Show the list.</b> Make a list of 3 tasks and print them as a numbered menu (<code>1. ...</code>, <code>2. ...</code>, <code>3. ...</code>) using a <code>for</code> loop and <code>i + 1</code>.</li>\r\n<li><b>Add and remove.</b> Print the list, then <code>append</code> a new task and <code>remove</code> one of the originals, and print the list again so you can see the change.</li>\r\n<li><b>🔥 Stretch — summary.</b> Mark one task done by prefixing it with <code>\"[x] \"</code>, then print a summary line like <code>\"1 of 3 tasks done\"</code> by counting the tasks that <code>startswith(\"[x] \")</code>.</li>\r\n</ol>"}},{"t":{"vi":"Đồ án nhỏ: quản lý công việc (to-do)","en":"Mini project: to-do / task manager"},"html":{"vi":"<h3>Bài 10 — Đồ án nhỏ: trình quản lý công việc</h3>\r\n<p>Giờ bạn đã biết những viên gạch cốt lõi của Python: biến, chuỗi, điều kiện, list và vòng lặp. Từng cái một thì nhỏ — nhưng chương trình thật chỉ là những viên gạch ấy được <b>lắp ráp</b> để làm một việc hữu ích. Trong bài này bạn ngừng học từng mảnh và bắt đầu xây một thứ hoàn chỉnh: một <b>trình quản lý công việc</b> nhỏ, kiểu ứng dụng mà lập trình viên dựng lên suốt.</p>\r\n<p>Đây là bài <b>checkpoint</b>. Thay vì một ý tưởng mới, bạn sẽ kết hợp mọi thứ đã học, từng tính năng một: lưu công việc, thêm, liệt kê kèm ô đánh dấu, đánh dấu đã xong, xóa, và in bản tóm tắt. Mỗi bài tập xây một tính năng thật của ứng dụng — và đến cuối, chúng ghép lại thành một chương trình thật sự chạy được.</p>\r\n<p>Một trình quản lý công việc thật sẽ bọc phần này trong một vòng lặp menu đọc những gì người dùng gõ. Trong trình duyệt ta không đọc được nhập liệu trực tiếp, nên ở đây ta xây và kiểm tra phần <b>logic</b> — phần khó và quan trọng nhất — trên các list mà ta tự kiểm soát. Sau đó bài về nhà là bọc chính logic đó trong một vòng lặp menu thật trong VS Code.</p>\r\n\r\n<h4>1. Kế hoạch: ta đang xây gì</h4>\r\n<p>Trình quản lý công việc của ta giữ một <b>list các chuỗi công việc</b>. Một công việc là \"đã xong\" khi nó bắt đầu bằng nhãn <code>\"[x] \"</code> (bạn đã gặp ở Bài 9). Mọi việc ứng dụng làm đều là một trong vài thao tác đơn giản trên list đó.</p>\r\n<figure class=\"diagram\">\r\n<svg viewBox=\"0 0 380 210\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11\">\r\n  <defs>\r\n    <marker id=\"a10v\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\">\r\n      <path d=\"M0 0 L10 5 L0 10 z\" fill=\"#7FD1C0\"/>\r\n    </marker>\r\n  </defs>\r\n  <rect x=\"130\" y=\"14\" width=\"120\" height=\"34\" rx=\"7\" fill=\"#121C30\" stroke=\"#22304C\"/>\r\n  <text x=\"190\" y=\"35\" text-anchor=\"middle\" fill=\"#F5B942\">Hiện menu</text>\r\n  <rect x=\"130\" y=\"74\" width=\"120\" height=\"34\" rx=\"7\" fill=\"#121C30\" stroke=\"#22304C\"/>\r\n  <text x=\"190\" y=\"95\" text-anchor=\"middle\" fill=\"#E8E4D8\">Đọc lựa chọn</text>\r\n  <g fill=\"#121C30\" stroke=\"#22304C\">\r\n    <rect x=\"12\" y=\"134\" width=\"80\" height=\"32\" rx=\"7\"/>\r\n    <rect x=\"102\" y=\"134\" width=\"80\" height=\"32\" rx=\"7\"/>\r\n    <rect x=\"198\" y=\"134\" width=\"80\" height=\"32\" rx=\"7\"/>\r\n    <rect x=\"288\" y=\"134\" width=\"80\" height=\"32\" rx=\"7\"/>\r\n  </g>\r\n  <g fill=\"#E8E4D8\" text-anchor=\"middle\">\r\n    <text x=\"52\" y=\"154\">Thêm</text>\r\n    <text x=\"142\" y=\"154\">Liệt kê</text>\r\n    <text x=\"238\" y=\"154\">Xong</text>\r\n    <text x=\"328\" y=\"154\">Xóa</text>\r\n  </g>\r\n  <g stroke=\"#7FD1C0\" stroke-width=\"1.4\" marker-end=\"url(#a10v)\" fill=\"none\">\r\n    <line x1=\"190\" y1=\"48\" x2=\"190\" y2=\"72\"/>\r\n    <line x1=\"190\" y1=\"108\" x2=\"190\" y2=\"132\"/>\r\n  </g>\r\n  <path d=\"M288 150 C 360 150, 372 96, 372 60 C 372 30, 300 24, 252 24\" fill=\"none\" stroke=\"#22304C\" stroke-width=\"1.2\" stroke-dasharray=\"4 3\" marker-end=\"url(#a10v)\"/>\r\n  <text x=\"300\" y=\"196\" text-anchor=\"middle\" fill=\"#8FA0BC\">…mỗi thao tác chạy xong rồi quay lại menu</text>\r\n</svg>\r\n<figcaption>Hình dáng của gần như mọi app nhỏ: hiện lựa chọn → đọc lựa chọn → làm một thao tác → quay lại menu. Ta sẽ xây từng thao tác thành một mảnh logic riêng.</figcaption>\r\n</figure>\r\n<pre class=\"run\">tasks = [\"[x] Buy milk\", \"Call Anna\", \"Wash car\"]\r\n# \"[x] \" ở đầu nghĩa là đã xong. Không có nhãn nghĩa là còn phải làm.\r\nprint(tasks[0].startswith(\"[x] \"))   # True  -> đã xong\r\nprint(tasks[1].startswith(\"[x] \"))   # False -> còn phải làm</pre>\r\n\r\n<h4>2. Thêm công việc (và bỏ qua ô trống)</h4>\r\n<p>Khi người dùng thêm công việc, một app tốt sẽ <b>bỏ qua nhập liệu trống</b>. Ta dùng <code>.strip()</code> để cắt khoảng trắng và chỉ giữ những công việc còn chữ.</p>\r\n<pre class=\"run\">adds = [\"Buy milk\", \"   \", \"Call Anna\"]\r\ntasks = []\r\nfor a in adds:\r\n    if a.strip() != \"\":\r\n        tasks.append(a.strip())\r\nprint(tasks)   # ['Buy milk', 'Call Anna']</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 1.</b> Cho <code>adds = [\"Buy milk\", \"\", \"Call Anna\", \"  \", \"Wash car\"]</code>, dựng <code>tasks</code> bằng cách chỉ thêm các mục không rỗng (dùng <code>.strip()</code>). Kết quả <code>['Buy milk', 'Call Anna', 'Wash car']</code>.</span>\r\n<template class=\"st\">adds = [\"Buy milk\", \"\", \"Call Anna\", \"  \", \"Wash car\"]\r\ntasks = []\r\n# append only the non-empty tasks\r\n</template>\r\n<template class=\"ts\">assert tasks == [\"Buy milk\", \"Call Anna\", \"Wash car\"]\r\n</template></div>\r\n\r\n<h4>3. Liệt kê công việc kèm số và ô đánh dấu</h4>\r\n<p>Người dùng cần thấy danh sách. Ta hiện mỗi công việc kèm số thứ tự (<code>i + 1</code>) và một ô đánh dấu: <code>[x]</code> nếu đã xong, <code>[ ]</code> nếu chưa. Với công việc đã xong, ta cắt nhãn <code>\"[x] \"</code> khỏi tên cho gọn.</p>\r\n<pre class=\"run\">tasks = [\"[x] Buy milk\", \"Call Anna\"]\r\nfor i in range(len(tasks)):\r\n    t = tasks[i]\r\n    if t.startswith(\"[x] \"):\r\n        print(f\"{i + 1}. [x] {t[4:]}\")\r\n    else:\r\n        print(f\"{i + 1}. [ ] {t}\")\r\n# 1. [x] Buy milk\r\n# 2. [ ] Call Anna</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 2.</b> Cho <code>tasks = [\"[x] Buy milk\", \"Call Anna\", \"Wash car\"]</code>, dựng list <code>lines</code> gồm các chuỗi hiển thị: công việc đã xong dạng <code>\"N. [x] name\"</code> (đã cắt nhãn) và các mục khác dạng <code>\"N. [ ] name\"</code> → <code>['1. [x] Buy milk', '2. [ ] Call Anna', '3. [ ] Wash car']</code>.</span>\r\n<template class=\"st\">tasks = [\"[x] Buy milk\", \"Call Anna\", \"Wash car\"]\r\nlines = []\r\n# build each display line with a number and a checkbox\r\n</template>\r\n<template class=\"ts\">assert lines == [\"1. [x] Buy milk\", \"2. [ ] Call Anna\", \"3. [ ] Wash car\"]\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 3.</b> Với cùng <code>tasks</code>, <b>in</b> danh sách có số và ô đánh dấu (mỗi dòng một công việc, đúng như ví dụ trên). Kiểm tra phần in ra.</span>\r\n<template class=\"st\">tasks = [\"[x] Buy milk\", \"Call Anna\", \"Wash car\"]\r\n# print each task as \"N. [x] name\" or \"N. [ ] name\"\r\n</template>\r\n<template class=\"ts\">assert _OUT_.strip() == \"1. [x] Buy milk\\n2. [ ] Call Anna\\n3. [ ] Wash car\"\r\n</template></div>\r\n\r\n<h4>4. Đánh dấu công việc đã xong</h4>\r\n<p>Để đánh dấu công việc số <code>n</code> đã xong, gắn nhãn <code>\"[x] \"</code> vào phía trước — nhưng chỉ khi nó chưa xong, để không bao giờ bị <code>\"[x] [x] \"</code>.</p>\r\n<pre class=\"run\">tasks = [\"Buy milk\", \"Call Anna\"]\r\nn = 1                       # đánh dấu công việc thứ 1 (index n-1 = 0)\r\nif not tasks[n - 1].startswith(\"[x] \"):\r\n    tasks[n - 1] = \"[x] \" + tasks[n - 1]\r\nprint(tasks)   # ['[x] Buy milk', 'Call Anna']</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 4.</b> Cho <code>tasks = [\"Buy milk\", \"Call Anna\", \"Wash car\"]</code> và <code>n = 2</code>, đánh dấu công việc số <code>n</code> đã xong bằng cách thêm <code>\"[x] \"</code> vào trước (chỉ khi chưa xong). Kết quả <code>['Buy milk', '[x] Call Anna', 'Wash car']</code>.</span>\r\n<template class=\"st\">tasks = [\"Buy milk\", \"Call Anna\", \"Wash car\"]\r\nn = 2\r\n# mark task number n as done\r\n</template>\r\n<template class=\"ts\">assert tasks == [\"Buy milk\", \"[x] Call Anna\", \"Wash car\"]\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 5.</b> Cho <code>task = \"[x] Buy milk\"</code>, <b>đảo</b> nó vào <code>toggled</code>: nếu bắt đầu bằng <code>\"[x] \"</code> thì bỏ nhãn đó, ngược lại thì thêm vào. Ở đây kết quả là <code>\"Buy milk\"</code>.</span>\r\n<template class=\"st\">task = \"[x] Buy milk\"\r\ntoggled = \"\"\r\n# toggle the done tag\r\n</template>\r\n<template class=\"ts\">assert toggled == \"Buy milk\"\r\n</template></div>\r\n\r\n<h4>5. Xóa một công việc</h4>\r\n<p>Để xóa công việc số <code>n</code>, bỏ phần tử ở index <code>n - 1</code>. <code>list.pop(index)</code> làm đúng việc đó.</p>\r\n<pre class=\"run\">tasks = [\"Buy milk\", \"Call Anna\", \"Wash car\"]\r\nn = 2\r\ntasks.pop(n - 1)           # xóa công việc thứ 2\r\nprint(tasks)   # ['Buy milk', 'Wash car']</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 6.</b> Cho <code>tasks = [\"Buy milk\", \"Call Anna\", \"Wash car\"]</code> và <code>n = 3</code>, xóa công việc số <code>n</code>. Kết quả <code>['Buy milk', 'Call Anna']</code>.</span>\r\n<template class=\"st\">tasks = [\"Buy milk\", \"Call Anna\", \"Wash car\"]\r\nn = 3\r\n# remove task number n\r\n</template>\r\n<template class=\"ts\">assert tasks == [\"Buy milk\", \"Call Anna\"]\r\n</template></div>\r\n\r\n<h4>6. Lọc: việc nào còn phải làm</h4>\r\n<p>Một góc nhìn hữu ích là \"chỉ những việc tôi còn phải làm\" — những việc <b>không</b> bắt đầu bằng <code>\"[x] \"</code>.</p>\r\n<pre class=\"run\">tasks = [\"[x] Buy milk\", \"Call Anna\", \"[x] Wash car\", \"Pay bills\"]\r\npending = []\r\nfor t in tasks:\r\n    if not t.startswith(\"[x] \"):\r\n        pending.append(t)\r\nprint(pending)   # ['Call Anna', 'Pay bills']</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 7.</b> Cho <code>tasks = [\"[x] Buy milk\", \"Call Anna\", \"[x] Wash car\", \"Pay bills\"]</code>, dựng <code>pending</code> = những việc chưa xong → <code>['Call Anna', 'Pay bills']</code>.</span>\r\n<template class=\"st\">tasks = [\"[x] Buy milk\", \"Call Anna\", \"[x] Wash car\", \"Pay bills\"]\r\npending = []\r\n# collect the tasks that are not done\r\n</template>\r\n<template class=\"ts\">assert pending == [\"Call Anna\", \"Pay bills\"]\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 8.</b> Với cùng <code>tasks</code>, đếm bao nhiêu việc <b>đã xong</b> vào <code>done_count</code>. Kết quả <code>2</code>.</span>\r\n<template class=\"st\">tasks = [\"[x] Buy milk\", \"Call Anna\", \"[x] Wash car\", \"Pay bills\"]\r\ndone_count = 0\r\n# count the done tasks\r\n</template>\r\n<template class=\"ts\">assert done_count == 2\r\n</template></div>\r\n\r\n<h4>7. Bản tóm tắt trạng thái</h4>\r\n<p>Cuối cùng, một dòng tóm tắt để app hiện ở đầu: tổng số, số đã xong, số còn lại, cùng mức hoàn thành theo phần trăm.</p>\r\n<pre class=\"run\">tasks = [\"[x] Buy milk\", \"Call Anna\", \"[x] Wash car\"]\r\ntotal = len(tasks)\r\ndone = 0\r\nfor t in tasks:\r\n    if t.startswith(\"[x] \"):\r\n        done += 1\r\npercent = round(done / total * 100)\r\nprint(f\"{done}/{total} done ({percent}%)\")   # 2/3 done (67%)</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 9.</b> Cho <code>tasks = [\"[x] Buy milk\", \"Call Anna\", \"[x] Wash car\", \"Pay bills\"]</code>, dựng <code>summary</code> = <code>\"You have 4 tasks, 2 done, 2 pending\"</code> (dùng <code>len</code>, một vòng lặp và f-string).</span>\r\n<template class=\"st\">tasks = [\"[x] Buy milk\", \"Call Anna\", \"[x] Wash car\", \"Pay bills\"]\r\nsummary = \"\"\r\n# build the summary string\r\n</template>\r\n<template class=\"ts\">assert summary == \"You have 4 tasks, 2 done, 2 pending\"\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 10.</b> Cho <code>tasks = [\"[x] Buy milk\", \"Call Anna\", \"[x] Wash car\", \"Pay bills\"]</code>, tính <code>percent</code> hoàn thành là số nguyên: done ÷ total × 100, làm tròn. Ở đây <code>2 / 4 × 100 = 50</code>.</span>\r\n<template class=\"st\">tasks = [\"[x] Buy milk\", \"Call Anna\", \"[x] Wash car\", \"Pay bills\"]\r\npercent = 0\r\n# compute the completion percentage (rounded whole number)\r\n</template>\r\n<template class=\"ts\">assert percent == 50\r\n</template></div>\r\n<div class=\"ex stretch\" data-kind=\"py\"><span class=\"exq\"><b>🔥 Nâng cao (ghép tất cả lại).</b> Cho <code>tasks = [\"[x] Buy milk\", \"Call Anna\", \"[x] Wash car\"]</code>, dựng list <code>report</code>: dòng tiêu đề tóm tắt trước, rồi mỗi công việc một dòng có số và ô đánh dấu → <code>['Tasks: 3 | Done: 2 | Pending: 1', '1. [x] Buy milk', '2. [ ] Call Anna', '3. [x] Wash car']</code>.</span>\r\n<template class=\"st\">tasks = [\"[x] Buy milk\", \"Call Anna\", \"[x] Wash car\"]\r\nreport = []\r\n# 1) count done and pending, append the header line\r\n# 2) append one \"N. [x/ ] name\" line per task\r\n</template>\r\n<template class=\"ts\">assert report == [\"Tasks: 3 | Done: 2 | Pending: 1\", \"1. [x] Buy milk\", \"2. [ ] Call Anna\", \"3. [x] Wash car\"]\r\n</template></div>\r\n\r\n<div class=\"recap\">Tóm tắt bài 10: một app nhỏ chỉ là những thao tác đơn giản trên một cấu trúc dữ liệu — ở đây là <b>list các chuỗi công việc</b> · thêm (bỏ ô trống bằng <code>.strip()</code>) · liệt kê với <code>i + 1</code> và ô <code>[x]</code>/<code>[ ]</code> · đánh dấu xong bằng cách thêm nhãn <code>\"[x] \"</code> (chỉ một lần) · xóa bằng <code>pop(n - 1)</code> · lọc và đếm bằng vòng lặp và <code>startswith</code> · tóm tắt bằng f-string và <code>round</code>. Bạn vừa xây logic của một chương trình thật. Bài sau: <b>dictionary</b>, cách gọn gàng hơn để lưu dữ liệu có nhãn như tên, trạng thái và độ ưu tiên của mỗi công việc cùng nhau.</div>\r\n\r\n<h4>🏠 Bài tập về nhà</h4>\r\n<p>Làm trong <b>VS Code</b> trên máy bạn. Tạo <code>tasks.py</code> và biến logic ở trên thành một chương trình dùng được thật. Chạy bằng nút ▶ Run hoặc <code>python tasks.py</code>. <b>Khi xong, gửi cho tôi file <code>tasks.py</code> và một ảnh chụp màn hình lúc nó chạy</b> để tôi xem và góp ý.</p>\r\n<ol class=\"hw\">\r\n<li><b>Hiện danh sách.</b> Bắt đầu với một list 3–4 công việc (vài cái gắn nhãn <code>\"[x] \"</code>) và in chúng thành danh sách có số và ô đánh dấu, rồi in dòng tóm tắt (<code>\"You have N tasks, D done, P pending\"</code>).</li>\r\n<li><b>Vòng lặp menu.</b> Thêm vòng lặp <code>while True</code> in ra menu (1 thêm · 2 đánh dấu xong · 3 xóa · 4 thoát) và đọc lựa chọn bằng <code>choice = input(\"Choose: \")</code>. Khi chọn <code>\"4\"</code>, dùng <code>break</code> để thoát.</li>\r\n<li><b>Thêm & xong.</b> Cho lựa chọn 1 đọc công việc mới bằng <code>input()</code> và thêm vào (bỏ ô trống), lựa chọn 2 đọc một số và đánh dấu công việc đó đã xong. In lại danh sách sau mỗi thao tác.</li>\r\n<li><b>🔥 Nâng cao — xóa & hoàn thiện.</b> Cho lựa chọn 3 xóa công việc theo số, và xử lý nhập liệu sai một cách nhẹ nhàng (ví dụ số không tồn tại, hoặc chữ rỗng) để chương trình không bao giờ bị crash.</li>\r\n</ol>","en":"<h3>Lesson 10 — Mini project: a task manager</h3>\r\n<p>You now know the core building blocks of Python: variables, strings, conditions, lists, and loops. On their own each one is small — but real programs are just these blocks <b>assembled</b> to do something useful. In this lesson you stop learning pieces and start building a whole thing: a small <b>task manager</b>, the kind of app developers put together all the time.</p>\r\n<p>This is a <b>checkpoint</b> lesson. Instead of one new idea, you'll combine everything so far, one feature at a time: store tasks, add them, list them with checkboxes, mark them done, remove them, and print a summary. Each exercise builds one real feature of the app — and by the end they click together into a program that actually works.</p>\r\n<p>A real task manager would wrap this in a menu loop that reads what the user types. In the browser we can't read live input, so here we build and test the <b>logic</b> — the hard, important part — on lists we control. Then your homework is to wrap that exact logic in a real menu loop inside VS Code.</p>\r\n\r\n<h4>1. The plan: what we're building</h4>\r\n<p>Our task manager keeps a <b>list of task strings</b>. A task is \"done\" when it starts with the tag <code>\"[x] \"</code> (you met this in Lesson 9). Everything the app does is one of a few simple operations on that list.</p>\r\n<figure class=\"diagram\">\r\n<svg viewBox=\"0 0 380 210\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11\">\r\n  <defs>\r\n    <marker id=\"a10\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\">\r\n      <path d=\"M0 0 L10 5 L0 10 z\" fill=\"#7FD1C0\"/>\r\n    </marker>\r\n  </defs>\r\n  <rect x=\"130\" y=\"14\" width=\"120\" height=\"34\" rx=\"7\" fill=\"#121C30\" stroke=\"#22304C\"/>\r\n  <text x=\"190\" y=\"35\" text-anchor=\"middle\" fill=\"#F5B942\">Show the menu</text>\r\n  <rect x=\"130\" y=\"74\" width=\"120\" height=\"34\" rx=\"7\" fill=\"#121C30\" stroke=\"#22304C\"/>\r\n  <text x=\"190\" y=\"95\" text-anchor=\"middle\" fill=\"#E8E4D8\">Read a choice</text>\r\n  <g fill=\"#121C30\" stroke=\"#22304C\">\r\n    <rect x=\"12\" y=\"134\" width=\"80\" height=\"32\" rx=\"7\"/>\r\n    <rect x=\"102\" y=\"134\" width=\"80\" height=\"32\" rx=\"7\"/>\r\n    <rect x=\"198\" y=\"134\" width=\"80\" height=\"32\" rx=\"7\"/>\r\n    <rect x=\"288\" y=\"134\" width=\"80\" height=\"32\" rx=\"7\"/>\r\n  </g>\r\n  <g fill=\"#E8E4D8\" text-anchor=\"middle\">\r\n    <text x=\"52\" y=\"154\">Add</text>\r\n    <text x=\"142\" y=\"154\">List</text>\r\n    <text x=\"238\" y=\"154\">Done</text>\r\n    <text x=\"328\" y=\"154\">Remove</text>\r\n  </g>\r\n  <g stroke=\"#7FD1C0\" stroke-width=\"1.4\" marker-end=\"url(#a10)\" fill=\"none\">\r\n    <line x1=\"190\" y1=\"48\" x2=\"190\" y2=\"72\"/>\r\n    <line x1=\"190\" y1=\"108\" x2=\"190\" y2=\"132\"/>\r\n  </g>\r\n  <path d=\"M288 150 C 360 150, 372 96, 372 60 C 372 30, 300 24, 252 24\" fill=\"none\" stroke=\"#22304C\" stroke-width=\"1.2\" stroke-dasharray=\"4 3\" marker-end=\"url(#a10)\"/>\r\n  <text x=\"300\" y=\"196\" text-anchor=\"middle\" fill=\"#8FA0BC\">…each action runs, then back to the menu</text>\r\n</svg>\r\n<figcaption>The shape of almost every small app: show options → read a choice → do one operation → loop back. We'll build each operation as its own piece of logic.</figcaption>\r\n</figure>\r\n<pre class=\"run\">tasks = [\"[x] Buy milk\", \"Call Anna\", \"Wash car\"]\r\n# \"[x] \" in front means done. No tag means still to do.\r\nprint(tasks[0].startswith(\"[x] \"))   # True  -> done\r\nprint(tasks[1].startswith(\"[x] \"))   # False -> to do</pre>\r\n\r\n<h4>2. Adding tasks (and ignoring empty ones)</h4>\r\n<p>When a user adds a task, a good app <b>ignores blank input</b>. We use <code>.strip()</code> to remove spaces and only keep tasks that still have text.</p>\r\n<pre class=\"run\">adds = [\"Buy milk\", \"   \", \"Call Anna\"]\r\ntasks = []\r\nfor a in adds:\r\n    if a.strip() != \"\":\r\n        tasks.append(a.strip())\r\nprint(tasks)   # ['Buy milk', 'Call Anna']</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 1.</b> Given <code>adds = [\"Buy milk\", \"\", \"Call Anna\", \"  \", \"Wash car\"]</code>, build <code>tasks</code> by appending only the non-empty entries (use <code>.strip()</code>). Result <code>['Buy milk', 'Call Anna', 'Wash car']</code>.</span>\r\n<template class=\"st\">adds = [\"Buy milk\", \"\", \"Call Anna\", \"  \", \"Wash car\"]\r\ntasks = []\r\n# append only the non-empty tasks\r\n</template>\r\n<template class=\"ts\">assert tasks == [\"Buy milk\", \"Call Anna\", \"Wash car\"]\r\n</template></div>\r\n\r\n<h4>3. Listing tasks with numbers and checkboxes</h4>\r\n<p>The user needs to see the list. We show each task with its number (<code>i + 1</code>) and a checkbox: <code>[x]</code> if done, <code>[ ]</code> if not. For a done task we also strip the <code>\"[x] \"</code> tag off the name so it reads cleanly.</p>\r\n<pre class=\"run\">tasks = [\"[x] Buy milk\", \"Call Anna\"]\r\nfor i in range(len(tasks)):\r\n    t = tasks[i]\r\n    if t.startswith(\"[x] \"):\r\n        print(f\"{i + 1}. [x] {t[4:]}\")\r\n    else:\r\n        print(f\"{i + 1}. [ ] {t}\")\r\n# 1. [x] Buy milk\r\n# 2. [ ] Call Anna</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 2.</b> Given <code>tasks = [\"[x] Buy milk\", \"Call Anna\", \"Wash car\"]</code>, build a list <code>lines</code> of display strings: done tasks as <code>\"N. [x] name\"</code> (tag removed) and others as <code>\"N. [ ] name\"</code> → <code>['1. [x] Buy milk', '2. [ ] Call Anna', '3. [ ] Wash car']</code>.</span>\r\n<template class=\"st\">tasks = [\"[x] Buy milk\", \"Call Anna\", \"Wash car\"]\r\nlines = []\r\n# build each display line with a number and a checkbox\r\n</template>\r\n<template class=\"ts\">assert lines == [\"1. [x] Buy milk\", \"2. [ ] Call Anna\", \"3. [ ] Wash car\"]\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 3.</b> Given the same <code>tasks</code>, <b>print</b> the numbered checkbox list (one line each, exactly like the example above). Check the printed output.</span>\r\n<template class=\"st\">tasks = [\"[x] Buy milk\", \"Call Anna\", \"Wash car\"]\r\n# print each task as \"N. [x] name\" or \"N. [ ] name\"\r\n</template>\r\n<template class=\"ts\">assert _OUT_.strip() == \"1. [x] Buy milk\\n2. [ ] Call Anna\\n3. [ ] Wash car\"\r\n</template></div>\r\n\r\n<h4>4. Marking a task done</h4>\r\n<p>To mark task number <code>n</code> done, put the <code>\"[x] \"</code> tag in front of it — but only if it isn't already done, so we never end up with <code>\"[x] [x] \"</code>.</p>\r\n<pre class=\"run\">tasks = [\"Buy milk\", \"Call Anna\"]\r\nn = 1                       # mark the 1st task (index n-1 = 0)\r\nif not tasks[n - 1].startswith(\"[x] \"):\r\n    tasks[n - 1] = \"[x] \" + tasks[n - 1]\r\nprint(tasks)   # ['[x] Buy milk', 'Call Anna']</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 4.</b> Given <code>tasks = [\"Buy milk\", \"Call Anna\", \"Wash car\"]</code> and <code>n = 2</code>, mark task number <code>n</code> done by adding <code>\"[x] \"</code> in front (only if not already done). Result <code>['Buy milk', '[x] Call Anna', 'Wash car']</code>.</span>\r\n<template class=\"st\">tasks = [\"Buy milk\", \"Call Anna\", \"Wash car\"]\r\nn = 2\r\n# mark task number n as done\r\n</template>\r\n<template class=\"ts\">assert tasks == [\"Buy milk\", \"[x] Call Anna\", \"Wash car\"]\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 5.</b> Given <code>task = \"[x] Buy milk\"</code>, <b>toggle</b> it into <code>toggled</code>: if it starts with <code>\"[x] \"</code> remove that tag, otherwise add it. Here it should become <code>\"Buy milk\"</code>.</span>\r\n<template class=\"st\">task = \"[x] Buy milk\"\r\ntoggled = \"\"\r\n# toggle the done tag\r\n</template>\r\n<template class=\"ts\">assert toggled == \"Buy milk\"\r\n</template></div>\r\n\r\n<h4>5. Removing a task</h4>\r\n<p>To delete task number <code>n</code>, remove the item at index <code>n - 1</code>. <code>list.pop(index)</code> does exactly that.</p>\r\n<pre class=\"run\">tasks = [\"Buy milk\", \"Call Anna\", \"Wash car\"]\r\nn = 2\r\ntasks.pop(n - 1)           # remove the 2nd task\r\nprint(tasks)   # ['Buy milk', 'Wash car']</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 6.</b> Given <code>tasks = [\"Buy milk\", \"Call Anna\", \"Wash car\"]</code> and <code>n = 3</code>, remove task number <code>n</code>. Result <code>['Buy milk', 'Call Anna']</code>.</span>\r\n<template class=\"st\">tasks = [\"Buy milk\", \"Call Anna\", \"Wash car\"]\r\nn = 3\r\n# remove task number n\r\n</template>\r\n<template class=\"ts\">assert tasks == [\"Buy milk\", \"Call Anna\"]\r\n</template></div>\r\n\r\n<h4>6. Filtering: what's still to do</h4>\r\n<p>A useful view is \"only the tasks I still have to do\" — the ones <b>not</b> starting with <code>\"[x] \"</code>.</p>\r\n<pre class=\"run\">tasks = [\"[x] Buy milk\", \"Call Anna\", \"[x] Wash car\", \"Pay bills\"]\r\npending = []\r\nfor t in tasks:\r\n    if not t.startswith(\"[x] \"):\r\n        pending.append(t)\r\nprint(pending)   # ['Call Anna', 'Pay bills']</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 7.</b> Given <code>tasks = [\"[x] Buy milk\", \"Call Anna\", \"[x] Wash car\", \"Pay bills\"]</code>, build <code>pending</code> = the tasks not yet done → <code>['Call Anna', 'Pay bills']</code>.</span>\r\n<template class=\"st\">tasks = [\"[x] Buy milk\", \"Call Anna\", \"[x] Wash car\", \"Pay bills\"]\r\npending = []\r\n# collect the tasks that are not done\r\n</template>\r\n<template class=\"ts\">assert pending == [\"Call Anna\", \"Pay bills\"]\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 8.</b> Given the same <code>tasks</code>, count how many are <b>done</b> into <code>done_count</code>. Result <code>2</code>.</span>\r\n<template class=\"st\">tasks = [\"[x] Buy milk\", \"Call Anna\", \"[x] Wash car\", \"Pay bills\"]\r\ndone_count = 0\r\n# count the done tasks\r\n</template>\r\n<template class=\"ts\">assert done_count == 2\r\n</template></div>\r\n\r\n<h4>7. A status summary</h4>\r\n<p>Finally, a one-line summary the app can show at the top: total, done, and pending counts, plus how far along you are as a percentage.</p>\r\n<pre class=\"run\">tasks = [\"[x] Buy milk\", \"Call Anna\", \"[x] Wash car\"]\r\ntotal = len(tasks)\r\ndone = 0\r\nfor t in tasks:\r\n    if t.startswith(\"[x] \"):\r\n        done += 1\r\npercent = round(done / total * 100)\r\nprint(f\"{done}/{total} done ({percent}%)\")   # 2/3 done (67%)</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 9.</b> Given <code>tasks = [\"[x] Buy milk\", \"Call Anna\", \"[x] Wash car\", \"Pay bills\"]</code>, build <code>summary</code> = <code>\"You have 4 tasks, 2 done, 2 pending\"</code> (use <code>len</code>, a loop, and an f-string).</span>\r\n<template class=\"st\">tasks = [\"[x] Buy milk\", \"Call Anna\", \"[x] Wash car\", \"Pay bills\"]\r\nsummary = \"\"\r\n# build the summary string\r\n</template>\r\n<template class=\"ts\">assert summary == \"You have 4 tasks, 2 done, 2 pending\"\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 10.</b> Given <code>tasks = [\"[x] Buy milk\", \"Call Anna\", \"[x] Wash car\", \"Pay bills\"]</code>, compute the completion <code>percent</code> as a whole number: done ÷ total × 100, rounded. Here <code>2 / 4 × 100 = 50</code>.</span>\r\n<template class=\"st\">tasks = [\"[x] Buy milk\", \"Call Anna\", \"[x] Wash car\", \"Pay bills\"]\r\npercent = 0\r\n# compute the completion percentage (rounded whole number)\r\n</template>\r\n<template class=\"ts\">assert percent == 50\r\n</template></div>\r\n<div class=\"ex stretch\" data-kind=\"py\"><span class=\"exq\"><b>🔥 Stretch (the whole thing).</b> Given <code>tasks = [\"[x] Buy milk\", \"Call Anna\", \"[x] Wash car\"]</code>, build a <code>report</code> list: a summary header first, then one numbered checkbox line per task → <code>['Tasks: 3 | Done: 2 | Pending: 1', '1. [x] Buy milk', '2. [ ] Call Anna', '3. [x] Wash car']</code>.</span>\r\n<template class=\"st\">tasks = [\"[x] Buy milk\", \"Call Anna\", \"[x] Wash car\"]\r\nreport = []\r\n# 1) count done and pending, append the header line\r\n# 2) append one \"N. [x/ ] name\" line per task\r\n</template>\r\n<template class=\"ts\">assert report == [\"Tasks: 3 | Done: 2 | Pending: 1\", \"1. [x] Buy milk\", \"2. [ ] Call Anna\", \"3. [x] Wash car\"]\r\n</template></div>\r\n\r\n<div class=\"recap\">Recap of lesson 10: a small app is just simple operations on one data structure — here a <b>list of task strings</b> · add (skip blanks with <code>.strip()</code>) · list with <code>i + 1</code> and a <code>[x]</code>/<code>[ ]</code> checkbox · mark done by adding the <code>\"[x] \"</code> tag (only once) · remove with <code>pop(n - 1)</code> · filter and count with a loop and <code>startswith</code> · summarise with an f-string and <code>round</code>. You just built the logic of a real program. Next: <b>dictionaries</b>, a cleaner way to store labelled data like each task's text, status and priority together.</div>\r\n\r\n<h4>🏠 Homework</h4>\r\n<p>Do this in <b>VS Code</b> on your computer. Create <code>tasks.py</code> and turn the logic above into a program you can actually use. Run it with the ▶ Run button or <code>python tasks.py</code>. <b>When you're done, send me your <code>tasks.py</code> and a screenshot of it running</b> so I can review your work.</p>\r\n<ol class=\"hw\">\r\n<li><b>Show the list.</b> Start with a list of 3–4 tasks (some tagged <code>\"[x] \"</code>) and print them as a numbered checkbox list, then print the summary line (<code>\"You have N tasks, D done, P pending\"</code>).</li>\r\n<li><b>The menu loop.</b> Add a <code>while True</code> loop that prints a menu (1 add · 2 mark done · 3 remove · 4 quit) and reads the choice with <code>choice = input(\"Choose: \")</code>. On choice <code>\"4\"</code>, <code>break</code> out of the loop.</li>\r\n<li><b>Add & done.</b> Make option 1 read a new task with <code>input()</code> and append it (ignore blanks), and option 2 read a number and mark that task done. Re-print the list after each action.</li>\r\n<li><b>🔥 Stretch — remove & polish.</b> Make option 3 remove a task by number, and handle bad input gracefully (e.g. a number that doesn't exist, or empty text) so the program never crashes.</li>\r\n</ol>"}},{"t":{"vi":"Dictionary — dữ liệu có nhãn","en":"Dictionaries — labeled data"},"html":{"vi":"<h3>Bài 11 — Dictionary: dữ liệu có nhãn</h3>\r\n<p>List rất hợp khi thứ tự và vị trí quan trọng — việc 1, việc 2, việc 3. Nhưng rất thường xuyên bạn không muốn nhớ <i>vị trí</i>; bạn muốn tra cứu theo <b>tên</b>. Số điện thoại của Anna là gì? Giá của quyển sách này bao nhiêu? Từ \"error\" xuất hiện mấy lần? Với những câu hỏi như vậy, đếm ngón tay để lấy phần tử số 7 là sai công cụ.</p>\r\n<p>Câu trả lời của Python là <b>dictionary</b> (<code>dict</code>): một tập hợp ánh xạ một <b>khóa (key)</b> — cái nhãn — tới một <b>giá trị (value)</b> — dữ liệu. Thay vì <code>contacts[2]</code> bạn viết <code>contacts[\"Anna\"]</code>. Một dictionary giống như từ điển thật hay tấm danh thiếp: bạn tra một từ (khóa) để lấy nghĩa của nó (giá trị).</p>\r\n<p>Dictionary là một trong những công cụ được dùng nhiều nhất trong toàn bộ Python — cấu hình, hồ sơ, đếm số lượng, dữ liệu JSON từ web, và các trường của gần như mọi \"đối tượng\" (một người dùng, một sản phẩm, một công việc) đều là dictionary. Nắm vững nó và một lượng lớn code thật bỗng trở nên dễ hiểu.</p>\r\n\r\n<h4>1. Tạo và đọc một dictionary</h4>\r\n<p>Bạn viết một dict bằng dấu ngoặc nhọn <code>{}</code> và các cặp <code>key: value</code>. Bạn đọc một giá trị bằng cách đặt khóa của nó trong ngoặc vuông.</p>\r\n<pre class=\"run\">person = {\"name\": \"Anna\", \"age\": 30, \"city\": \"Hanoi\"}\r\nprint(person[\"name\"])   # Anna\r\nprint(person[\"age\"])    # 30</pre>\r\n<figure class=\"diagram\">\r\n<svg viewBox=\"0 0 320 176\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"IBM Plex Mono, monospace\" font-size=\"12\">\r\n  <text x=\"160\" y=\"18\" text-anchor=\"middle\" fill=\"#8FA0BC\">person — một dictionary (key → value)</text>\r\n  <g stroke=\"#22304C\">\r\n    <rect x=\"26\" y=\"34\" width=\"96\" height=\"30\" rx=\"5\" fill=\"#0E1626\"/>\r\n    <rect x=\"26\" y=\"72\" width=\"96\" height=\"30\" rx=\"5\" fill=\"#0E1626\"/>\r\n    <rect x=\"26\" y=\"110\" width=\"96\" height=\"30\" rx=\"5\" fill=\"#0E1626\"/>\r\n    <rect x=\"196\" y=\"34\" width=\"98\" height=\"30\" rx=\"5\" fill=\"#121C30\"/>\r\n    <rect x=\"196\" y=\"72\" width=\"98\" height=\"30\" rx=\"5\" fill=\"#121C30\"/>\r\n    <rect x=\"196\" y=\"110\" width=\"98\" height=\"30\" rx=\"5\" fill=\"#121C30\"/>\r\n  </g>\r\n  <g fill=\"#7FD1C0\" text-anchor=\"middle\">\r\n    <text x=\"74\" y=\"54\">\"name\"</text><text x=\"74\" y=\"92\">\"age\"</text><text x=\"74\" y=\"130\">\"city\"</text>\r\n  </g>\r\n  <g fill=\"#E8E4D8\" text-anchor=\"middle\">\r\n    <text x=\"245\" y=\"54\">\"Anna\"</text><text x=\"245\" y=\"92\">30</text><text x=\"245\" y=\"130\">\"Hanoi\"</text>\r\n  </g>\r\n  <g stroke=\"#F5B942\" stroke-width=\"1.3\">\r\n    <line x1=\"122\" y1=\"49\" x2=\"194\" y2=\"49\"/><line x1=\"122\" y1=\"87\" x2=\"194\" y2=\"87\"/><line x1=\"122\" y1=\"125\" x2=\"194\" y2=\"125\"/>\r\n  </g>\r\n  <text x=\"158\" y=\"162\" text-anchor=\"middle\" fill=\"#F5B942\">person[\"age\"] → 30</text>\r\n</svg>\r\n<figcaption>Mỗi khóa trỏ tới một giá trị. Tra <code>person[\"age\"]</code> nhảy thẳng tới <code>30</code> — không cần số vị trí.</figcaption>\r\n</figure>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 1.</b> Tạo dictionary <code>person</code> với các khóa <code>\"name\"</code> → <code>\"Anna\"</code>, <code>\"age\"</code> → <code>30</code>, và <code>\"city\"</code> → <code>\"Hanoi\"</code>.</span>\r\n<template class=\"st\"># create the person dictionary\r\nperson = \r\n</template>\r\n<template class=\"ts\">assert person == {\"name\": \"Anna\", \"age\": 30, \"city\": \"Hanoi\"}\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 2.</b> Cho <code>person = {\"name\": \"Anna\", \"age\": 30, \"city\": \"Hanoi\"}</code>, đọc thành phố vào <code>c</code>. Kết quả <code>\"Hanoi\"</code>.</span>\r\n<template class=\"st\">person = {\"name\": \"Anna\", \"age\": 30, \"city\": \"Hanoi\"}\r\nc = \"\"\r\n# read the city\r\n</template>\r\n<template class=\"ts\">assert c == \"Hanoi\"\r\n</template></div>\r\n\r\n<h4>2. Thêm và cập nhật giá trị</h4>\r\n<p>Gán cho một khóa sẽ đặt giá trị của nó. Nếu khóa đã có thì nó được <b>cập nhật</b>; nếu là khóa mới thì cặp được <b>thêm vào</b>.</p>\r\n<pre class=\"run\">product = {\"name\": \"Book\", \"price\": 100}\r\nproduct[\"price\"] = 120        # cập nhật khóa đã có\r\nproduct[\"stock\"] = 5          # thêm khóa mới\r\nprint(product)   # {'name': 'Book', 'price': 120, 'stock': 5}</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 3.</b> Cho <code>product = {\"name\": \"Book\", \"price\": 100}</code>, đổi giá thành <code>120</code>. Kết quả <code>{'name': 'Book', 'price': 120}</code>.</span>\r\n<template class=\"st\">product = {\"name\": \"Book\", \"price\": 100}\r\n# update the price\r\n</template>\r\n<template class=\"ts\">assert product == {\"name\": \"Book\", \"price\": 120}\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 4.</b> Cho <code>product = {\"name\": \"Book\", \"price\": 120}</code>, thêm khóa mới <code>\"stock\"</code> với giá trị <code>5</code>. Kết quả <code>{'name': 'Book', 'price': 120, 'stock': 5}</code>.</span>\r\n<template class=\"st\">product = {\"name\": \"Book\", \"price\": 120}\r\n# add the stock key\r\n</template>\r\n<template class=\"ts\">assert product == {\"name\": \"Book\", \"price\": 120, \"stock\": 5}\r\n</template></div>\r\n\r\n<h4>3. Kiểm tra khóa an toàn</h4>\r\n<p>Đọc một khóa không tồn tại là một <b>lỗi</b>. Dùng <code>in</code> để kiểm tra trước, hoặc <code>.get(key, default)</code> để đọc an toàn với một giá trị dự phòng.</p>\r\n<pre class=\"run\">person = {\"name\": \"Anna\", \"age\": 30}\r\nprint(\"age\" in person)              # True\r\nprint(\"email\" in person)            # False\r\nprint(person.get(\"email\", \"N/A\"))   # N/A  (không crash)</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 5.</b> Cho <code>person = {\"name\": \"Anna\", \"age\": 30}</code>, gán <code>has_email</code> bằng việc <code>\"email\"</code> có phải là một khóa hay không. Kết quả <code>False</code>.</span>\r\n<template class=\"st\">person = {\"name\": \"Anna\", \"age\": 30}\r\nhas_email = None\r\n# is \"email\" a key?\r\n</template>\r\n<template class=\"ts\">assert has_email == False\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 6.</b> Cho <code>contact = {\"name\": \"Anna\", \"city\": \"Hanoi\"}</code>, đọc số điện thoại vào <code>phone</code> bằng <code>.get</code> với giá trị mặc định <code>\"unknown\"</code> (không có khóa phone). Kết quả <code>\"unknown\"</code>.</span>\r\n<template class=\"st\">contact = {\"name\": \"Anna\", \"city\": \"Hanoi\"}\r\nphone = \"\"\r\n# read phone safely with a default\r\n</template>\r\n<template class=\"ts\">assert phone == \"unknown\"\r\n</template></div>\r\n\r\n<h4>4. Duyệt qua một dictionary</h4>\r\n<p>Duyệt một dict cho bạn các <b>khóa</b>. Dùng <code>.values()</code> cho các giá trị và <code>.items()</code> để lấy cả khóa lẫn giá trị cùng lúc.</p>\r\n<pre class=\"run\">scores = {\"Anna\": 3, \"Ben\": 5, \"Cara\": 2}\r\ntotal = 0\r\nfor value in scores.values():\r\n    total += value\r\nprint(total)   # 10\r\n\r\nfor name, value in scores.items():\r\n    print(f\"{name}: {value}\")</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 7.</b> Cho <code>scores = {\"a\": 3, \"b\": 5, \"c\": 2}</code>, cộng tất cả giá trị vào <code>total</code>. Kết quả <code>10</code>.</span>\r\n<template class=\"st\">scores = {\"a\": 3, \"b\": 5, \"c\": 2}\r\ntotal = 0\r\n# sum the values\r\n</template>\r\n<template class=\"ts\">assert total == 10\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 8.</b> Cho <code>prices = {\"coffee\": 30, \"tea\": 25, \"cake\": 60}</code>, đếm bao nhiêu món giá <b>hơn 40</b> vào <code>expensive</code>. Kết quả <code>1</code>.</span>\r\n<template class=\"st\">prices = {\"coffee\": 30, \"tea\": 25, \"cake\": 60}\r\nexpensive = 0\r\n# count items priced over 40\r\n</template>\r\n<template class=\"ts\">assert expensive == 1\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 9.</b> Cho <code>menu = {\"coffee\": 30, \"tea\": 25}</code>, dựng list <code>lines</code> gồm các chuỗi <code>\"key: value\"</code> dùng <code>.items()</code> → <code>['coffee: 30', 'tea: 25']</code>.</span>\r\n<template class=\"st\">menu = {\"coffee\": 30, \"tea\": 25}\r\nlines = []\r\n# build \"key: value\" strings\r\n</template>\r\n<template class=\"ts\">assert lines == [\"coffee: 30\", \"tea: 25\"]\r\n</template></div>\r\n\r\n<h4>5. Mẫu đếm số lượng</h4>\r\n<p>Một trong những mẹo dictionary hữu ích nhất: <b>đếm</b>. Duyệt một list, và với mỗi phần tử cộng 1 vào mục của nó — dùng <code>.get(item, 0)</code> để một phần tử hoàn toàn mới bắt đầu từ 0.</p>\r\n<pre class=\"run\">words = [\"red\", \"blue\", \"red\", \"green\", \"red\"]\r\ncounts = {}\r\nfor w in words:\r\n    counts[w] = counts.get(w, 0) + 1\r\nprint(counts)   # {'red': 3, 'blue': 1, 'green': 1}</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 10.</b> Cho <code>items = [\"a\", \"b\", \"a\", \"c\", \"a\", \"b\"]</code>, dựng dictionary <code>counts</code> đếm mỗi phần tử xuất hiện bao nhiêu lần → <code>{'a': 3, 'b': 2, 'c': 1}</code>.</span>\r\n<template class=\"st\">items = [\"a\", \"b\", \"a\", \"c\", \"a\", \"b\"]\r\ncounts = {}\r\n# count each item\r\n</template>\r\n<template class=\"ts\">assert counts == {\"a\": 3, \"b\": 2, \"c\": 1}\r\n</template></div>\r\n<div class=\"ex stretch\" data-kind=\"py\"><span class=\"exq\"><b>🔥 Nâng cao (tần suất từ).</b> Cho câu <code>text = \"red blue red green blue red\"</code>, tách thành các từ và dựng dictionary <code>counts</code> từ → số lần → <code>{'red': 3, 'blue': 2, 'green': 1}</code>. (Dùng <code>text.split()</code>.)</span>\r\n<template class=\"st\">text = \"red blue red green blue red\"\r\ncounts = {}\r\n# split into words and count each\r\n</template>\r\n<template class=\"ts\">assert counts == {\"red\": 3, \"blue\": 2, \"green\": 1}\r\n</template></div>\r\n\r\n<div class=\"recap\">Tóm tắt bài 11: một <b>dictionary</b> ánh xạ <b>khóa</b> tới <b>giá trị</b> — tra theo nhãn, không theo vị trí · tạo bằng <code>{\"k\": v}</code>, đọc bằng <code>d[\"k\"]</code> · gán để thêm hoặc cập nhật · kiểm tra bằng <code>in</code> hoặc đọc an toàn bằng <code>.get(key, default)</code> · duyệt <code>.values()</code>, <code>.items()</code> · mẫu đếm <code>d[x] = d.get(x, 0) + 1</code>. Bài sau: <b>list các dictionary</b> — hình dáng của gần như mọi dữ liệu thực tế (một bảng bản ghi).</div>\r\n\r\n<h4>🏠 Bài tập về nhà</h4>\r\n<p>Bốn bài tập được chấm điểm — làm ngay tại đây trước bài kế tiếp.</p>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Bài về nhà 1.</b> Cho <code>person = {\"name\": \"Anna\", \"age\": 30, \"city\": \"Hanoi\"}</code>, dựng chuỗi <code>line</code> = <code>\"Anna, 30, lives in Hanoi\"</code> dùng các giá trị.</span>\r\n<template class=\"st\">person = {\"name\": \"Anna\", \"age\": 30, \"city\": \"Hanoi\"}\r\nline = \"\"\r\n# build \"Anna, 30, lives in Hanoi\"\r\n</template>\r\n<template class=\"ts\">assert line == \"Anna, 30, lives in Hanoi\"\r\n</template></div>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Bài về nhà 2.</b> Cho <code>book = {\"Anna\": \"111\", \"Ben\": \"222\"}</code>, tra <code>\"Cara\"</code> vào <code>number</code> dùng <code>.get</code> với giá trị mặc định <code>\"not found\"</code>. Kết quả <code>\"not found\"</code>.</span>\r\n<template class=\"st\">book = {\"Anna\": \"111\", \"Ben\": \"222\"}\r\nnumber = \"\"\r\n# look up \"Cara\" safely\r\n</template>\r\n<template class=\"ts\">assert number == \"not found\"\r\n</template></div>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Bài về nhà 3.</b> Cho <code>letters = [\"a\", \"b\", \"a\", \"a\", \"c\"]</code>, dựng dictionary <code>counts</code> đếm mỗi chữ xuất hiện bao nhiêu lần → <code>{'a': 3, 'b': 1, 'c': 1}</code>.</span>\r\n<template class=\"st\">letters = [\"a\", \"b\", \"a\", \"a\", \"c\"]\r\ncounts = {}\r\n# count each letter\r\n</template>\r\n<template class=\"ts\">assert counts == {\"a\": 3, \"b\": 1, \"c\": 1}\r\n</template></div>\r\n<div class=\"ex homework stretch\" data-kind=\"py\"><span class=\"exq\"><b>🔥 Bài về nhà 4 (nâng cao).</b> Cho <code>words = [\"red\", \"blue\", \"red\", \"green\", \"red\", \"blue\"]</code>, đếm chúng và tìm từ xuất hiện nhiều nhất vào <code>top</code>. Kết quả <code>\"red\"</code>.</span>\r\n<template class=\"st\">words = [\"red\", \"blue\", \"red\", \"green\", \"red\", \"blue\"]\r\ntop = \"\"\r\n# count the words, then find the most frequent\r\n</template>\r\n<template class=\"ts\">assert top == \"red\"\r\n</template></div>","en":"<h3>Lesson 11 — Dictionaries: labelled data</h3>\r\n<p>A list is great when order and position matter — task 1, task 2, task 3. But very often you don't want to remember <i>positions</i>; you want to look things up by <b>name</b>. What's Anna's phone number? What's the price of this book? How many times did the word \"error\" appear? For questions like these, counting on your fingers to index number 7 is the wrong tool.</p>\r\n<p>Python's answer is the <b>dictionary</b> (<code>dict</code>): a collection that maps a <b>key</b> (the label) to a <b>value</b> (the data). Instead of <code>contacts[2]</code> you write <code>contacts[\"Anna\"]</code>. A dictionary is like a real dictionary or a contact card: you look up a word (the key) to get its meaning (the value).</p>\r\n<p>Dictionaries are one of the most used tools in all of Python — configuration, records, counts, JSON data from the web, and the fields of almost any \"thing\" (a user, a product, a task) are all dictionaries. Learn them well and a huge amount of real code suddenly makes sense.</p>\r\n\r\n<h4>1. Creating and reading a dictionary</h4>\r\n<p>You write a dict with curly braces <code>{}</code> and <code>key: value</code> pairs. You read a value by putting its key in square brackets.</p>\r\n<pre class=\"run\">person = {\"name\": \"Anna\", \"age\": 30, \"city\": \"Hanoi\"}\r\nprint(person[\"name\"])   # Anna\r\nprint(person[\"age\"])    # 30</pre>\r\n<figure class=\"diagram\">\r\n<svg viewBox=\"0 0 320 176\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"IBM Plex Mono, monospace\" font-size=\"12\">\r\n  <text x=\"160\" y=\"18\" text-anchor=\"middle\" fill=\"#8FA0BC\">person — a dictionary (key → value)</text>\r\n  <g stroke=\"#22304C\">\r\n    <rect x=\"26\" y=\"34\" width=\"96\" height=\"30\" rx=\"5\" fill=\"#0E1626\"/>\r\n    <rect x=\"26\" y=\"72\" width=\"96\" height=\"30\" rx=\"5\" fill=\"#0E1626\"/>\r\n    <rect x=\"26\" y=\"110\" width=\"96\" height=\"30\" rx=\"5\" fill=\"#0E1626\"/>\r\n    <rect x=\"196\" y=\"34\" width=\"98\" height=\"30\" rx=\"5\" fill=\"#121C30\"/>\r\n    <rect x=\"196\" y=\"72\" width=\"98\" height=\"30\" rx=\"5\" fill=\"#121C30\"/>\r\n    <rect x=\"196\" y=\"110\" width=\"98\" height=\"30\" rx=\"5\" fill=\"#121C30\"/>\r\n  </g>\r\n  <g fill=\"#7FD1C0\" text-anchor=\"middle\">\r\n    <text x=\"74\" y=\"54\">\"name\"</text><text x=\"74\" y=\"92\">\"age\"</text><text x=\"74\" y=\"130\">\"city\"</text>\r\n  </g>\r\n  <g fill=\"#E8E4D8\" text-anchor=\"middle\">\r\n    <text x=\"245\" y=\"54\">\"Anna\"</text><text x=\"245\" y=\"92\">30</text><text x=\"245\" y=\"130\">\"Hanoi\"</text>\r\n  </g>\r\n  <g stroke=\"#F5B942\" stroke-width=\"1.3\">\r\n    <line x1=\"122\" y1=\"49\" x2=\"194\" y2=\"49\"/><line x1=\"122\" y1=\"87\" x2=\"194\" y2=\"87\"/><line x1=\"122\" y1=\"125\" x2=\"194\" y2=\"125\"/>\r\n  </g>\r\n  <text x=\"158\" y=\"162\" text-anchor=\"middle\" fill=\"#F5B942\">person[\"age\"] → 30</text>\r\n</svg>\r\n<figcaption>Each key points to one value. Looking up <code>person[\"age\"]</code> jumps straight to <code>30</code> — no position numbers needed.</figcaption>\r\n</figure>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 1.</b> Create a dictionary <code>person</code> with keys <code>\"name\"</code> → <code>\"Anna\"</code>, <code>\"age\"</code> → <code>30</code>, and <code>\"city\"</code> → <code>\"Hanoi\"</code>.</span>\r\n<template class=\"st\"># create the person dictionary\r\nperson = \r\n</template>\r\n<template class=\"ts\">assert person == {\"name\": \"Anna\", \"age\": 30, \"city\": \"Hanoi\"}\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 2.</b> Given <code>person = {\"name\": \"Anna\", \"age\": 30, \"city\": \"Hanoi\"}</code>, read the city into <code>c</code>. Result <code>\"Hanoi\"</code>.</span>\r\n<template class=\"st\">person = {\"name\": \"Anna\", \"age\": 30, \"city\": \"Hanoi\"}\r\nc = \"\"\r\n# read the city\r\n</template>\r\n<template class=\"ts\">assert c == \"Hanoi\"\r\n</template></div>\r\n\r\n<h4>2. Adding and updating values</h4>\r\n<p>Assigning to a key sets its value. If the key already exists it's <b>updated</b>; if it's new the pair is <b>added</b>.</p>\r\n<pre class=\"run\">product = {\"name\": \"Book\", \"price\": 100}\r\nproduct[\"price\"] = 120        # update an existing key\r\nproduct[\"stock\"] = 5          # add a new key\r\nprint(product)   # {'name': 'Book', 'price': 120, 'stock': 5}</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 3.</b> Given <code>product = {\"name\": \"Book\", \"price\": 100}</code>, change the price to <code>120</code>. Result <code>{'name': 'Book', 'price': 120}</code>.</span>\r\n<template class=\"st\">product = {\"name\": \"Book\", \"price\": 100}\r\n# update the price\r\n</template>\r\n<template class=\"ts\">assert product == {\"name\": \"Book\", \"price\": 120}\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 4.</b> Given <code>product = {\"name\": \"Book\", \"price\": 120}</code>, add a new key <code>\"stock\"</code> with value <code>5</code>. Result <code>{'name': 'Book', 'price': 120, 'stock': 5}</code>.</span>\r\n<template class=\"st\">product = {\"name\": \"Book\", \"price\": 120}\r\n# add the stock key\r\n</template>\r\n<template class=\"ts\">assert product == {\"name\": \"Book\", \"price\": 120, \"stock\": 5}\r\n</template></div>\r\n\r\n<h4>3. Checking keys safely</h4>\r\n<p>Reading a key that doesn't exist is an <b>error</b>. Use <code>in</code> to check first, or <code>.get(key, default)</code> to read safely with a fallback value.</p>\r\n<pre class=\"run\">person = {\"name\": \"Anna\", \"age\": 30}\r\nprint(\"age\" in person)              # True\r\nprint(\"email\" in person)            # False\r\nprint(person.get(\"email\", \"N/A\"))   # N/A  (no crash)</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 5.</b> Given <code>person = {\"name\": \"Anna\", \"age\": 30}</code>, set <code>has_email</code> to whether <code>\"email\"</code> is a key. Result <code>False</code>.</span>\r\n<template class=\"st\">person = {\"name\": \"Anna\", \"age\": 30}\r\nhas_email = None\r\n# is \"email\" a key?\r\n</template>\r\n<template class=\"ts\">assert has_email == False\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 6.</b> Given <code>contact = {\"name\": \"Anna\", \"city\": \"Hanoi\"}</code>, read the phone into <code>phone</code> using <code>.get</code> with a default of <code>\"unknown\"</code> (there is no phone key). Result <code>\"unknown\"</code>.</span>\r\n<template class=\"st\">contact = {\"name\": \"Anna\", \"city\": \"Hanoi\"}\r\nphone = \"\"\r\n# read phone safely with a default\r\n</template>\r\n<template class=\"ts\">assert phone == \"unknown\"\r\n</template></div>\r\n\r\n<h4>4. Looping over a dictionary</h4>\r\n<p>Looping a dict gives you its <b>keys</b>. Use <code>.values()</code> for the values and <code>.items()</code> to get both key and value together.</p>\r\n<pre class=\"run\">scores = {\"Anna\": 3, \"Ben\": 5, \"Cara\": 2}\r\ntotal = 0\r\nfor value in scores.values():\r\n    total += value\r\nprint(total)   # 10\r\n\r\nfor name, value in scores.items():\r\n    print(f\"{name}: {value}\")</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 7.</b> Given <code>scores = {\"a\": 3, \"b\": 5, \"c\": 2}</code>, add up all the values into <code>total</code>. Result <code>10</code>.</span>\r\n<template class=\"st\">scores = {\"a\": 3, \"b\": 5, \"c\": 2}\r\ntotal = 0\r\n# sum the values\r\n</template>\r\n<template class=\"ts\">assert total == 10\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 8.</b> Given <code>prices = {\"coffee\": 30, \"tea\": 25, \"cake\": 60}</code>, count how many items cost <b>more than 40</b> into <code>expensive</code>. Result <code>1</code>.</span>\r\n<template class=\"st\">prices = {\"coffee\": 30, \"tea\": 25, \"cake\": 60}\r\nexpensive = 0\r\n# count items priced over 40\r\n</template>\r\n<template class=\"ts\">assert expensive == 1\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 9.</b> Given <code>menu = {\"coffee\": 30, \"tea\": 25}</code>, build a list <code>lines</code> of <code>\"key: value\"</code> strings using <code>.items()</code> → <code>['coffee: 30', 'tea: 25']</code>.</span>\r\n<template class=\"st\">menu = {\"coffee\": 30, \"tea\": 25}\r\nlines = []\r\n# build \"key: value\" strings\r\n</template>\r\n<template class=\"ts\">assert lines == [\"coffee: 30\", \"tea: 25\"]\r\n</template></div>\r\n\r\n<h4>5. The counting pattern</h4>\r\n<p>One of the most useful dictionary tricks: <b>counting</b>. Walk a list, and for each item add 1 to its entry — using <code>.get(item, 0)</code> so a brand-new item starts from 0.</p>\r\n<pre class=\"run\">words = [\"red\", \"blue\", \"red\", \"green\", \"red\"]\r\ncounts = {}\r\nfor w in words:\r\n    counts[w] = counts.get(w, 0) + 1\r\nprint(counts)   # {'red': 3, 'blue': 1, 'green': 1}</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 10.</b> Given <code>items = [\"a\", \"b\", \"a\", \"c\", \"a\", \"b\"]</code>, build a <code>counts</code> dictionary of how many times each appears → <code>{'a': 3, 'b': 2, 'c': 1}</code>.</span>\r\n<template class=\"st\">items = [\"a\", \"b\", \"a\", \"c\", \"a\", \"b\"]\r\ncounts = {}\r\n# count each item\r\n</template>\r\n<template class=\"ts\">assert counts == {\"a\": 3, \"b\": 2, \"c\": 1}\r\n</template></div>\r\n<div class=\"ex stretch\" data-kind=\"py\"><span class=\"exq\"><b>🔥 Stretch (word frequency).</b> Given the sentence <code>text = \"red blue red green blue red\"</code>, split it into words and build a <code>counts</code> dictionary of word → count → <code>{'red': 3, 'blue': 2, 'green': 1}</code>. (Use <code>text.split()</code>.)</span>\r\n<template class=\"st\">text = \"red blue red green blue red\"\r\ncounts = {}\r\n# split into words and count each\r\n</template>\r\n<template class=\"ts\">assert counts == {\"red\": 3, \"blue\": 2, \"green\": 1}\r\n</template></div>\r\n\r\n<div class=\"recap\">Recap of lesson 11: a <b>dictionary</b> maps <b>keys</b> to <b>values</b> — look up by label, not position · create with <code>{\"k\": v}</code>, read with <code>d[\"k\"]</code> · assign to add or update · check with <code>in</code> or read safely with <code>.get(key, default)</code> · loop <code>.values()</code>, <code>.items()</code> · the counting pattern <code>d[x] = d.get(x, 0) + 1</code>. Next: <b>lists of dictionaries</b> — the shape of almost all real-world data (a table of records).</div>\r\n\r\n<h4>🏠 Homework</h4>\r\n<p>Four graded exercises — do them right here before the next lesson.</p>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Homework 1.</b> Given <code>person = {\"name\": \"Anna\", \"age\": 30, \"city\": \"Hanoi\"}</code>, build the string <code>line</code> = <code>\"Anna, 30, lives in Hanoi\"</code> using the values.</span>\r\n<template class=\"st\">person = {\"name\": \"Anna\", \"age\": 30, \"city\": \"Hanoi\"}\r\nline = \"\"\r\n# build \"Anna, 30, lives in Hanoi\"\r\n</template>\r\n<template class=\"ts\">assert line == \"Anna, 30, lives in Hanoi\"\r\n</template></div>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Homework 2.</b> Given <code>book = {\"Anna\": \"111\", \"Ben\": \"222\"}</code>, look up <code>\"Cara\"</code> into <code>number</code> using <code>.get</code> with a default of <code>\"not found\"</code>. Result <code>\"not found\"</code>.</span>\r\n<template class=\"st\">book = {\"Anna\": \"111\", \"Ben\": \"222\"}\r\nnumber = \"\"\r\n# look up \"Cara\" safely\r\n</template>\r\n<template class=\"ts\">assert number == \"not found\"\r\n</template></div>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Homework 3.</b> Given <code>letters = [\"a\", \"b\", \"a\", \"a\", \"c\"]</code>, build a <code>counts</code> dictionary of how many times each letter appears → <code>{'a': 3, 'b': 1, 'c': 1}</code>.</span>\r\n<template class=\"st\">letters = [\"a\", \"b\", \"a\", \"a\", \"c\"]\r\ncounts = {}\r\n# count each letter\r\n</template>\r\n<template class=\"ts\">assert counts == {\"a\": 3, \"b\": 1, \"c\": 1}\r\n</template></div>\r\n<div class=\"ex homework stretch\" data-kind=\"py\"><span class=\"exq\"><b>🔥 Homework 4 (stretch).</b> Given <code>words = [\"red\", \"blue\", \"red\", \"green\", \"red\", \"blue\"]</code>, count them and find the word that appears the most into <code>top</code>. Result <code>\"red\"</code>.</span>\r\n<template class=\"st\">words = [\"red\", \"blue\", \"red\", \"green\", \"red\", \"blue\"]\r\ntop = \"\"\r\n# count the words, then find the most frequent\r\n</template>\r\n<template class=\"ts\">assert top == \"red\"\r\n</template></div>"}},{"t":{"vi":"List of dicts & dữ liệu lồng nhau","en":"Lists of dicts & nested data"},"html":{"vi":"<h3>Bài 12 — List các dictionary: dữ liệu thực tế</h3>\r\n<p>Một dictionary đơn mô tả <b>một</b> thứ: một người, một sản phẩm, một công việc. Nhưng chương trình thật xử lý <b>nhiều</b> thứ — một danh bạ, một giỏ hàng đầy sản phẩm, cả một danh sách việc cần làm. Hình dáng tự nhiên cho việc đó là <b>list các dictionary</b>: một tập hợp có thứ tự trong đó mỗi phần tử là một bản ghi có cùng các trường. Đây, đúng nghĩa đen, là một cái bảng — hàng và cột — và là cách gần như mọi dữ liệu thật xuất hiện, kể cả JSON từ web.</p>\r\n<p>Khi bạn duyệt được một list các dictionary, bạn làm được những việc mà mọi app và mọi công việc dữ liệu cần: liệt kê bản ghi, lọc chúng (\"chỉ người trưởng thành\", \"chỉ việc chưa xong\"), cộng dồn (\"tổng giá\"), và tìm cực trị (\"món đắt nhất\"). Vẫn là kỹ năng vòng lặp bạn đã có, nay chạm sâu thêm một tầng.</p>\r\n<p>Trong bài này bạn sẽ xây đúng những thao tác đó, và kết thúc bằng việc nâng cấp trình quản lý công việc: thay vì gắn nhãn chuỗi bằng <code>\"[x] \"</code>, mỗi công việc trở thành một dictionary gọn gàng với trường <code>name</code> và <code>done</code>.</p>\r\n\r\n<h4>1. Một list các bản ghi là một cái bảng</h4>\r\n<p>Để chạm tới một trường, bạn đi vào hai lần: trước hết chọn bản ghi theo vị trí, rồi chọn trường theo khóa.</p>\r\n<pre class=\"run\">products = [\r\n    {\"name\": \"Book\", \"price\": 100},\r\n    {\"name\": \"Pen\", \"price\": 20},\r\n]\r\nprint(products[0])            # {'name': 'Book', 'price': 100}  (cả một bản ghi)\r\nprint(products[0][\"name\"])    # Book                            (một trường)\r\nprint(products[1][\"price\"])   # 20</pre>\r\n<figure class=\"diagram\">\r\n<svg viewBox=\"0 0 340 170\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11\">\r\n  <text x=\"170\" y=\"16\" text-anchor=\"middle\" fill=\"#8FA0BC\">products — một list các dictionary (một bảng)</text>\r\n  <rect x=\"16\" y=\"28\" width=\"308\" height=\"120\" rx=\"10\" fill=\"none\" stroke=\"#22304C\" stroke-dasharray=\"4 3\"/>\r\n  <g stroke=\"#22304C\">\r\n    <rect x=\"34\" y=\"46\" width=\"130\" height=\"84\" rx=\"8\" fill=\"#121C30\"/>\r\n    <rect x=\"188\" y=\"46\" width=\"130\" height=\"84\" rx=\"8\" fill=\"#121C30\"/>\r\n  </g>\r\n  <g fill=\"#7FD1C0\" font-size=\"10\"><text x=\"42\" y=\"42\">[0]</text><text x=\"196\" y=\"42\">[1]</text></g>\r\n  <g font-size=\"11\">\r\n    <text x=\"48\" y=\"74\" fill=\"#7FD1C0\">\"name\"</text><text x=\"150\" y=\"74\" fill=\"#E8E4D8\" text-anchor=\"end\">\"Book\"</text>\r\n    <text x=\"48\" y=\"104\" fill=\"#7FD1C0\">\"price\"</text><text x=\"150\" y=\"104\" fill=\"#E8E4D8\" text-anchor=\"end\">100</text>\r\n    <text x=\"202\" y=\"74\" fill=\"#7FD1C0\">\"name\"</text><text x=\"304\" y=\"74\" fill=\"#E8E4D8\" text-anchor=\"end\">\"Pen\"</text>\r\n    <text x=\"202\" y=\"104\" fill=\"#7FD1C0\">\"price\"</text><text x=\"304\" y=\"104\" fill=\"#E8E4D8\" text-anchor=\"end\">20</text>\r\n  </g>\r\n</svg>\r\n<figcaption>Mỗi phần tử của list là một bản ghi (một dictionary). <code>products[1][\"price\"]</code> = đến bản ghi 1, rồi đọc <code>price</code> của nó → <code>20</code>.</figcaption>\r\n</figure>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 1.</b> Cho <code>products = [{\"name\": \"Book\", \"price\": 100}, {\"name\": \"Pen\", \"price\": 20}]</code>, đọc giá của sản phẩm thứ hai vào <code>p</code>. Kết quả <code>20</code>.</span>\r\n<template class=\"st\">products = [{\"name\": \"Book\", \"price\": 100}, {\"name\": \"Pen\", \"price\": 20}]\r\np = 0\r\n# read the second product's price\r\n</template>\r\n<template class=\"ts\">assert p == 20\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 2.</b> Với cùng <code>products</code>, dựng list <code>names</code> gồm tên của mọi sản phẩm → <code>['Book', 'Pen']</code>.</span>\r\n<template class=\"st\">products = [{\"name\": \"Book\", \"price\": 100}, {\"name\": \"Pen\", \"price\": 20}]\r\nnames = []\r\n# collect each product's name\r\n</template>\r\n<template class=\"ts\">assert names == [\"Book\", \"Pen\"]\r\n</template></div>\r\n\r\n<h4>2. Lọc bản ghi</h4>\r\n<p>Duyệt các bản ghi và giữ lại những cái vượt qua một điều kiện. Đây là cách mọi tính năng \"chỉ hiện…\" hoạt động.</p>\r\n<pre class=\"run\">people = [\r\n    {\"name\": \"A\", \"age\": 20},\r\n    {\"name\": \"B\", \"age\": 15},\r\n    {\"name\": \"C\", \"age\": 30},\r\n]\r\nadults = []\r\nfor person in people:\r\n    if person[\"age\"] >= 18:\r\n        adults.append(person[\"name\"])\r\nprint(adults)   # ['A', 'C']</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 3.</b> Cho <code>people = [{\"name\": \"A\", \"age\": 20}, {\"name\": \"B\", \"age\": 15}, {\"name\": \"C\", \"age\": 30}]</code>, dựng <code>adults</code> = tên những người từ <b>18 tuổi trở lên</b> → <code>['A', 'C']</code>.</span>\r\n<template class=\"st\">people = [{\"name\": \"A\", \"age\": 20}, {\"name\": \"B\", \"age\": 15}, {\"name\": \"C\", \"age\": 30}]\r\nadults = []\r\n# collect names of people 18+\r\n</template>\r\n<template class=\"ts\">assert adults == [\"A\", \"C\"]\r\n</template></div>\r\n\r\n<h4>3. Cộng dồn một trường</h4>\r\n<p>Để tính tổng một cột, duyệt các bản ghi và cộng một trường mỗi lần.</p>\r\n<pre class=\"run\">cart = [\r\n    {\"name\": \"Book\", \"price\": 100},\r\n    {\"name\": \"Pen\", \"price\": 20},\r\n    {\"name\": \"Cup\", \"price\": 50},\r\n]\r\ntotal = 0\r\nfor item in cart:\r\n    total += item[\"price\"]\r\nprint(total)   # 170</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 4.</b> Cho <code>cart = [{\"name\": \"Book\", \"price\": 100}, {\"name\": \"Pen\", \"price\": 20}, {\"name\": \"Cup\", \"price\": 50}]</code>, cộng tất cả giá vào <code>total</code>. Kết quả <code>170</code>.</span>\r\n<template class=\"st\">cart = [{\"name\": \"Book\", \"price\": 100}, {\"name\": \"Pen\", \"price\": 20}, {\"name\": \"Cup\", \"price\": 50}]\r\ntotal = 0\r\n# sum every price\r\n</template>\r\n<template class=\"ts\">assert total == 170\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 5.</b> Với cùng <code>cart</code>, đếm bao nhiêu món giá <b>hơn 40</b> vào <code>pricey</code>. Kết quả <code>2</code>.</span>\r\n<template class=\"st\">cart = [{\"name\": \"Book\", \"price\": 100}, {\"name\": \"Pen\", \"price\": 20}, {\"name\": \"Cup\", \"price\": 50}]\r\npricey = 0\r\n# count items priced over 40\r\n</template>\r\n<template class=\"ts\">assert pricey == 2\r\n</template></div>\r\n\r\n<h4>4. Tìm bản ghi cực trị</h4>\r\n<p>Để tìm cái lớn nhất (hoặc nhỏ nhất), giữ một \"tốt nhất tới hiện tại\" và cập nhật mỗi khi thấy cái tốt hơn. Bắt đầu bằng bản ghi đầu tiên.</p>\r\n<pre class=\"run\">cart = [{\"name\": \"Book\", \"price\": 100}, {\"name\": \"Pen\", \"price\": 20}, {\"name\": \"Cup\", \"price\": 50}]\r\nbest = cart[0]\r\nfor item in cart:\r\n    if item[\"price\"] > best[\"price\"]:\r\n        best = item\r\nprint(best[\"name\"])   # Book</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 6.</b> Cho <code>cart = [{\"name\": \"Book\", \"price\": 100}, {\"name\": \"Pen\", \"price\": 20}, {\"name\": \"Cup\", \"price\": 50}]</code>, tìm <b>tên</b> món đắt nhất vào <code>top_name</code>. Kết quả <code>\"Book\"</code>.</span>\r\n<template class=\"st\">cart = [{\"name\": \"Book\", \"price\": 100}, {\"name\": \"Pen\", \"price\": 20}, {\"name\": \"Cup\", \"price\": 50}]\r\ntop_name = \"\"\r\n# find the name of the priciest item\r\n</template>\r\n<template class=\"ts\">assert top_name == \"Book\"\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 7.</b> Cho <code>cart = [{\"name\": \"Book\", \"price\": 100}]</code>, thêm một bản ghi mới <code>{\"name\": \"Bag\", \"price\": 80}</code> vào cuối. Kết quả <code>[{'name': 'Book', 'price': 100}, {'name': 'Bag', 'price': 80}]</code>.</span>\r\n<template class=\"st\">cart = [{\"name\": \"Book\", \"price\": 100}]\r\n# append the new product record\r\n</template>\r\n<template class=\"ts\">assert cart == [{\"name\": \"Book\", \"price\": 100}, {\"name\": \"Bag\", \"price\": 80}]\r\n</template></div>\r\n\r\n<h4>5. Cập nhật một bản ghi trong list</h4>\r\n<p>Duyệt tới khi tìm được bản ghi bạn muốn, rồi đổi một trường của nó. Sửa bản ghi là sửa ngay tại chỗ trong list.</p>\r\n<pre class=\"run\">tasks = [\r\n    {\"name\": \"Buy milk\", \"done\": True},\r\n    {\"name\": \"Call Anna\", \"done\": False},\r\n]\r\nfor task in tasks:\r\n    if task[\"name\"] == \"Call Anna\":\r\n        task[\"done\"] = True\r\nprint(tasks[1])   # {'name': 'Call Anna', 'done': True}</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 8
