const COURSE={"id":"python","ls":"mk:python","title":{"vi":"Python căn bản","en":"Python Foundations"},"sub":{"vi":"20 buổi · mỗi buổi ~2 giờ (~40 giờ) · Bài 1 miễn phí. Python thật chạy trong trình duyệt (lần đầu tải ~10MB, hãy kiên nhẫn).","en":"20 lessons · ~2 hours each (~40h) · Lesson 1 free. Real Python runs in your browser (first load ~10MB, be patient)."},"lessons":[{"t":{"vi":"Giá trị, biến và print()","en":"Values, variables and print()"},"kind":"free","html":{"vi":"<h3>Bài 1 — Bắt đầu với Python: giá trị, biến và print()</h3>\r\n<p>Chào mừng bạn đến với bài học đầu tiên. Nếu bạn chưa từng viết một dòng code nào — <b>hoàn hảo</b>, bài này viết đúng cho bạn. Chúng ta sẽ đi thật chậm: hiểu lập trình là gì, Python là gì, rồi mới từ từ gõ những dòng code đầu tiên.</p>\r\n\r\n<h4>1. Lập trình là gì? Python là gì?</h4>\r\n<p><b>Lập trình</b> đơn giản là viết ra một danh sách <b>chỉ thị (lệnh)</b> để máy tính làm theo — giống như viết công thức nấu ăn: từng bước, rõ ràng, theo thứ tự. Máy tính rất nhanh và chính xác, nhưng nó <i>chỉ làm đúng những gì bạn bảo</i>, không tự đoán ý bạn. Học lập trình phần lớn là học cách <b>diễn đạt ý tưởng thật rõ ràng</b> để máy hiểu.</p>\r\n<p><b>Python</b> là một <b>ngôn ngữ lập trình</b> — bộ từ vựng và ngữ pháp để viết các chỉ thị đó. Người ta chọn Python để bắt đầu vì nó gần với tiếng Anh đời thường, ít ký hiệu rối rắm, và được dùng ở khắp nơi: web, phân tích dữ liệu, tự động hóa, trí tuệ nhân tạo… Viết <code>print(\"Xin chao\")</code> trong Python dễ đọc hơn hẳn so với nhiều ngôn ngữ khác.</p>\r\n<p>Trong khóa này bạn sẽ chạy Python <b>thật</b> — chính là Python mà lập trình viên chuyên nghiệp dùng — ngay trong trình duyệt, không phải cài đặt gì cả.</p>\r\n\r\n<h4>2. Cách học ở The Dojo</h4>\r\n<p>Mỗi khi gặp một ô có nền tối như bên dưới, đó là <b>chỗ bạn viết code</b>. Bên dưới ô đó có hai nút:</p>\r\n<ul>\r\n<li><b>Chạy (Run):</b> gửi code của bạn cho Python chạy thật. <i>Lần chạy đầu tiên</i> trình duyệt tải bộ máy Python (~10MB), có thể mất 10–30 giây — hãy kiên nhẫn; các lần sau chạy tức thì.</li>\r\n<li><b>Đặt lại (Reset):</b> đưa ô code về trạng thái ban đầu nếu bạn muốn làm lại từ đầu.</li>\r\n</ul>\r\n<p>Sau khi bấm Chạy, bạn sẽ thấy một khung kết quả gồm hai phần:</p>\r\n<ul>\r\n<li><b>Kết quả in ra (Output):</b> mọi thứ chương trình của bạn <i>in ra màn hình</i> sẽ hiện ở đây — giống như \"màn hình\" của chương trình. Khung này luôn hiện, dù bài làm đúng hay sai.</li>\r\n<li><b>Kết luận:</b> <span style=\"color:var(--jade)\">Đạt</span> nếu bài làm đúng, hoặc <span style=\"color:var(--ember)\">Chưa đạt</span> kèm một lời gợi ý cụ thể (ví dụ: biến nào sai, giá trị đang là gì và cần là gì).</li>\r\n</ul>\r\n<p>Bạn có thể sửa code và bấm Chạy lại bao nhiêu lần tùy thích — sai là chuyện bình thường và là cách học nhanh nhất.</p>\r\n\r\n<h4>3. Lệnh đầu tiên: <code>print()</code></h4>\r\n<p>Chương trình chạy các lệnh <b>lần lượt từ trên xuống dưới</b>. Lệnh đầu tiên và hay dùng nhất là <code>print()</code> — bảo máy <b>in (hiển thị) một thứ gì đó ra màn hình</b>.</p>\r\n<pre class=\"run\">print(\"Xin chao\")\r\nprint(\"Toi dang hoc Python\")</pre>\r\n<p>Hãy đọc dòng <code>print(\"Xin chao\")</code> theo từng phần:</p>\r\n<ul>\r\n<li><code>print</code> — tên của lệnh (in ra màn hình).</li>\r\n<li><code>( )</code> — cặp ngoặc tròn, bên trong đặt thứ bạn muốn in.</li>\r\n<li><code>\"Xin chao\"</code> — một đoạn <b>chữ</b>. Trong lập trình, chữ được gọi là <b>chuỗi (string)</b> và <u>bắt buộc đặt trong dấu nháy</u> <code>\"...\"</code>. Dấu nháy cho máy biết \"đây là chữ để in nguyên văn\", không phải một lệnh.</li>\r\n</ul>\r\n<p>Nếu quên dấu nháy — ví dụ <code>print(Xin chao)</code> — máy sẽ báo lỗi, vì nó tưởng <code>Xin</code> và <code>chao</code> là tên lệnh nào đó mà nó không biết.</p>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 1.</b> Dùng <code>print()</code> in ra đúng dòng chữ <code>Hello Dojo</code>. (Nhớ dấu nháy quanh đoạn chữ.)</span>\r\n<template class=\"st\"># Go lenh print cua ban o duoi day:\r\n</template>\r\n<template class=\"ts\">assert _OUT_.strip() == \"Hello Dojo\", \"phai in ra dung: Hello Dojo\"\r\n</template></div>\r\n<p><i>Lưu ý: bài tập này kiểm tra <b>thứ bạn in ra màn hình</b> (xem khung Kết quả in ra). Đa số bài sau kiểm tra <b>giá trị của biến</b> — ta sẽ học \"biến\" ngay bên dưới.</i></p>\r\n\r\n<h4>4. Chú thích với dấu <code>#</code></h4>\r\n<p>Bạn có để ý dòng <code># Go lenh print cua ban o duoi day:</code> ở bài tập trên không? Đó là một <b>chú thích (comment)</b>. Mọi thứ sau dấu <code>#</code> trên một dòng sẽ bị Python <b>bỏ qua hoàn toàn</b> — nó là ghi chú dành cho <i>con người đọc</i>, không phải lệnh cho máy chạy.</p>\r\n<pre># Day la chu thich — Python khong chay dong nay\r\nprint(\"Day moi la lenh duoc chay\")   # chu thich cung co the year cuoi dong</pre>\r\n<p>Chú thích dùng để giải thích code cho chính bạn (và người khác) đọc lại sau này. Trong các bài tập, chúng tôi thường để sẵn một dòng <code>#</code> gợi ý chỗ bạn cần viết.</p>\r\n\r\n<h4>5. Giá trị và kiểu dữ liệu</h4>\r\n<p>Mọi dữ liệu trong Python đều có một <b>kiểu</b>. Bốn kiểu nền tảng bạn gặp đầu tiên:</p>\r\n<pre>10          # so nguyen  -> int    (khong co phan thap phan)\r\n3.14        # so thuc    -> float  (co dau cham thap phan)\r\n\"xin chao\"  # chuoi      -> str    (chu trong dau nhay)\r\nTrue        # dung/sai   -> bool   (chi True hoac False)</pre>\r\n<p>Bạn có thể hỏi máy \"đây là kiểu gì?\" bằng lệnh <code>type()</code>:</p>\r\n<pre>print(type(10))       # &lt;class 'int'&gt;\r\nprint(type(3.14))     # &lt;class 'float'&gt;\r\nprint(type(\"hi\"))     # &lt;class 'str'&gt;\r\nprint(type(True))     # &lt;class 'bool'&gt;</pre>\r\n<p>Vì sao kiểu lại quan trọng? Vì máy <b>cư xử khác nhau</b> tùy kiểu: <code>3 + 4</code> ra <code>7</code> (cộng số), nhưng <code>\"3\" + \"4\"</code> ra <code>\"34\"</code> (nối chữ lại với nhau). Nhầm kiểu là một trong những lỗi phổ biến nhất của người mới.</p>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 2.</b> Tạo bốn biến: <code>a</code> = số nguyên 42, <code>b</code> = số thực 3.5, <code>c</code> = chuỗi <code>\"Python\"</code> (viết hoa chữ P), <code>d</code> = giá trị đúng/sai <code>True</code>.</span>\r\n<template class=\"st\"># tao 4 bien a, b, c, d\r\n</template>\r\n<template class=\"ts\">assert a == 42 and isinstance(a, int)\r\nassert b == 3.5 and isinstance(b, float)\r\nassert c == \"Python\" and isinstance(c, str)\r\nassert d is True\r\n</template></div>\r\n\r\n<h4>6. Biến — chiếc hộp có tên</h4>\r\n<p>Một <b>biến</b> là cái tên gắn với một giá trị, giúp bạn lưu lại để dùng sau. Dấu <code>=</code> nghĩa là <b>gán</b>: lấy giá trị bên phải, bỏ vào chiếc hộp có tên bên trái.</p>\r\n<pre>age = 15\r\nname = \"Minh\"\r\nprint(name, \"year nay\", age, \"age\")   # Minh year nay 15 age</pre>\r\n<p>Biến có thể <b>gán lại</b> — giá trị mới thay giá trị cũ:</p>\r\n<pre>score = 5\r\nscore = score + 3     # lay score cu (5) cong 3, cat lai vao score -> 8\r\nprint(score)          # 8</pre>\r\n<h4>Quy tắc đặt tên biến</h4>\r\n<ul>\r\n<li>Chỉ gồm chữ cái, chữ số và dấu gạch dưới <code>_</code>; <b>không</b> bắt đầu bằng chữ số.</li>\r\n<li>Không dấu tiếng Việt, không khoảng trắng. Dùng <code>gach_duoi</code> để nối từ: <code>quantity</code>, <code>user_name</code>.</li>\r\n<li>Phân biệt hoa–thường: <code>age</code> và <code>Tuoi</code> là hai biến khác nhau.</li>\r\n<li>Đặt tên <b>có nghĩa</b>: <code>price</code> tốt hơn <code>x</code>.</li>\r\n</ul>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 3.</b> Tạo biến <code>quantity</code> = 4 và <code>unit_price</code> = 25000. Tạo biến <code>subtotal</code> bằng tích của chúng (viết phép nhân <code>*</code>, đừng ghi sẵn kết quả).</span>\r\n<template class=\"st\">quantity = 4\r\nunit_price = 25000\r\n# tao subtotal = quantity nhan unit_price\r\n</template>\r\n<template class=\"ts\">assert subtotal == 100000\r\n</template></div>\r\n\r\n<h4>7. <code>print()</code> kỹ hơn</h4>\r\n<p><code>print()</code> có thể in nhiều thứ một lúc, cách nhau bằng dấu phẩy — máy tự chèn một khoảng trắng giữa chúng:</p>\r\n<pre>name = \"Minh\"\r\nprint(\"Xin chao,\", name)     # Xin chao, Minh</pre>\r\n<p>Bạn có thể đổi ký tự ngăn cách bằng <code>sep</code>, và ký tự kết thúc dòng bằng <code>end</code>:</p>\r\n<pre>print(\"2024\", \"09\", \"18\", sep=\"-\")   # 2024-09-18\r\nprint(\"Dang tai\", end=\"...\")          # khong xuong dong, in tiep \"...\"</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 4.</b> Cho <code>year = 2026</code>, <code>month = 9</code>, <code>day = 18</code>. Dùng <code>print()</code> với <code>sep</code> để in đúng chuỗi <code>2026/9/18</code>. (Lưu ý: đây là ba <i>biến số</i>, đừng đặt chúng trong dấu nháy.)</span>\r\n<template class=\"st\">year = 2026\r\nmonth = 9\r\nday = 18\r\n# in 2026/9/18 bang print(..., sep=...)\r\n</template>\r\n<template class=\"ts\">assert _OUT_.strip() == \"2026/9/18\", \"phai in ra 2026/9/18\"\r\n</template></div>\r\n\r\n<h4>8. Nhận dữ liệu từ người dùng — <code>input()</code></h4>\r\n<p>Hàm <code>input()</code> dừng chương trình lại, chờ người dùng gõ, rồi trả về thứ họ gõ. <b>Điều cực kỳ quan trọng:</b> <code>input()</code> <u>luôn trả về một chuỗi (str)</u>, kể cả khi người ta gõ số.</p>\r\n<pre>name = input(\"Ten ban la gi? \")\r\nprint(\"Chao\", name)\r\n\r\nage_str = input(\"Tuoi cua ban? \")   # vi du go \"15\" -> age_str = \"15\" (chuoi!)\r\nprint(type(age_str))                 # &lt;class 'str'&gt;</pre>\r\n<p>Vì kết quả là chuỗi, muốn tính toán bạn phải <b>ép kiểu</b> sang số trước.</p>\r\n\r\n<h4>9. Ép kiểu (type conversion)</h4>\r\n<pre>int(\"15\")     # 15   (chuoi -> so nguyen)\r\nfloat(\"3.5\")  # 3.5  (chuoi -> so thuc)\r\nstr(15)       # \"15\" (so -> chuoi)</pre>\r\n<p>Đây là lý do dòng dưới bị lỗi logic kinh điển: nối hai chuỗi thay vì cộng hai số.</p>\r\n<pre>a = input(\"So a: \")   # \"7\"\r\nb = input(\"So b: \")   # \"3\"\r\nprint(a + b)          # \"73\"  (SAI! noi chuoi)\r\nprint(int(a) + int(b))# 10    (DUNG, ep sang int truoc)</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 5.</b> Cho hai chuỗi <code>a = \"7\"</code> và <code>b = \"3\"</code> (giả lập kết quả của <code>input()</code>). Tạo biến <code>total</code> = tổng <i>số học</i> của chúng (kết quả phải là <code>10</code>, không phải <code>\"73\"</code>).</span>\r\n<template class=\"st\">a = \"7\"\r\nb = \"3\"\r\n# tao total = total so hoc cua a va b\r\n</template>\r\n<template class=\"ts\">assert total == 10, \"nho ep kieu int() truoc khi cong\"\r\n</template></div>\r\n\r\n<h4>10. Tính toán — các phép toán số học</h4>\r\n<pre>7 + 3     # 10   cong\r\n7 - 3     # 4    tru\r\n7 * 3     # 21   nhan\r\n7 / 2     # 3.5  chia (LUON ra float)\r\n7 // 2    # 3    chia lay phan nguyen\r\n7 % 2     # 1    chia lay so du (modulo)\r\n2 ** 10   # 1024 luy thua (2 mu 10)</pre>\r\n<p>Hai phép <code>//</code> và <code>%</code> rất hay dùng: <code>//</code> cho biết \"chia được bao nhiêu lần trọn vẹn\", <code>%</code> cho biết \"còn dư bao nhiêu\". Ví dụ đổi 100 phút ra giờ:phút → <code>100 // 60 = 1</code> giờ, <code>100 % 60 = 40</code> phút.</p>\r\n<p>Thứ tự ưu tiên giống toán học: <code>**</code> trước, rồi <code>* / // %</code>, rồi <code>+ -</code>. Dùng ngoặc <code>( )</code> khi muốn ép thứ tự:</p>\r\n<pre>2 + 3 * 4       # 14  (nhan truoc)\r\n(2 + 3) * 4     # 20  (ngoac truoc)</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 6.</b> Cho <code>total_minutes = 100</code>. Tính <code>hours</code> = số giờ trọn vẹn và <code>minutes</code> = số phút còn dư (dùng <code>//</code> và <code>%</code> với 60).</span>\r\n<template class=\"st\">total_minutes = 100\r\n# tao hours va minutes\r\n</template>\r\n<template class=\"ts\">assert hours == 1, \"dung // 60\"\r\nassert minutes == 40, \"dung % 60\"\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 7.</b> Tính trung bình cộng của ba số <code>8</code>, <code>9</code>, <code>10</code> và lưu vào <code>average</code>. Cẩn thận thứ tự ưu tiên — nhớ dùng ngoặc!</span>\r\n<template class=\"st\"># tao average = trung binh cong cua 8, 9, 10\r\n</template>\r\n<template class=\"ts\">assert average == 9, \"nho dung ngoac: (8+9+10)/3\"\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 8.</b> Cho <code>age = 20</code> (một số). Tạo chuỗi <code>label = \"Age: 20\"</code> bằng cách nối chuỗi <code>\"Age: \"</code> với <code>age</code> — nhớ ép kiểu số về chuỗi bằng <code>str()</code>.</span>\r\n<template class=\"st\">age = 20\r\n# tao label = \"Age: 20\" bang cach noi chuoi\r\n</template>\r\n<template class=\"ts\">assert label == \"Age: 20\", \"dung 'Age: ' + str(age)\"\r\n</template></div>\r\n\r\n<h4>11. Gán rút gọn (+=, -=, *=)</h4>\r\n<p>Khi cập nhật một biến bằng chính nó, Python có cách viết ngắn gọn — rất hay dùng khi đếm hoặc cộng dồn:</p>\r\n<pre class=\"run\">score = 5\r\nscore += 3     # giong: score = score + 3  -> 8\r\nscore *= 2     # giong: score = score * 2  -> 16\r\nscore -= 1     # -> 15\r\nprint(score)   # 15</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 9.</b> Cho <code>diem = 10</code>. Dùng phép gán rút gọn: cộng thêm 5 (<code>+= 5</code>) rồi nhân đôi (<code>*= 2</code>). Kết quả cuối cùng lưu ở <code>diem</code>.</span>\r\n<template class=\"st\">diem = 10\r\n# dùng += và *= để được 30\r\n</template>\r\n<template class=\"ts\">assert diem == 30, \"10 + 5 = 15, roi *2 = 30\"\r\n</template></div>\r\n\r\n<h4>12. Những lỗi thường gặp của người mới</h4>\r\n<ul>\r\n<li><b>Quên dấu nháy:</b> <code>print(xin chao)</code> → lỗi. Chuỗi phải là <code>\"xin chao\"</code>.</li>\r\n<li><b>Nhầm <code>=</code> với <code>==</code>:</b> <code>=</code> là gán, <code>==</code> là so sánh (học ở bài 3).</li>\r\n<li><b>Cộng chuỗi với số:</b> <code>\"Age: \" + 20</code> → lỗi. Phải <code>\"Age: \" + str(20)</code>.</li>\r\n<li><b>Quên ép kiểu sau <code>input()</code>:</b> kết quả là chuỗi, không tính toán trực tiếp được.</li>\r\n</ul>\r\n\r\n<div class=\"recap\">Ghi nhớ bài 1: lập trình là viết chỉ thị cho máy · Python là ngôn ngữ dễ đọc cho người mới · <code>print()</code> in ra màn hình, chữ đặt trong dấu nháy · <code>#</code> là chú thích (máy bỏ qua) · dữ liệu có <b>kiểu</b> (int/float/str/bool) · biến là hộp có tên, <code>=</code> là gán · <code>input()</code> luôn trả về chuỗi → nhớ ép kiểu <code>int()/float()</code> · các phép toán <code>+ - * / // % **</code> và thứ tự ưu tiên · <code>+= -= *=</code> gán rút gọn. Bài sau: làm chủ chuỗi và f-string.</div>\r\n\r\n<div class=\"ex stretch\" data-kind=\"py\"><span class=\"exq\"><b>🔥 Thử thách.</b> Cho <code>price_str = \"120000\"</code> và <code>qty_str = \"3\"</code> (giả lập <code>input()</code>). Tính tổng tiền có cộng thêm <b>10% VAT</b>, làm tròn về số nguyên, lưu vào <code>total</code>. (Gợi ý: ép kiểu số, nhân với nhau rồi nhân <code>1.1</code>, dùng <code>round()</code>.)</span>\r\n<template class=\"st\">price_str = \"120000\"\r\nqty_str = \"3\"\r\n# tao total = tong tien + 10% VAT, lam tron ve so nguyen\r\n</template>\r\n<template class=\"ts\">assert total == 396000, \"120000 * 3 = 360000, them 10% = 396000\"\r\n</template></div>\r\n\r\n<h4>🏠 Bài tập về nhà</h4>\r\n<p>Làm ở nhà, không tính vào 2 giờ trên lớp. Bốn câu, câu cuối là thử thách.</p>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Bài về nhà 1.</b> Cho <code>vnd_str = \"260000\"</code> (chuỗi). Đổi sang USD với tỉ giá 26000: tạo <code>usd</code> (số thực) = số tiền VND chia cho 26000, rồi tạo <code>message</code> bằng f-string đúng dạng <code>\"260000 VND = 10.0 USD\"</code>.</span>\r\n<template class=\"st\">vnd_str = \"260000\"\r\nrate = 26000\r\n# tao usd va message\r\n</template>\r\n<template class=\"ts\">assert usd == 10.0, \"ep kieu int(vnd_str) roi chia cho rate\"\r\nassert message == \"260000 VND = 10.0 USD\", 'dung f\"{vnd_str} VND = {usd} USD\"'\r\n</template></div>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Bài về nhà 2.</b> Cho <code>celsius = 25</code> (một số). Đổi sang độ F: <code>fahrenheit = celsius * 9 / 5 + 32</code> → <code>77.0</code>.</span>\r\n<template class=\"st\">celsius = 25\r\n# tao fahrenheit\r\n</template>\r\n<template class=\"ts\">assert fahrenheit == 77.0\r\n</template></div>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Bài về nhà 3.</b> Cho hình chữ nhật <code>width = 4</code>, <code>height = 5</code>. Tạo <code>area</code> = diện tích (<code>width * height</code>) và <code>perimeter</code> = chu vi (<code>2 * (width + height)</code>).</span>\r\n<template class=\"st\">width = 4\r\nheight = 5\r\n# tao area va perimeter\r\n</template>\r\n<template class=\"ts\">assert area == 20\r\nassert perimeter == 18\r\n</template></div>\r\n<div class=\"ex homework stretch\" data-kind=\"py\"><span class=\"exq\"><b>🔥 Bài về nhà 4 (thử thách).</b> Cho <code>total_seconds = 3661</code>. Tách thành giờ/phút/giây rồi tạo chuỗi <code>time_str</code> dạng <code>\"01:01:01\"</code> (mỗi phần 2 chữ số). Gợi ý: <code>// 3600</code>, <code>% 3600 // 60</code>, <code>% 60</code>, và f-string <code>{h:02d}</code>.</span>\r\n<template class=\"st\">total_seconds = 3661\r\n# tao time_str dang \"HH:MM:SS\"\r\n</template>\r\n<template class=\"ts\">assert time_str == \"01:01:01\"\r\n</template></div>","en":"<h3>Lesson 1 — Getting started with Python: values, variables and print()</h3>\r\n<p>Welcome to your very first lesson. If you've never written a line of code before — <b>perfect</b>, this lesson is written exactly for you. We'll go slowly: understand what programming is, what Python is, and only then type our first lines of code.</p>\r\n\r\n<h4>1. What is programming? What is Python?</h4>\r\n<p><b>Programming</b> is simply writing a list of <b>instructions</b> for a computer to follow — like writing a recipe: step by step, clear, in order. Computers are fast and precise, but they <i>only do exactly what you tell them</i> and never guess your intent. Learning to program is mostly learning to <b>express ideas very clearly</b> so the machine understands.</p>\r\n<p><b>Python</b> is a <b>programming language</b> — the vocabulary and grammar for writing those instructions. People pick Python to start because it reads close to plain English, has few confusing symbols, and is used everywhere: web, data analysis, automation, artificial intelligence… Writing <code>print(\"Hello\")</code> in Python is far more readable than in many other languages.</p>\r\n<p>In this course you'll run <b>real</b> Python — the same Python professional developers use — right in your browser, with nothing to install.</p>\r\n\r\n<h4>2. How learning works at The Dojo</h4>\r\n<p>Whenever you see a dark box like the one below, that's <b>where you write code</b>. Under it are two buttons:</p>\r\n<ul>\r\n<li><b>Run:</b> sends your code to real Python. The <i>first run</i> downloads the Python engine (~10MB), which can take 10–30 seconds — be patient; after that it's instant.</li>\r\n<li><b>Reset:</b> restores the code box to its starting state if you want to start over.</li>\r\n</ul>\r\n<p>After you click Run, you'll see a result area with two parts:</p>\r\n<ul>\r\n<li><b>Output:</b> everything your program <i>prints to the screen</i> appears here — it's your program's \"screen\". This panel always shows, whether your answer is right or wrong.</li>\r\n<li><b>Verdict:</b> <span style=\"color:var(--jade)\">Pass</span> if your answer is correct, or <span style=\"color:var(--ember)\">Fail</span> with a specific hint (e.g. which variable is wrong, what its value is and what it should be).</li>\r\n</ul>\r\n<p>You can edit your code and click Run as many times as you like — being wrong is normal and the fastest way to learn.</p>\r\n\r\n<h4>3. Your first command: <code>print()</code></h4>\r\n<p>A program runs its instructions <b>top to bottom, one at a time</b>. The first and most-used one is <code>print()</code> — it tells the computer to <b>show (display) something on screen</b>.</p>\r\n<pre class=\"run\">print(\"Hello\")\r\nprint(\"I am learning Python\")</pre>\r\n<p>Let's read the line <code>print(\"Hello\")</code> part by part:</p>\r\n<ul>\r\n<li><code>print</code> — the name of the command (show on screen).</li>\r\n<li><code>( )</code> — round parentheses; inside them goes the thing you want to print.</li>\r\n<li><code>\"Hello\"</code> — a piece of <b>text</b>. In programming, text is called a <b>string</b> and <u>must be wrapped in quotes</u> <code>\"...\"</code>. The quotes tell the computer \"this is literal text to print\", not a command.</li>\r\n</ul>\r\n<p>If you forget the quotes — e.g. <code>print(Hello)</code> — the computer errors, because it thinks <code>Hello</code> is the name of some command it doesn't know.</p>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 1.</b> Use <code>print()</code> to print exactly the line <code>Hello Dojo</code>. (Remember the quotes around the text.)</span>\r\n<template class=\"st\"># Type your print command below:\r\n</template>\r\n<template class=\"ts\">assert _OUT_.strip() == \"Hello Dojo\", \"must print exactly: Hello Dojo\"\r\n</template></div>\r\n<p><i>Note: this exercise checks <b>what you print to the screen</b> (see the Output panel). Most later exercises check <b>the value of a variable</b> — we'll learn \"variables\" just below.</i></p>\r\n\r\n<h4>4. Comments with <code>#</code></h4>\r\n<p>Did you notice the line <code># Type your print command below:</code> in the exercise above? That's a <b>comment</b>. Everything after a <code>#</code> on a line is <b>completely ignored</b> by Python — it's a note for <i>humans to read</i>, not an instruction for the machine to run.</p>\r\n<pre># This is a comment — Python doesn't run this line\r\nprint(\"This line does run\")   # a comment can also sit at the end of a line</pre>\r\n<p>Comments explain the code to you (and others) reading it later. In exercises we often leave a <code>#</code> line hinting where you should write.</p>\r\n\r\n<h4>5. Values and data types</h4>\r\n<p>Every piece of data in Python has a <b>type</b>. The four foundational ones you meet first:</p>\r\n<pre>10          # whole number -> int    (no decimal part)\r\n3.14        # decimal      -> float  (has a decimal point)\r\n\"hello\"     # text         -> str    (letters in quotes)\r\nTrue        # true/false   -> bool   (only True or False)</pre>\r\n<p>You can ask the computer \"what type is this?\" with <code>type()</code>:</p>\r\n<pre>print(type(10))       # &lt;class 'int'&gt;\r\nprint(type(3.14))     # &lt;class 'float'&gt;\r\nprint(type(\"hi\"))     # &lt;class 'str'&gt;\r\nprint(type(True))     # &lt;class 'bool'&gt;</pre>\r\n<p>Why do types matter? Because the computer <b>behaves differently</b> per type: <code>3 + 4</code> gives <code>7</code> (adding numbers), but <code>\"3\" + \"4\"</code> gives <code>\"34\"</code> (joining text). Mixing up types is one of the most common beginner bugs.</p>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 2.</b> Create four variables: <code>a</code> = integer 42, <code>b</code> = float 3.5, <code>c</code> = string <code>\"Python\"</code> (capital P), <code>d</code> = boolean <code>True</code>.</span>\r\n<template class=\"st\"># create 4 variables a, b, c, d\r\n</template>\r\n<template class=\"ts\">assert a == 42 and isinstance(a, int)\r\nassert b == 3.5 and isinstance(b, float)\r\nassert c == \"Python\" and isinstance(c, str)\r\nassert d is True\r\n</template></div>\r\n\r\n<h4>6. Variables — named boxes</h4>\r\n<p>A <b>variable</b> is a name attached to a value so you can reuse it later. The <code>=</code> sign means <b>assign</b>: take the value on the right and put it in the named box on the left.</p>\r\n<pre>age = 15\r\nname = \"Minh\"\r\nprint(name, \"is\", age, \"years old\")   # Minh is 15 years old</pre>\r\n<p>Variables can be <b>reassigned</b> — the new value replaces the old:</p>\r\n<pre>score = 5\r\nscore = score + 3     # take old score (5), add 3, store back into score -> 8\r\nprint(score)           # 8</pre>\r\n<h4>Naming rules</h4>\r\n<ul>\r\n<li>Only letters, digits and underscore <code>_</code>; must <b>not</b> start with a digit.</li>\r\n<li>No spaces. Use <code>snake_case</code> to join words: <code>quantity</code>, <code>user_name</code>.</li>\r\n<li>Case-sensitive: <code>age</code> and <code>Age</code> are two different variables.</li>\r\n<li>Use <b>meaningful</b> names: <code>price</code> beats <code>x</code>.</li>\r\n</ul>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 3.</b> Create <code>quantity</code> = 4 and <code>unit_price</code> = 25000. Create <code>subtotal</code> as their product (write the multiplication <code>*</code>, don't hard-code the result).</span>\r\n<template class=\"st\">quantity = 4\r\nunit_price = 25000\r\n# create subtotal = quantity times unit_price\r\n</template>\r\n<template class=\"ts\">assert subtotal == 100000\r\n</template></div>\r\n\r\n<h4>7. <code>print()</code> in more detail</h4>\r\n<p><code>print()</code> can print several things at once, separated by commas — the computer inserts a space between them:</p>\r\n<pre>name = \"Minh\"\r\nprint(\"Hello,\", name)     # Hello, Minh</pre>\r\n<p>You can change the separator with <code>sep</code>, and the line-ending character with <code>end</code>:</p>\r\n<pre>print(\"2024\", \"09\", \"18\", sep=\"-\")   # 2024-09-18\r\nprint(\"Loading\", end=\"...\")           # no newline, then prints \"...\"</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 4.</b> Given <code>year = 2026</code>, <code>month = 9</code>, <code>day = 18</code>, use <code>print()</code> with <code>sep</code> to print exactly <code>2026/9/18</code>. (Note: these are three <i>number variables</i> — don't put them in quotes.)</span>\r\n<template class=\"st\">year = 2026\r\nmonth = 9\r\nday = 18\r\n# print 2026/9/18 using print(..., sep=...)\r\n</template>\r\n<template class=\"ts\">assert _OUT_.strip() == \"2026/9/18\", \"must print 2026/9/18\"\r\n</template></div>\r\n\r\n<h4>8. Reading input from a user — <code>input()</code></h4>\r\n<p>The <code>input()</code> function pauses the program, waits for the user to type, then returns what they typed. <b>Critically important:</b> <code>input()</code> <u>always returns a string (str)</u>, even when the person types a number.</p>\r\n<pre>name = input(\"What's your name? \")\r\nprint(\"Hi\", name)\r\n\r\nage_str = input(\"Your age? \")   # e.g. typing \"15\" -> age_str = \"15\" (a string!)\r\nprint(type(age_str))            # &lt;class 'str'&gt;</pre>\r\n<p>Because the result is a string, to do math you must <b>convert</b> it to a number first.</p>\r\n\r\n<h4>9. Type conversion</h4>\r\n<pre>int(\"15\")     # 15   (string -> integer)\r\nfloat(\"3.5\")  # 3.5  (string -> float)\r\nstr(15)       # \"15\" (number -> string)</pre>\r\n<p>This is why the line below is a classic logic bug: it joins two strings instead of adding two numbers.</p>\r\n<pre>a = input(\"Number a: \")   # \"7\"\r\nb = input(\"Number b: \")   # \"3\"\r\nprint(a + b)              # \"73\"  (WRONG! string join)\r\nprint(int(a) + int(b))    # 10    (RIGHT, convert to int first)</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 5.</b> Given two strings <code>a = \"7\"</code> and <code>b = \"3\"</code> (simulating <code>input()</code> results), create <code>total</code> = their <i>numeric</i> sum (result must be <code>10</code>, not <code>\"73\"</code>).</span>\r\n<template class=\"st\">a = \"7\"\r\nb = \"3\"\r\n# create total = numeric sum of a and b\r\n</template>\r\n<template class=\"ts\">assert total == 10, \"remember to int() before adding\"\r\n</template></div>\r\n\r\n<h4>10. Arithmetic operators</h4>\r\n<pre>7 + 3     # 10   add\r\n7 - 3     # 4    subtract\r\n7 * 3     # 21   multiply\r\n7 / 2     # 3.5  divide (ALWAYS a float)\r\n7 // 2    # 3    floor division (whole part)\r\n7 % 2     # 1    remainder (modulo)\r\n2 ** 10   # 1024 power (2 to the 10)</pre>\r\n<p><code>//</code> and <code>%</code> are very handy: <code>//</code> tells you \"how many whole times it divides\", <code>%</code> tells you \"how much is left over\". E.g. turn 100 minutes into hours:minutes → <code>100 // 60 = 1</code> hour, <code>100 % 60 = 40</code> minutes.</p>\r\n<p>Precedence follows math: <code>**</code> first, then <code>* / // %</code>, then <code>+ -</code>. Use parentheses <code>( )</code> to force order:</p>\r\n<pre>2 + 3 * 4       # 14  (multiply first)\r\n(2 + 3) * 4     # 20  (parentheses first)</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 6.</b> Given <code>total_minutes = 100</code>, compute <code>hours</code> = whole hours and <code>minutes</code> = leftover minutes (use <code>//</code> and <code>%</code> with 60).</span>\r\n<template class=\"st\">total_minutes = 100\r\n# create hours and minutes\r\n</template>\r\n<template class=\"ts\">assert hours == 1, \"use // 60\"\r\nassert minutes == 40, \"use % 60\"\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 7.</b> Compute the average of three numbers <code>8</code>, <code>9</code>, <code>10</code> into <code>average</code>. Watch precedence — use parentheses!</span>\r\n<template class=\"st\"># create average = average of 8, 9, 10\r\n</template>\r\n<template class=\"ts\">assert average == 9, \"use parentheses: (8+9+10)/3\"\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 8.</b> Given <code>age = 20</code> (a number), build the string <code>label = \"Age: 20\"</code> by joining <code>\"Age: \"</code> with <code>age</code> — remember to convert the number with <code>str()</code>.</span>\r\n<template class=\"st\">age = 20\r\n# create label = \"Age: 20\" by string concatenation\r\n</template>\r\n<template class=\"ts\">assert label == \"Age: 20\", \"use 'Age: ' + str(age)\"\r\n</template></div>\r\n\r\n<h4>11. Augmented assignment (+=, -=, *=)</h4>\r\n<p>When you update a variable using itself, Python has a shorthand — used constantly for counting and accumulating:</p>\r\n<pre class=\"run\">score = 5\r\nscore += 3     # same as: score = score + 3  -> 8\r\nscore *= 2     # same as: score = score * 2  -> 16\r\nscore -= 1     # -> 15\r\nprint(score)   # 15</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 9.</b> Given <code>diem = 10</code>, use augmented assignment: add 5 (<code>+= 5</code>), then double it (<code>*= 2</code>). Final value stays in <code>diem</code>.</span>\r\n<template class=\"st\">diem = 10\r\n# use += and *= to reach 30\r\n</template>\r\n<template class=\"ts\">assert diem == 30, \"10 + 5 = 15, then *2 = 30\"\r\n</template></div>\r\n\r\n<h4>12. Common beginner mistakes</h4>\r\n<ul>\r\n<li><b>Missing quotes:</b> <code>print(hello)</code> → error. Text must be <code>\"hello\"</code>.</li>\r\n<li><b>Confusing <code>=</code> and <code>==</code>:</b> <code>=</code> assigns, <code>==</code> compares (lesson 3).</li>\r\n<li><b>Adding a string to a number:</b> <code>\"Age: \" + 20</code> → error. Use <code>\"Age: \" + str(20)</code>.</li>\r\n<li><b>Forgetting to convert after <code>input()</code>:</b> the result is a string, you can't do math on it directly.</li>\r\n</ul>\r\n\r\n<div class=\"recap\">Recap of lesson 1: programming is writing instructions for a machine · Python is a beginner-friendly language · <code>print()</code> shows output, text goes in quotes · <code>#</code> is a comment (ignored) · data has a <b>type</b> (int/float/str/bool) · a variable is a named box, <code>=</code> assigns · <code>input()</code> always returns a string → remember to convert with <code>int()/float()</code> · operators <code>+ - * / // % **</code> and precedence · <code>+= -= *=</code> shorthand. Next: mastering strings and f-strings.</div>\r\n\r\n<div class=\"ex stretch\" data-kind=\"py\"><span class=\"exq\"><b>🔥 Stretch.</b> Given <code>price_str = \"120000\"</code> and <code>qty_str = \"3\"</code> (simulating <code>input()</code>), compute the total with <b>10% VAT</b> added, rounded to a whole number, into <code>total</code>. (Hint: convert to numbers, multiply, then times <code>1.1</code>, use <code>round()</code>.)</span>\r\n<template class=\"st\">price_str = \"120000\"\r\nqty_str = \"3\"\r\n# create total = amount + 10% VAT, rounded to an integer\r\n</template>\r\n<template class=\"ts\">assert total == 396000, \"120000 * 3 = 360000, plus 10% = 396000\"\r\n</template></div>\r\n\r\n<h4>🏠 Homework</h4>\r\n<p>Do this at home, outside the 2-hour class. Four questions; the last is a stretch.</p>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Homework 1.</b> Given <code>vnd_str = \"260000\"</code> (a string), convert to USD at a rate of 26000: create <code>usd</code> (a float) = the VND amount divided by 26000, then create <code>message</code> with an f-string in the exact form <code>\"260000 VND = 10.0 USD\"</code>.</span>\r\n<template class=\"st\">vnd_str = \"260000\"\r\nrate = 26000\r\n# create usd and message\r\n</template>\r\n<template class=\"ts\">assert usd == 10.0, \"int(vnd_str) then divide by rate\"\r\nassert message == \"260000 VND = 10.0 USD\", 'use f\"{vnd_str} VND = {usd} USD\"'\r\n</template></div>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Homework 2.</b> Given <code>celsius = 25</code> (a number), convert to Fahrenheit: <code>fahrenheit = celsius * 9 / 5 + 32</code> → <code>77.0</code>.</span>\r\n<template class=\"st\">celsius = 25\r\n# create fahrenheit\r\n</template>\r\n<template class=\"ts\">assert fahrenheit == 77.0\r\n</template></div>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Homework 3.</b> For a rectangle with <code>width = 4</code>, <code>height = 5</code>, create <code>area</code> = the area (<code>width * height</code>) and <code>perimeter</code> = the perimeter (<code>2 * (width + height)</code>).</span>\r\n<template class=\"st\">width = 4\r\nheight = 5\r\n# create area and perimeter\r\n</template>\r\n<template class=\"ts\">assert area == 20\r\nassert perimeter == 18\r\n</template></div>\r\n<div class=\"ex homework stretch\" data-kind=\"py\"><span class=\"exq\"><b>🔥 Homework 4 (stretch).</b> Given <code>total_seconds = 3661</code>, split it into hours/minutes/seconds, then create a string <code>time_str</code> in the form <code>\"01:01:01\"</code> (each part 2 digits). Hint: <code>// 3600</code>, <code>% 3600 // 60</code>, <code>% 60</code>, and f-string <code>{h:02d}</code>.</span>\r\n<template class=\"st\">total_seconds = 3661\r\n# create time_str in \"HH:MM:SS\" form\r\n</template>\r\n<template class=\"ts\">assert time_str == \"01:01:01\"\r\n</template></div>"}},{"t":{"vi":"Chuỗi & f-string","en":"Strings & f-strings"},"html":{"vi":"<h3>Bài 2 — Chuỗi (string) và f-string</h3>\r\n<p>Chuỗi là kiểu dữ liệu bạn gặp nhiều nhất khi lập trình: tên người dùng, tên file, đường dẫn, thông báo lỗi, nội dung đọc từ web… tất cả đều là chuỗi. Làm chủ chuỗi là làm chủ một nửa công việc lập trình đời thường. Bài này học cách <b>đo, truy cập, cắt, biến đổi, ghép</b> và <b>định dạng</b> chuỗi.</p>\r\n\r\n<h4>1. Chuỗi là một dãy ký tự</h4>\r\n<pre>last_name = \"python\"\r\nprint(len(last_name))   # 6 — len() cho biet do dai (so ky tu)</pre>\r\n<p>Chuỗi có thể dùng nháy đơn hay nháy kép, miễn là mở và đóng giống nhau:</p>\r\n<pre>a = \"xin chao\"\r\nb = 'xin chao'   # tuong duong</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 1.</b> Tạo biến <code>filename</code> = <code>\"bao_cao.txt\"</code> và biến <code>length</code> bằng độ dài của nó (dùng <code>len</code>).</span>\r\n<template class=\"st\"># tao 2 bien theo yeu cau\r\n</template>\r\n<template class=\"ts\">assert filename == \"bao_cao.txt\"\r\nassert length == 11, \"dung len() de dem do dai\"\r\n</template></div>\r\n\r\n<h4>2. Chỉ số (index) — truy cập từng ký tự</h4>\r\n<p>Mỗi ký tự có một <b>chỉ số</b>, đếm từ 0. Chỉ số âm đếm ngược từ cuối:</p>\r\n<pre>s = \"python\"\r\n#     p  y  t  h  o  n\r\n#     0  1  2  3  4  5\r\n#    -6 -5 -4 -3 -2 -1\r\nprint(s[0])    # 'p' — ky tu first\r\nprint(s[-1])   # 'n' — ky tu last</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 2.</b> Cho <code>s = \"python\"</code>. Lấy ký tự đầu vào <code>first</code> và ký tự cuối vào <code>last</code> (dùng chỉ số).</span>\r\n<template class=\"st\">s = \"python\"\r\n# tao first va last\r\n</template>\r\n<template class=\"ts\">assert first == \"p\"\r\nassert last == \"n\"\r\n</template></div>\r\n\r\n<h4>3. Cắt chuỗi (slicing)</h4>\r\n<p>Cú pháp <code>s[start:stop]</code> lấy từ chỉ số <code>start</code> đến <b>ngay trước</b> <code>stop</code>:</p>\r\n<pre>s = \"python\"\r\nprint(s[0:3])   # 'pyt' — index 0,1,2\r\nprint(s[2:])    # 'thon' — tu index 2 den het\r\nprint(s[:3])    # 'pyt' — tu first den truoc 3\r\nprint(s[-3:])   # 'hon' — 3 ky tu last</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 3.</b> Cho <code>filename = \"bao_cao.txt\"</code>. Lấy 3 ký tự cuối (phần mở rộng) vào <code>ext</code>.</span>\r\n<template class=\"st\">filename = \"bao_cao.txt\"\r\n# tao ext = 3 ky tu last\r\n</template>\r\n<template class=\"ts\">assert ext == \"txt\"\r\n</template></div>\r\n\r\n<h4>4. Ghép và lặp chuỗi</h4>\r\n<pre>first_name = \"Nguyen\"\r\nlast_name = \"Minh\"\r\nprint(first_name + \" \" + last_name)   # 'Nguyen Minh' — ghep bang +\r\nprint(\"=\" * 10)          # '==========' — lap 10 lan bang *</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 4.</b> Cho <code>first_name = \"Le\"</code> và <code>last_name = \"An\"</code>. Ghép thành <code>full_name</code> = <code>\"Le An\"</code> (một dấu cách ở giữa).</span>\r\n<template class=\"st\">first_name = \"Le\"\r\nlast_name = \"An\"\r\n# tao full_name = \"Le An\"\r\n</template>\r\n<template class=\"ts\">assert full_name == \"Le An\"\r\n</template></div>\r\n\r\n<h4>5. Ký tự đặc biệt (escape)</h4>\r\n<p>Vài ký tự cần \"thoát\" bằng dấu gạch chéo ngược <code>\\</code>:</p>\r\n<pre>print(\"Dong 1\\nDong 2\")      # \\n = xuong dong\r\nprint(\"Cot1\\tCot2\")           # \\t = tab\r\nprint(\"Anh ay noi \\\"hi\\\"\")   # \\\" = first nhay ben trong chuoi kep\r\nprint(\"C:\\\\tmp\\\\a.txt\")        # \\\\ = mot first gach cheo nguoc</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 5.</b> Tạo biến <code>cau</code> chứa đúng nội dung: <code>Anh ay noi \"hello\"</code> (có cặp dấu nháy kép quanh chữ hello).</span>\r\n<template class=\"st\"># tao cau = Anh ay noi \"hello\"\r\n</template>\r\n<template class=\"ts\">assert cau == 'Anh ay noi \"hello\"'\r\n</template></div>\r\n\r\n<h4>6. Chuỗi không sửa được tại chỗ (immutable)</h4>\r\n<p>Bạn <b>không</b> thể đổi một ký tự bằng cách gán vào chỉ số. Mọi phương thức chuỗi luôn trả về một chuỗi <b>mới</b>, không đụng vào chuỗi gốc:</p>\r\n<pre>s = \"python\"\r\n# s[0] = \"P\"        # LOI: 'str' object does not support item assignment\r\ns = \"P\" + s[1:]      # dung cach: tao chuoi moi\r\nprint(s)              # Python</pre>\r\n\r\n<h4>7. Phương thức chuỗi (string methods)</h4>\r\n<p>Chuỗi có sẵn nhiều \"công cụ\" gọi bằng dấu chấm:</p>\r\n<pre>\"  hi  \".strip()            # 'hi'   — bo khoang trang 2 first\r\n\"hello\".upper()             # 'HELLO'\r\n\"HELLO\".lower()             # 'hello'\r\n\"hello world\".title()       # 'Hello World'\r\n\"a-b-c\".replace(\"-\", \"_\")   # 'a_b_c'\r\n\"python\".startswith(\"py\")   # True\r\n\"a.txt\".endswith(\".txt\")    # True\r\n\"banana\".count(\"a\")         # 3\r\n\"banana\".find(\"na\")         # 2   (vi tri first tien, hoac -1 neu khong thay)</pre>\r\n<p>Kiểm tra một chuỗi có nằm trong chuỗi khác bằng từ khóa <code>in</code>:</p>\r\n<pre>print(\"py\" in \"python\")     # True\r\nprint(\"z\" in \"python\")      # False</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 6.</b> Cho <code>email = \"  Minh@Example.COM  \"</code>. Chuẩn hóa: bỏ khoảng trắng thừa và đổi về chữ thường, lưu vào <code>cleaned</code>.</span>\r\n<template class=\"st\">email = \"  Minh@Example.COM  \"\r\n# tao cleaned: bo khoang trang + chu thuong\r\n</template>\r\n<template class=\"ts\">assert cleaned == \"minh@example.com\"\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 7.</b> Cho <code>path = \"src/app/main\"</code>. Thay mọi dấu <code>/</code> bằng dấu <code>.</code> để được <code>src.app.main</code>, lưu vào <code>module</code>.</span>\r\n<template class=\"st\">path = \"src/app/main\"\r\n# tao module: thay \"/\" bang \".\"\r\n</template>\r\n<template class=\"ts\">assert module == \"src.app.main\"\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 8.</b> Cho <code>filename = \"bao_cao.txt\"</code>. Tạo biến <code>is_txt</code> = kết quả kiểm tra tên file có kết thúc bằng <code>\".txt\"</code> hay không (dùng <code>.endswith</code>, kết quả là <code>True</code>/<code>False</code>).</span>\r\n<template class=\"st\">filename = \"bao_cao.txt\"\r\n# tao is_txt = filename co ket thuc bang \".txt\"?\r\n</template>\r\n<template class=\"ts\">assert is_txt is True\r\n</template></div>\r\n\r\n<h4>8. f-string — chèn và định dạng</h4>\r\n<p>Cách hiện đại và dễ đọc nhất để chèn giá trị vào chuỗi: thêm chữ <code>f</code> trước dấu nháy, đặt biến (hoặc biểu thức) trong <code>{ }</code>.</p>\r\n<pre>last_name = \"Minh\"\r\ntuoi = 15\r\nprint(f\"Ten la {last_name}, {tuoi} tuoi\")   # Ten la Minh, 15 tuoi\r\nprint(f\"Sang nam {tuoi + 1} tuoi\")     # tinh toan ngay trong { }</pre>\r\n<p>f-string còn <b>định dạng</b> giá trị sau dấu hai chấm <code>:</code></p>\r\n<pre>price = 2500000\r\nprint(f\"{price:,} VND\")     # 2,500,000 VND  — first phay ngan cach hang nghin\r\nscore = 8.6666\r\nprint(f\"{score:.2f}\")       # 8.67           — lam tron 2 chu so thap phan\r\nlast_name = \"Minh\"\r\nprint(f\"|{last_name:&gt;10}|\")      # |      Minh|   — can le phai, rong 10\r\nprint(f\"|{last_name:&lt;10}|\")      # |Minh      |   — can le trai\r\nprint(f\"|{last_name:^10}|\")      # |   Minh   |   — can giua</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 9.</b> Cho <code>price = 2500000</code>. Dùng f-string tạo <code>display</code> = <code>\"2,500,000 VND\"</code> (có dấu phẩy ngăn cách hàng nghìn).</span>\r\n<template class=\"st\">price = 2500000\r\n# tao display bang f-string voi dinh dang {price:,}\r\n</template>\r\n<template class=\"ts\">assert display == \"2,500,000 VND\"\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 10.</b> Cho <code>score = 8.6666</code>. Dùng f-string tạo <code>rounded</code> = <code>\"8.67\"</code> (làm tròn 2 chữ số thập phân).</span>\r\n<template class=\"st\">score = 8.6666\r\n# tao rounded bang f-string voi dinh dang {score:.2f}\r\n</template>\r\n<template class=\"ts\">assert rounded == \"8.67\"\r\n</template></div>\r\n\r\n<h4>9. Nối & tách chuỗi (xem trước)</h4>\r\n<p>Hai phương thức cực hữu ích (sẽ học kỹ ở bài 19):</p>\r\n<ul>\r\n<li><code>\"a,b,c\".split(\",\")</code> → <code>['a', 'b', 'c']</code> — <b>tách</b> chuỗi thành danh sách.</li>\r\n<li><code>\"-\".join([\"a\", \"b\", \"c\"])</code> → <code>\"a-b-c\"</code> — <b>nối</b> danh sách thành chuỗi.</li>\r\n</ul>\r\n<pre class=\"run\">full_name = \"Nguyen Van Minh\"\r\nparts = full_name.split(\" \")     # ['Nguyen', 'Van', 'Minh']\r\nprint(parts)\r\nprint(len(parts), \"tu\")          # 3 tu</pre>\r\n<p>Bạn cũng có thể <b>nối chuỗi các method</b> lại — chúng chạy lần lượt từ trái sang phải:</p>\r\n<pre class=\"run\">raw = \"  Hello WORLD  \"\r\nprint(raw.strip().lower())       # 'hello world'</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 11.</b> Cho <code>sentence = \"python la ngon ngu\"</code>. Tách thành danh sách các từ (theo dấu cách) rồi lưu <b>số từ</b> vào <code>word_count</code> (dùng <code>split</code> rồi <code>len</code>).</span>\r\n<template class=\"st\">sentence = \"python la ngon ngu\"\r\n# tach thanh tu, dem so tu -> word_count\r\n</template>\r\n<template class=\"ts\">assert word_count == 4\r\n</template></div>\r\n\r\n<div class=\"recap\">Ghi nhớ bài 2: chuỗi là dãy ký tự, index từ 0 (âm đếm từ cuối) · <code>len()</code> đo độ dài · <code>[a:b]</code> cắt · <code>+</code> ghép, <code>*</code> lặp · <code>\\n \\t \\\" \\\\</code> ký tự đặc biệt · chuỗi <b>immutable</b> — method trả về chuỗi mới · <code>.strip/.lower/.upper/.title/.replace/.startswith/.endswith/.count/.find/.split</code> · <code>in</code> để kiểm tra chứa · f-string <code>f\"{bien:dinh_dang}\"</code> để chèn và định dạng. Bài sau: ra quyết định với if/elif/else.</div>\r\n\r\n<div class=\"ex stretch\" data-kind=\"py\"><span class=\"exq\"><b>🔥 Thử thách.</b> Cho <code>full = \"  John.DOE@Company.com  \"</code>. Tạo <code>username</code> = phần <b>trước</b> dấu <code>@</code> đã chuẩn hóa (strip + lower), và <code>domain</code> = phần <b>sau</b> <code>@</code> đã chuẩn hóa. Kết quả: <code>username = \"john.doe\"</code>, <code>domain = \"company.com\"</code>. (Gợi ý: <code>.strip().lower()</code> trước, rồi <code>.find(\"@\")</code> và cắt chuỗi.)</span>\r\n<template class=\"st\">full = \"  John.DOE@Company.com  \"\r\n# tao username va domain\r\n</template>\r\n<template class=\"ts\">assert username == \"john.doe\"\r\nassert domain == \"company.com\"\r\n</template></div>\r\n\r\n<h4>🏠 Bài tập về nhà</h4>\r\n<p>Làm ở nhà, không tính vào 2 giờ trên lớp. Bốn câu, câu cuối là thử thách.</p>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Bài về nhà 1.</b> Cho <code>full = \"  John.Doe@Company.com  \"</code>. (1) tạo <code>email</code> = chuẩn hóa (strip + lower); (2) tạo <code>username</code> = phần trước <code>@</code>; (3) tạo <code>message</code> = <code>f\"user: {username}\"</code> → <code>\"user: john.doe\"</code>.</span>\r\n<template class=\"st\">full = \"  John.Doe@Company.com  \"\r\n# tao email, username, message\r\n</template>\r\n<template class=\"ts\">assert email == \"john.doe@company.com\"\r\nassert username == \"john.doe\"\r\nassert message == \"user: john.doe\"\r\n</template></div>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Bài về nhà 2.</b> Cho <code>name = \"nguyen van a\"</code>. Tạo <code>proper</code> = tên viết hoa đầu mỗi từ (dùng <code>.title()</code>) → <code>\"Nguyen Van A\"</code>.</span>\r\n<template class=\"st\">name = \"nguyen van a\"\r\n# tao proper bang .title()\r\n</template>\r\n<template class=\"ts\">assert proper == \"Nguyen Van A\"\r\n</template></div>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Bài về nhà 3.</b> Cho <code>filename = \"report.final.txt\"</code>. Tạo <code>ext</code> = phần mở rộng (sau dấu chấm cuối) → <code>\"txt\"</code> (gợi ý: <code>.split(\".\")</code> rồi lấy <code>[-1]</code>).</span>\r\n<template class=\"st\">filename = \"report.final.txt\"\r\n# tao ext = phan mo rong\r\n</template>\r\n<template class=\"ts\">assert ext == \"txt\"\r\n</template></div>\r\n<div class=\"ex homework stretch\" data-kind=\"py\"><span class=\"exq\"><b>🔥 Bài về nhà 4 (thử thách).</b> Cho <code>email = \"john.doe@example.com\"</code>. Tạo <code>masked</code> = che tên đăng nhập: giữ ký tự đầu, thay phần còn lại của tên trước <code>@</code> bằng <code>\"***\"</code>, giữ nguyên phần sau <code>@</code> → <code>\"j***@example.com\"</code>. (Gợi ý: <code>.find(\"@\")</code> và cắt chuỗi.)</span>\r\n<template class=\"st\">email = \"john.doe@example.com\"\r\n# tao masked = \"j***@example.com\"\r\n</template>\r\n<template class=\"ts\">assert masked == \"j***@example.com\"\r\n</template></div>","en":"<h3>Lesson 2 — Strings and f-strings</h3>\r\n<p>Strings are the data type you meet most in programming: usernames, file names, paths, error messages, content read from the web… all strings. Mastering strings is mastering half of everyday programming. This lesson covers how to <b>measure, access, slice, transform, join</b> and <b>format</b> them.</p>\r\n\r\n<h4>1. A string is a sequence of characters</h4>\r\n<pre>name = \"python\"\r\nprint(len(name))   # 6 — len() gives the length (number of characters)</pre>\r\n<p>Strings can use single or double quotes, as long as they match:</p>\r\n<pre>a = \"hello\"\r\nb = 'hello'   # equivalent</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 1.</b> Create <code>filename</code> = <code>\"bao_cao.txt\"</code> and <code>length</code> equal to its length (use <code>len</code>).</span>\r\n<template class=\"st\"># create the two variables\r\n</template>\r\n<template class=\"ts\">assert filename == \"bao_cao.txt\"\r\nassert length == 11, \"use len() to count the length\"\r\n</template></div>\r\n\r\n<h4>2. Indexing — accessing individual characters</h4>\r\n<p>Each character has an <b>index</b>, counting from 0. Negative indexes count back from the end:</p>\r\n<pre>s = \"python\"\r\n#     p  y  t  h  o  n\r\n#     0  1  2  3  4  5\r\n#    -6 -5 -4 -3 -2 -1\r\nprint(s[0])    # 'p' — first char\r\nprint(s[-1])   # 'n' — last char</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 2.</b> Given <code>s = \"python\"</code>, take the first character into <code>first</code> and the last into <code>last</code> (use indexing).</span>\r\n<template class=\"st\">s = \"python\"\r\n# create first and last\r\n</template>\r\n<template class=\"ts\">assert first == \"p\"\r\nassert last == \"n\"\r\n</template></div>\r\n\r\n<h4>3. Slicing</h4>\r\n<p>The syntax <code>s[start:stop]</code> takes from index <code>start</code> up to <b>just before</b> <code>stop</code>:</p>\r\n<pre>s = \"python\"\r\nprint(s[0:3])   # 'pyt' — index 0,1,2\r\nprint(s[2:])    # 'thon' — from index 2 to the end\r\nprint(s[:3])    # 'pyt' — from start to before 3\r\nprint(s[-3:])   # 'hon' — last 3 chars</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 3.</b> Given <code>filename = \"bao_cao.txt\"</code>, take the last 3 characters (the extension) into <code>ext</code>.</span>\r\n<template class=\"st\">filename = \"bao_cao.txt\"\r\n# create ext = last 3 characters\r\n</template>\r\n<template class=\"ts\">assert ext == \"txt\"\r\n</template></div>\r\n\r\n<h4>4. Joining and repeating</h4>\r\n<pre>first = \"Nguyen\"\r\nlast = \"Minh\"\r\nprint(first + \" \" + last)   # 'Nguyen Minh' — join with +\r\nprint(\"=\" * 10)              # '==========' — repeat 10x with *</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 4.</b> Given <code>first_name = \"Le\"</code> and <code>last_name = \"An\"</code>, join into <code>full_name</code> = <code>\"Le An\"</code> (one space between).</span>\r\n<template class=\"st\">first_name = \"Le\"\r\nlast_name = \"An\"\r\n# create full_name = \"Le An\"\r\n</template>\r\n<template class=\"ts\">assert full_name == \"Le An\"\r\n</template></div>\r\n\r\n<h4>5. Escape sequences</h4>\r\n<p>A few characters need \"escaping\" with a backslash <code>\\</code>:</p>\r\n<pre>print(\"Line 1\\nLine 2\")      # \\n = new line\r\nprint(\"Col1\\tCol2\")           # \\t = tab\r\nprint(\"He said \\\"hi\\\"\")       # \\\" = a quote inside a double-quoted string\r\nprint(\"C:\\\\tmp\\\\a.txt\")        # \\\\ = a single backslash</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 5.</b> Create <code>cau</code> holding exactly: <code>Anh ay noi \"hello\"</code> (with double quotes around hello).</span>\r\n<template class=\"st\"># create cau = Anh ay noi \"hello\"\r\n</template>\r\n<template class=\"ts\">assert cau == 'Anh ay noi \"hello\"'\r\n</template></div>\r\n\r\n<h4>6. Strings are immutable</h4>\r\n<p>You <b>cannot</b> change a character by assigning to an index. Every string method returns a <b>new</b> string and leaves the original untouched:</p>\r\n<pre>s = \"python\"\r\n# s[0] = \"P\"        # ERROR: 'str' object does not support item assignment\r\ns = \"P\" + s[1:]      # the right way: build a new string\r\nprint(s)              # Python</pre>\r\n\r\n<h4>7. String methods</h4>\r\n<p>Strings come with built-in \"tools\" called with a dot:</p>\r\n<pre>\"  hi  \".strip()            # 'hi'   — trim both ends\r\n\"hello\".upper()             # 'HELLO'\r\n\"HELLO\".lower()             # 'hello'\r\n\"hello world\".title()       # 'Hello World'\r\n\"a-b-c\".replace(\"-\", \"_\")   # 'a_b_c'\r\n\"python\".startswith(\"py\")   # True\r\n\"a.txt\".endswith(\".txt\")    # True\r\n\"banana\".count(\"a\")         # 3\r\n\"banana\".find(\"na\")         # 2   (first position, or -1 if not found)</pre>\r\n<p>Check whether one string is inside another with the <code>in</code> keyword:</p>\r\n<pre>print(\"py\" in \"python\")     # True\r\nprint(\"z\" in \"python\")      # False</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 6.</b> Given <code>email = \"  Minh@Example.COM  \"</code>, normalize it: trim whitespace and lowercase, into <code>cleaned</code>.</span>\r\n<template class=\"st\">email = \"  Minh@Example.COM  \"\r\n# create cleaned: trim + lowercase\r\n</template>\r\n<template class=\"ts\">assert cleaned == \"minh@example.com\"\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 7.</b> Given <code>path = \"src/app/main\"</code>, replace every <code>/</code> with <code>.</code> to get <code>src.app.main</code>, into <code>module</code>.</span>\r\n<template class=\"st\">path = \"src/app/main\"\r\n# create module: replace \"/\" with \".\"\r\n</template>\r\n<template class=\"ts\">assert module == \"src.app.main\"\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 8.</b> Given <code>filename = \"bao_cao.txt\"</code>, create <code>is_txt</code> = whether the name ends with <code>\".txt\"</code> (use <code>.endswith</code>; the result is <code>True</code>/<code>False</code>).</span>\r\n<template class=\"st\">filename = \"bao_cao.txt\"\r\n# create is_txt = does filename end with \".txt\"?\r\n</template>\r\n<template class=\"ts\">assert is_txt is True\r\n</template></div>\r\n\r\n<h4>8. f-strings — insert and format</h4>\r\n<p>The modern, most readable way to put values into a string: add <code>f</code> before the quote and put variables (or expressions) in <code>{ }</code>.</p>\r\n<pre>name = \"Minh\"\r\nage = 15\r\nprint(f\"Name is {name}, age {age}\")   # Name is Minh, age 15\r\nprint(f\"Next year: {age + 1}\")         # compute right inside { }</pre>\r\n<p>f-strings also <b>format</b> the value after a colon <code>:</code></p>\r\n<pre>price = 2500000\r\nprint(f\"{price:,} VND\")     # 2,500,000 VND  — thousands separator\r\nscore = 8.6666\r\nprint(f\"{score:.2f}\")       # 8.67           — round to 2 decimals\r\nname = \"Minh\"\r\nprint(f\"|{name:&gt;10}|\")     # |      Minh|   — right-align, width 10\r\nprint(f\"|{name:&lt;10}|\")     # |Minh      |   — left-align\r\nprint(f\"|{name:^10}|\")     # |   Minh   |   — center</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 9.</b> Given <code>price = 2500000</code>, use an f-string to create <code>display</code> = <code>\"2,500,000 VND\"</code> (with thousands separators).</span>\r\n<template class=\"st\">price = 2500000\r\n# create display with an f-string using {price:,}\r\n</template>\r\n<template class=\"ts\">assert display == \"2,500,000 VND\"\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 10.</b> Given <code>score = 8.6666</code>, use an f-string to create <code>rounded</code> = <code>\"8.67\"</code> (rounded to 2 decimals).</span>\r\n<template class=\"st\">score = 8.6666\r\n# create rounded with an f-string using {score:.2f}\r\n</template>\r\n<template class=\"ts\">assert rounded == \"8.67\"\r\n</template></div>\r\n\r\n<h4>9. Splitting & joining (preview)</h4>\r\n<p>Two very useful methods (covered in depth in lesson 19):</p>\r\n<ul>\r\n<li><code>\"a,b,c\".split(\",\")</code> → <code>['a', 'b', 'c']</code> — <b>split</b> a string into a list.</li>\r\n<li><code>\"-\".join([\"a\", \"b\", \"c\"])</code> → <code>\"a-b-c\"</code> — <b>join</b> a list into a string.</li>\r\n</ul>\r\n<pre class=\"run\">full_name = \"Nguyen Van Minh\"\r\nparts = full_name.split(\" \")     # ['Nguyen', 'Van', 'Minh']\r\nprint(parts)\r\nprint(len(parts), \"words\")       # 3 words</pre>\r\n<p>You can also <b>chain methods</b> — they run left to right:</p>\r\n<pre class=\"run\">raw = \"  Hello WORLD  \"\r\nprint(raw.strip().lower())       # 'hello world'</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 11.</b> Given <code>sentence = \"python la ngon ngu\"</code>, split it into a list of words (by space), then store the <b>word count</b> in <code>word_count</code> (use <code>split</code> then <code>len</code>).</span>\r\n<template class=\"st\">sentence = \"python la ngon ngu\"\r\n# split into words, count them -> word_count\r\n</template>\r\n<template class=\"ts\">assert word_count == 4\r\n</template></div>\r\n\r\n<div class=\"recap\">Recap of lesson 2: a string is a sequence of characters indexed from 0 (negatives from the end) · <code>len()</code> for length · <code>[a:b]</code> to slice · <code>+</code> joins, <code>*</code> repeats · <code>\\n \\t \\\" \\\\</code> escapes · strings are <b>immutable</b> — methods return new strings · <code>.strip/.lower/.upper/.title/.replace/.startswith/.endswith/.count/.find/.split</code> · <code>in</code> to test containment · f-string <code>f\"{var:format}\"</code> to insert and format. Next: making decisions with if/elif/else.</div>\r\n\r\n<div class=\"ex stretch\" data-kind=\"py\"><span class=\"exq\"><b>🔥 Stretch.</b> Given <code>full = \"  John.DOE@Company.com  \"</code>, create <code>username</code> = the part <b>before</b> <code>@</code>, normalized (strip + lower), and <code>domain</code> = the part <b>after</b> <code>@</code>, normalized. Result: <code>username = \"john.doe\"</code>, <code>domain = \"company.com\"</code>. (Hint: <code>.strip().lower()</code> first, then <code>.find(\"@\")</code> and slicing.)</span>\r\n<template class=\"st\">full = \"  John.DOE@Company.com  \"\r\n# create username and domain\r\n</template>\r\n<template class=\"ts\">assert username == \"john.doe\"\r\nassert domain == \"company.com\"\r\n</template></div>\r\n\r\n<h4>🏠 Homework</h4>\r\n<p>Do this at home, outside the 2-hour class. Four questions; the last is a stretch.</p>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Homework 1.</b> Given <code>full = \"  John.Doe@Company.com  \"</code>: (1) create <code>email</code> = normalized (strip + lower); (2) create <code>username</code> = the part before <code>@</code>; (3) create <code>message</code> = <code>f\"user: {username}\"</code> → <code>\"user: john.doe\"</code>.</span>\r\n<template class=\"st\">full = \"  John.Doe@Company.com  \"\r\n# create email, username, message\r\n</template>\r\n<template class=\"ts\">assert email == \"john.doe@company.com\"\r\nassert username == \"john.doe\"\r\nassert message == \"user: john.doe\"\r\n</template></div>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Homework 2.</b> Given <code>name = \"nguyen van a\"</code>, create <code>proper</code> = the name with each word capitalized (use <code>.title()</code>) → <code>\"Nguyen Van A\"</code>.</span>\r\n<template class=\"st\">name = \"nguyen van a\"\r\n# create proper with .title()\r\n</template>\r\n<template class=\"ts\">assert proper == \"Nguyen Van A\"\r\n</template></div>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Homework 3.</b> Given <code>filename = \"report.final.txt\"</code>, create <code>ext</code> = the extension (after the last dot) → <code>\"txt\"</code> (hint: <code>.split(\".\")</code> then take <code>[-1]</code>).</span>\r\n<template class=\"st\">filename = \"report.final.txt\"\r\n# create ext = the file extension\r\n</template>\r\n<template class=\"ts\">assert ext == \"txt\"\r\n</template></div>\r\n<div class=\"ex homework stretch\" data-kind=\"py\"><span class=\"exq\"><b>🔥 Homework 4 (stretch).</b> Given <code>email = \"john.doe@example.com\"</code>, create <code>masked</code> = the login masked: keep the first character, replace the rest of the name before <code>@</code> with <code>\"***\"</code>, keep the part after <code>@</code> → <code>\"j***@example.com\"</code>. (Hint: <code>.find(\"@\")</code> and slicing.)</span>\r\n<template class=\"st\">email = \"john.doe@example.com\"\r\n# create masked = \"j***@example.com\"\r\n</template>\r\n<template class=\"ts\">assert masked == \"j***@example.com\"\r\n</template></div>"}},{"t":{"vi":"Điều kiện: if / elif / else","en":"Conditions: if / elif / else"},"html":{"vi":"<h3>Bài 3 — Điều kiện: if / elif / else</h3>\r\n<p>Đến giờ chương trình của chúng ta chạy thẳng một mạch từ trên xuống. Nhưng phần mềm thật phải <b>ra quyết định</b>: đủ tuổi thì cho vào, sai mật khẩu thì báo lỗi, đơn từ 500k thì giảm giá. Bài này dạy máy tính <b>chọn đường đi</b> dựa trên điều kiện.</p>\r\n\r\n<h4>1. So sánh — nền tảng của mọi quyết định</h4>\r\n<p>Một <b>phép so sánh</b> luôn cho kết quả kiểu <code>bool</code>: <code>True</code> (đúng) hoặc <code>False</code> (sai).</p>\r\n<pre class=\"run\">print(7 &gt; 3)      # True\r\nprint(7 &lt; 3)      # False\r\nprint(5 == 5)     # True  — BANG NHAU? (hai sign bang)\r\nprint(5 != 4)     # True  — KHAC NHAU?\r\nprint(5 &gt;= 5)     # True  — lon hon hoac bang\r\nprint(5 &lt;= 4)     # False — nho hon hoac bang</pre>\r\n<p><b>Cực kỳ quan trọng:</b> <code>=</code> là <i>gán</i> (bỏ giá trị vào biến), còn <code>==</code> là <i>so sánh</i> (hỏi có bằng nhau không). Nhầm hai cái này là lỗi kinh điển của người mới.</p>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 1.</b> Cho <code>a = 7</code> và <code>b = 10</code>. Tạo biến <code>a_is_smaller</code> = kết quả so sánh <code>a</code> có nhỏ hơn <code>b</code> hay không (kết quả là <code>True</code>/<code>False</code>).</span>\r\n<template class=\"st\">a = 7\r\nb = 10\r\n# tao a_is_smaller = a co nho hon b khong?\r\n</template>\r\n<template class=\"ts\">assert a_is_smaller is True\r\n</template></div>\r\n\r\n<h4>2. <code>if</code> — làm gì đó KHI điều kiện đúng</h4>\r\n<p>Cấu trúc: từ khóa <code>if</code>, một điều kiện, dấu hai chấm <code>:</code>, rồi <b>khối lệnh thụt vào</b> bên dưới.</p>\r\n<pre class=\"run\">temperature = 39\r\nif temperature &gt; 37.5:\r\n    print(\"Ban bi sot!\")     # dong nay THUT VAO -> thuoc if\r\nprint(\"Da kiem tra xong\")    # dong nay KHONG thut -> luon chay</pre>\r\n<p><b>Thụt lề (indentation) quyết định mọi thứ trong Python.</b> Những dòng thụt vào cùng một mức tạo thành một <b>khối</b> chạy chung. Quy ước: thụt <b>4 dấu cách</b>. Thụt sai → lỗi hoặc chạy sai ý.</p>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 2.</b> Biến <code>alert</code> ban đầu là <code>False</code>. Nếu <code>temperature</code> lớn hơn <code>37.5</code> thì đổi <code>alert</code> thành <code>True</code>.</span>\r\n<template class=\"st\">temperature = 38\r\nalert = False\r\n# neu temperature > 37.5 thi alert = True\r\n</template>\r\n<template class=\"ts\">assert alert is True\r\n</template></div>\r\n\r\n<h4>3. <code>else</code> — ngược lại thì làm gì</h4>\r\n<pre class=\"run\">age = 15\r\nif age &gt;= 18:\r\n    print(\"Duoc vao\")\r\nelse:\r\n    print(\"Chua du age\")   # chay khi dieu kien if SAI</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 3.</b> Cho <code>score = 4</code>. Tạo biến <code>result</code> = <code>\"Pass\"</code> nếu <code>score &gt;= 5</code>, ngược lại là <code>\"Fail\"</code>.</span>\r\n<template class=\"st\">score = 4\r\n# tao result bang if/else\r\n</template>\r\n<template class=\"ts\">assert result == \"Fail\"\r\n</template></div>\r\n\r\n<h4>4. <code>elif</code> — nhiều nhánh</h4>\r\n<p>Khi có hơn hai trường hợp, dùng <code>elif</code> (viết tắt của \"else if\"). Python kiểm tra <b>từ trên xuống</b> và chạy <b>nhánh ĐÚNG đầu tiên</b>, rồi bỏ qua phần còn lại.</p>\r\n<pre class=\"run\">score = 7\r\nif score &gt;= 8:\r\n    grade = \"Excellent\"\r\nelif score &gt;= 6.5:\r\n    grade = \"Good\"\r\nelif score &gt;= 5:\r\n    grade = \"Average\"\r\nelse:\r\n    grade = \"Weak\"\r\nprint(grade)      # Kha</pre>\r\n<figure class=\"diagram\">\r\n<svg viewBox=\"0 0 470 340\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"IBM Plex Mono, monospace\" font-size=\"13\">\r\n  <defs>\r\n    <marker id=\"arr3\" markerWidth=\"9\" markerHeight=\"9\" refX=\"6\" refY=\"3\" orient=\"auto\">\r\n      <path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#8FA0BC\"/>\r\n    </marker>\r\n  </defs>\r\n  <polygon points=\"150,18 250,66 150,114 50,66\" fill=\"#0E1626\" stroke=\"#F5B942\"/>\r\n  <text x=\"150\" y=\"62\" text-anchor=\"middle\" fill=\"#F5B942\">score &gt;= 8 ?</text>\r\n  <text x=\"150\" y=\"80\" text-anchor=\"middle\" fill=\"#8FA0BC\">if</text>\r\n  <line x1=\"250\" y1=\"66\" x2=\"330\" y2=\"66\" stroke=\"#8FA0BC\" marker-end=\"url(#arr3)\"/>\r\n  <text x=\"272\" y=\"58\" fill=\"#7FD1C0\">Đúng</text>\r\n  <rect x=\"330\" y=\"48\" width=\"120\" height=\"36\" rx=\"6\" fill=\"#121C30\" stroke=\"#7FD1C0\"/>\r\n  <text x=\"390\" y=\"71\" text-anchor=\"middle\" fill=\"#E8E4D8\">grade = \"Excellent\"</text>\r\n  <line x1=\"150\" y1=\"114\" x2=\"150\" y2=\"152\" stroke=\"#8FA0BC\" marker-end=\"url(#arr3)\"/>\r\n  <text x=\"158\" y=\"138\" fill=\"#E2604C\">Sai</text>\r\n  <polygon points=\"150,152 250,200 150,248 50,200\" fill=\"#0E1626\" stroke=\"#F5B942\"/>\r\n  <text x=\"150\" y=\"196\" text-anchor=\"middle\" fill=\"#F5B942\">score &gt;= 5 ?</text>\r\n  <text x=\"150\" y=\"214\" text-anchor=\"middle\" fill=\"#8FA0BC\">elif</text>\r\n  <line x1=\"250\" y1=\"200\" x2=\"330\" y2=\"200\" stroke=\"#8FA0BC\" marker-end=\"url(#arr3)\"/>\r\n  <text x=\"272\" y=\"192\" fill=\"#7FD1C0\">Đúng</text>\r\n  <rect x=\"330\" y=\"182\" width=\"120\" height=\"36\" rx=\"6\" fill=\"#121C30\" stroke=\"#7FD1C0\"/>\r\n  <text x=\"390\" y=\"205\" text-anchor=\"middle\" fill=\"#E8E4D8\">grade = \"Good/Avg\"</text>\r\n  <line x1=\"150\" y1=\"248\" x2=\"150\" y2=\"286\" stroke=\"#8FA0BC\" marker-end=\"url(#arr3)\"/>\r\n  <text x=\"158\" y=\"272\" fill=\"#E2604C\">Sai (else)</text>\r\n  <rect x=\"90\" y=\"286\" width=\"120\" height=\"34\" rx=\"6\" fill=\"#121C30\" stroke=\"#22304C\"/>\r\n  <text x=\"150\" y=\"308\" text-anchor=\"middle\" fill=\"#E8E4D8\">grade = \"Weak\"</text>\r\n</svg>\r\n<figcaption>Máy kiểm tra từng điều kiện từ trên xuống; gặp nhánh đúng đầu tiên là chạy rồi dừng.</figcaption>\r\n</figure>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 4.</b> Cho <code>score = 7</code>. Tạo <code>grade</code> theo thang: <code>&gt;= 8</code> → <code>\"Excellent\"</code>; <code>&gt;= 6.5</code> → <code>\"Good\"</code>; <code>&gt;= 5</code> → <code>\"Average\"</code>; còn lại → <code>\"Weak\"</code>.</span>\r\n<template class=\"st\">score = 7\r\n# tao grade bang if/elif/else\r\n</template>\r\n<template class=\"ts\">assert grade == \"Good\"\r\n</template></div>\r\n\r\n<h4>5. Thứ tự các nhánh RẤT quan trọng</h4>\r\n<p>Vì Python dừng ở nhánh đúng đầu tiên, viết sai thứ tự sẽ cho kết quả sai. Ví dụ nếu để <code>&gt;= 5</code> lên trước <code>&gt;= 8</code>, thì điểm 9 cũng bị xếp \"Average\" vì nó khớp <code>&gt;= 5</code> trước. <b>Luôn xếp điều kiện chặt nhất (hẹp nhất) lên trên.</b></p>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 5.</b> Cho <code>age = 20</code>. Tạo <code>group</code>: <code>&lt; 13</code> → <code>\"child\"</code>; <code>&lt; 20</code> → <code>\"teen\"</code>; còn lại → <code>\"adult\"</code>.</span>\r\n<template class=\"st\">age = 20\r\n# tao group bang if/elif/else\r\n</template>\r\n<template class=\"ts\">assert group == \"adult\"\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 6.</b> Cho <code>number = -4</code>. Tạo <code>sign</code>: <code>\"positive\"</code> nếu <code>number &gt; 0</code>; <code>\"negative\"</code> nếu <code>number &lt; 0</code>; <code>\"zero\"</code> nếu bằng 0.</span>\r\n<template class=\"st\">number = -4\r\n# tao sign bang if/elif/else\r\n</template>\r\n<template class=\"ts\">assert sign == \"negative\"\r\n</template></div>\r\n\r\n<h4>6. Dùng số dư <code>%</code> để kiểm tra chẵn/lẻ</h4>\r\n<p>Một số chẵn khi chia 2 dư 0. Vậy <code>n % 2 == 0</code> nghĩa là \"n chẵn\".</p>\r\n<pre class=\"run\">n = 10\r\nif n % 2 == 0:\r\n    print(\"even\")\r\nelse:\r\n    print(\"odd\")</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 7.</b> Cho <code>n = 7</code>. Tạo <code>kind</code> = <code>\"even\"</code> nếu <code>n</code> chẵn, ngược lại <code>\"odd\"</code> (gợi ý: dùng <code>% 2</code>).</span>\r\n<template class=\"st\">n = 7\r\n# tao kind dua vao n % 2\r\n</template>\r\n<template class=\"ts\">assert kind == \"odd\"\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 8.</b> Cho <code>hours = 14</code> (giờ trong ngày, 0–23). Tạo <code>part_of_day</code>: <code>&lt; 12</code> → <code>\"morning\"</code>; <code>&lt; 18</code> → <code>\"afternoon\"</code>; còn lại → <code>\"evening\"</code>.</span>\r\n<template class=\"st\">hours = 14\r\n# tao part_of_day bang if/elif/else\r\n</template>\r\n<template class=\"ts\">assert part_of_day == \"afternoon\"\r\n</template></div>\r\n\r\n<h4>7. So sánh chuỗi & kiểm tra \"thuộc về\" (<code>in</code>)</h4>\r\n<p>Điều kiện không chỉ dùng cho số. Bạn có thể so sánh chuỗi bằng <code>==</code>, và kiểm tra một giá trị có nằm trong một nhóm bằng <code>in</code> (danh sách <code>[...]</code> sẽ học kỹ ở bài 5).</p>\r\n<pre class=\"run\">role = \"admin\"\r\nif role == \"admin\":\r\n    print(\"Toan quyen\")\r\n\r\nday = \"T7\"\r\nif day in [\"T7\", \"CN\"]:\r\n    print(\"Cuoi tuan\")</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 9.</b> Cho <code>day = \"CN\"</code>. Tạo <code>is_weekend</code> = <code>True</code> nếu <code>day</code> là <code>\"T7\"</code> hoặc <code>\"CN\"</code> (gợi ý: dùng <code>day in [\"T7\", \"CN\"]</code>).</span>\r\n<template class=\"st\">day = \"CN\"\r\n# tao is_weekend = day thuoc [\"T7\", \"CN\"]?\r\n</template>\r\n<template class=\"ts\">assert is_weekend is True\r\n</template></div>\r\n\r\n<h4>8. Những lỗi thường gặp</h4>\r\n<ul>\r\n<li><b>Quên dấu hai chấm <code>:</code></b> sau điều kiện → lỗi cú pháp.</li>\r\n<li><b>Quên thụt lề</b> hoặc thụt không đều → lỗi <code>IndentationError</code>.</li>\r\n<li><b>Dùng <code>=</code> thay vì <code>==</code></b> trong điều kiện → lỗi.</li>\r\n<li><b>Xếp sai thứ tự elif</b> → chương trình chạy nhưng cho kết quả sai (loại lỗi khó phát hiện nhất).</li>\r\n</ul>\r\n\r\n<div class=\"recap\">Ghi nhớ bài 3: so sánh cho <code>True/False</code> (<code>== != &lt; &gt; &lt;= &gt;=</code>) · <code>if dieu_kien:</code> + khối thụt lề chạy khi đúng · <code>else</code> cho trường hợp còn lại · <code>elif</code> cho nhiều nhánh, chạy nhánh đúng <b>đầu tiên</b> · thứ tự nhánh quan trọng · so sánh chuỗi & <code>in</code> · <code>=</code> gán ≠ <code>==</code> so sánh. Bài sau: kết hợp nhiều điều kiện (and/or/not) và điều kiện lồng nhau.</div>\r\n\r\n<div class=\"ex stretch\" data-kind=\"py\"><span class=\"exq\"><b>🔥 Thử thách (FizzBuzz).</b> Cho <code>n = 15</code>. Tạo <code>result</code>: chia hết cho <b>cả</b> 3 và 5 → <code>\"FizzBuzz\"</code>; chỉ chia hết 3 → <code>\"Fizz\"</code>; chỉ chia hết 5 → <code>\"Buzz\"</code>; còn lại → chuỗi của số đó (<code>str(n)</code>). <i>Nhớ: xét \"cả 3 và 5\" TRƯỚC.</i></span>\r\n<template class=\"st\">n = 15\r\n# tao result theo luat FizzBuzz\r\n</template>\r\n<template class=\"ts\">assert result == \"FizzBuzz\"\r\n</template></div>\r\n\r\n<h4>🏠 Bài tập về nhà</h4>\r\n<p>Làm ở nhà, không tính vào 2 giờ trên lớp. Bốn câu, câu cuối là thử thách.</p>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Bài về nhà 1.</b> Cho <code>income = 15</code> (triệu đồng). Tạo <code>rate</code> (thuế suất, số thực): <code>&lt;= 11</code> → <code>0.0</code>; <code>&lt;= 20</code> → <code>0.1</code>; còn lại → <code>0.2</code>.</span>\r\n<template class=\"st\">income = 15\r\n# tao rate bang if/elif/else\r\n</template>\r\n<template class=\"ts\">assert rate == 0.1\r\n</template></div>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Bài về nhà 2.</b> Cho <code>score = 72</code>. Tạo <code>letter</code> (điểm chữ): <code>&gt;= 90</code> → <code>\"A\"</code>; <code>&gt;= 80</code> → <code>\"B\"</code>; <code>&gt;= 70</code> → <code>\"C\"</code>; <code>&gt;= 60</code> → <code>\"D\"</code>; còn lại → <code>\"F\"</code>.</span>\r\n<template class=\"st\">score = 72\r\n# tao letter bang if/elif/else\r\n</template>\r\n<template class=\"ts\">assert letter == \"C\"\r\n</template></div>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Bài về nhà 3.</b> Cho <code>month = 4</code>. Tạo <code>days</code> = số ngày trong tháng: tháng 2 → <code>28</code>; tháng 4, 6, 9, 11 → <code>30</code>; còn lại → <code>31</code> (gợi ý: <code>month in [4, 6, 9, 11]</code>).</span>\r\n<template class=\"st\">month = 4\r\n# tao days bang if/elif/else\r\n</template>\r\n<template class=\"ts\">assert days == 30\r\n</template></div>\r\n<div class=\"ex homework stretch\" data-kind=\"py\"><span class=\"exq\"><b>🔥 Bài về nhà 4 (thử thách).</b> Cho ba cạnh <code>a = 3</code>, <code>b = 3</code>, <code>c = 5</code> của một tam giác. Tạo <code>kind</code>: nếu cả ba cạnh bằng nhau → <code>\"deu\"</code>; nếu <b>đúng hai</b> cạnh bằng nhau → <code>\"can\"</code>; còn lại → <code>\"thuong\"</code>. Với dữ liệu này (a=b) → <code>\"can\"</code>.</span>\r\n<template class=\"st\">a = 3\r\nb = 3\r\nc = 5\r\n# tao kind: \"deu\" / \"can\" / \"thuong\"\r\n</template>\r\n<template class=\"ts\">assert kind == \"can\"\r\n</template></div>","en":"<h3>Lesson 3 — Conditions: if / elif / else</h3>\r\n<p>So far our programs run straight through, top to bottom. But real software has to <b>make decisions</b>: old enough → let them in, wrong password → show an error, order over 500k → apply a discount. This lesson teaches the computer to <b>choose a path</b> based on a condition.</p>\r\n\r\n<h4>1. Comparisons — the basis of every decision</h4>\r\n<p>A <b>comparison</b> always produces a <code>bool</code>: <code>True</code> or <code>False</code>.</p>\r\n<pre class=\"run\">print(7 &gt; 3)      # True\r\nprint(7 &lt; 3)      # False\r\nprint(5 == 5)     # True  — EQUAL? (two equals signs)\r\nprint(5 != 4)     # True  — NOT equal?\r\nprint(5 &gt;= 5)     # True  — greater or equal\r\nprint(5 &lt;= 4)     # False — less or equal</pre>\r\n<p><b>Very important:</b> <code>=</code> is <i>assignment</i> (put a value into a variable), while <code>==</code> is <i>comparison</i> (ask whether two things are equal). Mixing them up is a classic beginner bug.</p>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 1.</b> Given <code>a = 7</code> and <code>b = 10</code>, create <code>a_is_smaller</code> = whether <code>a</code> is less than <code>b</code> (result is <code>True</code>/<code>False</code>).</span>\r\n<template class=\"st\">a = 7\r\nb = 10\r\n# create a_is_smaller = is a less than b?\r\n</template>\r\n<template class=\"ts\">assert a_is_smaller is True\r\n</template></div>\r\n\r\n<h4>2. <code>if</code> — do something WHEN a condition is true</h4>\r\n<p>Structure: the keyword <code>if</code>, a condition, a colon <code>:</code>, then an <b>indented block</b> below.</p>\r\n<pre class=\"run\">temperature = 39\r\nif temperature &gt; 37.5:\r\n    print(\"You have a fever!\")   # this line is INDENTED -> belongs to if\r\nprint(\"Check complete\")          # NOT indented -> always runs</pre>\r\n<p><b>Indentation decides everything in Python.</b> Lines indented to the same level form a <b>block</b> that runs together. Convention: indent by <b>4 spaces</b>. Wrong indentation → an error, or the wrong behavior.</p>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 2.</b> <code>alert</code> starts as <code>False</code>. If <code>temperature</code> is greater than <code>37.5</code>, set <code>alert</code> to <code>True</code>.</span>\r\n<template class=\"st\">temperature = 38\r\nalert = False\r\n# if temperature > 37.5 then alert = True\r\n</template>\r\n<template class=\"ts\">assert alert is True\r\n</template></div>\r\n\r\n<h4>3. <code>else</code> — otherwise, do this</h4>\r\n<pre class=\"run\">age = 15\r\nif age &gt;= 18:\r\n    print(\"Come in\")\r\nelse:\r\n    print(\"Too young\")     # runs when the if condition is FALSE</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 3.</b> Given <code>score = 4</code>, create <code>result</code> = <code>\"Pass\"</code> if <code>score &gt;= 5</code>, otherwise <code>\"Fail\"</code>.</span>\r\n<template class=\"st\">score = 4\r\n# create result with if/else\r\n</template>\r\n<template class=\"ts\">assert result == \"Fail\"\r\n</template></div>\r\n\r\n<h4>4. <code>elif</code> — many branches</h4>\r\n<p>When there are more than two cases, use <code>elif</code> (short for \"else if\"). Python checks <b>top to bottom</b> and runs the <b>first TRUE branch</b>, skipping the rest.</p>\r\n<pre class=\"run\">score = 7\r\nif score &gt;= 8:\r\n    grade = \"Excellent\"\r\nelif score &gt;= 6.5:\r\n    grade = \"Good\"\r\nelif score &gt;= 5:\r\n    grade = \"Average\"\r\nelse:\r\n    grade = \"Weak\"\r\nprint(grade)      # Kha</pre>\r\n<figure class=\"diagram\">\r\n<svg viewBox=\"0 0 470 340\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"IBM Plex Mono, monospace\" font-size=\"13\">\r\n  <defs>\r\n    <marker id=\"arr3e\" markerWidth=\"9\" markerHeight=\"9\" refX=\"6\" refY=\"3\" orient=\"auto\">\r\n      <path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#8FA0BC\"/>\r\n    </marker>\r\n  </defs>\r\n  <polygon points=\"150,18 250,66 150,114 50,66\" fill=\"#0E1626\" stroke=\"#F5B942\"/>\r\n  <text x=\"150\" y=\"62\" text-anchor=\"middle\" fill=\"#F5B942\">score &gt;= 8 ?</text>\r\n  <text x=\"150\" y=\"80\" text-anchor=\"middle\" fill=\"#8FA0BC\">if</text>\r\n  <line x1=\"250\" y1=\"66\" x2=\"330\" y2=\"66\" stroke=\"#8FA0BC\" marker-end=\"url(#arr3e)\"/>\r\n  <text x=\"272\" y=\"58\" fill=\"#7FD1C0\">True</text>\r\n  <rect x=\"330\" y=\"48\" width=\"120\" height=\"36\" rx=\"6\" fill=\"#121C30\" stroke=\"#7FD1C0\"/>\r\n  <text x=\"390\" y=\"71\" text-anchor=\"middle\" fill=\"#E8E4D8\">grade = \"Excellent\"</text>\r\n  <line x1=\"150\" y1=\"114\" x2=\"150\" y2=\"152\" stroke=\"#8FA0BC\" marker-end=\"url(#arr3e)\"/>\r\n  <text x=\"158\" y=\"138\" fill=\"#E2604C\">False</text>\r\n  <polygon points=\"150,152 250,200 150,248 50,200\" fill=\"#0E1626\" stroke=\"#F5B942\"/>\r\n  <text x=\"150\" y=\"196\" text-anchor=\"middle\" fill=\"#F5B942\">score &gt;= 5 ?</text>\r\n  <text x=\"150\" y=\"214\" text-anchor=\"middle\" fill=\"#8FA0BC\">elif</text>\r\n  <line x1=\"250\" y1=\"200\" x2=\"330\" y2=\"200\" stroke=\"#8FA0BC\" marker-end=\"url(#arr3e)\"/>\r\n  <text x=\"272\" y=\"192\" fill=\"#7FD1C0\">True</text>\r\n  <rect x=\"330\" y=\"182\" width=\"120\" height=\"36\" rx=\"6\" fill=\"#121C30\" stroke=\"#7FD1C0\"/>\r\n  <text x=\"390\" y=\"205\" text-anchor=\"middle\" fill=\"#E8E4D8\">grade = \"Good/Avg\"</text>\r\n  <line x1=\"150\" y1=\"248\" x2=\"150\" y2=\"286\" stroke=\"#8FA0BC\" marker-end=\"url(#arr3e)\"/>\r\n  <text x=\"158\" y=\"272\" fill=\"#E2604C\">False (else)</text>\r\n  <rect x=\"90\" y=\"286\" width=\"120\" height=\"34\" rx=\"6\" fill=\"#121C30\" stroke=\"#22304C\"/>\r\n  <text x=\"150\" y=\"308\" text-anchor=\"middle\" fill=\"#E8E4D8\">grade = \"Weak\"</text>\r\n</svg>\r\n<figcaption>The computer checks each condition top to bottom; it runs the first true branch, then stops.</figcaption>\r\n</figure>\r\n<div
