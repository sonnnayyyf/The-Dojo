>\r\n<svg viewBox=\"0 0 340 100\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11\">\r\n  <defs>\r\n    <marker id=\"a18\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\">\r\n      <path d=\"M0 0 L10 5 L0 10 z\" fill=\"#F5B942\"/>\r\n    </marker>\r\n  </defs>\r\n  <rect x=\"24\" y=\"36\" width=\"110\" height=\"32\" rx=\"7\" fill=\"#121C30\" stroke=\"#22304C\"/>\r\n  <text x=\"79\" y=\"57\" text-anchor=\"middle\" fill=\"#E8E4D8\">\"a b c\"</text>\r\n  <rect x=\"206\" y=\"36\" width=\"120\" height=\"32\" rx=\"7\" fill=\"#0E1626\" stroke=\"#22304C\"/>\r\n  <text x=\"266\" y=\"57\" text-anchor=\"middle\" fill=\"#7FD1C0\">[\"a\",\"b\",\"c\"]</text>\r\n  <g stroke=\"#F5B942\" stroke-width=\"1.4\" marker-end=\"url(#a18)\" fill=\"none\">\r\n    <line x1=\"136\" y1=\"45\" x2=\"204\" y2=\"45\"/>\r\n    <line x1=\"204\" y1=\"60\" x2=\"136\" y2=\"60\"/>\r\n  </g>\r\n  <text x=\"170\" y=\"40\" text-anchor=\"middle\" fill=\"#F5B942\" font-size=\"10\">.split()</text>\r\n  <text x=\"170\" y=\"74\" text-anchor=\"middle\" fill=\"#7FD1C0\" font-size=\"10\">\" \".join(...)</text>\r\n</svg>\r\n<figcaption><code>split</code> turns a string into a list of pieces; <code>join</code> turns a list of pieces back into a string. They're opposites.</figcaption>\r\n</figure>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 1.</b> Given <code>text = \"the quick brown fox\"</code>, build <code>words</code> = the list of words → <code>['the', 'quick', 'brown', 'fox']</code>.</span>\r\n<template class=\"st\">text = \"the quick brown fox\"\r\nwords = []\r\n# split into words\r\n</template>\r\n<template class=\"ts\">assert words == [\"the\", \"quick\", \"brown\", \"fox\"]\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 2.</b> Given <code>row = \"apple,pear,plum\"</code>, build <code>parts</code> = the list split on commas → <code>['apple', 'pear', 'plum']</code>.</span>\r\n<template class=\"st\">row = \"apple,pear,plum\"\r\nparts = []\r\n# split on commas\r\n</template>\r\n<template class=\"ts\">assert parts == [\"apple\", \"pear\", \"plum\"]\r\n</template></div>\r\n\r\n<h4>2. Joining pieces back together</h4>\r\n<p><code>separator.join(list)</code> glues a list of strings into one, putting the separator between each. Note the separator goes first: <code>\", \".join(items)</code>.</p>\r\n<pre class=\"run\">print(\" \".join([\"Hello\", \"world\"]))      # Hello world\r\nprint(\"-\".join([\"2024\", \"01\", \"15\"]))    # 2024-01-15\r\nprint(\", \".join([\"a\", \"b\", \"c\"]))        # a, b, c</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 3.</b> Given <code>bits = [\"2024\", \"01\", \"15\"]</code>, join them with <code>\"-\"</code> into <code>date</code> → <code>\"2024-01-15\"</code>.</span>\r\n<template class=\"st\">bits = [\"2024\", \"01\", \"15\"]\r\ndate = \"\"\r\n# join with dashes\r\n</template>\r\n<template class=\"ts\">assert date == \"2024-01-15\"\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 4.</b> Given <code>words = [\"learn\", \"by\", \"doing\"]</code>, join them with a space into <code>sentence</code> → <code>\"learn by doing\"</code>.</span>\r\n<template class=\"st\">words = [\"learn\", \"by\", \"doing\"]\r\nsentence = \"\"\r\n# join with spaces\r\n</template>\r\n<template class=\"ts\">assert sentence == \"learn by doing\"\r\n</template></div>\r\n\r\n<h4>3. Cleaning up text</h4>\r\n<p>Three cleaners you'll use constantly: <code>strip()</code> removes leading/trailing spaces, <code>lower()</code> makes everything lowercase (so <code>\"Cat\"</code> and <code>\"cat\"</code> match), and <code>replace(old, new)</code> swaps one substring for another.</p>\r\n<pre class=\"run\">print(\"  Hello World  \".strip())    # \"Hello World\"\r\nprint(\"SHOUT\".lower())             # \"shout\"\r\nprint(\"a.b.c\".replace(\".\", \"/\"))   # \"a/b/c\"</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 5.</b> Given <code>raw = \"  Hello World  \"</code>, remove the spaces at both ends into <code>clean</code> → <code>\"Hello World\"</code>.</span>\r\n<template class=\"st\">raw = \"  Hello World  \"\r\nclean = \"\"\r\n# strip the outer spaces\r\n</template>\r\n<template class=\"ts\">assert clean == \"Hello World\"\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 6.</b> Given <code>word = \"SHOUT\"</code>, make it lowercase into <code>quiet</code> → <code>\"shout\"</code>.</span>\r\n<template class=\"st\">word = \"SHOUT\"\r\nquiet = \"\"\r\n# lowercase it\r\n</template>\r\n<template class=\"ts\">assert quiet == \"shout\"\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 7.</b> Given <code>path = \"a.b.c\"</code>, replace every <code>\".\"</code> with <code>\"/\"</code> into <code>fixed</code> → <code>\"a/b/c\"</code>.</span>\r\n<template class=\"st\">path = \"a.b.c\"\r\nfixed = \"\"\r\n# replace dots with slashes\r\n</template>\r\n<template class=\"ts\">assert fixed == \"a/b/c\"\r\n</template></div>\r\n\r\n<h4>4. Searching inside text</h4>\r\n<p>To ask questions about text: <code>len(text.split())</code> counts words, <code>text.count(x)</code> counts how many times something appears, and <code>x in words</code> checks membership.</p>\r\n<pre class=\"run\">text = \"the cat sat on the mat\"\r\nprint(len(text.split()))     # 6  — six words\r\nprint(text.count(\"the\"))     # 2  — \"the\" appears twice\r\nprint(\"cat\" in text.split()) # True</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 8.</b> Given <code>text = \"one two three four\"</code>, set <code>word_count</code> to the number of words. Result <code>4</code>.</span>\r\n<template class=\"st\">text = \"one two three four\"\r\nword_count = 0\r\n# count the words\r\n</template>\r\n<template class=\"ts\">assert word_count == 4\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 9.</b> Given <code>word = \"banana\"</code>, set <code>a_count</code> to how many times <code>\"a\"</code> appears. Result <code>3</code>.</span>\r\n<template class=\"st\">word = \"banana\"\r\na_count = 0\r\n# count the letter \"a\"\r\n</template>\r\n<template class=\"ts\">assert a_count == 3\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 10.</b> Given <code>text = \"the cat sat on the mat\"</code>, set <code>has_dog</code> to whether <code>\"dog\"</code> is one of the words. Result <code>False</code>.</span>\r\n<template class=\"st\">text = \"the cat sat on the mat\"\r\nhas_dog = None\r\n# is \"dog\" among the words?\r\n</template>\r\n<template class=\"ts\">assert has_dog == False\r\n</template></div>\r\n<div class=\"ex stretch\" data-kind=\"py\"><span class=\"exq\"><b>🔥 Stretch (most common word).</b> Given <code>text = \"red blue red green red blue\"</code>, find the word that appears the most into <code>top</code>. Split into words, count with a dictionary, then pick the biggest. Result <code>\"red\"</code>.</span>\r\n<template class=\"st\">text = \"red blue red green red blue\"\r\ntop = \"\"\r\n# split, count each word, find the most common\r\n</template>\r\n<template class=\"ts\">assert top == \"red\"\r\n</template></div>\r\n\r\n<div class=\"recap\">Recap of lesson 18: <code>split()</code> breaks text into a list of pieces (pass a separator like <code>\",\"</code> for other formats) · <code>sep.join(list)</code> glues a list back into a string · clean with <code>strip()</code> (outer spaces), <code>lower()</code> (case), and <code>replace(old, new)</code> · search with <code>len(text.split())</code>, <code>text.count(x)</code>, and <code>x in words</code> · together these normalise messy text into tidy data. Next: a <b>review</b> lesson to pull everything together and get ready for your capstone.</div>\r\n\r\n<h4>🏠 Homework</h4>\r\n<p>Four graded exercises — do them right here before the next lesson.</p>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Homework 1.</b> Given <code>path = \"home/user/file.txt\"</code>, build <code>parts</code> = the list split on <code>\"/\"</code> → <code>['home', 'user', 'file.txt']</code>.</span>\r\n<template class=\"st\">path = \"home/user/file.txt\"\r\nparts = []\r\n# split on slashes\r\n</template>\r\n<template class=\"ts\">assert parts == [\"home\", \"user\", \"file.txt\"]\r\n</template></div>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Homework 2.</b> Given <code>tags = [\"python\", \"sql\", \"qa\"]</code>, join them with <code>\", \"</code> into <code>line</code> → <code>\"python, sql, qa\"</code>.</span>\r\n<template class=\"st\">tags = [\"python\", \"sql\", \"qa\"]\r\nline = \"\"\r\n# join with \", \"\r\n</template>\r\n<template class=\"ts\">assert line == \"python, sql, qa\"\r\n</template></div>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Homework 3.</b> Given <code>raw = \"  Data Science  \"</code>, strip the outer spaces and lowercase it into <code>clean</code> → <code>\"data science\"</code>.</span>\r\n<template class=\"st\">raw = \"  Data Science  \"\r\nclean = \"\"\r\n# strip, then lowercase\r\n</template>\r\n<template class=\"ts\">assert clean == \"data science\"\r\n</template></div>\r\n<div class=\"ex homework stretch\" data-kind=\"py\"><span class=\"exq\"><b>🔥 Homework 4 (stretch).</b> Given <code>text = \"Cat cat CAT dog\"</code> and <code>word = \"cat\"</code>, set <code>count</code> to how many times <code>word</code> appears, <b>ignoring case</b>. Result <code>3</code>. (Lowercase the text, split it, then count.)</span>\r\n<template class=\"st\">text = \"Cat cat CAT dog\"\r\nword = \"cat\"\r\ncount = 0\r\n# count case-insensitively\r\n</template>\r\n<template class=\"ts\">assert count == 3\r\n</template></div>"}},{"t":{"vi":"Ôn tập & chuẩn bị đồ án","en":"Review & capstone prep"},"html":{"vi":"<h3>Bài 19 — Ôn tập &amp; chuẩn bị đồ án</h3>\r\n<p>Bạn đã tới cuối phần căn bản. Nhìn lại chặng đường đã đi: biến và chuỗi, điều kiện, vòng lặp, list, dictionary, hàm, xử lý lỗi, tuple, set, sắp xếp, và xử lý văn bản. Đó thật sự là mọi thứ bạn cần để xây những chương trình nhỏ, hữu ích — và ở bài cuối cùng kế tiếp, bạn sẽ tự xây một cái của riêng mình.</p>\r\n<p>Bài này là để <b>củng cố</b>. Không có cú pháp mới; thay vào đó ta kết hợp những gì bạn đã biết thành hình dáng mà chương trình thật mang: nhận đầu vào thô, <b>phân tích (parse)</b> thành dữ liệu có cấu trúc, <b>phân tích số liệu</b>, và tạo ra một <b>bản báo cáo</b>. Mỗi bài tập ở đây là một mảnh nhỏ đúng của quy trình đó — và là buổi tổng duyệt trực tiếp cho đồ án tốt nghiệp.</p>\r\n<p>Nếu bài tập nào thấy chông chênh, đó là thông tin hữu ích: quay lại bài đó ôn nhanh trước khi làm đồ án. Cứ thong thả; đây là lúc mọi thứ ghép lại với nhau.</p>\r\n\r\n<h4>1. Hình dáng của một chương trình thật</h4>\r\n<p>Hầu hết chương trình hữu ích theo cùng một dòng chảy: đầu vào lộn xộn đi vào, bạn biến nó thành bản ghi gọn gàng, tính toán gì đó, rồi trình bày kết quả. Mỗi giai đoạn chỉ là những kỹ năng bạn đã có.</p>\r\n<figure class=\"diagram\">\r\n<svg viewBox=\"0 0 380 96\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"IBM Plex Mono, monospace\" font-size=\"10.5\">\r\n  <defs>\r\n    <marker id=\"a19v\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\">\r\n      <path d=\"M0 0 L10 5 L0 10 z\" fill=\"#F5B942\"/>\r\n    </marker>\r\n  </defs>\r\n  <g stroke=\"#22304C\" fill=\"#121C30\">\r\n    <rect x=\"8\" y=\"36\" width=\"74\" height=\"34\" rx=\"7\"/>\r\n    <rect x=\"106\" y=\"36\" width=\"74\" height=\"34\" rx=\"7\"/>\r\n    <rect x=\"204\" y=\"36\" width=\"74\" height=\"34\" rx=\"7\"/>\r\n    <rect x=\"302\" y=\"36\" width=\"70\" height=\"34\" rx=\"7\"/>\r\n  </g>\r\n  <g fill=\"#E8E4D8\" text-anchor=\"middle\">\r\n    <text x=\"45\" y=\"52\">văn bản thô</text><text x=\"45\" y=\"64\" fill=\"#8FA0BC\" font-size=\"9\">split</text>\r\n    <text x=\"143\" y=\"52\" fill=\"#7FD1C0\">bản ghi</text><text x=\"143\" y=\"64\" fill=\"#8FA0BC\" font-size=\"9\">list of dicts</text>\r\n    <text x=\"241\" y=\"52\" fill=\"#F5B942\">phân tích</text><text x=\"241\" y=\"64\" fill=\"#8FA0BC\" font-size=\"9\">đếm/sắp</text>\r\n    <text x=\"337\" y=\"52\">báo cáo</text><text x=\"337\" y=\"64\" fill=\"#8FA0BC\" font-size=\"9\">tóm tắt</text>\r\n  </g>\r\n  <g stroke=\"#F5B942\" stroke-width=\"1.4\" marker-end=\"url(#a19v)\" fill=\"none\">\r\n    <line x1=\"82\" y1=\"53\" x2=\"104\" y2=\"53\"/><line x1=\"180\" y1=\"53\" x2=\"202\" y2=\"53\"/><line x1=\"278\" y1=\"53\" x2=\"300\" y2=\"53\"/>\r\n  </g>\r\n</svg>\r\n<figcaption>Parse → cấu trúc → phân tích → báo cáo. Đồ án tốt nghiệp chỉ là quy trình này áp dụng cho một bài toán bạn chọn.</figcaption>\r\n</figure>\r\n<pre class=\"run\">def parse_score(line):\r\n    name, score = line.split(\",\")\r\n    return (name, int(score))\r\n\r\nprint(parse_score(\"Anna,85\"))   # ('Anna', 85)</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 1.</b> Định nghĩa <code>parse_score</code> nhận một dòng như <code>\"Anna,85\"</code> và trả về tuple <code>(name, score)</code> với score là <code>int</code>. Vậy <code>parse_score(\"Anna,85\")</code> là <code>(\"Anna\", 85)</code>.</span>\r\n<template class=\"st\">def parse_score(line):\r\n    # split on the comma, convert the score to int\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert parse_score(\"Anna,85\") == (\"Anna\", 85)\r\nassert parse_score(\"Ben,90\") == (\"Ben\", 90)\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 2.</b> Định nghĩa <code>safe_parse</code> hoạt động như <code>parse_score</code> nhưng trả về <code>None</code> nếu dòng bị lỗi (không có dấu phẩy, hoặc score không phải số). Vậy <code>safe_parse(\"Anna,85\")</code> là <code>(\"Anna\", 85)</code> và <code>safe_parse(\"oops\")</code> là <code>None</code>.</span>\r\n<template class=\"st\">def safe_parse(line):\r\n    # parse safely; return None on bad input\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert safe_parse(\"Anna,85\") == (\"Anna\", 85)\r\nassert safe_parse(\"oops\") is None\r\nassert safe_parse(\"Ben,xx\") is None\r\n</template></div>\r\n\r\n<h4>2. Phân tích các bản ghi</h4>\r\n<p>Khi dữ liệu đã là một list các tuple <code>(name, score)</code>, mọi kỹ năng vòng lặp, tính tổng và lọc của bạn áp dụng trực tiếp.</p>\r\n<pre class=\"run\">records = [(\"A\", 50), (\"B\", 80), (\"C\", 65)]\r\ntotal = 0\r\nfor name, score in records:\r\n    total += score\r\nprint(total)   # 195</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 3.</b> Định nghĩa <code>total_score</code> cộng các score trong một list tuple <code>(name, score)</code>. Vậy <code>total_score([(\"A\", 10), (\"B\", 20), (\"C\", 5)])</code> là <code>35</code>.</span>\r\n<template class=\"st\">def total_score(records):\r\n    # sum every score\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert total_score([(\"A\", 10), (\"B\", 20), (\"C\", 5)]) == 35\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 4.</b> Định nghĩa <code>average_score</code> trả về score trung bình của một list bản ghi không rỗng. Vậy <code>average_score([(\"A\", 2), (\"B\", 4)])</code> là <code>3.0</code>.</span>\r\n<template class=\"st\">def average_score(records):\r\n    # return the average score\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert average_score([(\"A\", 2), (\"B\", 4)]) == 3.0\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 5.</b> Định nghĩa <code>passing</code> trả về <b>tên</b> những người có score ít nhất bằng <code>cutoff</code>. Vậy <code>passing([(\"A\", 50), (\"B\", 80), (\"C\", 65)], 60)</code> là <code>[\"B\", \"C\"]</code>.</span>\r\n<template class=\"st\">def passing(records, cutoff):\r\n    # names with score >= cutoff\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert passing([(\"A\", 50), (\"B\", 80), (\"C\", 65)], 60) == [\"B\", \"C\"]\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 6.</b> Định nghĩa <code>ranked_scores</code> chỉ trả về các score, sắp từ cao xuống thấp. Vậy <code>ranked_scores([(\"A\", 50), (\"B\", 80), (\"C\", 65)])</code> là <code>[80, 65, 50]</code>.</span>\r\n<template class=\"st\">def ranked_scores(records):\r\n    # return the scores, highest first\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert ranked_scores([(\"A\", 50), (\"B\", 80), (\"C\", 65)]) == [80, 65, 50]\r\n</template></div>\r\n\r\n<h4>3. Đếm và tìm cái nhiều nhất</h4>\r\n<p>Mẫu đếm cộng với một phép tìm \"lớn nhất tới hiện tại\" — trái tim của mọi báo cáo \"cái gì phổ biến nhất\".</p>\r\n<pre class=\"run\">def count_words(text):\r\n    counts = {}\r\n    for w in text.split():\r\n        counts[w] = counts.get(w, 0) + 1\r\n    return counts\r\n\r\nprint(count_words(\"a b a c a\"))   # {'a': 3, 'b': 1, 'c': 1}</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 7.</b> Định nghĩa <code>count_words</code> trả về một dictionary từ → số lần cho một câu. Vậy <code>count_words(\"a b a c a\")</code> là <code>{'a': 3, 'b': 1, 'c': 1}</code>.</span>\r\n<template class=\"st\">def count_words(text):\r\n    # count each word\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert count_words(\"a b a c a\") == {\"a\": 3, \"b\": 1, \"c\": 1}\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 8.</b> Định nghĩa <code>top_word</code> nhận một dictionary từ → số lần và trả về từ có số đếm cao nhất. Vậy <code>top_word({\"a\": 3, \"b\": 1})</code> là <code>\"a\"</code>.</span>\r\n<template class=\"st\">def top_word(counts):\r\n    # return the key with the biggest value\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert top_word({\"a\": 3, \"b\": 1}) == \"a\"\r\nassert top_word({\"x\": 1, \"y\": 5}) == \"y\"\r\n</template></div>\r\n\r\n<h4>4. Dựng một bản báo cáo</h4>\r\n<p>Vạch đích của một chương trình: gom các con số của bạn thành một bản tóm tắt rõ ràng — thường là một dictionary kết quả.</p>\r\n<pre class=\"run\">records = [(\"A\", 50), (\"B\", 80), (\"C\", 65)]\r\nreport = {\r\n    \"count\": len(records),\r\n    \"total\": sum(score for name, score in records),\r\n}\r\nprint(report)   # {'count': 3, 'total': 195}</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 9.</b> Định nghĩa <code>analyse</code> nhận một list bản ghi không rỗng và trả về một dictionary có <code>count</code>, <code>total</code>, <code>average</code>, và <code>top</code> (tên có score cao nhất). Vậy <code>analyse([(\"A\", 50), (\"B\", 80), (\"C\", 65)])</code> là <code>{\"count\": 3, \"total\": 195, \"average\": 65.0, \"top\": \"B\"}</code>.</span>\r\n<template class=\"st\">def analyse(records):\r\n    # build the summary dictionary\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert analyse([(\"A\", 50), (\"B\", 80), (\"C\", 65)]) == {\"count\": 3, \"total\": 195, \"average\": 65.0, \"top\": \"B\"}\r\n</template></div>\r\n<div class=\"ex stretch\" data-kind=\"py\"><span class=\"exq\"><b>🔥 Nâng cao (bộ phân tích văn bản).</b> Định nghĩa <code>analyse_text</code> nhận một câu và trả về <code>{\"words\": tổng_số_từ, \"unique\": số_từ_khác_nhau, \"top\": từ_phổ_biến_nhất}</code>. Vậy <code>analyse_text(\"red blue red green red\")</code> là <code>{\"words\": 5, \"unique\": 3, \"top\": \"red\"}</code>. Đây là phiên bản thu nhỏ của đồ án tốt nghiệp!</span>\r\n<template class=\"st\">def analyse_text(text):\r\n    # words, unique words, and the most common word\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert analyse_text(\"red blue red green red\") == {\"words\": 5, \"unique\": 3, \"top\": \"red\"}\r\n</template></div>\r\n\r\n<h4>5. Kế tiếp: đồ án tốt nghiệp của bạn</h4>\r\n<p>Ở bài cuối bạn sẽ xây một chương trình nhỏ hoàn chỉnh của riêng mình, trong VS Code thật, và nộp lại. Bạn sẽ chọn từ ba lựa chọn dự án — mỗi cái có hướng dẫn xây dựng từng bước như đồ án nhỏ ở Bài 10, và có chỗ để bạn thêm ý tưởng của mình. Mọi thứ bạn vừa ôn — phân tích cú pháp, bản ghi, đếm, sắp xếp, báo cáo — chính là bộ công cụ bạn sẽ dùng. Bạn đã sẵn sàng.</p>\r\n\r\n<div class=\"recap\">Tóm tắt bài 19: chương trình thật theo một quy trình — <b>parse</b> đầu vào thô thành bản ghi, <b>phân tích</b> bằng vòng lặp/sum/sắp xếp/đếm, và tạo một <b>báo cáo</b> (thường là một dictionary) · <code>try/except</code> giữ việc phân tích vững vàng trước dòng lỗi · mẫu đếm cộng phép tìm \"lớn nhất tới hiện tại\" tìm ra phần tử phổ biến nhất · chúng kết hợp thành những bộ phân tích nhỏ như đồ án tốt nghiệp. Bài sau: <b>tự xây ứng dụng của bạn</b> — ba lựa chọn dự án, sự sáng tạo của bạn, nộp cho giáo viên.</div>\r\n\r\n<h4>🏠 Bài tập về nhà</h4>\r\n<p>Bốn bài tập được chấm điểm — buổi khởi động cuối trước đồ án tốt nghiệp.</p>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Bài về nhà 1.</b> Định nghĩa <code>parse_pair</code> nhận một dòng như <code>\"apple:3\"</code> và trả về tuple <code>(name, count)</code> với count là <code>int</code>. Vậy <code>parse_pair(\"apple:3\")</code> là <code>(\"apple\", 3)</code>.</span>\r\n<template class=\"st\">def parse_pair(line):\r\n    # split on \":\", convert the count to int\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert parse_pair(\"apple:3\") == (\"apple\", 3)\r\nassert parse_pair(\"pen:12\") == (\"pen\", 12)\r\n</template></div>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Bài về nhà 2.</b> Định nghĩa <code>count_words</code> trả về một dictionary từ → số lần cho một câu. Vậy <code>count_words(\"x y x\")</code> là <code>{'x': 2, 'y': 1}</code>.</span>\r\n<template class=\"st\">def count_words(text):\r\n    # count each word\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert count_words(\"x y x\") == {\"x\": 2, \"y\": 1}\r\n</template></div>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Bài về nhà 3.</b> Định nghĩa <code>average</code> trả về trung bình của một list số không rỗng. Vậy <code>average([2, 4, 6])</code> là <code>4.0</code>.</span>\r\n<template class=\"st\">def average(nums):\r\n    # return the average\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert average([2, 4, 6]) == 4.0\r\n</template></div>\r\n<div class=\"ex homework stretch\" data-kind=\"py\"><span class=\"exq\"><b>🔥 Bài về nhà 4 (nâng cao).</b> Định nghĩa <code>report</code> nhận một list số không rỗng và trả về <code>{\"min\": nhỏ_nhất, \"max\": lớn_nhất, \"average\": trung_bình}</code>. Vậy <code>report([2, 4, 6])</code> là <code>{\"min\": 2, \"max\": 6, \"average\": 4.0}</code>. (Dùng <code>min</code>, <code>max</code>, <code>sum</code>.)</span>\r\n<template class=\"st\">def report(nums):\r\n    # build the summary dictionary\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert report([2, 4, 6]) == {\"min\": 2, \"max\": 6, \"average\": 4.0}\r\n</template></div>","en":"<h3>Lesson 19 — Review &amp; capstone prep</h3>\r\n<p>You've reached the end of the fundamentals. Look back at how far you've come: variables and strings, conditions, loops, lists, dictionaries, functions, error handling, tuples, sets, sorting, and text processing. That's genuinely everything you need to build small, useful programs — and in the next and final lesson, you'll build one of your own.</p>\r\n<p>This lesson is a <b>consolidation</b>. There's no new syntax; instead we combine what you already know into the shape real programs take: take raw input, <b>parse</b> it into structured data, <b>analyse</b> it, and produce a <b>report</b>. Every exercise here is a small piece of exactly that pipeline — and a direct rehearsal for your capstone.</p>\r\n<p>If any exercise feels shaky, that's useful information: pop back to that lesson for a quick review before the capstone. Take your time; this is where it all clicks together.</p>\r\n\r\n<h4>1. The shape of a real program</h4>\r\n<p>Most useful programs follow the same flow: messy input comes in, you turn it into tidy records, you compute something, and you present a result. Each stage is just the skills you already have.</p>\r\n<figure class=\"diagram\">\r\n<svg viewBox=\"0 0 380 96\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"IBM Plex Mono, monospace\" font-size=\"10.5\">\r\n  <defs>\r\n    <marker id=\"a19\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\">\r\n      <path d=\"M0 0 L10 5 L0 10 z\" fill=\"#F5B942\"/>\r\n    </marker>\r\n  </defs>\r\n  <g stroke=\"#22304C\" fill=\"#121C30\">\r\n    <rect x=\"8\" y=\"36\" width=\"74\" height=\"34\" rx=\"7\"/>\r\n    <rect x=\"106\" y=\"36\" width=\"74\" height=\"34\" rx=\"7\"/>\r\n    <rect x=\"204\" y=\"36\" width=\"74\" height=\"34\" rx=\"7\"/>\r\n    <rect x=\"302\" y=\"36\" width=\"70\" height=\"34\" rx=\"7\"/>\r\n  </g>\r\n  <g fill=\"#E8E4D8\" text-anchor=\"middle\">\r\n    <text x=\"45\" y=\"52\">raw text</text><text x=\"45\" y=\"64\" fill=\"#8FA0BC\" font-size=\"9\">split</text>\r\n    <text x=\"143\" y=\"52\" fill=\"#7FD1C0\">records</text><text x=\"143\" y=\"64\" fill=\"#8FA0BC\" font-size=\"9\">list of dicts</text>\r\n    <text x=\"241\" y=\"52\" fill=\"#F5B942\">analyse</text><text x=\"241\" y=\"64\" fill=\"#8FA0BC\" font-size=\"9\">count/sort</text>\r\n    <text x=\"337\" y=\"52\">report</text><text x=\"337\" y=\"64\" fill=\"#8FA0BC\" font-size=\"9\">summary</text>\r\n  </g>\r\n  <g stroke=\"#F5B942\" stroke-width=\"1.4\" marker-end=\"url(#a19)\" fill=\"none\">\r\n    <line x1=\"82\" y1=\"53\" x2=\"104\" y2=\"53\"/><line x1=\"180\" y1=\"53\" x2=\"202\" y2=\"53\"/><line x1=\"278\" y1=\"53\" x2=\"300\" y2=\"53\"/>\r\n  </g>\r\n</svg>\r\n<figcaption>Parse → structure → analyse → report. The capstone is just this pipeline applied to a problem you choose.</figcaption>\r\n</figure>\r\n<pre class=\"run\">def parse_score(line):\r\n    name, score = line.split(\",\")\r\n    return (name, int(score))\r\n\r\nprint(parse_score(\"Anna,85\"))   # ('Anna', 85)</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 1.</b> Define <code>parse_score</code> that takes a line like <code>\"Anna,85\"</code> and returns a tuple <code>(name, score)</code> with the score as an <code>int</code>. So <code>parse_score(\"Anna,85\")</code> is <code>(\"Anna\", 85)</code>.</span>\r\n<template class=\"st\">def parse_score(line):\r\n    # split on the comma, convert the score to int\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert parse_score(\"Anna,85\") == (\"Anna\", 85)\r\nassert parse_score(\"Ben,90\") == (\"Ben\", 90)\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 2.</b> Define <code>safe_parse</code> that works like <code>parse_score</code> but returns <code>None</code> if the line is malformed (no comma, or a non-number score). So <code>safe_parse(\"Anna,85\")</code> is <code>(\"Anna\", 85)</code> and <code>safe_parse(\"oops\")</code> is <code>None</code>.</span>\r\n<template class=\"st\">def safe_parse(line):\r\n    # parse safely; return None on bad input\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert safe_parse(\"Anna,85\") == (\"Anna\", 85)\r\nassert safe_parse(\"oops\") is None\r\nassert safe_parse(\"Ben,xx\") is None\r\n</template></div>\r\n\r\n<h4>2. Analysing records</h4>\r\n<p>Once data is a list of <code>(name, score)</code> tuples, all your loop, sum and filter skills apply directly.</p>\r\n<pre class=\"run\">records = [(\"A\", 50), (\"B\", 80), (\"C\", 65)]\r\ntotal = 0\r\nfor name, score in records:\r\n    total += score\r\nprint(total)   # 195</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 3.</b> Define <code>total_score</code> that sums the scores in a list of <code>(name, score)</code> tuples. So <code>total_score([(\"A\", 10), (\"B\", 20), (\"C\", 5)])</code> is <code>35</code>.</span>\r\n<template class=\"st\">def total_score(records):\r\n    # sum every score\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert total_score([(\"A\", 10), (\"B\", 20), (\"C\", 5)]) == 35\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 4.</b> Define <code>average_score</code> that returns the average score of a non-empty record list. So <code>average_score([(\"A\", 2), (\"B\", 4)])</code> is <code>3.0</code>.</span>\r\n<template class=\"st\">def average_score(records):\r\n    # return the average score\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert average_score([(\"A\", 2), (\"B\", 4)]) == 3.0\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 5.</b> Define <code>passing</code> that returns the <b>names</b> whose score is at least <code>cutoff</code>. So <code>passing([(\"A\", 50), (\"B\", 80), (\"C\", 65)], 60)</code> is <code>[\"B\", \"C\"]</code>.</span>\r\n<template class=\"st\">def passing(records, cutoff):\r\n    # names with score >= cutoff\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert passing([(\"A\", 50), (\"B\", 80), (\"C\", 65)], 60) == [\"B\", \"C\"]\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 6.</b> Define <code>ranked_scores</code> that returns just the scores, sorted from highest to lowest. So <code>ranked_scores([(\"A\", 50), (\"B\", 80), (\"C\", 65)])</code> is <code>[80, 65, 50]</code>.</span>\r\n<template class=\"st\">def ranked_scores(records):\r\n    # return the scores, highest first\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert ranked_scores([(\"A\", 50), (\"B\", 80), (\"C\", 65)]) == [80, 65, 50]\r\n</template></div>\r\n\r\n<h4>3. Counting and finding the top</h4>\r\n<p>The counting pattern plus a \"biggest so far\" search — the heart of any \"what's most common\" report.</p>\r\n<pre class=\"run\">def count_words(text):\r\n    counts = {}\r\n    for w in text.split():\r\n        counts[w] = counts.get(w, 0) + 1\r\n    return counts\r\n\r\nprint(count_words(\"a b a c a\"))   # {'a': 3, 'b': 1, 'c': 1}</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 7.</b> Define <code>count_words</code> that returns a word → count dictionary for a sentence. So <code>count_words(\"a b a c a\")</code> is <code>{'a': 3, 'b': 1, 'c': 1}</code>.</span>\r\n<template class=\"st\">def count_words(text):\r\n    # count each word\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert count_words(\"a b a c a\") == {\"a\": 3, \"b\": 1, \"c\": 1}\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 8.</b> Define <code>top_word</code> that takes a word → count dictionary and returns the word with the highest count. So <code>top_word({\"a\": 3, \"b\": 1})</code> is <code>\"a\"</code>.</span>\r\n<template class=\"st\">def top_word(counts):\r\n    # return the key with the biggest value\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert top_word({\"a\": 3, \"b\": 1}) == \"a\"\r\nassert top_word({\"x\": 1, \"y\": 5}) == \"y\"\r\n</template></div>\r\n\r\n<h4>4. Building a report</h4>\r\n<p>The finish line of a program: gather your numbers into one clear summary — usually a dictionary of results.</p>\r\n<pre class=\"run\">records = [(\"A\", 50), (\"B\", 80), (\"C\", 65)]\r\nreport = {\r\n    \"count\": len(records),\r\n    \"total\": sum(score for name, score in records),\r\n}\r\nprint(report)   # {'count': 3, 'total': 195}</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 9.</b> Define <code>analyse</code> that takes a non-empty record list and returns a dictionary with <code>count</code>, <code>total</code>, <code>average</code>, and <code>top</code> (the name with the highest score). So <code>analyse([(\"A\", 50), (\"B\", 80), (\"C\", 65)])</code> is <code>{\"count\": 3, \"total\": 195, \"average\": 65.0, \"top\": \"B\"}</code>.</span>\r\n<template class=\"st\">def analyse(records):\r\n    # build the summary dictionary\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert analyse([(\"A\", 50), (\"B\", 80), (\"C\", 65)]) == {\"count\": 3, \"total\": 195, \"average\": 65.0, \"top\": \"B\"}\r\n</template></div>\r\n<div class=\"ex stretch\" data-kind=\"py\"><span class=\"exq\"><b>🔥 Stretch (text analyser).</b> Define <code>analyse_text</code> that takes a sentence and returns <code>{\"words\": total_word_count, \"unique\": distinct_word_count, \"top\": most_common_word}</code>. So <code>analyse_text(\"red blue red green red\")</code> is <code>{\"words\": 5, \"unique\": 3, \"top\": \"red\"}</code>. This is a mini version of the capstone!</span>\r\n<template class=\"st\">def analyse_text(text):\r\n    # words, unique words, and the most common word\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert analyse_text(\"red blue red green red\") == {\"words\": 5, \"unique\": 3, \"top\": \"red\"}\r\n</template></div>\r\n\r\n<h4>5. Next up: your capstone</h4>\r\n<p>In the final lesson you'll build a complete little program of your own, in real VS Code, and submit it. You'll pick from three project options — each with a guided build-up like the mini-project in Lesson 10, and room to add your own ideas. Everything you just reviewed — parsing, records, counting, sorting, reporting — is exactly the toolkit you'll use. You're ready.</p>\r\n\r\n<div class=\"recap\">Recap of lesson 19: real programs follow a pipeline — <b>parse</b> raw input into records, <b>analyse</b> with loops/sum/sort/count, and produce a <b>report</b> (usually a dictionary) · <code>try/except</code> keeps parsing robust against bad lines · the counting pattern plus a \"biggest so far\" search finds the most common item · these combine into small analysers like the capstone. Next: <b>build your own app</b> — three project options, your creativity, submitted to your teacher.</div>\r\n\r\n<h4>🏠 Homework</h4>\r\n<p>Four graded exercises — a final warm-up before the capstone.</p>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Homework 1.</b> Define <code>parse_pair</code> that takes a line like <code>\"apple:3\"</code> and returns a tuple <code>(name, count)</code> with the count as an <code>int</code>. So <code>parse_pair(\"apple:3\")</code> is <code>(\"apple\", 3)</code>.</span>\r\n<template class=\"st\">def parse_pair(line):\r\n    # split on \":\", convert the count to int\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert parse_pair(\"apple:3\") == (\"apple\", 3)\r\nassert parse_pair(\"pen:12\") == (\"pen\", 12)\r\n</template></div>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Homework 2.</b> Define <code>count_words</code> that returns a word → count dictionary for a sentence. So <code>count_words(\"x y x\")</code> is <code>{'x': 2, 'y': 1}</code>.</span>\r\n<template class=\"st\">def count_words(text):\r\n    # count each word\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert count_words(\"x y x\") == {\"x\": 2, \"y\": 1}\r\n</template></div>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Homework 3.</b> Define <code>average</code> that returns the average of a non-empty list of numbers. So <code>average([2, 4, 6])</code> is <code>4.0</code>.</span>\r\n<template class=\"st\">def average(nums):\r\n    # return the average\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert average([2, 4, 6]) == 4.0\r\n</template></div>\r\n<div class=\"ex homework stretch\" data-kind=\"py\"><span class=\"exq\"><b>🔥 Homework 4 (stretch).</b> Define <code>report</code> that takes a non-empty list of numbers and returns <code>{\"min\": smallest, \"max\": largest, \"average\": mean}</code>. So <code>report([2, 4, 6])</code> is <code>{\"min\": 2, \"max\": 6, \"average\": 4.0}</code>. (Use <code>min</code>, <code>max</code>, <code>sum</code>.)</span>\r\n<template class=\"st\">def report(nums):\r\n    # build the summary dictionary\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert report([2, 4, 6]) == {\"min\": 2, \"max\": 6, \"average\": 4.0}\r\n</template></div>"}},{"t":{"vi":"Đồ án tốt nghiệp: tự xây ứng dụng","en":"Capstone: build your own app"},"html":{"vi":"<h3>Bài 20 — Đồ án tốt nghiệp: tự xây ứng dụng của bạn</h3>\r\n<p>Đây rồi — vạch đích. Qua mười chín bài, bạn đã đi từ dòng <code>print()</code> đầu tiên đến hàm, dictionary, xử lý lỗi và phân tích văn bản. Giờ bạn sẽ ghép tất cả lại và xây một chương trình nhỏ hoàn chỉnh <b>của riêng mình</b>, trong VS Code thật, rồi nộp lại. Đây là tác phẩm bạn có thể khoe và nói: \"Cái đó tôi làm đấy.\"</p>\r\n<p>Bạn sẽ chọn <b>một trong ba dự án</b> bên dưới. Mỗi cái đi kèm hướng dẫn xây dựng từng bước — các cột mốc rõ ràng, đúng như đồ án nhỏ ở Bài 10 — để bạn không bao giờ phải nhìn một tệp trống trơn. Nhưng bước cuối của mọi dự án đều giống nhau: <b>thêm ý tưởng của riêng bạn</b>. Một tính năng, một biến tấu, một chút trau chuốt là của bạn. Đó là thứ biến một bài tập thành dự án <i>của bạn</i>.</p>\r\n<p>Mỗi dự án cũng có một bài <b>khởi động</b> nhỏ bạn có thể chạy và chấm ngay tại đây để làm cho hàm cốt lõi chạy được — rồi mang nó vào VS Code và xây toàn bộ xung quanh nó. Hãy nhắm tới một thứ bạn tự hào — cỡ 40–80 dòng và một, hai giờ tập trung; chất lượng hơn số lượng.</p>\r\n\r\n<h4>Đồ án tốt nghiệp hoạt động thế nào</h4>\r\n<ol>\r\n<li>Chọn <b>một</b> trong ba dự án bên dưới.</li>\r\n<li>Làm bài khởi động của nó ở đây để nắm chắc logic cốt lõi.</li>\r\n<li>Mở <b>VS Code</b>, tạo một tệp (ví dụ <code>capstone.py</code>), và làm theo các bước xây dựng.</li>\r\n<li>Thêm <b>ít nhất một</b> ý tưởng của riêng bạn (xem mục \"biến nó thành của bạn\" ở mỗi dự án).</li>\r\n<li><b>Nộp cho giáo viên:</b> tệp code <b>và</b> một ảnh chụp màn hình lúc nó chạy.</li>\r\n</ol>\r\n<figure class=\"diagram\">\r\n<svg viewBox=\"0 0 360 92\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11\">\r\n  <defs>\r\n    <marker id=\"a20v\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\">\r\n      <path d=\"M0 0 L10 5 L0 10 z\" fill=\"#F5B942\"/>\r\n    </marker>\r\n  </defs>\r\n  <rect x=\"14\" y=\"30\" width=\"96\" height=\"34\" rx=\"8\" fill=\"#121C30\" stroke=\"#22304C\"/>\r\n  <text x=\"62\" y=\"51\" text-anchor=\"middle\" fill=\"#7FD1C0\">chọn dự án</text>\r\n  <rect x=\"132\" y=\"30\" width=\"96\" height=\"34\" rx=\"8\" fill=\"#121C30\" stroke=\"#22304C\"/>\r\n  <text x=\"180\" y=\"51\" text-anchor=\"middle\" fill=\"#F5B942\">xây trong VS Code</text>\r\n  <rect x=\"250\" y=\"30\" width=\"96\" height=\"34\" rx=\"8\" fill=\"#121C30\" stroke=\"#22304C\"/>\r\n  <text x=\"298\" y=\"47\" text-anchor=\"middle\" fill=\"#E8E4D8\">nộp code</text>\r\n  <text x=\"298\" y=\"59\" text-anchor=\"middle\" fill=\"#8FA0BC\" font-size=\"9\">+ ảnh màn hình</text>\r\n  <g stroke=\"#F5B942\" stroke-width=\"1.4\" marker-end=\"url(#a20v)\" fill=\"none\">\r\n    <line x1=\"110\" y1=\"47\" x2=\"130\" y2=\"47\"/><line x1=\"228\" y1=\"47\" x2=\"248\" y2=\"47\"/>\r\n  </g>\r\n</svg>\r\n</figure>\r\n\r\n<h4>Dự án A — Bộ phân tích văn bản</h4>\r\n<p>Đưa cho chương trình một đoạn văn bản và để nó báo cáo những điều thú vị: tổng số từ, số từ khác nhau, từ phổ biến nhất, độ dài từ trung bình. Một phiên bản thu nhỏ của công cụ mà người viết và dân dữ liệu thật dùng.</p>\r\n<p><b>Mô hình dữ liệu:</b> văn bản là một chuỗi; <code>text.split()</code> cho các từ; một dictionary đếm chúng.</p>\r\n<p><b>Các bước xây dựng:</b></p>\r\n<ol>\r\n<li>Lưu một đoạn văn vài câu vào biến <code>text</code>. (Sau đó, đổi sang <code>text = input(\"Paste text: \")</code>.)</li>\r\n<li>Đưa về chữ thường trước bằng <code>text.lower()</code> để <code>\"The\"</code> và <code>\"the\"</code> tính là cùng một từ.</li>\r\n<li>Tách thành các từ bằng <code>.split()</code> và in <code>\"Total words: N\"</code> dùng <code>len</code>.</li>\r\n<li>Dùng một <code>set</code> để in có bao nhiêu từ <b>khác nhau</b>.</li>\r\n<li>Dựng một dictionary từ → số lần bằng mẫu đếm (<code>counts[w] = counts.get(w, 0) + 1</code>).</li>\r\n<li>Duyệt dictionary để tìm và in từ <b>phổ biến nhất</b> (theo dõi số lớn nhất tới hiện tại).</li>\r\n<li>In <b>độ dài từ trung bình</b>, đã làm tròn (tổng <code>len(w)</code> ÷ số từ).</li>\r\n<li>Gói tất cả vào một hàm <code>analyse(text)</code> <b>trả về một dictionary báo cáo</b>, rồi in từng dòng báo cáo gọn gàng.</li>\r\n</ol>\r\n<p><b>Biến nó thành của bạn</b> (chọn vài cái): bỏ dấu câu bằng <code>.replace(\",\", \"\").replace(\".\", \"\")</code> trước khi đếm · hiện <b>top 3</b> từ kèm số lần · đếm số câu bằng cách tách theo <code>\".\"</code> · tìm từ <b>dài nhất</b> và <b>ngắn nhất</b> · bỏ qua các từ phổ biến như <code>\"the\"</code>, <code>\"a\"</code>, <code>\"is\"</code> bằng một list · vẽ một biểu đồ cột nhỏ bằng <code>\"#\" * count</code> cạnh mỗi từ top · cứ hỏi văn bản trong vòng lặp tới khi người dùng gõ <code>\"quit\"</code>.</p>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Khởi động A.</b> Định nghĩa <code>average_word_length</code> trả về độ dài trung bình của các từ trong <code>text</code>, làm tròn tới 1 chữ số thập phân. Vậy <code>average_word_length(\"a bb ccc\")</code> là <code>2.0</code>.</span>\r\n<template class=\"st\">def average_word_length(text):\r\n    # average length of the words, rounded to 1 decimal\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert average_word_length(\"a bb ccc\") == 2.0\r\nassert average_word_length(\"the cat sat\") == 3.0\r\n</template></div>\r\n\r\n<h4>Dự án B — Trình theo dõi chi tiêu</h4>\r\n<p>Theo dõi chi tiêu: mỗi khoản là một bản ghi có mô tả, số tiền, và danh mục. Chương trình thêm khoản chi, liệt kê, tính tổng, và bóc tách tổng theo danh mục.</p>\r\n<p><b>Mô hình dữ liệu:</b> một list các dictionary như <code>{\"desc\": \"Lunch\", \"amount\": 50, \"category\": \"food\"}</code>.</p>\r\n<p><b>Các bước xây dựng:</b></p>\r\n<ol>\r\n<li>Bắt đầu với một list 4–5 dictionary khoản chi, mỗi cái có <code>desc</code>, <code>amount</code> và <code>category</code>.</li>\r\n<li>Duyệt và in mỗi cái dạng <code>\"Lunch — 50 (food)\"</code> dùng f-string.</li>\r\n<li>In <b>tổng cộng</b> tất cả số tiền (một vòng lặp, hoặc <code>sum</code>).</li>\r\n<li>Viết <code>total_by_category(records, cat)</code> (bài khởi động của bạn) và tái dùng nó.</li>\r\n<li>Lấy <code>set</code> các danh mục, rồi in tổng cho <b>từng</b> danh mục.</li>\r\n<li>Tìm và in khoản chi <b>lớn nhất</b> (mô tả và số tiền của nó).</li>\r\n<li>In <b>tỷ lệ phần trăm</b> của mỗi danh mục trên tổng cộng, đã làm tròn.</li>\r\n<li>Thêm một menu <code>while True</code> (1 thêm · 2 liệt kê · 3 tổng · 4 thoát) đọc <code>input()</code>; khi <code>\"4\"</code> thì <code>break</code>.</li>\r\n<li>Cho \"thêm\" đọc mô tả, một <code>amount</code> (bằng <code>int(input())</code>) và một danh mục, rồi <code>append</code> một dict mới — chặn số tiền sai bằng <code>try/except</code> để không bao giờ crash.</li>\r\n</ol>\r\n<p><b>Biến nó thành của bạn</b> (chọn vài cái): <b>sắp</b> khoản chi từ lớn → nhỏ · đặt <b>ngân sách</b> và cảnh báo khi một danh mục vượt · hiện chi phí <b>trung bình</b> · cho người dùng lọc theo danh mục họ gõ · đếm số khoản chi trong mỗi danh mục · dựng một chuỗi <b>báo cáo</b> có định dạng để lưu · thêm trường <code>date</code> và hiện cái mới nhất trước.</p>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Khởi động B.</b> Định nghĩa <code>total_by_category</code> cộng <code>amount</code> của các bản ghi có <code>category</code> khớp với <code>cat</code>. Với các bản ghi dưới đây, <code>total_by_category(records, \"food\")</code> là <code>130</code>.</span>\r\n<template class=\"st\">def total_by_category(records, cat):\r\n    # sum amounts where category == cat\r\n    pass\r\n\r\nrecords = [\r\n    {\"desc\": \"Lunch\", \"amount\": 50, \"category\": \"food\"},\r\n    {\"desc\": \"Bus\", \"amount\": 15, \"category\": \"transport\"},\r\n    {\"desc\": \"Dinner\", \"amount\": 80, \"category\": \"food\"},\r\n]\r\n</template>\r\n<template class=\"ts\">assert total_by_category(records, \"food\") == 130\r\nassert total_by_category(records, \"transport\") == 15\r\n</template></div>\r\n\r\n<h4>Dự án C — Trò chơi đố vui</h4>\r\n<p>Một trò đố vui hỏi câu hỏi, kiểm tra câu trả lời, giữ điểm, và báo cáo người chơi làm được thế nào. Luyện tập tuyệt vời với vòng lặp, điều kiện và dictionary.</p>\r\n<p><b>Mô hình dữ liệu:</b> một list các dictionary câu hỏi như <code>{\"q\": \"Capital of Vietnam?\", \"a\": \"Hanoi\"}</code>.</p>\r\n<p><b>Các bước xây dựng:</b></p>\r\n<ol>\r\n<li>Lưu 3–5 dictionary câu hỏi (mỗi cái <code>{\"q\": ..., \"a\": ...}</code>) trong một list.</li>\r\n<li>Duyệt bằng <code>enumerate</code> và in từng câu dạng <code>\"Q1: ...\"</code>.</li>\r\n<li>Với mỗi câu, đọc câu trả lời của người chơi bằng <code>input()</code> và so với đáp án đúng, đếm <code>score</code>.</li>\r\n<li>Kiểm tra cho <b>công bằng</b> bằng cách so <code>answer.strip().lower()</code> ở cả hai phía.</li>\r\n<li>In điểm cuối cùng dạng <code>\"You got 2 / 3\"</code>.</li>\r\n<li>In một thông báo theo <b>khoảng điểm</b> — ví dụ đúng hết → \"Perfect!\", ít nhất một nửa → \"Not bad\", còn lại → \"Keep practising\".</li>\r\n<li>Giữ một list các câu người chơi làm <b>sai</b> và hiện chúng (kèm đáp án đúng) ở cuối.</li>\r\n<li>Biến một câu thành <b>trắc nghiệm</b>: hiện lựa chọn a/b/c và nhận chữ cái.</li>\r\n</ol>\r\n<p><b>Biến nó thành của bạn</b> (chọn vài cái): <b>xáo trộn</b> câu hỏi bằng module <code>random</code> · thêm <b>danh mục</b> hoặc độ khó và cho người chơi chọn · hiện đáp án đúng sau khi đoán sai · giữ <b>điểm cao nhất</b> qua các lượt · cho người chơi thêm câu hỏi của họ bằng <code>input()</code> · thưởng điểm khi trả lời đúng liên tiếp.</p>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Khởi động C.</b> Định nghĩa <code>score_quiz</code> nhận <code>answers</code> của người chơi và <code>correct</code> đáp án đúng (hai list dài bằng nhau) và trả về bao nhiêu cái khớp theo vị trí. Vậy <code>score_quiz([\"a\", \"b\", \"c\"], [\"a\", \"x\", \"c\"])</code> là <code>2</code>.</span>\r\n<template class=\"st\">def score_quiz(answers, correct):\r\n    # count how many answers match by position\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert score_quiz([\"a\", \"b\", \"c\"], [\"a\", \"x\", \"c\"]) == 2\r\nassert score_quiz([\"a\"], [\"a\"]) == 1\r\n</template></div>\r\n\r\n<div class=\"recap\">Tóm tắt bài 20: <b>đồ án tốt nghiệp</b> của bạn gom tất cả lại — chọn Bộ phân tích văn bản, Trình theo dõi chi tiêu, hoặc Trò chơi đố vui, làm cho hàm cốt lõi chạy ở đây, rồi xây chương trình đầy đủ trong VS Code · mọi dự án kết thúc bằng <b>ý tưởng của riêng bạn</b> thêm vào · đây chính là quy trình bạn đã luyện: đầu vào → cấu trúc → phân tích → báo cáo. Bạn đã hoàn thành Python Căn bản. 🎉</div>\r\n\r\n<h4>🏠 Bài tập về nhà — đồ án tốt nghiệp</h4>\r\n<p>Đây là dự án cuối cùng của bạn, làm trong <b>VS Code</b> và nộp cho giáo viên.</p>\r\n<ol class=\"hw\">\r\n<li><b>Chọn một dự án</b> (A, B, hoặc C) và tạo <code>capstone.py</code> trong VS Code.</li>\r\n<li><b>Xây nó</b> bằng cách làm theo các bước của dự án ở trên, vừa làm vừa chạy.</li>\r\n<li><b>Biến nó thành của bạn</b> — thêm ít nhất một tính năng từ danh sách \"biến nó thành của bạn\", hoặc ý tưởng của riêng bạn.</li>\r\n<li><b>🔥 Nộp</b> tệp <code>capstone.py</code> <b>và một ảnh chụp màn hình lúc nó chạy</b> cho giáo viên. Hãy sẵn sàng giải thích cách nó hoạt động — đó là đai đen của bạn. 🥋</li>\r\n</ol>","en":"<h3>Lesson 20 — Capstone: build your own app</h3>\r\n<p>This is it — the finish line. Over nineteen lessons you've gone from your very first <code>print()</code> to functions, dictionaries, error handling and text analysis. Now you'll put it all together and build a complete little program <b>of your own</b>, in real VS Code, and submit it. This is the piece you can show people and say: \"I built that.\"</p>\r\n<p>You'll pick <b>one of three projects</b> below. Each comes with a guided build-up — clear milestones, just like the mini-project in Lesson 10 — so you're never staring at a blank file. But the last step of every project is the same: <b>add your own idea</b>. A feature, a twist, a bit of polish that's yours. That's what turns an exercise into <i>your</i> project.</p>\r\n<p>Each project also has one small <b>warm-up</b> you can run and grade right here to get the core function working — then you take it into VS Code and build the whole thing around it. Aim for something you're proud of — roughly 40–80 lines and an hour or two of focused work; quality beats length.</p>\r\n\r\n<h4>How the capstone works</h4>\r\n<ol>\r\n<li>Pick <b>one</b> of the three projects below.</li>\r\n<li>Do its warm-up exercise here to nail the core logic.</li>\r\n<li>Open <b>VS Code</b>, create a file (e.g. <code>capstone.py</code>), and follow the build steps.</li>\r\n<li>Add <b>at least one</b> idea of your own (see each project's \"make it yours\").</li>\r\n<li><b>Submit to your teacher:</b> your code file <b>and</b> a screenshot of it running.</li>\r\n</ol>\r\n<figure class=\"diagram\">\r\n<svg viewBox=\"0 0 360 92\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11\">\r\n  <defs>\r\n    <marker id=\"a20\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\">\r\n      <path d=\"M0 0 L10 5 L0 10 z\" fill=\"#F5B942\"/>\r\n    </marker>\r\n  </defs>\r\n  <rect x=\"14\" y=\"30\" width=\"96\" height=\"34\" rx=\"8\" fill=\"#121C30\" stroke=\"#22304C\"/>\r\n  <text x=\"62\" y=\"51\" text-anchor=\"middle\" fill=\"#7FD1C0\">pick a project</text>\r\n  <rect x=\"132\" y=\"30\" width=\"96\" height=\"34\" rx=\"8\" fill=\"#121C30\" stroke=\"#22304C\"/>\r\n  <text x=\"180\" y=\"51\" text-anchor=\"middle\" fill=\"#F5B942\">build in VS Code</text>\r\n  <rect x=\"250\" y=\"30\" width=\"96\" height=\"34\" rx=\"8\" fill=\"#121C30\" stroke=\"#22304C\"/>\r\n  <text x=\"298\" y=\"47\" text-anchor=\"middle\" fill=\"#E8E4D8\">submit code</text>\r\n  <text x=\"298\" y=\"59\" text-anchor=\"middle\" fill=\"#8FA0BC\" font-size=\"9\">+ screenshot</text>\r\n  <g stroke=\"#F5B942\" stroke-width=\"1.4\" marker-end=\"url(#a20)\" fill=\"none\">\r\n    <line x1=\"110\" y1=\"47\" x2=\"130\" y2=\"47\"/><line x1=\"228\" y1=\"47\" x2=\"248\" y2=\"47\"/>\r\n  </g>\r\n</svg>\r\n</figure>\r\n\r\n<h4>Project A — Text Analyser</h4>\r\n<p>Feed your program a block of text and have it report interesting facts: total words, unique words, the most common word, the average word length. A tiny version of the tools real writers and data folk use.</p>\r\n<p><b>Data model:</b> the text is a string; <code>text.split()</code> gives the words; a dictionary counts them.</p>\r\n<p><b>Build steps:</b></p>\r\n<ol>\r\n<li>Store a paragraph of a few sentences in a variable <code>text</code>. (Later, swap to <code>text = input(\"Paste text: \")</code>.)</li>\r\n<li>Lowercase it first with <code>text.lower()</code> so <code>\"The\"</code> and <code>\"the\"</code> count as the same word.</li>\r\n<li>Split into words with <code>.split()</code> and print <code>\"Total words: N\"</code> using <code>len</code>.</li>\r\n<li>Use a <code>set</code> to print how many <b>unique</b> words there are.</li>\r\n<li>Build a word → count dictionary with the counting pattern (<code>counts[w] = counts.get(w, 0) + 1</code>).</li>\r\n<li>Loop the dictionary to find and print the <b>most common</b> word (track the biggest count so far).</li>\r\n<li>Print the <b>average word length</b>, rounded (sum of <code>len(w)</code> ÷ number of words).</li>\r\n<li>Wrap the whole thing in a function <code>analyse(text)</code> that <b>returns a report dictionary</b>, then print each line of the report neatly.</li>\r\n</ol>\r\n<p><b>Make it yours</b> (pick a few): strip punctuation with <code>.replace(\",\", \"\").replace(\".\", \"\")</code> before counting · show the <b>top 3</b> words with their counts · count sentences by splitting on <code>\".\"</code> · find the <b>longest</b> and <b>shortest</b> word · ignore common \"stop words\" like <code>\"the\"</code>, <code>\"a\"</code>, <code>\"is\"</code> using a list · draw a tiny bar chart with <code>\"#\" * count</code> next to each top word · keep asking for text in a loop until the user types <code>\"quit\"</code>.</p>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Warm-up A.</b> Define <code>average_word_length</code> that returns the average length of the words in <code>text</code>, rounded to 1 decimal. So <code>average_word_length(\"a bb ccc\")</code> is <code>2.0</code>.</span>\r\n<template class=\"st\">def average_word_length(text):\r\n    # average length of the words, rounded to 1 decimal\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert average_word_length(\"a bb ccc\") == 2.0\r\nassert average_word_length(\"the cat sat\") == 3.0\r\n</template></div>\r\n\r\n<h4>Project B — Expense Tracker</h4>\r\n<p>Track spending: each expense is a record with a description, an amount, and a category. The program adds expenses, lists them, totals them, and breaks the total down by category.</p>\r\n<p><b>Data model:</b> a list of dictionaries like <code>{\"desc\": \"Lunch\", \"amount\": 50, \"category\": \"food\"}</code>.</p>\r\n<p><b>Build steps:</b></p>\r\n<ol>\r\n<li>Start a list of 4–5 expense dictionaries, each with <code>desc</code>, <code>amount</code> and <code>category</code>.</li>\r\n<li>Loop and print each as <code>\"Lunch — 50 (food)\"</code> using an f-string.</li>\r\n<li>Print the <b>grand total</b> of all amounts (a loop, or <code>sum</code>).</li>\r\n<li>Write <code>total_by_category(records, cat)</code> (your warm-up) and reuse it.</li>\r\n<li>Get the <code>set</code> of categories, then print the total for <b>each</b> category.</li>\r\n<li>Find and print the single <b>biggest</b> expense (its description and amount).</li>\r\n<li>Print each category's <b>share as a percentage</b> of the grand total, rounded.</li>\r\n<li>Add a <code>while True</code> menu (1 add · 2 list · 3 totals · 4 quit) reading <code>input()</code>; on <code>\"4\"</code>, <code>break</code>.</li>\r\n<li>Make \"add\" read a description, an <code>amount</code> (with <code>int(input())</code>) and a category, then <code>append</code> a new dict — guard a bad amount with <code>try/except</code> so it never crashes.</li>\r\n</ol>\r\n<p><b>Make it yours</b> (pick a few): <b>sort</b> expenses biggest → smallest · set a <b>budget</b> and warn when a category goes over it · show the <b>average</b> expense · let the user filter by a category they type · count how many expenses are in each category · build one formatted <b>report</b> string you could save · add a <code>date</code> field and show the newest first.</p>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Warm-up B.</b> Define <code>total_by_category</code> that sums the <code>amount</code> of the records whose <code>category</code> matches <code>cat</code>. For the records below, <code>total_by_category(records, \"food\")</code> is <code>130</code>.</span>\r\n<template class=\"st\">def total_by_category(records, cat):\r\n    # sum amounts where category == cat\r\n    pass\r\n\r\nrecords = [\r\n    {\"desc\": \"Lunch\", \"amount\": 50, \"category\": \"food\"},\r\n    {\"desc\": \"Bus\", \"amount\": 15, \"category\": \"transport\"},\r\n    {\"desc\": \"Dinner\", \"amount\": 80, \"category\": \"food\"},\r\n]\r\n</template>\r\n<template class=\"ts\">assert total_by_category(records, \"food\") == 130\r\nassert total_by_category(records, \"transport\") == 15\r\n</template></div>\r\n\r\n<h4>Project C — Quiz Game</h4>\r\n<p>A quiz that asks questions, checks answers, keeps score, and reports how the player did. Great practice with loops, conditions and dictionaries.</p>\r\n<p><b>Data model:</b> a list of question dictionaries like <code>{\"q\": \"Capital of Vietnam?\", \"a\": \"Hanoi\"}</code>.</p>\r\n<p><b>Build steps:</b></p>\r\n<ol>\r\n<li>Store 3–5 question dictionaries (each <code>{\"q\": ..., \"a\": ...}</code>) in a list.</li>\r\n<li>Loop with <code>enumerate</code> and print each as <code>\"Q1: ...\"</code>.</li>\r\n<li>For each question, read the player's answer with <code>input()</code> and compare it to the correct one, counting a <code>score</code>.</li>\r\n<li>Make checking <b>fair</b> by comparing <code>answer.strip().lower()</code> on both sides.</li>\r\n<li>Print the final score like <code>\"You got 2 / 3\"</code>.</li>\r\n<li>Print a message by <b>score band</b> — e.g. all correct → \"Perfect!\", at least half → \"Not bad\", else → \"Keep practising\".</li>\r\n<li>Keep a list of the questions the player got <b>wrong</b> and show them (with the right answers) at the end.</li>\r\n<li>Turn one question into <b>multiple choice</b>: show options a/b/c and accept the letter.</li>\r\n</ol>\r\n<p><b>Make it yours</b> (pick a few): <b>shuffle</b> the questions with the <code>random</code> module · add <b>categories</b> or difficulty levels and let the player choose · reveal the correct answer after a wrong guess · keep a <b>high score</b> across rounds · let the player add their own questions with <code>input()</code> · give a point bonus for a streak of correct answers.</p>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Warm-up C.</b> Define <code>score_quiz</code> that takes the player's <code>answers</code> and the <code>correct</code> answers (two equal-length lists) and returns how many match by position. So <code>score_quiz([\"a\", \"b\", \"c\"], [\"a\", \"x\", \"c\"])</code> is <code>2</code>.</span>\r\n<template class=\"st\">def score_quiz(answers, correct):\r\n    # count how many answers match by position\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert score_quiz([\"a\", \"b\", \"c\"], [\"a\", \"x\", \"c\"]) == 2\r\nassert score_quiz([\"a\"], [\"a\"]) == 1\r\n</template></div>\r\n\r\n<div class=\"recap\">Recap of lesson 20: your <b>capstone</b> pulls together everything — pick Text Analyser, Expense Tracker, or Quiz Game, get the core function working here, then build the full program in VS Code · every project ends with <b>your own idea</b> added on top · this is the pipeline you practised: input → structure → analyse → report. You've finished Python Fundamentals. 🎉</div>\r\n\r\n<h4>🏠 Homework — the capstone</h4>\r\n<p>This is your final project, done in <b>VS Code</b> and submitted to your teacher.</p>\r\n<ol class=\"hw\">\r\n<li><b>Choose a project</b> (A, B, or C) and create <code>capstone.py</code> in VS Code.</li>\r\n<li><b>Build it</b> by following the project's steps above, running it as you go.</li>\r\n<li><b>Make it yours</b> — add at least one feature from the \"make it yours\" list, or your own idea.</li>\r\n<li><b>🔥 Submit</b> your <code>capstone.py</code> file <b>and a screenshot of it running</b> to your teacher. Be ready to explain how it works — that's your black belt. 🥋</li>\r\n</ol>"}}]};
