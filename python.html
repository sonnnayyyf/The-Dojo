 <code>\"missing\"</code>.</span>\r\n<template class=\"st\">def safe_get(d, key):\r\n    # return the value or \"missing\"\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert safe_get({\"name\": \"Anna\"}, \"name\") == \"Anna\"\r\nassert safe_get({\"name\": \"Anna\"}, \"email\") == \"missing\"\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 4.</b> Định nghĩa <code>get_item</code> trả về <code>items[i]</code>, hoặc <code>None</code> nếu chỉ số ngoài phạm vi (bắt <code>IndexError</code>). Vậy <code>get_item([10, 20], 0)</code> là <code>10</code> và <code>get_item([10, 20], 5)</code> là <code>None</code>.</span>\r\n<template class=\"st\">def get_item(items, i):\r\n    # return the item or None\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert get_item([10, 20], 0) == 10\r\nassert get_item([10, 20], 5) is None\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 5.</b> Định nghĩa <code>to_float</code> trả về <code>float(s)</code>, hoặc <code>None</code> nếu không thể chuyển. Vậy <code>to_float(\"3.5\")</code> là <code>3.5</code> và <code>to_float(\"x\")</code> là <code>None</code>.</span>\r\n<template class=\"st\">def to_float(s):\r\n    # return the float or None\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert to_float(\"3.5\") == 3.5\r\nassert to_float(\"x\") is None\r\n</template></div>\r\n\r\n<h4>4. Xử lý phần tử xấu trong vòng lặp</h4>\r\n<p>Một việc rất thường gặp: xử lý một list mà <b>vài</b> mục bị hỏng. Bọc phần rủi ro trong <code>try</code> và chỉ cần bỏ qua (hoặc dùng mặc định) những cái thất bại — vòng lặp vẫn tiếp tục.</p>\r\n<pre class=\"run\">values = [\"1\", \"2\", \"x\", \"3\"]\r\ntotal = 0\r\nfor v in values:\r\n    try:\r\n        total += int(v)\r\n    except ValueError:\r\n        pass                 # bỏ qua cái xấu\r\nprint(total)   # 6</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 6.</b> Định nghĩa <code>sum_numbers</code> cộng các giá trị trong list có thể chuyển thành <code>int</code>, bỏ qua phần còn lại. Vậy <code>sum_numbers([\"1\", \"2\", \"x\", \"3\"])</code> là <code>6</code>.</span>\r\n<template class=\"st\">def sum_numbers(values):\r\n    # sum the convertible values, skip the rest\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert sum_numbers([\"1\", \"2\", \"x\", \"3\"]) == 6\r\nassert sum_numbers([\"a\", \"b\"]) == 0\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 7.</b> Định nghĩa <code>count_valid</code> trả về bao nhiêu chuỗi trong <code>values</code> có thể chuyển thành <code>int</code>. Vậy <code>count_valid([\"1\", \"2\", \"x\", \"3\"])</code> là <code>3</code>.</span>\r\n<template class=\"st\">def count_valid(values):\r\n    # count how many convert to int\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert count_valid([\"1\", \"2\", \"x\", \"3\"]) == 3\r\nassert count_valid([\"a\"]) == 0\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 8.</b> Định nghĩa <code>percent</code> trả về <code>round(part / whole * 100)</code>, hoặc <code>0</code> nếu <code>whole</code> bằng 0. Vậy <code>percent(1, 4)</code> là <code>25</code> và <code>percent(1, 0)</code> là <code>0</code>.</span>\r\n<template class=\"st\">def percent(part, whole):\r\n    # return the percentage, or 0 if whole is 0\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert percent(1, 4) == 25\r\nassert percent(1, 0) == 0\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 9.</b> Định nghĩa <code>clean_ints</code> trả về một list các giá trị <code>int</code> từ <code>values</code>, bỏ đi những cái không chuyển được. Vậy <code>clean_ints([\"10\", \"x\", \"20\"])</code> là <code>[10, 20]</code>.</span>\r\n<template class=\"st\">def clean_ints(values):\r\n    # return a list of the valid ints\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert clean_ints([\"10\", \"x\", \"20\"]) == [10, 20]\r\nassert clean_ints([\"a\", \"b\"]) == []\r\n</template></div>\r\n<div class=\"ex stretch\" data-kind=\"py\"><span class=\"exq\"><b>🔥 Nâng cao (trung bình vững vàng).</b> Định nghĩa <code>safe_average</code> chỉ lấy trung bình những giá trị trong <code>values</code> chuyển được thành số, và trả về <code>0</code> nếu không có cái nào. Vậy <code>safe_average([\"2\", \"x\", \"4\"])</code> là <code>3.0</code> và <code>safe_average([\"a\"])</code> là <code>0</code>.</span>\r\n<template class=\"st\">def safe_average(values):\r\n    # average the valid numbers, or 0 if none\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert safe_average([\"2\", \"x\", \"4\"]) == 3.0\r\nassert safe_average([\"a\"]) == 0\r\n</template></div>\r\n\r\n<div class=\"recap\">Tóm tắt bài 15: các thao tác rủi ro gây ra <b>ngoại lệ</b> có tên (<code>ValueError</code>, <code>ZeroDivisionError</code>, <code>KeyError</code>, <code>IndexError</code>) làm crash chương trình nếu không xử lý · đặt code rủi ro trong <code>try</code> và phần khắc phục trong <code>except</code> · ghi tên đúng ngoại lệ bạn dự đoán để không che giấu lỗi khác · trong vòng lặp, <code>try/except</code> giúp bỏ qua hoặc dùng mặc định cho phần tử xấu và tiếp tục chạy. Bài sau: <b>tuple, unpacking &amp; enumerate</b> — cách gọn hơn để gói và duyệt dữ liệu.</div>\r\n\r\n<h4>🏠 Bài tập về nhà</h4>\r\n<p>Bốn bài tập được chấm điểm — làm ngay tại đây trước bài kế tiếp.</p>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Bài về nhà 1.</b> Định nghĩa <code>to_int</code> trả về <code>int(s)</code>, hoặc một giá trị <code>default</code> (mặc định <code>0</code>) nếu không chuyển được. Vậy <code>to_int(\"5\")</code> là <code>5</code>, <code>to_int(\"x\")</code> là <code>0</code>, và <code>to_int(\"x\", -1)</code> là <code>-1</code>.</span>\r\n<template class=\"st\">def to_int(s, default=0):\r\n    # convert, or return the default\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert to_int(\"5\") == 5\r\nassert to_int(\"x\") == 0\r\nassert to_int(\"x\", -1) == -1\r\n</template></div>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Bài về nhà 2.</b> Định nghĩa <code>safe_ratio</code> trả về <code>a / b</code>, hoặc <code>None</code> nếu <code>b</code> bằng 0. Vậy <code>safe_ratio(10, 2)</code> là <code>5.0</code> và <code>safe_ratio(1, 0)</code> là <code>None</code>.</span>\r\n<template class=\"st\">def safe_ratio(a, b):\r\n    # divide safely, else None\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert safe_ratio(10, 2) == 5.0\r\nassert safe_ratio(1, 0) is None\r\n</template></div>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Bài về nhà 3.</b> Định nghĩa <code>lookup</code> trả về <code>d[key]</code>, hoặc <code>\"N/A\"</code> nếu khóa không có. Vậy với <code>{\"a\": 1}</code>, <code>lookup(d, \"a\")</code> là <code>1</code> và <code>lookup(d, \"z\")</code> là <code>\"N/A\"</code>.</span>\r\n<template class=\"st\">def lookup(d, key):\r\n    # return the value or \"N/A\"\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert lookup({\"a\": 1}, \"a\") == 1\r\nassert lookup({\"a\": 1}, \"z\") == \"N/A\"\r\n</template></div>\r\n<div class=\"ex homework stretch\" data-kind=\"py\"><span class=\"exq\"><b>🔥 Bài về nhà 4 (nâng cao).</b> Định nghĩa <code>total_valid</code> cộng các giá trị trong <code>values</code> chuyển được thành <code>int</code> và bỏ qua phần còn lại. Vậy <code>total_valid([\"1\", \"2\", \"x\"])</code> là <code>3</code> và <code>total_valid([\"a\", \"b\"])</code> là <code>0</code>.</span>\r\n<template class=\"st\">def total_valid(values):\r\n    # sum only the convertible values\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert total_valid([\"1\", \"2\", \"x\"]) == 3\r\nassert total_valid([\"a\", \"b\"]) == 0\r\n</template></div>","en":"<h3>Lesson 15 — Errors: try / except</h3>\r\n<p>Up to now, when something went wrong — dividing by zero, turning <code>\"abc\"</code> into a number, reading a key that isn't there — your program simply <b>crashed</b> with a red error message and stopped dead. That's fine while learning, but a real program can't fall over every time a user types something odd. It needs to <b>expect</b> trouble and handle it calmly.</p>\r\n<p>Python's tool for this is <code>try / except</code>: you put the risky code in a <code>try</code> block, and if it raises an error, Python jumps to the <code>except</code> block instead of crashing. Your program keeps running and can give a sensible response — a default value, a friendly message, a skipped item.</p>\r\n<p>This is the difference between a fragile script and software people can actually use. Handling bad input gracefully is one of the clearest marks of a real developer.</p>\r\n\r\n<h4>1. What an error looks like</h4>\r\n<p>Certain operations fail at runtime and raise a named <b>exception</b>. A few you'll meet constantly:</p>\r\n<table class=\"res\">\r\n<thead><tr><th>Code</th><th>Exception</th><th>Why</th></tr></thead>\r\n<tbody>\r\n<tr><td><code>int(\"abc\")</code></td><td>ValueError</td><td>text isn't a number</td></tr>\r\n<tr><td><code>10 / 0</code></td><td>ZeroDivisionError</td><td>can't divide by zero</td></tr>\r\n<tr><td><code>d[\"missing\"]</code></td><td>KeyError</td><td>no such key in the dict</td></tr>\r\n<tr><td><code>items[99]</code></td><td>IndexError</td><td>position is past the end</td></tr>\r\n</tbody>\r\n</table>\r\n<p>Without handling, any of these stops the whole program.</p>\r\n\r\n<h4>2. try / except</h4>\r\n<p>Wrap the risky line in <code>try</code>. If it fails, the <code>except</code> block runs instead.</p>\r\n<pre class=\"run\">def safe_int(s):\r\n    try:\r\n        return int(s)        # risky: might fail\r\n    except ValueError:\r\n        return 0             # runs only if int() failed\r\n\r\nprint(safe_int(\"42\"))    # 42\r\nprint(safe_int(\"abc\"))   # 0  — no crash</pre>\r\n<figure class=\"diagram\">\r\n<svg viewBox=\"0 0 360 150\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11\">\r\n  <defs>\r\n    <marker id=\"a15\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\">\r\n      <path d=\"M0 0 L10 5 L0 10 z\" fill=\"#7FD1C0\"/>\r\n    </marker>\r\n  </defs>\r\n  <rect x=\"120\" y=\"14\" width=\"120\" height=\"34\" rx=\"8\" fill=\"#121C30\" stroke=\"#22304C\"/>\r\n  <text x=\"180\" y=\"35\" text-anchor=\"middle\" fill=\"#E8E4D8\">run try block</text>\r\n  <rect x=\"30\" y=\"100\" width=\"130\" height=\"34\" rx=\"8\" fill=\"#0E1626\" stroke=\"#22304C\"/>\r\n  <text x=\"95\" y=\"121\" text-anchor=\"middle\" fill=\"#7FD1C0\">worked → return</text>\r\n  <rect x=\"200\" y=\"100\" width=\"140\" height=\"34\" rx=\"8\" fill=\"#0E1626\" stroke=\"#22304C\"/>\r\n  <text x=\"270\" y=\"121\" text-anchor=\"middle\" fill=\"#E2604C\">failed → except</text>\r\n  <g stroke=\"#7FD1C0\" stroke-width=\"1.3\" marker-end=\"url(#a15)\" fill=\"none\">\r\n    <line x1=\"160\" y1=\"48\" x2=\"100\" y2=\"96\"/>\r\n  </g>\r\n  <g stroke=\"#E2604C\" stroke-width=\"1.3\" marker-end=\"url(#a15)\" fill=\"none\" stroke-dasharray=\"4 3\">\r\n    <line x1=\"200\" y1=\"48\" x2=\"262\" y2=\"96\"/>\r\n  </g>\r\n  <text x=\"120\" y=\"78\" fill=\"#8FA0BC\" font-size=\"10\">no error</text>\r\n  <text x=\"238\" y=\"78\" fill=\"#8FA0BC\" font-size=\"10\">error!</text>\r\n</svg>\r\n<figcaption>If the <code>try</code> block succeeds, the <code>except</code> is skipped. If it raises an error, Python jumps to <code>except</code> instead of crashing.</figcaption>\r\n</figure>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 1.</b> Define <code>safe_int</code> that returns <code>int(s)</code>, or <code>0</code> if <code>s</code> can't be converted. So <code>safe_int(\"42\")</code> is <code>42</code> and <code>safe_int(\"abc\")</code> is <code>0</code>.</span>\r\n<template class=\"st\">def safe_int(s):\r\n    # try to convert, else return 0\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert safe_int(\"42\") == 42\r\nassert safe_int(\"abc\") == 0\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 2.</b> Define <code>safe_divide</code> that returns <code>a / b</code>, or <code>0</code> if <code>b</code> is zero (catch <code>ZeroDivisionError</code>). So <code>safe_divide(10, 2)</code> is <code>5.0</code> and <code>safe_divide(5, 0)</code> is <code>0</code>.</span>\r\n<template class=\"st\">def safe_divide(a, b):\r\n    # divide safely\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert safe_divide(10, 2) == 5.0\r\nassert safe_divide(5, 0) == 0\r\n</template></div>\r\n\r\n<h4>3. Catching the right error</h4>\r\n<p>Name the exception you expect after <code>except</code>. This keeps you from accidentally hiding bugs you didn't mean to catch. Reading a missing dictionary key raises <code>KeyError</code>; an out-of-range list index raises <code>IndexError</code>.</p>\r\n<pre class=\"run\">def safe_get(d, key):\r\n    try:\r\n        return d[key]\r\n    except KeyError:\r\n        return \"missing\"\r\n\r\nperson = {\"name\": \"Anna\"}\r\nprint(safe_get(person, \"name\"))    # Anna\r\nprint(safe_get(person, \"email\"))   # missing</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 3.</b> Define <code>safe_get</code> that returns <code>d[key]</code>, or <code>\"missing\"</code> if the key isn't there. So for <code>{\"name\": \"Anna\"}</code>, <code>safe_get(d, \"name\")</code> is <code>\"Anna\"</code> and <code>safe_get(d, \"email\")</code> is <code>\"missing\"</code>.</span>\r\n<template class=\"st\">def safe_get(d, key):\r\n    # return the value or \"missing\"\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert safe_get({\"name\": \"Anna\"}, \"name\") == \"Anna\"\r\nassert safe_get({\"name\": \"Anna\"}, \"email\") == \"missing\"\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 4.</b> Define <code>get_item</code> that returns <code>items[i]</code>, or <code>None</code> if the index is out of range (catch <code>IndexError</code>). So <code>get_item([10, 20], 0)</code> is <code>10</code> and <code>get_item([10, 20], 5)</code> is <code>None</code>.</span>\r\n<template class=\"st\">def get_item(items, i):\r\n    # return the item or None\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert get_item([10, 20], 0) == 10\r\nassert get_item([10, 20], 5) is None\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 5.</b> Define <code>to_float</code> that returns <code>float(s)</code>, or <code>None</code> if it can't convert. So <code>to_float(\"3.5\")</code> is <code>3.5</code> and <code>to_float(\"x\")</code> is <code>None</code>.</span>\r\n<template class=\"st\">def to_float(s):\r\n    # return the float or None\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert to_float(\"3.5\") == 3.5\r\nassert to_float(\"x\") is None\r\n</template></div>\r\n\r\n<h4>4. Handling bad items in a loop</h4>\r\n<p>A very common real task: process a list where <b>some</b> entries are bad. Wrap the risky bit in <code>try</code> and just skip (or default) the failures — the loop keeps going.</p>\r\n<pre class=\"run\">values = [\"1\", \"2\", \"x\", \"3\"]\r\ntotal = 0\r\nfor v in values:\r\n    try:\r\n        total += int(v)\r\n    except ValueError:\r\n        pass                 # ignore the bad one\r\nprint(total)   # 6</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 6.</b> Define <code>sum_numbers</code> that adds up the values in a list that can be turned into <code>int</code>, skipping the rest. So <code>sum_numbers([\"1\", \"2\", \"x\", \"3\"])</code> is <code>6</code>.</span>\r\n<template class=\"st\">def sum_numbers(values):\r\n    # sum the convertible values, skip the rest\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert sum_numbers([\"1\", \"2\", \"x\", \"3\"]) == 6\r\nassert sum_numbers([\"a\", \"b\"]) == 0\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 7.</b> Define <code>count_valid</code> that returns how many strings in <code>values</code> can be converted to <code>int</code>. So <code>count_valid([\"1\", \"2\", \"x\", \"3\"])</code> is <code>3</code>.</span>\r\n<template class=\"st\">def count_valid(values):\r\n    # count how many convert to int\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert count_valid([\"1\", \"2\", \"x\", \"3\"]) == 3\r\nassert count_valid([\"a\"]) == 0\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 8.</b> Define <code>percent</code> that returns <code>round(part / whole * 100)</code>, or <code>0</code> if <code>whole</code> is zero. So <code>percent(1, 4)</code> is <code>25</code> and <code>percent(1, 0)</code> is <code>0</code>.</span>\r\n<template class=\"st\">def percent(part, whole):\r\n    # return the percentage, or 0 if whole is 0\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert percent(1, 4) == 25\r\nassert percent(1, 0) == 0\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 9.</b> Define <code>clean_ints</code> that returns a list of the <code>int</code> values from <code>values</code>, dropping any that don't convert. So <code>clean_ints([\"10\", \"x\", \"20\"])</code> is <code>[10, 20]</code>.</span>\r\n<template class=\"st\">def clean_ints(values):\r\n    # return a list of the valid ints\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert clean_ints([\"10\", \"x\", \"20\"]) == [10, 20]\r\nassert clean_ints([\"a\", \"b\"]) == []\r\n</template></div>\r\n<div class=\"ex stretch\" data-kind=\"py\"><span class=\"exq\"><b>🔥 Stretch (robust average).</b> Define <code>safe_average</code> that averages only the values in <code>values</code> that convert to a number, and returns <code>0</code> if none do. So <code>safe_average([\"2\", \"x\", \"4\"])</code> is <code>3.0</code> and <code>safe_average([\"a\"])</code> is <code>0</code>.</span>\r\n<template class=\"st\">def safe_average(values):\r\n    # average the valid numbers, or 0 if none\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert safe_average([\"2\", \"x\", \"4\"]) == 3.0\r\nassert safe_average([\"a\"]) == 0\r\n</template></div>\r\n\r\n<div class=\"recap\">Recap of lesson 15: risky operations raise named <b>exceptions</b> (<code>ValueError</code>, <code>ZeroDivisionError</code>, <code>KeyError</code>, <code>IndexError</code>) that crash the program if unhandled · put risky code in <code>try</code> and the recovery in <code>except</code> · name the specific exception you expect so you don't hide other bugs · in a loop, <code>try/except</code> lets you skip or default bad items and keep going. Next: <b>tuples, unpacking &amp; enumerate</b> — cleaner ways to bundle and walk data.</div>\r\n\r\n<h4>🏠 Homework</h4>\r\n<p>Four graded exercises — do them right here before the next lesson.</p>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Homework 1.</b> Define <code>to_int</code> that returns <code>int(s)</code>, or a <code>default</code> value (default <code>0</code>) if it can't convert. So <code>to_int(\"5\")</code> is <code>5</code>, <code>to_int(\"x\")</code> is <code>0</code>, and <code>to_int(\"x\", -1)</code> is <code>-1</code>.</span>\r\n<template class=\"st\">def to_int(s, default=0):\r\n    # convert, or return the default\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert to_int(\"5\") == 5\r\nassert to_int(\"x\") == 0\r\nassert to_int(\"x\", -1) == -1\r\n</template></div>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Homework 2.</b> Define <code>safe_ratio</code> that returns <code>a / b</code>, or <code>None</code> if <code>b</code> is zero. So <code>safe_ratio(10, 2)</code> is <code>5.0</code> and <code>safe_ratio(1, 0)</code> is <code>None</code>.</span>\r\n<template class=\"st\">def safe_ratio(a, b):\r\n    # divide safely, else None\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert safe_ratio(10, 2) == 5.0\r\nassert safe_ratio(1, 0) is None\r\n</template></div>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Homework 3.</b> Define <code>lookup</code> that returns <code>d[key]</code>, or <code>\"N/A\"</code> if the key isn't present. So for <code>{\"a\": 1}</code>, <code>lookup(d, \"a\")</code> is <code>1</code> and <code>lookup(d, \"z\")</code> is <code>\"N/A\"</code>.</span>\r\n<template class=\"st\">def lookup(d, key):\r\n    # return the value or \"N/A\"\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert lookup({\"a\": 1}, \"a\") == 1\r\nassert lookup({\"a\": 1}, \"z\") == \"N/A\"\r\n</template></div>\r\n<div class=\"ex homework stretch\" data-kind=\"py\"><span class=\"exq\"><b>🔥 Homework 4 (stretch).</b> Define <code>total_valid</code> that sums the values in <code>values</code> that convert to <code>int</code> and skips the rest. So <code>total_valid([\"1\", \"2\", \"x\"])</code> is <code>3</code> and <code>total_valid([\"a\", \"b\"])</code> is <code>0</code>.</span>\r\n<template class=\"st\">def total_valid(values):\r\n    # sum only the convertible values\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert total_valid([\"1\", \"2\", \"x\"]) == 3\r\nassert total_valid([\"a\", \"b\"]) == 0\r\n</template></div>"}},{"t":{"vi":"Tuple, unpacking & enumerate","en":"Tuples, unpacking & enumerate"},"html":{"vi":"<h3>Bài 16 — Tuple, unpacking &amp; enumerate</h3>\r\n<p>Bạn đã âm thầm dùng <b>tuple</b> rồi — mỗi lần một hàm trả về hai giá trị, hay bạn viết <code>(3, 4)</code>. Một tuple giống list, nhưng <b>cố định</b>: khi đã tạo, bạn không thể đổi nội dung của nó. Nghe như một hạn chế, nhưng đó chính là điều bạn muốn cho những thứ có hình dạng cố định và không nên bị sửa vô tình — một tọa độ <code>(x, y)</code>, một màu RGB, một cặp <code>(name, score)</code>.</p>\r\n<p>Đi cùng tuple là hai tiện ích hằng ngày: <b>unpacking</b> (tách một tuple thẳng vào các biến có tên) và <b>enumerate</b> (duyệt một list mà vẫn có chỉ số của mỗi phần tử miễn phí). Cả hai làm code ngắn hơn và dễ đọc hơn nhiều so với tự xoay xở với các số chỉ mục.</p>\r\n<p>Đây là những công cụ nhỏ, nhưng bạn sẽ dùng chúng trong gần như mọi chương trình từ đây trở đi. Hãy biến chúng thành phản xạ.</p>\r\n\r\n<h4>1. Tuple: nhóm giá trị cố định</h4>\r\n<p>Viết một tuple bằng dấu phẩy, thường đặt trong ngoặc đơn. Bạn đọc nó theo chỉ số y như list — nhưng <b>không thể</b> gán lại các phần tử của nó.</p>\r\n<pre class=\"run\">point = (3, 4)\r\nprint(point[0])     # 3\r\nprint(point[1])     # 4\r\n# point[0] = 9      # LỖI — tuple là bất biến</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 1.</b> Tạo một tuple <code>rgb</code> chứa <code>255</code>, <code>128</code>, <code>0</code> (theo thứ tự đó). Vậy <code>rgb</code> là <code>(255, 128, 0)</code>.</span>\r\n<template class=\"st\"># create the rgb tuple\r\nrgb = \r\n</template>\r\n<template class=\"ts\">assert rgb == (255, 128, 0)\r\n</template></div>\r\n\r\n<h4>2. Bung (unpack) một tuple</h4>\r\n<p>Gán một tuple cho nhiều tên cùng lúc và Python trao mỗi giá trị cho biến của nó. Gọn hơn viết <code>point[0]</code>, <code>point[1]</code> khắp nơi.</p>\r\n<pre class=\"run\">point = (3, 4)\r\nx, y = point         # bung ra\r\nprint(x, y)          # 3 4\r\n\r\na, b = 1, 2\r\na, b = b, a          # hoán đổi trong một dòng!\r\nprint(a, b)          # 2 1</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 2.</b> Cho <code>point = (3, 4)</code>, bung nó vào <code>x</code> và <code>y</code>, rồi gán <code>s</code> bằng tổng của chúng. Vậy <code>s</code> là <code>7</code>.</span>\r\n<template class=\"st\">point = (3, 4)\r\n# unpack into x and y, then sum them into s\r\ns = 0\r\n</template>\r\n<template class=\"ts\">assert s == 7\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 3.</b> Cho <code>a = 1</code> và <code>b = 2</code>, <b>hoán đổi</b> chúng bằng unpacking sao cho <code>a</code> thành <code>2</code> và <code>b</code> thành <code>1</code>.</span>\r\n<template class=\"st\">a = 1\r\nb = 2\r\n# swap a and b\r\n</template>\r\n<template class=\"ts\">assert a == 2 and b == 1\r\n</template></div>\r\n\r\n<h4>3. enumerate: chỉ số và giá trị cùng nhau</h4>\r\n<p>Bạn thường cần cả vị trí lẫn phần tử khi duyệt. Thay vì <code>range(len(...))</code> rồi tự lấy chỉ số, <code>enumerate</code> trao cho bạn cả hai. Thêm <code>start=1</code> để đếm từ 1.</p>\r\n<pre class=\"run\">tasks = [\"Buy milk\", \"Call Anna\"]\r\nfor i, task in enumerate(tasks, start=1):\r\n    print(f\"{i}. {task}\")\r\n# 1. Buy milk\r\n# 2. Call Anna</pre>\r\n<figure class=\"diagram\">\r\n<svg viewBox=\"0 0 340 120\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11\">\r\n  <text x=\"170\" y=\"16\" text-anchor=\"middle\" fill=\"#8FA0BC\">enumerate([\"a\", \"b\", \"c\"]) sinh ra các cặp</text>\r\n  <g stroke=\"#22304C\" fill=\"#121C30\">\r\n    <rect x=\"40\" y=\"34\" width=\"80\" height=\"30\" rx=\"6\"/>\r\n    <rect x=\"130\" y=\"34\" width=\"80\" height=\"30\" rx=\"6\"/>\r\n    <rect x=\"220\" y=\"34\" width=\"80\" height=\"30\" rx=\"6\"/>\r\n  </g>\r\n  <g fill=\"#E8E4D8\" text-anchor=\"middle\">\r\n    <text x=\"80\" y=\"54\">(0, \"a\")</text><text x=\"170\" y=\"54\">(1, \"b\")</text><text x=\"260\" y=\"54\">(2, \"c\")</text>\r\n  </g>\r\n  <g fill=\"#7FD1C0\" text-anchor=\"middle\" font-size=\"10\">\r\n    <text x=\"80\" y=\"86\">chỉ số, giá trị</text><text x=\"170\" y=\"86\">chỉ số, giá trị</text><text x=\"260\" y=\"86\">chỉ số, giá trị</text>\r\n  </g>\r\n  <text x=\"170\" y=\"108\" text-anchor=\"middle\" fill=\"#F5B942\">for i, v in enumerate(items):</text>\r\n</svg>\r\n<figcaption><code>enumerate</code> ghép mỗi phần tử với chỉ số của nó, nên <code>for i, v in enumerate(items)</code> cho bạn cả hai cùng lúc.</figcaption>\r\n</figure>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 4.</b> Cho <code>tasks = [\"Buy milk\", \"Call Anna\", \"Wash car\"]</code>, dựng list <code>lines</code> gồm các chuỗi <code>\"N. task\"</code> dùng <code>enumerate(tasks, start=1)</code> → <code>['1. Buy milk', '2. Call Anna', '3. Wash car']</code>.</span>\r\n<template class=\"st\">tasks = [\"Buy milk\", \"Call Anna\", \"Wash car\"]\r\nlines = []\r\n# use enumerate to number the tasks\r\n</template>\r\n<template class=\"ts\">assert lines == [\"1. Buy milk\", \"2. Call Anna\", \"3. Wash car\"]\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 5.</b> Cho <code>names = [\"a\", \"b\", \"c\"]</code>, dùng <code>enumerate</code> để tìm chỉ số của <code>\"b\"</code> vào <code>pos</code> (bắt đầu <code>pos = -1</code>). Kết quả <code>1</code>.</span>\r\n<template class=\"st\">names = [\"a\", \"b\", \"c\"]\r\npos = -1\r\n# use enumerate to find the index of \"b\"\r\n</template>\r\n<template class=\"ts\">assert pos == 1\r\n</template></div>\r\n\r\n<h4>4. Duyệt qua các cặp</h4>\r\n<p>Khi một list chứa các tuple, hãy bung chúng ngay trên dòng <code>for</code>. Đây cũng đúng là cách bạn duyệt <code>.items()</code> của một dictionary.</p>\r\n<pre class=\"run\">pairs = [(\"a\", 1), (\"b\", 2), (\"c\", 3)]\r\ntotal = 0\r\nfor letter, number in pairs:\r\n    total += number\r\nprint(total)   # 6</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 6.</b> Cho <code>pairs = [(\"a\", 1), (\"b\", 2), (\"c\", 3)]</code>, cộng giá trị thứ hai của mỗi cặp vào <code>total</code> bằng cách bung trong vòng lặp. Kết quả <code>6</code>.</span>\r\n<template class=\"st\">pairs = [(\"a\", 1), (\"b\", 2), (\"c\", 3)]\r\ntotal = 0\r\n# unpack each pair and sum the numbers\r\n</template>\r\n<template class=\"ts\">assert total == 6\r\n</template></div>\r\n\r\n<h4>5. zip: ghép cặp hai list</h4>\r\n<p><code>zip</code> duyệt hai list song song, cho ra các tuple gồm những phần tử tương ứng. Tuyệt vời để kết hợp dữ liệu liên quan — và <code>dict(zip(...))</code> biến hai list thành một dictionary.</p>\r\n<pre class=\"run\">names = [\"Anna\", \"Ben\"]\r\nages = [30, 25]\r\npaired = list(zip(names, ages))\r\nprint(paired)              # [('Anna', 30), ('Ben', 25)]\r\nprint(dict(zip(names, ages)))   # {'Anna': 30, 'Ben': 25}</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 7.</b> Cho <code>names = [\"a\", \"b\"]</code> và <code>ages = [20, 30]</code>, dựng <code>paired</code> = một list các tuple ghép chúng → <code>[('a', 20), ('b', 30)]</code>. (Dùng <code>zip</code> và <code>list</code>.)</span>\r\n<template class=\"st\">names = [\"a\", \"b\"]\r\nages = [20, 30]\r\npaired = []\r\n# zip the two lists into a list of tuples\r\n</template>\r\n<template class=\"ts\">assert paired == [(\"a\", 20), (\"b\", 30)]\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 8.</b> Với cùng <code>names</code> và <code>ages</code>, dựng một dictionary <code>ages_by_name</code> ánh xạ mỗi tên tới tuổi của nó → <code>{'a': 20, 'b': 30}</code>. (Dùng <code>dict(zip(...))</code>.)</span>\r\n<template class=\"st\">names = [\"a\", \"b\"]\r\nages = [20, 30]\r\nages_by_name = {}\r\n# build the dict from the two lists\r\n</template>\r\n<template class=\"ts\">assert ages_by_name == {\"a\": 20, \"b\": 30}\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 9.</b> Cho <code>words = [\"x\", \"y\", \"z\"]</code>, dựng một dictionary <code>indexed</code> ánh xạ mỗi chỉ số tới từ của nó → <code>{0: 'x', 1: 'y', 2: 'z'}</code>. (Dùng <code>enumerate</code>.)</span>\r\n<template class=\"st\">words = [\"x\", \"y\", \"z\"]\r\nindexed = {}\r\n# map each index to its word\r\n</template>\r\n<template class=\"ts\">assert indexed == {0: \"x\", 1: \"y\", 2: \"z\"}\r\n</template></div>\r\n<div class=\"ex stretch\" data-kind=\"py\"><span class=\"exq\"><b>🔥 Nâng cao (người điểm cao nhất).</b> Cho <code>scores = [(\"Anna\", 85), (\"Ben\", 92), (\"Cara\", 78)]</code>, tìm <b>tên</b> có điểm cao nhất vào <code>winner</code> bằng cách bung mỗi cặp trong vòng lặp. Kết quả <code>\"Ben\"</code>.</span>\r\n<template class=\"st\">scores = [(\"Anna\", 85), (\"Ben\", 92), (\"Cara\", 78)]\r\nwinner = \"\"\r\nbest = -1\r\n# unpack each (name, score) and track the best\r\n</template>\r\n<template class=\"ts\">assert winner == \"Ben\"\r\n</template></div>\r\n\r\n<div class=\"recap\">Tóm tắt bài 16: một <b>tuple</b> là một nhóm có thứ tự, <b>bất biến</b> — hợp cho bản ghi cố định như <code>(x, y)</code> · <b>bung</b> một tuple vào các tên (<code>x, y = point</code>) và hoán đổi trong một dòng (<code>a, b = b, a</code>) · <code>enumerate</code> cho chỉ số + giá trị trong vòng lặp (<code>for i, v in enumerate(items, start=1)</code>) · bung tuple ngay trên dòng <code>for</code> · <code>zip</code> ghép cặp hai list, và <code>dict(zip(...))</code> dựng một dictionary. Bài sau: <b>set &amp; sắp xếp cơ bản</b> — loại bỏ trùng lặp và sắp thứ tự dữ liệu.</div>\r\n\r\n<h4>🏠 Bài tập về nhà</h4>\r\n<p>Bốn bài tập được chấm điểm — làm ngay tại đây trước bài kế tiếp.</p>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Bài về nhà 1.</b> Cho <code>point = (10, 20)</code>, bung nó vào <code>x</code> và <code>y</code>, rồi dựng <code>label</code> = <code>\"x=10, y=20\"</code> dùng f-string.</span>\r\n<template class=\"st\">point = (10, 20)\r\nlabel = \"\"\r\n# unpack, then build \"x=10, y=20\"\r\n</template>\r\n<template class=\"ts\">assert label == \"x=10, y=20\"\r\n</template></div>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Bài về nhà 2.</b> Cho <code>fruits = [\"apple\", \"pear\", \"plum\"]</code>, dựng list <code>menu</code> gồm các chuỗi <code>\"N) fruit\"</code> dùng <code>enumerate(fruits, start=1)</code> → <code>['1) apple', '2) pear', '3) plum']</code>.</span>\r\n<template class=\"st\">fruits = [\"apple\", \"pear\", \"plum\"]\r\nmenu = []\r\n# number the fruits like \"1) apple\"\r\n</template>\r\n<template class=\"ts\">assert menu == [\"1) apple\", \"2) pear\", \"3) plum\"]\r\n</template></div>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Bài về nhà 3.</b> Cho <code>keys = [\"a\", \"b\", \"c\"]</code> và <code>vals = [1, 2, 3]</code>, dựng một dictionary <code>d</code> ghép cặp chúng → <code>{'a': 1, 'b': 2, 'c': 3}</code>. (Dùng <code>dict(zip(...))</code>.)</span>\r\n<template class=\"st\">keys = [\"a\", \"b\", \"c\"]\r\nvals = [1, 2, 3]\r\nd = {}\r\n# build the dict from the two lists\r\n</template>\r\n<template class=\"ts\">assert d == {\"a\": 1, \"b\": 2, \"c\": 3}\r\n</template></div>\r\n<div class=\"ex homework stretch\" data-kind=\"py\"><span class=\"exq\"><b>🔥 Bài về nhà 4 (nâng cao).</b> Cho <code>scores = [(\"Anna\", 85), (\"Ben\", 70), (\"Cara\", 90)]</code>, dựng <code>passed</code> = tên những người có điểm <b>80 trở lên</b>, bằng cách bung mỗi cặp → <code>['Anna', 'Cara']</code>.</span>\r\n<template class=\"st\">scores = [(\"Anna\", 85), (\"Ben\", 70), (\"Cara\", 90)]\r\npassed = []\r\n# collect names with score >= 80\r\n</template>\r\n<template class=\"ts\">assert passed == [\"Anna\", \"Cara\"]\r\n</template></div>","en":"<h3>Lesson 16 — Tuples, unpacking &amp; enumerate</h3>\r\n<p>You've quietly been using <b>tuples</b> already — every time a function returned two values, or you wrote <code>(3, 4)</code>. A tuple is like a list, but <b>fixed</b>: once made, you can't change its contents. That sounds like a limitation, but it's exactly what you want for things that come in a set shape and shouldn't be edited by accident — a coordinate <code>(x, y)</code>, an RGB colour, a <code>(name, score)</code> pair.</p>\r\n<p>Alongside tuples come two everyday conveniences: <b>unpacking</b> (splitting a tuple straight into named variables) and <b>enumerate</b> (looping over a list while getting each item's index for free). Both make your code shorter and much easier to read than juggling index numbers by hand.</p>\r\n<p>These are small tools, but you'll reach for them in almost every program from here on. Let's make them second nature.</p>\r\n\r\n<h4>1. Tuples: fixed groups of values</h4>\r\n<p>Write a tuple with commas, usually inside parentheses. You read it by index just like a list — but you <b>can't</b> reassign its items.</p>\r\n<pre class=\"run\">point = (3, 4)\r\nprint(point[0])     # 3\r\nprint(point[1])     # 4\r\n# point[0] = 9      # ERROR — tuples are immutable</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 1.</b> Create a tuple <code>rgb</code> holding <code>255</code>, <code>128</code>, <code>0</code> (in that order). So <code>rgb</code> is <code>(255, 128, 0)</code>.</span>\r\n<template class=\"st\"># create the rgb tuple\r\nrgb = \r\n</template>\r\n<template class=\"ts\">assert rgb == (255, 128, 0)\r\n</template></div>\r\n\r\n<h4>2. Unpacking a tuple</h4>\r\n<p>Assign a tuple to several names at once and Python hands each value to its own variable. Cleaner than <code>point[0]</code>, <code>point[1]</code> everywhere.</p>\r\n<pre class=\"run\">point = (3, 4)\r\nx, y = point         # unpack\r\nprint(x, y)          # 3 4\r\n\r\na, b = 1, 2\r\na, b = b, a          # swap in one line!\r\nprint(a, b)          # 2 1</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 2.</b> Given <code>point = (3, 4)</code>, unpack it into <code>x</code> and <code>y</code>, then set <code>s</code> to their sum. So <code>s</code> is <code>7</code>.</span>\r\n<template class=\"st\">point = (3, 4)\r\n# unpack into x and y, then sum them into s\r\ns = 0\r\n</template>\r\n<template class=\"ts\">assert s == 7\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 3.</b> Given <code>a = 1</code> and <code>b = 2</code>, <b>swap</b> them using unpacking so that <code>a</code> becomes <code>2</code> and <code>b</code> becomes <code>1</code>.</span>\r\n<template class=\"st\">a = 1\r\nb = 2\r\n# swap a and b\r\n</template>\r\n<template class=\"ts\">assert a == 2 and b == 1\r\n</template></div>\r\n\r\n<h4>3. enumerate: index and value together</h4>\r\n<p>You often need both the position and the item while looping. Instead of <code>range(len(...))</code> and manual indexing, <code>enumerate</code> hands you both. Add <code>start=1</code> to count from 1.</p>\r\n<pre class=\"run\">tasks = [\"Buy milk\", \"Call Anna\"]\r\nfor i, task in enumerate(tasks, start=1):\r\n    print(f\"{i}. {task}\")\r\n# 1. Buy milk\r\n# 2. Call Anna</pre>\r\n<figure class=\"diagram\">\r\n<svg viewBox=\"0 0 340 120\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11\">\r\n  <text x=\"170\" y=\"16\" text-anchor=\"middle\" fill=\"#8FA0BC\">enumerate([\"a\", \"b\", \"c\"]) yields pairs</text>\r\n  <g stroke=\"#22304C\" fill=\"#121C30\">\r\n    <rect x=\"40\" y=\"34\" width=\"80\" height=\"30\" rx=\"6\"/>\r\n    <rect x=\"130\" y=\"34\" width=\"80\" height=\"30\" rx=\"6\"/>\r\n    <rect x=\"220\" y=\"34\" width=\"80\" height=\"30\" rx=\"6\"/>\r\n  </g>\r\n  <g fill=\"#E8E4D8\" text-anchor=\"middle\">\r\n    <text x=\"80\" y=\"54\">(0, \"a\")</text><text x=\"170\" y=\"54\">(1, \"b\")</text><text x=\"260\" y=\"54\">(2, \"c\")</text>\r\n  </g>\r\n  <g fill=\"#7FD1C0\" text-anchor=\"middle\" font-size=\"10\">\r\n    <text x=\"80\" y=\"86\">index, value</text><text x=\"170\" y=\"86\">index, value</text><text x=\"260\" y=\"86\">index, value</text>\r\n  </g>\r\n  <text x=\"170\" y=\"108\" text-anchor=\"middle\" fill=\"#F5B942\">for i, v in enumerate(items):</text>\r\n</svg>\r\n<figcaption><code>enumerate</code> pairs each item with its index, so <code>for i, v in enumerate(items)</code> gives you both at once.</figcaption>\r\n</figure>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 4.</b> Given <code>tasks = [\"Buy milk\", \"Call Anna\", \"Wash car\"]</code>, build a list <code>lines</code> of <code>\"N. task\"</code> strings using <code>enumerate(tasks, start=1)</code> → <code>['1. Buy milk', '2. Call Anna', '3. Wash car']</code>.</span>\r\n<template class=\"st\">tasks = [\"Buy milk\", \"Call Anna\", \"Wash car\"]\r\nlines = []\r\n# use enumerate to number the tasks\r\n</template>\r\n<template class=\"ts\">assert lines == [\"1. Buy milk\", \"2. Call Anna\", \"3. Wash car\"]\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 5.</b> Given <code>names = [\"a\", \"b\", \"c\"]</code>, use <code>enumerate</code> to find the index of <code>\"b\"</code> into <code>pos</code> (start <code>pos = -1</code>). Result <code>1</code>.</span>\r\n<template class=\"st\">names = [\"a\", \"b\", \"c\"]\r\npos = -1\r\n# use enumerate to find the index of \"b\"\r\n</template>\r\n<template class=\"ts\">assert pos == 1\r\n</template></div>\r\n\r\n<h4>4. Looping over pairs</h4>\r\n<p>When a list holds tuples, unpack them right in the <code>for</code> line. This is exactly how you loop a dictionary's <code>.items()</code> too.</p>\r\n<pre class=\"run\">pairs = [(\"a\", 1), (\"b\", 2), (\"c\", 3)]\r\ntotal = 0\r\nfor letter, number in pairs:\r\n    total += number\r\nprint(total)   # 6</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 6.</b> Given <code>pairs = [(\"a\", 1), (\"b\", 2), (\"c\", 3)]</code>, add up the second value of each pair into <code>total</code> by unpacking in the loop. Result <code>6</code>.</span>\r\n<template class=\"st\">pairs = [(\"a\", 1), (\"b\", 2), (\"c\", 3)]\r\ntotal = 0\r\n# unpack each pair and sum the numbers\r\n</template>\r\n<template class=\"ts\">assert total == 6\r\n</template></div>\r\n\r\n<h4>5. zip: pairing two lists</h4>\r\n<p><code>zip</code> walks two lists side by side, giving tuples of matching items. Perfect for combining related data — and <code>dict(zip(...))</code> turns two lists into a dictionary.</p>\r\n<pre class=\"run\">names = [\"Anna\", \"Ben\"]\r\nages = [30, 25]\r\npaired = list(zip(names, ages))\r\nprint(paired)              # [('Anna', 30), ('Ben', 25)]\r\nprint(dict(zip(names, ages)))   # {'Anna': 30, 'Ben': 25}</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 7.</b> Given <code>names = [\"a\", \"b\"]</code> and <code>ages = [20, 30]</code>, build <code>paired</code> = a list of tuples pairing them → <code>[('a', 20), ('b', 30)]</code>. (Use <code>zip</code> and <code>list</code>.)</span>\r\n<template class=\"st\">names = [\"a\", \"b\"]\r\nages = [20, 30]\r\npaired = []\r\n# zip the two lists into a list of tuples\r\n</template>\r\n<template class=\"ts\">assert paired == [(\"a\", 20), (\"b\", 30)]\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 8.</b> Given the same <code>names</code> and <code>ages</code>, build a dictionary <code>ages_by_name</code> mapping each name to its age → <code>{'a': 20, 'b': 30}</code>. (Use <code>dict(zip(...))</code>.)</span>\r\n<template class=\"st\">names = [\"a\", \"b\"]\r\nages = [20, 30]\r\nages_by_name = {}\r\n# build the dict from the two lists\r\n</template>\r\n<template class=\"ts\">assert ages_by_name == {\"a\": 20, \"b\": 30}\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 9.</b> Given <code>words = [\"x\", \"y\", \"z\"]</code>, build a dictionary <code>indexed</code> mapping each index to its word → <code>{0: 'x', 1: 'y', 2: 'z'}</code>. (Use <code>enumerate</code>.)</span>\r\n<template class=\"st\">words = [\"x\", \"y\", \"z\"]\r\nindexed = {}\r\n# map each index to its word\r\n</template>\r\n<template class=\"ts\">assert indexed == {0: \"x\", 1: \"y\", 2: \"z\"}\r\n</template></div>\r\n<div class=\"ex stretch\" data-kind=\"py\"><span class=\"exq\"><b>🔥 Stretch (top scorer).</b> Given <code>scores = [(\"Anna\", 85), (\"Ben\", 92), (\"Cara\", 78)]</code>, find the <b>name</b> with the highest score into <code>winner</code> by unpacking each pair in a loop. Result <code>\"Ben\"</code>.</span>\r\n<template class=\"st\">scores = [(\"Anna\", 85), (\"Ben\", 92), (\"Cara\", 78)]\r\nwinner = \"\"\r\nbest = -1\r\n# unpack each (name, score) and track the best\r\n</template>\r\n<template class=\"ts\">assert winner == \"Ben\"\r\n</template></div>\r\n\r\n<div class=\"recap\">Recap of lesson 16: a <b>tuple</b> is an ordered, <b>immutable</b> group — great for fixed records like <code>(x, y)</code> · <b>unpack</b> a tuple into names (<code>x, y = point</code>) and swap in one line (<code>a, b = b, a</code>) · <code>enumerate</code> gives index + value in a loop (<code>for i, v in enumerate(items, start=1)</code>) · unpack tuples right in the <code>for</code> line · <code>zip</code> pairs two lists, and <code>dict(zip(...))</code> builds a dictionary. Next: <b>sets &amp; sorting basics</b> — removing duplicates and ordering data.</div>\r\n\r\n<h4>🏠 Homework</h4>\r\n<p>Four graded exercises — do them right here before the next lesson.</p>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Homework 1.</b> Given <code>point = (10, 20)</code>, unpack it into <code>x</code> and <code>y</code>, then build <code>label</code> = <code>\"x=10, y=20\"</code> using an f-string.</span>\r\n<template class=\"st\">point = (10, 20)\r\nlabel = \"\"\r\n# unpack, then build \"x=10, y=20\"\r\n</template>\r\n<template class=\"ts\">assert label == \"x=10, y=20\"\r\n</template></div>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Homework 2.</b> Given <code>fruits = [\"apple\", \"pear\", \"plum\"]</code>, build a list <code>menu</code> of <code>\"N) fruit\"</code> strings using <code>enumerate(fruits, start=1)</code> → <code>['1) apple', '2) pear', '3) plum']</code>.</span>\r\n<template class=\"st\">fruits = [\"apple\", \"pear\", \"plum\"]\r\nmenu = []\r\n# number the fruits like \"1) apple\"\r\n</template>\r\n<template class=\"ts\">assert menu == [\"1) apple\", \"2) pear\", \"3) plum\"]\r\n</template></div>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Homework 3.</b> Given <code>keys = [\"a\", \"b\", \"c\"]</code> and <code>vals = [1, 2, 3]</code>, build a dictionary <code>d</code> pairing them → <code>{'a': 1, 'b': 2, 'c': 3}</code>. (Use <code>dict(zip(...))</code>.)</span>\r\n<template class=\"st\">keys = [\"a\", \"b\", \"c\"]\r\nvals = [1, 2, 3]\r\nd = {}\r\n# build the dict from the two lists\r\n</template>\r\n<template class=\"ts\">assert d == {\"a\": 1, \"b\": 2, \"c\": 3}\r\n</template></div>\r\n<div class=\"ex homework stretch\" data-kind=\"py\"><span class=\"exq\"><b>🔥 Homework 4 (stretch).</b> Given <code>scores = [(\"Anna\", 85), (\"Ben\", 70), (\"Cara\", 90)]</code>, build <code>passed</code> = the names whose score is <b>80 or more</b>, by unpacking each pair → <code>['Anna', 'Cara']</code>.</span>\r\n<template class=\"st\">scores = [(\"Anna\", 85), (\"Ben\", 70), (\"Cara\", 90)]\r\npassed = []\r\n# collect names with score >= 80\r\n</template>\r\n<template class=\"ts\">assert passed == [\"Anna\", \"Cara\"]\r\n</template></div>"}},{"t":{"vi":"Set & sắp xếp cơ bản","en":"Sets & sorting basics"},"html":{"vi":"<h3>Bài 17 — Set &amp; sắp xếp cơ bản</h3>\r\n<p>Hai nhu cầu hằng ngày xuất hiện liên tục khi bạn xử lý dữ liệu thật: loại bỏ <b>trùng lặp</b>, và sắp xếp mọi thứ theo <b>thứ tự</b>. Python có một công cụ gọn cho mỗi việc. Một <b>set</b> là một tập hợp tự động chỉ giữ các giá trị duy nhất — hoàn hảo cho câu \"có bao nhiêu thứ <i>khác nhau</i> ở đây?\". Và <code>sorted()</code> nhận bất kỳ list nào rồi trả về một bản sao đã sắp gọn gàng.</p>\r\n<p>Trên đường đi bạn sẽ gặp ba hàm dựng sẵn nhỏ xíu mà bạn sẽ dùng mãi: <code>min</code>, <code>max</code>, và <code>sum</code>. Cùng với set và sắp xếp, chúng biến một đống số thành câu trả lời — nhỏ nhất, lớn nhất, tổng, thứ hạng — chỉ trong một dòng.</p>\r\n<p>Bài này giữ đúng mức căn bản: ta sắp xếp bằng <code>sorted()</code> thường và <code>reverse=True</code>. (Thứ tự sắp xếp tùy chỉnh bằng <code>key</code> sẽ có ở khóa Trung cấp.)</p>\r\n\r\n<h4>1. Set: các giá trị duy nhất</h4>\r\n<p>Một set dùng dấu ngoặc nhọn như dict, nhưng chứa từng giá trị đơn, không phải cặp. Sức mạnh của nó: âm thầm bỏ đi trùng lặp. Biến một list thành <code>set</code> là cách chuẩn để tìm các phần tử khác nhau.</p>\r\n<pre class=\"run\">nums = [1, 2, 2, 3, 3, 3]\r\nunique = set(nums)\r\nprint(unique)        # {1, 2, 3}\r\nprint(len(unique))   # 3  — ba giá trị khác nhau</pre>\r\n<figure class=\"diagram\">\r\n<svg viewBox=\"0 0 340 96\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"IBM Plex Mono, monospace\" font-size=\"12\">\r\n  <defs>\r\n    <marker id=\"a17v\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\">\r\n      <path d=\"M0 0 L10 5 L0 10 z\" fill=\"#7FD1C0\"/>\r\n    </marker>\r\n  </defs>\r\n  <rect x=\"16\" y=\"34\" width=\"150\" height=\"34\" rx=\"7\" fill=\"#121C30\" stroke=\"#22304C\"/>\r\n  <text x=\"91\" y=\"56\" text-anchor=\"middle\" fill=\"#E8E4D8\">[1, 2, 2, 3, 3, 3]</text>\r\n  <text x=\"91\" y=\"26\" text-anchor=\"middle\" fill=\"#8FA0BC\" font-size=\"10\">một list (có lặp)</text>\r\n  <text x=\"200\" y=\"56\" text-anchor=\"middle\" fill=\"#F5B942\">set()</text>\r\n  <rect x=\"242\" y=\"34\" width=\"82\" height=\"34\" rx=\"7\" fill=\"#0E1626\" stroke=\"#22304C\"/>\r\n  <text x=\"283\" y=\"56\" text-anchor=\"middle\" fill=\"#7FD1C0\">{1, 2, 3}</text>\r\n  <text x=\"283\" y=\"26\" text-anchor=\"middle\" fill=\"#8FA0BC\" font-size=\"10\">duy nhất</text>\r\n  <g stroke=\"#7FD1C0\" stroke-width=\"1.4\" marker-end=\"url(#a17v)\" fill=\"none\">\r\n    <line x1=\"166\" y1=\"51\" x2=\"180\" y2=\"51\"/>\r\n    <line x1=\"220\" y1=\"51\" x2=\"240\" y2=\"51\"/>\r\n  </g>\r\n</svg>\r\n<figcaption>Bọc một list trong <code>set(...)</code> vứt bỏ trùng lặp, chỉ để lại các giá trị khác nhau.</figcaption>\r\n</figure>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 1.</b> Cho <code>nums = [1, 2, 2, 3, 3, 3]</code>, gán <code>distinct</code> bằng số giá trị <b>khác nhau</b>. Kết quả <code>3</code>. (Dùng <code>set</code> và <code>len</code>.)</span>\r\n<template class=\"st\">nums = [1, 2, 2, 3, 3, 3]\r\ndistinct = 0\r\n# count the distinct values\r\n</template>\r\n<template class=\"ts\">assert distinct == 3\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 2.</b> Cho <code>tags = {\"python\", \"sql\", \"qa\"}</code>, gán <code>has_sql</code> bằng việc <code>\"sql\"</code> có trong set hay không. Kết quả <code>True</code>. (Kiểm tra thành viên trên set rất nhanh.)</span>\r\n<template class=\"st\">tags = {\"python\", \"sql\", \"qa\"}\r\nhas_sql = None\r\n# is \"sql\" in the set?\r\n</template>\r\n<template class=\"ts\">assert has_sql == True\r\n</template></div>\r\n\r\n<h4>2. Kết hợp các set</h4>\r\n<p>Các set có thể kết hợp như trong toán học: <code>|</code> là <b>hợp (union)</b> (mọi thứ trong một trong hai), <code>&amp;</code> là <b>giao (intersection)</b> (chỉ những gì có ở cả hai).</p>\r\n<pre class=\"run\">a = {1, 2, 3}\r\nb = {2, 3, 4}\r\nprint(a | b)   # {1, 2, 3, 4}  — hợp\r\nprint(a & b)   # {2, 3}        — có ở cả hai</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 3.</b> Cho <code>a = {1, 2, 3}</code> và <code>b = {2, 3, 4}</code>, dựng <code>combined</code> = hợp của chúng → <code>{1, 2, 3, 4}</code>.</span>\r\n<template class=\"st\">a = {1, 2, 3}\r\nb = {2, 3, 4}\r\ncombined = set()\r\n# union of a and b\r\n</template>\r\n<template class=\"ts\">assert combined == {1, 2, 3, 4}\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 4.</b> Với cùng <code>a</code> và <code>b</code>, dựng <code>shared</code> = các giá trị có ở <b>cả hai</b> → <code>{2, 3}</code>.</span>\r\n<template class=\"st\">a = {1, 2, 3}\r\nb = {2, 3, 4}\r\nshared = set()\r\n# intersection of a and b\r\n</template>\r\n<template class=\"ts\">assert shared == {2, 3}\r\n</template></div>\r\n\r\n<h4>3. Sắp xếp với sorted()</h4>\r\n<p><code>sorted(list)</code> trả về một list <b>mới</b> theo thứ tự tăng dần — nó không đổi list gốc. Thêm <code>reverse=True</code> để giảm dần. Nó chạy được với số và, theo thứ tự bảng chữ cái, với chuỗi.</p>\r\n<pre class=\"run\">nums = [3, 1, 2]\r\nprint(sorted(nums))               # [1, 2, 3]\r\nprint(sorted(nums, reverse=True)) # [3, 2, 1]\r\nprint(sorted([\"banana\", \"apple\", \"cherry\"]))  # ['apple', 'banana', 'cherry']</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 5.</b> Cho <code>nums = [3, 1, 2]</code>, dựng <code>ordered</code> = các số sắp tăng dần → <code>[1, 2, 3]</code>.</span>\r\n<template class=\"st\">nums = [3, 1, 2]\r\nordered = []\r\n# sort ascending\r\n</template>\r\n<template class=\"ts\">assert ordered == [1, 2, 3]\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 6.</b> Cho <code>nums = [3, 1, 2]</code>, dựng <code>desc</code> = các số sắp từ lớn tới nhỏ → <code>[3, 2, 1]</code>. (Dùng <code>reverse=True</code>.)</span>\r\n<template class=\"st\">nums = [3, 1, 2]\r\ndesc = []\r\n# sort descending\r\n</template>\r\n<template class=\"ts\">assert desc == [3, 2, 1]\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 7.</b> Cho <code>words = [\"banana\", \"apple\", \"cherry\"]</code>, dựng <code>alpha</code> = các từ theo thứ tự bảng chữ cái → <code>['apple', 'banana', 'cherry']</code>.</span>\r\n<template class=\"st\">words = [\"banana\", \"apple\", \"cherry\"]\r\nalpha = []\r\n# sort alphabetically\r\n</template>\r\n<template class=\"ts\">assert alpha == [\"apple\", \"banana\", \"cherry\"]\r\n</template></div>\r\n\r\n<h4>4. min, max, sum</h4>\r\n<p>Ba hàm dựng sẵn trả lời những câu hỏi thường gặp nhất về một list số, mỗi câu chỉ một từ.</p>\r\n<pre class=\"run\">nums = [4, 2, 8, 6]\r\nprint(min(nums))   # 2\r\nprint(max(nums))   # 8\r\nprint(sum(nums))   # 20</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 8.</b> Cho <code>nums = [4, 2, 8, 6]</code>, gán <code>lowest</code>, <code>highest</code>, và <code>total</code> dùng <code>min</code>, <code>max</code>, và <code>sum</code>. Kết quả <code>2</code>, <code>8</code>, <code>20</code>.</span>\r\n<template class=\"st\">nums = [4, 2, 8, 6]\r\nlowest = 0\r\nhighest = 0\r\ntotal = 0\r\n# use min, max, sum\r\n</template>\r\n<template class=\"ts\">assert lowest == 2 and highest == 8 and total == 20\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 9.</b> Cho <code>nums = [3, 1, 2, 3, 1]</code>, dựng <code>unique_sorted</code> = các giá trị khác nhau theo thứ tự tăng dần → <code>[1, 2, 3]</code>. (Kết hợp <code>set</code> và <code>sorted</code>.)</span>\r\n<template class=\"st\">nums = [3, 1, 2, 3, 1]\r\nunique_sorted = []\r\n# distinct values, sorted ascending\r\n</template>\r\n<template class=\"ts\">assert unique_sorted == [1, 2, 3]\r\n</template></div>\r\n<div class=\"ex stretch\" data-kind=\"py\"><span class=\"exq\"><b>🔥 Nâng cao (ba giá trị lớn nhất).</b> Cho <code>nums = [5, 2, 8, 1, 9, 3]</code>, dựng <code>top3</code> = ba giá trị lớn nhất, lớn nhất trước → <code>[9, 8, 5]</code>. (Sắp giảm dần, rồi lấy ba cái đầu bằng <code>[:3]</code>.)</span>\r\n<template class=\"st\">nums = [5, 2, 8, 1, 9, 3]\r\ntop3 = []\r\n# the three largest, biggest first\r\n</template>\r\n<template class=\"ts\">assert top3 == [9, 8, 5]\r\n</template></div>\r\n\r\n<div class=\"recap\">Tóm tắt bài 17: một <b>set</b> chỉ giữ các giá trị <b>duy nhất</b> — <code>set(list)</code> bỏ trùng lặp, kiểm tra thành viên (<code>in</code>) nhanh, và <code>|</code> / <code>&amp;</code> cho hợp / giao · <code>sorted(list)</code> trả về list tăng dần mới, <code>reverse=True</code> để giảm dần, và chạy với chuỗi theo bảng chữ cái · <code>min</code>, <code>max</code>, <code>sum</code> trả lời nhỏ nhất / lớn nhất / tổng trong một từ · kết hợp chúng (ví dụ <code>sorted(set(...))</code>) để có kết quả duy nhất, có thứ tự. Bài sau: <b>bộ công cụ xử lý văn bản</b> — tách, ghép và làm sạch chuỗi. (Thứ tự sắp xếp tùy chỉnh bằng <code>key</code> có ở Python Trung cấp.)</div>\r\n\r\n<h4>🏠 Bài tập về nhà</h4>\r\n<p>Bốn bài tập được chấm điểm — làm ngay tại đây trước bài kế tiếp.</p>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Bài về nhà 1.</b> Cho <code>letters = [\"a\", \"b\", \"a\", \"c\", \"a\"]</code>, gán <code>distinct</code> bằng số chữ khác nhau. Kết quả <code>3</code>.</span>\r\n<template class=\"st\">letters = [\"a\", \"b\", \"a\", \"c\", \"a\"]\r\ndistinct = 0\r\n# count the distinct letters\r\n</template>\r\n<template class=\"ts\">assert distinct == 3\r\n</template></div>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Bài về nhà 2.</b> Cho <code>nums = [30, 10, 20]</code>, dựng <code>ordered</code> = các số sắp tăng dần → <code>[10, 20, 30]</code>.</span>\r\n<template class=\"st\">nums = [30, 10, 20]\r\nordered = []\r\n# sort ascending\r\n</template>\r\n<template class=\"ts\">assert ordered == [10, 20, 30]\r\n</template></div>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Bài về nhà 3.</b> Cho <code>a = {1, 2, 3}</code> và <code>b = {3, 4, 5}</code>, dựng <code>shared</code> = các giá trị có ở cả hai → <code>{3}</code>.</span>\r\n<template class=\"st\">a = {1, 2, 3}\r\nb = {3, 4, 5}\r\nshared = set()\r\n# values in both sets\r\n</template>\r\n<template class=\"ts\">assert shared == {3}\r\n</template></div>\r\n<div class=\"ex homework stretch\" data-kind=\"py\"><span class=\"exq\"><b>🔥 Bài về nhà 4 (nâng cao).</b> Cho <code>scores = [70, 90, 50, 90, 60]</code>, dựng <code>top2</code> = hai điểm <b>khác nhau</b> cao nhất, lớn nhất trước → <code>[90, 70]</code>. (Bỏ trùng lặp, sắp giảm dần, lấy hai cái đầu.)</span>\r\n<template class=\"st\">scores = [70, 90, 50, 90, 60]\r\ntop2 = []\r\n# two highest distinct scores, biggest first\r\n</template>\r\n<template class=\"ts\">assert top2 == [90, 70]\r\n</template></div>","en":"<h3>Lesson 17 — Sets &amp; sorting basics</h3>\r\n<p>Two everyday needs come up constantly once you handle real data: getting rid of <b>duplicates</b>, and putting things in <b>order</b>. Python has a clean tool for each. A <b>set</b> is a collection that automatically keeps only unique values — perfect for \"how many <i>different</i> things are here?\". And <code>sorted()</code> takes any list and hands back a tidy, ordered copy.</p>\r\n<p>Along the way you'll meet three tiny built-in functions you'll use forever: <code>min</code>, <code>max</code>, and <code>sum</code>. Together with sets and sorting, they turn a pile of numbers into answers — the smallest, the largest, the total, the ranking — in a single line.</p>\r\n<p>This keeps things firmly at the fundamentals level: we sort with plain <code>sorted()</code> and <code>reverse=True</code>. (Custom sort orders with <code>key</code> come in the Intermediate course.)</p>\r\n\r\n<h4>1. Sets: unique values</h4>\r\n<p>A set uses curly braces like a dict, but holds single values, not pairs. Its superpower: it silently drops duplicates. Turning a list into a <code>set</code> is the standard way to find the distinct items.</p>\r\n<pre class=\"run\">nums = [1, 2, 2, 3, 3, 3]\r\nunique = set(nums)\r\nprint(unique)        # {1, 2, 3}\r\nprint(len(unique))   # 3  — three distinct values</pre>\r\n<figure class=\"diagram\">\r\n<svg viewBox=\"0 0 340 96\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"IBM Plex Mono, monospace\" font-size=\"12\">\r\n  <defs>\r\n    <marker id=\"a17\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\">\r\n      <path d=\"M0 0 L10 5 L0 10 z\" fill=\"#7FD1C0\"/>\r\n    </marker>\r\n  </defs>\r\n  <rect x=\"16\" y=\"34\" width=\"150\" height=\"34\" rx=\"7\" fill=\"#121C30\" stroke=\"#22304C\"/>\r\n  <text x=\"91\" y=\"56\" text-anchor=\"middle\" fill=\"#E8E4D8\">[1, 2, 2, 3, 3, 3]</text>\r\n  <text x=\"91\" y=\"26\" text-anchor=\"middle\" fill=\"#8FA0BC\" font-size=\"10\">a list (with repeats)</text>\r\n  <text x=\"200\" y=\"56\" text-anchor=\"middle\" fill=\"#F5B942\">set()</text>\r\n  <rect x=\"242\" y=\"34\" width=\"82\" height=\"34\" rx=\"7\" fill=\"#0E1626\" stroke=\"#22304C\"/>\r\n  <text x=\"283\" y=\"56\" text-anchor=\"middle\" fill=\"#7FD1C0\">{1, 2, 3}</text>\r\n  <text x=\"283\" y=\"26\" text-anchor=\"middle\" fill=\"#8FA0BC\" font-size=\"10\">unique</text>\r\n  <g stroke=\"#7FD1C0\" stroke-width=\"1.4\" marker-end=\"url(#a17)\" fill=\"none\">\r\n    <line x1=\"166\" y1=\"51\" x2=\"180\" y2=\"51\"/>\r\n    <line x1=\"220\" y1=\"51\" x2=\"240\" y2=\"51\"/>\r\n  </g>\r\n</svg>\r\n<figcaption>Wrapping a list in <code>set(...)</code> throws away duplicates, leaving only the distinct values.</figcaption>\r\n</figure>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 1.</b> Given <code>nums = [1, 2, 2, 3, 3, 3]</code>, set <code>distinct</code> to how many <b>different</b> values there are. Result <code>3</code>. (Use <code>set</code> and <code>len</code>.)</span>\r\n<template class=\"st\">nums = [1, 2, 2, 3, 3, 3]\r\ndistinct = 0\r\n# count the distinct values\r\n</template>\r\n<template class=\"ts\">assert distinct == 3\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 2.</b> Given <code>tags = {\"python\", \"sql\", \"qa\"}</code>, set <code>has_sql</code> to whether <code>\"sql\"</code> is in the set. Result <code>True</code>. (Membership on a set is very fast.)</span>\r\n<template class=\"st\">tags = {\"python\", \"sql\", \"qa\"}\r\nhas_sql = None\r\n# is \"sql\" in the set?\r\n</template>\r\n<template class=\"ts\">assert has_sql == True\r\n</template></div>\r\n\r\n<h4>2. Combining sets</h4>\r\n<p>Sets can be combined like in maths: <code>|</code> is <b>union</b> (everything in either), <code>&amp;</code> is <b>intersection</b> (only what's in both).</p>\r\n<pre class=\"run\">a = {1, 2, 3}\r\nb = {2, 3, 4}\r\nprint(a | b)   # {1, 2, 3, 4}  — union\r\nprint(a & b)   # {2, 3}        — in both</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 3.</b> Given <code>a = {1, 2, 3}</code> and <code>b = {2, 3, 4}</code>, build <code>combined</code> = their union → <code>{1, 2, 3, 4}</code>.</span>\r\n<template class=\"st\">a = {1, 2, 3}\r\nb = {2, 3, 4}\r\ncombined = set()\r\n# union of a and b\r\n</template>\r\n<template class=\"ts\">assert combined == {1, 2, 3, 4}\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 4.</b> Given the same <code>a</code> and <code>b</code>, build <code>shared</code> = the values in <b>both</b> → <code>{2, 3}</code>.</span>\r\n<template class=\"st\">a = {1, 2, 3}\r\nb = {2, 3, 4}\r\nshared = set()\r\n# intersection of a and b\r\n</template>\r\n<template class=\"ts\">assert shared == {2, 3}\r\n</template></div>\r\n\r\n<h4>3. Sorting with sorted()</h4>\r\n<p><code>sorted(list)</code> returns a <b>new</b> list in ascending order — it doesn't change the original. Add <code>reverse=True</code> for descending. It works on numbers and, alphabetically, on strings.</p>\r\n<pre class=\"run\">nums = [3, 1, 2]\r\nprint(sorted(nums))               # [1, 2, 3]\r\nprint(sorted(nums, reverse=True)) # [3, 2, 1]\r\nprint(sorted([\"banana\", \"apple\", \"cherry\"]))  # ['apple', 'banana', 'cherry']</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 5.</b> Given <code>nums = [3, 1, 2]</code>, build <code>ordered</code> = the numbers sorted ascending → <code>[1, 2, 3]</code>.</span>\r\n<template class=\"st\">nums = [3, 1, 2]\r\nordered = []\r\n# sort ascending\r\n</template>\r\n<template class=\"ts\">assert ordered == [1, 2, 3]\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 6.</b> Given <code>nums = [3, 1, 2]</code>, build <code>desc</code> = the numbers sorted from biggest to smallest → <code>[3, 2, 1]</code>. (Use <code>reverse=True</code>.)</span>\r\n<template class=\"st\">nums = [3, 1, 2]\r\ndesc = []\r\n# sort descending\r\n</template>\r\n<template class=\"ts\">assert desc == [3, 2, 1]\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 7.</b> Given <code>words = [\"banana\", \"apple\", \"cherry\"]</code>, build <code>alpha</code> = the words in alphabetical order → <code>['apple', 'banana', 'cherry']</code>.</span>\r\n<template class=\"st\">words = [\"banana\", \"apple\", \"cherry\"]\r\nalpha = []\r\n# sort alphabetically\r\n</template>\r\n<template class=\"ts\">assert alpha == [\"apple\", \"banana\", \"cherry\"]\r\n</template></div>\r\n\r\n<h4>4. min, max, sum</h4>\r\n<p>Three built-ins that answer the most common questions about a list of numbers in one word each.</p>\r\n<pre class=\"run\">nums = [4, 2, 8, 6]\r\nprint(min(nums))   # 2\r\nprint(max(nums))   # 8\r\nprint(sum(nums))   # 20</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 8.</b> Given <code>nums = [4, 2, 8, 6]</code>, set <code>lowest</code>, <code>highest</code>, and <code>total</code> using <code>min</code>, <code>max</code>, and <code>sum</code>. Results <code>2</code>, <code>8</code>, <code>20</code>.</span>\r\n<template class=\"st\">nums = [4, 2, 8, 6]\r\nlowest = 0\r\nhighest = 0\r\ntotal = 0\r\n# use min, max, sum\r\n</template>\r\n<template class=\"ts\">assert lowest == 2 and highest == 8 and total == 20\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 9.</b> Given <code>nums = [3, 1, 2, 3, 1]</code>, build <code>unique_sorted</code> = the distinct values in ascending order → <code>[1, 2, 3]</code>. (Combine <code>set</code> and <code>sorted</code>.)</span>\r\n<template class=\"st\">nums = [3, 1, 2, 3, 1]\r\nunique_sorted = []\r\n# distinct values, sorted ascending\r\n</template>\r\n<template class=\"ts\">assert unique_sorted == [1, 2, 3]\r\n</template></div>\r\n<div class=\"ex stretch\" data-kind=\"py\"><span class=\"exq\"><b>🔥 Stretch (top three).</b> Given <code>nums = [5, 2, 8, 1, 9, 3]</code>, build <code>top3</code> = the three largest values, biggest first → <code>[9, 8, 5]</code>. (Sort descending, then take the first three with <code>[:3]</code>.)</span>\r\n<template class=\"st\">nums = [5, 2, 8, 1, 9, 3]\r\ntop3 = []\r\n# the three largest, biggest first\r\n</template>\r\n<template class=\"ts\">assert top3 == [9, 8, 5]\r\n</template></div>\r\n\r\n<div class=\"recap\">Recap of lesson 17: a <b>set</b> holds only <b>unique</b> values — <code>set(list)</code> removes duplicates, membership (<code>in</code>) is fast, and <code>|</code> / <code>&amp;</code> give union / intersection · <code>sorted(list)</code> returns a new ascending list, <code>reverse=True</code> for descending, and it works on strings alphabetically · <code>min</code>, <code>max</code>, <code>sum</code> answer smallest / largest / total in one word · combine them (e.g. <code>sorted(set(...))</code>) for distinct, ordered results. Next: the <b>text toolkit</b> — splitting, joining, and cleaning strings. (Custom sort orders with <code>key</code> come in Python Intermediate.)</div>\r\n\r\n<h4>🏠 Homework</h4>\r\n<p>Four graded exercises — do them right here before the next lesson.</p>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Homework 1.</b> Given <code>letters = [\"a\", \"b\", \"a\", \"c\", \"a\"]</code>, set <code>distinct</code> to how many different letters there are. Result <code>3</code>.</span>\r\n<template class=\"st\">letters = [\"a\", \"b\", \"a\", \"c\", \"a\"]\r\ndistinct = 0\r\n# count the distinct letters\r\n</template>\r\n<template class=\"ts\">assert distinct == 3\r\n</template></div>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Homework 2.</b> Given <code>nums = [30, 10, 20]</code>, build <code>ordered</code> = the numbers sorted ascending → <code>[10, 20, 30]</code>.</span>\r\n<template class=\"st\">nums = [30, 10, 20]\r\nordered = []\r\n# sort ascending\r\n</template>\r\n<template class=\"ts\">assert ordered == [10, 20, 30]\r\n</template></div>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Homework 3.</b> Given <code>a = {1, 2, 3}</code> and <code>b = {3, 4, 5}</code>, build <code>shared</code> = the values in both → <code>{3}</code>.</span>\r\n<template class=\"st\">a = {1, 2, 3}\r\nb = {3, 4, 5}\r\nshared = set()\r\n# values in both sets\r\n</template>\r\n<template class=\"ts\">assert shared == {3}\r\n</template></div>\r\n<div class=\"ex homework stretch\" data-kind=\"py\"><span class=\"exq\"><b>🔥 Homework 4 (stretch).</b> Given <code>scores = [70, 90, 50, 90, 60]</code>, build <code>top2</code> = the two highest <b>distinct</b> scores, biggest first → <code>[90, 70]</code>. (Remove duplicates, sort descending, take the first two.)</span>\r\n<template class=\"st\">scores = [70, 90, 50, 90, 60]\r\ntop2 = []\r\n# two highest distinct scores, biggest first\r\n</template>\r\n<template class=\"ts\">assert top2 == [90, 70]\r\n</template></div>"}},{"t":{"vi":"Bộ công cụ xử lý văn bản","en":"Text toolkit: split, join, clean"},"html":{"vi":"<h3>Bài 18 — Bộ công cụ xử lý văn bản: split, join &amp; làm sạch</h3>\r\n<p>Phần lớn lập trình thực tế là xoay xở với <b>văn bản</b>: một dòng người dùng gõ, một hàng chép từ bảng tính, một tin nhắn, một ô tìm kiếm. Dữ liệu gần như không bao giờ đến sạch sẽ hoàn hảo — có khoảng trắng thừa, chữ hoa chữ thường lẫn lộn, dấu phẩy ngăn các trường. Bài này là bộ công cụ của bạn để biến văn bản lộn xộn thành dữ liệu gọn gàng dùng được.</p>\r\n<p>Ba thao tác làm hầu hết việc: <b>split</b> một chuỗi thành list các mảnh, <b>join</b> một list trở lại thành chuỗi, và <b>làm sạch</b> từng mảnh bằng <code>strip</code>, <code>lower</code>, và <code>replace</code>. Thêm vài cách <b>tìm kiếm</b> trong văn bản là bạn trả lời được câu hỏi thật — bao nhiêu từ, có chứa cái này không, từ nào xuất hiện nhiều nhất.</p>\r\n<p>Đây cũng đúng là những kỹ năng đứng sau đồ án tốt nghiệp sắp tới, nơi bạn sẽ phân tích một đoạn văn bản. Hãy mài sắc chúng.</p>\r\n\r\n<h4>1. Tách văn bản thành các mảnh</h4>\r\n<p><code>split()</code> không đối số cắt một chuỗi tại các khoảng trắng thành list các từ. Cho nó một dấu phân cách để cắt theo thứ khác — dấu phẩy, dấu gạch chéo, dấu gạch ngang.</p>\r\n<pre class=\"run\">print(\"the quick brown fox\".split())   # ['the', 'quick', 'brown', 'fox']\r\nprint(\"a,b,c\".split(\",\"))              # ['a', 'b', 'c']\r\nprint(\"2024-01-15\".split(\"-\"))         # ['2024', '01', '15']</pre>\r\n<figure class=\"diagram\">\r\n<svg viewBox=\"0 0 340 100\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11\">\r\n  <defs>\r\n    <marker id=\"a18v\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\">\r\n      <path d=\"M0 0 L10 5 L0 10 z\" fill=\"#F5B942\"/>\r\n    </marker>\r\n  </defs>\r\n  <rect x=\"24\" y=\"36\" width=\"110\" height=\"32\" rx=\"7\" fill=\"#121C30\" stroke=\"#22304C\"/>\r\n  <text x=\"79\" y=\"57\" text-anchor=\"middle\" fill=\"#E8E4D8\">\"a b c\"</text>\r\n  <rect x=\"206\" y=\"36\" width=\"120\" height=\"32\" rx=\"7\" fill=\"#0E1626\" stroke=\"#22304C\"/>\r\n  <text x=\"266\" y=\"57\" text-anchor=\"middle\" fill=\"#7FD1C0\">[\"a\",\"b\",\"c\"]</text>\r\n  <g stroke=\"#F5B942\" stroke-width=\"1.4\" marker-end=\"url(#a18v)\" fill=\"none\">\r\n    <line x1=\"136\" y1=\"45\" x2=\"204\" y2=\"45\"/>\r\n    <line x1=\"204\" y1=\"60\" x2=\"136\" y2=\"60\"/>\r\n  </g>\r\n  <text x=\"170\" y=\"40\" text-anchor=\"middle\" fill=\"#F5B942\" font-size=\"10\">.split()</text>\r\n  <text x=\"170\" y=\"74\" text-anchor=\"middle\" fill=\"#7FD1C0\" font-size=\"10\">\" \".join(...)</text>\r\n</svg>\r\n<figcaption><code>split</code> biến một chuỗi thành list các mảnh; <code>join</code> biến list các mảnh trở lại thành chuỗi. Chúng ngược nhau.</figcaption>\r\n</figure>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 1.</b> Cho <code>text = \"the quick brown fox\"</code>, dựng <code>words</code> = list các từ → <code>['the', 'quick', 'brown', 'fox']</code>.</span>\r\n<template class=\"st\">text = \"the quick brown fox\"\r\nwords = []\r\n# split into words\r\n</template>\r\n<template class=\"ts\">assert words == [\"the\", \"quick\", \"brown\", \"fox\"]\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 2.</b> Cho <code>row = \"apple,pear,plum\"</code>, dựng <code>parts</code> = list cắt theo dấu phẩy → <code>['apple', 'pear', 'plum']</code>.</span>\r\n<template class=\"st\">row = \"apple,pear,plum\"\r\nparts = []\r\n# split on commas\r\n</template>\r\n<template class=\"ts\">assert parts == [\"apple\", \"pear\", \"plum\"]\r\n</template></div>\r\n\r\n<h4>2. Ghép các mảnh lại</h4>\r\n<p><code>separator.join(list)</code> dán một list chuỗi thành một, đặt dấu phân cách giữa mỗi cái. Lưu ý dấu phân cách đứng trước: <code>\", \".join(items)</code>.</p>\r\n<pre class=\"run\">print(\" \".join([\"Hello\", \"world\"]))      # Hello world\r\nprint(\"-\".join([\"2024\", \"01\", \"15\"]))    # 2024-01-15\r\nprint(\", \".join([\"a\", \"b\", \"c\"]))        # a, b, c</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 3.</b> Cho <code>bits = [\"2024\", \"01\", \"15\"]</code>, ghép chúng bằng <code>\"-\"</code> vào <code>date</code> → <code>\"2024-01-15\"</code>.</span>\r\n<template class=\"st\">bits = [\"2024\", \"01\", \"15\"]\r\ndate = \"\"\r\n# join with dashes\r\n</template>\r\n<template class=\"ts\">assert date == \"2024-01-15\"\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 4.</b> Cho <code>words = [\"learn\", \"by\", \"doing\"]</code>, ghép chúng bằng khoảng trắng vào <code>sentence</code> → <code>\"learn by doing\"</code>.</span>\r\n<template class=\"st\">words = [\"learn\", \"by\", \"doing\"]\r\nsentence = \"\"\r\n# join with spaces\r\n</template>\r\n<template class=\"ts\">assert sentence == \"learn by doing\"\r\n</template></div>\r\n\r\n<h4>3. Làm sạch văn bản</h4>\r\n<p>Ba công cụ làm sạch bạn sẽ dùng liên tục: <code>strip()</code> bỏ khoảng trắng đầu/cuối, <code>lower()</code> đưa mọi thứ về chữ thường (để <code>\"Cat\"</code> và <code>\"cat\"</code> khớp nhau), và <code>replace(old, new)</code> thay một đoạn con này bằng đoạn khác.</p>\r\n<pre class=\"run\">print(\"  Hello World  \".strip())    # \"Hello World\"\r\nprint(\"SHOUT\".lower())             # \"shout\"\r\nprint(\"a.b.c\".replace(\".\", \"/\"))   # \"a/b/c\"</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 5.</b> Cho <code>raw = \"  Hello World  \"</code>, bỏ khoảng trắng hai đầu vào <code>clean</code> → <code>\"Hello World\"</code>.</span>\r\n<template class=\"st\">raw = \"  Hello World  \"\r\nclean = \"\"\r\n# strip the outer spaces\r\n</template>\r\n<template class=\"ts\">assert clean == \"Hello World\"\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 6.</b> Cho <code>word = \"SHOUT\"</code>, đưa về chữ thường vào <code>quiet</code> → <code>\"shout\"</code>.</span>\r\n<template class=\"st\">word = \"SHOUT\"\r\nquiet = \"\"\r\n# lowercase it\r\n</template>\r\n<template class=\"ts\">assert quiet == \"shout\"\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 7.</b> Cho <code>path = \"a.b.c\"</code>, thay mọi <code>\".\"</code> bằng <code>\"/\"</code> vào <code>fixed</code> → <code>\"a/b/c\"</code>.</span>\r\n<template class=\"st\">path = \"a.b.c\"\r\nfixed = \"\"\r\n# replace dots with slashes\r\n</template>\r\n<template class=\"ts\">assert fixed == \"a/b/c\"\r\n</template></div>\r\n\r\n<h4>4. Tìm kiếm trong văn bản</h4>\r\n<p>Để hỏi về văn bản: <code>len(text.split())</code> đếm từ, <code>text.count(x)</code> đếm số lần một thứ xuất hiện, và <code>x in words</code> kiểm tra thành viên.</p>\r\n<pre class=\"run\">text = \"the cat sat on the mat\"\r\nprint(len(text.split()))     # 6  — sáu từ\r\nprint(text.count(\"the\"))     # 2  — \"the\" xuất hiện hai lần\r\nprint(\"cat\" in text.split()) # True</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 8.</b> Cho <code>text = \"one two three four\"</code>, gán <code>word_count</code> bằng số từ. Kết quả <code>4</code>.</span>\r\n<template class=\"st\">text = \"one two three four\"\r\nword_count = 0\r\n# count the words\r\n</template>\r\n<template class=\"ts\">assert word_count == 4\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 9.</b> Cho <code>word = \"banana\"</code>, gán <code>a_count</code> bằng số lần <code>\"a\"</code> xuất hiện. Kết quả <code>3</code>.</span>\r\n<template class=\"st\">word = \"banana\"\r\na_count = 0\r\n# count the letter \"a\"\r\n</template>\r\n<template class=\"ts\">assert a_count == 3\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 10.</b> Cho <code>text = \"the cat sat on the mat\"</code>, gán <code>has_dog</code> bằng việc <code>\"dog\"</code> có phải một trong các từ hay không. Kết quả <code>False</code>.</span>\r\n<template class=\"st\">text = \"the cat sat on the mat\"\r\nhas_dog = None\r\n# is \"dog\" among the words?\r\n</template>\r\n<template class=\"ts\">assert has_dog == False\r\n</template></div>\r\n<div class=\"ex stretch\" data-kind=\"py\"><span class=\"exq\"><b>🔥 Nâng cao (từ phổ biến nhất).</b> Cho <code>text = \"red blue red green red blue\"</code>, tìm từ xuất hiện nhiều nhất vào <code>top</code>. Tách thành từ, đếm bằng một dictionary, rồi chọn cái lớn nhất. Kết quả <code>\"red\"</code>.</span>\r\n<template class=\"st\">text = \"red blue red green red blue\"\r\ntop = \"\"\r\n# split, count each word, find the most common\r\n</template>\r\n<template class=\"ts\">assert top == \"red\"\r\n</template></div>\r\n\r\n<div class=\"recap\">Tóm tắt bài 18: <code>split()</code> cắt văn bản thành list các mảnh (truyền dấu phân cách như <code>\",\"</code> cho định dạng khác) · <code>sep.join(list)</code> dán một list trở lại thành chuỗi · làm sạch bằng <code>strip()</code> (khoảng trắng ngoài), <code>lower()</code> (chữ hoa/thường), và <code>replace(old, new)</code> · tìm kiếm bằng <code>len(text.split())</code>, <code>text.count(x)</code>, và <code>x in words</code> · cùng nhau chúng chuẩn hóa văn bản lộn xộn thành dữ liệu gọn gàng. Bài sau: một bài <b>ôn tập</b> để gom mọi thứ lại và sẵn sàng cho đồ án tốt nghiệp.</div>\r\n\r\n<h4>🏠 Bài tập về nhà</h4>\r\n<p>Bốn bài tập được chấm điểm — làm ngay tại đây trước bài kế tiếp.</p>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Bài về nhà 1.</b> Cho <code>path = \"home/user/file.txt\"</code>, dựng <code>parts</code> = list cắt theo <code>\"/\"</code> → <code>['home', 'user', 'file.txt']</code>.</span>\r\n<template class=\"st\">path = \"home/user/file.txt\"\r\nparts = []\r\n# split on slashes\r\n</template>\r\n<template class=\"ts\">assert parts == [\"home\", \"user\", \"file.txt\"]\r\n</template></div>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Bài về nhà 2.</b> Cho <code>tags = [\"python\", \"sql\", \"qa\"]</code>, ghép chúng bằng <code>\", \"</code> vào <code>line</code> → <code>\"python, sql, qa\"</code>.</span>\r\n<template class=\"st\">tags = [\"python\", \"sql\", \"qa\"]\r\nline = \"\"\r\n# join with \", \"\r\n</template>\r\n<template class=\"ts\">assert line == \"python, sql, qa\"\r\n</template></div>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Bài về nhà 3.</b> Cho <code>raw = \"  Data Science  \"</code>, bỏ khoảng trắng hai đầu và đưa về chữ thường vào <code>clean</code> → <code>\"data science\"</code>.</span>\r\n<template class=\"st\">raw = \"  Data Science  \"\r\nclean = \"\"\r\n# strip, then lowercase\r\n</template>\r\n<template class=\"ts\">assert clean == \"data science\"\r\n</template></div>\r\n<div class=\"ex homework stretch\" data-kind=\"py\"><span class=\"exq\"><b>🔥 Bài về nhà 4 (nâng cao).</b> Cho <code>text = \"Cat cat CAT dog\"</code> và <code>word = \"cat\"</code>, gán <code>count</code> bằng số lần <code>word</code> xuất hiện, <b>không phân biệt hoa thường</b>. Kết quả <code>3</code>. (Đưa văn bản về chữ thường, tách ra, rồi đếm.)</span>\r\n<template class=\"st\">text = \"Cat cat CAT dog\"\r\nword = \"cat\"\r\ncount = 0\r\n# count case-insensitively\r\n</template>\r\n<template class=\"ts\">assert count == 3\r\n</template></div>","en":"<h3>Lesson 18 — Text toolkit: split, join &amp; clean</h3>\r\n<p>So much of real programming is wrangling <b>text</b>: a line typed by a user, a row copied from a spreadsheet, a message, a search box. The data almost never arrives perfectly clean — it has stray spaces, mixed capitalisation, commas separating fields. This lesson is your toolkit for turning messy text into tidy data you can actually work with.</p>\r\n<p>Three moves do most of the work: <b>split</b> a string into a list of pieces, <b>join</b> a list back into a string, and <b>clean</b> individual pieces with <code>strip</code>, <code>lower</code>, and <code>replace</code>. Add a couple of ways to <b>search</b> inside text and you can answer real questions — how many words, does it contain this, which word appears most.</p>\r\n<p>These are also the exact skills behind your capstone next, where you'll analyse a block of text. Let's sharpen them.</p>\r\n\r\n<h4>1. Splitting text into pieces</h4>\r\n<p><code>split()</code> with no argument breaks a string on spaces into a list of words. Give it a separator to split on something else — a comma, a slash, a dash.</p>\r\n<pre class=\"run\">print(\"the quick brown fox\".split())   # ['the', 'quick', 'brown', 'fox']\r\nprint(\"a,b,c\".split(\",\"))              # ['a', 'b', 'c']\r\nprint(\"2024-01-15\".split(\"-\"))         # ['2024', '01', '15']</pre>\r\n<figure class=\"diagram\"
