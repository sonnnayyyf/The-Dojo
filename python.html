>from 0, stop <b>before</b> 5</td></tr>\r\n<tr><td><code>range(1, 6)</code></td><td>1, 2, 3, 4, 5</td><td>from 1, stop before 6</td></tr>\r\n<tr><td><code>range(0, 10, 2)</code></td><td>0, 2, 4, 6, 8</td><td>step of 2</td></tr>\r\n</tbody>\r\n</table>\r\n<p>Why stop <b>before</b> the last number instead of at it? It's a Python convention (like slicing <code>[a:b]</code>). It means <code>range(len(my_list))</code> gives exactly the valid indexes 0..n-1.</p>\r\n<pre class=\"run\">for i in range(5):\r\n    print(i, end=\" \")   # 0 1 2 3 4\r\nprint()\r\nfor i in range(1, 6):\r\n    print(i, end=\" \")   # 1 2 3 4 5</pre>\r\n<p>You can also walk a list <b>by index</b> by combining <code>range</code> and <code>len</code> — handy when you need each element's position:</p>\r\n<pre class=\"run\">ten = [\"An\", \"Binh\", \"Chi\"]\r\nfor i in range(len(ten)):\r\n    print(i, ten[i])    # 0 An / 1 Binh / 2 Chi</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 2.</b> Use <code>range</code> and <code>append</code> to create <code>doubles</code> = <code>[2, 4, 6, 8, 10]</code> (double the numbers 1..5). Start <code>doubles = []</code>.</span>\r\n<template class=\"st\">doubles = []\r\n# for i in range(1, 6): append i*2 to doubles\r\n</template>\r\n<template class=\"ts\">assert doubles == [2, 4, 6, 8, 10]\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 3.</b> Use <code>range</code> to sum the numbers from 1 to 100 into <code>total</code> (start <code>total = 0</code>).</span>\r\n<template class=\"st\">total = 0\r\n# accumulate 1..100 into total\r\n</template>\r\n<template class=\"ts\">assert total == 5050\r\n</template></div>\r\n\r\n<h4>5. The \"accumulator\" pattern — the most important shape</h4>\r\n<p>So many loop problems follow the same shape: you want to fold many values into <b>one</b> result (a sum, a count, a joined string, the largest value…). The recipe is always three parts:</p>\r\n<ol>\r\n<li><b>Initialize</b> a result variable <i>before</i> the loop (often <code>0</code>, <code>\"\"</code>, or <code>[]</code>).</li>\r\n<li><b>Update</b> it on <i>each</i> pass.</li>\r\n<li><b>Use</b> the result <i>after</i> the loop.</li>\r\n</ol>\r\n<pre class=\"run\">nums = [4, 8, 2, 6]\r\ntong = 0            # 1) initialize\r\nfor n in nums:\r\n    tong += n       # 2) update each pass\r\nprint(tong)         # 3) use the result -> 20</pre>\r\n<p>Trace <code>tong</code> across passes: 0 → 4 → 12 → 14 → 20. If you <b>forget</b> the <code>tong = 0</code> line, the machine errors with \"<code>tong</code> is not defined\" on the first pass — a very common mistake.</p>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 4.</b> Given <code>word = \"banana\"</code>, count how many <code>\"a\"</code> characters there are, into <code>count</code> (walk each character, when it's <code>\"a\"</code> do <code>count += 1</code>).</span>\r\n<template class=\"st\">word = \"banana\"\r\ncount = 0\r\n# count the \"a\" characters\r\n</template>\r\n<template class=\"ts\">assert count == 3\r\n</template></div>\r\n\r\n<h4>6. Filter & count: put an <code>if</code> inside the loop</h4>\r\n<p>Combine two skills you already have — loops (this lesson) and conditions (lessons 3–4) — into one of the most common code patterns: <b>walk through and only handle elements that match a condition</b>.</p>\r\n<pre class=\"run\">nums = [1, 2, 3, 4, 5, 6]\r\nso_chan = 0\r\nfor n in nums:\r\n    if n % 2 == 0:      # the if is INSIDE the for (indented twice)\r\n        so_chan += 1\r\nprint(so_chan)          # 3</pre>\r\n<p>Notice the two indent levels: <code>for</code> at level 0, the <code>for</code> body indented once, the <code>if</code> body indented twice. When reading deeply-indented code, always ask \"which block does this line belong to?\".</p>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 5.</b> Given <code>nums = [1, 2, 3, 4, 5, 6]</code>, count the <b>even</b> elements into <code>even_count</code> (use <code>if n % 2 == 0</code> inside the loop).</span>\r\n<template class=\"st\">nums = [1, 2, 3, 4, 5, 6]\r\neven_count = 0\r\n# count the even elements\r\n</template>\r\n<template class=\"ts\">assert even_count == 3\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 6.</b> Given <code>nums = [3, 7, 2, 9, 4]</code>, find the largest yourself into <code>biggest</code> (start <code>biggest = nums[0]</code>, update when you see a bigger one). <i>Don't use <code>max()</code> — practice the accumulator thinking.</i></span>\r\n<template class=\"st\">nums = [3, 7, 2, 9, 4]\r\nbiggest = nums[0]\r\n# walk and update biggest\r\n</template>\r\n<template class=\"ts\">assert biggest == 9\r\n</template></div>\r\n\r\n<h4>7. Building a new list with a loop</h4>\r\n<p>A variant of the accumulator: start with an empty list and <code>append</code> as you go. This is how you \"transform\" one list into another — extremely common.</p>\r\n<pre class=\"run\">squares = []\r\nfor i in range(1, 6):\r\n    squares.append(i ** 2)\r\nprint(squares)      # [1, 4, 9, 16, 25]</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 7.</b> Create <code>squares</code> = <code>[1, 4, 9, 16, 25]</code> (squares of 1..5) using a loop and <code>append</code>.</span>\r\n<template class=\"st\">squares = []\r\n# create squares with for + append\r\n</template>\r\n<template class=\"ts\">assert squares == [1, 4, 9, 16, 25]\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 8.</b> Sum the <b>multiples of 3</b> below 20 (that is 3, 6, 9, 12, 15, 18) into <code>total</code> (hint: <code>range(3, 20, 3)</code>).</span>\r\n<template class=\"st\">total = 0\r\n# accumulate the multiples of 3 below 20\r\n</template>\r\n<template class=\"ts\">assert total == 63\r\n</template></div>\r\n\r\n<h4>8. Common confusions</h4>\r\n<ul>\r\n<li><b>Forgetting to initialize</b> the accumulator before the loop → \"not defined\" error.</li>\r\n<li><b>Putting the \"use the result\" line INSIDE the loop</b> (wrong indent) → it runs every pass instead of once at the end.</li>\r\n<li><b>Thinking <code>range(1, 5)</code> goes to 5</b> — it actually stops at 4. To reach 5 use <code>range(1, 6)</code>.</li>\r\n<li><b>Changing a list <i>while</i> looping over it</b> (adding/removing) → causes unpredictable bugs; avoid it for now.</li>\r\n</ul>\r\n\r\n<h4>9. Mixed practice</h4>\r\n<p>Combine the patterns you just learned: walk, accumulate, filter, and build a new list.</p>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 9.</b> Given <code>prices = [10, 20, 30]</code>, create <code>discounted</code> = each price after a 10% discount (times <code>0.9</code>), using a loop and <code>append</code>. Result: <code>[9.0, 18.0, 27.0]</code>.</span>\r\n<template class=\"st\">prices = [10, 20, 30]\r\ndiscounted = []\r\n# discount each price by 10%, append to discounted\r\n</template>\r\n<template class=\"ts\">assert discounted == [9.0, 18.0, 27.0]\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 10.</b> Given <code>nums = [3, 8, 5, 12, 1, 7]</code>, count the elements <b>greater than 5</b> into <code>over_five</code>.</span>\r\n<template class=\"st\">nums = [3, 8, 5, 12, 1, 7]\r\nover_five = 0\r\n# count elements > 5\r\n</template>\r\n<template class=\"ts\">assert over_five == 3\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 11.</b> Given <code>words = [\"hi\", \"hello\", \"hey\"]</code>, create <code>lengths</code> = a list of each word's length → <code>[2, 5, 3]</code> (use <code>len(w)</code> in the loop).</span>\r\n<template class=\"st\">words = [\"hi\", \"hello\", \"hey\"]\r\nlengths = []\r\n# build a list of each word's length\r\n</template>\r\n<template class=\"ts\">assert lengths == [2, 5, 3]\r\n</template></div>\r\n<div class=\"ex stretch\" data-kind=\"py\"><span class=\"exq\"><b>🔥 Stretch.</b> Given <code>nums = [3, 1, 4, 1, 5, 9, 2]</code>, find the <b>index</b> of the largest element into <code>max_index</code> — use <code>range(len(nums))</code> and track both the largest value and its position. Here <code>max_index = 5</code>.</span>\r\n<template class=\"st\">nums = [3, 1, 4, 1, 5, 9, 2]\r\nmax_index = 0\r\n# find the index of the largest element\r\n</template>\r\n<template class=\"ts\">assert max_index == 5\r\n</template></div>\r\n\r\n<div class=\"recap\">Recap of lesson 6: <code>for x in collection:</code> visits each element · indentation defines the body · the machine runs: ask \"any left?\" → take element → run body → repeat · <code>range(n) / range(a,b) / range(a,b,step)</code>, stops <b>before</b> the last number · the <b>accumulator</b> pattern: initialize → update → use · put an <code>if</code> inside to filter/count · <code>append</code> to build a new list. Next: <code>while</code>, <code>break</code>/<code>continue</code> and stopping a loop early.</div>\r\n\r\n<h4>🏠 Homework</h4>\r\n<p>Do this at home, outside the 2-hour class. Four questions; the last is a stretch.</p>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Homework 1.</b> Sum the <b>odd</b> numbers from 1 to 10 (1, 3, 5, 7, 9) into <code>total</code>.</span>\r\n<template class=\"st\">total = 0\r\n# accumulate the odd numbers 1..10\r\n</template>\r\n<template class=\"ts\">assert total == 25\r\n</template></div>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Homework 2.</b> Given <code>word = \"education\"</code>, count the vowels (a, e, i, o, u) into <code>vowels</code> (hint: <code>if ch in \"aeiou\"</code>).</span>\r\n<template class=\"st\">word = \"education\"\r\nvowels = 0\r\n# count the vowels\r\n</template>\r\n<template class=\"ts\">assert vowels == 5\r\n</template></div>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Homework 3.</b> Create a countdown list <code>countdown</code> = <code>[5, 4, 3, 2, 1]</code> using a loop (hint: <code>range(5, 0, -1)</code>).</span>\r\n<template class=\"st\">countdown = []\r\n# create countdown with for + append\r\n</template>\r\n<template class=\"ts\">assert countdown == [5, 4, 3, 2, 1]\r\n</template></div>\r\n<div class=\"ex homework stretch\" data-kind=\"py\"><span class=\"exq\"><b>🔥 Homework 4 (stretch — FizzBuzz).</b> Create a list <code>result</code> for the numbers 1..15: multiples of both 3 and 5 → <code>\"FizzBuzz\"</code>; multiples of 3 → <code>\"Fizz\"</code>; multiples of 5 → <code>\"Buzz\"</code>; otherwise → the number as a string. The result has 15 items, starting <code>[\"1\", \"2\", \"Fizz\", \"4\", \"Buzz\", ...]</code>.</span>\r\n<template class=\"st\">result = []\r\n# build result following the FizzBuzz rule for 1..15\r\n</template>\r\n<template class=\"ts\">assert result == [\"1\", \"2\", \"Fizz\", \"4\", \"Buzz\", \"Fizz\", \"7\", \"8\", \"Fizz\", \"Buzz\", \"11\", \"Fizz\", \"13\", \"14\", \"FizzBuzz\"]\r\n</template></div>"}},{"t":{"vi":"while, break/continue & điều kiện trong vòng lặp","en":"while, break/continue & conditions in loops"},"html":{"vi":"<h3>Bài 7 — Vòng lặp while, break & continue</h3>\r\n<p>Vòng lặp <code>for</code> ở bài trước hoàn hảo khi bạn <b>biết trước</b> sẽ lặp qua cái gì: một danh sách, một <code>range</code>. Nhưng đời thật đầy tình huống bạn <b>không biết trước bao nhiêu lần</b>: \"cứ hỏi mật khẩu đến khi đúng\", \"cứ chia đôi cho tới khi nhỏ hơn 1\", \"lặp cho tới khi người dùng gõ 'thoát'\". Cho những lúc đó, ta có <b>vòng lặp <code>while</code></b>.</p>\r\n<p>Điểm khác biệt cốt lõi: <code>for</code> lặp theo <b>một bộ dữ liệu</b>, còn <code>while</code> lặp theo <b>một điều kiện</b> — \"cứ tiếp tục <i>chừng nào</i> điều kiện còn đúng\". Sức mạnh này đi kèm một cái bẫy: nếu điều kiện <b>không bao giờ</b> thành sai, vòng lặp chạy mãi mãi. Bài này sẽ dạy bạn dùng <code>while</code> an toàn, cùng hai \"công tắc\" điều khiển vòng lặp là <code>break</code> và <code>continue</code>.</p>\r\n\r\n<h4>1. Khi <code>for</code> không đủ</h4>\r\n<p>Giả sử muốn tính: nhân đôi số 1 bao nhiêu lần thì vượt 100? Bạn <i>không biết trước</i> câu trả lời (là mấy lần), nên không viết được <code>range</code>. Bạn chỉ biết <b>điều kiện dừng</b>: \"khi nào vượt 100 thì thôi\". Đó là lúc dùng <code>while</code>.</p>\r\n\r\n<h4>2. Cấu trúc vòng lặp while</h4>\r\n<pre class=\"run\">n = 5\r\nwhile n &gt; 0:          # lap CHUNG NAO n > 0 con dung\r\n    print(n)\r\n    n -= 1            # PHAI thay doi n, khong thi lap mai mai\r\nprint(\"Xong!\")</pre>\r\n<p>Đọc là: \"<b>chừng nào</b> <code>n &gt; 0</code>, chạy khối thụt vào\". Ba phần cần có:</p>\r\n<ul>\r\n<li>Một biến điều khiển được <b>khởi tạo trước</b> vòng lặp (<code>n = 5</code>).</li>\r\n<li>Một <b>điều kiện</b> sau <code>while</code> — vòng lặp chạy khi điều kiện đúng, dừng khi sai.</li>\r\n<li>Bên trong thân, <b>một dòng làm điều kiện tiến dần về sai</b> (<code>n -= 1</code>). Đây là dòng dễ quên nhất.</li>\r\n</ul>\r\n\r\n<h4>3. Máy chạy while thế nào?</h4>\r\n<p>Trước <b>mỗi</b> vòng, máy kiểm tra điều kiện. Đúng → chạy thân rồi kiểm tra lại. Sai → thoát ngay (có thể không chạy thân lần nào nếu điều kiện sai ngay từ đầu).</p>\r\n<figure class=\"diagram\">\r\n<svg viewBox=\"0 0 460 250\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"IBM Plex Mono, monospace\" font-size=\"12.5\">\r\n  <defs><marker id=\"w7\" markerWidth=\"9\" markerHeight=\"9\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#8FA0BC\"/></marker></defs>\r\n  <rect x=\"180\" y=\"10\" width=\"110\" height=\"30\" rx=\"15\" fill=\"#121C30\" stroke=\"#22304C\"/>\r\n  <text x=\"235\" y=\"30\" text-anchor=\"middle\" fill=\"#E8E4D8\">bắt đầu</text>\r\n  <line x1=\"235\" y1=\"40\" x2=\"235\" y2=\"60\" stroke=\"#8FA0BC\" marker-end=\"url(#w7)\"/>\r\n  <polygon points=\"235,62 340,102 235,142 130,102\" fill=\"#0E1626\" stroke=\"#F5B942\"/>\r\n  <text x=\"235\" y=\"100\" text-anchor=\"middle\" fill=\"#F5B942\">điều kiện đúng?</text>\r\n  <line x1=\"340\" y1=\"102\" x2=\"392\" y2=\"102\" stroke=\"#8FA0BC\" marker-end=\"url(#w7)\"/>\r\n  <text x=\"366\" y=\"94\" text-anchor=\"middle\" fill=\"#E2604C\">sai</text>\r\n  <rect x=\"392\" y=\"86\" width=\"66\" height=\"32\" rx=\"6\" fill=\"#121C30\" stroke=\"#E2604C\"/>\r\n  <text x=\"425\" y=\"106\" text-anchor=\"middle\" fill=\"#E8E4D8\">thoát</text>\r\n  <line x1=\"235\" y1=\"142\" x2=\"235\" y2=\"166\" stroke=\"#8FA0BC\" marker-end=\"url(#w7)\"/>\r\n  <text x=\"247\" y=\"158\" fill=\"#7FD1C0\">đúng</text>\r\n  <rect x=\"150\" y=\"166\" width=\"170\" height=\"34\" rx=\"6\" fill=\"#121C30\" stroke=\"#7FD1C0\"/>\r\n  <text x=\"235\" y=\"187\" text-anchor=\"middle\" fill=\"#E8E4D8\">chạy thân vòng lặp</text>\r\n  <path d=\"M150,183 L60,183 L60,102 L128,102\" fill=\"none\" stroke=\"#8FA0BC\" marker-end=\"url(#w7)\"/>\r\n  <text x=\"64\" y=\"140\" fill=\"#8FA0BC\">lặp lại</text>\r\n</svg>\r\n<figcaption>while = kiểm tra điều kiện TRƯỚC mỗi vòng. Sai là thoát ngay — có thể chạy 0 lần.</figcaption>\r\n</figure>\r\n<p>Theo dõi <code>n</code> trong ví dụ trên: 5 (in) → 4 (in) → 3 (in) → 2 (in) → 1 (in) → 0 (điều kiện <code>0 &gt; 0</code> sai → thoát).</p>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 1.</b> Dùng <code>while</code> tạo danh sách đếm ngược <code>countdown</code> = <code>[5, 4, 3, 2, 1]</code> (bắt đầu <code>n = 5</code>, mỗi vòng <code>append</code> rồi <code>n -= 1</code>).</span>\r\n<template class=\"st\">n = 5\r\ncountdown = []\r\n# dung while tao countdown\r\n</template>\r\n<template class=\"ts\">assert countdown == [5, 4, 3, 2, 1]\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 2.</b> Dùng <code>while</code> tính tổng các số từ 1 đến 100 vào <code>total</code> (bắt đầu <code>i = 1</code>, <code>total = 0</code>; mỗi vòng cộng <code>i</code> rồi <code>i += 1</code>).</span>\r\n<template class=\"st\">i = 1\r\ntotal = 0\r\n# dung while cong don 1..100\r\n</template>\r\n<template class=\"ts\">assert total == 5050\r\n</template></div>\r\n\r\n<h4>4. Cái bẫy: vòng lặp vô tận</h4>\r\n<p>Nếu điều kiện <b>không bao giờ</b> thành sai, chương trình treo mãi. Đây là lỗi <code>while</code> phổ biến nhất — thường do quên cập nhật biến điều khiển.</p>\r\n<pre># DUNG CHAY DOAN NAY — vong lap vo tan!\r\nn = 5\r\nwhile n &gt; 0:\r\n    print(n)      # quen dong n -= 1  ->  n mai la 5  ->  lap mai mai</pre>\r\n<p>Quy tắc vàng: mỗi khi viết <code>while</code>, hãy tự hỏi ngay <b>\"điều gì làm điều kiện này thành sai, và nó có chắc xảy ra không?\"</b></p>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 3.</b> Nhân đôi <code>x</code> (bắt đầu <code>x = 1</code>) cho tới khi <code>x</code> vượt 100, đếm số lần nhân vào <code>count</code>. Kết thúc <code>x = 128</code>, <code>count = 7</code>. (Dùng <code>while x &lt;= 100</code>.)</span>\r\n<template class=\"st\">x = 1\r\ncount = 0\r\n# nhan doi x cho toi khi > 100, dem so lan\r\n</template>\r\n<template class=\"ts\">assert count == 7\r\nassert x == 128\r\n</template></div>\r\n\r\n<h4>5. <code>break</code> — thoát khỏi vòng lặp ngay lập tức</h4>\r\n<p><code>break</code> dừng vòng lặp <b>ngay tại đó</b>, bỏ qua mọi vòng còn lại. Rất hữu ích để <b>tìm phần tử đầu tiên</b> thỏa điều kiện rồi dừng — không cần duyệt hết.</p>\r\n<pre class=\"run\">nums = [3, 7, 4, 9, 2]\r\nfirst_even = None\r\nfor n in nums:\r\n    if n % 2 == 0:\r\n        first_even = n\r\n        break            # tim thay roi -> thoat, khong xet 9, 2\r\nprint(first_even)        # 4</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 4.</b> Cho <code>nums = [3, 7, 4, 9, 2]</code>. Tìm số <b>chẵn đầu tiên</b> vào <code>first_even</code> rồi dừng ngay bằng <code>break</code>.</span>\r\n<template class=\"st\">nums = [3, 7, 4, 9, 2]\r\nfirst_even = None\r\n# tim so chan dau tien roi break\r\n</template>\r\n<template class=\"ts\">assert first_even == 4\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 5.</b> Dùng <code>while True</code> và <code>break</code>: nhân đôi <code>x</code> (bắt đầu <code>x = 1</code>) cho tới khi <code>x &gt;= 50</code> thì dừng. Kết thúc <code>x = 64</code>.</span>\r\n<template class=\"st\">x = 1\r\n# while True: nhan doi, neu x >= 50 thi break\r\n</template>\r\n<template class=\"ts\">assert x == 64\r\n</template></div>\r\n\r\n<h4>6. <code>continue</code> — bỏ qua phần còn lại của vòng hiện tại</h4>\r\n<p><code>continue</code> nhảy thẳng sang <b>vòng kế tiếp</b>, bỏ qua các dòng còn lại của vòng hiện tại. Dùng để \"lọc bỏ\" những phần tử không muốn xử lý.</p>\r\n<pre class=\"run\">nums = [3, -1, 4, -2, 5]\r\ntotal = 0\r\nfor n in nums:\r\n    if n &lt; 0:\r\n        continue         # gap so am -> bo qua, sang vong sau\r\n    total += n\r\nprint(total)             # 3 + 4 + 5 = 12</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 6.</b> Cho <code>nums = [3, -1, 4, -2, 5]</code>. Tính tổng chỉ các số <b>không âm</b> vào <code>total</code>, dùng <code>continue</code> để bỏ qua số âm. Kết quả <code>12</code>.</span>\r\n<template class=\"st\">nums = [3, -1, 4, -2, 5]\r\ntotal = 0\r\n# dung continue bo qua so am\r\n</template>\r\n<template class=\"ts\">assert total == 12\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 7.</b> Cho <code>word = \"programming\"</code>. Đếm các ký tự <b>không phải</b> nguyên âm vào <code>consonants</code>, dùng <code>continue</code> để bỏ qua nguyên âm (<code>if ch in \"aeiou\": continue</code>). Kết quả <code>8</code>.</span>\r\n<template class=\"st\">word = \"programming\"\r\nconsonants = 0\r\n# dem phu am, dung continue bo qua nguyen am\r\n</template>\r\n<template class=\"ts\">assert consonants == 8\r\n</template></div>\r\n\r\n<h4>7. Mẫu \"xử lý cho tới khi xong\"</h4>\r\n<p>Một khuôn rất hay gặp: xử lý một giá trị lặp đi lặp lại cho tới khi đạt trạng thái đích. Ví dụ dãy Collatz: nếu chẵn thì chia đôi, lẻ thì <code>3n + 1</code>, lặp tới khi về 1.</p>\r\n<pre class=\"run\">n = 6\r\nsteps = 0\r\nwhile n != 1:\r\n    if n % 2 == 0:\r\n        n = n // 2\r\n    else:\r\n        n = 3 * n + 1\r\n    steps += 1\r\nprint(steps)    # 8 buoc: 6->3->10->5->16->8->4->2->1</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 8.</b> Cho <code>n = 6</code>. Đếm số bước để dãy Collatz đưa <code>n</code> về 1 vào <code>steps</code> (chẵn → chia đôi, lẻ → <code>3n + 1</code>). Kết quả <code>8</code>.</span>\r\n<template class=\"st\">n = 6\r\nsteps = 0\r\n# dem so buoc Collatz dua n ve 1\r\n</template>\r\n<template class=\"ts\">assert steps == 8\r\n</template></div>\r\n\r\n<h4>8. Luyện tập tổng hợp</h4>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 9.</b> Cho <code>n = 12345</code>. Đếm số <b>chữ số</b> vào <code>digits</code> bằng <code>while</code> (mỗi vòng bỏ một chữ số: <code>n //= 10</code>, <code>digits += 1</code>, tới khi <code>n == 0</code>). Kết quả <code>5</code>.</span>\r\n<template class=\"st\">n = 12345\r\ndigits = 0\r\n# dem so chu so bang while\r\n</template>\r\n<template class=\"ts\">assert digits == 5\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 10.</b> Cho <code>nums = [4, 9, 15, 6, 21]</code>. Tìm số <b>đầu tiên chia hết cho 3</b> vào <code>first</code> rồi <code>break</code>. Kết quả <code>9</code>.</span>\r\n<template class=\"st\">nums = [4, 9, 15, 6, 21]\r\nfirst = None\r\n# tim so dau tien chia het 3 roi break\r\n</template>\r\n<template class=\"ts\">assert first == 9\r\n</template></div>\r\n<div class=\"ex stretch\" data-kind=\"py\"><span class=\"exq\"><b>🔥 Thử thách.</b> Cho <code>n = 123</code>. Tạo <code>reversed_num</code> = số đảo ngược các chữ số → <code>321</code>, dùng <code>while</code> (mỗi vòng: lấy chữ số cuối <code>n % 10</code>, ghép vào kết quả <code>reversed_num = reversed_num * 10 + n % 10</code>, rồi <code>n //= 10</code>).</span>\r\n<template class=\"st\">n = 123\r\nreversed_num = 0\r\n# dao nguoc cac chu so bang while\r\n</template>\r\n<template class=\"ts\">assert reversed_num == 321\r\n</template></div>\r\n\r\n<div class=\"recap\">Ghi nhớ bài 7: <code>while dieu_kien:</code> lặp <b>chừng nào</b> điều kiện đúng · luôn có dòng làm điều kiện tiến về sai, kẻo <b>lặp vô tận</b> · <code>break</code> thoát vòng lặp ngay · <code>continue</code> bỏ qua phần còn lại, sang vòng sau · <code>while True: ... break</code> khi điều kiện dừng nằm giữa thân. Bài sau: vòng lặp lồng nhau (loop trong loop).</div>\r\n\r\n<h4>🏠 Bài tập về nhà</h4>\r\n<p>Làm ở nhà, không tính vào 2 giờ trên lớp. Bốn câu, câu cuối là thử thách.</p>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Bài về nhà 1.</b> Dùng <code>while</code> tính tổng các số <b>chẵn</b> từ 2 đến 20 (2, 4, …, 20) vào <code>total</code>. Kết quả <code>110</code>.</span>\r\n<template class=\"st\">total = 0\r\n# dung while cong cac so chan 2..20\r\n</template>\r\n<template class=\"ts\">assert total == 110\r\n</template></div>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Bài về nhà 2.</b> Cho <code>nums = [5, 8, 12, 3, 20]</code>. Tìm số <b>đầu tiên lớn hơn 10</b> vào <code>first_big</code> rồi <code>break</code>. Kết quả <code>12</code>.</span>\r\n<template class=\"st\">nums = [5, 8, 12, 3, 20]\r\nfirst_big = None\r\n# tim so dau tien > 10 roi break\r\n</template>\r\n<template class=\"ts\">assert first_big == 12\r\n</template></div>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Bài về nhà 3.</b> Cho <code>nums = [1, -3, 2, -5, 4, -1]</code>. Đếm số phần tử <b>âm</b> vào <code>neg_count</code>, dùng <code>continue</code> để bỏ qua số không âm. Kết quả <code>3</code>.</span>\r\n<template class=\"st\">nums = [1, -3, 2, -5, 4, -1]\r\nneg_count = 0\r\n# dem so am, dung continue bo qua so khong am\r\n</template>\r\n<template class=\"ts\">assert neg_count == 3\r\n</template></div>\r\n<div class=\"ex homework stretch\" data-kind=\"py\"><span class=\"exq\"><b>🔥 Bài về nhà 4 (thử thách — ước chung lớn nhất).</b> Cho <code>a = 48</code>, <code>b = 36</code>. Dùng thuật toán Euclid tìm <code>gcd</code> (ước chung lớn nhất): lặp <code>while b != 0</code> với <code>a, b = b, a % b</code>; khi <code>b == 0</code> thì <code>a</code> là kết quả. Kết quả <code>12</code>.</span>\r\n<template class=\"st\">a = 48\r\nb = 36\r\n# tim gcd bang thuat toan Euclid (while)\r\n</template>\r\n<template class=\"ts\">assert gcd == 12\r\n</template></div>","en":"<h3>Lesson 7 — while loops, break & continue</h3>\r\n<p>The <code>for</code> loop is perfect when you <b>know in advance</b> what you'll loop over: a list, a <code>range</code>. But real life is full of situations where you <b>don't know how many times</b>: \"keep asking for the password until it's right\", \"keep halving until it's below 1\", \"loop until the user types 'quit'\". For those, we have the <b>while loop</b>.</p>\r\n<p>The core difference: <code>for</code> loops over <b>a collection</b>, while <code>while</code> loops on <b>a condition</b> — \"keep going <i>as long as</i> the condition is true\". That power comes with a trap: if the condition <b>never</b> becomes false, the loop runs forever. This lesson teaches you to use <code>while</code> safely, along with the two loop \"switches\", <code>break</code> and <code>continue</code>.</p>\r\n\r\n<h4>1. When <code>for</code> isn't enough</h4>\r\n<p>Suppose you want to know: how many times do you double 1 before it passes 100? You <i>don't know</i> the answer (the number of times) up front, so you can't write a <code>range</code>. You only know the <b>stopping condition</b>: \"stop once it passes 100\". That's when you reach for <code>while</code>.</p>\r\n\r\n<h4>2. The structure of a while loop</h4>\r\n<pre class=\"run\">n = 5\r\nwhile n &gt; 0:          # loop AS LONG AS n > 0 is true\r\n    print(n)\r\n    n -= 1            # you MUST change n, or it loops forever\r\nprint(\"Done!\")</pre>\r\n<p>Read it as: \"<b>as long as</b> <code>n &gt; 0</code>, run the indented block\". Three parts you need:</p>\r\n<ul>\r\n<li>A control variable <b>initialized before</b> the loop (<code>n = 5</code>).</li>\r\n<li>A <b>condition</b> after <code>while</code> — the loop runs while it's true, stops when false.</li>\r\n<li>Inside the body, <b>a line that moves the condition toward false</b> (<code>n -= 1</code>). This is the easiest line to forget.</li>\r\n</ul>\r\n\r\n<h4>3. How the machine runs a while loop</h4>\r\n<p>Before <b>each</b> pass, the machine checks the condition. True → run the body, then check again. False → exit immediately (it may run the body zero times if the condition is false from the start).</p>\r\n<figure class=\"diagram\">\r\n<svg viewBox=\"0 0 460 250\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"IBM Plex Mono, monospace\" font-size=\"12.5\">\r\n  <defs><marker id=\"w7e\" markerWidth=\"9\" markerHeight=\"9\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#8FA0BC\"/></marker></defs>\r\n  <rect x=\"185\" y=\"10\" width=\"100\" height=\"30\" rx=\"15\" fill=\"#121C30\" stroke=\"#22304C\"/>\r\n  <text x=\"235\" y=\"30\" text-anchor=\"middle\" fill=\"#E8E4D8\">start</text>\r\n  <line x1=\"235\" y1=\"40\" x2=\"235\" y2=\"60\" stroke=\"#8FA0BC\" marker-end=\"url(#w7e)\"/>\r\n  <polygon points=\"235,62 340,102 235,142 130,102\" fill=\"#0E1626\" stroke=\"#F5B942\"/>\r\n  <text x=\"235\" y=\"100\" text-anchor=\"middle\" fill=\"#F5B942\">condition true?</text>\r\n  <line x1=\"340\" y1=\"102\" x2=\"392\" y2=\"102\" stroke=\"#8FA0BC\" marker-end=\"url(#w7e)\"/>\r\n  <text x=\"366\" y=\"94\" text-anchor=\"middle\" fill=\"#E2604C\">false</text>\r\n  <rect x=\"392\" y=\"86\" width=\"64\" height=\"32\" rx=\"6\" fill=\"#121C30\" stroke=\"#E2604C\"/>\r\n  <text x=\"424\" y=\"106\" text-anchor=\"middle\" fill=\"#E8E4D8\">exit</text>\r\n  <line x1=\"235\" y1=\"142\" x2=\"235\" y2=\"166\" stroke=\"#8FA0BC\" marker-end=\"url(#w7e)\"/>\r\n  <text x=\"247\" y=\"158\" fill=\"#7FD1C0\">true</text>\r\n  <rect x=\"150\" y=\"166\" width=\"170\" height=\"34\" rx=\"6\" fill=\"#121C30\" stroke=\"#7FD1C0\"/>\r\n  <text x=\"235\" y=\"187\" text-anchor=\"middle\" fill=\"#E8E4D8\">run the loop body</text>\r\n  <path d=\"M150,183 L60,183 L60,102 L128,102\" fill=\"none\" stroke=\"#8FA0BC\" marker-end=\"url(#w7e)\"/>\r\n  <text x=\"64\" y=\"140\" fill=\"#8FA0BC\">repeat</text>\r\n</svg>\r\n<figcaption>while = check the condition BEFORE each pass. False means exit right away — it can run 0 times.</figcaption>\r\n</figure>\r\n<p>Trace <code>n</code> in the example above: 5 (print) → 4 (print) → 3 (print) → 2 (print) → 1 (print) → 0 (the condition <code>0 &gt; 0</code> is false → exit).</p>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 1.</b> Use <code>while</code> to create a countdown list <code>countdown</code> = <code>[5, 4, 3, 2, 1]</code> (start <code>n = 5</code>, each pass <code>append</code> then <code>n -= 1</code>).</span>\r\n<template class=\"st\">n = 5\r\ncountdown = []\r\n# use while to build countdown\r\n</template>\r\n<template class=\"ts\">assert countdown == [5, 4, 3, 2, 1]\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 2.</b> Use <code>while</code> to sum the numbers from 1 to 100 into <code>total</code> (start <code>i = 1</code>, <code>total = 0</code>; each pass add <code>i</code> then <code>i += 1</code>).</span>\r\n<template class=\"st\">i = 1\r\ntotal = 0\r\n# use while to accumulate 1..100\r\n</template>\r\n<template class=\"ts\">assert total == 5050\r\n</template></div>\r\n\r\n<h4>4. The trap: infinite loops</h4>\r\n<p>If the condition <b>never</b> becomes false, the program hangs forever. This is the most common <code>while</code> bug — usually caused by forgetting to update the control variable.</p>\r\n<pre># DO NOT RUN THIS — infinite loop!\r\nn = 5\r\nwhile n &gt; 0:\r\n    print(n)      # forgot n -= 1  ->  n stays 5  ->  loops forever</pre>\r\n<p>Golden rule: every time you write a <code>while</code>, immediately ask yourself <b>\"what makes this condition false, and is that guaranteed to happen?\"</b></p>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 3.</b> Double <code>x</code> (start <code>x = 1</code>) until <code>x</code> passes 100, counting the doublings into <code>count</code>. It ends at <code>x = 128</code>, <code>count = 7</code>. (Use <code>while x &lt;= 100</code>.)</span>\r\n<template class=\"st\">x = 1\r\ncount = 0\r\n# double x until > 100, count the doublings\r\n</template>\r\n<template class=\"ts\">assert count == 7\r\nassert x == 128\r\n</template></div>\r\n\r\n<h4>5. <code>break</code> — leave the loop immediately</h4>\r\n<p><code>break</code> stops the loop <b>right there</b>, skipping all remaining passes. Very useful for <b>finding the first element</b> that matches a condition and then stopping — no need to walk the rest.</p>\r\n<pre class=\"run\">nums = [3, 7, 4, 9, 2]\r\nfirst_even = None\r\nfor n in nums:\r\n    if n % 2 == 0:\r\n        first_even = n\r\n        break            # found it -> exit, don't check 9, 2\r\nprint(first_even)        # 4</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 4.</b> Given <code>nums = [3, 7, 4, 9, 2]</code>, find the <b>first even</b> number into <code>first_even</code> then stop with <code>break</code>.</span>\r\n<template class=\"st\">nums = [3, 7, 4, 9, 2]\r\nfirst_even = None\r\n# find the first even, then break\r\n</template>\r\n<template class=\"ts\">assert first_even == 4\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 5.</b> Use <code>while True</code> and <code>break</code>: double <code>x</code> (start <code>x = 1</code>) until <code>x &gt;= 50</code>, then stop. It ends at <code>x = 64</code>.</span>\r\n<template class=\"st\">x = 1\r\n# while True: double, if x >= 50 then break\r\n</template>\r\n<template class=\"ts\">assert x == 64\r\n</template></div>\r\n\r\n<h4>6. <code>continue</code> — skip the rest of this pass</h4>\r\n<p><code>continue</code> jumps straight to the <b>next pass</b>, skipping the remaining lines of the current one. Use it to \"skip over\" elements you don't want to process.</p>\r\n<pre class=\"run\">nums = [3, -1, 4, -2, 5]\r\ntotal = 0\r\nfor n in nums:\r\n    if n &lt; 0:\r\n        continue         # negative -> skip, go to next pass\r\n    total += n\r\nprint(total)             # 3 + 4 + 5 = 12</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 6.</b> Given <code>nums = [3, -1, 4, -2, 5]</code>, sum only the <b>non-negative</b> numbers into <code>total</code>, using <code>continue</code> to skip negatives. Result <code>12</code>.</span>\r\n<template class=\"st\">nums = [3, -1, 4, -2, 5]\r\ntotal = 0\r\n# use continue to skip negatives\r\n</template>\r\n<template class=\"ts\">assert total == 12\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 7.</b> Given <code>word = \"programming\"</code>, count the <b>non-vowel</b> characters into <code>consonants</code>, using <code>continue</code> to skip vowels (<code>if ch in \"aeiou\": continue</code>). Result <code>8</code>.</span>\r\n<template class=\"st\">word = \"programming\"\r\nconsonants = 0\r\n# count consonants, use continue to skip vowels\r\n</template>\r\n<template class=\"ts\">assert consonants == 8\r\n</template></div>\r\n\r\n<h4>7. The \"process until done\" pattern</h4>\r\n<p>A very common shape: transform a value repeatedly until it reaches a target state. For example the Collatz sequence: if even halve it, if odd do <code>3n + 1</code>, repeat until it reaches 1.</p>\r\n<pre class=\"run\">n = 6\r\nsteps = 0\r\nwhile n != 1:\r\n    if n % 2 == 0:\r\n        n = n // 2\r\n    else:\r\n        n = 3 * n + 1\r\n    steps += 1\r\nprint(steps)    # 8 steps: 6->3->10->5->16->8->4->2->1</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 8.</b> Given <code>n = 6</code>, count the steps for the Collatz sequence to bring <code>n</code> to 1 into <code>steps</code> (even → halve, odd → <code>3n + 1</code>). Result <code>8</code>.</span>\r\n<template class=\"st\">n = 6\r\nsteps = 0\r\n# count the Collatz steps to bring n to 1\r\n</template>\r\n<template class=\"ts\">assert steps == 8\r\n</template></div>\r\n\r\n<h4>8. Mixed practice</h4>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 9.</b> Given <code>n = 12345</code>, count its <b>digits</b> into <code>digits</code> using <code>while</code> (each pass drop one digit: <code>n //= 10</code>, <code>digits += 1</code>, until <code>n == 0</code>). Result <code>5</code>.</span>\r\n<template class=\"st\">n = 12345\r\ndigits = 0\r\n# count the digits using while\r\n</template>\r\n<template class=\"ts\">assert digits == 5\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 10.</b> Given <code>nums = [4, 9, 15, 6, 21]</code>, find the <b>first number divisible by 3</b> into <code>first</code> then <code>break</code>. Result <code>9</code>.</span>\r\n<template class=\"st\">nums = [4, 9, 15, 6, 21]\r\nfirst = None\r\n# find the first number divisible by 3, then break\r\n</template>\r\n<template class=\"ts\">assert first == 9\r\n</template></div>\r\n<div class=\"ex stretch\" data-kind=\"py\"><span class=\"exq\"><b>🔥 Stretch.</b> Given <code>n = 123</code>, create <code>reversed_num</code> = the digits reversed → <code>321</code>, using <code>while</code> (each pass: take the last digit <code>n % 10</code>, build the result <code>reversed_num = reversed_num * 10 + n % 10</code>, then <code>n //= 10</code>).</span>\r\n<template class=\"st\">n = 123\r\nreversed_num = 0\r\n# reverse the digits using while\r\n</template>\r\n<template class=\"ts\">assert reversed_num == 321\r\n</template></div>\r\n\r\n<div class=\"recap\">Recap of lesson 7: <code>while condition:</code> loops <b>as long as</b> the condition is true · always include a line that moves the condition toward false, or you get an <b>infinite loop</b> · <code>break</code> exits the loop now · <code>continue</code> skips the rest and goes to the next pass · <code>while True: ... break</code> when the stopping condition is in the middle of the body. Next: nested loops (a loop inside a loop).</div>\r\n\r\n<h4>🏠 Homework</h4>\r\n<p>Do this at home, outside the 2-hour class. Four questions; the last is a stretch.</p>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Homework 1.</b> Use <code>while</code> to sum the <b>even</b> numbers from 2 to 20 (2, 4, …, 20) into <code>total</code>. Result <code>110</code>.</span>\r\n<template class=\"st\">total = 0\r\n# use while to sum the even numbers 2..20\r\n</template>\r\n<template class=\"ts\">assert total == 110\r\n</template></div>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Homework 2.</b> Given <code>nums = [5, 8, 12, 3, 20]</code>, find the <b>first number greater than 10</b> into <code>first_big</code> then <code>break</code>. Result <code>12</code>.</span>\r\n<template class=\"st\">nums = [5, 8, 12, 3, 20]\r\nfirst_big = None\r\n# find the first number > 10, then break\r\n</template>\r\n<template class=\"ts\">assert first_big == 12\r\n</template></div>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Homework 3.</b> Given <code>nums = [1, -3, 2, -5, 4, -1]</code>, count the <b>negative</b> elements into <code>neg_count</code>, using <code>continue</code> to skip non-negatives. Result <code>3</code>.</span>\r\n<template class=\"st\">nums = [1, -3, 2, -5, 4, -1]\r\nneg_count = 0\r\n# count negatives, use continue to skip non-negatives\r\n</template>\r\n<template class=\"ts\">assert neg_count == 3\r\n</template></div>\r\n<div class=\"ex homework stretch\" data-kind=\"py\"><span class=\"exq\"><b>🔥 Homework 4 (stretch — greatest common divisor).</b> Given <code>a = 48</code>, <code>b = 36</code>, use Euclid's algorithm to find <code>gcd</code>: loop <code>while b != 0</code> with <code>a, b = b, a % b</code>; when <code>b == 0</code>, <code>a</code> is the answer. Result <code>12</code>.</span>\r\n<template class=\"st\">a = 48\r\nb = 36\r\n# find gcd with Euclid's algorithm (while)\r\n</template>\r\n<template class=\"ts\">assert gcd == 12\r\n</template></div>"}},{"t":{"vi":"Vòng lặp lồng nhau","en":"Nested loops"},"html":{"vi":"<h3>Bài 8 — Vòng lặp lồng nhau</h3>\r\n<p>Cho tới giờ mỗi vòng lặp đi qua một dãy <b>một chiều</b>. Nhưng rất nhiều thứ trong đời là <b>hai chiều</b>: bảng tính (hàng × cột), bàn cờ, bảng cửu chương, mọi cặp học viên trong lớp. Để xử lý chúng, ta đặt <b>một vòng lặp bên trong một vòng lặp khác</b> — gọi là <b>vòng lặp lồng nhau (nested loops)</b>. Đây là phần khó nhất của chương vòng lặp, nên ta sẽ đi thật kỹ.</p>\r\n<p>Ý tưởng cốt lõi: với <b>mỗi</b> vòng của lặp ngoài, lặp trong chạy <b>trọn vẹn</b> từ đầu đến cuối. Nếu lặp ngoài chạy 3 lần và mỗi lần lặp trong chạy 3 lần, thân trong cùng chạy tổng cộng 3 × 3 = <b>9</b> lần.</p>\r\n\r\n<h4>1. Một vòng lặp bên trong một vòng lặp</h4>\r\n<pre class=\"run\">for i in range(3):          # lap NGOAI: i = 0, 1, 2\r\n    for j in range(3):      # lap TRONG: moi lan i, j chay 0,1,2\r\n        print(i, j)\r\n# in ra 9 dong: 0 0 / 0 1 / 0 2 / 1 0 / 1 1 / 1 2 / 2 0 / 2 1 / 2 2</pre>\r\n<p>Chú ý <b>hai mức thụt lề</b>: <code>for j</code> nằm trong thân của <code>for i</code>, còn <code>print</code> nằm trong thân của <code>for j</code> (thụt 2 lần). Biến ngoài <code>i</code> \"đứng yên\" trong khi biến trong <code>j</code> chạy hết một vòng.</p>\r\n\r\n<h4>2. Hình dung thứ tự chạy</h4>\r\n<figure class=\"diagram\">\r\n<svg viewBox=\"0 0 320 280\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"IBM Plex Mono, monospace\" font-size=\"12\">\r\n  <text x=\"160\" y=\"20\" text-anchor=\"middle\" fill=\"#8FA0BC\">i = hàng (ngoài) · j = cột (trong)</text>\r\n  <text x=\"90\" y=\"46\" fill=\"#F5B942\">j=0</text><text x=\"160\" y=\"46\" fill=\"#F5B942\">j=1</text><text x=\"230\" y=\"46\" fill=\"#F5B942\">j=2</text>\r\n  <text x=\"30\" y=\"86\" fill=\"#7FD1C0\">i=0</text><text x=\"30\" y=\"156\" fill=\"#7FD1C0\">i=1</text><text x=\"30\" y=\"226\" fill=\"#7FD1C0\">i=2</text>\r\n  <g fill=\"#121C30\" stroke=\"#22304C\">\r\n    <rect x=\"70\" y=\"60\" width=\"56\" height=\"46\" rx=\"5\"/><rect x=\"140\" y=\"60\" width=\"56\" height=\"46\" rx=\"5\"/><rect x=\"210\" y=\"60\" width=\"56\" height=\"46\" rx=\"5\"/>\r\n    <rect x=\"70\" y=\"130\" width=\"56\" height=\"46\" rx=\"5\"/><rect x=\"140\" y=\"130\" width=\"56\" height=\"46\" rx=\"5\"/><rect x=\"210\" y=\"130\" width=\"56\" height=\"46\" rx=\"5\"/>\r\n    <rect x=\"70\" y=\"200\" width=\"56\" height=\"46\" rx=\"5\"/><rect x=\"140\" y=\"200\" width=\"56\" height=\"46\" rx=\"5\"/><rect x=\"210\" y=\"200\" width=\"56\" height=\"46\" rx=\"5\"/>\r\n  </g>\r\n  <g fill=\"#E8E4D8\" text-anchor=\"middle\" font-size=\"13\">\r\n    <text x=\"98\" y=\"88\">1</text><text x=\"168\" y=\"88\">2</text><text x=\"238\" y=\"88\">3</text>\r\n    <text x=\"98\" y=\"158\">4</text><text x=\"168\" y=\"158\">5</text><text x=\"238\" y=\"158\">6</text>\r\n    <text x=\"98\" y=\"228\">7</text><text x=\"168\" y=\"228\">8</text><text x=\"238\" y=\"228\">9</text>\r\n  </g>\r\n</svg>\r\n<figcaption>Số trong ô là thứ tự chạy: hết cột của hàng 0 (1→2→3), rồi mới xuống hàng 1 (4→5→6), rồi hàng 2. Lặp trong chạy trọn vẹn cho mỗi giá trị của lặp ngoài.</figcaption>\r\n</figure>\r\n<p>Bảng theo dõi cho <code>range(2)</code> lồng <code>range(2)</code>:</p>\r\n<table class=\"res\">\r\n<thead><tr><th>Bước</th><th>i</th><th>j</th></tr></thead>\r\n<tbody>\r\n<tr><td>1</td><td>0</td><td>0</td></tr>\r\n<tr><td>2</td><td>0</td><td>1</td></tr>\r\n<tr><td>3</td><td>1</td><td>0</td></tr>\r\n<tr><td>4</td><td>1</td><td>1</td></tr>\r\n</tbody>\r\n</table>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 1.</b> Dùng hai vòng lặp lồng nhau đếm tổng số lần thân trong cùng chạy, với <code>i</code> trong <code>range(3)</code> và <code>j</code> trong <code>range(3)</code>. Lưu vào <code>count</code> (bắt đầu <code>count = 0</code>). Kết quả <code>9</code>.</span>\r\n<template class=\"st\">count = 0\r\n# hai vong lap long nhau, moi vong tang count\r\n</template>\r\n<template class=\"ts\">assert count == 9\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 2.</b> Tạo <code>coords</code> = danh sách các cặp <code>[i, j]</code> với <code>i</code> trong <code>range(2)</code> và <code>j</code> trong <code>range(2)</code> → <code>[[0, 0], [0, 1], [1, 0], [1, 1]]</code> (dùng <code>append([i, j])</code>).</span>\r\n<template class=\"st\">coords = []\r\n# tao danh sach cac cap [i, j]\r\n</template>\r\n<template class=\"ts\">assert coords == [[0, 0], [0, 1], [1, 0], [1, 1]]\r\n</template></div>\r\n\r\n<h4>3. Xây một \"lưới\" (danh sách của các danh sách)</h4>\r\n<p>Mẫu rất hay gặp: lặp ngoài tạo từng <b>hàng</b> (một danh sách rỗng), lặp trong <code>append</code> các <b>ô</b> vào hàng đó, rồi cuối mỗi hàng ta <code>append</code> cả hàng vào lưới.</p>\r\n<pre class=\"run\">table = []\r\nfor i in range(1, 4):\r\n    row = []                     # bat dau mot hang moi\r\n    for j in range(1, 4):\r\n        row.append(i * j)        # them o vao hang\r\n    table.append(row)            # them ca hang vao bang\r\nprint(table)   # [[1, 2, 3], [2, 4, 6], [3, 6, 9]]</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 3.</b> Tạo bảng cửu chương <code>table</code> cho 1..3: mỗi hàng <code>i</code> chứa <code>i*1, i*2, i*3</code> → <code>[[1, 2, 3], [2, 4, 6], [3, 6, 9]]</code>.</span>\r\n<template class=\"st\">table = []\r\n# tao bang cuu chuong 1..3\r\n</template>\r\n<template class=\"ts\">assert table == [[1, 2, 3], [2, 4, 6], [3, 6, 9]]\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 4.</b> Tạo lưới <code>grid</code> 3×3 với ô ở hàng <code>i</code>, cột <code>j</code> bằng <code>i + j</code> (i, j từ 0..2) → <code>[[0, 1, 2], [1, 2, 3], [2, 3, 4]]</code>.</span>\r\n<template class=\"st\">grid = []\r\n# tao luoi 3x3 voi o = i + j\r\n</template>\r\n<template class=\"ts\">assert grid == [[0, 1, 2], [1, 2, 3], [2, 3, 4]]\r\n</template></div>\r\n\r\n<h4>4. Duyệt một lưới có sẵn</h4>\r\n<p>Khi đã có lưới (danh sách của các danh sách), duyệt nó cũng bằng hai vòng: vòng ngoài lấy từng <b>hàng</b>, vòng trong lấy từng <b>ô</b> trong hàng đó.</p>\r\n<pre class=\"run\">grid = [[1, 2], [3, 4]]\r\ntotal = 0\r\nfor row in grid:           # row lan luot la [1,2] roi [3,4]\r\n    for cell in row:       # cell lan luot la tung so\r\n        total += cell\r\nprint(total)               # 1 + 2 + 3 + 4 = 10</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 5.</b> Cho <code>grid = [[1, 2], [3, 4]]</code>. Tính tổng tất cả các ô vào <code>total</code>. Kết quả <code>10</code>.</span>\r\n<template class=\"st\">grid = [[1, 2], [3, 4]]\r\ntotal = 0\r\n# tinh tong tat ca cac o\r\n</template>\r\n<template class=\"ts\">assert total == 10\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 6.</b> Cho <code>grid = [[1, 2, 3], [4, 5, 6]]</code>. Đếm số ô có giá trị <b>chẵn</b> vào <code>even_cells</code>. Kết quả <code>3</code>.</span>\r\n<template class=\"st\">grid = [[1, 2, 3], [4, 5, 6]]\r\neven_cells = 0\r\n# dem so o chan\r\n</template>\r\n<template class=\"ts\">assert even_cells == 3\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 7.</b> Cho <code>grid = [[3, 7], [2, 9], [5, 1]]</code>. Tìm giá trị <b>lớn nhất</b> trong toàn lưới vào <code>biggest</code> (bắt đầu <code>biggest = grid[0][0]</code>). Kết quả <code>9</code>.</span>\r\n<template class=\"st\">grid = [[3, 7], [2, 9], [5, 1]]\r\nbiggest = grid[0][0]\r\n# tim gia tri lon nhat trong luoi\r\n</template>\r\n<template class=\"ts\">assert biggest == 9\r\n</template></div>\r\n\r\n<h4>5. Vẽ hình bằng vòng lặp</h4>\r\n<p>Nhân chuỗi (<code>\"*\" * i</code>) kết hợp vòng lặp cho ra các mẫu hình — một bài tập kinh điển để luyện tư duy lồng nhau.</p>\r\n<pre class=\"run\">lines = []\r\nfor i in range(1, 4):\r\n    lines.append(\"*\" * i)\r\nprint(lines)   # ['*', '**', '***']</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 8.</b> Tạo <code>lines</code> = <code>[\"*\", \"**\", \"***\", \"****\"]</code> (tam giác sao 4 hàng) bằng vòng lặp và <code>\"*\" * i</code>.</span>\r\n<template class=\"st\">lines = []\r\n# tao tam giac sao 4 hang\r\n</template>\r\n<template class=\"ts\">assert lines == [\"*\", \"**\", \"***\", \"****\"]\r\n</template></div>\r\n\r\n<h4>6. So khớp các cặp</h4>\r\n<p>Vòng lồng cũng dùng để xét <b>mọi cặp</b> phần tử — ví dụ tìm hai số cộng lại bằng một mục tiêu.</p>\r\n<pre class=\"run\">nums = [1, 2, 3, 4]\r\ntarget = 5\r\npairs = 0\r\nfor a in range(len(nums)):\r\n    for b in range(a + 1, len(nums)):   # b > a de khong lap cap\r\n        if nums[a] + nums[b] == target:\r\n            pairs += 1\r\nprint(pairs)   # (1,4) va (2,3) -> 2</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 9.</b> Cho <code>nums = [1, 2, 3, 4]</code> và <code>target = 5</code>. Đếm số <b>cặp</b> (vị trí khác nhau, không lặp lại) có tổng bằng <code>target</code> vào <code>pairs</code>. Kết quả <code>2</code>.</span>\r\n<template class=\"st\">nums = [1, 2, 3, 4]\r\ntarget = 5\r\npairs = 0\r\n# dem so cap co tong bang target\r\n</template>\r\n<template class=\"ts\">assert pairs == 2\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 10.</b> Cho <code>grid = [[1, 2], [3, 4], [5, 6]]</code>. Tạo <code>row_sums</code> = danh sách tổng của từng hàng → <code>[3, 7, 11]</code>.</span>\r\n<template class=\"st\">grid = [[1, 2], [3, 4], [5, 6]]\r\nrow_sums = []\r\n# tao danh sach tong tung hang\r\n</template>\r\n<template class=\"ts\">assert row_sums == [3, 7, 11]\r\n</template></div>\r\n<div class=\"ex stretch\" data-kind=\"py\"><span class=\"exq\"><b>🔥 Thử thách (tổng đường chéo).</b> Cho <code>grid = [[1, 2, 3], [4, 5, 6], [7, 8, 9]]</code> (ma trận vuông). Tính tổng đường chéo chính (các ô <code>grid[i][i]</code>) vào <code>diag</code>. Kết quả <code>1 + 5 + 9 = 15</code>.</span>\r\n<template class=\"st\">grid = [[1, 2, 3], [4, 5, 6], [7, 8, 9]]\r\ndiag = 0\r\n# tinh tong duong cheo chinh grid[i][i]\r\n</template>\r\n<template class=\"ts\">assert diag == 15\r\n</template></div>\r\n\r\n<div class=\"recap\">Ghi nhớ bài 8: vòng lặp lồng nhau = loop trong loop · với mỗi vòng ngoài, vòng trong chạy <b>trọn vẹn</b> → tổng số lần = ngoài × trong · hai mức thụt lề · mẫu xây lưới: hàng mới → thêm ô → thêm hàng · duyệt lưới: <code>for row in grid: for cell in row</code> · xét mọi cặp bằng hai chỉ số (b bắt đầu từ a+1). Bài sau: chuẩn bị công cụ thật (Python + VS Code) và luyện tập cho đồ án nhỏ.</div>\r\n\r\n<h4>🏠 Bài tập về nhà</h4>\r\n<p>Làm ở nhà, không tính vào 2 giờ trên lớp. Bốn câu, câu cuối là thử thách.</p>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Bài về nhà 1.</b> Cho <code>grid = [[1, 2, 3], [4, 5, 6]]</code>. Tính tổng tất cả các ô vào <code>total</code>. Kết quả <code>21</code>.</span>\r\n<template class=\"st\">grid = [[1, 2, 3], [4, 5, 6]]\r\ntotal = 0\r\n# tinh tong tat ca cac o\r\n</template>\r\n<template class=\"ts\">assert total == 21\r\n</template></div>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Bài về nhà 2.</b> Cho <code>grid = [[2, 3], [4, 5], [6, 7]]</code>. Đếm số ô <b>lớn hơn 3</b> vào <code>big_cells</code>. Kết quả <code>4</code>.</span>\r\n<template class=\"st\">grid = [[2, 3], [4, 5], [6, 7]]\r\nbig_cells = 0\r\n# dem so o > 3\r\n</template>\r\n<template class=\"ts\">assert big_cells == 4\r\n</template></div>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Bài về nhà 3.</b> Tạo lưới <code>grid</code> 3×3 với ô ở hàng <code>i</code>, cột <code>j</code> bằng <code>i * j</code> (i, j từ 0..2) → <code>[[0, 0, 0], [0, 1, 2], [0, 2, 4]]</code>.</span>\r\n<template class=\"st\">grid = []\r\n# tao luoi 3x3 voi o = i * j\r\n</template>\r\n<template class=\"ts\">assert grid == [[0, 0, 0], [0, 1, 2], [0, 2, 4]]\r\n</template></div>\r\n<div class=\"ex homework stretch\" data-kind=\"py\"><span class=\"exq\"><b>🔥 Bài về nhà 4 (thử thách).</b> Cho <code>grid = [[1, 2], [9, 1], [3, 3]]</code>. Tìm <b>chỉ số của hàng có tổng lớn nhất</b> vào <code>max_row</code>. Các tổng là 3, 10, 6 → hàng chỉ số <code>1</code>.</span>\r\n<template class=\"st\">grid = [[1, 2], [9, 1], [3, 3]]\r\nmax_row = 0\r\n# tim chi so hang co tong lon nhat\r\n</template>\r\n<template class=\"ts\">assert max_row == 1\r\n</template></div>","en":"<h3>Lesson 8 — Nested loops</h3>\r\n<p>So far each loop walks a <b>one-dimensional</b> sequence. But many things in life are <b>two-dimensional</b>: a spreadsheet (rows × columns), a chessboard, a multiplication table, every pair of students in a class. To handle them, we put <b>one loop inside another</b> — called <b>nested loops</b>. This is the hardest part of the loops chapter, so we'll go carefully.</p>\r\n<p>The core idea: for <b>each</b> pass of the outer loop, the inner loop runs <b>completely</b> from start to finish. If the outer runs 3 times and each time the inner runs 3 times, the innermost body runs 3 × 3 = <b>9</b> times total.</p>\r\n\r\n<h4>1. A loop inside a loop</h4>\r\n<pre class=\"run\">for i in range(3):          # OUTER loop: i = 0, 1, 2\r\n    for j in range(3):      # INNER loop: for each i, j runs 0,1,2\r\n        print(i, j)\r\n# prints 9 lines: 0 0 / 0 1 / 0 2 / 1 0 / 1 1 / 1 2 / 2 0 / 2 1 / 2 2</pre>\r\n<p>Notice the <b>two indent levels</b>: <code>for j</code> is inside the body of <code>for i</code>, and <code>print</code> is inside the body of <code>for j</code> (indented twice). The outer variable <code>i</code> \"stays still\" while the inner variable <code>j</code> runs a full cycle.</p>\r\n\r\n<h4>2. Picturing the order</h4>\r\n<figure class=\"diagram\">\r\n<svg viewBox=\"0 0 320 280\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"IBM Plex Mono, monospace\" font-size=\"12\">\r\n  <text x=\"160\" y=\"20\" text-anchor=\"middle\" fill=\"#8FA0BC\">i = row (outer) · j = column (inner)</text>\r\n  <text x=\"90\" y=\"46\" fill=\"#F5B942\">j=0</text><text x=\"160\" y=\"46\" fill=\"#F5B942\">j=1</text><text x=\"230\" y=\"46\" fill=\"#F5B942\">j=2</text>\r\n  <text x=\"30\" y=\"86\" fill=\"#7FD1C0\">i=0</text><text x=\"30\" y=\"156\" fill=\"#7FD1C0\">i=1</text><text x=\"30\" y=\"226\" fill=\"#7FD1C0\">i=2</text>\r\n  <g fill=\"#121C30\" stroke=\"#22304C\">\r\n    <rect x=\"70\" y=\"60\" width=\"56\" height=\"46\" rx=\"5\"/><rect x=\"140\" y=\"60\" width=\"56\" height=\"46\" rx=\"5\"/><rect x=\"210\" y=\"60\" width=\"56\" height=\"46\" rx=\"5\"/>\r\n    <rect x=\"70\" y=\"130\" width=\"56\" height=\"46\" rx=\"5\"/><rect x=\"140\" y=\"130\" width=\"56\" height=\"46\" rx=\"5\"/><rect x=\"210\" y=\"130\" width=\"56\" height=\"46\" rx=\"5\"/>\r\n    <rect x=\"70\" y=\"200\" width=\"56\" height=\"46\" rx=\"5\"/><rect x=\"140\" y=\"200\" width=\"56\" height=\"46\" rx=\"5\"/><rect x=\"210\" y=\"200\" width=\"56\" height=\"46\" rx=\"5\"/>\r\n  </g>\r\n  <g fill=\"#E8E4D8\" text-anchor=\"middle\" font-size=\"13\">\r\n    <text x=\"98\" y=\"88\">1</text><text x=\"168\" y=\"88\">2</text><text x=\"238\" y=\"88\">3</text>\r\n    <text x=\"98\" y=\"158\">4</text><text x=\"168\" y=\"158\">5</text><text x=\"238\" y=\"158\">6</text>\r\n    <text x=\"98\" y=\"228\">7</text><text x=\"168\" y=\"228\">8</text><text x=\"238\" y=\"228\">9</text>\r\n  </g>\r\n</svg>\r\n<figcaption>The number in each cell is the run order: finish all columns of row 0 (1→2→3), then move to row 1 (4→5→6), then row 2. The inner loop runs fully for each value of the outer loop.</figcaption>\r\n</figure>\r\n<p>Trace table for <code>range(2)</code> nested in <code>range(2)</code>:</p>\r\n<table class=\"res\">\r\n<thead><tr><th>Step</th><th>i</th><th>j</th></tr></thead>\r\n<tbody>\r\n<tr><td>1</td><td>0</td><td>0</td></tr>\r\n<tr><td>2</td><td>0</td><td>1</td></tr>\r\n<tr><td>3</td><td>1</td><td>0</td></tr>\r\n<tr><td>4</td><td>1</td><td>1</td></tr>\r\n</tbody>\r\n</table>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 1.</b> Use two nested loops to count how many times the innermost body runs, with <code>i</code> in <code>range(3)</code> and <code>j</code> in <code>range(3)</code>. Store it in <code>count</code> (start <code>count = 0</code>). Result <code>9</code>.</span>\r\n<template class=\"st\">count = 0\r\n# two nested loops, each pass increments count\r\n</template>\r\n<template class=\"ts\">assert count == 9\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 2.</b> Create <code>coords</code> = a list of <code>[i, j]</code> pairs with <code>i</code> in <code>range(2)</code> and <code>j</code> in <code>range(2)</code> → <code>[[0, 0], [0, 1], [1, 0], [1, 1]]</code> (use <code>append([i, j])</code>).</span>\r\n<template class=\"st\">coords = []\r\n# create a list of [i, j] pairs\r\n</template>\r\n<template class=\"ts\">assert coords == [[0, 0], [0, 1], [1, 0], [1, 1]]\r\n</template></div>\r\n\r\n<h4>3. Building a \"grid\" (a list of lists)</h4>\r\n<p>A very common pattern: the outer loop creates each <b>row</b> (an empty list), the inner loop <code>append</code>s the <b>cells</b> into that row, and at the end of each row we <code>append</code> the whole row into the grid.</p>\r\n<pre class=\"run\">table = []\r\nfor i in range(1, 4):\r\n    row = []                     # start a new row\r\n    for j in range(1, 4):\r\n        row.append(i * j)        # add a cell to the row\r\n    table.append(row)            # add the whole row to the table\r\nprint(table)   # [[1, 2, 3], [2, 4, 6], [3, 6, 9]]</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 3.</b> Create a multiplication table <code>table</code> for 1..3: each row <code>i</code> holds <code>i*1, i*2, i*3</code> → <code>[[1, 2, 3], [2, 4, 6], [3, 6, 9]]</code>.</span>\r\n<template class=\"st\">table = []\r\n# create the 1..3 multiplication table\r\n</template>\r\n<template class=\"ts\">assert table == [[1, 2, 3], [2, 4, 6], [3, 6, 9]]\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 4.</b> Create a 3×3 <code>grid</code> where the cell at row <code>i</code>, column <code>j</code> is <code>i + j</code> (i, j from 0..2) → <code>[[0, 1, 2], [1, 2, 3], [2, 3, 4]]</code>.</span>\r\n<template class=\"st\">grid = []\r\n# create a 3x3 grid with cell = i + j\r\n</template>\r\n<template class=\"ts\">assert grid == [[0, 1, 2], [1, 2, 3], [2, 3, 4]]\r\n</template></div>\r\n\r\n<h4>4. Walking an existing grid</h4>\r\n<p>Once you have a grid (a list of lists), you walk it with two loops too: the outer loop takes each <b>row</b>, the inner loop takes each <b>cell</b> in that row.</p>\r\n<pre class=\"run\">grid = [[1, 2], [3, 4]]\r\ntotal = 0\r\nfor row in grid:           # row is [1,2] then [3,4]\r\n    for cell in row:       # cell is each number\r\n        total += cell\r\nprint(total)               # 1 + 2 + 3 + 4 = 10</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 5.</b> Given <code>grid = [[1, 2], [3, 4]]</code>, sum all the cells into <code>total</code>. Result <code>10</code>.</span>\r\n<template class=\"st\">grid = [[1, 2], [3, 4]]\r\ntotal = 0\r\n# sum all the cells\r\n</template>\r\n<template class=\"ts\">assert total == 10\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 6.</b> Given <code>grid = [[1, 2, 3], [4, 5, 6]]</code>, count the cells with an <b>even</b> value into <code>even_cells</code>. Result <code>3</code>.</span>\r\n<template class=\"st\">grid = [[1, 2, 3], [4, 5, 6]]\r\neven_cells = 0\r\n# count the even cells\r\n</template>\r\n<template class=\"ts\">assert even_cells == 3\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 7.</b> Given <code>grid = [[3, 7], [2, 9], [5, 1]]</code>, find the <b>largest</b> value in the whole grid into <code>biggest</code> (start <code>biggest = grid[0][0]</code>). Result <code>9</code>.</span>\r\n<template class=\"st\">grid = [[3, 7], [2, 9], [5, 1]]\r\nbiggest = grid[0][0]\r\n# find the largest value in the grid\r\n</template>\r\n<template class=\"ts\">assert biggest == 9\r\n</template></div>\r\n\r\n<h4>5. Drawing shapes with loops</h4>\r\n<p>Repeating a string (<code>\"*\" * i</code>) together with a loop produces patterns — a classic exercise for building nested-loop intuition.</p>\r\n<pre class=\"run\">lines = []\r\nfor i in range(1, 4):\r\n    lines.append(\"*\" * i)\r\nprint(lines)   # ['*', '**', '***']</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 8.</b> Create <code>lines</code> = <code>[\"*\", \"**\", \"***\", \"****\"]</code> (a 4-row star triangle) using a loop and <code>\"*\" * i</code>.</span>\r\n<template class=\"st\">lines = []\r\n# create a 4-row star triangle\r\n</template>\r\n<template class=\"ts\">assert lines == [\"*\", \"**\", \"***\", \"****\"]\r\n</template></div>\r\n\r\n<h4>6. Comparing pairs</h4>\r\n<p>Nested loops also let you consider <b>every pair</b> of elements — e.g. finding two numbers that add up to a target.</p>\r\n<pre class=\"run\">nums = [1, 2, 3, 4]\r\ntarget = 5\r\npairs = 0\r\nfor a in range(len(nums)):\r\n    for b in range(a + 1, len(nums)):   # b > a to avoid repeating a pair\r\n        if nums[a] + nums[b] == target:\r\n            pairs += 1\r\nprint(pairs)   # (1,4) and (2,3) -> 2</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 9.</b> Given <code>nums = [1, 2, 3, 4]</code> and <code>target = 5</code>, count the <b>pairs</b> (different positions, no repeats) whose sum equals <code>target</code> into <code>pairs</code>. Result <code>2</code>.</span>\r\n<template class=\"st\">nums = [1, 2, 3, 4]\r\ntarget = 5\r\npairs = 0\r\n# count the pairs summing to target\r\n</template>\r\n<template class=\"ts\">assert pairs == 2\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 10.</b> Given <code>grid = [[1, 2], [3, 4], [5, 6]]</code>, create <code>row_sums</code> = a list of each row's sum → <code>[3, 7, 11]</code>.</span>\r\n<template class=\"st\">grid = [[1, 2], [3, 4], [5, 6]]\r\nrow_sums = []\r\n# create a list of each row's sum\r\n</template>\r\n<template class=\"ts\">assert row_sums == [3, 7, 11]\r\n</template></div>\r\n<div class=\"ex stretch\" data-kind=\"py\"><span class=\"exq\"><b>🔥 Stretch (diagonal sum).</b> Given <code>grid = [[1, 2, 3], [4, 5, 6], [7, 8, 9]]</code> (a square matrix), sum the main diagonal (cells <code>grid[i][i]</code>) into <code>diag</code>. Result <code>1 + 5 + 9 = 15</code>.</span>\r\n<template class=\"st\">grid = [[1, 2, 3], [4, 5, 6], [7, 8, 9]]\r\ndiag = 0\r\n# sum the main diagonal grid[i][i]\r\n</template>\r\n<template class=\"ts\">assert diag == 15\r\n</template></div>\r\n\r\n<div class=\"recap\">Recap of lesson 8: nested loops = a loop inside a loop · for each outer pass, the inner runs <b>completely</b> → total runs = outer × inner · two indent levels · the grid-building pattern: new row → add cells → add row · walking a grid: <code>for row in grid: for cell in row</code> · consider every pair with two indexes (b starts at a+1). Next: get your real tools ready (Python + VS Code) and practice for the mini-project.</div>\r\n\r\n<h4>🏠 Homework</h4>\r\n<p>Do this at home, outside the 2-hour class. Four questions; the last is a stretch.</p>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Homework 1.</b> Given <code>grid = [[1, 2, 3], [4, 5, 6]]</code>, sum all the cells into <code>total</code>. Result <code>21</code>.</span>\r\n<template class=\"st\">grid = [[1, 2, 3], [4, 5, 6]]\r\ntotal = 0\r\n# sum all the cells\r\n</template>\r\n<template class=\"ts\">assert total == 21\r\n</template></div>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Homework 2.</b> Given <code>grid = [[2, 3], [4, 5], [6, 7]]</code>, count the cells <b>greater than 3</b> into <code>big_cells</code>. Result <code>4</code>.</span>\r\n<template class=\"st\">grid = [[2, 3], [4, 5], [6, 7]]\r\nbig_cells = 0\r\n# count the cells > 3\r\n</template>\r\n<template class=\"ts\">assert big_cells == 4\r\n</template></div>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Homework 3.</b> Create a 3×3 <code>grid</code> where the cell at row <code>i</code>, column <code>j</code> is <code>i * j</code> (i, j from 0..2) → <code>[[0, 0, 0], [0, 1, 2], [0, 2, 4]]</code>.</span>\r\n<template class=\"st\">grid = []\r\n# create a 3x3 grid with cell = i * j\r\n</template>\r\n<template class=\"ts\">assert grid == [[0, 0, 0], [0, 1, 2], [0, 2, 4]]\r\n</template></div>\r\n<div class=\"ex homework stretch\" data-kind=\"py\"><span class=\"exq\"><b>🔥 Homework 4 (stretch).</b> Given <code>grid = [[1, 2], [9, 1], [3, 3]]</code>, find the <b>index of the row with the largest sum</b> into <code>max_row</code>. The sums are 3, 10, 6 → row index <code>1</code>.</span>\r\n<template class=\"st\">grid = [[1, 2], [9, 1], [3, 3]]\r\nmax_row = 0\r\n# find the index of the row with the largest sum\r\n</template>\r\n<template class=\"ts\">assert max_row == 1\r\n</template></div>"}},{"t":{"vi":"Cài đặt: Python + VS Code","en":"Setup: Python + VS Code"},"html":"<h3>Bài 9 — List of dicts — dữ liệu như đời thật</h3>\n<p><i>(Nội dung đang được biên soạn.)</i></p>","kind":"free"},{"t":{"vi":"Đồ án nhỏ: quản lý công việc (to-do)","en":"Mini project: to-do / task manager"},"html":"<h3>Bài 10 — Đồ án nhỏ: sổ chi tiêu mini</h3>\n<p><i>(Nội dung đang được biên soạn.)</i></p>"},{"t":{"vi":"Dictionary — dữ liệu có nhãn","en":"Dictionaries — labeled data"},"html":"<h3>Bài 11 — try / except — xử lý lỗi</h3>\n<p><i>(Nội dung đang được biên soạn.)</i></p>"},{"t":{"vi":"List of dicts & dữ liệu lồng nhau","en":"Lists of dicts & nested data"},"html":"<h3>Bài 12 — Tuple, unpacking & enumerate</h3>\n<p><i>(Nội dung đang được biên soạn.)</i></p>"},{"t":{"vi":"Hàm (def)","en":"Functions (def)"},"html":"<h3>Bài 13 — List comprehension</h3>\n<p><i>(Nội dung đang được biên soạn.)</i></p>"},{"t":{"vi":"Hàm nâng cao: tham số, return, phạm vi","en":"Functions in depth: params, return, scope"},"html":"<h3>Bài 14 — Set — tập hợp không trùng lặp</h3>\n<p><i>(Nội dung đang được biên soạn.)</i></p>"},{"t":{"vi":"Xử lý lỗi: try / except","en":"Errors: try / except"},"html":"<h3>Bài 15 — sorted() với key và lambda</h3>\n<p><i>(Nội dung đang được biên soạn.)</i></p>"},{"t":{"vi":"Tuple, unpacking & enumerate","en":"Tuples, unpacking & enumerate"},"html":"<h3>Bài 16 — split / join — xử lý CSV</h3>\n<p><i>(Nội dung đang được biên soạn.)</i></p>"},{"t":{"vi":"List/dict comprehension","en":"Comprehensions"},"html":"<h3>Bài 17 — Module: math & datetime</h3>\n<p><i>(Nội dung đang được biên soạn.)</i></p>"},{"t":{"vi":"Set & sắp xếp (sorted, key, lambda)","en":"Sets & sorting (sorted, key, lambda)"},"html":"<h3>Bài 18 — Viết hàm sạch</h3>\n<p><i>(Nội dung đang được biên soạn.)</i></p>"},{"t":{"vi":"Văn bản & file: split/join, module","en":"Text & files: split/join, modules"},"html":"<h3>Bài 19 — Đếm tần suất</h3>\n<p><i>(Nội dung đang được biên soạn.)</i></p>"},{"t":{"vi":"Đồ án tốt nghiệp: phân tích log/văn bản","en":"Capstone: log / text analyzer"},"html":"<h3>Bài 20 — Đồ án tốt nghiệp: phân tích bảng điểm</h3>\n<p><i>(Nội dung đang được biên soạn.)</i></p>"}]};
