const COURSE={"id":"python","ls":"mk:python","title":{"vi":"Python căn bản","en":"Python Foundations"},"sub":{"vi":"20 buổi · mỗi buổi ~2 giờ (~40 giờ) · Bài 1 miễn phí. Python thật chạy trong trình duyệt (lần đầu tải ~10MB, hãy kiên nhẫn).","en":"20 lessons · ~2 hours each (~40h) · Lesson 1 free. Real Python runs in your browser (first load ~10MB, be patient)."},"lessons":[{"t":{"vi":"Giá trị, biến và print()","en":"Values, variables and print()"},"kind":"free","html":{"vi":"<h3>Bài 1 — Bắt đầu với Python: giá trị, biến và print()</h3>\r\n<p>Chào mừng bạn đến với bài học đầu tiên. Nếu bạn chưa từng viết một dòng code nào — <b>hoàn hảo</b>, bài này viết đúng cho bạn. Chúng ta sẽ đi thật chậm: hiểu lập trình là gì, Python là gì, rồi mới từ từ gõ những dòng code đầu tiên.</p>\r\n\r\n<h4>1. Lập trình là gì? Python là gì?</h4>\r\n<p><b>Lập trình</b> đơn giản là viết ra một danh sách <b>chỉ thị (lệnh)</b> để máy tính làm theo — giống như viết công thức nấu ăn: từng bước, rõ ràng, theo thứ tự. Máy tính rất nhanh và chính xác, nhưng nó <i>chỉ làm đúng những gì bạn bảo</i>, không tự đoán ý bạn. Học lập trình phần lớn là học cách <b>diễn đạt ý tưởng thật rõ ràng</b> để máy hiểu.</p>\r\n<p><b>Python</b> là một <b>ngôn ngữ lập trình</b> — bộ từ vựng và ngữ pháp để viết các chỉ thị đó. Người ta chọn Python để bắt đầu vì nó gần với tiếng Anh đời thường, ít ký hiệu rối rắm, và được dùng ở khắp nơi: web, phân tích dữ liệu, tự động hóa, trí tuệ nhân tạo… Viết <code>print(\"Xin chao\")</code> trong Python dễ đọc hơn hẳn so với nhiều ngôn ngữ khác.</p>\r\n<p>Trong khóa này bạn sẽ chạy Python <b>thật</b> — chính là Python mà lập trình viên chuyên nghiệp dùng — ngay trong trình duyệt, không phải cài đặt gì cả.</p>\r\n\r\n<h4>2. Cách học ở The Dojo</h4>\r\n<p>Mỗi khi gặp một ô có nền tối như bên dưới, đó là <b>chỗ bạn viết code</b>. Bên dưới ô đó có hai nút:</p>\r\n<ul>\r\n<li><b>Chạy (Run):</b> gửi code của bạn cho Python chạy thật. <i>Lần chạy đầu tiên</i> trình duyệt tải bộ máy Python (~10MB), có thể mất 10–30 giây — hãy kiên nhẫn; các lần sau chạy tức thì.</li>\r\n<li><b>Đặt lại (Reset):</b> đưa ô code về trạng thái ban đầu nếu bạn muốn làm lại từ đầu.</li>\r\n</ul>\r\n<p>Sau khi bấm Chạy, bạn sẽ thấy một khung kết quả gồm hai phần:</p>\r\n<ul>\r\n<li><b>Kết quả in ra (Output):</b> mọi thứ chương trình của bạn <i>in ra màn hình</i> sẽ hiện ở đây — giống như \"màn hình\" của chương trình. Khung này luôn hiện, dù bài làm đúng hay sai.</li>\r\n<li><b>Kết luận:</b> <span style=\"color:var(--jade)\">Đạt</span> nếu bài làm đúng, hoặc <span style=\"color:var(--ember)\">Chưa đạt</span> kèm một lời gợi ý cụ thể (ví dụ: biến nào sai, giá trị đang là gì và cần là gì).</li>\r\n</ul>\r\n<p>Bạn có thể sửa code và bấm Chạy lại bao nhiêu lần tùy thích — sai là chuyện bình thường và là cách học nhanh nhất.</p>\r\n\r\n<h4>3. Lệnh đầu tiên: <code>print()</code></h4>\r\n<p>Chương trình chạy các lệnh <b>lần lượt từ trên xuống dưới</b>. Lệnh đầu tiên và hay dùng nhất là <code>print()</code> — bảo máy <b>in (hiển thị) một thứ gì đó ra màn hình</b>.</p>\r\n<pre class=\"run\">print(\"Xin chao\")\r\nprint(\"Toi dang hoc Python\")</pre>\r\n<p>Hãy đọc dòng <code>print(\"Xin chao\")</code> theo từng phần:</p>\r\n<ul>\r\n<li><code>print</code> — tên của lệnh (in ra màn hình).</li>\r\n<li><code>( )</code> — cặp ngoặc tròn, bên trong đặt thứ bạn muốn in.</li>\r\n<li><code>\"Xin chao\"</code> — một đoạn <b>chữ</b>. Trong lập trình, chữ được gọi là <b>chuỗi (string)</b> và <u>bắt buộc đặt trong dấu nháy</u> <code>\"...\"</code>. Dấu nháy cho máy biết \"đây là chữ để in nguyên văn\", không phải một lệnh.</li>\r\n</ul>\r\n<p>Nếu quên dấu nháy — ví dụ <code>print(Xin chao)</code> — máy sẽ báo lỗi, vì nó tưởng <code>Xin</code> và <code>chao</code> là tên lệnh nào đó mà nó không biết.</p>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 1.</b> Dùng <code>print()</code> in ra đúng dòng chữ <code>Hello Dojo</code>. (Nhớ dấu nháy quanh đoạn chữ.)</span>\r\n<template class=\"st\"># Go lenh print cua ban o duoi day:\r\n</template>\r\n<template class=\"ts\">assert _OUT_.strip() == \"Hello Dojo\", \"phai in ra dung: Hello Dojo\"\r\n</template></div>\r\n<p><i>Lưu ý: bài tập này kiểm tra <b>thứ bạn in ra màn hình</b> (xem khung Kết quả in ra). Đa số bài sau kiểm tra <b>giá trị của biến</b> — ta sẽ học \"biến\" ngay bên dưới.</i></p>\r\n\r\n<h4>4. Chú thích với dấu <code>#</code></h4>\r\n<p>Bạn có để ý dòng <code># Go lenh print cua ban o duoi day:</code> ở bài tập trên không? Đó là một <b>chú thích (comment)</b>. Mọi thứ sau dấu <code>#</code> trên một dòng sẽ bị Python <b>bỏ qua hoàn toàn</b> — nó là ghi chú dành cho <i>con người đọc</i>, không phải lệnh cho máy chạy.</p>\r\n<pre># Day la chu thich — Python khong chay dong nay\r\nprint(\"Day moi la lenh duoc chay\")   # chu thich cung co the year cuoi dong</pre>\r\n<p>Chú thích dùng để giải thích code cho chính bạn (và người khác) đọc lại sau này. Trong các bài tập, chúng tôi thường để sẵn một dòng <code>#</code> gợi ý chỗ bạn cần viết.</p>\r\n\r\n<h4>5. Giá trị và kiểu dữ liệu</h4>\r\n<p>Mọi dữ liệu trong Python đều có một <b>kiểu</b>. Bốn kiểu nền tảng bạn gặp đầu tiên:</p>\r\n<pre>10          # so nguyen  -> int    (khong co phan thap phan)\r\n3.14        # so thuc    -> float  (co dau cham thap phan)\r\n\"xin chao\"  # chuoi      -> str    (chu trong dau nhay)\r\nTrue        # dung/sai   -> bool   (chi True hoac False)</pre>\r\n<p>Bạn có thể hỏi máy \"đây là kiểu gì?\" bằng lệnh <code>type()</code>:</p>\r\n<pre>print(type(10))       # &lt;class 'int'&gt;\r\nprint(type(3.14))     # &lt;class 'float'&gt;\r\nprint(type(\"hi\"))     # &lt;class 'str'&gt;\r\nprint(type(True))     # &lt;class 'bool'&gt;</pre>\r\n<p>Vì sao kiểu lại quan trọng? Vì máy <b>cư xử khác nhau</b> tùy kiểu: <code>3 + 4</code> ra <code>7</code> (cộng số), nhưng <code>\"3\" + \"4\"</code> ra <code>\"34\"</code> (nối chữ lại với nhau). Nhầm kiểu là một trong những lỗi phổ biến nhất của người mới.</p>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 2.</b> Tạo bốn biến: <code>a</code> = số nguyên 42, <code>b</code> = số thực 3.5, <code>c</code> = chuỗi <code>\"Python\"</code> (viết hoa chữ P), <code>d</code> = giá trị đúng/sai <code>True</code>.</span>\r\n<template class=\"st\"># tao 4 bien a, b, c, d\r\n</template>\r\n<template class=\"ts\">assert a == 42 and isinstance(a, int)\r\nassert b == 3.5 and isinstance(b, float)\r\nassert c == \"Python\" and isinstance(c, str)\r\nassert d is True\r\n</template></div>\r\n\r\n<h4>6. Biến — chiếc hộp có tên</h4>\r\n<p>Một <b>biến</b> là cái tên gắn với một giá trị, giúp bạn lưu lại để dùng sau. Dấu <code>=</code> nghĩa là <b>gán</b>: lấy giá trị bên phải, bỏ vào chiếc hộp có tên bên trái.</p>\r\n<pre>age = 15\r\nname = \"Minh\"\r\nprint(name, \"year nay\", age, \"age\")   # Minh year nay 15 age</pre>\r\n<p>Biến có thể <b>gán lại</b> — giá trị mới thay giá trị cũ:</p>\r\n<pre>score = 5\r\nscore = score + 3     # lay score cu (5) cong 3, cat lai vao score -> 8\r\nprint(score)          # 8</pre>\r\n<h4>Quy tắc đặt tên biến</h4>\r\n<ul>\r\n<li>Chỉ gồm chữ cái, chữ số và dấu gạch dưới <code>_</code>; <b>không</b> bắt đầu bằng chữ số.</li>\r\n<li>Không dấu tiếng Việt, không khoảng trắng. Dùng <code>gach_duoi</code> để nối từ: <code>quantity</code>, <code>user_name</code>.</li>\r\n<li>Phân biệt hoa–thường: <code>age</code> và <code>Tuoi</code> là hai biến khác nhau.</li>\r\n<li>Đặt tên <b>có nghĩa</b>: <code>price</code> tốt hơn <code>x</code>.</li>\r\n</ul>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 3.</b> Tạo biến <code>quantity</code> = 4 và <code>unit_price</code> = 25000. Tạo biến <code>subtotal</code> bằng tích của chúng (viết phép nhân <code>*</code>, đừng ghi sẵn kết quả).</span>\r\n<template class=\"st\">quantity = 4\r\nunit_price = 25000\r\n# tao subtotal = quantity nhan unit_price\r\n</template>\r\n<template class=\"ts\">assert subtotal == 100000\r\n</template></div>\r\n\r\n<h4>7. <code>print()</code> kỹ hơn</h4>\r\n<p><code>print()</code> có thể in nhiều thứ một lúc, cách nhau bằng dấu phẩy — máy tự chèn một khoảng trắng giữa chúng:</p>\r\n<pre>name = \"Minh\"\r\nprint(\"Xin chao,\", name)     # Xin chao, Minh</pre>\r\n<p>Bạn có thể đổi ký tự ngăn cách bằng <code>sep</code>, và ký tự kết thúc dòng bằng <code>end</code>:</p>\r\n<pre>print(\"2024\", \"09\", \"18\", sep=\"-\")   # 2024-09-18\r\nprint(\"Dang tai\", end=\"...\")          # khong xuong dong, in tiep \"...\"</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 4.</b> Cho <code>year = 2026</code>, <code>month = 9</code>, <code>day = 18</code>. Dùng <code>print()</code> với <code>sep</code> để in đúng chuỗi <code>2026/9/18</code>. (Lưu ý: đây là ba <i>biến số</i>, đừng đặt chúng trong dấu nháy.)</span>\r\n<template class=\"st\">year = 2026\r\nmonth = 9\r\nday = 18\r\n# in 2026/9/18 bang print(..., sep=...)\r\n</template>\r\n<template class=\"ts\">assert _OUT_.strip() == \"2026/9/18\", \"phai in ra 2026/9/18\"\r\n</template></div>\r\n\r\n<h4>8. Nhận dữ liệu từ người dùng — <code>input()</code></h4>\r\n<p>Hàm <code>input()</code> dừng chương trình lại, chờ người dùng gõ, rồi trả về thứ họ gõ. <b>Điều cực kỳ quan trọng:</b> <code>input()</code> <u>luôn trả về một chuỗi (str)</u>, kể cả khi người ta gõ số.</p>\r\n<pre>name = input(\"Ten ban la gi? \")\r\nprint(\"Chao\", name)\r\n\r\nage_str = input(\"Tuoi cua ban? \")   # vi du go \"15\" -> age_str = \"15\" (chuoi!)\r\nprint(type(age_str))                 # &lt;class 'str'&gt;</pre>\r\n<p>Vì kết quả là chuỗi, muốn tính toán bạn phải <b>ép kiểu</b> sang số trước.</p>\r\n\r\n<h4>9. Ép kiểu (type conversion)</h4>\r\n<pre>int(\"15\")     # 15   (chuoi -> so nguyen)\r\nfloat(\"3.5\")  # 3.5  (chuoi -> so thuc)\r\nstr(15)       # \"15\" (so -> chuoi)</pre>\r\n<p>Đây là lý do dòng dưới bị lỗi logic kinh điển: nối hai chuỗi thay vì cộng hai số.</p>\r\n<pre>a = input(\"So a: \")   # \"7\"\r\nb = input(\"So b: \")   # \"3\"\r\nprint(a + b)          # \"73\"  (SAI! noi chuoi)\r\nprint(int(a) + int(b))# 10    (DUNG, ep sang int truoc)</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 5.</b> Cho hai chuỗi <code>a = \"7\"</code> và <code>b = \"3\"</code> (giả lập kết quả của <code>input()</code>). Tạo biến <code>total</code> = tổng <i>số học</i> của chúng (kết quả phải là <code>10</code>, không phải <code>\"73\"</code>).</span>\r\n<template class=\"st\">a = \"7\"\r\nb = \"3\"\r\n# tao total = total so hoc cua a va b\r\n</template>\r\n<template class=\"ts\">assert total == 10, \"nho ep kieu int() truoc khi cong\"\r\n</template></div>\r\n\r\n<h4>10. Tính toán — các phép toán số học</h4>\r\n<pre>7 + 3     # 10   cong\r\n7 - 3     # 4    tru\r\n7 * 3     # 21   nhan\r\n7 / 2     # 3.5  chia (LUON ra float)\r\n7 // 2    # 3    chia lay phan nguyen\r\n7 % 2     # 1    chia lay so du (modulo)\r\n2 ** 10   # 1024 luy thua (2 mu 10)</pre>\r\n<p>Hai phép <code>//</code> và <code>%</code> rất hay dùng: <code>//</code> cho biết \"chia được bao nhiêu lần trọn vẹn\", <code>%</code> cho biết \"còn dư bao nhiêu\". Ví dụ đổi 100 phút ra giờ:phút → <code>100 // 60 = 1</code> giờ, <code>100 % 60 = 40</code> phút.</p>\r\n<p>Thứ tự ưu tiên giống toán học: <code>**</code> trước, rồi <code>* / // %</code>, rồi <code>+ -</code>. Dùng ngoặc <code>( )</code> khi muốn ép thứ tự:</p>\r\n<pre>2 + 3 * 4       # 14  (nhan truoc)\r\n(2 + 3) * 4     # 20  (ngoac truoc)</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 6.</b> Cho <code>total_minutes = 100</code>. Tính <code>hours</code> = số giờ trọn vẹn và <code>minutes</code> = số phút còn dư (dùng <code>//</code> và <code>%</code> với 60).</span>\r\n<template class=\"st\">total_minutes = 100\r\n# tao hours va minutes\r\n</template>\r\n<template class=\"ts\">assert hours == 1, \"dung // 60\"\r\nassert minutes == 40, \"dung % 60\"\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 7.</b> Tính trung bình cộng của ba số <code>8</code>, <code>9</code>, <code>10</code> và lưu vào <code>average</code>. Cẩn thận thứ tự ưu tiên — nhớ dùng ngoặc!</span>\r\n<template class=\"st\"># tao average = trung binh cong cua 8, 9, 10\r\n</template>\r\n<template class=\"ts\">assert average == 9, \"nho dung ngoac: (8+9+10)/3\"\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 8.</b> Cho <code>age = 20</code> (một số). Tạo chuỗi <code>label = \"Age: 20\"</code> bằng cách nối chuỗi <code>\"Age: \"</code> với <code>age</code> — nhớ ép kiểu số về chuỗi bằng <code>str()</code>.</span>\r\n<template class=\"st\">age = 20\r\n# tao label = \"Age: 20\" bang cach noi chuoi\r\n</template>\r\n<template class=\"ts\">assert label == \"Age: 20\", \"dung 'Age: ' + str(age)\"\r\n</template></div>\r\n\r\n<h4>11. Gán rút gọn (+=, -=, *=)</h4>\r\n<p>Khi cập nhật một biến bằng chính nó, Python có cách viết ngắn gọn — rất hay dùng khi đếm hoặc cộng dồn:</p>\r\n<pre class=\"run\">score = 5\r\nscore += 3     # giong: score = score + 3  -> 8\r\nscore *= 2     # giong: score = score * 2  -> 16\r\nscore -= 1     # -> 15\r\nprint(score)   # 15</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 9.</b> Cho <code>diem = 10</code>. Dùng phép gán rút gọn: cộng thêm 5 (<code>+= 5</code>) rồi nhân đôi (<code>*= 2</code>). Kết quả cuối cùng lưu ở <code>diem</code>.</span>\r\n<template class=\"st\">diem = 10\r\n# dùng += và *= để được 30\r\n</template>\r\n<template class=\"ts\">assert diem == 30, \"10 + 5 = 15, roi *2 = 30\"\r\n</template></div>\r\n\r\n<h4>12. Những lỗi thường gặp của người mới</h4>\r\n<ul>\r\n<li><b>Quên dấu nháy:</b> <code>print(xin chao)</code> → lỗi. Chuỗi phải là <code>\"xin chao\"</code>.</li>\r\n<li><b>Nhầm <code>=</code> với <code>==</code>:</b> <code>=</code> là gán, <code>==</code> là so sánh (học ở bài 3).</li>\r\n<li><b>Cộng chuỗi với số:</b> <code>\"Age: \" + 20</code> → lỗi. Phải <code>\"Age: \" + str(20)</code>.</li>\r\n<li><b>Quên ép kiểu sau <code>input()</code>:</b> kết quả là chuỗi, không tính toán trực tiếp được.</li>\r\n</ul>\r\n\r\n<div class=\"recap\">Ghi nhớ bài 1: lập trình là viết chỉ thị cho máy · Python là ngôn ngữ dễ đọc cho người mới · <code>print()</code> in ra màn hình, chữ đặt trong dấu nháy · <code>#</code> là chú thích (máy bỏ qua) · dữ liệu có <b>kiểu</b> (int/float/str/bool) · biến là hộp có tên, <code>=</code> là gán · <code>input()</code> luôn trả về chuỗi → nhớ ép kiểu <code>int()/float()</code> · các phép toán <code>+ - * / // % **</code> và thứ tự ưu tiên · <code>+= -= *=</code> gán rút gọn. Bài sau: làm chủ chuỗi và f-string.</div>\r\n\r\n<div class=\"ex stretch\" data-kind=\"py\"><span class=\"exq\"><b>🔥 Thử thách.</b> Cho <code>price_str = \"120000\"</code> và <code>qty_str = \"3\"</code> (giả lập <code>input()</code>). Tính tổng tiền có cộng thêm <b>10% VAT</b>, làm tròn về số nguyên, lưu vào <code>total</code>. (Gợi ý: ép kiểu số, nhân với nhau rồi nhân <code>1.1</code>, dùng <code>round()</code>.)</span>\r\n<template class=\"st\">price_str = \"120000\"\r\nqty_str = \"3\"\r\n# tao total = tong tien + 10% VAT, lam tron ve so nguyen\r\n</template>\r\n<template class=\"ts\">assert total == 396000, \"120000 * 3 = 360000, them 10% = 396000\"\r\n</template></div>\r\n\r\n<h4>🏠 Bài tập về nhà</h4>\r\n<p>Làm ở nhà, không tính vào 2 giờ trên lớp. Bốn câu, câu cuối là thử thách.</p>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Bài về nhà 1.</b> Cho <code>vnd_str = \"260000\"</code> (chuỗi). Đổi sang USD với tỉ giá 26000: tạo <code>usd</code> (số thực) = số tiền VND chia cho 26000, rồi tạo <code>message</code> bằng f-string đúng dạng <code>\"260000 VND = 10.0 USD\"</code>.</span>\r\n<template class=\"st\">vnd_str = \"260000\"\r\nrate = 26000\r\n# tao usd va message\r\n</template>\r\n<template class=\"ts\">assert usd == 10.0, \"ep kieu int(vnd_str) roi chia cho rate\"\r\nassert message == \"260000 VND = 10.0 USD\", 'dung f\"{vnd_str} VND = {usd} USD\"'\r\n</template></div>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Bài về nhà 2.</b> Cho <code>celsius = 25</code> (một số). Đổi sang độ F: <code>fahrenheit = celsius * 9 / 5 + 32</code> → <code>77.0</code>.</span>\r\n<template class=\"st\">celsius = 25\r\n# tao fahrenheit\r\n</template>\r\n<template class=\"ts\">assert fahrenheit == 77.0\r\n</template></div>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Bài về nhà 3.</b> Cho hình chữ nhật <code>width = 4</code>, <code>height = 5</code>. Tạo <code>area</code> = diện tích (<code>width * height</code>) và <code>perimeter</code> = chu vi (<code>2 * (width + height)</code>).</span>\r\n<template class=\"st\">width = 4\r\nheight = 5\r\n# tao area va perimeter\r\n</template>\r\n<template class=\"ts\">assert area == 20\r\nassert perimeter == 18\r\n</template></div>\r\n<div class=\"ex homework stretch\" data-kind=\"py\"><span class=\"exq\"><b>🔥 Bài về nhà 4 (thử thách).</b> Cho <code>total_seconds = 3661</code>. Tách thành giờ/phút/giây rồi tạo chuỗi <code>time_str</code> dạng <code>\"01:01:01\"</code> (mỗi phần 2 chữ số). Gợi ý: <code>// 3600</code>, <code>% 3600 // 60</code>, <code>% 60</code>, và f-string <code>{h:02d}</code>.</span>\r\n<template class=\"st\">total_seconds = 3661\r\n# tao time_str dang \"HH:MM:SS\"\r\n</template>\r\n<template class=\"ts\">assert time_str == \"01:01:01\"\r\n</template></div>","en":"<h3>Lesson 1 — Getting started with Python: values, variables and print()</h3>\r\n<p>Welcome to your very first lesson. If you've never written a line of code before — <b>perfect</b>, this lesson is written exactly for you. We'll go slowly: understand what programming is, what Python is, and only then type our first lines of code.</p>\r\n\r\n<h4>1. What is programming? What is Python?</h4>\r\n<p><b>Programming</b> is simply writing a list of <b>instructions</b> for a computer to follow — like writing a recipe: step by step, clear, in order. Computers are fast and precise, but they <i>only do exactly what you tell them</i> and never guess your intent. Learning to program is mostly learning to <b>express ideas very clearly</b> so the machine understands.</p>\r\n<p><b>Python</b> is a <b>programming language</b> — the vocabulary and grammar for writing those instructions. People pick Python to start because it reads close to plain English, has few confusing symbols, and is used everywhere: web, data analysis, automation, artificial intelligence… Writing <code>print(\"Hello\")</code> in Python is far more readable than in many other languages.</p>\r\n<p>In this course you'll run <b>real</b> Python — the same Python professional developers use — right in your browser, with nothing to install.</p>\r\n\r\n<h4>2. How learning works at The Dojo</h4>\r\n<p>Whenever you see a dark box like the one below, that's <b>where you write code</b>. Under it are two buttons:</p>\r\n<ul>\r\n<li><b>Run:</b> sends your code to real Python. The <i>first run</i> downloads the Python engine (~10MB), which can take 10–30 seconds — be patient; after that it's instant.</li>\r\n<li><b>Reset:</b> restores the code box to its starting state if you want to start over.</li>\r\n</ul>\r\n<p>After you click Run, you'll see a result area with two parts:</p>\r\n<ul>\r\n<li><b>Output:</b> everything your program <i>prints to the screen</i> appears here — it's your program's \"screen\". This panel always shows, whether your answer is right or wrong.</li>\r\n<li><b>Verdict:</b> <span style=\"color:var(--jade)\">Pass</span> if your answer is correct, or <span style=\"color:var(--ember)\">Fail</span> with a specific hint (e.g. which variable is wrong, what its value is and what it should be).</li>\r\n</ul>\r\n<p>You can edit your code and click Run as many times as you like — being wrong is normal and the fastest way to learn.</p>\r\n\r\n<h4>3. Your first command: <code>print()</code></h4>\r\n<p>A program runs its instructions <b>top to bottom, one at a time</b>. The first and most-used one is <code>print()</code> — it tells the computer to <b>show (display) something on screen</b>.</p>\r\n<pre class=\"run\">print(\"Hello\")\r\nprint(\"I am learning Python\")</pre>\r\n<p>Let's read the line <code>print(\"Hello\")</code> part by part:</p>\r\n<ul>\r\n<li><code>print</code> — the name of the command (show on screen).</li>\r\n<li><code>( )</code> — round parentheses; inside them goes the thing you want to print.</li>\r\n<li><code>\"Hello\"</code> — a piece of <b>text</b>. In programming, text is called a <b>string</b> and <u>must be wrapped in quotes</u> <code>\"...\"</code>. The quotes tell the computer \"this is literal text to print\", not a command.</li>\r\n</ul>\r\n<p>If you forget the quotes — e.g. <code>print(Hello)</code> — the computer errors, because it thinks <code>Hello</code> is the name of some command it doesn't know.</p>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 1.</b> Use <code>print()</code> to print exactly the line <code>Hello Dojo</code>. (Remember the quotes around the text.)</span>\r\n<template class=\"st\"># Type your print command below:\r\n</template>\r\n<template class=\"ts\">assert _OUT_.strip() == \"Hello Dojo\", \"must print exactly: Hello Dojo\"\r\n</template></div>\r\n<p><i>Note: this exercise checks <b>what you print to the screen</b> (see the Output panel). Most later exercises check <b>the value of a variable</b> — we'll learn \"variables\" just below.</i></p>\r\n\r\n<h4>4. Comments with <code>#</code></h4>\r\n<p>Did you notice the line <code># Type your print command below:</code> in the exercise above? That's a <b>comment</b>. Everything after a <code>#</code> on a line is <b>completely ignored</b> by Python — it's a note for <i>humans to read</i>, not an instruction for the machine to run.</p>\r\n<pre># This is a comment — Python doesn't run this line\r\nprint(\"This line does run\")   # a comment can also sit at the end of a line</pre>\r\n<p>Comments explain the code to you (and others) reading it later. In exercises we often leave a <code>#</code> line hinting where you should write.</p>\r\n\r\n<h4>5. Values and data types</h4>\r\n<p>Every piece of data in Python has a <b>type</b>. The four foundational ones you meet first:</p>\r\n<pre>10          # whole number -> int    (no decimal part)\r\n3.14        # decimal      -> float  (has a decimal point)\r\n\"hello\"     # text         -> str    (letters in quotes)\r\nTrue        # true/false   -> bool   (only True or False)</pre>\r\n<p>You can ask the computer \"what type is this?\" with <code>type()</code>:</p>\r\n<pre>print(type(10))       # &lt;class 'int'&gt;\r\nprint(type(3.14))     # &lt;class 'float'&gt;\r\nprint(type(\"hi\"))     # &lt;class 'str'&gt;\r\nprint(type(True))     # &lt;class 'bool'&gt;</pre>\r\n<p>Why do types matter? Because the computer <b>behaves differently</b> per type: <code>3 + 4</code> gives <code>7</code> (adding numbers), but <code>\"3\" + \"4\"</code> gives <code>\"34\"</code> (joining text). Mixing up types is one of the most common beginner bugs.</p>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 2.</b> Create four variables: <code>a</code> = integer 42, <code>b</code> = float 3.5, <code>c</code> = string <code>\"Python\"</code> (capital P), <code>d</code> = boolean <code>True</code>.</span>\r\n<template class=\"st\"># create 4 variables a, b, c, d\r\n</template>\r\n<template class=\"ts\">assert a == 42 and isinstance(a, int)\r\nassert b == 3.5 and isinstance(b, float)\r\nassert c == \"Python\" and isinstance(c, str)\r\nassert d is True\r\n</template></div>\r\n\r\n<h4>6. Variables — named boxes</h4>\r\n<p>A <b>variable</b> is a name attached to a value so you can reuse it later. The <code>=</code> sign means <b>assign</b>: take the value on the right and put it in the named box on the left.</p>\r\n<pre>age = 15\r\nname = \"Minh\"\r\nprint(name, \"is\", age, \"years old\")   # Minh is 15 years old</pre>\r\n<p>Variables can be <b>reassigned</b> — the new value replaces the old:</p>\r\n<pre>score = 5\r\nscore = score + 3     # take old score (5), add 3, store back into score -> 8\r\nprint(score)           # 8</pre>\r\n<h4>Naming rules</h4>\r\n<ul>\r\n<li>Only letters, digits and underscore <code>_</code>; must <b>not</b> start with a digit.</li>\r\n<li>No spaces. Use <code>snake_case</code> to join words: <code>quantity</code>, <code>user_name</code>.</li>\r\n<li>Case-sensitive: <code>age</code> and <code>Age</code> are two different variables.</li>\r\n<li>Use <b>meaningful</b> names: <code>price</code> beats <code>x</code>.</li>\r\n</ul>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 3.</b> Create <code>quantity</code> = 4 and <code>unit_price</code> = 25000. Create <code>subtotal</code> as their product (write the multiplication <code>*</code>, don't hard-code the result).</span>\r\n<template class=\"st\">quantity = 4\r\nunit_price = 25000\r\n# create subtotal = quantity times unit_price\r\n</template>\r\n<template class=\"ts\">assert subtotal == 100000\r\n</template></div>\r\n\r\n<h4>7. <code>print()</code> in more detail</h4>\r\n<p><code>print()</code> can print several things at once, separated by commas — the computer inserts a space between them:</p>\r\n<pre>name = \"Minh\"\r\nprint(\"Hello,\", name)     # Hello, Minh</pre>\r\n<p>You can change the separator with <code>sep</code>, and the line-ending character with <code>end</code>:</p>\r\n<pre>print(\"2024\", \"09\", \"18\", sep=\"-\")   # 2024-09-18\r\nprint(\"Loading\", end=\"...\")           # no newline, then prints \"...\"</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 4.</b> Given <code>year = 2026</code>, <code>month = 9</code>, <code>day = 18</code>, use <code>print()</code> with <code>sep</code> to print exactly <code>2026/9/18</code>. (Note: these are three <i>number variables</i> — don't put them in quotes.)</span>\r\n<template class=\"st\">year = 2026\r\nmonth = 9\r\nday = 18\r\n# print 2026/9/18 using print(..., sep=...)\r\n</template>\r\n<template class=\"ts\">assert _OUT_.strip() == \"2026/9/18\", \"must print 2026/9/18\"\r\n</template></div>\r\n\r\n<h4>8. Reading input from a user — <code>input()</code></h4>\r\n<p>The <code>input()</code> function pauses the program, waits for the user to type, then returns what they typed. <b>Critically important:</b> <code>input()</code> <u>always returns a string (str)</u>, even when the person types a number.</p>\r\n<pre>name = input(\"What's your name? \")\r\nprint(\"Hi\", name)\r\n\r\nage_str = input(\"Your age? \")   # e.g. typing \"15\" -> age_str = \"15\" (a string!)\r\nprint(type(age_str))            # &lt;class 'str'&gt;</pre>\r\n<p>Because the result is a string, to do math you must <b>convert</b> it to a number first.</p>\r\n\r\n<h4>9. Type conversion</h4>\r\n<pre>int(\"15\")     # 15   (string -> integer)\r\nfloat(\"3.5\")  # 3.5  (string -> float)\r\nstr(15)       # \"15\" (number -> string)</pre>\r\n<p>This is why the line below is a classic logic bug: it joins two strings instead of adding two numbers.</p>\r\n<pre>a = input(\"Number a: \")   # \"7\"\r\nb = input(\"Number b: \")   # \"3\"\r\nprint(a + b)              # \"73\"  (WRONG! string join)\r\nprint(int(a) + int(b))    # 10    (RIGHT, convert to int first)</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 5.</b> Given two strings <code>a = \"7\"</code> and <code>b = \"3\"</code> (simulating <code>input()</code> results), create <code>total</code> = their <i>numeric</i> sum (result must be <code>10</code>, not <code>\"73\"</code>).</span>\r\n<template class=\"st\">a = \"7\"\r\nb = \"3\"\r\n# create total = numeric sum of a and b\r\n</template>\r\n<template class=\"ts\">assert total == 10, \"remember to int() before adding\"\r\n</template></div>\r\n\r\n<h4>10. Arithmetic operators</h4>\r\n<pre>7 + 3     # 10   add\r\n7 - 3     # 4    subtract\r\n7 * 3     # 21   multiply\r\n7 / 2     # 3.5  divide (ALWAYS a float)\r\n7 // 2    # 3    floor division (whole part)\r\n7 % 2     # 1    remainder (modulo)\r\n2 ** 10   # 1024 power (2 to the 10)</pre>\r\n<p><code>//</code> and <code>%</code> are very handy: <code>//</code> tells you \"how many whole times it divides\", <code>%</code> tells you \"how much is left over\". E.g. turn 100 minutes into hours:minutes → <code>100 // 60 = 1</code> hour, <code>100 % 60 = 40</code> minutes.</p>\r\n<p>Precedence follows math: <code>**</code> first, then <code>* / // %</code>, then <code>+ -</code>. Use parentheses <code>( )</code> to force order:</p>\r\n<pre>2 + 3 * 4       # 14  (multiply first)\r\n(2 + 3) * 4     # 20  (parentheses first)</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 6.</b> Given <code>total_minutes = 100</code>, compute <code>hours</code> = whole hours and <code>minutes</code> = leftover minutes (use <code>//</code> and <code>%</code> with 60).</span>\r\n<template class=\"st\">total_minutes = 100\r\n# create hours and minutes\r\n</template>\r\n<template class=\"ts\">assert hours == 1, \"use // 60\"\r\nassert minutes == 40, \"use % 60\"\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 7.</b> Compute the average of three numbers <code>8</code>, <code>9</code>, <code>10</code> into <code>average</code>. Watch precedence — use parentheses!</span>\r\n<template class=\"st\"># create average = average of 8, 9, 10\r\n</template>\r\n<template class=\"ts\">assert average == 9, \"use parentheses: (8+9+10)/3\"\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 8.</b> Given <code>age = 20</code> (a number), build the string <code>label = \"Age: 20\"</code> by joining <code>\"Age: \"</code> with <code>age</code> — remember to convert the number with <code>str()</code>.</span>\r\n<template class=\"st\">age = 20\r\n# create label = \"Age: 20\" by string concatenation\r\n</template>\r\n<template class=\"ts\">assert label == \"Age: 20\", \"use 'Age: ' + str(age)\"\r\n</template></div>\r\n\r\n<h4>11. Augmented assignment (+=, -=, *=)</h4>\r\n<p>When you update a variable using itself, Python has a shorthand — used constantly for counting and accumulating:</p>\r\n<pre class=\"run\">score = 5\r\nscore += 3     # same as: score = score + 3  -> 8\r\nscore *= 2     # same as: score = score * 2  -> 16\r\nscore -= 1     # -> 15\r\nprint(score)   # 15</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 9.</b> Given <code>diem = 10</code>, use augmented assignment: add 5 (<code>+= 5</code>), then double it (<code>*= 2</code>). Final value stays in <code>diem</code>.</span>\r\n<template class=\"st\">diem = 10\r\n# use += and *= to reach 30\r\n</template>\r\n<template class=\"ts\">assert diem == 30, \"10 + 5 = 15, then *2 = 30\"\r\n</template></div>\r\n\r\n<h4>12. Common beginner mistakes</h4>\r\n<ul>\r\n<li><b>Missing quotes:</b> <code>print(hello)</code> → error. Text must be <code>\"hello\"</code>.</li>\r\n<li><b>Confusing <code>=</code> and <code>==</code>:</b> <code>=</code> assigns, <code>==</code> compares (lesson 3).</li>\r\n<li><b>Adding a string to a number:</b> <code>\"Age: \" + 20</code> → error. Use <code>\"Age: \" + str(20)</code>.</li>\r\n<li><b>Forgetting to convert after <code>input()</code>:</b> the result is a string, you can't do math on it directly.</li>\r\n</ul>\r\n\r\n<div class=\"recap\">Recap of lesson 1: programming is writing instructions for a machine · Python is a beginner-friendly language · <code>print()</code> shows output, text goes in quotes · <code>#</code> is a comment (ignored) · data has a <b>type</b> (int/float/str/bool) · a variable is a named box, <code>=</code> assigns · <code>input()</code> always returns a string → remember to convert with <code>int()/float()</code> · operators <code>+ - * / // % **</code> and precedence · <code>+= -= *=</code> shorthand. Next: mastering strings and f-strings.</div>\r\n\r\n<div class=\"ex stretch\" data-kind=\"py\"><span class=\"exq\"><b>🔥 Stretch.</b> Given <code>price_str = \"120000\"</code> and <code>qty_str = \"3\"</code> (simulating <code>input()</code>), compute the total with <b>10% VAT</b> added, rounded to a whole number, into <code>total</code>. (Hint: convert to numbers, multiply, then times <code>1.1</code>, use <code>round()</code>.)</span>\r\n<template class=\"st\">price_str = \"120000\"\r\nqty_str = \"3\"\r\n# create total = amount + 10% VAT, rounded to an integer\r\n</template>\r\n<template class=\"ts\">assert total == 396000, \"120000 * 3 = 360000, plus 10% = 396000\"\r\n</template></div>\r\n\r\n<h4>🏠 Homework</h4>\r\n<p>Do this at home, outside the 2-hour class. Four questions; the last is a stretch.</p>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Homework 1.</b> Given <code>vnd_str = \"260000\"</code> (a string), convert to USD at a rate of 26000: create <code>usd</code> (a float) = the VND amount divided by 26000, then create <code>message</code> with an f-string in the exact form <code>\"260000 VND = 10.0 USD\"</code>.</span>\r\n<template class=\"st\">vnd_str = \"260000\"\r\nrate = 26000\r\n# create usd and message\r\n</template>\r\n<template class=\"ts\">assert usd == 10.0, \"int(vnd_str) then divide by rate\"\r\nassert message == \"260000 VND = 10.0 USD\", 'use f\"{vnd_str} VND = {usd} USD\"'\r\n</template></div>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Homework 2.</b> Given <code>celsius = 25</code> (a number), convert to Fahrenheit: <code>fahrenheit = celsius * 9 / 5 + 32</code> → <code>77.0</code>.</span>\r\n<template class=\"st\">celsius = 25\r\n# create fahrenheit\r\n</template>\r\n<template class=\"ts\">assert fahrenheit == 77.0\r\n</template></div>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Homework 3.</b> For a rectangle with <code>width = 4</code>, <code>height = 5</code>, create <code>area</code> = the area (<code>width * height</code>) and <code>perimeter</code> = the perimeter (<code>2 * (width + height)</code>).</span>\r\n<template class=\"st\">width = 4\r\nheight = 5\r\n# create area and perimeter\r\n</template>\r\n<template class=\"ts\">assert area == 20\r\nassert perimeter == 18\r\n</template></div>\r\n<div class=\"ex homework stretch\" data-kind=\"py\"><span class=\"exq\"><b>🔥 Homework 4 (stretch).</b> Given <code>total_seconds = 3661</code>, split it into hours/minutes/seconds, then create a string <code>time_str</code> in the form <code>\"01:01:01\"</code> (each part 2 digits). Hint: <code>// 3600</code>, <code>% 3600 // 60</code>, <code>% 60</code>, and f-string <code>{h:02d}</code>.</span>\r\n<template class=\"st\">total_seconds = 3661\r\n# create time_str in \"HH:MM:SS\" form\r\n</template>\r\n<template class=\"ts\">assert time_str == \"01:01:01\"\r\n</template></div>"}},{"t":{"vi":"Chuỗi & f-string","en":"Strings & f-strings"},"enc":"dW1S3XpeFFRzgSJi+2vp7iBbB9TP0TwHwINcAwiAWHsxx57kwS1O8K3ZSn09W8ZZJhif7BIwd0TTQ4mJ273fKz9BCte2cayhWCYTpbeBOmM+p436CuvIB7/gBIMj+N7TR3BZ5Er8iK5/uQs0DZtegumXFio9O1Oxi0UUbgzRnX9tAwF6eaForzbGzdXOOhVAOgIX+oyrTTi9eECifPCfhS6vBpQFb1++KHVf1PcGmReswlyWeCBe+JXHUK4QLs7lefxlh8E+1GTDGXgjeIfap97rKwp+H83WMHHvqof4xM1xXIyZyc59yu+CHopH+xjO+2cLnBqAaNyYruSv9qGUYz6Jm8eVuvqIc2Men+2PK5P7jYvncAUxLFWLcxNZTfljKrgLznYGyBM5xNVtMrNNtI1kxS0F8ued0JccvX3fMTENLdDE+OEbVfpk2/D/1GcD1snI/tLKjDJDAVco8jYKEm4qNBM2gUHQcnBbdRK4CAZ0gO0TJE5Csqthsrjq1aqLrRbmGbL5ZG41aEwnqpwhHKlNL5iJ145tzjoMMbSVTjN9vPoptRL6OdpNn8RGEVkOgRh1sT6gj06oKMFxll8bJGek4UMY0Ptbd3KetDlpZsX4oWgi2biVlqFuhfFhE1JcqBJticxEBLMRgsNKQ335qeYL1tFBLbRZDJs4xY6ttPSMtz1NN5RVoGyQIXn5KyL4F3CgOghm9/C8/9qkxLgwrMQmnwqrjHkyPCELvtdPOu23Im/Ma2/wr2vxx+wYTCl9KJSxS7KAtTKxoDmlOiAPvAHO6ztCcZwnRTTZySc5xIg7znC0nhXqePDeS93sHRdCYADvlr0iql07UDCYOKQsh9dtMCk9lW4v3Dtv6nw3Fgw/Nt9dliWZKMgzFP54ndekH7DigPd+DaodEiJ6md7jvJal0aCUJtfEP7TXaKGc+w0g5hlgZ3EMBfrSoGm/HKLBiHpvPoZfZ4X/6HQg5jMXE2uuVGQm2OhLJx7m3XkEAMCqSzISIBrZMBSgrzV5WkYXG36yRIyAnOYPV8Ri9hjufh
