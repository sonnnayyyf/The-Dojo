.</b> Cho <code>tasks = [{\"name\": \"Buy milk\", \"done\": True}, {\"name\": \"Call Anna\", \"done\": False}]</code>, đánh dấu công việc tên <code>\"Call Anna\"</code> là đã xong (<code>done = True</code>). Bản ghi thứ hai phải thành <code>{'name': 'Call Anna', 'done': True}</code>.</span>\r\n<template class=\"st\">tasks = [{\"name\": \"Buy milk\", \"done\": True}, {\"name\": \"Call Anna\", \"done\": False}]\r\n# find \"Call Anna\" and mark it done\r\n</template>\r\n<template class=\"ts\">assert tasks == [{\"name\": \"Buy milk\", \"done\": True}, {\"name\": \"Call Anna\", \"done\": True}]\r\n</template></div>\r\n\r\n<h4>6. Dữ liệu lồng nhau</h4>\r\n<p>Bản ghi có thể chứa list, và list đó có thể chứa thêm bản ghi. Bạn chỉ việc đi vào từng bước. Ở đây một đơn hàng chứa một list các bản ghi món hàng.</p>\r\n<pre class=\"run\">order = {\"id\": 1, \"items\": [{\"name\": \"Book\", \"qty\": 2}, {\"name\": \"Pen\", \"qty\": 5}]}\r\ntotal_qty = 0\r\nfor item in order[\"items\"]:\r\n    total_qty += item[\"qty\"]\r\nprint(total_qty)   # 7</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 9.</b> Cho <code>order = {\"id\": 1, \"items\": [{\"name\": \"Book\", \"qty\": 2}, {\"name\": \"Pen\", \"qty\": 5}]}</code>, cộng số lượng của tất cả món vào <code>total_qty</code>. Kết quả <code>7</code>.</span>\r\n<template class=\"st\">order = {\"id\": 1, \"items\": [{\"name\": \"Book\", \"qty\": 2}, {\"name\": \"Pen\", \"qty\": 5}]}\r\ntotal_qty = 0\r\n# sum the qty of every item\r\n</template>\r\n<template class=\"ts\">assert total_qty == 7\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 10.</b> Cho <code>people = [{\"name\": \"A\", \"age\": 20}, {\"name\": \"B\", \"age\": 15}, {\"name\": \"C\", \"age\": 30}]</code>, tính tuổi <b>trung bình</b> vào <code>avg</code>, làm tròn tới 1 chữ số thập phân. <code>(20 + 15 + 30) / 3 = 21.7</code>.</span>\r\n<template class=\"st\">people = [{\"name\": \"A\", \"age\": 20}, {\"name\": \"B\", \"age\": 15}, {\"name\": \"C\", \"age\": 30}]\r\navg = 0\r\n# compute the average age, rounded to 1 decimal\r\n</template>\r\n<template class=\"ts\">assert avg == 21.7\r\n</template></div>\r\n<div class=\"ex stretch\" data-kind=\"py\"><span class=\"exq\"><b>🔥 Nâng cao (tóm tắt công việc).</b> Cho <code>tasks = [{\"name\": \"a\", \"done\": True}, {\"name\": \"b\", \"done\": False}, {\"name\": \"c\", \"done\": True}]</code>, dựng dictionary <code>summary</code> đếm các bản ghi → <code>{\"total\": 3, \"done\": 2, \"pending\": 1}</code>.</span>\r\n<template class=\"st\">tasks = [{\"name\": \"a\", \"done\": True}, {\"name\": \"b\", \"done\": False}, {\"name\": \"c\", \"done\": True}]\r\nsummary = {}\r\n# count total, done and pending\r\n</template>\r\n<template class=\"ts\">assert summary == {\"total\": 3, \"done\": 2, \"pending\": 1}\r\n</template></div>\r\n\r\n<div class=\"recap\">Tóm tắt bài 12: một <b>list các dictionary</b> là một bảng bản ghi — hình dáng của dữ liệu thực tế · đi vào bằng <code>data[i][\"field\"]</code> · duyệt các bản ghi để liệt kê, lọc, cộng dồn, đếm và tìm cực đại · thêm bản ghi bằng <code>append({...})</code> · cập nhật bằng cách tìm bản ghi rồi đổi một trường · dữ liệu lồng nhau (một dict chứa list các dict) chỉ là đi sâu thêm một tầng. Bài sau: <b>hàm</b> — đóng gói các thao tác này để đặt tên và tái sử dụng.</div>\r\n\r\n<h4>🏠 Bài tập về nhà</h4>\r\n<p>Bốn bài tập được chấm điểm — làm ngay tại đây trước bài kế tiếp.</p>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Bài về nhà 1.</b> Cho <code>cart = [{\"name\": \"Book\", \"price\": 100}, {\"name\": \"Pen\", \"price\": 20}, {\"name\": \"Cup\", \"price\": 50}]</code>, cộng tất cả giá vào <code>total</code>. Kết quả <code>170</code>.</span>\r\n<template class=\"st\">cart = [{\"name\": \"Book\", \"price\": 100}, {\"name\": \"Pen\", \"price\": 20}, {\"name\": \"Cup\", \"price\": 50}]\r\ntotal = 0\r\n# sum every price\r\n</template>\r\n<template class=\"ts\">assert total == 170\r\n</template></div>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Bài về nhà 2.</b> Cho <code>products = [{\"name\": \"Book\", \"stock\": 3}, {\"name\": \"Pen\", \"stock\": 0}, {\"name\": \"Cup\", \"stock\": 5}]</code>, dựng <code>in_stock</code> = tên các sản phẩm có <code>stock &gt; 0</code> → <code>['Book', 'Cup']</code>.</span>\r\n<template class=\"st\">products = [{\"name\": \"Book\", \"stock\": 3}, {\"name\": \"Pen\", \"stock\": 0}, {\"name\": \"Cup\", \"stock\": 5}]\r\nin_stock = []\r\n# collect names of products still in stock\r\n</template>\r\n<template class=\"ts\">assert in_stock == [\"Book\", \"Cup\"]\r\n</template></div>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Bài về nhà 3.</b> Cho <code>cart = [{\"name\": \"Book\", \"price\": 100}, {\"name\": \"Pen\", \"price\": 20}, {\"name\": \"Cup\", \"price\": 50}]</code>, tìm <b>tên</b> món <b>rẻ nhất</b> vào <code>cheapest</code>. Kết quả <code>\"Pen\"</code>.</span>\r\n<template class=\"st\">cart = [{\"name\": \"Book\", \"price\": 100}, {\"name\": \"Pen\", \"price\": 20}, {\"name\": \"Cup\", \"price\": 50}]\r\ncheapest = \"\"\r\n# find the name of the cheapest item\r\n</template>\r\n<template class=\"ts\">assert cheapest == \"Pen\"\r\n</template></div>\r\n<div class=\"ex homework stretch\" data-kind=\"py\"><span class=\"exq\"><b>🔥 Bài về nhà 4 (nâng cao).</b> Cho <code>tasks = [{\"name\": \"a\", \"done\": True}, {\"name\": \"b\", \"done\": False}, {\"name\": \"c\", \"done\": False}]</code>, dựng <code>pending_names</code> = tên các công việc chưa xong → <code>['b', 'c']</code>.</span>\r\n<template class=\"st\">tasks = [{\"name\": \"a\", \"done\": True}, {\"name\": \"b\", \"done\": False}, {\"name\": \"c\", \"done\": False}]\r\npending_names = []\r\n# collect the names of tasks that are not done\r\n</template>\r\n<template class=\"ts\">assert pending_names == [\"b\", \"c\"]\r\n</template></div>","en":"<h3>Lesson 12 — Lists of dictionaries: real-world data</h3>\r\n<p>A single dictionary describes <b>one</b> thing: one person, one product, one task. But real programs deal with <b>many</b> things — a list of contacts, a cart full of products, a whole to-do list. The natural shape for that is a <b>list of dictionaries</b>: an ordered collection where every item is a record with the same fields. This is, quite literally, a table — rows and columns — and it's how almost all real data arrives, including JSON from the web.</p>\r\n<p>Once you can walk a list of dictionaries, you can do the things every app and every data job needs: list records, filter them (\"only adults\", \"only unfinished tasks\"), add them up (\"total price\"), and find extremes (\"the most expensive item\"). It's the same loop skills you already have, now reaching one level deeper.</p>\r\n<p>In this lesson you'll build exactly those moves, and finish by upgrading our task manager: instead of tagging strings with <code>\"[x] \"</code>, each task becomes a tidy dictionary with a <code>name</code> and a <code>done</code> field.</p>\r\n\r\n<h4>1. A list of records is a table</h4>\r\n<p>To reach a field you drill in twice: first pick the record by its position, then the field by its key.</p>\r\n<pre class=\"run\">products = [\r\n    {\"name\": \"Book\", \"price\": 100},\r\n    {\"name\": \"Pen\", \"price\": 20},\r\n]\r\nprint(products[0])            # {'name': 'Book', 'price': 100}  (a whole record)\r\nprint(products[0][\"name\"])    # Book                            (one field)\r\nprint(products[1][\"price\"])   # 20</pre>\r\n<figure class=\"diagram\">\r\n<svg viewBox=\"0 0 340 170\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11\">\r\n  <text x=\"170\" y=\"16\" text-anchor=\"middle\" fill=\"#8FA0BC\">products — a list of dictionaries (a table)</text>\r\n  <rect x=\"16\" y=\"28\" width=\"308\" height=\"120\" rx=\"10\" fill=\"none\" stroke=\"#22304C\" stroke-dasharray=\"4 3\"/>\r\n  <g stroke=\"#22304C\">\r\n    <rect x=\"34\" y=\"46\" width=\"130\" height=\"84\" rx=\"8\" fill=\"#121C30\"/>\r\n    <rect x=\"188\" y=\"46\" width=\"130\" height=\"84\" rx=\"8\" fill=\"#121C30\"/>\r\n  </g>\r\n  <g fill=\"#7FD1C0\" font-size=\"10\"><text x=\"42\" y=\"42\">[0]</text><text x=\"196\" y=\"42\">[1]</text></g>\r\n  <g font-size=\"11\">\r\n    <text x=\"48\" y=\"74\" fill=\"#7FD1C0\">\"name\"</text><text x=\"150\" y=\"74\" fill=\"#E8E4D8\" text-anchor=\"end\">\"Book\"</text>\r\n    <text x=\"48\" y=\"104\" fill=\"#7FD1C0\">\"price\"</text><text x=\"150\" y=\"104\" fill=\"#E8E4D8\" text-anchor=\"end\">100</text>\r\n    <text x=\"202\" y=\"74\" fill=\"#7FD1C0\">\"name\"</text><text x=\"304\" y=\"74\" fill=\"#E8E4D8\" text-anchor=\"end\">\"Pen\"</text>\r\n    <text x=\"202\" y=\"104\" fill=\"#7FD1C0\">\"price\"</text><text x=\"304\" y=\"104\" fill=\"#E8E4D8\" text-anchor=\"end\">20</text>\r\n  </g>\r\n</svg>\r\n<figcaption>Each item in the list is a record (a dictionary). <code>products[1][\"price\"]</code> = go to record 1, then read its <code>price</code> → <code>20</code>.</figcaption>\r\n</figure>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 1.</b> Given <code>products = [{\"name\": \"Book\", \"price\": 100}, {\"name\": \"Pen\", \"price\": 20}]</code>, read the price of the second product into <code>p</code>. Result <code>20</code>.</span>\r\n<template class=\"st\">products = [{\"name\": \"Book\", \"price\": 100}, {\"name\": \"Pen\", \"price\": 20}]\r\np = 0\r\n# read the second product's price\r\n</template>\r\n<template class=\"ts\">assert p == 20\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 2.</b> Given the same <code>products</code>, build a list <code>names</code> of every product's name → <code>['Book', 'Pen']</code>.</span>\r\n<template class=\"st\">products = [{\"name\": \"Book\", \"price\": 100}, {\"name\": \"Pen\", \"price\": 20}]\r\nnames = []\r\n# collect each product's name\r\n</template>\r\n<template class=\"ts\">assert names == [\"Book\", \"Pen\"]\r\n</template></div>\r\n\r\n<h4>2. Filtering records</h4>\r\n<p>Loop the records and keep the ones that pass a test. This is how every \"show me only…\" feature works.</p>\r\n<pre class=\"run\">people = [\r\n    {\"name\": \"A\", \"age\": 20},\r\n    {\"name\": \"B\", \"age\": 15},\r\n    {\"name\": \"C\", \"age\": 30},\r\n]\r\nadults = []\r\nfor person in people:\r\n    if person[\"age\"] >= 18:\r\n        adults.append(person[\"name\"])\r\nprint(adults)   # ['A', 'C']</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 3.</b> Given <code>people = [{\"name\": \"A\", \"age\": 20}, {\"name\": \"B\", \"age\": 15}, {\"name\": \"C\", \"age\": 30}]</code>, build <code>adults</code> = the names of people aged <b>18 or older</b> → <code>['A', 'C']</code>.</span>\r\n<template class=\"st\">people = [{\"name\": \"A\", \"age\": 20}, {\"name\": \"B\", \"age\": 15}, {\"name\": \"C\", \"age\": 30}]\r\nadults = []\r\n# collect names of people 18+\r\n</template>\r\n<template class=\"ts\">assert adults == [\"A\", \"C\"]\r\n</template></div>\r\n\r\n<h4>3. Adding up a field</h4>\r\n<p>To total a column, loop the records and add one field each time.</p>\r\n<pre class=\"run\">cart = [\r\n    {\"name\": \"Book\", \"price\": 100},\r\n    {\"name\": \"Pen\", \"price\": 20},\r\n    {\"name\": \"Cup\", \"price\": 50},\r\n]\r\ntotal = 0\r\nfor item in cart:\r\n    total += item[\"price\"]\r\nprint(total)   # 170</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 4.</b> Given <code>cart = [{\"name\": \"Book\", \"price\": 100}, {\"name\": \"Pen\", \"price\": 20}, {\"name\": \"Cup\", \"price\": 50}]</code>, add up all the prices into <code>total</code>. Result <code>170</code>.</span>\r\n<template class=\"st\">cart = [{\"name\": \"Book\", \"price\": 100}, {\"name\": \"Pen\", \"price\": 20}, {\"name\": \"Cup\", \"price\": 50}]\r\ntotal = 0\r\n# sum every price\r\n</template>\r\n<template class=\"ts\">assert total == 170\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 5.</b> Given the same <code>cart</code>, count how many items cost <b>more than 40</b> into <code>pricey</code>. Result <code>2</code>.</span>\r\n<template class=\"st\">cart = [{\"name\": \"Book\", \"price\": 100}, {\"name\": \"Pen\", \"price\": 20}, {\"name\": \"Cup\", \"price\": 50}]\r\npricey = 0\r\n# count items priced over 40\r\n</template>\r\n<template class=\"ts\">assert pricey == 2\r\n</template></div>\r\n\r\n<h4>4. Finding the extreme record</h4>\r\n<p>To find the biggest (or smallest), keep a \"best so far\" and update it whenever you see something better. Start it at the first record.</p>\r\n<pre class=\"run\">cart = [{\"name\": \"Book\", \"price\": 100}, {\"name\": \"Pen\", \"price\": 20}, {\"name\": \"Cup\", \"price\": 50}]\r\nbest = cart[0]\r\nfor item in cart:\r\n    if item[\"price\"] > best[\"price\"]:\r\n        best = item\r\nprint(best[\"name\"])   # Book</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 6.</b> Given <code>cart = [{\"name\": \"Book\", \"price\": 100}, {\"name\": \"Pen\", \"price\": 20}, {\"name\": \"Cup\", \"price\": 50}]</code>, find the <b>name</b> of the most expensive item into <code>top_name</code>. Result <code>\"Book\"</code>.</span>\r\n<template class=\"st\">cart = [{\"name\": \"Book\", \"price\": 100}, {\"name\": \"Pen\", \"price\": 20}, {\"name\": \"Cup\", \"price\": 50}]\r\ntop_name = \"\"\r\n# find the name of the priciest item\r\n</template>\r\n<template class=\"ts\">assert top_name == \"Book\"\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 7.</b> Given <code>cart = [{\"name\": \"Book\", \"price\": 100}]</code>, add a new record <code>{\"name\": \"Bag\", \"price\": 80}</code> to the end. Result <code>[{'name': 'Book', 'price': 100}, {'name': 'Bag', 'price': 80}]</code>.</span>\r\n<template class=\"st\">cart = [{\"name\": \"Book\", \"price\": 100}]\r\n# append the new product record\r\n</template>\r\n<template class=\"ts\">assert cart == [{\"name\": \"Book\", \"price\": 100}, {\"name\": \"Bag\", \"price\": 80}]\r\n</template></div>\r\n\r\n<h4>5. Updating a record inside the list</h4>\r\n<p>Loop until you find the record you want, then change one of its fields. Editing the record edits it right there in the list.</p>\r\n<pre class=\"run\">tasks = [\r\n    {\"name\": \"Buy milk\", \"done\": True},\r\n    {\"name\": \"Call Anna\", \"done\": False},\r\n]\r\nfor task in tasks:\r\n    if task[\"name\"] == \"Call Anna\":\r\n        task[\"done\"] = True\r\nprint(tasks[1])   # {'name': 'Call Anna', 'done': True}</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 8.</b> Given <code>tasks = [{\"name\": \"Buy milk\", \"done\": True}, {\"name\": \"Call Anna\", \"done\": False}]</code>, mark the task named <code>\"Call Anna\"</code> as done (<code>done = True</code>). The second record should become <code>{'name': 'Call Anna', 'done': True}</code>.</span>\r\n<template class=\"st\">tasks = [{\"name\": \"Buy milk\", \"done\": True}, {\"name\": \"Call Anna\", \"done\": False}]\r\n# find \"Call Anna\" and mark it done\r\n</template>\r\n<template class=\"ts\">assert tasks == [{\"name\": \"Buy milk\", \"done\": True}, {\"name\": \"Call Anna\", \"done\": True}]\r\n</template></div>\r\n\r\n<h4>6. Nested data</h4>\r\n<p>Records can hold lists, and those lists can hold more records. You just drill in step by step. Here an order contains a list of item records.</p>\r\n<pre class=\"run\">order = {\"id\": 1, \"items\": [{\"name\": \"Book\", \"qty\": 2}, {\"name\": \"Pen\", \"qty\": 5}]}\r\ntotal_qty = 0\r\nfor item in order[\"items\"]:\r\n    total_qty += item[\"qty\"]\r\nprint(total_qty)   # 7</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 9.</b> Given <code>order = {\"id\": 1, \"items\": [{\"name\": \"Book\", \"qty\": 2}, {\"name\": \"Pen\", \"qty\": 5}]}</code>, add up the quantities of all items into <code>total_qty</code>. Result <code>7</code>.</span>\r\n<template class=\"st\">order = {\"id\": 1, \"items\": [{\"name\": \"Book\", \"qty\": 2}, {\"name\": \"Pen\", \"qty\": 5}]}\r\ntotal_qty = 0\r\n# sum the qty of every item\r\n</template>\r\n<template class=\"ts\">assert total_qty == 7\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 10.</b> Given <code>people = [{\"name\": \"A\", \"age\": 20}, {\"name\": \"B\", \"age\": 15}, {\"name\": \"C\", \"age\": 30}]</code>, compute the <b>average</b> age into <code>avg</code>, rounded to 1 decimal place. <code>(20 + 15 + 30) / 3 = 21.7</code>.</span>\r\n<template class=\"st\">people = [{\"name\": \"A\", \"age\": 20}, {\"name\": \"B\", \"age\": 15}, {\"name\": \"C\", \"age\": 30}]\r\navg = 0\r\n# compute the average age, rounded to 1 decimal\r\n</template>\r\n<template class=\"ts\">assert avg == 21.7\r\n</template></div>\r\n<div class=\"ex stretch\" data-kind=\"py\"><span class=\"exq\"><b>🔥 Stretch (task summary).</b> Given <code>tasks = [{\"name\": \"a\", \"done\": True}, {\"name\": \"b\", \"done\": False}, {\"name\": \"c\", \"done\": True}]</code>, build a <code>summary</code> dictionary counting the records → <code>{\"total\": 3, \"done\": 2, \"pending\": 1}</code>.</span>\r\n<template class=\"st\">tasks = [{\"name\": \"a\", \"done\": True}, {\"name\": \"b\", \"done\": False}, {\"name\": \"c\", \"done\": True}]\r\nsummary = {}\r\n# count total, done and pending\r\n</template>\r\n<template class=\"ts\">assert summary == {\"total\": 3, \"done\": 2, \"pending\": 1}\r\n</template></div>\r\n\r\n<div class=\"recap\">Recap of lesson 12: a <b>list of dictionaries</b> is a table of records — the shape of real-world data · drill in with <code>data[i][\"field\"]</code> · loop the records to list, filter, total, count and find the max · add a record with <code>append({...})</code> · update by finding the record and changing a field · nested data (a dict holding a list of dicts) is just drilling one more level. Next: <b>functions</b> — package these operations so you can name and reuse them.</div>\r\n\r\n<h4>🏠 Homework</h4>\r\n<p>Four graded exercises — do them right here before the next lesson.</p>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Homework 1.</b> Given <code>cart = [{\"name\": \"Book\", \"price\": 100}, {\"name\": \"Pen\", \"price\": 20}, {\"name\": \"Cup\", \"price\": 50}]</code>, add up all the prices into <code>total</code>. Result <code>170</code>.</span>\r\n<template class=\"st\">cart = [{\"name\": \"Book\", \"price\": 100}, {\"name\": \"Pen\", \"price\": 20}, {\"name\": \"Cup\", \"price\": 50}]\r\ntotal = 0\r\n# sum every price\r\n</template>\r\n<template class=\"ts\">assert total == 170\r\n</template></div>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Homework 2.</b> Given <code>products = [{\"name\": \"Book\", \"stock\": 3}, {\"name\": \"Pen\", \"stock\": 0}, {\"name\": \"Cup\", \"stock\": 5}]</code>, build <code>in_stock</code> = the names of products with <code>stock &gt; 0</code> → <code>['Book', 'Cup']</code>.</span>\r\n<template class=\"st\">products = [{\"name\": \"Book\", \"stock\": 3}, {\"name\": \"Pen\", \"stock\": 0}, {\"name\": \"Cup\", \"stock\": 5}]\r\nin_stock = []\r\n# collect names of products still in stock\r\n</template>\r\n<template class=\"ts\">assert in_stock == [\"Book\", \"Cup\"]\r\n</template></div>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Homework 3.</b> Given <code>cart = [{\"name\": \"Book\", \"price\": 100}, {\"name\": \"Pen\", \"price\": 20}, {\"name\": \"Cup\", \"price\": 50}]</code>, find the <b>name</b> of the <b>cheapest</b> item into <code>cheapest</code>. Result <code>\"Pen\"</code>.</span>\r\n<template class=\"st\">cart = [{\"name\": \"Book\", \"price\": 100}, {\"name\": \"Pen\", \"price\": 20}, {\"name\": \"Cup\", \"price\": 50}]\r\ncheapest = \"\"\r\n# find the name of the cheapest item\r\n</template>\r\n<template class=\"ts\">assert cheapest == \"Pen\"\r\n</template></div>\r\n<div class=\"ex homework stretch\" data-kind=\"py\"><span class=\"exq\"><b>🔥 Homework 4 (stretch).</b> Given <code>tasks = [{\"name\": \"a\", \"done\": True}, {\"name\": \"b\", \"done\": False}, {\"name\": \"c\", \"done\": False}]</code>, build <code>pending_names</code> = the names of the tasks not yet done → <code>['b', 'c']</code>.</span>\r\n<template class=\"st\">tasks = [{\"name\": \"a\", \"done\": True}, {\"name\": \"b\", \"done\": False}, {\"name\": \"c\", \"done\": False}]\r\npending_names = []\r\n# collect the names of tasks that are not done\r\n</template>\r\n<template class=\"ts\">assert pending_names == [\"b\", \"c\"]\r\n</template></div>"}},{"t":{"vi":"Hàm (def)","en":"Functions (def)"},"html":{"vi":"<h3>Bài 13 — Hàm: đặt tên cho một khối code</h3>\r\n<p>Nhìn lại các bài đã học, bạn sẽ thấy vài đoạn logic nhỏ cứ lặp đi lặp lại: kiểm tra một việc đã xong chưa, định dạng một dòng, đếm một thứ gì đó. Chép đoạn logic đó khắp nơi vừa chậm vừa nguy hiểm — sửa lỗi ở một bản mà năm bản kia vẫn sai. Phải có cách viết một đoạn logic <b>một lần</b>, đặt tên cho nó, rồi tái sử dụng. Có đấy: <b>hàm (function)</b>.</p>\r\n<p>Một hàm là một cỗ máy có tên, tái sử dụng được. Bạn <b>định nghĩa</b> nó một lần, rồi <b>gọi</b> nó bằng tên bất cứ khi nào cần — tùy chọn đưa vào <b>đầu vào</b> (đối số) và nhận lại một <b>đầu ra</b> (giá trị trả về). Bạn đã gọi hàm suốt cả khóa rồi: <code>print(...)</code>, <code>len(...)</code>, <code>round(...)</code> đều là hàm do người khác viết. Giờ bạn sẽ viết hàm của riêng mình.</p>\r\n<p>Đây là bước ngoặt. Hàm là cách chương trình thật giữ được gọn gàng: thay vì một bức tường code khổng lồ, bạn xây những mảnh nhỏ có tên, mỗi mảnh làm một việc — dễ đọc, dễ kiểm tra, dễ tái dùng. Nắm được điều này thì mọi thứ về sau đều nhẹ hơn.</p>\r\n\r\n<h4>1. Định nghĩa và gọi một hàm</h4>\r\n<p>Bạn định nghĩa một hàm bằng <code>def</code>, một cái tên, dấu ngoặc đơn, và dấu hai chấm. Các dòng thụt vào bên dưới là <b>thân hàm</b> — chúng không chạy cho tới khi bạn <b>gọi</b> hàm bằng cách viết tên nó kèm <code>()</code>.</p>\r\n<pre class=\"run\">def say_hello():\r\n    print(\"Hello!\")\r\n    print(\"Welcome to The Dojo.\")\r\n\r\nsay_hello()      # gọi nó — giờ thân hàm mới chạy\r\nsay_hello()      # gọi lại — tái sử dụng!</pre>\r\n<p>Định nghĩa một hàm <b>không</b> chạy nó — chỉ dạy Python biết hàm làm gì. Không có gì xảy ra cho tới khi bạn gọi. Gọi hai lần thì thân hàm chạy hai lần.</p>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 1.</b> Định nghĩa một hàm <code>greet</code> <b>trả về</b> chuỗi <code>\"Hello!\"</code>. (Ta sẽ kiểm tra bằng cách gọi <code>greet()</code>.)</span>\r\n<template class=\"st\">def greet():\r\n    # return the greeting\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert greet() == \"Hello!\"\r\n</template></div>\r\n\r\n<h4>2. Tham số: đưa đầu vào cho hàm</h4>\r\n<p>Một hàm hữu ích hơn nhiều khi nó làm việc được với các giá trị <b>khác nhau</b>. Đặt tên một <b>tham số (parameter)</b> trong ngoặc; khi gọi hàm bạn truyền vào một <b>đối số (argument)</b> để điền vào đó.</p>\r\n<pre class=\"run\">def greet(name):\r\n    print(f\"Hello, {name}!\")\r\n\r\ngreet(\"Anna\")    # Hello, Anna!\r\ngreet(\"Ben\")     # Hello, Ben!</pre>\r\n<figure class=\"diagram\">\r\n<svg viewBox=\"0 0 360 110\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"IBM Plex Mono, monospace\" font-size=\"12\">\r\n  <defs>\r\n    <marker id=\"a13v\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\">\r\n      <path d=\"M0 0 L10 5 L0 10 z\" fill=\"#F5B942\"/>\r\n    </marker>\r\n  </defs>\r\n  <rect x=\"130\" y=\"30\" width=\"100\" height=\"50\" rx=\"10\" fill=\"#121C30\" stroke=\"#22304C\"/>\r\n  <text x=\"180\" y=\"52\" text-anchor=\"middle\" fill=\"#F5B942\">add(a, b)</text>\r\n  <text x=\"180\" y=\"70\" text-anchor=\"middle\" fill=\"#8FA0BC\" font-size=\"10\">cỗ máy</text>\r\n  <text x=\"40\" y=\"49\" text-anchor=\"middle\" fill=\"#7FD1C0\">2, 3</text>\r\n  <text x=\"40\" y=\"66\" text-anchor=\"middle\" fill=\"#8FA0BC\" font-size=\"10\">đối số</text>\r\n  <text x=\"322\" y=\"49\" text-anchor=\"middle\" fill=\"#E8E4D8\">5</text>\r\n  <text x=\"322\" y=\"66\" text-anchor=\"middle\" fill=\"#8FA0BC\" font-size=\"10\">giá trị trả về</text>\r\n  <g stroke=\"#F5B942\" stroke-width=\"1.5\" marker-end=\"url(#a13v)\" fill=\"none\">\r\n    <line x1=\"66\" y1=\"52\" x2=\"126\" y2=\"52\"/>\r\n    <line x1=\"230\" y1=\"52\" x2=\"292\" y2=\"52\"/>\r\n  </g>\r\n</svg>\r\n<figcaption>Một hàm là một cỗ máy: đối số đi <b>vào</b>, thân hàm làm việc, và một giá trị đi <b>ra</b> qua <code>return</code>.</figcaption>\r\n</figure>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 2.</b> Định nghĩa <code>double</code> nhận một số <code>n</code> và trả về <code>n</code> nhân 2. Vậy <code>double(5)</code> là <code>10</code>.</span>\r\n<template class=\"st\">def double(n):\r\n    # return n doubled\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert double(5) == 10\r\nassert double(0) == 0\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 3.</b> Định nghĩa <code>square</code> nhận <code>n</code> và trả về <code>n * n</code>. Vậy <code>square(4)</code> là <code>16</code>.</span>\r\n<template class=\"st\">def square(n):\r\n    # return n squared\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert square(4) == 16\r\nassert square(10) == 100\r\n</template></div>\r\n\r\n<h4>3. return so với print — điều quan trọng nhất</h4>\r\n<p>Đây là chỗ khiến mọi người mới vấp, nên hãy đọc chậm. <code>print</code> <b>hiện</b> một giá trị lên màn hình rồi thôi. <code>return</code> <b>trao giá trị lại</b> cho nơi đã gọi hàm, để nó được lưu và dùng tiếp. Một hàm chỉ in ra thì chẳng cho bạn gì để làm việc.</p>\r\n<pre class=\"run\">def add_print(a, b):\r\n    print(a + b)          # hiện ra, không trả về gì\r\n\r\ndef add_return(a, b):\r\n    return a + b          # trao giá trị lại\r\n\r\nx = add_return(2, 3)\r\nprint(x * 10)             # 50 — ta dùng được giá trị trả về\r\n\r\ny = add_print(2, 3)       # in ra 5...\r\nprint(y)                  # None — không có gì để lưu!</pre>\r\n<p>Nguyên tắc: nếu bạn muốn <b>dùng</b> kết quả của hàm sau đó, hàm phải <code>return</code> nó.</p>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 4.</b> Định nghĩa <code>shout</code> nhận một chuỗi <code>s</code> và <b>trả về</b> nó viết hoa kèm một dấu <code>\"!\"</code>. Vậy <code>shout(\"hi\")</code> là <code>\"HI!\"</code>. (Dùng <code>s.upper()</code>.)</span>\r\n<template class=\"st\">def shout(s):\r\n    # return the shouted string\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert shout(\"hi\") == \"HI!\"\r\nassert shout(\"dojo\") == \"DOJO!\"\r\n</template></div>\r\n\r\n<h4>4. Nhiều tham số</h4>\r\n<p>Một hàm có thể nhận bao nhiêu đầu vào tùy bạn, phân cách bằng dấu phẩy. Các đối số điền vào các tham số theo thứ tự.</p>\r\n<pre class=\"run\">def add(a, b):\r\n    return a + b\r\n\r\ndef total_price(price, qty):\r\n    return price * qty\r\n\r\nprint(add(2, 3))            # 5\r\nprint(total_price(50, 3))   # 150</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 5.</b> Định nghĩa <code>add</code> trả về tổng của <code>a</code> và <code>b</code>. Vậy <code>add(2, 3)</code> là <code>5</code>.</span>\r\n<template class=\"st\">def add(a, b):\r\n    # return the sum\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert add(2, 3) == 5\r\nassert add(-1, 1) == 0\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 6.</b> Định nghĩa <code>total_price</code> nhận <code>price</code> và <code>qty</code> và trả về <code>price * qty</code>. Vậy <code>total_price(50, 3)</code> là <code>150</code>.</span>\r\n<template class=\"st\">def total_price(price, qty):\r\n    # return the total\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert total_price(50, 3) == 150\r\nassert total_price(8000, 0) == 0\r\n</template></div>\r\n\r\n<h4>5. Trả về một quyết định (True/False)</h4>\r\n<p>Một hàm có thể trả về bất cứ thứ gì — kể cả kết quả của một phép so sánh, vốn là một boolean. Đó là cách gọn gàng để đặt tên cho một phép kiểm tra có/không.</p>\r\n<pre class=\"run\">def is_even(n):\r\n    return n % 2 == 0\r\n\r\nprint(is_even(4))    # True\r\nprint(is_even(7))    # False</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 7.</b> Định nghĩa <code>is_even</code> trả về <code>True</code> nếu <code>n</code> chẵn, ngược lại <code>False</code>. Vậy <code>is_even(4)</code> là <code>True</code> và <code>is_even(5)</code> là <code>False</code>.</span>\r\n<template class=\"st\">def is_even(n):\r\n    # return whether n is even\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert is_even(4) == True\r\nassert is_even(5) == False\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 8.</b> Định nghĩa <code>max_of</code> nhận <code>a</code> và <code>b</code> và trả về cái lớn hơn. Vậy <code>max_of(3, 7)</code> là <code>7</code>. (Dùng <code>if</code>.)</span>\r\n<template class=\"st\">def max_of(a, b):\r\n    # return the larger of a and b\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert max_of(3, 7) == 7\r\nassert max_of(10, 2) == 10\r\n</template></div>\r\n\r\n<h4>6. Dùng các hàm cùng nhau</h4>\r\n<p>Sức mạnh thật sự: một khi hàm đã tồn tại, bạn có thể gọi nó trong vòng lặp, trong hàm khác, ở bất cứ đâu. Những mảnh nhỏ ghép lại thành chương trình lớn.</p>\r\n<pre class=\"run\">def greet_name(name):\r\n    return f\"Hello, {name}!\"\r\n\r\nnames = [\"Anna\", \"Ben\"]\r\nfor n in names:\r\n    print(greet_name(n))\r\n# Hello, Anna!\r\n# Hello, Ben!</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 9.</b> Định nghĩa <code>greet_name</code> nhận <code>name</code> và trả về <code>\"Hello, name!\"</code>. Vậy <code>greet_name(\"Anna\")</code> là <code>\"Hello, Anna!\"</code>. (Dùng f-string.)</span>\r\n<template class=\"st\">def greet_name(name):\r\n    # return the greeting with the name\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert greet_name(\"Anna\") == \"Hello, Anna!\"\r\nassert greet_name(\"Ben\") == \"Hello, Ben!\"\r\n</template></div>\r\n<div class=\"ex stretch\" data-kind=\"py\"><span class=\"exq\"><b>🔥 Nâng cao (hàm chấm điểm).</b> Định nghĩa <code>grade</code> nhận một <code>score</code> và trả về một chữ cái: <code>\"A\"</code> nếu 90 trở lên, <code>\"B\"</code> cho 80–89, <code>\"C\"</code> cho 70–79, ngược lại <code>\"F\"</code>. Vậy <code>grade(95)</code> là <code>\"A\"</code> và <code>grade(50)</code> là <code>\"F\"</code>.</span>\r\n<template class=\"st\">def grade(score):\r\n    # return the letter grade\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert grade(95) == \"A\"\r\nassert grade(85) == \"B\"\r\nassert grade(72) == \"C\"\r\nassert grade(50) == \"F\"\r\n</template></div>\r\n\r\n<div class=\"recap\">Tóm tắt bài 13: một <b>hàm</b> là một khối có tên, tái sử dụng được · <b>định nghĩa</b> bằng <code>def name(params):</code>, chạy bằng cách <b>gọi</b> <code>name(args)</code> · <b>tham số</b> là đầu vào, <b>đối số</b> điền vào chúng · <code>return</code> trao giá trị lại để dùng tiếp — <code>print</code> chỉ hiện ra và trả về <code>None</code> · một hàm có thể trả về số, chuỗi, hoặc boolean · gọi hàm trong vòng lặp và trong hàm khác để xây chương trình lớn hơn. Bài sau: hàm chuyên sâu — giá trị mặc định, trả về nhiều thứ, và phạm vi biến.</div>\r\n\r\n<h4>🏠 Bài tập về nhà</h4>\r\n<p>Bốn bài tập được chấm điểm — làm ngay tại đây trước bài kế tiếp.</p>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Bài về nhà 1.</b> Định nghĩa <code>triple</code> nhận <code>n</code> và trả về <code>n * 3</code>. Vậy <code>triple(4)</code> là <code>12</code>.</span>\r\n<template class=\"st\">def triple(n):\r\n    # return n tripled\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert triple(4) == 12\r\nassert triple(0) == 0\r\n</template></div>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Bài về nhà 2.</b> Định nghĩa <code>is_positive</code> trả về <code>True</code> nếu <code>n</code> lớn hơn 0, ngược lại <code>False</code>. Vậy <code>is_positive(3)</code> là <code>True</code> và <code>is_positive(-2)</code> là <code>False</code>.</span>\r\n<template class=\"st\">def is_positive(n):\r\n    # return whether n is positive\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert is_positive(3) == True\r\nassert is_positive(-2) == False\r\nassert is_positive(0) == False\r\n</template></div>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Bài về nhà 3.</b> Định nghĩa <code>initials</code> nhận tên <code>first</code> và <code>last</code> và trả về chữ cái đầu viết hoa kèm dấu chấm. Vậy <code>initials(\"Anna\", \"Bui\")</code> là <code>\"A.B.\"</code>. (Dùng <code>first[0]</code> và <code>.upper()</code>.)</span>\r\n<template class=\"st\">def initials(first, last):\r\n    # return the initials like \"A.B.\"\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert initials(\"Anna\", \"Bui\") == \"A.B.\"\r\nassert initials(\"son\", \"tran\") == \"S.T.\"\r\n</template></div>\r\n<div class=\"ex homework stretch\" data-kind=\"py\"><span class=\"exq\"><b>🔥 Bài về nhà 4 (nâng cao).</b> Định nghĩa <code>count_vowels</code> nhận một <code>word</code> viết thường và trả về số nguyên âm (<code>a e i o u</code>) trong đó. Vậy <code>count_vowels(\"hello\")</code> là <code>2</code>. (Duyệt các chữ; kiểm tra <code>if letter in \"aeiou\"</code>.)</span>\r\n<template class=\"st\">def count_vowels(word):\r\n    # count and return the vowels\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert count_vowels(\"hello\") == 2\r\nassert count_vowels(\"dojo\") == 2\r\nassert count_vowels(\"xyz\") == 0\r\n</template></div>","en":"<h3>Lesson 13 — Functions: naming a block of code</h3>\r\n<p>Look back at your lessons so far and you'll notice the same little routines popping up again and again: check if a task is done, format a line, count something. Copying that logic everywhere is slow and dangerous — fix a bug in one copy and the other five are still wrong. There has to be a way to write a piece of logic <b>once</b>, give it a name, and reuse it. There is: the <b>function</b>.</p>\r\n<p>A function is a named, reusable machine. You <b>define</b> it once, then <b>call</b> it by name whenever you need it — optionally feeding it <b>inputs</b> (arguments) and getting an <b>output</b> back (a return value). You've already been calling functions the whole course: <code>print(...)</code>, <code>len(...)</code>, <code>round(...)</code> are all functions someone else wrote. Now you'll write your own.</p>\r\n<p>This is a turning point. Functions are how real programs stay organised: instead of one giant wall of code, you build small, named pieces that each do one job — easy to read, test, and reuse. Master this and everything after it gets easier.</p>\r\n\r\n<h4>1. Defining and calling a function</h4>\r\n<p>You define a function with <code>def</code>, a name, parentheses, and a colon. The indented lines below are its <b>body</b> — they don't run until you <b>call</b> the function by writing its name with <code>()</code>.</p>\r\n<pre class=\"run\">def say_hello():\r\n    print(\"Hello!\")\r\n    print(\"Welcome to The Dojo.\")\r\n\r\nsay_hello()      # call it — now the body runs\r\nsay_hello()      # call it again — reuse!</pre>\r\n<p>Defining a function does <b>not</b> run it — it just teaches Python what the function does. Nothing happens until you call it. Calling it twice runs the body twice.</p>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 1.</b> Define a function <code>greet</code> that <b>returns</b> the string <code>\"Hello!\"</code>. (We'll test it by calling <code>greet()</code>.)</span>\r\n<template class=\"st\">def greet():\r\n    # return the greeting\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert greet() == \"Hello!\"\r\n</template></div>\r\n\r\n<h4>2. Parameters: giving a function input</h4>\r\n<p>A function becomes far more useful when it can work on <b>different</b> values. Put a <b>parameter</b> name in the parentheses; when you call the function you pass an <b>argument</b> that fills it in.</p>\r\n<pre class=\"run\">def greet(name):\r\n    print(f\"Hello, {name}!\")\r\n\r\ngreet(\"Anna\")    # Hello, Anna!\r\ngreet(\"Ben\")     # Hello, Ben!</pre>\r\n<figure class=\"diagram\">\r\n<svg viewBox=\"0 0 360 110\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"IBM Plex Mono, monospace\" font-size=\"12\">\r\n  <defs>\r\n    <marker id=\"a13\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\">\r\n      <path d=\"M0 0 L10 5 L0 10 z\" fill=\"#F5B942\"/>\r\n    </marker>\r\n  </defs>\r\n  <rect x=\"130\" y=\"30\" width=\"100\" height=\"50\" rx=\"10\" fill=\"#121C30\" stroke=\"#22304C\"/>\r\n  <text x=\"180\" y=\"52\" text-anchor=\"middle\" fill=\"#F5B942\">add(a, b)</text>\r\n  <text x=\"180\" y=\"70\" text-anchor=\"middle\" fill=\"#8FA0BC\" font-size=\"10\">the machine</text>\r\n  <text x=\"40\" y=\"49\" text-anchor=\"middle\" fill=\"#7FD1C0\">2, 3</text>\r\n  <text x=\"40\" y=\"66\" text-anchor=\"middle\" fill=\"#8FA0BC\" font-size=\"10\">arguments</text>\r\n  <text x=\"322\" y=\"49\" text-anchor=\"middle\" fill=\"#E8E4D8\">5</text>\r\n  <text x=\"322\" y=\"66\" text-anchor=\"middle\" fill=\"#8FA0BC\" font-size=\"10\">return value</text>\r\n  <g stroke=\"#F5B942\" stroke-width=\"1.5\" marker-end=\"url(#a13)\" fill=\"none\">\r\n    <line x1=\"66\" y1=\"52\" x2=\"126\" y2=\"52\"/>\r\n    <line x1=\"230\" y1=\"52\" x2=\"292\" y2=\"52\"/>\r\n  </g>\r\n</svg>\r\n<figcaption>A function is a machine: arguments go <b>in</b>, the body does the work, and a value comes <b>out</b> via <code>return</code>.</figcaption>\r\n</figure>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 2.</b> Define <code>double</code> that takes a number <code>n</code> and returns <code>n</code> times 2. So <code>double(5)</code> is <code>10</code>.</span>\r\n<template class=\"st\">def double(n):\r\n    # return n doubled\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert double(5) == 10\r\nassert double(0) == 0\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 3.</b> Define <code>square</code> that takes <code>n</code> and returns <code>n * n</code>. So <code>square(4)</code> is <code>16</code>.</span>\r\n<template class=\"st\">def square(n):\r\n    # return n squared\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert square(4) == 16\r\nassert square(10) == 100\r\n</template></div>\r\n\r\n<h4>3. return vs print — the big one</h4>\r\n<p>This trips up every beginner, so read slowly. <code>print</code> <b>shows</b> a value on the screen and then it's gone. <code>return</code> <b>hands a value back</b> to whoever called the function, so it can be stored and used. A function that only prints gives you nothing to work with.</p>\r\n<pre class=\"run\">def add_print(a, b):\r\n    print(a + b)          # shows it, returns nothing\r\n\r\ndef add_return(a, b):\r\n    return a + b          # hands the value back\r\n\r\nx = add_return(2, 3)\r\nprint(x * 10)             # 50 — we could use the returned value\r\n\r\ny = add_print(2, 3)       # prints 5...\r\nprint(y)                  # None — there was nothing to store!</pre>\r\n<p>Rule of thumb: if you want to <b>use</b> a function's result later, it must <code>return</code> it.</p>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 4.</b> Define <code>shout</code> that takes a string <code>s</code> and <b>returns</b> it in uppercase with a <code>\"!\"</code> added. So <code>shout(\"hi\")</code> is <code>\"HI!\"</code>. (Use <code>s.upper()</code>.)</span>\r\n<template class=\"st\">def shout(s):\r\n    # return the shouted string\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert shout(\"hi\") == \"HI!\"\r\nassert shout(\"dojo\") == \"DOJO!\"\r\n</template></div>\r\n\r\n<h4>4. Several parameters</h4>\r\n<p>A function can take as many inputs as you need, separated by commas. The arguments fill the parameters in order.</p>\r\n<pre class=\"run\">def add(a, b):\r\n    return a + b\r\n\r\ndef total_price(price, qty):\r\n    return price * qty\r\n\r\nprint(add(2, 3))            # 5\r\nprint(total_price(50, 3))   # 150</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 5.</b> Define <code>add</code> that returns the sum of <code>a</code> and <code>b</code>. So <code>add(2, 3)</code> is <code>5</code>.</span>\r\n<template class=\"st\">def add(a, b):\r\n    # return the sum\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert add(2, 3) == 5\r\nassert add(-1, 1) == 0\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 6.</b> Define <code>total_price</code> that takes <code>price</code> and <code>qty</code> and returns <code>price * qty</code>. So <code>total_price(50, 3)</code> is <code>150</code>.</span>\r\n<template class=\"st\">def total_price(price, qty):\r\n    # return the total\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert total_price(50, 3) == 150\r\nassert total_price(8000, 0) == 0\r\n</template></div>\r\n\r\n<h4>5. Returning a decision (True/False)</h4>\r\n<p>A function can return anything — including the result of a comparison, which is a boolean. That's a clean way to name a yes/no test.</p>\r\n<pre class=\"run\">def is_even(n):\r\n    return n % 2 == 0\r\n\r\nprint(is_even(4))    # True\r\nprint(is_even(7))    # False</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 7.</b> Define <code>is_even</code> that returns <code>True</code> if <code>n</code> is even, else <code>False</code>. So <code>is_even(4)</code> is <code>True</code> and <code>is_even(5)</code> is <code>False</code>.</span>\r\n<template class=\"st\">def is_even(n):\r\n    # return whether n is even\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert is_even(4) == True\r\nassert is_even(5) == False\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 8.</b> Define <code>max_of</code> that takes <code>a</code> and <code>b</code> and returns the larger one. So <code>max_of(3, 7)</code> is <code>7</code>. (Use an <code>if</code>.)</span>\r\n<template class=\"st\">def max_of(a, b):\r\n    # return the larger of a and b\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert max_of(3, 7) == 7\r\nassert max_of(10, 2) == 10\r\n</template></div>\r\n\r\n<h4>6. Using functions together</h4>\r\n<p>The real power: once a function exists, you can call it inside loops, inside other functions, anywhere. Small pieces combine into big programs.</p>\r\n<pre class=\"run\">def greet_name(name):\r\n    return f\"Hello, {name}!\"\r\n\r\nnames = [\"Anna\", \"Ben\"]\r\nfor n in names:\r\n    print(greet_name(n))\r\n# Hello, Anna!\r\n# Hello, Ben!</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 9.</b> Define <code>greet_name</code> that takes <code>name</code> and returns <code>\"Hello, name!\"</code>. So <code>greet_name(\"Anna\")</code> is <code>\"Hello, Anna!\"</code>. (Use an f-string.)</span>\r\n<template class=\"st\">def greet_name(name):\r\n    # return the greeting with the name\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert greet_name(\"Anna\") == \"Hello, Anna!\"\r\nassert greet_name(\"Ben\") == \"Hello, Ben!\"\r\n</template></div>\r\n<div class=\"ex stretch\" data-kind=\"py\"><span class=\"exq\"><b>🔥 Stretch (grading function).</b> Define <code>grade</code> that takes a <code>score</code> and returns a letter: <code>\"A\"</code> for 90 or above, <code>\"B\"</code> for 80–89, <code>\"C\"</code> for 70–79, otherwise <code>\"F\"</code>. So <code>grade(95)</code> is <code>\"A\"</code> and <code>grade(50)</code> is <code>\"F\"</code>.</span>\r\n<template class=\"st\">def grade(score):\r\n    # return the letter grade\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert grade(95) == \"A\"\r\nassert grade(85) == \"B\"\r\nassert grade(72) == \"C\"\r\nassert grade(50) == \"F\"\r\n</template></div>\r\n\r\n<div class=\"recap\">Recap of lesson 13: a <b>function</b> is a named, reusable block · <b>define</b> with <code>def name(params):</code>, run it by <b>calling</b> <code>name(args)</code> · <b>parameters</b> are inputs, <b>arguments</b> fill them in · <code>return</code> hands a value back so it can be used — <code>print</code> only shows it and returns <code>None</code> · a function can return numbers, strings, or booleans · call functions inside loops and other functions to build bigger programs. Next: functions in depth — default values, returning several things, and variable scope.</div>\r\n\r\n<h4>🏠 Homework</h4>\r\n<p>Four graded exercises — do them right here before the next lesson.</p>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Homework 1.</b> Define <code>triple</code> that takes <code>n</code> and returns <code>n * 3</code>. So <code>triple(4)</code> is <code>12</code>.</span>\r\n<template class=\"st\">def triple(n):\r\n    # return n tripled\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert triple(4) == 12\r\nassert triple(0) == 0\r\n</template></div>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Homework 2.</b> Define <code>is_positive</code> that returns <code>True</code> if <code>n</code> is greater than 0, else <code>False</code>. So <code>is_positive(3)</code> is <code>True</code> and <code>is_positive(-2)</code> is <code>False</code>.</span>\r\n<template class=\"st\">def is_positive(n):\r\n    # return whether n is positive\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert is_positive(3) == True\r\nassert is_positive(-2) == False\r\nassert is_positive(0) == False\r\n</template></div>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Homework 3.</b> Define <code>initials</code> that takes <code>first</code> and <code>last</code> names and returns their uppercase initials with dots. So <code>initials(\"Anna\", \"Bui\")</code> is <code>\"A.B.\"</code>. (Use <code>first[0]</code> and <code>.upper()</code>.)</span>\r\n<template class=\"st\">def initials(first, last):\r\n    # return the initials like \"A.B.\"\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert initials(\"Anna\", \"Bui\") == \"A.B.\"\r\nassert initials(\"son\", \"tran\") == \"S.T.\"\r\n</template></div>\r\n<div class=\"ex homework stretch\" data-kind=\"py\"><span class=\"exq\"><b>🔥 Homework 4 (stretch).</b> Define <code>count_vowels</code> that takes a lowercase <code>word</code> and returns how many vowels (<code>a e i o u</code>) it contains. So <code>count_vowels(\"hello\")</code> is <code>2</code>. (Loop the letters; check <code>if letter in \"aeiou\"</code>.)</span>\r\n<template class=\"st\">def count_vowels(word):\r\n    # count and return the vowels\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert count_vowels(\"hello\") == 2\r\nassert count_vowels(\"dojo\") == 2\r\nassert count_vowels(\"xyz\") == 0\r\n</template></div>"}},{"t":{"vi":"Hàm nâng cao: tham số, return, phạm vi","en":"Functions in depth: params, return, scope"},"html":{"vi":"<h3>Bài 14 — Hàm chuyên sâu: mặc định, trả về nhiều, phạm vi</h3>\r\n<p>Giờ bạn đã viết và gọi được hàm. Bài này thêm ba thứ khiến hàm thật sự mạnh trong code thực tế: <b>giá trị mặc định</b> (để vài đầu vào là tùy chọn), trả về <b>nhiều hơn một giá trị</b> cùng lúc, và hiểu <b>phạm vi (scope)</b> — biến nào hàm nhìn thấy được và biến nào ở riêng bên trong.</p>\r\n<p>Không có gì là cú pháp để học thuộc vô cớ. Mỗi thứ giải quyết một nỗi phiền thật: giá trị mặc định giúp bạn khỏi phải truyền cùng một đối số hết lần này tới lần khác; trả về nhiều giá trị để một hàm trả lời một câu hỏi phong phú hơn; và phạm vi là quy tắc giữ cho chương trình lớn không rối tung vì các biến giẫm lên nhau.</p>\r\n<p>Đến cuối bài bạn sẽ viết những hàm giống hệt trong các thư viện thật — linh hoạt, tự chứa, và an toàn để tái dùng ở bất cứ đâu.</p>\r\n\r\n<h4>1. Giá trị mặc định cho tham số</h4>\r\n<p>Cho một tham số một giá trị mặc định bằng <code>=</code>. Nếu người gọi truyền đối số đó thì nó được dùng; nếu không, giá trị mặc định được áp dụng. Đầu vào tùy chọn, miễn phí.</p>\r\n<pre class=\"run\">def greet(name, greeting=\"Hello\"):\r\n    return f\"{greeting}, {name}!\"\r\n\r\nprint(greet(\"Anna\"))            # Hello, Anna!   (greeting mặc định)\r\nprint(greet(\"Ben\", \"Hi\"))       # Hi, Ben!       (ghi đè nó)</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 1.</b> Định nghĩa <code>greet</code> với tham số thứ hai <code>greeting</code> mặc định là <code>\"Hello\"</code>, trả về <code>\"greeting, name!\"</code>. Vậy <code>greet(\"Anna\")</code> là <code>\"Hello, Anna!\"</code> và <code>greet(\"Ben\", \"Hi\")</code> là <code>\"Hi, Ben!\"</code>.</span>\r\n<template class=\"st\">def greet(name, greeting=\"Hello\"):\r\n    # return \"greeting, name!\"\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert greet(\"Anna\") == \"Hello, Anna!\"\r\nassert greet(\"Ben\", \"Hi\") == \"Hi, Ben!\"\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 2.</b> Định nghĩa <code>power</code> nhận <code>base</code> và <code>exp</code> (mặc định <code>2</code>) và trả về <code>base ** exp</code>. Vậy <code>power(5)</code> là <code>25</code> và <code>power(2, 3)</code> là <code>8</code>.</span>\r\n<template class=\"st\">def power(base, exp=2):\r\n    # return base to the power exp\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert power(5) == 25\r\nassert power(2, 3) == 8\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 3.</b> Định nghĩa <code>apply_discount</code> nhận <code>price</code> và <code>percent</code> (mặc định <code>10</code>) và trả về giá sau khi trừ đi phần trăm đó. Vậy <code>apply_discount(100)</code> là <code>90.0</code> và <code>apply_discount(200, 25)</code> là <code>150.0</code>.</span>\r\n<template class=\"st\">def apply_discount(price, percent=10):\r\n    # return the discounted price\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert apply_discount(100) == 90.0\r\nassert apply_discount(200, 25) == 150.0\r\n</template></div>\r\n\r\n<h4>2. Trả về nhiều giá trị</h4>\r\n<p>Một hàm có thể trả lại nhiều hơn một giá trị cùng lúc — chỉ cần phân cách bằng dấu phẩy. Python gói chúng thành một <b>tuple</b>, và người gọi có thể <b>bung (unpack)</b> chúng thành các tên riêng.</p>\r\n<pre class=\"run\">def first_last(items):\r\n    return items[0], items[-1]\r\n\r\npair = first_last([10, 20, 30])\r\nprint(pair)                 # (10, 30)  — một tuple\r\n\r\nlo, hi = first_last([10, 20, 30])   # bung thành hai tên\r\nprint(lo, hi)               # 10 30</pre>\r\n<figure class=\"diagram\">\r\n<svg viewBox=\"0 0 360 120\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11\">\r\n  <defs>\r\n    <marker id=\"a14v\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\">\r\n      <path d=\"M0 0 L10 5 L0 10 z\" fill=\"#7FD1C0\"/>\r\n    </marker>\r\n  </defs>\r\n  <rect x=\"20\" y=\"40\" width=\"130\" height=\"40\" rx=\"9\" fill=\"#121C30\" stroke=\"#22304C\"/>\r\n  <text x=\"85\" y=\"64\" text-anchor=\"middle\" fill=\"#F5B942\">first_last(items)</text>\r\n  <rect x=\"196\" y=\"42\" width=\"60\" height=\"36\" rx=\"7\" fill=\"#0E1626\" stroke=\"#22304C\"/>\r\n  <text x=\"226\" y=\"65\" text-anchor=\"middle\" fill=\"#E8E4D8\">(10, 30)</text>\r\n  <text x=\"226\" y=\"34\" text-anchor=\"middle\" fill=\"#8FA0BC\" font-size=\"10\">một tuple</text>\r\n  <rect x=\"286\" y=\"24\" width=\"60\" height=\"28\" rx=\"6\" fill=\"#121C30\" stroke=\"#22304C\"/>\r\n  <text x=\"316\" y=\"42\" text-anchor=\"middle\" fill=\"#7FD1C0\">lo = 10</text>\r\n  <rect x=\"286\" y=\"66\" width=\"60\" height=\"28\" rx=\"6\" fill=\"#121C30\" stroke=\"#22304C\"/>\r\n  <text x=\"316\" y=\"84\" text-anchor=\"middle\" fill=\"#7FD1C0\">hi = 30</text>\r\n  <g stroke=\"#7FD1C0\" stroke-width=\"1.4\" marker-end=\"url(#a14v)\" fill=\"none\">\r\n    <line x1=\"150\" y1=\"60\" x2=\"192\" y2=\"60\"/>\r\n    <line x1=\"256\" y1=\"54\" x2=\"284\" y2=\"40\"/>\r\n    <line x1=\"256\" y1=\"66\" x2=\"284\" y2=\"78\"/>\r\n  </g>\r\n</svg>\r\n<figcaption>Trả về hai giá trị tạo thành một <b>tuple</b>; bung bằng <code>lo, hi = ...</code> tách nó lại thành các tên riêng.</figcaption>\r\n</figure>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 4.</b> Định nghĩa <code>first_last</code> nhận một list <code>items</code> và trả về tuple gồm phần tử đầu và cuối. Vậy <code>first_last([10, 20, 30])</code> là <code>(10, 30)</code>.</span>\r\n<template class=\"st\">def first_last(items):\r\n    # return (first, last)\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert first_last([10, 20, 30]) == (10, 30)\r\nassert first_last([5, 9]) == (5, 9)\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 5.</b> Định nghĩa <code>split_name</code> nhận một họ tên như <code>\"Anna Bui\"</code> và trả về tuple <code>(first, last)</code> → <code>(\"Anna\", \"Bui\")</code>. (Dùng <code>full.split()</code>.)</span>\r\n<template class=\"st\">def split_name(full):\r\n    # return (first, last)\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert split_name(\"Anna Bui\") == (\"Anna\", \"Bui\")\r\nassert split_name(\"Son Tran\") == (\"Son\", \"Tran\")\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 6.</b> Định nghĩa <code>high_low</code> nhận một list số <code>nums</code> và trả về <code>(nhỏ nhất, lớn nhất)</code> bằng một vòng lặp. Vậy <code>high_low([3, 1, 2])</code> là <code>(1, 3)</code>.</span>\r\n<template class=\"st\">def high_low(nums):\r\n    # return (smallest, largest)\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert high_low([3, 1, 2]) == (1, 3)\r\nassert high_low([5, 5, 5]) == (5, 5)\r\n</template></div>\r\n\r\n<h4>3. Phạm vi: hàm nhìn thấy được gì</h4>\r\n<p>Biến tạo ra <b>bên trong</b> một hàm là biến <b>cục bộ (local)</b> — chúng chỉ tồn tại khi hàm chạy và biến mất khi hàm trả về. Chương trình bên ngoài không thấy được chúng, và đó là điều tốt: nghĩa là phần ruột bên trong của một hàm không bao giờ vô tình đụng với các tên ở nơi khác.</p>\r\n<pre class=\"run\">def make_label(n):\r\n    tag = \"item\"          # cục bộ — chỉ tồn tại ở đây\r\n    return f\"{tag} {n}\"\r\n\r\nprint(make_label(3))      # item 3\r\n# print(tag)              # sẽ LỖI: tag không tồn tại ngoài này</pre>\r\n<p>Hãy hình dung mỗi hàm như một căn phòng có giấy nháp riêng. Mọi thứ nó viết nguệch ngoạc (biến cục bộ) đều bị vứt đi khi rời phòng; chỉ những gì nó <code>return</code> mới đi ra ngoài.</p>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 7.</b> Định nghĩa <code>make_label</code> nhận <code>n</code>, dùng một biến <b>cục bộ</b> <code>tag = \"item\"</code>, và trả về <code>\"item n\"</code>. Vậy <code>make_label(3)</code> là <code>\"item 3\"</code>.</span>\r\n<template class=\"st\">def make_label(n):\r\n    # use a local variable tag, then return \"item n\"\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert make_label(3) == \"item 3\"\r\nassert make_label(9) == \"item 9\"\r\n</template></div>\r\n\r\n<h4>4. Những hàm làm việc thật</h4>\r\n<p>Ghép lại: tham số vào, một vòng lặp hay logic trong thân, một giá trị rõ ràng đi ra.</p>\r\n<pre class=\"run\">def count_positive(nums):\r\n    count = 0\r\n    for n in nums:\r\n        if n > 0:\r\n            count += 1\r\n    return count\r\n\r\nprint(count_positive([-1, 2, -3, 4]))   # 2</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 8.</b> Định nghĩa <code>count_positive</code> trả về bao nhiêu số trong <code>nums</code> lớn hơn 0. Vậy <code>count_positive([-1, 2, -3, 4])</code> là <code>2</code>.</span>\r\n<template class=\"st\">def count_positive(nums):\r\n    # count and return the positive numbers\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert count_positive([-1, 2, -3, 4]) == 2\r\nassert count_positive([0, -5]) == 0\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 9.</b> Định nghĩa <code>average</code> trả về trung bình của một list <code>nums</code> không rỗng (tổng ÷ số phần tử). Vậy <code>average([2, 4, 6])</code> là <code>4.0</code>.</span>\r\n<template class=\"st\">def average(nums):\r\n    # return the average\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert average([2, 4, 6]) == 4.0\r\nassert average([10]) == 10.0\r\n</template></div>\r\n<div class=\"ex stretch\" data-kind=\"py\"><span class=\"exq\"><b>🔥 Nâng cao (thống kê trong một lần gọi).</b> Định nghĩa <code>stats</code> nhận một list <code>nums</code> không rỗng và trả về tuple <code>(count, total, average)</code> bằng một vòng lặp. Vậy <code>stats([2, 4, 6])</code> là <code>(3, 12, 4.0)</code>.</span>\r\n<template class=\"st\">def stats(nums):\r\n    # return (count, total, average)\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert stats([2, 4, 6]) == (3, 12, 4.0)\r\nassert stats([10]) == (1, 10, 10.0)\r\n</template></div>\r\n\r\n<div class=\"recap\">Tóm tắt bài 14: <b>giá trị mặc định</b> (<code>def f(x, y=10):</code>) làm tham số thành tùy chọn · một hàm có thể <b>trả về nhiều giá trị</b> — Python gói thành một <b>tuple</b> mà người gọi có thể <b>bung</b> (<code>lo, hi = ...</code>) · biến tạo bên trong hàm là <b>cục bộ</b> và biến mất khi hàm trả về — chỉ giá trị trả về thoát ra · kết hợp tham số, vòng lặp và một return rõ ràng để xây những công cụ nhỏ đáng tin. Bài sau: xử lý <b>lỗi</b> nhẹ nhàng với <code>try / except</code>.</div>\r\n\r\n<h4>🏠 Bài tập về nhà</h4>\r\n<p>Bốn bài tập được chấm điểm — làm ngay tại đây trước bài kế tiếp.</p>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Bài về nhà 1.</b> Định nghĩa <code>introduce</code> nhận <code>name</code> và <code>city</code> (mặc định <code>\"Hanoi\"</code>) và trả về <code>\"name from city\"</code>. Vậy <code>introduce(\"Anna\")</code> là <code>\"Anna from Hanoi\"</code> và <code>introduce(\"Ben\", \"Hue\")</code> là <code>\"Ben from Hue\"</code>.</span>\r\n<template class=\"st\">def introduce(name, city=\"Hanoi\"):\r\n    # return \"name from city\"\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert introduce(\"Anna\") == \"Anna from Hanoi\"\r\nassert introduce(\"Ben\", \"Hue\") == \"Ben from Hue\"\r\n</template></div>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Bài về nhà 2.</b> Định nghĩa <code>apply_tax</code> nhận <code>price</code> và <code>rate</code> (mặc định <code>10</code>) và trả về giá cộng thêm phần trăm thuế đó. Vậy <code>apply_tax(100)</code> là <code>110.0</code> và <code>apply_tax(200, 5)</code> là <code>210.0</code>.</span>\r\n<template class=\"st\">def apply_tax(price, rate=10):\r\n    # return the price with tax added\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert apply_tax(100) == 110.0\r\nassert apply_tax(200, 5) == 210.0\r\n</template></div>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Bài về nhà 3.</b> Định nghĩa <code>middle_three</code> nhận một list ít nhất 3 phần tử và trả về tuple gồm phần tử <b>đầu, giữa, cuối</b>. Vậy <code>middle_three([1, 2, 3])</code> là <code>(1, 2, 3)</code> và <code>middle_three([10, 20, 30, 40, 50])</code> là <code>(10, 30, 50)</code>. (Chỉ số giữa là <code>len(items) // 2</code>.)</span>\r\n<template class=\"st\">def middle_three(items):\r\n    # return (first, middle, last)\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert middle_three([1, 2, 3]) == (1, 2, 3)\r\nassert middle_three([10, 20, 30, 40, 50]) == (10, 30, 50)\r\n</template></div>\r\n<div class=\"ex homework stretch\" data-kind=\"py\"><span class=\"exq\"><b>🔥 Bài về nhà 4 (nâng cao).</b> Định nghĩa <code>longest</code> nhận một list <code>words</code> và trả về từ dài nhất (dùng vòng lặp; nếu hòa, giữ từ đầu tiên). Vậy <code>longest([\"a\", \"bbb\", \"cc\"])</code> là <code>\"bbb\"</code>.</span>\r\n<template class=\"st\">def longest(words):\r\n    # return the longest word\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert longest([\"a\", \"bbb\", \"cc\"]) == \"bbb\"\r\nassert longest([\"dog\", \"cat\", \"mouse\"]) == \"mouse\"\r\n</template></div>","en":"<h3>Lesson 14 — Functions in depth: defaults, many returns, scope</h3>\r\n<p>You can now write and call functions. This lesson adds the three things that make them genuinely powerful in real code: <b>default values</b> (so some inputs are optional), returning <b>more than one value</b> at once, and understanding <b>scope</b> — which variables a function can see and which stay private inside it.</p>\r\n<p>None of this is new syntax to memorise for its own sake. Each piece solves a real annoyance: default values save you from passing the same argument over and over; multiple returns let one function answer a richer question; and scope is the rule that keeps big programs from turning into a tangle of variables stepping on each other.</p>\r\n<p>By the end you'll write functions that feel like the ones in real libraries — flexible, self-contained, and safe to reuse anywhere.</p>\r\n\r\n<h4>1. Default parameter values</h4>\r\n<p>Give a parameter a default with <code>=</code>. If the caller supplies that argument it's used; if not, the default kicks in. Optional inputs, for free.</p>\r\n<pre class=\"run\">def greet(name, greeting=\"Hello\"):\r\n    return f\"{greeting}, {name}!\"\r\n\r\nprint(greet(\"Anna\"))            # Hello, Anna!   (default greeting)\r\nprint(greet(\"Ben\", \"Hi\"))       # Hi, Ben!       (override it)</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 1.</b> Define <code>greet</code> with a second parameter <code>greeting</code> that defaults to <code>\"Hello\"</code>, returning <code>\"greeting, name!\"</code>. So <code>greet(\"Anna\")</code> is <code>\"Hello, Anna!\"</code> and <code>greet(\"Ben\", \"Hi\")</code> is <code>\"Hi, Ben!\"</code>.</span>\r\n<template class=\"st\">def greet(name, greeting=\"Hello\"):\r\n    # return \"greeting, name!\"\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert greet(\"Anna\") == \"Hello, Anna!\"\r\nassert greet(\"Ben\", \"Hi\") == \"Hi, Ben!\"\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 2.</b> Define <code>power</code> that takes <code>base</code> and <code>exp</code> (default <code>2</code>) and returns <code>base ** exp</code>. So <code>power(5)</code> is <code>25</code> and <code>power(2, 3)</code> is <code>8</code>.</span>\r\n<template class=\"st\">def power(base, exp=2):\r\n    # return base to the power exp\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert power(5) == 25\r\nassert power(2, 3) == 8\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 3.</b> Define <code>apply_discount</code> that takes <code>price</code> and <code>percent</code> (default <code>10</code>) and returns the price after taking off that percent. So <code>apply_discount(100)</code> is <code>90.0</code> and <code>apply_discount(200, 25)</code> is <code>150.0</code>.</span>\r\n<template class=\"st\">def apply_discount(price, percent=10):\r\n    # return the discounted price\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert apply_discount(100) == 90.0\r\nassert apply_discount(200, 25) == 150.0\r\n</template></div>\r\n\r\n<h4>2. Returning several values</h4>\r\n<p>A function can hand back more than one value at once — just separate them with commas. Python bundles them into a <b>tuple</b>, and the caller can <b>unpack</b> them into separate names.</p>\r\n<pre class=\"run\">def first_last(items):\r\n    return items[0], items[-1]\r\n\r\npair = first_last([10, 20, 30])\r\nprint(pair)                 # (10, 30)  — a tuple\r\n\r\nlo, hi = first_last([10, 20, 30])   # unpack into two names\r\nprint(lo, hi)               # 10 30</pre>\r\n<figure class=\"diagram\">\r\n<svg viewBox=\"0 0 360 120\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11\">\r\n  <defs>\r\n    <marker id=\"a14\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\">\r\n      <path d=\"M0 0 L10 5 L0 10 z\" fill=\"#7FD1C0\"/>\r\n    </marker>\r\n  </defs>\r\n  <rect x=\"20\" y=\"40\" width=\"130\" height=\"40\" rx=\"9\" fill=\"#121C30\" stroke=\"#22304C\"/>\r\n  <text x=\"85\" y=\"64\" text-anchor=\"middle\" fill=\"#F5B942\">first_last(items)</text>\r\n  <rect x=\"196\" y=\"42\" width=\"60\" height=\"36\" rx=\"7\" fill=\"#0E1626\" stroke=\"#22304C\"/>\r\n  <text x=\"226\" y=\"65\" text-anchor=\"middle\" fill=\"#E8E4D8\">(10, 30)</text>\r\n  <text x=\"226\" y=\"34\" text-anchor=\"middle\" fill=\"#8FA0BC\" font-size=\"10\">a tuple</text>\r\n  <rect x=\"286\" y=\"24\" width=\"60\" height=\"28\" rx=\"6\" fill=\"#121C30\" stroke=\"#22304C\"/>\r\n  <text x=\"316\" y=\"42\" text-anchor=\"middle\" fill=\"#7FD1C0\">lo = 10</text>\r\n  <rect x=\"286\" y=\"66\" width=\"60\" height=\"28\" rx=\"6\" fill=\"#121C30\" stroke=\"#22304C\"/>\r\n  <text x=\"316\" y=\"84\" text-anchor=\"middle\" fill=\"#7FD1C0\">hi = 30</text>\r\n  <g stroke=\"#7FD1C0\" stroke-width=\"1.4\" marker-end=\"url(#a14)\" fill=\"none\">\r\n    <line x1=\"150\" y1=\"60\" x2=\"192\" y2=\"60\"/>\r\n    <line x1=\"256\" y1=\"54\" x2=\"284\" y2=\"40\"/>\r\n    <line x1=\"256\" y1=\"66\" x2=\"284\" y2=\"78\"/>\r\n  </g>\r\n</svg>\r\n<figcaption>Returning two values makes a <b>tuple</b>; unpacking with <code>lo, hi = ...</code> splits it back into separate names.</figcaption>\r\n</figure>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 4.</b> Define <code>first_last</code> that takes a list <code>items</code> and returns a tuple of its first and last element. So <code>first_last([10, 20, 30])</code> is <code>(10, 30)</code>.</span>\r\n<template class=\"st\">def first_last(items):\r\n    # return (first, last)\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert first_last([10, 20, 30]) == (10, 30)\r\nassert first_last([5, 9]) == (5, 9)\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 5.</b> Define <code>split_name</code> that takes a full name like <code>\"Anna Bui\"</code> and returns a tuple <code>(first, last)</code> → <code>(\"Anna\", \"Bui\")</code>. (Use <code>full.split()</code>.)</span>\r\n<template class=\"st\">def split_name(full):\r\n    # return (first, last)\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert split_name(\"Anna Bui\") == (\"Anna\", \"Bui\")\r\nassert split_name(\"Son Tran\") == (\"Son\", \"Tran\")\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 6.</b> Define <code>high_low</code> that takes a list of numbers <code>nums</code> and returns <code>(smallest, largest)</code> using a loop. So <code>high_low([3, 1, 2])</code> is <code>(1, 3)</code>.</span>\r\n<template class=\"st\">def high_low(nums):\r\n    # return (smallest, largest)\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert high_low([3, 1, 2]) == (1, 3)\r\nassert high_low([5, 5, 5]) == (5, 5)\r\n</template></div>\r\n\r\n<h4>3. Scope: what a function can see</h4>\r\n<p>Variables created <b>inside</b> a function are <b>local</b> — they exist only while the function runs and vanish when it returns. The outside program can't see them, and that's a good thing: it means a function's inner workings never accidentally clash with names elsewhere.</p>\r\n<pre class=\"run\">def make_label(n):\r\n    tag = \"item\"          # local — only exists in here\r\n    return f\"{tag} {n}\"\r\n\r\nprint(make_label(3))      # item 3\r\n# print(tag)              # would be an ERROR: tag is not defined out here</pre>\r\n<p>Think of each function as a room with its own scratch paper. Whatever it scribbles (its local variables) is thrown away when it leaves the room; only what it <code>return</code>s comes out.</p>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 7.</b> Define <code>make_label</code> that takes <code>n</code>, uses a <b>local</b> variable <code>tag = \"item\"</code>, and returns <code>\"item n\"</code>. So <code>make_label(3)</code> is <code>\"item 3\"</code>.</span>\r\n<template class=\"st\">def make_label(n):\r\n    # use a local variable tag, then return \"item n\"\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert make_label(3) == \"item 3\"\r\nassert make_label(9) == \"item 9\"\r\n</template></div>\r\n\r\n<h4>4. Functions that do real work</h4>\r\n<p>Put it together: parameters in, a loop or logic in the body, one clear value out.</p>\r\n<pre class=\"run\">def count_positive(nums):\r\n    count = 0\r\n    for n in nums:\r\n        if n > 0:\r\n            count += 1\r\n    return count\r\n\r\nprint(count_positive([-1, 2, -3, 4]))   # 2</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 8.</b> Define <code>count_positive</code> that returns how many numbers in <code>nums</code> are greater than 0. So <code>count_positive([-1, 2, -3, 4])</code> is <code>2</code>.</span>\r\n<template class=\"st\">def count_positive(nums):\r\n    # count and return the positive numbers\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert count_positive([-1, 2, -3, 4]) == 2\r\nassert count_positive([0, -5]) == 0\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 9.</b> Define <code>average</code> that returns the average of a non-empty list <code>nums</code> (sum ÷ count). So <code>average([2, 4, 6])</code> is <code>4.0</code>.</span>\r\n<template class=\"st\">def average(nums):\r\n    # return the average\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert average([2, 4, 6]) == 4.0\r\nassert average([10]) == 10.0\r\n</template></div>\r\n<div class=\"ex stretch\" data-kind=\"py\"><span class=\"exq\"><b>🔥 Stretch (stats in one call).</b> Define <code>stats</code> that takes a non-empty list <code>nums</code> and returns a tuple <code>(count, total, average)</code> using a loop. So <code>stats([2, 4, 6])</code> is <code>(3, 12, 4.0)</code>.</span>\r\n<template class=\"st\">def stats(nums):\r\n    # return (count, total, average)\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert stats([2, 4, 6]) == (3, 12, 4.0)\r\nassert stats([10]) == (1, 10, 10.0)\r\n</template></div>\r\n\r\n<div class=\"recap\">Recap of lesson 14: <b>default values</b> (<code>def f(x, y=10):</code>) make parameters optional · a function can <b>return several values</b> — Python bundles them into a <b>tuple</b> the caller can <b>unpack</b> (<code>lo, hi = ...</code>) · variables made inside a function are <b>local</b> and disappear when it returns — only the returned value escapes · combine parameters, loops and one clear return to build reliable little tools. Next: handling <b>errors</b> gracefully with <code>try / except</code>.</div>\r\n\r\n<h4>🏠 Homework</h4>\r\n<p>Four graded exercises — do them right here before the next lesson.</p>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Homework 1.</b> Define <code>introduce</code> that takes <code>name</code> and <code>city</code> (default <code>\"Hanoi\"</code>) and returns <code>\"name from city\"</code>. So <code>introduce(\"Anna\")</code> is <code>\"Anna from Hanoi\"</code> and <code>introduce(\"Ben\", \"Hue\")</code> is <code>\"Ben from Hue\"</code>.</span>\r\n<template class=\"st\">def introduce(name, city=\"Hanoi\"):\r\n    # return \"name from city\"\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert introduce(\"Anna\") == \"Anna from Hanoi\"\r\nassert introduce(\"Ben\", \"Hue\") == \"Ben from Hue\"\r\n</template></div>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Homework 2.</b> Define <code>apply_tax</code> that takes <code>price</code> and <code>rate</code> (default <code>10</code>) and returns the price plus that percent of tax. So <code>apply_tax(100)</code> is <code>110.0</code> and <code>apply_tax(200, 5)</code> is <code>210.0</code>.</span>\r\n<template class=\"st\">def apply_tax(price, rate=10):\r\n    # return the price with tax added\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert apply_tax(100) == 110.0\r\nassert apply_tax(200, 5) == 210.0\r\n</template></div>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Homework 3.</b> Define <code>middle_three</code> that takes a list of at least 3 items and returns a tuple of its <b>first, middle, and last</b> items. So <code>middle_three([1, 2, 3])</code> is <code>(1, 2, 3)</code> and <code>middle_three([10, 20, 30, 40, 50])</code> is <code>(10, 30, 50)</code>. (The middle index is <code>len(items) // 2</code>.)</span>\r\n<template class=\"st\">def middle_three(items):\r\n    # return (first, middle, last)\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert middle_three([1, 2, 3]) == (1, 2, 3)\r\nassert middle_three([10, 20, 30, 40, 50]) == (10, 30, 50)\r\n</template></div>\r\n<div class=\"ex homework stretch\" data-kind=\"py\"><span class=\"exq\"><b>🔥 Homework 4 (stretch).</b> Define <code>longest</code> that takes a list of <code>words</code> and returns the longest one (using a loop; if there's a tie, keep the first). So <code>longest([\"a\", \"bbb\", \"cc\"])</code> is <code>\"bbb\"</code>.</span>\r\n<template class=\"st\">def longest(words):\r\n    # return the longest word\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert longest([\"a\", \"bbb\", \"cc\"]) == \"bbb\"\r\nassert longest([\"dog\", \"cat\", \"mouse\"]) == \"mouse\"\r\n</template></div>"}},{"t":{"vi":"Xử lý lỗi: try / except","en":"Errors: try / except"},"html":{"vi":"<h3>Bài 15 — Xử lý lỗi: try / except</h3>\r\n<p>Cho tới giờ, khi có gì đó sai — chia cho 0, biến <code>\"abc\"</code> thành số, đọc một khóa không tồn tại — chương trình của bạn đơn giản là <b>crash</b> với một dòng lỗi đỏ rồi dừng hẳn. Điều đó ổn khi đang học, nhưng một chương trình thật không thể sụp đổ mỗi lần người dùng gõ gì đó lạ. Nó cần <b>lường trước</b> rắc rối và xử lý một cách bình tĩnh.</p>\r\n<p>Công cụ của Python cho việc này là <code>try / except</code>: bạn đặt đoạn code có rủi ro trong khối <code>try</code>, và nếu nó gây lỗi, Python nhảy sang khối <code>except</code> thay vì crash. Chương trình tiếp tục chạy và có thể đưa ra phản hồi hợp lý — một giá trị mặc định, một thông báo thân thiện, một mục bị bỏ qua.</p>\r\n<p>Đây là khác biệt giữa một script mong manh và phần mềm mà người ta thật sự dùng được. Xử lý nhập liệu xấu một cách nhẹ nhàng là một trong những dấu hiệu rõ nhất của một lập trình viên thật.</p>\r\n\r\n<h4>1. Một lỗi trông như thế nào</h4>\r\n<p>Một số thao tác thất bại lúc chạy và gây ra một <b>ngoại lệ (exception)</b> có tên. Vài cái bạn sẽ gặp liên tục:</p>\r\n<table class=\"res\">\r\n<thead><tr><th>Code</th><th>Ngoại lệ</th><th>Vì sao</th></tr></thead>\r\n<tbody>\r\n<tr><td><code>int(\"abc\")</code></td><td>ValueError</td><td>chữ không phải số</td></tr>\r\n<tr><td><code>10 / 0</code></td><td>ZeroDivisionError</td><td>không thể chia cho 0</td></tr>\r\n<tr><td><code>d[\"missing\"]</code></td><td>KeyError</td><td>không có khóa đó trong dict</td></tr>\r\n<tr><td><code>items[99]</code></td><td>IndexError</td><td>vị trí vượt quá cuối list</td></tr>\r\n</tbody>\r\n</table>\r\n<p>Nếu không xử lý, bất kỳ cái nào cũng làm dừng cả chương trình.</p>\r\n\r\n<h4>2. try / except</h4>\r\n<p>Bọc dòng có rủi ro trong <code>try</code>. Nếu nó thất bại, khối <code>except</code> chạy thay thế.</p>\r\n<pre class=\"run\">def safe_int(s):\r\n    try:\r\n        return int(s)        # rủi ro: có thể thất bại\r\n    except ValueError:\r\n        return 0             # chỉ chạy nếu int() thất bại\r\n\r\nprint(safe_int(\"42\"))    # 42\r\nprint(safe_int(\"abc\"))   # 0  — không crash</pre>\r\n<figure class=\"diagram\">\r\n<svg viewBox=\"0 0 360 150\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"IBM Plex Mono, monospace\" font-size=\"11\">\r\n  <defs>\r\n    <marker id=\"a15v\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\">\r\n      <path d=\"M0 0 L10 5 L0 10 z\" fill=\"#7FD1C0\"/>\r\n    </marker>\r\n  </defs>\r\n  <rect x=\"120\" y=\"14\" width=\"120\" height=\"34\" rx=\"8\" fill=\"#121C30\" stroke=\"#22304C\"/>\r\n  <text x=\"180\" y=\"35\" text-anchor=\"middle\" fill=\"#E8E4D8\">chạy khối try</text>\r\n  <rect x=\"30\" y=\"100\" width=\"130\" height=\"34\" rx=\"8\" fill=\"#0E1626\" stroke=\"#22304C\"/>\r\n  <text x=\"95\" y=\"121\" text-anchor=\"middle\" fill=\"#7FD1C0\">ổn → return</text>\r\n  <rect x=\"200\" y=\"100\" width=\"140\" height=\"34\" rx=\"8\" fill=\"#0E1626\" stroke=\"#22304C\"/>\r\n  <text x=\"270\" y=\"121\" text-anchor=\"middle\" fill=\"#E2604C\">lỗi → except</text>\r\n  <g stroke=\"#7FD1C0\" stroke-width=\"1.3\" marker-end=\"url(#a15v)\" fill=\"none\">\r\n    <line x1=\"160\" y1=\"48\" x2=\"100\" y2=\"96\"/>\r\n  </g>\r\n  <g stroke=\"#E2604C\" stroke-width=\"1.3\" marker-end=\"url(#a15v)\" fill=\"none\" stroke-dasharray=\"4 3\">\r\n    <line x1=\"200\" y1=\"48\" x2=\"262\" y2=\"96\"/>\r\n  </g>\r\n  <text x=\"120\" y=\"78\" fill=\"#8FA0BC\" font-size=\"10\">không lỗi</text>\r\n  <text x=\"238\" y=\"78\" fill=\"#8FA0BC\" font-size=\"10\">lỗi!</text>\r\n</svg>\r\n<figcaption>Nếu khối <code>try</code> thành công, khối <code>except</code> bị bỏ qua. Nếu nó gây lỗi, Python nhảy sang <code>except</code> thay vì crash.</figcaption>\r\n</figure>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 1.</b> Định nghĩa <code>safe_int</code> trả về <code>int(s)</code>, hoặc <code>0</code> nếu <code>s</code> không thể chuyển. Vậy <code>safe_int(\"42\")</code> là <code>42</code> và <code>safe_int(\"abc\")</code> là <code>0</code>.</span>\r\n<template class=\"st\">def safe_int(s):\r\n    # try to convert, else return 0\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert safe_int(\"42\") == 42\r\nassert safe_int(\"abc\") == 0\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 2.</b> Định nghĩa <code>safe_divide</code> trả về <code>a / b</code>, hoặc <code>0</code> nếu <code>b</code> bằng 0 (bắt <code>ZeroDivisionError</code>). Vậy <code>safe_divide(10, 2)</code> là <code>5.0</code> và <code>safe_divide(5, 0)</code> là <code>0</code>.</span>\r\n<template class=\"st\">def safe_divide(a, b):\r\n    # divide safely\r\n    pass\r\n</template>\r\n<template class=\"ts\">assert safe_divide(10, 2) == 5.0\r\nassert safe_divide(5, 0) == 0\r\n</template></div>\r\n\r\n<h4>3. Bắt đúng lỗi</h4>\r\n<p>Ghi tên ngoại lệ bạn dự đoán sau <code>except</code>. Điều này tránh việc vô tình che giấu những lỗi bạn không định bắt. Đọc một khóa dict không có gây ra <code>KeyError</code>; một chỉ số list ngoài phạm vi gây ra <code>IndexError</code>.</p>\r\n<pre class=\"run\">def safe_get(d, key):\r\n    try:\r\n        return d[key]\r\n    except KeyError:\r\n        return \"missing\"\r\n\r\nperson = {\"name\": \"Anna\"}\r\nprint(safe_get(person, \"name\"))    # Anna\r\nprint(safe_get(person, \"email\"))   # missing</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 3.</b> Định nghĩa <code>safe_get</code> trả về <code>d[key]</code>, hoặc <code>\"missing\"</code> nếu không có khóa. Vậy với <code>{\"name\": \"Anna\"}</code>, <code>safe_get(d, \"name\")</code> là <code>\"Anna\"</code> và <code>safe_get(d, \"email\")</code> là
