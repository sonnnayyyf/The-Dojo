 class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 4.</b> Given <code>score = 7</code>, create <code>grade</code> by scale: <code>&gt;= 8</code> → <code>\"Excellent\"</code>; <code>&gt;= 6.5</code> → <code>\"Good\"</code>; <code>&gt;= 5</code> → <code>\"Average\"</code>; otherwise → <code>\"Weak\"</code>.</span>\r\n<template class=\"st\">score = 7\r\n# create grade with if/elif/else\r\n</template>\r\n<template class=\"ts\">assert grade == \"Good\"\r\n</template></div>\r\n\r\n<h4>5. Branch ORDER matters a lot</h4>\r\n<p>Because Python stops at the first true branch, wrong ordering gives wrong answers. If you put <code>&gt;= 5</code> before <code>&gt;= 8</code>, then a score of 9 would be labeled \"Average\" because it matches <code>&gt;= 5</code> first. <b>Always put the strictest (narrowest) condition on top.</b></p>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 5.</b> Given <code>age = 20</code>, create <code>group</code>: <code>&lt; 13</code> → <code>\"child\"</code>; <code>&lt; 20</code> → <code>\"teen\"</code>; otherwise → <code>\"adult\"</code>.</span>\r\n<template class=\"st\">age = 20\r\n# create group with if/elif/else\r\n</template>\r\n<template class=\"ts\">assert group == \"adult\"\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 6.</b> Given <code>number = -4</code>, create <code>sign</code>: <code>\"positive\"</code> if <code>number &gt; 0</code>; <code>\"negative\"</code> if <code>number &lt; 0</code>; <code>\"zero\"</code> if it is 0.</span>\r\n<template class=\"st\">number = -4\r\n# create sign with if/elif/else\r\n</template>\r\n<template class=\"ts\">assert sign == \"negative\"\r\n</template></div>\r\n\r\n<h4>6. Use remainder <code>%</code> to test even/odd</h4>\r\n<p>A number is even when divided by 2 with remainder 0. So <code>n % 2 == 0</code> means \"n is even\".</p>\r\n<pre class=\"run\">n = 10\r\nif n % 2 == 0:\r\n    print(\"even\")\r\nelse:\r\n    print(\"odd\")</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 7.</b> Given <code>n = 7</code>, create <code>kind</code> = <code>\"even\"</code> if <code>n</code> is even, otherwise <code>\"odd\"</code> (hint: use <code>% 2</code>).</span>\r\n<template class=\"st\">n = 7\r\n# create kind based on n % 2\r\n</template>\r\n<template class=\"ts\">assert kind == \"odd\"\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 8.</b> Given <code>hours = 14</code> (hour of day, 0–23), create <code>part_of_day</code>: <code>&lt; 12</code> → <code>\"morning\"</code>; <code>&lt; 18</code> → <code>\"afternoon\"</code>; otherwise → <code>\"evening\"</code>.</span>\r\n<template class=\"st\">hours = 14\r\n# create part_of_day with if/elif/else\r\n</template>\r\n<template class=\"ts\">assert part_of_day == \"afternoon\"\r\n</template></div>\r\n\r\n<h4>7. Comparing strings & membership (<code>in</code>)</h4>\r\n<p>Conditions aren't just for numbers. You can compare strings with <code>==</code>, and test whether a value is in a group with <code>in</code> (lists <code>[...]</code> are covered in depth in lesson 5).</p>\r\n<pre class=\"run\">role = \"admin\"\r\nif role == \"admin\":\r\n    print(\"Full access\")\r\n\r\nday = \"T7\"\r\nif day in [\"T7\", \"CN\"]:\r\n    print(\"Weekend\")</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 9.</b> Given <code>day = \"CN\"</code>, create <code>is_weekend</code> = <code>True</code> if <code>day</code> is <code>\"T7\"</code> or <code>\"CN\"</code> (hint: use <code>day in [\"T7\", \"CN\"]</code>).</span>\r\n<template class=\"st\">day = \"CN\"\r\n# create is_weekend = is day in [\"T7\", \"CN\"]?\r\n</template>\r\n<template class=\"ts\">assert is_weekend is True\r\n</template></div>\r\n\r\n<h4>8. Common mistakes</h4>\r\n<ul>\r\n<li><b>Forgetting the colon <code>:</code></b> after the condition → syntax error.</li>\r\n<li><b>Missing or uneven indentation</b> → <code>IndentationError</code>.</li>\r\n<li><b>Using <code>=</code> instead of <code>==</code></b> in a condition → error.</li>\r\n<li><b>Wrong elif order</b> → the program runs but gives wrong answers (the hardest bug to spot).</li>\r\n</ul>\r\n\r\n<div class=\"recap\">Recap of lesson 3: comparisons give <code>True/False</code> (<code>== != &lt; &gt; &lt;= &gt;=</code>) · <code>if condition:</code> + indented block runs when true · <code>else</code> for the remaining case · <code>elif</code> for many branches, runs the <b>first</b> true one · branch order matters · string comparison & <code>in</code> · <code>=</code> assigns ≠ <code>==</code> compares. Next: combining conditions (and/or/not) and nesting them.</div>\r\n\r\n<div class=\"ex stretch\" data-kind=\"py\"><span class=\"exq\"><b>🔥 Stretch (FizzBuzz).</b> Given <code>n = 15</code>, create <code>result</code>: divisible by <b>both</b> 3 and 5 → <code>\"FizzBuzz\"</code>; only by 3 → <code>\"Fizz\"</code>; only by 5 → <code>\"Buzz\"</code>; otherwise → the number as a string (<code>str(n)</code>). <i>Remember: check \"both 3 and 5\" FIRST.</i></span>\r\n<template class=\"st\">n = 15\r\n# create result following the FizzBuzz rule\r\n</template>\r\n<template class=\"ts\">assert result == \"FizzBuzz\"\r\n</template></div>\r\n\r\n<h4>🏠 Homework</h4>\r\n<p>Do this at home, outside the 2-hour class. Four questions; the last is a stretch.</p>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Homework 1.</b> Given <code>income = 15</code> (in millions), create <code>rate</code> (a float): <code>&lt;= 11</code> → <code>0.0</code>; <code>&lt;= 20</code> → <code>0.1</code>; otherwise → <code>0.2</code>.</span>\r\n<template class=\"st\">income = 15\r\n# create rate with if/elif/else\r\n</template>\r\n<template class=\"ts\">assert rate == 0.1\r\n</template></div>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Homework 2.</b> Given <code>score = 72</code>, create <code>letter</code> (a letter grade): <code>&gt;= 90</code> → <code>\"A\"</code>; <code>&gt;= 80</code> → <code>\"B\"</code>; <code>&gt;= 70</code> → <code>\"C\"</code>; <code>&gt;= 60</code> → <code>\"D\"</code>; otherwise → <code>\"F\"</code>.</span>\r\n<template class=\"st\">score = 72\r\n# create letter with if/elif/else\r\n</template>\r\n<template class=\"ts\">assert letter == \"C\"\r\n</template></div>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Homework 3.</b> Given <code>month = 4</code>, create <code>days</code> = the number of days in the month: February → <code>28</code>; months 4, 6, 9, 11 → <code>30</code>; otherwise → <code>31</code> (hint: <code>month in [4, 6, 9, 11]</code>).</span>\r\n<template class=\"st\">month = 4\r\n# create days with if/elif/else\r\n</template>\r\n<template class=\"ts\">assert days == 30\r\n</template></div>\r\n<div class=\"ex homework stretch\" data-kind=\"py\"><span class=\"exq\"><b>🔥 Homework 4 (stretch).</b> Given a triangle's three sides <code>a = 3</code>, <code>b = 3</code>, <code>c = 5</code>, create <code>kind</code>: if all three sides are equal → <code>\"deu\"</code>; if <b>exactly two</b> are equal → <code>\"can\"</code>; otherwise → <code>\"thuong\"</code>. For this data (a=b) → <code>\"can\"</code>.</span>\r\n<template class=\"st\">a = 3\r\nb = 3\r\nc = 5\r\n# create kind: \"deu\" / \"can\" / \"thuong\"\r\n</template>\r\n<template class=\"ts\">assert kind == \"can\"\r\n</template></div>"}},{"t":{"vi":"Logic boolean & điều kiện lồng nhau","en":"Boolean logic & nested conditions"},"html":{"vi":"<h3>Bài 4 — Logic boolean & điều kiện lồng nhau</h3>\r\n<p>Bài trước bạn ra quyết định với <b>một</b> điều kiện. Đời thật phức tạp hơn: \"đủ 18 tuổi <b>và</b> có bằng lái\", \"cuối tuần <b>hoặc</b> ngày lễ\". Bài này học cách <b>kết hợp nhiều điều kiện</b> và <b>lồng</b> điều kiện vào nhau.</p>\r\n\r\n<h4>1. Ba toán tử logic: <code>and</code>, <code>or</code>, <code>not</code></h4>\r\n<ul>\r\n<li><code>and</code> — đúng khi <b>cả hai</b> vế đều đúng.</li>\r\n<li><code>or</code> — đúng khi <b>ít nhất một</b> vế đúng.</li>\r\n<li><code>not</code> — <b>đảo ngược</b>: <code>not True</code> → <code>False</code>.</li>\r\n</ul>\r\n<pre class=\"run\">print(True and False)   # False — can CA HAI dung\r\nprint(True or False)    # True  — chi can MOT dung\r\nprint(not True)         # False — dao nguoc</pre>\r\n\r\n<h4>2. Bảng chân trị (nhìn là nhớ)</h4>\r\n<table class=\"res\">\r\n<thead><tr><th>A</th><th>B</th><th>A and B</th><th>A or B</th></tr></thead>\r\n<tbody>\r\n<tr><td>True</td><td>True</td><td>True</td><td>True</td></tr>\r\n<tr><td>True</td><td>False</td><td>False</td><td>True</td></tr>\r\n<tr><td>False</td><td>True</td><td>False</td><td>True</td></tr>\r\n<tr><td>False</td><td>False</td><td>False</td><td>False</td></tr>\r\n</tbody>\r\n</table>\r\n<p>Mẹo nhớ: <code>and</code> khó tính (chỉ đúng khi mọi thứ đúng), <code>or</code> dễ tính (chỉ cần một cái đúng).</p>\r\n<pre class=\"run\">age = 25\r\nhas_ticket = True\r\nif age &gt;= 18 and has_ticket:\r\n    print(\"Duoc vao rap\")</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 1.</b> Cho <code>age = 25</code> và <code>has_ticket = True</code>. Tạo <code>can_enter</code> = <code>True</code> nếu <b>vừa</b> đủ 18 tuổi trở lên <b>vừa</b> có vé (dùng <code>and</code>).</span>\r\n<template class=\"st\">age = 25\r\nhas_ticket = True\r\n# tao can_enter = age >= 18 VA has_ticket\r\n</template>\r\n<template class=\"ts\">assert can_enter is True\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 2.</b> Cho <code>is_weekend = False</code> và <code>is_holiday = True</code>. Tạo <code>day_off</code> = <code>True</code> nếu <b>cuối tuần</b> hoặc <b>ngày lễ</b> (dùng <code>or</code>).</span>\r\n<template class=\"st\">is_weekend = False\r\nis_holiday = True\r\n# tao day_off = cuoi tuan HOAC ngay le\r\n</template>\r\n<template class=\"ts\">assert day_off is True\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 3.</b> Cho <code>is_busy = False</code>. Tạo <code>is_free</code> = đảo ngược của <code>is_busy</code> (dùng <code>not</code>).</span>\r\n<template class=\"st\">is_busy = False\r\n# tao is_free = not is_busy\r\n</template>\r\n<template class=\"ts\">assert is_free is True\r\n</template></div>\r\n\r\n<h4>3. So sánh nối chuỗi: <code>0 &lt;= x &lt;= 100</code></h4>\r\n<p>Python cho phép viết khoảng gọn như toán học. Rất tiện để kiểm tra một giá trị có nằm trong khoảng hợp lệ không.</p>\r\n<pre class=\"run\">score = 75\r\nprint(0 &lt;= score &lt;= 100)   # True — score nam trong [0, 100]\r\n# tuong duong: score &gt;= 0 and score &lt;= 100</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 4.</b> Cho <code>score = 75</code>. Tạo <code>is_valid</code> = <code>True</code> nếu <code>score</code> nằm trong khoảng từ 0 đến 100 (dùng so sánh nối chuỗi hoặc <code>and</code>).</span>\r\n<template class=\"st\">score = 75\r\n# tao is_valid = 0 <= score <= 100\r\n</template>\r\n<template class=\"ts\">assert is_valid is True\r\n</template></div>\r\n\r\n<h4>4. Kết hợp trong bài toán thật</h4>\r\n<pre class=\"run\">n = 15\r\nif n % 3 == 0 and n % 5 == 0:\r\n    print(\"FizzBuzz\")     # chia het CA 3 va 5</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 5.</b> Cho <code>age = 20</code> và <code>has_license = True</code>. Tạo <code>can_drive</code> = <code>True</code> nếu đủ 18 tuổi <b>và</b> có bằng lái.</span>\r\n<template class=\"st\">age = 20\r\nhas_license = True\r\n# tao can_drive\r\n</template>\r\n<template class=\"ts\">assert can_drive is True\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 6.</b> Cho <code>user = \"admin\"</code> và <code>pw = \"1234\"</code>. Tạo <code>message</code> = <code>\"OK\"</code> nếu <code>user</code> đúng là <code>\"admin\"</code> <b>và</b> <code>pw</code> đúng là <code>\"1234\"</code>, ngược lại <code>\"Wrong\"</code>.</span>\r\n<template class=\"st\">user = \"admin\"\r\npw = \"1234\"\r\n# tao message bang if/else voi and\r\n</template>\r\n<template class=\"ts\">assert message == \"OK\"\r\n</template></div>\r\n\r\n<h4>5. Điều kiện lồng nhau (nested if)</h4>\r\n<p>Bạn có thể đặt một <code>if</code> <b>bên trong</b> một <code>if</code> khác — mỗi mức lồng thụt vào thêm 4 dấu cách. Dùng khi câu hỏi thứ hai chỉ có ý nghĩa <i>sau khi</i> câu hỏi đầu đã đúng.</p>\r\n<pre class=\"run\">score = 8\r\nattendance = True\r\nif score &gt;= 8:\r\n    if attendance:\r\n        scholarship = \"Full scholarship\"\r\n    else:\r\n        scholarship = \"Review attendance\"\r\nelse:\r\n    scholarship = \"Score too low\"\r\nprint(scholarship)    # Duoc hoc bong</pre>\r\n<p><b>Khi nào lồng, khi nào dùng <code>and</code>?</b> Nếu chỉ cần \"cả hai đúng\" thì <code>and</code> gọn hơn. Lồng dùng khi mỗi tầng có <b>xử lý riêng</b> (như ví dụ trên: điểm đủ nhưng thiếu chuyên cần vẫn có nhánh riêng).</p>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 7.</b> Cho <code>score = 8</code> và <code>attendance = True</code>. Dùng <b>if lồng nhau</b> tạo <code>scholarship</code>: nếu <code>score &gt;= 8</code> thì — nếu <code>attendance</code> đúng → <code>\"yes\"</code>, ngược lại → <code>\"review\"</code>; nếu điểm chưa đủ → <code>\"no\"</code>.</span>\r\n<template class=\"st\">score = 8\r\nattendance = True\r\n# dung if long nhau tao scholarship (\"yes\"/\"review\"/\"no\")\r\n</template>\r\n<template class=\"ts\">assert scholarship == \"yes\"\r\n</template></div>\r\n\r\n<h4>6. Biến boolean làm \"cờ\" (flag)</h4>\r\n<p>Lưu kết quả một điều kiện vào biến <code>bool</code> giúp code dễ đọc hơn nhiều:</p>\r\n<pre class=\"run\">age = 20\r\nincome = 8\r\nloan_ok = age &gt;= 18 and income &gt;= 5\r\nif loan_ok:\r\n    print(\"Duoc vay\")</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 8.</b> Cho <code>hours = 10</code> và <code>is_member = True</code>. Tạo cờ <code>gets_discount</code> = <code>True</code> nếu (giờ mở cửa: <code>8 &lt;= hours &lt;= 22</code>) <b>và</b> là thành viên.</span>\r\n<template class=\"st\">hours = 10\r\nis_member = True\r\n# tao co gets_discount\r\n</template>\r\n<template class=\"ts\">assert gets_discount is True\r\n</template></div>\r\n\r\n<h4>7. Giá trị \"giả\" (falsy) & viết gọn</h4>\r\n<p>Trong điều kiện, một số giá trị được coi là <b>sai (falsy)</b> dù không phải <code>False</code>: số <code>0</code>, chuỗi rỗng <code>\"\"</code>, danh sách rỗng <code>[]</code>, và <code>None</code>. Mọi thứ khác là <b>đúng (truthy)</b>.</p>\r\n<pre class=\"run\">name = \"\"\r\nif name:\r\n    print(\"Co ten\")\r\nelse:\r\n    print(\"Chua nhap ten\")   # chay, vi \"\" la falsy</pre>\r\n<p>Nhờ vậy có thể viết gọn <code>if name:</code> thay cho <code>if name != \"\":</code>.</p>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 9.</b> Cho <code>cart = []</code> (danh sách rỗng). Tạo <code>is_empty</code> = <code>True</code> nếu giỏ hàng rỗng (gợi ý: <code>not cart</code> — danh sách rỗng là falsy).</span>\r\n<template class=\"st\">cart = []\r\n# tao is_empty = gio hang co rong khong?\r\n</template>\r\n<template class=\"ts\">assert is_empty is True\r\n</template></div>\r\n\r\n<h4>8. Những lỗi thường gặp</h4>\r\n<ul>\r\n<li><b>Dùng <code>&amp;&amp;</code>, <code>||</code>, <code>!</code></b> như các ngôn ngữ khác — Python dùng chữ <code>and</code>, <code>or</code>, <code>not</code>.</li>\r\n<li><b>Quên rằng <code>and</code> \"khó tính\" hơn <code>or</code>:</b> khi trộn cả hai, dùng ngoặc cho rõ: <code>(a and b) or c</code>.</li>\r\n<li><b>Lồng quá sâu</b> (3–4 tầng if) → khó đọc; thường có thể gộp bằng <code>and</code> hoặc tách hàm (học ở bài về hàm).</li>\r\n</ul>\r\n\r\n<div class=\"recap\">Ghi nhớ bài 4: <code>and</code> (cả hai đúng) · <code>or</code> (ít nhất một đúng) · <code>not</code> (đảo) · so sánh nối chuỗi <code>0 &lt;= x &lt;= 100</code> · <code>if</code> lồng nhau khi mỗi tầng cần xử lý riêng · giá trị falsy (<code>0, \"\", [], None</code>) · lưu điều kiện vào biến bool (cờ). Bài sau: danh sách (list) và chỉ số — cách lưu <b>nhiều</b> giá trị.</div>\r\n\r\n<div class=\"ex stretch\" data-kind=\"py\"><span class=\"exq\"><b>🔥 Thử thách.</b> Cho <code>age = 70</code>. Tạo <code>price</code> (giá vé): dưới 6 tuổi → <code>0</code>; dưới 18 <b>hoặc</b> từ 60 trở lên → <code>50</code>; còn lại → <code>100</code>. <i>Xét trẻ nhỏ trước, rồi nhóm ưu đãi.</i></span>\r\n<template class=\"st\">age = 70\r\n# tao price bang if/elif/else (co dung 'or')\r\n</template>\r\n<template class=\"ts\">assert price == 50\r\n</template></div>\r\n\r\n<h4>🏠 Bài tập về nhà</h4>\r\n<p>Làm ở nhà, không tính vào 2 giờ trên lớp. Bốn câu, câu cuối là thử thách.</p>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Bài về nhà 1.</b> Cho <code>year = 2000</code>. Tạo <code>is_leap</code> = <code>True</code> nếu là năm nhuận: chia hết cho 4 <b>và</b> (không chia hết 100 <b>hoặc</b> chia hết 400). Nhớ dùng ngoặc cho đúng thứ tự.</span>\r\n<template class=\"st\">year = 2000\r\n# tao is_leap = nam nhuan?\r\n</template>\r\n<template class=\"ts\">assert is_leap is True\r\n</template></div>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Bài về nhà 2.</b> Cho <code>temp = 25</code>. Tạo <code>comfortable</code> = <code>True</code> nếu nhiệt độ dễ chịu, tức trong khoảng <code>20 &lt;= temp &lt;= 26</code>.</span>\r\n<template class=\"st\">temp = 25\r\n# tao comfortable\r\n</template>\r\n<template class=\"ts\">assert comfortable is True\r\n</template></div>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Bài về nhà 3.</b> Cho <code>age = 20</code>, <code>has_ticket = True</code>, <code>is_vip = False</code>. Tạo <code>can_enter</code> = <code>True</code> nếu đủ 18 tuổi <b>và</b> (có vé <b>hoặc</b> là VIP). Nhớ dùng ngoặc.</span>\r\n<template class=\"st\">age = 20\r\nhas_ticket = True\r\nis_vip = False\r\n# tao can_enter\r\n</template>\r\n<template class=\"ts\">assert can_enter is True\r\n</template></div>\r\n<div class=\"ex homework stretch\" data-kind=\"py\"><span class=\"exq\"><b>🔥 Bài về nhà 4 (thử thách).</b> Cho <code>a = 5</code>, <code>b = 5</code>, <code>c = 8</code> là ba cạnh. Tạo <code>can_form</code> = <code>True</code> nếu chúng tạo được tam giác: <b>tổng hai cạnh bất kỳ phải lớn hơn cạnh còn lại</b> (cả ba điều kiện đều đúng). Với dữ liệu này → <code>True</code>.</span>\r\n<template class=\"st\">a = 5\r\nb = 5\r\nc = 8\r\n# tao can_form: tong hai canh bat ky > canh con lai\r\n</template>\r\n<template class=\"ts\">assert can_form is True\r\n</template></div>","en":"<h3>Lesson 4 — Boolean logic & nested conditions</h3>\r\n<p>Last lesson you made decisions with <b>one</b> condition. Real life is messier: \"at least 18 <b>and</b> has a license\", \"weekend <b>or</b> holiday\". This lesson covers <b>combining conditions</b> and <b>nesting</b> them.</p>\r\n\r\n<h4>1. Three logical operators: <code>and</code>, <code>or</code>, <code>not</code></h4>\r\n<ul>\r\n<li><code>and</code> — true when <b>both</b> sides are true.</li>\r\n<li><code>or</code> — true when <b>at least one</b> side is true.</li>\r\n<li><code>not</code> — <b>flips</b> it: <code>not True</code> → <code>False</code>.</li>\r\n</ul>\r\n<pre class=\"run\">print(True and False)   # False — needs BOTH true\r\nprint(True or False)    # True  — needs just ONE true\r\nprint(not True)         # False — flipped</pre>\r\n\r\n<h4>2. Truth table (see it, remember it)</h4>\r\n<table class=\"res\">\r\n<thead><tr><th>A</th><th>B</th><th>A and B</th><th>A or B</th></tr></thead>\r\n<tbody>\r\n<tr><td>True</td><td>True</td><td>True</td><td>True</td></tr>\r\n<tr><td>True</td><td>False</td><td>False</td><td>True</td></tr>\r\n<tr><td>False</td><td>True</td><td>False</td><td>True</td></tr>\r\n<tr><td>False</td><td>False</td><td>False</td><td>False</td></tr>\r\n</tbody>\r\n</table>\r\n<p>Memory tip: <code>and</code> is picky (true only when everything is true), <code>or</code> is easy-going (one true is enough).</p>\r\n<pre class=\"run\">age = 25\r\nhas_ticket = True\r\nif age &gt;= 18 and has_ticket:\r\n    print(\"Come into the cinema\")</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 1.</b> Given <code>age = 25</code> and <code>has_ticket = True</code>, create <code>can_enter</code> = <code>True</code> if <b>both</b> at least 18 <b>and</b> has a ticket (use <code>and</code>).</span>\r\n<template class=\"st\">age = 25\r\nhas_ticket = True\r\n# create can_enter = age >= 18 AND has_ticket\r\n</template>\r\n<template class=\"ts\">assert can_enter is True\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 2.</b> Given <code>is_weekend = False</code> and <code>is_holiday = True</code>, create <code>day_off</code> = <code>True</code> if <b>weekend</b> or <b>holiday</b> (use <code>or</code>).</span>\r\n<template class=\"st\">is_weekend = False\r\nis_holiday = True\r\n# create day_off = weekend OR holiday\r\n</template>\r\n<template class=\"ts\">assert day_off is True\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 3.</b> Given <code>is_busy = False</code>, create <code>is_free</code> = the opposite of <code>is_busy</code> (use <code>not</code>).</span>\r\n<template class=\"st\">is_busy = False\r\n# create is_free = not is_busy\r\n</template>\r\n<template class=\"ts\">assert is_free is True\r\n</template></div>\r\n\r\n<h4>3. Chained comparisons: <code>0 &lt;= x &lt;= 100</code></h4>\r\n<p>Python lets you write ranges compactly, like in math. Handy for checking a value is within a valid range.</p>\r\n<pre class=\"run\">score = 75\r\nprint(0 &lt;= score &lt;= 100)   # True — score is in [0, 100]\r\n# same as: score &gt;= 0 and score &lt;= 100</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 4.</b> Given <code>score = 75</code>, create <code>is_valid</code> = <code>True</code> if <code>score</code> is between 0 and 100 (use a chained comparison or <code>and</code>).</span>\r\n<template class=\"st\">score = 75\r\n# create is_valid = 0 <= score <= 100\r\n</template>\r\n<template class=\"ts\">assert is_valid is True\r\n</template></div>\r\n\r\n<h4>4. Combining in a real problem</h4>\r\n<pre class=\"run\">n = 15\r\nif n % 3 == 0 and n % 5 == 0:\r\n    print(\"FizzBuzz\")     # divisible by BOTH 3 and 5</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 5.</b> Given <code>age = 20</code> and <code>has_license = True</code>, create <code>can_drive</code> = <code>True</code> if at least 18 <b>and</b> has a license.</span>\r\n<template class=\"st\">age = 20\r\nhas_license = True\r\n# create can_drive\r\n</template>\r\n<template class=\"ts\">assert can_drive is True\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 6.</b> Given <code>user = \"admin\"</code> and <code>pw = \"1234\"</code>, create <code>message</code> = <code>\"OK\"</code> if <code>user</code> is exactly <code>\"admin\"</code> <b>and</b> <code>pw</code> is exactly <code>\"1234\"</code>, otherwise <code>\"Wrong\"</code>.</span>\r\n<template class=\"st\">user = \"admin\"\r\npw = \"1234\"\r\n# create message with if/else and 'and'\r\n</template>\r\n<template class=\"ts\">assert message == \"OK\"\r\n</template></div>\r\n\r\n<h4>5. Nested conditions (nested if)</h4>\r\n<p>You can put an <code>if</code> <b>inside</b> another <code>if</code> — each nesting level indents 4 more spaces. Use it when the second question only makes sense <i>after</i> the first is true.</p>\r\n<pre class=\"run\">score = 8\r\nattendance = True\r\nif score &gt;= 8:\r\n    if attendance:\r\n        scholarship = \"Full scholarship\"\r\n    else:\r\n        scholarship = \"Review attendance\"\r\nelse:\r\n    scholarship = \"Score too low\"\r\nprint(scholarship)    # Full scholarship</pre>\r\n<p><b>When to nest vs. use <code>and</code>?</b> If you just need \"both true\", <code>and</code> is cleaner. Nest when each level needs its <b>own handling</b> (like above: score high enough but low attendance still gets its own branch).</p>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 7.</b> Given <code>score = 8</code> and <code>attendance = True</code>, use a <b>nested if</b> to create <code>scholarship</code>: if <code>score &gt;= 8</code> then — if <code>attendance</code> is true → <code>\"yes\"</code>, else → <code>\"review\"</code>; if score too low → <code>\"no\"</code>.</span>\r\n<template class=\"st\">score = 8\r\nattendance = True\r\n# use a nested if to create scholarship (\"yes\"/\"review\"/\"no\")\r\n</template>\r\n<template class=\"ts\">assert scholarship == \"yes\"\r\n</template></div>\r\n\r\n<h4>6. Boolean variables as flags</h4>\r\n<p>Storing a condition's result in a <code>bool</code> variable makes code much more readable:</p>\r\n<pre class=\"run\">age = 20\r\nincome = 8\r\nloan_ok = age &gt;= 18 and income &gt;= 5\r\nif loan_ok:\r\n    print(\"Loan approved\")</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 8.</b> Given <code>hours = 10</code> and <code>is_member = True</code>, create a flag <code>gets_discount</code> = <code>True</code> if (open hours: <code>8 &lt;= hours &lt;= 22</code>) <b>and</b> a member.</span>\r\n<template class=\"st\">hours = 10\r\nis_member = True\r\n# create flag gets_discount\r\n</template>\r\n<template class=\"ts\">assert gets_discount is True\r\n</template></div>\r\n\r\n<h4>7. \"Falsy\" values & shortcuts</h4>\r\n<p>In a condition, some values count as <b>false (falsy)</b> even though they aren't <code>False</code>: the number <code>0</code>, the empty string <code>\"\"</code>, an empty list <code>[]</code>, and <code>None</code>. Everything else is <b>truthy</b>.</p>\r\n<pre class=\"run\">name = \"\"\r\nif name:\r\n    print(\"Has a name\")\r\nelse:\r\n    print(\"No name yet\")   # runs, because \"\" is falsy</pre>\r\n<p>This lets you write <code>if name:</code> instead of <code>if name != \"\":</code>.</p>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 9.</b> Given <code>cart = []</code> (an empty list), create <code>is_empty</code> = <code>True</code> if the cart is empty (hint: <code>not cart</code> — an empty list is falsy).</span>\r\n<template class=\"st\">cart = []\r\n# create is_empty = is the cart empty?\r\n</template>\r\n<template class=\"ts\">assert is_empty is True\r\n</template></div>\r\n\r\n<h4>8. Common mistakes</h4>\r\n<ul>\r\n<li><b>Using <code>&amp;&amp;</code>, <code>||</code>, <code>!</code></b> like other languages — Python uses the words <code>and</code>, <code>or</code>, <code>not</code>.</li>\r\n<li><b>Forgetting <code>and</code> is \"pickier\" than <code>or</code>:</b> when mixing both, use parentheses for clarity: <code>(a and b) or c</code>.</li>\r\n<li><b>Nesting too deep</b> (3–4 levels of if) → hard to read; often you can merge with <code>and</code> or split into functions (later lesson).</li>\r\n</ul>\r\n\r\n<div class=\"recap\">Recap of lesson 4: <code>and</code> (both true) · <code>or</code> (at least one) · <code>not</code> (flip) · chained comparison <code>0 &lt;= x &lt;= 100</code> · nested <code>if</code> when each level needs its own handling · falsy values (<code>0, \"\", [], None</code>) · store conditions in bool variables (flags). Next: lists and indexing — how to store <b>many</b> values.</div>\r\n\r\n<div class=\"ex stretch\" data-kind=\"py\"><span class=\"exq\"><b>🔥 Stretch.</b> Given <code>age = 70</code>, create <code>price</code> (ticket price): under 6 → <code>0</code>; under 18 <b>or</b> 60 and above → <code>50</code>; otherwise → <code>100</code>. <i>Check young children first, then the discount group.</i></span>\r\n<template class=\"st\">age = 70\r\n# create price with if/elif/else (use 'or')\r\n</template>\r\n<template class=\"ts\">assert price == 50\r\n</template></div>\r\n\r\n<h4>🏠 Homework</h4>\r\n<p>Do this at home, outside the 2-hour class. Four questions; the last is a stretch.</p>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Homework 1.</b> Given <code>year = 2000</code>, create <code>is_leap</code> = <code>True</code> if it's a leap year: divisible by 4 <b>and</b> (not divisible by 100 <b>or</b> divisible by 400). Use parentheses to get the order right.</span>\r\n<template class=\"st\">year = 2000\r\n# create is_leap = is it a leap year?\r\n</template>\r\n<template class=\"ts\">assert is_leap is True\r\n</template></div>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Homework 2.</b> Given <code>temp = 25</code>, create <code>comfortable</code> = <code>True</code> if the temperature is comfortable, i.e. in the range <code>20 &lt;= temp &lt;= 26</code>.</span>\r\n<template class=\"st\">temp = 25\r\n# create comfortable\r\n</template>\r\n<template class=\"ts\">assert comfortable is True\r\n</template></div>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Homework 3.</b> Given <code>age = 20</code>, <code>has_ticket = True</code>, <code>is_vip = False</code>, create <code>can_enter</code> = <code>True</code> if at least 18 <b>and</b> (has a ticket <b>or</b> is a VIP). Remember the parentheses.</span>\r\n<template class=\"st\">age = 20\r\nhas_ticket = True\r\nis_vip = False\r\n# create can_enter\r\n</template>\r\n<template class=\"ts\">assert can_enter is True\r\n</template></div>\r\n<div class=\"ex homework stretch\" data-kind=\"py\"><span class=\"exq\"><b>🔥 Homework 4 (stretch).</b> Given sides <code>a = 5</code>, <code>b = 5</code>, <code>c = 8</code>, create <code>can_form</code> = <code>True</code> if they can form a triangle: <b>the sum of any two sides must be greater than the third</b> (all three conditions true). For this data → <code>True</code>.</span>\r\n<template class=\"st\">a = 5\r\nb = 5\r\nc = 8\r\n# create can_form: sum of any two sides > the third\r\n</template>\r\n<template class=\"ts\">assert can_form is True\r\n</template></div>"}},{"t":{"vi":"Danh sách (list) & chỉ số","en":"Lists & indexing"},"html":{"vi":"<h3>Bài 5 — Danh sách (list) & chỉ số</h3>\r\n<p>Đến giờ mỗi biến chỉ giữ <b>một</b> giá trị. Nhưng đời thật đầy những <b>bộ sưu tập</b>: danh sách học viên, giỏ hàng, điểm số của một lớp. <b>List</b> (danh sách/mảng) là cách Python lưu <b>nhiều</b> giá trị trong một biến — và <b>chỉ số (index)</b> là cách bạn với tới từng phần tử. Đây là một trong những kỹ năng quan trọng nhất của cả khóa.</p>\r\n\r\n<h4>1. Tạo một danh sách</h4>\r\n<p>Đặt các giá trị trong dấu ngoặc vuông <code>[ ]</code>, cách nhau bằng dấu phẩy:</p>\r\n<pre class=\"run\">diem = [8, 6, 9, 7]\r\nten = [\"An\", \"Binh\", \"Chi\"]\r\nrong = [1, \"hai\", 3.0, True]   # co the tron kieu, nhung thuong nen cung kieu\r\nprint(diem)\r\nprint(len(diem))               # 4 — so phan tu</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 1.</b> Tạo danh sách <code>nums</code> gồm bốn số <code>10, 20, 30, 40</code>. Tạo <code>count</code> = số phần tử (dùng <code>len</code>).</span>\r\n<template class=\"st\"># tao nums va count\r\n</template>\r\n<template class=\"ts\">assert nums == [10, 20, 30, 40]\r\nassert count == 4\r\n</template></div>\r\n\r\n<h4>2. Chỉ số (index) — với tới từng phần tử</h4>\r\n<p>Giống chuỗi: mỗi phần tử có một <b>chỉ số đếm từ 0</b>. Chỉ số âm đếm ngược từ cuối.</p>\r\n<figure class=\"diagram\">\r\n<svg viewBox=\"0 0 470 165\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"IBM Plex Mono, monospace\" font-size=\"13\">\r\n  <text x=\"235\" y=\"18\" text-anchor=\"middle\" fill=\"#8FA0BC\">nums = [10, 20, 30, 40]</text>\r\n  <g>\r\n    <rect x=\"20\" y=\"38\" width=\"95\" height=\"48\" rx=\"6\" fill=\"#121C30\" stroke=\"#7FD1C0\"/>\r\n    <text x=\"67\" y=\"68\" text-anchor=\"middle\" fill=\"#E8E4D8\" font-size=\"16\">10</text>\r\n    <text x=\"67\" y=\"108\" text-anchor=\"middle\" fill=\"#F5B942\">0</text>\r\n    <text x=\"67\" y=\"130\" text-anchor=\"middle\" fill=\"#E2604C\">-4</text>\r\n  </g>\r\n  <g>\r\n    <rect x=\"125\" y=\"38\" width=\"95\" height=\"48\" rx=\"6\" fill=\"#121C30\" stroke=\"#7FD1C0\"/>\r\n    <text x=\"172\" y=\"68\" text-anchor=\"middle\" fill=\"#E8E4D8\" font-size=\"16\">20</text>\r\n    <text x=\"172\" y=\"108\" text-anchor=\"middle\" fill=\"#F5B942\">1</text>\r\n    <text x=\"172\" y=\"130\" text-anchor=\"middle\" fill=\"#E2604C\">-3</text>\r\n  </g>\r\n  <g>\r\n    <rect x=\"230\" y=\"38\" width=\"95\" height=\"48\" rx=\"6\" fill=\"#121C30\" stroke=\"#7FD1C0\"/>\r\n    <text x=\"277\" y=\"68\" text-anchor=\"middle\" fill=\"#E8E4D8\" font-size=\"16\">30</text>\r\n    <text x=\"277\" y=\"108\" text-anchor=\"middle\" fill=\"#F5B942\">2</text>\r\n    <text x=\"277\" y=\"130\" text-anchor=\"middle\" fill=\"#E2604C\">-2</text>\r\n  </g>\r\n  <g>\r\n    <rect x=\"335\" y=\"38\" width=\"95\" height=\"48\" rx=\"6\" fill=\"#121C30\" stroke=\"#7FD1C0\"/>\r\n    <text x=\"382\" y=\"68\" text-anchor=\"middle\" fill=\"#E8E4D8\" font-size=\"16\">40</text>\r\n    <text x=\"382\" y=\"108\" text-anchor=\"middle\" fill=\"#F5B942\">3</text>\r\n    <text x=\"382\" y=\"130\" text-anchor=\"middle\" fill=\"#E2604C\">-1</text>\r\n  </g>\r\n  <text x=\"18\" y=\"112\" text-anchor=\"end\" fill=\"#F5B942\" font-size=\"11\">index →</text>\r\n  <text x=\"18\" y=\"132\" text-anchor=\"end\" fill=\"#E2604C\" font-size=\"11\">âm →</text>\r\n</svg>\r\n<figcaption>Chỉ số dương đếm từ 0 (trái sang); chỉ số âm đếm từ -1 (phải sang). <code>nums[0]</code> = 10, <code>nums[-1]</code> = 40.</figcaption>\r\n</figure>\r\n<pre class=\"run\">nums = [10, 20, 30, 40]\r\nprint(nums[0])    # 10 — phan tu dau\r\nprint(nums[2])    # 30\r\nprint(nums[-1])   # 40 — phan tu cuoi\r\n# print(nums[4])  # LOI: IndexError — khong co chi so 4</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 2.</b> Cho <code>nums = [10, 20, 30, 40]</code>. Lấy phần tử đầu vào <code>first</code> và phần tử cuối vào <code>last</code> (dùng chỉ số).</span>\r\n<template class=\"st\">nums = [10, 20, 30, 40]\r\n# tao first va last\r\n</template>\r\n<template class=\"ts\">assert first == 10\r\nassert last == 40\r\n</template></div>\r\n\r\n<h4>3. Cắt danh sách (slicing)</h4>\r\n<p>Giống chuỗi: <code>lst[bat_dau:ket_thuc]</code> lấy từ <code>bat_dau</code> đến <b>ngay trước</b> <code>ket_thuc</code>, trả về một <b>danh sách mới</b>.</p>\r\n<pre class=\"run\">nums = [10, 20, 30, 40, 50]\r\nprint(nums[1:3])   # [20, 30]\r\nprint(nums[:2])    # [10, 20]\r\nprint(nums[-2:])   # [40, 50]</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 3.</b> Cho <code>nums = [10, 20, 30, 40]</code>. Lấy hai phần tử đầu vào <code>first_two</code>.</span>\r\n<template class=\"st\">nums = [10, 20, 30, 40]\r\n# tao first_two = hai phan tu dau\r\n</template>\r\n<template class=\"ts\">assert first_two == [10, 20]\r\n</template></div>\r\n\r\n<h4>4. Danh sách có thể SỬA (mutable)</h4>\r\n<p>Khác với chuỗi, bạn <b>được phép</b> đổi một phần tử bằng cách gán vào chỉ số của nó:</p>\r\n<pre class=\"run\">nums = [10, 20, 30]\r\nnums[0] = 99\r\nprint(nums)        # [99, 20, 30]</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 4.</b> Cho <code>nums = [10, 20, 30, 40]</code>. Đổi phần tử <b>đầu tiên</b> thành <code>99</code> (gán vào <code>nums[0]</code>).</span>\r\n<template class=\"st\">nums = [10, 20, 30, 40]\r\n# doi phan tu dau thanh 99\r\n</template>\r\n<template class=\"ts\">assert nums == [99, 20, 30, 40]\r\n</template></div>\r\n\r\n<h4>5. Thêm & xóa phần tử</h4>\r\n<pre class=\"run\">gio_hang = [\"ao\", \"quan\"]\r\ngio_hang.append(\"mu\")      # them vao CUOI -> [\"ao\",\"quan\",\"mu\"]\r\ngio_hang.insert(0, \"giay\") # chen vao vi tri 0\r\nprint(gio_hang)            # [\"giay\",\"ao\",\"quan\",\"mu\"]\r\nlay_ra = gio_hang.pop()    # lay & bo phan tu CUOI -> \"mu\"\r\ngio_hang.remove(\"ao\")      # xoa phan tu co gia tri \"ao\"\r\nprint(gio_hang, lay_ra)</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 5.</b> Cho <code>fruits = [\"apple\", \"banana\"]</code>. Thêm <code>\"cherry\"</code> vào cuối (dùng <code>append</code>).</span>\r\n<template class=\"st\">fruits = [\"apple\", \"banana\"]\r\n# them \"cherry\" vao cuoi\r\n</template>\r\n<template class=\"ts\">assert fruits == [\"apple\", \"banana\", \"cherry\"]\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 6.</b> Cho <code>colors = [\"red\", \"green\", \"blue\"]</code>. Dùng <code>pop()</code> lấy phần tử cuối ra biến <code>removed</code> (danh sách còn lại 2 phần tử).</span>\r\n<template class=\"st\">colors = [\"red\", \"green\", \"blue\"]\r\n# tao removed = colors.pop()\r\n</template>\r\n<template class=\"ts\">assert removed == \"blue\"\r\nassert colors == [\"red\", \"green\"]\r\n</template></div>\r\n\r\n<h4>6. Kiểm tra \"thuộc về\" với <code>in</code></h4>\r\n<pre class=\"run\">mau = [\"red\", \"green\"]\r\nprint(\"red\" in mau)      # True\r\nprint(\"black\" in mau)    # False</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 7.</b> Cho <code>colors = [\"red\", \"green\"]</code>. Tạo <code>has_red</code> = <code>True</code> nếu <code>\"red\"</code> có trong danh sách.</span>\r\n<template class=\"st\">colors = [\"red\", \"green\"]\r\n# tao has_red\r\n</template>\r\n<template class=\"ts\">assert has_red is True\r\n</template></div>\r\n\r\n<h4>7. Vài hàm dựng sẵn cực tiện</h4>\r\n<pre class=\"run\">diem = [8, 6, 9, 7]\r\nprint(sum(diem))    # 30 — tong\r\nprint(max(diem))    # 9  — lon nhat\r\nprint(min(diem))    # 6  — nho nhat\r\nprint(len(diem))    # 4  — so phan tu</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 8.</b> Cho <code>scores = [8, 6, 9, 7]</code>. Tạo <code>total</code> = tổng (dùng <code>sum</code>) và <code>best</code> = điểm cao nhất (dùng <code>max</code>).</span>\r\n<template class=\"st\">scores = [8, 6, 9, 7]\r\n# tao total va best\r\n</template>\r\n<template class=\"ts\">assert total == 30\r\nassert best == 9\r\n</template></div>\r\n\r\n<h4>8. Vài mẹo & luyện tập tổng hợp</h4>\r\n<p>Hai mẹo nhỏ rất hay dùng với danh sách:</p>\r\n<ul>\r\n<li>Nối hai danh sách bằng <code>+</code>: <code>[1, 2] + [3, 4]</code> → <code>[1, 2, 3, 4]</code>.</li>\r\n<li>Đảo ngược bằng lát cắt <code>[::-1]</code>: <code>[1, 2, 3][::-1]</code> → <code>[3, 2, 1]</code>.</li>\r\n</ul>\r\n<pre class=\"run\">a = [1, 2]\r\nb = [3, 4]\r\nprint(a + b)             # [1, 2, 3, 4]\r\nprint([1, 2, 3][::-1])   # [3, 2, 1]</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 9.</b> Cho <code>nums = [4, 2, 7, 1]</code>. Tạo <code>avg</code> = giá trị trung bình (tổng chia số phần tử) → <code>3.5</code>.</span>\r\n<template class=\"st\">nums = [4, 2, 7, 1]\r\n# tao avg = trung binh cong\r\n</template>\r\n<template class=\"ts\">assert avg == 3.5\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 10.</b> Cho <code>a = [1, 2]</code> và <code>b = [3, 4]</code>. Tạo <code>combined</code> = nối hai danh sách → <code>[1, 2, 3, 4]</code>.</span>\r\n<template class=\"st\">a = [1, 2]\r\nb = [3, 4]\r\n# tao combined\r\n</template>\r\n<template class=\"ts\">assert combined == [1, 2, 3, 4]\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 11.</b> Cho <code>nums = [1, 2, 3, 4]</code>. Tạo <code>reversed_list</code> = danh sách đảo ngược (dùng <code>[::-1]</code>) → <code>[4, 3, 2, 1]</code>.</span>\r\n<template class=\"st\">nums = [1, 2, 3, 4]\r\n# tao reversed_list bang [::-1]\r\n</template>\r\n<template class=\"ts\">assert reversed_list == [4, 3, 2, 1]\r\n</template></div>\r\n<div class=\"ex stretch\" data-kind=\"py\"><span class=\"exq\"><b>🔥 Thử thách.</b> Cho <code>scores = [5, 3, 9, 1, 7]</code>. Đếm bao nhiêu điểm <b>cao hơn trung bình</b> vào <code>above_avg</code>. Trung bình = 5; các điểm &gt; 5 là 9 và 7 → <code>above_avg = 2</code>. (Gợi ý: tính trung bình trước, rồi đếm.)</span>\r\n<template class=\"st\">scores = [5, 3, 9, 1, 7]\r\n# tinh trung binh, roi dem so diem cao hon trung binh\r\n</template>\r\n<template class=\"ts\">assert above_avg == 2\r\n</template></div>\r\n\r\n<div class=\"recap\">Ghi nhớ bài 5: <code>[ ]</code> tạo danh sách · <code>len()</code> đếm phần tử · chỉ số từ 0, âm đếm từ cuối, quá tay → <code>IndexError</code> · <code>[a:b]</code> cắt ra danh sách mới · danh sách <b>sửa được</b>: <code>lst[i] = x</code> · <code>.append/.insert/.pop/.remove</code> thêm xóa · <code>in</code> kiểm tra chứa · <code>sum/max/min/len</code>. Bài sau: dùng vòng lặp <code>for</code> để duyệt qua từng phần tử.</div>\r\n\r\n<h4>🏠 Bài tập về nhà</h4>\r\n<p>Làm ở nhà, không tính vào 2 giờ trên lớp. Bốn câu, câu cuối là thử thách.</p>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Bài về nhà 1.</b> Cho <code>nums = [5, 3, 8, 1]</code>. Tạo <code>sorted_nums</code> = danh sách đã sắp xếp tăng dần (dùng hàm <code>sorted()</code>, không đổi danh sách gốc).</span>\r\n<template class=\"st\">nums = [5, 3, 8, 1]\r\n# tao sorted_nums\r\n</template>\r\n<template class=\"ts\">assert sorted_nums == [1, 3, 5, 8]\r\nassert nums == [5, 3, 8, 1]\r\n</template></div>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Bài về nhà 2.</b> Cho <code>words = [\"banana\", \"apple\", \"cherry\"]</code>. Tạo <code>joined</code> = các từ đã sắp xếp, nối bằng dấu phẩy → <code>\"apple,banana,cherry\"</code> (gợi ý: <code>sorted()</code> rồi <code>\",\".join(...)</code>).</span>\r\n<template class=\"st\">words = [\"banana\", \"apple\", \"cherry\"]\r\n# tao joined\r\n</template>\r\n<template class=\"ts\">assert joined == \"apple,banana,cherry\"\r\n</template></div>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Bài về nhà 3.</b> Cho <code>nums = [5, 3, 8, 1, 9]</code>. Tạo <code>second_largest</code> = số lớn thứ nhì (gợi ý: sắp xếp rồi lấy <code>[-2]</code>).</span>\r\n<template class=\"st\">nums = [5, 3, 8, 1, 9]\r\n# tao second_largest\r\n</template>\r\n<template class=\"ts\">assert second_largest == 8\r\n</template></div>\r\n<div class=\"ex homework stretch\" data-kind=\"py\"><span class=\"exq\"><b>🔥 Bài về nhà 4 (thử thách).</b> Cho <code>scores = [8, 6, 9, 7]</code>. Tính <code>avg_no_min</code> = điểm trung bình sau khi <b>bỏ điểm thấp nhất</b>. Với dữ liệu này: bỏ 6, còn <code>(8+9+7)/3 = 8.0</code>. (Gợi ý: <code>sum</code>, <code>min</code>, <code>len</code>.)</span>\r\n<template class=\"st\">scores = [8, 6, 9, 7]\r\n# tao avg_no_min = trung binh sau khi bo diem thap nhat\r\n</template>\r\n<template class=\"ts\">assert avg_no_min == 8.0\r\n</template></div>","en":"<h3>Lesson 5 — Lists & indexing</h3>\r\n<p>So far each variable holds <b>one</b> value. But real life is full of <b>collections</b>: a list of students, a shopping cart, a class's scores. A <b>list</b> (array) is how Python stores <b>many</b> values in one variable — and the <b>index</b> is how you reach each element. This is one of the most important skills in the whole course.</p>\r\n\r\n<h4>1. Creating a list</h4>\r\n<p>Put values inside square brackets <code>[ ]</code>, separated by commas:</p>\r\n<pre class=\"run\">diem = [8, 6, 9, 7]\r\nten = [\"An\", \"Binh\", \"Chi\"]\r\nrong = [1, \"hai\", 3.0, True]   # types can mix, but usually keep them the same\r\nprint(diem)\r\nprint(len(diem))               # 4 — number of elements</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 1.</b> Create a list <code>nums</code> of four numbers <code>10, 20, 30, 40</code>. Create <code>count</code> = the number of elements (use <code>len</code>).</span>\r\n<template class=\"st\"># create nums and count\r\n</template>\r\n<template class=\"ts\">assert nums == [10, 20, 30, 40]\r\nassert count == 4\r\n</template></div>\r\n\r\n<h4>2. Indexing — reaching each element</h4>\r\n<p>Just like strings: each element has an <b>index counting from 0</b>. Negative indexes count back from the end.</p>\r\n<figure class=\"diagram\">\r\n<svg viewBox=\"0 0 470 165\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"IBM Plex Mono, monospace\" font-size=\"13\">\r\n  <text x=\"235\" y=\"18\" text-anchor=\"middle\" fill=\"#8FA0BC\">nums = [10, 20, 30, 40]</text>\r\n  <g>\r\n    <rect x=\"20\" y=\"38\" width=\"95\" height=\"48\" rx=\"6\" fill=\"#121C30\" stroke=\"#7FD1C0\"/>\r\n    <text x=\"67\" y=\"68\" text-anchor=\"middle\" fill=\"#E8E4D8\" font-size=\"16\">10</text>\r\n    <text x=\"67\" y=\"108\" text-anchor=\"middle\" fill=\"#F5B942\">0</text>\r\n    <text x=\"67\" y=\"130\" text-anchor=\"middle\" fill=\"#E2604C\">-4</text>\r\n  </g>\r\n  <g>\r\n    <rect x=\"125\" y=\"38\" width=\"95\" height=\"48\" rx=\"6\" fill=\"#121C30\" stroke=\"#7FD1C0\"/>\r\n    <text x=\"172\" y=\"68\" text-anchor=\"middle\" fill=\"#E8E4D8\" font-size=\"16\">20</text>\r\n    <text x=\"172\" y=\"108\" text-anchor=\"middle\" fill=\"#F5B942\">1</text>\r\n    <text x=\"172\" y=\"130\" text-anchor=\"middle\" fill=\"#E2604C\">-3</text>\r\n  </g>\r\n  <g>\r\n    <rect x=\"230\" y=\"38\" width=\"95\" height=\"48\" rx=\"6\" fill=\"#121C30\" stroke=\"#7FD1C0\"/>\r\n    <text x=\"277\" y=\"68\" text-anchor=\"middle\" fill=\"#E8E4D8\" font-size=\"16\">30</text>\r\n    <text x=\"277\" y=\"108\" text-anchor=\"middle\" fill=\"#F5B942\">2</text>\r\n    <text x=\"277\" y=\"130\" text-anchor=\"middle\" fill=\"#E2604C\">-2</text>\r\n  </g>\r\n  <g>\r\n    <rect x=\"335\" y=\"38\" width=\"95\" height=\"48\" rx=\"6\" fill=\"#121C30\" stroke=\"#7FD1C0\"/>\r\n    <text x=\"382\" y=\"68\" text-anchor=\"middle\" fill=\"#E8E4D8\" font-size=\"16\">40</text>\r\n    <text x=\"382\" y=\"108\" text-anchor=\"middle\" fill=\"#F5B942\">3</text>\r\n    <text x=\"382\" y=\"130\" text-anchor=\"middle\" fill=\"#E2604C\">-1</text>\r\n  </g>\r\n  <text x=\"18\" y=\"112\" text-anchor=\"end\" fill=\"#F5B942\" font-size=\"11\">index →</text>\r\n  <text x=\"18\" y=\"132\" text-anchor=\"end\" fill=\"#E2604C\" font-size=\"11\">neg →</text>\r\n</svg>\r\n<figcaption>Positive indexes count from 0 (left to right); negative from -1 (right to left). <code>nums[0]</code> = 10, <code>nums[-1]</code> = 40.</figcaption>\r\n</figure>\r\n<pre class=\"run\">nums = [10, 20, 30, 40]\r\nprint(nums[0])    # 10 — first element\r\nprint(nums[2])    # 30\r\nprint(nums[-1])   # 40 — last element\r\n# print(nums[4])  # ERROR: IndexError — there is no index 4</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 2.</b> Given <code>nums = [10, 20, 30, 40]</code>, take the first element into <code>first</code> and the last into <code>last</code> (use indexing).</span>\r\n<template class=\"st\">nums = [10, 20, 30, 40]\r\n# create first and last\r\n</template>\r\n<template class=\"ts\">assert first == 10\r\nassert last == 40\r\n</template></div>\r\n\r\n<h4>3. Slicing a list</h4>\r\n<p>Like strings: <code>lst[start:stop]</code> takes from <code>start</code> up to <b>just before</b> <code>stop</code>, returning a <b>new list</b>.</p>\r\n<pre class=\"run\">nums = [10, 20, 30, 40, 50]\r\nprint(nums[1:3])   # [20, 30]\r\nprint(nums[:2])    # [10, 20]\r\nprint(nums[-2:])   # [40, 50]</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 3.</b> Given <code>nums = [10, 20, 30, 40]</code>, take the first two elements into <code>first_two</code>.</span>\r\n<template class=\"st\">nums = [10, 20, 30, 40]\r\n# create first_two = the first two elements\r\n</template>\r\n<template class=\"ts\">assert first_two == [10, 20]\r\n</template></div>\r\n\r\n<h4>4. Lists are MUTABLE</h4>\r\n<p>Unlike strings, you <b>are allowed</b> to change an element by assigning to its index:</p>\r\n<pre class=\"run\">nums = [10, 20, 30]\r\nnums[0] = 99\r\nprint(nums)        # [99, 20, 30]</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 4.</b> Given <code>nums = [10, 20, 30, 40]</code>, change the <b>first</b> element to <code>99</code> (assign to <code>nums[0]</code>).</span>\r\n<template class=\"st\">nums = [10, 20, 30, 40]\r\n# change the first element to 99\r\n</template>\r\n<template class=\"ts\">assert nums == [99, 20, 30, 40]\r\n</template></div>\r\n\r\n<h4>5. Adding & removing elements</h4>\r\n<pre class=\"run\">cart = [\"ao\", \"quan\"]\r\ncart.append(\"mu\")      # add to the END -> [\"ao\",\"quan\",\"mu\"]\r\ncart.insert(0, \"giay\") # insert at position 0\r\nprint(cart)            # [\"giay\",\"ao\",\"quan\",\"mu\"]\r\ntaken = cart.pop()     # take & remove the LAST -> \"mu\"\r\ncart.remove(\"ao\")      # remove the element equal to \"ao\"\r\nprint(cart, taken)</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 5.</b> Given <code>fruits = [\"apple\", \"banana\"]</code>, add <code>\"cherry\"</code> to the end (use <code>append</code>).</span>\r\n<template class=\"st\">fruits = [\"apple\", \"banana\"]\r\n# add \"cherry\" to the end\r\n</template>\r\n<template class=\"ts\">assert fruits == [\"apple\", \"banana\", \"cherry\"]\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 6.</b> Given <code>colors = [\"red\", \"green\", \"blue\"]</code>, use <code>pop()</code> to take the last element into <code>removed</code> (the list is left with 2 elements).</span>\r\n<template class=\"st\">colors = [\"red\", \"green\", \"blue\"]\r\n# create removed = colors.pop()\r\n</template>\r\n<template class=\"ts\">assert removed == \"blue\"\r\nassert colors == [\"red\", \"green\"]\r\n</template></div>\r\n\r\n<h4>6. Membership with <code>in</code></h4>\r\n<pre class=\"run\">mau = [\"red\", \"green\"]\r\nprint(\"red\" in mau)      # True\r\nprint(\"black\" in mau)    # False</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 7.</b> Given <code>colors = [\"red\", \"green\"]</code>, create <code>has_red</code> = <code>True</code> if <code>\"red\"</code> is in the list.</span>\r\n<template class=\"st\">colors = [\"red\", \"green\"]\r\n# create has_red\r\n</template>\r\n<template class=\"ts\">assert has_red is True\r\n</template></div>\r\n\r\n<h4>7. Handy built-in functions</h4>\r\n<pre class=\"run\">diem = [8, 6, 9, 7]\r\nprint(sum(diem))    # 30 — total\r\nprint(max(diem))    # 9  — largest\r\nprint(min(diem))    # 6  — smallest\r\nprint(len(diem))    # 4  — count</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 8.</b> Given <code>scores = [8, 6, 9, 7]</code>, create <code>total</code> = the sum (use <code>sum</code>) and <code>best</code> = the highest score (use <code>max</code>).</span>\r\n<template class=\"st\">scores = [8, 6, 9, 7]\r\n# create total and best\r\n</template>\r\n<template class=\"ts\">assert total == 30\r\nassert best == 9\r\n</template></div>\r\n\r\n<h4>8. A few tips & mixed practice</h4>\r\n<p>Two handy list tricks:</p>\r\n<ul>\r\n<li>Join two lists with <code>+</code>: <code>[1, 2] + [3, 4]</code> → <code>[1, 2, 3, 4]</code>.</li>\r\n<li>Reverse with the slice <code>[::-1]</code>: <code>[1, 2, 3][::-1]</code> → <code>[3, 2, 1]</code>.</li>\r\n</ul>\r\n<pre class=\"run\">a = [1, 2]\r\nb = [3, 4]\r\nprint(a + b)             # [1, 2, 3, 4]\r\nprint([1, 2, 3][::-1])   # [3, 2, 1]</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 9.</b> Given <code>nums = [4, 2, 7, 1]</code>, create <code>avg</code> = the average (sum divided by count) → <code>3.5</code>.</span>\r\n<template class=\"st\">nums = [4, 2, 7, 1]\r\n# create avg = the average\r\n</template>\r\n<template class=\"ts\">assert avg == 3.5\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 10.</b> Given <code>a = [1, 2]</code> and <code>b = [3, 4]</code>, create <code>combined</code> = the two lists joined → <code>[1, 2, 3, 4]</code>.</span>\r\n<template class=\"st\">a = [1, 2]\r\nb = [3, 4]\r\n# create combined\r\n</template>\r\n<template class=\"ts\">assert combined == [1, 2, 3, 4]\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 11.</b> Given <code>nums = [1, 2, 3, 4]</code>, create <code>reversed_list</code> = the reversed list (use <code>[::-1]</code>) → <code>[4, 3, 2, 1]</code>.</span>\r\n<template class=\"st\">nums = [1, 2, 3, 4]\r\n# create reversed_list with [::-1]\r\n</template>\r\n<template class=\"ts\">assert reversed_list == [4, 3, 2, 1]\r\n</template></div>\r\n<div class=\"ex stretch\" data-kind=\"py\"><span class=\"exq\"><b>🔥 Stretch.</b> Given <code>scores = [5, 3, 9, 1, 7]</code>, count how many scores are <b>above the average</b> into <code>above_avg</code>. The average is 5; scores &gt; 5 are 9 and 7 → <code>above_avg = 2</code>. (Hint: compute the average first, then count.)</span>\r\n<template class=\"st\">scores = [5, 3, 9, 1, 7]\r\n# compute the average, then count scores above it\r\n</template>\r\n<template class=\"ts\">assert above_avg == 2\r\n</template></div>\r\n\r\n<div class=\"recap\">Recap of lesson 5: <code>[ ]</code> makes a list · <code>len()</code> counts · index from 0, negatives from the end, out of range → <code>IndexError</code> · <code>[a:b]</code> slices into a new list · lists are <b>mutable</b>: <code>lst[i] = x</code> · <code>.append/.insert/.pop/.remove</code> · <code>in</code> tests membership · <code>sum/max/min/len</code>. Next: the <code>for</code> loop to visit every element.</div>\r\n\r\n<h4>🏠 Homework</h4>\r\n<p>Do this at home, outside the 2-hour class. Four questions; the last is a stretch.</p>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Homework 1.</b> Given <code>nums = [5, 3, 8, 1]</code>, create <code>sorted_nums</code> = the list sorted ascending (use the <code>sorted()</code> function, don't change the original).</span>\r\n<template class=\"st\">nums = [5, 3, 8, 1]\r\n# create sorted_nums\r\n</template>\r\n<template class=\"ts\">assert sorted_nums == [1, 3, 5, 8]\r\nassert nums == [5, 3, 8, 1]\r\n</template></div>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Homework 2.</b> Given <code>words = [\"banana\", \"apple\", \"cherry\"]</code>, create <code>joined</code> = the words sorted, joined by commas → <code>\"apple,banana,cherry\"</code> (hint: <code>sorted()</code> then <code>\",\".join(...)</code>).</span>\r\n<template class=\"st\">words = [\"banana\", \"apple\", \"cherry\"]\r\n# create joined\r\n</template>\r\n<template class=\"ts\">assert joined == \"apple,banana,cherry\"\r\n</template></div>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Homework 3.</b> Given <code>nums = [5, 3, 8, 1, 9]</code>, create <code>second_largest</code> = the second-highest number (hint: sort then take <code>[-2]</code>).</span>\r\n<template class=\"st\">nums = [5, 3, 8, 1, 9]\r\n# create second_largest\r\n</template>\r\n<template class=\"ts\">assert second_largest == 8\r\n</template></div>\r\n<div class=\"ex homework stretch\" data-kind=\"py\"><span class=\"exq\"><b>🔥 Homework 4 (stretch).</b> Given <code>scores = [8, 6, 9, 7]</code>, compute <code>avg_no_min</code> = the average <b>after dropping the lowest score</b>. For this data: drop 6, leaving <code>(8+9+7)/3 = 8.0</code>. (Hint: <code>sum</code>, <code>min</code>, <code>len</code>.)</span>\r\n<template class=\"st\">scores = [8, 6, 9, 7]\r\n# create avg_no_min = average after dropping the lowest score\r\n</template>\r\n<template class=\"ts\">assert avg_no_min == 8.0\r\n</template></div>"}},{"t":{"vi":"Vòng lặp for & range","en":"The for loop & range"},"html":{"vi":"<h3>Bài 6 — Vòng lặp for & range</h3>\r\n<p>Máy tính không thông minh hơn bạn — nó chỉ <b>nhanh và không biết chán</b>. Sức mạnh thật sự của lập trình đến từ việc bảo máy làm <b>một việc lặp đi lặp lại</b> hàng nghìn lần mà không mệt, không sai. Công cụ để làm điều đó gọi là <b>vòng lặp (loop)</b>, và đây là bước nhảy lớn nhất trong tư duy lập trình của bạn cho tới giờ.</p>\r\n<p>Hãy tưởng tượng phải chào 100 học viên. Viết 100 dòng <code>print</code> vừa mệt vừa dễ sai, và nếu danh sách thay đổi thì phải sửa tay từng dòng. Có một nguyên tắc vàng: <b>DRY — Don't Repeat Yourself</b> (đừng lặp lại chính mình). Khi bạn thấy mình sắp copy–paste cùng một đoạn code nhiều lần, gần như chắc chắn nên thay bằng một vòng lặp.</p>\r\n<p>Bài này đi thật chậm: ta sẽ <b>mổ xẻ từng bộ phận</b> của vòng lặp <code>for</code>, xem máy <b>chạy từng bước</b> ra sao, rồi mới bắt tay luyện tập. Hiểu kỹ phần này, những bài sau (danh sách lồng nhau, dictionary, đọc file) sẽ nhẹ nhàng hơn nhiều.</p>\r\n\r\n<h4>1. Vấn đề: khi phải lặp lại bằng tay</h4>\r\n<p>Giả sử có ba cái tên và ta muốn chào từng người:</p>\r\n<pre class=\"run\"># cach thu cong: lap lai, de sai, kho sua\r\nprint(\"Xin chao An\")\r\nprint(\"Xin chao Binh\")\r\nprint(\"Xin chao Chi\")</pre>\r\n<p>Nó chạy được — nhưng hãy tự hỏi: nếu có <b>100</b> tên thì sao? Nếu danh sách được đọc từ một file mà <i>lúc viết code còn chưa biết</i> có bao nhiêu tên? Ta cần một cách nói với máy: \"làm việc này cho <b>mỗi</b> tên, dù có bao nhiêu đi nữa\". Đó chính xác là việc vòng lặp <code>for</code> sinh ra để làm.</p>\r\n\r\n<h4>2. Giải phẫu một vòng lặp for</h4>\r\n<p>Cùng một việc trên, viết bằng vòng lặp:</p>\r\n<pre class=\"run\">ten = [\"An\", \"Binh\", \"Chi\"]\r\nfor t in ten:\r\n    print(\"Xin chao\", t)</pre>\r\n<p>Chỉ một dòng thân vòng thay cho ba dòng lặp lại. Hãy đọc kỹ <b>bốn bộ phận</b> của nó:</p>\r\n<ul>\r\n<li><code>for</code> — từ khóa mở đầu, báo cho máy \"chuẩn bị lặp\".</li>\r\n<li><code>t</code> — <b>biến lặp</b>, do bạn tự đặt tên. Ở <b>mỗi vòng</b>, máy tự bỏ một phần tử của danh sách vào biến này.</li>\r\n<li><code>in ten</code> — <b>bộ dữ liệu</b> cần duyệt: có thể là danh sách, chuỗi, hay <code>range</code> (học ở mục 4).</li>\r\n<li><code>:</code> và khối <b>thụt lề</b> bên dưới — <b>thân vòng lặp</b>, tức phần code được lặp lại mỗi vòng.</li>\r\n</ul>\r\n<p>Giống như <code>if</code>, <b>thụt lề quyết định</b> dòng nào nằm trong vòng lặp. Chỉ những dòng thụt vào mới được lặp; dòng không thụt sẽ chạy <i>một lần</i>, sau khi vòng lặp kết thúc.</p>\r\n<pre class=\"run\">for t in [\"An\", \"Binh\"]:\r\n    print(\"Trong vong:\", t)   # thut vao  -> chay moi vong\r\n    print(\"  (van trong vong)\")\r\nprint(\"Xong het!\")            # khong thut -> chay 1 lan, sau cung</pre>\r\n\r\n<h4>3. Máy chạy vòng lặp thế nào?</h4>\r\n<p>Bên trong, máy lặp lại đúng <b>ba bước</b>: (1) hỏi \"còn phần tử nào chưa lấy không?\"; (2) nếu còn, lấy phần tử <b>tiếp theo</b> gán vào biến lặp rồi chạy thân vòng; (3) quay lại bước 1. Khi không còn phần tử, vòng lặp dừng.</p>\r\n<figure class=\"diagram\">\r\n<svg viewBox=\"0 0 480 300\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"IBM Plex Mono, monospace\" font-size=\"12.5\">\r\n  <defs>\r\n    <marker id=\"a6\" markerWidth=\"9\" markerHeight=\"9\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#8FA0BC\"/></marker>\r\n  </defs>\r\n  <rect x=\"180\" y=\"10\" width=\"120\" height=\"30\" rx=\"15\" fill=\"#121C30\" stroke=\"#22304C\"/>\r\n  <text x=\"240\" y=\"30\" text-anchor=\"middle\" fill=\"#E8E4D8\">bắt đầu vòng lặp</text>\r\n  <line x1=\"240\" y1=\"40\" x2=\"240\" y2=\"66\" stroke=\"#8FA0BC\" marker-end=\"url(#a6)\"/>\r\n  <polygon points=\"240,68 340,110 240,152 140,110\" fill=\"#0E1626\" stroke=\"#F5B942\"/>\r\n  <text x=\"240\" y=\"108\" text-anchor=\"middle\" fill=\"#F5B942\">còn phần tử?</text>\r\n  <line x1=\"340\" y1=\"110\" x2=\"392\" y2=\"110\" stroke=\"#8FA0BC\" marker-end=\"url(#a6)\"/>\r\n  <text x=\"366\" y=\"102\" text-anchor=\"middle\" fill=\"#E2604C\">hết</text>\r\n  <rect x=\"392\" y=\"94\" width=\"80\" height=\"32\" rx=\"6\" fill=\"#121C30\" stroke=\"#E2604C\"/>\r\n  <text x=\"432\" y=\"114\" text-anchor=\"middle\" fill=\"#E8E4D8\">kết thúc</text>\r\n  <line x1=\"240\" y1=\"152\" x2=\"240\" y2=\"176\" stroke=\"#8FA0BC\" marker-end=\"url(#a6)\"/>\r\n  <text x=\"252\" y=\"168\" fill=\"#7FD1C0\">còn</text>\r\n  <rect x=\"120\" y=\"176\" width=\"240\" height=\"34\" rx=\"6\" fill=\"#121C30\" stroke=\"#7FD1C0\"/>\r\n  <text x=\"240\" y=\"197\" text-anchor=\"middle\" fill=\"#E8E4D8\">phần tử tiếp theo → biến lặp</text>\r\n  <line x1=\"240\" y1=\"210\" x2=\"240\" y2=\"232\" stroke=\"#8FA0BC\" marker-end=\"url(#a6)\"/>\r\n  <rect x=\"150\" y=\"232\" width=\"180\" height=\"34\" rx=\"6\" fill=\"#121C30\" stroke=\"#7FD1C0\"/>\r\n  <text x=\"240\" y=\"253\" text-anchor=\"middle\" fill=\"#E8E4D8\">chạy thân vòng lặp</text>\r\n  <path d=\"M150,249 L60,249 L60,110 L138,110\" fill=\"none\" stroke=\"#8FA0BC\" marker-end=\"url(#a6)\"/>\r\n  <text x=\"64\" y=\"180\" fill=\"#8FA0BC\">lặp lại</text>\r\n</svg>\r\n<figcaption>Vòng lặp = hỏi \"còn không?\" → lấy phần tử tiếp theo → chạy thân → quay lại hỏi. Hết phần tử thì dừng.</figcaption>\r\n</figure>\r\n<p>Cách tốt nhất để hiểu một vòng lặp là <b>lập bảng theo dõi</b> biến lặp qua từng vòng. Với <code>for t in [\"An\", \"Binh\", \"Chi\"]</code>:</p>\r\n<table class=\"res\">\r\n<thead><tr><th>Vòng</th><th>t nhận giá trị</th><th>In ra</th></tr></thead>\r\n<tbody>\r\n<tr><td>1</td><td>\"An\"</td><td>Xin chao An</td></tr>\r\n<tr><td>2</td><td>\"Binh\"</td><td>Xin chao Binh</td></tr>\r\n<tr><td>3</td><td>\"Chi\"</td><td>Xin chao Chi</td></tr>\r\n<tr><td>—</td><td>(hết)</td><td>vòng lặp dừng</td></tr>\r\n</tbody>\r\n</table>\r\n<p>Kỹ năng \"chạy code trong đầu\" này — tự nhẩm biến thay đổi ra sao qua từng vòng — là thứ mọi lập trình viên giỏi đều làm. Cứ mỗi vòng lặp bạn gặp, hãy thử vẽ bảng như trên.</p>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 1.</b> Cho <code>nums = [1, 2, 3, 4]</code>. Dùng vòng lặp cộng dồn tất cả vào <code>total</code> (bắt đầu <code>total = 0</code>, mỗi vòng <code>total += n</code>).</span>\r\n<template class=\"st\">nums = [1, 2, 3, 4]\r\ntotal = 0\r\n# dung for cong don vao total\r\n</template>\r\n<template class=\"ts\">assert total == 10\r\n</template></div>\r\n\r\n<h4>4. <code>range()</code> — sinh ra một dãy số để lặp</h4>\r\n<p>Nhiều khi bạn không có sẵn danh sách, mà chỉ muốn lặp một <b>số lần</b> nhất định — ví dụ \"làm 10 lần\" hay \"chạy từ 1 đến 100\". <code>range</code> sinh ra đúng dãy số đó. Có ba dạng:</p>\r\n<table class=\"res\">\r\n<thead><tr><th>Cách viết</th><th>Sinh ra</th><th>Ý nghĩa</th></tr></thead>\r\n<tbody>\r\n<tr><td><code>range(5)</code></td><td>0, 1, 2, 3, 4</td><td>từ 0, dừng <b>trước</b> 5</td></tr>\r\n<tr><td><code>range(1, 6)</code></td><td>1, 2, 3, 4, 5</td><td>từ 1, dừng trước 6</td></tr>\r\n<tr><td><code>range(0, 10, 2)</code></td><td>0, 2, 4, 6, 8</td><td>bước nhảy 2</td></tr>\r\n</tbody>\r\n</table>\r\n<p>Vì sao dừng <b>trước</b> số cuối chứ không phải tới số đó? Đây là quy ước chung của Python (giống cắt chuỗi <code>[a:b]</code>). Nhờ vậy <code>range(len(danh_sach))</code> cho đúng bộ chỉ số hợp lệ 0..n-1.</p>\r\n<pre class=\"run\">for i in range(5):\r\n    print(i, end=\" \")   # 0 1 2 3 4\r\nprint()\r\nfor i in range(1, 6):\r\n    print(i, end=\" \")   # 1 2 3 4 5</pre>\r\n<p>Bạn cũng có thể duyệt danh sách <b>theo chỉ số</b> bằng cách kết hợp <code>range</code> và <code>len</code> — hữu ích khi cần biết vị trí phần tử:</p>\r\n<pre class=\"run\">ten = [\"An\", \"Binh\", \"Chi\"]\r\nfor i in range(len(ten)):\r\n    print(i, ten[i])    # 0 An / 1 Binh / 2 Chi</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 2.</b> Dùng <code>range</code> và <code>append</code> để tạo <code>doubles</code> = <code>[2, 4, 6, 8, 10]</code> (gấp đôi các số 1..5). Bắt đầu <code>doubles = []</code>.</span>\r\n<template class=\"st\">doubles = []\r\n# for i in range(1, 6): them i*2 vao doubles\r\n</template>\r\n<template class=\"ts\">assert doubles == [2, 4, 6, 8, 10]\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 3.</b> Dùng <code>range</code> tính tổng các số từ 1 đến 100 vào <code>total</code> (bắt đầu <code>total = 0</code>).</span>\r\n<template class=\"st\">total = 0\r\n# cong don 1..100 vao total\r\n</template>\r\n<template class=\"ts\">assert total == 5050\r\n</template></div>\r\n\r\n<h4>5. Mẫu \"tích lũy\" (accumulator) — khuôn mẫu quan trọng nhất</h4>\r\n<p>Rất nhiều bài toán vòng lặp theo cùng một khuôn: bạn muốn gộp nhiều giá trị thành <b>một</b> kết quả (tổng, số đếm, chuỗi ghép, giá trị lớn nhất…). Công thức luôn gồm ba phần:</p>\r\n<ol>\r\n<li><b>Khởi tạo</b> một biến chứa kết quả <i>trước</i> vòng lặp (thường là <code>0</code>, <code>\"\"</code>, hoặc <code>[]</code>).</li>\r\n<li><b>Cập nhật</b> biến đó trong <i>mỗi</i> vòng.</li>\r\n<li><b>Dùng</b> kết quả <i>sau</i> vòng lặp.</li>\r\n</ol>\r\n<pre class=\"run\">nums = [4, 8, 2, 6]\r\ntong = 0            # 1) khoi tao\r\nfor n in nums:\r\n    tong += n       # 2) cap nhat moi vong\r\nprint(tong)         # 3) dung ket qua -> 20</pre>\r\n<p>Theo dõi <code>tong</code> qua từng vòng: 0 → 4 → 12 → 14 → 20. Nếu bạn <b>quên</b> dòng khởi tạo <code>tong = 0</code>, máy sẽ báo lỗi \"chưa định nghĩa <code>tong</code>\" ngay vòng đầu — một lỗi rất hay gặp.</p>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 4.</b> Cho <code>word = \"banana\"</code>. Đếm xem có bao nhiêu ký tự <code>\"a\"</code>, lưu vào <code>count</code> (duyệt từng ký tự, gặp <code>\"a\"</code> thì <code>count += 1</code>).</span>\r\n<template class=\"st\">word = \"banana\"\r\ncount = 0\r\n# dem so ky tu \"a\"\r\n</template>\r\n<template class=\"ts\">assert count == 3\r\n</template></div>\r\n\r\n<h4>6. Lọc & đếm: đặt <code>if</code> bên trong vòng lặp</h4>\r\n<p>Ghép hai kỹ năng bạn đã có — vòng lặp (bài này) và điều kiện (bài 3–4) — cho ra một trong những mẫu code phổ biến nhất: <b>duyệt qua và chỉ xử lý phần tử thỏa điều kiện</b>.</p>\r\n<pre class=\"run\">nums = [1, 2, 3, 4, 5, 6]\r\nso_chan = 0\r\nfor n in nums:\r\n    if n % 2 == 0:      # if nam TRONG for (thut 2 lan)\r\n        so_chan += 1\r\nprint(so_chan)          # 3</pre>\r\n<p>Chú ý hai mức thụt lề: <code>for</code> ở mức 0, thân <code>for</code> thụt 1 lần, thân <code>if</code> thụt 2 lần. Đọc code có nhiều mức thụt, hãy luôn hỏi \"dòng này thuộc khối nào?\".</p>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 5.</b> Cho <code>nums = [1, 2, 3, 4, 5, 6]</code>. Đếm số phần tử <b>chẵn</b> vào <code>even_count</code> (dùng <code>if n % 2 == 0</code> trong vòng lặp).</span>\r\n<template class=\"st\">nums = [1, 2, 3, 4, 5, 6]\r\neven_count = 0\r\n# dem so phan tu chan\r\n</template>\r\n<template class=\"ts\">assert even_count == 3\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 6.</b> Cho <code>nums = [3, 7, 2, 9, 4]</code>. Tự tìm số lớn nhất vào <code>biggest</code> (bắt đầu <code>biggest = nums[0]</code>, gặp số lớn hơn thì cập nhật). <i>Không dùng <code>max()</code> để luyện tư duy tích lũy.</i></span>\r\n<template class=\"st\">nums = [3, 7, 2, 9, 4]\r\nbiggest = nums[0]\r\n# duyet va cap nhat biggest\r\n</template>\r\n<template class=\"ts\">assert biggest == 9\r\n</template></div>\r\n\r\n<h4>7. Xây một danh sách mới bằng vòng lặp</h4>\r\n<p>Một biến thể của accumulator: khởi tạo danh sách rỗng, rồi <code>append</code> dần trong vòng lặp. Đây là cách bạn \"biến đổi\" một danh sách thành danh sách khác — rất hay dùng.</p>\r\n<pre class=\"run\">squares = []\r\nfor i in range(1, 6):\r\n    squares.append(i ** 2)\r\nprint(squares)      # [1, 4, 9, 16, 25]</pre>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 7.</b> Tạo <code>squares</code> = <code>[1, 4, 9, 16, 25]</code> (bình phương của 1..5) bằng vòng lặp và <code>append</code>.</span>\r\n<template class=\"st\">squares = []\r\n# tao squares bang for + append\r\n</template>\r\n<template class=\"ts\">assert squares == [1, 4, 9, 16, 25]\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 8.</b> Tính tổng các <b>bội của 3</b> nhỏ hơn 20 (tức 3, 6, 9, 12, 15, 18) vào <code>total</code> (gợi ý: <code>range(3, 20, 3)</code>).</span>\r\n<template class=\"st\">total = 0\r\n# cong don cac boi cua 3 duoi 20\r\n</template>\r\n<template class=\"ts\">assert total == 63\r\n</template></div>\r\n\r\n<h4>8. Những nhầm lẫn thường gặp</h4>\r\n<ul>\r\n<li><b>Quên khởi tạo biến tích lũy</b> trước vòng lặp → lỗi \"chưa định nghĩa\".</li>\r\n<li><b>Đặt dòng dùng kết quả vào TRONG vòng lặp</b> (thụt nhầm) → in/tính sai mỗi vòng thay vì một lần cuối.</li>\r\n<li><b>Nhầm <code>range(1, 5)</code> là tới 5</b> — thực ra dừng ở 4. Muốn tới 5 phải <code>range(1, 6)</code>.</li>\r\n<li><b>Sửa danh sách <i>trong khi</i> đang duyệt nó</b> (thêm/xóa) → dễ sinh lỗi khó lường; tạm thời cứ tránh.</li>\r\n</ul>\r\n\r\n<h4>9. Luyện tập tổng hợp</h4>\r\n<p>Ghép các mẫu vừa học: duyệt, tích lũy, lọc, và xây danh sách mới.</p>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 9.</b> Cho <code>prices = [10, 20, 30]</code>. Tạo <code>discounted</code> = mỗi giá sau khi giảm 10% (nhân <code>0.9</code>), dùng vòng lặp và <code>append</code>. Kết quả: <code>[9.0, 18.0, 27.0]</code>.</span>\r\n<template class=\"st\">prices = [10, 20, 30]\r\ndiscounted = []\r\n# giam 10% moi gia, them vao discounted\r\n</template>\r\n<template class=\"ts\">assert discounted == [9.0, 18.0, 27.0]\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 10.</b> Cho <code>nums = [3, 8, 5, 12, 1, 7]</code>. Đếm số phần tử <b>lớn hơn 5</b> vào <code>over_five</code>.</span>\r\n<template class=\"st\">nums = [3, 8, 5, 12, 1, 7]\r\nover_five = 0\r\n# dem phan tu > 5\r\n</template>\r\n<template class=\"ts\">assert over_five == 3\r\n</template></div>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Bài tập 11.</b> Cho <code>words = [\"hi\", \"hello\", \"hey\"]</code>. Tạo <code>lengths</code> = danh sách độ dài từng từ → <code>[2, 5, 3]</code> (dùng <code>len(w)</code> trong vòng lặp).</span>\r\n<template class=\"st\">words = [\"hi\", \"hello\", \"hey\"]\r\nlengths = []\r\n# tao danh sach do dai tung tu\r\n</template>\r\n<template class=\"ts\">assert lengths == [2, 5, 3]\r\n</template></div>\r\n<div class=\"ex stretch\" data-kind=\"py\"><span class=\"exq\"><b>🔥 Thử thách.</b> Cho <code>nums = [3, 1, 4, 1, 5, 9, 2]</code>. Tìm <b>chỉ số</b> (index) của phần tử lớn nhất vào <code>max_index</code> — dùng <code>range(len(nums))</code> và theo dõi cả giá trị lớn nhất lẫn vị trí của nó. Ở đây <code>max_index = 5</code>.</span>\r\n<template class=\"st\">nums = [3, 1, 4, 1, 5, 9, 2]\r\nmax_index = 0\r\n# tim chi so cua phan tu lon nhat\r\n</template>\r\n<template class=\"ts\">assert max_index == 5\r\n</template></div>\r\n\r\n<div class=\"recap\">Ghi nhớ bài 6: <code>for x in bo_du_lieu:</code> duyệt từng phần tử · thụt lề xác định thân vòng · máy chạy: hỏi \"còn không?\" → lấy phần tử → chạy thân → lặp lại · <code>range(n) / range(a,b) / range(a,b,buoc)</code>, dừng <b>trước</b> số cuối · mẫu <b>tích lũy</b>: khởi tạo → cập nhật → dùng · đặt <code>if</code> trong vòng để lọc/đếm · <code>append</code> để xây danh sách mới. Bài sau: <code>while</code>, <code>break</code>/<code>continue</code> và cách dừng vòng lặp giữa chừng.</div>\r\n\r\n<h4>🏠 Bài tập về nhà</h4>\r\n<p>Làm ở nhà, không tính vào 2 giờ trên lớp. Bốn câu, câu cuối là thử thách.</p>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Bài về nhà 1.</b> Tính tổng các số <b>lẻ</b> từ 1 đến 10 (1, 3, 5, 7, 9) vào <code>total</code>.</span>\r\n<template class=\"st\">total = 0\r\n# cong don cac so le tu 1..10\r\n</template>\r\n<template class=\"ts\">assert total == 25\r\n</template></div>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Bài về nhà 2.</b> Cho <code>word = \"education\"</code>. Đếm số nguyên âm (a, e, i, o, u) vào <code>vowels</code> (gợi ý: <code>if ch in \"aeiou\"</code>).</span>\r\n<template class=\"st\">word = \"education\"\r\nvowels = 0\r\n# dem nguyen am\r\n</template>\r\n<template class=\"ts\">assert vowels == 5\r\n</template></div>\r\n<div class=\"ex homework\" data-kind=\"py\"><span class=\"exq\"><b>Bài về nhà 3.</b> Tạo danh sách đếm ngược <code>countdown</code> = <code>[5, 4, 3, 2, 1]</code> bằng vòng lặp (gợi ý: <code>range(5, 0, -1)</code>).</span>\r\n<template class=\"st\">countdown = []\r\n# tao countdown bang for + append\r\n</template>\r\n<template class=\"ts\">assert countdown == [5, 4, 3, 2, 1]\r\n</template></div>\r\n<div class=\"ex homework stretch\" data-kind=\"py\"><span class=\"exq\"><b>🔥 Bài về nhà 4 (thử thách — FizzBuzz).</b> Tạo danh sách <code>result</code> cho các số 1..15: bội của cả 3 và 5 → <code>\"FizzBuzz\"</code>; bội 3 → <code>\"Fizz\"</code>; bội 5 → <code>\"Buzz\"</code>; còn lại → chuỗi của số đó. Kết quả có 15 phần tử, bắt đầu <code>[\"1\", \"2\", \"Fizz\", \"4\", \"Buzz\", ...]</code>.</span>\r\n<template class=\"st\">result = []\r\n# tao result theo luat FizzBuzz cho 1..15\r\n</template>\r\n<template class=\"ts\">assert result == [\"1\", \"2\", \"Fizz\", \"4\", \"Buzz\", \"Fizz\", \"7\", \"8\", \"Fizz\", \"Buzz\", \"11\", \"Fizz\", \"13\", \"14\", \"FizzBuzz\"]\r\n</template></div>","en":"<h3>Lesson 6 — The for loop & range</h3>\r\n<p>A computer isn't smarter than you — it's just <b>fast and never gets bored</b>. The real power of programming comes from telling the machine to do <b>one thing over and over</b>, thousands of times, without tiring or making mistakes. The tool for that is the <b>loop</b>, and it's the biggest leap in your programming thinking so far.</p>\r\n<p>Imagine greeting 100 students. Writing 100 <code>print</code> lines is tedious and error-prone, and if the list changes you'd fix each line by hand. There's a golden rule: <b>DRY — Don't Repeat Yourself</b>. When you notice you're about to copy–paste the same code several times, you almost certainly want a loop instead.</p>\r\n<p>This lesson goes slowly: we'll <b>dissect each part</b> of the <code>for</code> loop, watch the machine <b>run it step by step</b>, and only then practice. Nail this and the later lessons (nested lists, dictionaries, reading files) get much easier.</p>\r\n\r\n<h4>1. The problem: repeating by hand</h4>\r\n<p>Suppose we have three names and want to greet each one:</p>\r\n<pre class=\"run\"># the manual way: repetitive, error-prone, hard to change\r\nprint(\"Hello An\")\r\nprint(\"Hello Binh\")\r\nprint(\"Hello Chi\")</pre>\r\n<p>It works — but ask yourself: what if there were <b>100</b> names? What if the list is read from a file and you <i>don't even know</i> how many names there'll be when you write the code? We need a way to tell the machine: \"do this for <b>each</b> name, however many there are.\" That's exactly what the <code>for</code> loop is for.</p>\r\n\r\n<h4>2. Anatomy of a for loop</h4>\r\n<p>The same task, written with a loop:</p>\r\n<pre class=\"run\">ten = [\"An\", \"Binh\", \"Chi\"]\r\nfor t in ten:\r\n    print(\"Hello\", t)</pre>\r\n<p>One body line replaces three repeated lines. Read its <b>four parts</b> carefully:</p>\r\n<ul>\r\n<li><code>for</code> — the opening keyword, telling the machine \"get ready to loop\".</li>\r\n<li><code>t</code> — the <b>loop variable</b>, which you name. On <b>each pass</b>, the machine puts one element of the list into it.</li>\r\n<li><code>in ten</code> — the <b>collection</b> to walk through: a list, a string, or a <code>range</code> (section 4).</li>\r\n<li><code>:</code> and the <b>indented block</b> below — the <b>loop body</b>, the code repeated each pass.</li>\r\n</ul>\r\n<p>Just like <code>if</code>, <b>indentation decides</b> which lines are inside the loop. Only indented lines repeat; a non-indented line runs <i>once</i>, after the loop finishes.</p>\r\n<pre class=\"run\">for t in [\"An\", \"Binh\"]:\r\n    print(\"Inside:\", t)       # indented -> runs each pass\r\n    print(\"  (still inside)\")\r\nprint(\"All done!\")            # not indented -> runs once, at the end</pre>\r\n\r\n<h4>3. How the machine runs a loop</h4>\r\n<p>Under the hood, the machine repeats exactly <b>three steps</b>: (1) ask \"is there an element I haven't taken yet?\"; (2) if yes, take the <b>next</b> one into the loop variable and run the body; (3) go back to step 1. When there are no elements left, the loop stops.</p>\r\n<figure class=\"diagram\">\r\n<svg viewBox=\"0 0 480 300\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"IBM Plex Mono, monospace\" font-size=\"12.5\">\r\n  <defs>\r\n    <marker id=\"a6e\" markerWidth=\"9\" markerHeight=\"9\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#8FA0BC\"/></marker>\r\n  </defs>\r\n  <rect x=\"185\" y=\"10\" width=\"110\" height=\"30\" rx=\"15\" fill=\"#121C30\" stroke=\"#22304C\"/>\r\n  <text x=\"240\" y=\"30\" text-anchor=\"middle\" fill=\"#E8E4D8\">start loop</text>\r\n  <line x1=\"240\" y1=\"40\" x2=\"240\" y2=\"66\" stroke=\"#8FA0BC\" marker-end=\"url(#a6e)\"/>\r\n  <polygon points=\"240,68 340,110 240,152 140,110\" fill=\"#0E1626\" stroke=\"#F5B942\"/>\r\n  <text x=\"240\" y=\"108\" text-anchor=\"middle\" fill=\"#F5B942\">any left?</text>\r\n  <line x1=\"340\" y1=\"110\" x2=\"392\" y2=\"110\" stroke=\"#8FA0BC\" marker-end=\"url(#a6e)\"/>\r\n  <text x=\"366\" y=\"102\" text-anchor=\"middle\" fill=\"#E2604C\">no</text>\r\n  <rect x=\"392\" y=\"94\" width=\"76\" height=\"32\" rx=\"6\" fill=\"#121C30\" stroke=\"#E2604C\"/>\r\n  <text x=\"430\" y=\"114\" text-anchor=\"middle\" fill=\"#E8E4D8\">finish</text>\r\n  <line x1=\"240\" y1=\"152\" x2=\"240\" y2=\"176\" stroke=\"#8FA0BC\" marker-end=\"url(#a6e)\"/>\r\n  <text x=\"252\" y=\"168\" fill=\"#7FD1C0\">yes</text>\r\n  <rect x=\"120\" y=\"176\" width=\"240\" height=\"34\" rx=\"6\" fill=\"#121C30\" stroke=\"#7FD1C0\"/>\r\n  <text x=\"240\" y=\"197\" text-anchor=\"middle\" fill=\"#E8E4D8\">next element → loop variable</text>\r\n  <line x1=\"240\" y1=\"210\" x2=\"240\" y2=\"232\" stroke=\"#8FA0BC\" marker-end=\"url(#a6e)\"/>\r\n  <rect x=\"155\" y=\"232\" width=\"170\" height=\"34\" rx=\"6\" fill=\"#121C30\" stroke=\"#7FD1C0\"/>\r\n  <text x=\"240\" y=\"253\" text-anchor=\"middle\" fill=\"#E8E4D8\">run the loop body</text>\r\n  <path d=\"M155,249 L60,249 L60,110 L138,110\" fill=\"none\" stroke=\"#8FA0BC\" marker-end=\"url(#a6e)\"/>\r\n  <text x=\"64\" y=\"180\" fill=\"#8FA0BC\">repeat</text>\r\n</svg>\r\n<figcaption>A loop = ask \"any left?\" → take the next element → run the body → ask again. When none are left, stop.</figcaption>\r\n</figure>\r\n<p>The best way to understand a loop is to <b>make a trace table</b> of the loop variable across passes. For <code>for t in [\"An\", \"Binh\", \"Chi\"]</code>:</p>\r\n<table class=\"res\">\r\n<thead><tr><th>Pass</th><th>t becomes</th><th>Prints</th></tr></thead>\r\n<tbody>\r\n<tr><td>1</td><td>\"An\"</td><td>Hello An</td></tr>\r\n<tr><td>2</td><td>\"Binh\"</td><td>Hello Binh</td></tr>\r\n<tr><td>3</td><td>\"Chi\"</td><td>Hello Chi</td></tr>\r\n<tr><td>—</td><td>(none left)</td><td>loop stops</td></tr>\r\n</tbody>\r\n</table>\r\n<p>This \"running the code in your head\" skill — tracing how variables change each pass — is something every good programmer does. For every loop you meet, try drawing a table like this.</p>\r\n<div class=\"ex\" data-kind=\"py\"><span class=\"exq\"><b>Exercise 1.</b> Given <code>nums = [1, 2, 3, 4]</code>, use a loop to add them all into <code>total</code> (start <code>total = 0</code>, each pass <code>total += n</code>).</span>\r\n<template class=\"st\">nums = [1, 2, 3, 4]\r\ntotal = 0\r\n# use for to accumulate into total\r\n</template>\r\n<template class=\"ts\">assert total == 10\r\n</template></div>\r\n\r\n<h4>4. <code>range()</code> — generate a sequence of numbers to loop over</h4>\r\n<p>Often you don't have a list — you just want to loop a fixed number of <b>times</b>, e.g. \"do it 10 times\" or \"count from 1 to 100\". <code>range</code> produces exactly that sequence. There are three forms:</p>\r\n<table class=\"res\">\r\n<thead><tr><th>Written as</th><th>Produces</th><th>Meaning</th></tr></thead>\r\n<tbody>\r\n<tr><td><code>range(5)</code></td><td>0, 1, 2, 3, 4</td><td
