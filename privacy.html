<!DOCTYPE html>

<link rel="preconnect" href="https://fonts.googleapis.com">

</head>
<body>

<section><div class="wrap">
  <div class="shead"><div class="eyebrow" id="pvEyebrow"></div><h2 id="pvTitle"></h2><p id="pvIntro"></p></div>
  <div id="pvBody" class="legal"></div>
</div></section>

<script src="app.js"></script>
<script>
const DOC = {
vi:{
  eyebrow:'Pháp lý', title:'Quyền riêng tư & Điều khoản',
  intro:'Trang này giải thích chúng tôi thu thập dữ liệu gì, dùng để làm gì, và điều khoản khi mua khóa học. Ngắn gọn và rõ ràng.',
  sections:[
    ['Chúng tôi thu thập gì', ['Email đăng nhập của bạn.','Hồ sơ bạn tự điền: họ tên, số điện thoại/Zalo, và (tùy chọn) năm sinh, kinh nghiệm, mục tiêu học.','Tiến độ học và <b>nội dung bạn gõ vào các ô code</b> trong bài tập (để lưu và đồng bộ giữa các thiết bị).','Mã mở khóa bạn nhập để sở hữu khóa học.']],
    ['Dùng để làm gì', ['Cấp quyền truy cập khóa học bạn đã mua và lưu tiến độ của bạn.','Đồng bộ bài làm giữa các thiết bị của bạn.','Để giáo viên hỗ trợ bạn và xác nhận bạn đã đăng ký.']],
    ['Lưu ở đâu', ['Dữ liệu được lưu trên Supabase (dịch vụ cơ sở dữ liệu được quản lý). Chúng tôi <b>không bán</b> và không chia sẻ dữ liệu của bạn cho bên thứ ba vì mục đích quảng cáo.']],
    ['Thanh toán', ['Thanh toán qua chuyển khoản ngân hàng (VietQR). Chúng tôi <b>không</b> nhìn thấy hay lưu thông tin thẻ/tài khoản ngân hàng của bạn.']],
    ['Điều khoản truy cập', ['Thanh toán một lần cho một khóa sẽ cấp cho tài khoản của bạn quyền sở hữu khóa đó. Mã mở khóa dùng một lần.','Vì quyền truy cập được mở ngay lập tức dưới dạng nội dung số, <b>các giao dịch mua không được hoàn tiền</b>.']],
    ['Lựa chọn của bạn', ['Bạn có thể xem và chỉnh sửa hồ sơ bất cứ lúc nào trong trang Hồ sơ.','Muốn xóa tài khoản và dữ liệu? Liên hệ với chúng tôi và chúng tôi sẽ xử lý.']],
    ['Liên hệ', ['Zalo: 0986061705 · Email: tranhoangson503@gmail.com']],
  ],
},
en:{
  eyebrow:'Legal', title:'Privacy & Terms',
  intro:'This page explains what data we collect, why, and the terms when you buy a course. Short and clear.',
  sections:[
    ['What we collect', ['Your login email.','The profile you fill in: full name, phone/Zalo, and (optionally) birth year, experience and learning goal.','Your progress and <b>the code you type into exercise boxes</b> (so it saves and syncs across your devices).','The unlock code you enter to own a course.']],
    ['Why we use it', ['To give you access to the course you bought and save your progress.','To sync your work across your own devices.','So your teacher can support you and confirm your enrollment.']],
    ['Where it is stored', ['Data is stored on Supabase (a managed database service). We <b>do not sell</b> and do not share your data with third parties for advertising.']],
    ['Payments', ['Payment is by bank transfer (VietQR). We <b>never</b> see or store your card or bank credentials.']],
    ['Access terms', ['A one-time payment for a course grants your account ownership of that course. Unlock codes are single-use.','Because access is delivered immediately as digital content, <b>purchases are non-refundable</b>.']],
    ['Your choices', ['You can view and edit your profile anytime on the Profile page.','Want your account and data deleted? Contact us and we will take care of it.']],
    ['Contact', ['Zalo: 0986061705 · Email: tranhoangson503@gmail.com']],
  ],
}};

window.onLang = function(){
  const d = DOC[LANG];
  document.getElementById('pvEyebrow').textContent = d.eyebrow;
  document.getElementById('pvTitle').textContent = d.title;
  document.getElementById('pvIntro').textContent = d.intro;
  document.getElementById('pvBody').innerHTML = d.sections.map(([h, items]) =>
    `<h3>${h}</h3><ul>${items.map(i=>'<li>'+i+'</li>').join('')}</ul>`).join('');
};
</script>
</body>
</html>
