<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đặt lại mật khẩu — The Dojo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<section><div class="wrap authCenter">
  <div class="shead">
    <div class="eyebrow" id="rpEyebrow"></div>
    <h2 id="rpTitle"></h2>
  </div>
  <div class="coCard" id="rpCard" style="max-width:420px"></div>
</div></section>

<script src="app.js"></script>
<script>
const T = {
vi:{ eyebrow:'Tài khoản', title:'Đặt lại mật khẩu',
  invalid:'Liên kết đặt lại không hợp lệ hoặc đã hết hạn. Hãy yêu cầu email đặt lại mới từ trang đăng nhập.',
  home:'Về trang chủ', newpw:'Mật khẩu mới', confirm:'Xác nhận mật khẩu', save:'Cập nhật mật khẩu',
  short:'Mật khẩu tối thiểu 6 ký tự.', nomatch:'Mật khẩu xác nhận không khớp.',
  done:'Đã cập nhật mật khẩu ✓ Đang chuyển hướng…' },
en:{ eyebrow:'Account', title:'Reset your password',
  invalid:'This reset link is invalid or has expired. Request a new reset email from the login screen.',
  home:'Back to home', newpw:'New password', confirm:'Confirm password', save:'Update password',
  short:'Password must be at least 6 characters.', nomatch:'Passwords do not match.',
  done:'Password updated ✓ Redirecting…' }
};
function L(){ return T[LANG]; }

function render(){
  const d = L();
  document.getElementById('rpEyebrow').textContent = d.eyebrow;
  document.getElementById('rpTitle').textContent = d.title;
  const card = document.getElementById('rpCard');
  const user = window.DOJO_CLOUD.getUser();
  if (!user){
    card.innerHTML = `<p>${d.invalid}</p><a class="btn ghost" href="index.html" style="margin-top:10px">${d.home}</a>`;
    return;
  }
  card.innerHTML = `
    <label class="coLabel">${d.newpw}</label>
    <input type="password" id="rpPw" class="coInput" autocomplete="new-password">
    <label class="coLabel">${d.confirm}</label>
    <input type="password" id="rpPw2" class="coInput" autocomplete="new-password">
    <button class="btn" id="rpSave" style="width:100%;margin-top:12px">${d.save}</button>
    <div class="authErr" id="rpMsg"></div>`;
  document.getElementById('rpSave').addEventListener('click', onSave);
}

async function onSave(){
  const d = L();
  const msg = document.getElementById('rpMsg');
  msg.textContent = '';
  const pw = document.getElementById('rpPw').value;
  const pw2 = document.getElementById('rpPw2').value;
  if (pw.length < 6){ msg.style.color=''; msg.textContent = d.short; return; }
  if (pw !== pw2){ msg.style.color=''; msg.textContent = d.nomatch; return; }
  try{
    const sb = await window.DOJO_CLOUD.getClient();
    const { error } = await sb.auth.updateUser({ password: pw });
    if (error){ msg.style.color=''; msg.textContent = error.message; return; }
    msg.style.color = 'var(--jade)';
    msg.textContent = d.done;
    setTimeout(() => { location.href = 'profile.html'; }, 1600);
  }catch(e){ msg.style.color=''; msg.textContent = e.message || 'Error'; }
}

window.onLang = render;
window.DOJO_CLOUD.onAuthResolved(render);
</script>
</body>
</html>
