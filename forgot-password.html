<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quên mật khẩu — The Dojo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<section><div class="wrap">
  <div class="shead">
    <div class="eyebrow" id="fpEyebrow"></div>
    <h2 id="fpTitle"></h2>
    <p id="fpIntro"></p>
  </div>
  <div class="coCard" id="fpCard" style="max-width:420px"></div>
</div></section>

<script src="app.js"></script>
<script>
const T = {
vi:{ eyebrow:'Tài khoản', title:'Quên mật khẩu', intro:'Nhập email tài khoản của bạn — chúng tôi sẽ gửi một liên kết để đặt lại mật khẩu.',
  email:'Email', send:'Gửi liên kết đặt lại', enter:'Vui lòng nhập email của bạn.',
  sent:'Đã gửi email đặt lại mật khẩu ✓ Hãy kiểm tra hộp thư (cả mục spam) và mở liên kết trong đó.',
  home:'Về trang chủ' },
en:{ eyebrow:'Account', title:'Forgot password', intro:'Enter your account email — we\u2019ll send you a link to reset your password.',
  email:'Email', send:'Send reset link', enter:'Please enter your email.',
  sent:'Password reset email sent ✓ Check your inbox (and spam) and open the link.',
  home:'Back to home' }
};
function L(){ return T[LANG]; }

function render(){
  const d = L();
  document.getElementById('fpEyebrow').textContent = d.eyebrow;
  document.getElementById('fpTitle').textContent = d.title;
  document.getElementById('fpIntro').textContent = d.intro;
  document.getElementById('fpCard').innerHTML = `
    <label class="coLabel">${d.email}</label>
    <input type="email" id="fpEmail" class="coInput" autocomplete="email" placeholder="you@example.com">
    <button class="btn" id="fpSend" style="width:100%;margin-top:12px">${d.send}</button>
    <div class="authErr" id="fpMsg"></div>
    <a class="cardlink" href="index.html" style="margin-top:10px;display:inline-block">${d.home}</a>`;
  document.getElementById('fpSend').addEventListener('click', onSend);
  document.getElementById('fpEmail').addEventListener('keydown', (e) => { if (e.key === 'Enter') onSend(); });
}

async function onSend(){
  const d = L();
  const msg = document.getElementById('fpMsg');
  msg.style.color = ''; msg.textContent = '';
  const email = document.getElementById('fpEmail').value.trim();
  if (!email){ msg.textContent = d.enter; return; }
  const btn = document.getElementById('fpSend');
  btn.disabled = true;
  try{
    const sb = await window.DOJO_CLOUD.getClient();
    const dir = location.href.substring(0, location.href.lastIndexOf('/') + 1);
    const redirectTo = dir.startsWith('http') ? dir + 'reset-password.html' : undefined;
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo });
    if (error){ msg.textContent = error.message; btn.disabled = false; return; }
    // success — replace the form with a confirmation
    document.getElementById('fpCard').innerHTML =
      `<p style="color:var(--jade)">${d.sent}</p><a class="btn ghost" href="index.html" style="margin-top:12px">${d.home}</a>`;
  }catch(e){ msg.textContent = e.message || 'Error'; btn.disabled = false; }
}

window.onLang = render;
</script>
</body>
</html>
