nth.</p>\r\n<pre class=\"run\">SELECT name\r\nFROM customers\r\nWHERE strftime('%Y', joined_at) = '2024'\r\nORDER BY joined_at;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 7.</b> Get the <code>name</code> of customers who <b>joined in 2024</b> (<code>strftime('%Y', joined_at) = '2024'</code>), sorted by <code>joined_at</code>.</span>\r\n<template class=\"st\">SELECT name FROM customers\r\nWHERE \r\nORDER BY joined_at</template>\r\n<template class=\"ref\">SELECT name FROM customers WHERE strftime('%Y', joined_at) = '2024' ORDER BY joined_at</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 8.</b> Get <code>id</code>, <code>order_date</code> of orders <b>in May 2025</b> using <code>strftime('%Y-%m', order_date) = '2025-05'</code>, sorted by <code>order_date</code>.</span>\r\n<template class=\"st\">SELECT id, order_date FROM orders\r\nWHERE \r\nORDER BY order_date</template>\r\n<template class=\"ref\">SELECT id, order_date FROM orders WHERE strftime('%Y-%m', order_date) = '2025-05' ORDER BY order_date</template></div>\r\n\r\n<h4>5. MIN and MAX with dates</h4>\r\n<p><code>MIN</code>/<code>MAX</code> work on dates — find the earliest and latest order.</p>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 9.</b> Find the <b>earliest and latest order date</b>: <code>MIN(order_date) AS first_order</code>, <code>MAX(order_date) AS last_order</code> from <code>orders</code>.</span>\r\n<template class=\"st\">SELECT \r\nFROM orders</template>\r\n<template class=\"ref\">SELECT MIN(order_date) AS first_order, MAX(order_date) AS last_order FROM orders</template></div>\r\n\r\n<h4>6. Grouping by time</h4>\r\n<p>Combine <code>strftime</code> with <code>GROUP BY</code> for \"per month\" or \"per year\" reports.</p>\r\n<pre class=\"run\">SELECT strftime('%m', order_date) AS month, COUNT(*) AS n\r\nFROM orders\r\nGROUP BY month\r\nORDER BY month;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 10.</b> Count the <b>number of orders per month</b>: <code>strftime('%m', order_date) AS month</code>, <code>COUNT(*) AS n</code>, grouped by <code>month</code>, sorted by <code>month</code>.</span>\r\n<template class=\"st\">SELECT strftime('%m', order_date) AS month, COUNT(*) AS n\r\nFROM orders\r\nGROUP BY \r\nORDER BY month</template>\r\n<template class=\"ref\">SELECT strftime('%m', order_date) AS month, COUNT(*) AS n FROM orders GROUP BY month ORDER BY month</template></div>\r\n<div class=\"ex stretch\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 11. 🔥 Stretch.</b> Report <b>by join year</b>: <code>strftime('%Y', joined_at) AS year</code>, <code>COUNT(*) AS n</code>, and <code>MIN(joined_at) AS first_join</code>; grouped by <code>year</code>, sorted by <code>year</code>.</span>\r\n<template class=\"st\">SELECT strftime('%Y', joined_at) AS year, COUNT(*) AS n, MIN(joined_at) AS first_join\r\nFROM customers\r\nGROUP BY \r\nORDER BY year</template>\r\n<template class=\"ref\">SELECT strftime('%Y', joined_at) AS year, COUNT(*) AS n, MIN(joined_at) AS first_join FROM customers GROUP BY year ORDER BY year</template></div>\r\n\r\n<h4>🏠 Homework</h4>\r\n<p>Four take-home exercises, auto-graded right on the page. The last one is a stretch.</p>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 1.</b> Get <code>id</code>, <code>order_date</code> of orders <b>before 2025-06-01</b>, sorted by <code>order_date</code>.</span>\r\n<template class=\"st\">SELECT id, order_date FROM orders\r\nWHERE \r\nORDER BY order_date</template>\r\n<template class=\"ref\">SELECT id, order_date FROM orders WHERE order_date < '2025-06-01' ORDER BY order_date</template></div>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 2.</b> From <code>orders</code>, get the <b>order year</b>: <code>strftime('%Y', order_date) AS year</code>. Show <code>id</code> and <code>year</code>.</span>\r\n<template class=\"st\">SELECT id, \r\nFROM orders</template>\r\n<template class=\"ref\">SELECT id, strftime('%Y', order_date) AS year FROM orders</template></div>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 3.</b> Count the <b>number of customers who joined per month</b>: <code>strftime('%m', joined_at) AS month</code>, <code>COUNT(*) AS n</code>, grouped by <code>month</code>, sorted by <code>month</code>.</span>\r\n<template class=\"st\">SELECT strftime('%m', joined_at) AS month, COUNT(*) AS n\r\nFROM customers\r\nGROUP BY \r\nORDER BY month</template>\r\n<template class=\"ref\">SELECT strftime('%m', joined_at) AS month, COUNT(*) AS n FROM customers GROUP BY month ORDER BY month</template></div>\r\n<div class=\"ex homework stretch\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 4. 🔥 Stretch.</b> Get <code>id</code>, <code>order_date</code>, and <code>strftime('%m', order_date) AS month</code> for orders <b>in May 2025</b> (<code>BETWEEN '2025-05-01' AND '2025-05-31'</code>), sorted by <code>order_date</code>.</span>\r\n<template class=\"st\">SELECT id, order_date, strftime('%m', order_date) AS month\r\nFROM orders\r\nWHERE \r\nORDER BY order_date</template>\r\n<template class=\"ref\">SELECT id, order_date, strftime('%m', order_date) AS month FROM orders WHERE order_date BETWEEN '2025-05-01' AND '2025-05-31' ORDER BY order_date</template></div>"}},{"t":{"vi":"JOIN — kết nối các bảng","en":"JOIN — connecting tables"},"html":{"vi":"<h3>Bài 9 — JOIN: kết nối các bảng</h3>\r\n<p>Dữ liệu thật không nằm gọn trong một bảng — nó được <b>tách ra</b> để tránh lặp. Bảng <code>orders</code> chỉ lưu <code>customer_id</code> chứ không lưu tên khách; muốn biết \"ai đã đặt đơn này?\" bạn phải <b>nối</b> <code>orders</code> với <code>customers</code>. Đây là kỹ năng phân biệt người biết SQL cơ bản với người dùng SQL thật sự.</p>\r\n<p><code>JOIN</code> ghép các dòng của hai bảng lại theo một điều kiện khớp — thường là <b>khóa ngoại</b> (foreign key) khớp với <b>khóa chính</b> (primary key). Ví dụ <code>orders.customer_id = customers.id</code>.</p>\r\n<p>Cửa hàng của chúng ta có bốn bảng liên kết như sơ đồ dưới. Nắm được các mối nối này, bạn trả lời được gần như mọi câu hỏi.</p>\r\n\r\n<figure class=\"diagram\">\r\n<svg viewBox=\"0 0 640 200\" width=\"100%\" role=\"img\" aria-label=\"Sơ đồ liên kết bốn bảng\">\r\n<style>\r\n.tb{fill:#121C30;stroke:#22304C;rx:8}.tt{fill:#F5B942;font:600 13px IBM Plex Mono,monospace}\r\n.tc{fill:#E8E4D8;font:400 11px IBM Plex Mono,monospace}.ln{stroke:#7FD1C0;stroke-width:2;fill:none}\r\n.lb{fill:#7FD1C0;font:400 10px IBM Plex Sans,sans-serif}\r\n</style>\r\n<rect class=\"tb\" x=\"10\" y=\"40\" width=\"130\" height=\"70\"/><text class=\"tt\" x=\"20\" y=\"60\">customers</text><text class=\"tc\" x=\"20\" y=\"80\">id (PK)</text><text class=\"tc\" x=\"20\" y=\"96\">name, city</text>\r\n<rect class=\"tb\" x=\"230\" y=\"40\" width=\"130\" height=\"70\"/><text class=\"tt\" x=\"240\" y=\"60\">orders</text><text class=\"tc\" x=\"240\" y=\"80\">id (PK)</text><text class=\"tc\" x=\"240\" y=\"96\">customer_id (FK)</text>\r\n<rect class=\"tb\" x=\"450\" y=\"20\" width=\"180\" height=\"70\"/><text class=\"tt\" x=\"460\" y=\"40\">order_items</text><text class=\"tc\" x=\"460\" y=\"60\">order_id (FK)</text><text class=\"tc\" x=\"460\" y=\"76\">product_id (FK)</text>\r\n<rect class=\"tb\" x=\"450\" y=\"120\" width=\"180\" height=\"60\"/><text class=\"tt\" x=\"460\" y=\"140\">products</text><text class=\"tc\" x=\"460\" y=\"160\">id (PK), name, price</text>\r\n<path class=\"ln\" d=\"M140 75 L230 75\"/><text class=\"lb\" x=\"150\" y=\"70\">customer_id → id</text>\r\n<path class=\"ln\" d=\"M360 70 L450 55\"/><text class=\"lb\" x=\"360\" y=\"48\">order_id → id</text>\r\n<path class=\"ln\" d=\"M540 90 L540 120\"/><text class=\"lb\" x=\"545\" y=\"110\">product_id → id</text>\r\n</svg>\r\n<figcaption>Khóa ngoại (FK) của bảng này trỏ tới khóa chính (PK) của bảng kia — đó là chỗ để JOIN.</figcaption>\r\n</figure>\r\n\r\n<h4>1. INNER JOIN — ghép theo điều kiện khớp</h4>\r\n<p>Cú pháp: liệt kê bảng đầu ở <code>FROM</code>, bảng thứ hai ở <code>JOIN</code>, và nêu điều kiện khớp ở <code>ON</code>. Dùng <b>bí danh bảng</b> ngắn (<code>o</code>, <code>c</code>) rồi gọi cột dạng <code>o.cột</code>.</p>\r\n<pre class=\"run\">SELECT o.id AS order_id, c.name AS customer\r\nFROM orders o\r\nJOIN customers c ON o.customer_id = c.id\r\nORDER BY o.id;</pre>\r\n<p>Mỗi đơn hàng được ghép với đúng khách hàng của nó. Vì cột <code>name</code> có ở cả hai bảng, ta <b>phải</b> ghi rõ <code>c.name</code>.</p>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 1.</b> Ghép <code>orders</code> với <code>customers</code>: hiển thị <code>o.id AS order_id</code> và <code>c.name AS customer</code>, sắp theo <code>o.id</code>.</span>\r\n<template class=\"st\">SELECT o.id AS order_id, c.name AS customer\r\nFROM orders o\r\nJOIN customers c ON </template>\r\n<template class=\"ref\">SELECT o.id AS order_id, c.name AS customer FROM orders o JOIN customers c ON o.customer_id = c.id ORDER BY o.id</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 2.</b> Như trên nhưng thêm cột <code>o.order_date</code> vào giữa: <code>order_id</code>, <code>order_date</code>, <code>customer</code>. Sắp theo <code>o.id</code>.</span>\r\n<template class=\"st\">SELECT o.id AS order_id, o.order_date, c.name AS customer\r\nFROM orders o\r\nJOIN customers c ON </template>\r\n<template class=\"ref\">SELECT o.id AS order_id, o.order_date, c.name AS customer FROM orders o JOIN customers c ON o.customer_id = c.id ORDER BY o.id</template></div>\r\n\r\n<h4>2. Nối bảng chi tiết với danh mục</h4>\r\n<p><code>order_items</code> chỉ có <code>product_id</code> — nối với <code>products</code> để lấy tên và giá.</p>\r\n<pre class=\"run\">SELECT oi.order_id, p.name AS product, oi.qty\r\nFROM order_items oi\r\nJOIN products p ON oi.product_id = p.id\r\nORDER BY oi.id;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 3.</b> Ghép <code>order_items</code> với <code>products</code>: hiển thị <code>oi.order_id</code>, <code>p.name AS product</code>, <code>oi.qty</code>, sắp theo <code>oi.id</code>.</span>\r\n<template class=\"st\">SELECT oi.order_id, p.name AS product, oi.qty\r\nFROM order_items oi\r\nJOIN products p ON </template>\r\n<template class=\"ref\">SELECT oi.order_id, p.name AS product, oi.qty FROM order_items oi JOIN products p ON oi.product_id = p.id ORDER BY oi.id</template></div>\r\n\r\n<h4>3. Tính toán sau khi nối</h4>\r\n<p>Nối xong, bạn dùng được cột của <i>cả hai</i> bảng trong một biểu thức — ví dụ thành tiền mỗi dòng = giá × số lượng.</p>\r\n<pre class=\"run\">SELECT p.name AS product, oi.qty, p.price,\r\n       p.price * oi.qty AS line_total\r\nFROM order_items oi\r\nJOIN products p ON oi.product_id = p.id\r\nORDER BY oi.id;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 4.</b> Ghép <code>order_items</code> với <code>products</code>; hiển thị <code>p.name AS product</code>, <code>oi.qty</code>, <code>p.price</code>, và <code>p.price * oi.qty AS line_total</code>. Sắp theo <code>oi.id</code>.</span>\r\n<template class=\"st\">SELECT p.name AS product, oi.qty, p.price, p.price * oi.qty AS line_total\r\nFROM order_items oi\r\nJOIN products p ON </template>\r\n<template class=\"ref\">SELECT p.name AS product, oi.qty, p.price, p.price * oi.qty AS line_total FROM order_items oi JOIN products p ON oi.product_id = p.id ORDER BY oi.id</template></div>\r\n\r\n<h4>4. Nối kèm lọc (WHERE)</h4>\r\n<p><code>WHERE</code> hoạt động bình thường sau khi nối — và bạn lọc được theo cột của bất kỳ bảng nào.</p>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 5.</b> Các mặt hàng thuộc <b>đơn số 4</b>: ghép <code>order_items</code> với <code>products</code>, lọc <code>oi.order_id = 4</code>, hiển thị <code>p.name AS product</code>, <code>oi.qty</code>, sắp theo <code>oi.id</code>.</span>\r\n<template class=\"st\">SELECT p.name AS product, oi.qty\r\nFROM order_items oi\r\nJOIN products p ON oi.product_id = p.id\r\nWHERE </template>\r\n<template class=\"ref\">SELECT p.name AS product, oi.qty FROM order_items oi JOIN products p ON oi.product_id = p.id WHERE oi.order_id = 4 ORDER BY oi.id</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 6.</b> Các đơn hàng của khách ở <b>Hà Nội</b>: ghép <code>orders</code> với <code>customers</code>, lọc <code>c.city = 'Hà Nội'</code>, hiển thị <code>o.id AS order_id</code>, <code>c.name AS customer</code>, sắp theo <code>o.id</code>.</span>\r\n<template class=\"st\">SELECT o.id AS order_id, c.name AS customer\r\nFROM orders o\r\nJOIN customers c ON o.customer_id = c.id\r\nWHERE </template>\r\n<template class=\"ref\">SELECT o.id AS order_id, c.name AS customer FROM orders o JOIN customers c ON o.customer_id = c.id WHERE c.city = 'Hà Nội' ORDER BY o.id</template></div>\r\n\r\n<h4>5. Nối rồi gộp nhóm (JOIN + GROUP BY)</h4>\r\n<p>Sức mạnh thật sự: nối các bảng rồi tổng hợp. Ví dụ tổng số lượng mỗi khách đã mua.</p>\r\n<pre class=\"run\">SELECT o.customer_id, SUM(oi.qty) AS total_qty\r\nFROM orders o\r\nJOIN order_items oi ON oi.order_id = o.id\r\nGROUP BY o.customer_id\r\nORDER BY o.customer_id;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 7.</b> Tổng số lượng mỗi khách đã mua: ghép <code>orders</code> với <code>order_items</code>, gom theo <code>o.customer_id</code>, hiển thị <code>o.customer_id</code> và <code>SUM(oi.qty) AS total_qty</code>, sắp theo <code>o.customer_id</code>.</span>\r\n<template class=\"st\">SELECT o.customer_id, SUM(oi.qty) AS total_qty\r\nFROM orders o\r\nJOIN order_items oi ON oi.order_id = o.id\r\nGROUP BY </template>\r\n<template class=\"ref\">SELECT o.customer_id, SUM(oi.qty) AS total_qty FROM orders o JOIN order_items oi ON oi.order_id = o.id GROUP BY o.customer_id ORDER BY o.customer_id</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 8.</b> Doanh thu mỗi <b>danh mục</b>: ghép <code>order_items</code> với <code>products</code>, gom theo <code>p.category</code>, hiển thị <code>p.category</code> và <code>SUM(p.price * oi.qty) AS revenue</code>, sắp theo <code>p.category</code>.</span>\r\n<template class=\"st\">SELECT p.category, SUM(p.price * oi.qty) AS revenue\r\nFROM order_items oi\r\nJOIN products p ON oi.product_id = p.id\r\nGROUP BY </template>\r\n<template class=\"ref\">SELECT p.category, SUM(p.price * oi.qty) AS revenue FROM order_items oi JOIN products p ON oi.product_id = p.id GROUP BY p.category ORDER BY p.category</template></div>\r\n\r\n<h4>6. Nối ba bảng trở lên</h4>\r\n<p>Cần cả tên khách <i>và</i> tên sản phẩm cho mỗi dòng hàng? Chỉ việc nối tiếp thêm bảng — mỗi bảng một <code>JOIN … ON …</code>.</p>\r\n<pre class=\"run\">SELECT c.name AS customer, p.name AS product, oi.qty\r\nFROM order_items oi\r\nJOIN orders o    ON oi.order_id = o.id\r\nJOIN customers c ON o.customer_id = c.id\r\nJOIN products p  ON oi.product_id = p.id\r\nORDER BY oi.id;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 9.</b> Với mỗi dòng hàng, hiển thị <code>c.name AS customer</code>, <code>p.name AS product</code>, <code>oi.qty</code> (nối cả bốn bảng như ví dụ trên), sắp theo <code>oi.id</code>.</span>\r\n<template class=\"st\">SELECT c.name AS customer, p.name AS product, oi.qty\r\nFROM order_items oi\r\nJOIN orders o ON oi.order_id = o.id\r\nJOIN customers c ON o.customer_id = c.id\r\nJOIN products p ON </template>\r\n<template class=\"ref\">SELECT c.name AS customer, p.name AS product, oi.qty FROM order_items oi JOIN orders o ON oi.order_id = o.id JOIN customers c ON o.customer_id = c.id JOIN products p ON oi.product_id = p.id ORDER BY oi.id</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 10.</b> Số đơn của mỗi khách (kèm tên): ghép <code>orders</code> với <code>customers</code>, gom theo <code>c.id</code>, hiển thị <code>c.name AS customer</code> và <code>COUNT(*) AS order_count</code>, sắp theo <code>c.id</code>.</span>\r\n<template class=\"st\">SELECT c.name AS customer, COUNT(*) AS order_count\r\nFROM orders o\r\nJOIN customers c ON o.customer_id = c.id\r\nGROUP BY </template>\r\n<template class=\"ref\">SELECT c.name AS customer, COUNT(*) AS order_count FROM orders o JOIN customers c ON o.customer_id = c.id GROUP BY c.id ORDER BY c.id</template></div>\r\n\r\n<h4>7. Bài toán tổng hợp</h4>\r\n<div class=\"ex stretch\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 11. 🔥 Nâng cao.</b> <b>Tổng chi tiêu của mỗi khách.</b> Nối <code>orders</code> → <code>order_items</code> → <code>products</code> → <code>customers</code>, gom theo <code>c.id</code>, hiển thị <code>c.name AS customer</code> và <code>SUM(p.price * oi.qty) AS total_spent</code>, sắp theo <code>total_spent</code> giảm dần.</span>\r\n<template class=\"st\">SELECT c.name AS customer, SUM(p.price * oi.qty) AS total_spent\r\nFROM orders o\r\nJOIN order_items oi ON oi.order_id = o.id\r\nJOIN products p ON oi.product_id = p.id\r\nJOIN customers c ON o.customer_id = c.id\r\nGROUP BY c.id\r\nORDER BY </template>\r\n<template class=\"ref\">SELECT c.name AS customer, SUM(p.price * oi.qty) AS total_spent FROM orders o JOIN order_items oi ON oi.order_id = o.id JOIN products p ON oi.product_id = p.id JOIN customers c ON o.customer_id = c.id GROUP BY c.id ORDER BY total_spent DESC</template></div>\r\n\r\n<h4>🏠 Homework</h4>\r\n<p>Bốn bài làm ở nhà, tự động chấm ngay trên trang. Bài cuối là bài nâng cao.</p>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 1.</b> Ghép <code>orders</code> với <code>customers</code>: hiển thị <code>o.order_date</code> và <code>c.name AS customer</code>, sắp theo <code>o.order_date</code>.</span>\r\n<template class=\"st\">SELECT o.order_date, c.name AS customer\r\nFROM orders o\r\nJOIN customers c ON </template>\r\n<template class=\"ref\">SELECT o.order_date, c.name AS customer FROM orders o JOIN customers c ON o.customer_id = c.id ORDER BY o.order_date</template></div>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 2.</b> Các dòng hàng thuộc nhóm <code>'Đồ uống'</code>: ghép <code>order_items</code> với <code>products</code>, lọc <code>p.category = 'Đồ uống'</code>, hiển thị <code>p.name AS product</code>, <code>oi.qty</code>, sắp theo <code>oi.id</code>.</span>\r\n<template class=\"st\">SELECT p.name AS product, oi.qty\r\nFROM order_items oi\r\nJOIN products p ON oi.product_id = p.id\r\nWHERE </template>\r\n<template class=\"ref\">SELECT p.name AS product, oi.qty FROM order_items oi JOIN products p ON oi.product_id = p.id WHERE p.category = 'Đồ uống' ORDER BY oi.id</template></div>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 3.</b> Doanh thu mỗi <b>sản phẩm</b>: ghép <code>order_items</code> với <code>products</code>, gom theo <code>p.id</code>, hiển thị <code>p.name AS product</code> và <code>SUM(p.price * oi.qty) AS revenue</code>, sắp theo <code>revenue</code> giảm dần.</span>\r\n<template class=\"st\">SELECT p.name AS product, SUM(p.price * oi.qty) AS revenue\r\nFROM order_items oi\r\nJOIN products p ON oi.product_id = p.id\r\nGROUP BY p.id\r\nORDER BY </template>\r\n<template class=\"ref\">SELECT p.name AS product, SUM(p.price * oi.qty) AS revenue FROM order_items oi JOIN products p ON oi.product_id = p.id GROUP BY p.id ORDER BY revenue DESC</template></div>\r\n<div class=\"ex homework stretch\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 4. 🔥 Nâng cao.</b> <b>Số sản phẩm khác nhau mỗi khách đã mua.</b> Nối <code>orders</code> → <code>order_items</code> → <code>customers</code>, gom theo <code>c.id</code>, hiển thị <code>c.name AS customer</code> và <code>COUNT(DISTINCT oi.product_id) AS distinct_products</code>, sắp theo <code>c.id</code>.</span>\r\n<template class=\"st\">SELECT c.name AS customer, COUNT(DISTINCT oi.product_id) AS distinct_products\r\nFROM orders o\r\nJOIN order_items oi ON oi.order_id = o.id\r\nJOIN customers c ON o.customer_id = c.id\r\nGROUP BY c.id\r\nORDER BY </template>\r\n<template class=\"ref\">SELECT c.name AS customer, COUNT(DISTINCT oi.product_id) AS distinct_products FROM orders o JOIN order_items oi ON oi.order_id = o.id JOIN customers c ON o.customer_id = c.id GROUP BY c.id ORDER BY c.id</template></div>","en":"<h3>Lesson 9 — JOIN: connecting tables</h3>\r\n<p>Real data doesn't sit in one table — it's <b>split apart</b> to avoid repetition. The <code>orders</code> table only stores a <code>customer_id</code>, not the customer's name; to answer \"who placed this order?\" you have to <b>join</b> <code>orders</code> to <code>customers</code>. This is the skill that separates people who know basic SQL from people who really use it.</p>\r\n<p><code>JOIN</code> stitches rows from two tables together on a matching condition — usually a <b>foreign key</b> matching a <b>primary key</b>. For example <code>orders.customer_id = customers.id</code>.</p>\r\n<p>Our shop has four linked tables, shown below. Once you understand these links, you can answer almost any question.</p>\r\n\r\n<figure class=\"diagram\">\r\n<svg viewBox=\"0 0 640 200\" width=\"100%\" role=\"img\" aria-label=\"Diagram of four linked tables\">\r\n<style>\r\n.tb{fill:#121C30;stroke:#22304C;rx:8}.tt{fill:#F5B942;font:600 13px IBM Plex Mono,monospace}\r\n.tc{fill:#E8E4D8;font:400 11px IBM Plex Mono,monospace}.ln{stroke:#7FD1C0;stroke-width:2;fill:none}\r\n.lb{fill:#7FD1C0;font:400 10px IBM Plex Sans,sans-serif}\r\n</style>\r\n<rect class=\"tb\" x=\"10\" y=\"40\" width=\"130\" height=\"70\"/><text class=\"tt\" x=\"20\" y=\"60\">customers</text><text class=\"tc\" x=\"20\" y=\"80\">id (PK)</text><text class=\"tc\" x=\"20\" y=\"96\">name, city</text>\r\n<rect class=\"tb\" x=\"230\" y=\"40\" width=\"130\" height=\"70\"/><text class=\"tt\" x=\"240\" y=\"60\">orders</text><text class=\"tc\" x=\"240\" y=\"80\">id (PK)</text><text class=\"tc\" x=\"240\" y=\"96\">customer_id (FK)</text>\r\n<rect class=\"tb\" x=\"450\" y=\"20\" width=\"180\" height=\"70\"/><text class=\"tt\" x=\"460\" y=\"40\">order_items</text><text class=\"tc\" x=\"460\" y=\"60\">order_id (FK)</text><text class=\"tc\" x=\"460\" y=\"76\">product_id (FK)</text>\r\n<rect class=\"tb\" x=\"450\" y=\"120\" width=\"180\" height=\"60\"/><text class=\"tt\" x=\"460\" y=\"140\">products</text><text class=\"tc\" x=\"460\" y=\"160\">id (PK), name, price</text>\r\n<path class=\"ln\" d=\"M140 75 L230 75\"/><text class=\"lb\" x=\"150\" y=\"70\">customer_id → id</text>\r\n<path class=\"ln\" d=\"M360 70 L450 55\"/><text class=\"lb\" x=\"360\" y=\"48\">order_id → id</text>\r\n<path class=\"ln\" d=\"M540 90 L540 120\"/><text class=\"lb\" x=\"545\" y=\"110\">product_id → id</text>\r\n</svg>\r\n<figcaption>A table's foreign key (FK) points to another table's primary key (PK) — that's where you JOIN.</figcaption>\r\n</figure>\r\n\r\n<h4>1. INNER JOIN — match rows together</h4>\r\n<p>Syntax: name the first table in <code>FROM</code>, the second in <code>JOIN</code>, and state the match condition in <code>ON</code>. Use short <b>table aliases</b> (<code>o</code>, <code>c</code>) and refer to columns as <code>o.column</code>.</p>\r\n<pre class=\"run\">SELECT o.id AS order_id, c.name AS customer\r\nFROM orders o\r\nJOIN customers c ON o.customer_id = c.id\r\nORDER BY o.id;</pre>\r\n<p>Each order is matched to its customer. Because <code>name</code> exists in both tables, you <b>must</b> write <code>c.name</code>.</p>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 1.</b> Join <code>orders</code> to <code>customers</code>: show <code>o.id AS order_id</code> and <code>c.name AS customer</code>, sorted by <code>o.id</code>.</span>\r\n<template class=\"st\">SELECT o.id AS order_id, c.name AS customer\r\nFROM orders o\r\nJOIN customers c ON </template>\r\n<template class=\"ref\">SELECT o.id AS order_id, c.name AS customer FROM orders o JOIN customers c ON o.customer_id = c.id ORDER BY o.id</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 2.</b> As above but add <code>o.order_date</code> in the middle: <code>order_id</code>, <code>order_date</code>, <code>customer</code>. Sort by <code>o.id</code>.</span>\r\n<template class=\"st\">SELECT o.id AS order_id, o.order_date, c.name AS customer\r\nFROM orders o\r\nJOIN customers c ON </template>\r\n<template class=\"ref\">SELECT o.id AS order_id, o.order_date, c.name AS customer FROM orders o JOIN customers c ON o.customer_id = c.id ORDER BY o.id</template></div>\r\n\r\n<h4>2. Joining a detail table to its catalog</h4>\r\n<p><code>order_items</code> only has a <code>product_id</code> — join to <code>products</code> to get the name and price.</p>\r\n<pre class=\"run\">SELECT oi.order_id, p.name AS product, oi.qty\r\nFROM order_items oi\r\nJOIN products p ON oi.product_id = p.id\r\nORDER BY oi.id;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 3.</b> Join <code>order_items</code> to <code>products</code>: show <code>oi.order_id</code>, <code>p.name AS product</code>, <code>oi.qty</code>, sorted by <code>oi.id</code>.</span>\r\n<template class=\"st\">SELECT oi.order_id, p.name AS product, oi.qty\r\nFROM order_items oi\r\nJOIN products p ON </template>\r\n<template class=\"ref\">SELECT oi.order_id, p.name AS product, oi.qty FROM order_items oi JOIN products p ON oi.product_id = p.id ORDER BY oi.id</template></div>\r\n\r\n<h4>3. Calculating after a join</h4>\r\n<p>Once joined, you can use columns from <i>both</i> tables in one expression — e.g. line total = price × quantity.</p>\r\n<pre class=\"run\">SELECT p.name AS product, oi.qty, p.price,\r\n       p.price * oi.qty AS line_total\r\nFROM order_items oi\r\nJOIN products p ON oi.product_id = p.id\r\nORDER BY oi.id;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 4.</b> Join <code>order_items</code> to <code>products</code>; show <code>p.name AS product</code>, <code>oi.qty</code>, <code>p.price</code>, and <code>p.price * oi.qty AS line_total</code>. Sort by <code>oi.id</code>.</span>\r\n<template class=\"st\">SELECT p.name AS product, oi.qty, p.price, p.price * oi.qty AS line_total\r\nFROM order_items oi\r\nJOIN products p ON </template>\r\n<template class=\"ref\">SELECT p.name AS product, oi.qty, p.price, p.price * oi.qty AS line_total FROM order_items oi JOIN products p ON oi.product_id = p.id ORDER BY oi.id</template></div>\r\n\r\n<h4>4. Join with a filter (WHERE)</h4>\r\n<p><code>WHERE</code> works as usual after a join — and you can filter on a column from any table.</p>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 5.</b> Items in <b>order 4</b>: join <code>order_items</code> to <code>products</code>, filter <code>oi.order_id = 4</code>, show <code>p.name AS product</code>, <code>oi.qty</code>, sorted by <code>oi.id</code>.</span>\r\n<template class=\"st\">SELECT p.name AS product, oi.qty\r\nFROM order_items oi\r\nJOIN products p ON oi.product_id = p.id\r\nWHERE </template>\r\n<template class=\"ref\">SELECT p.name AS product, oi.qty FROM order_items oi JOIN products p ON oi.product_id = p.id WHERE oi.order_id = 4 ORDER BY oi.id</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 6.</b> Orders from customers in <b>Hà Nội</b>: join <code>orders</code> to <code>customers</code>, filter <code>c.city = 'Hà Nội'</code>, show <code>o.id AS order_id</code>, <code>c.name AS customer</code>, sorted by <code>o.id</code>.</span>\r\n<template class=\"st\">SELECT o.id AS order_id, c.name AS customer\r\nFROM orders o\r\nJOIN customers c ON o.customer_id = c.id\r\nWHERE </template>\r\n<template class=\"ref\">SELECT o.id AS order_id, c.name AS customer FROM orders o JOIN customers c ON o.customer_id = c.id WHERE c.city = 'Hà Nội' ORDER BY o.id</template></div>\r\n\r\n<h4>5. Join then group (JOIN + GROUP BY)</h4>\r\n<p>The real power: join tables, then aggregate. For example, total quantity each customer bought.</p>\r\n<pre class=\"run\">SELECT o.customer_id, SUM(oi.qty) AS total_qty\r\nFROM orders o\r\nJOIN order_items oi ON oi.order_id = o.id\r\nGROUP BY o.customer_id\r\nORDER BY o.customer_id;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 7.</b> Total quantity each customer bought: join <code>orders</code> to <code>order_items</code>, group by <code>o.customer_id</code>, show <code>o.customer_id</code> and <code>SUM(oi.qty) AS total_qty</code>, sorted by <code>o.customer_id</code>.</span>\r\n<template class=\"st\">SELECT o.customer_id, SUM(oi.qty) AS total_qty\r\nFROM orders o\r\nJOIN order_items oi ON oi.order_id = o.id\r\nGROUP BY </template>\r\n<template class=\"ref\">SELECT o.customer_id, SUM(oi.qty) AS total_qty FROM orders o JOIN order_items oi ON oi.order_id = o.id GROUP BY o.customer_id ORDER BY o.customer_id</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 8.</b> Revenue per <b>category</b>: join <code>order_items</code> to <code>products</code>, group by <code>p.category</code>, show <code>p.category</code> and <code>SUM(p.price * oi.qty) AS revenue</code>, sorted by <code>p.category</code>.</span>\r\n<template class=\"st\">SELECT p.category, SUM(p.price * oi.qty) AS revenue\r\nFROM order_items oi\r\nJOIN products p ON oi.product_id = p.id\r\nGROUP BY </template>\r\n<template class=\"ref\">SELECT p.category, SUM(p.price * oi.qty) AS revenue FROM order_items oi JOIN products p ON oi.product_id = p.id GROUP BY p.category ORDER BY p.category</template></div>\r\n\r\n<h4>6. Joining three tables or more</h4>\r\n<p>Need both the customer name <i>and</i> the product name for each line? Just keep chaining tables — one <code>JOIN … ON …</code> each.</p>\r\n<pre class=\"run\">SELECT c.name AS customer, p.name AS product, oi.qty\r\nFROM order_items oi\r\nJOIN orders o    ON oi.order_id = o.id\r\nJOIN customers c ON o.customer_id = c.id\r\nJOIN products p  ON oi.product_id = p.id\r\nORDER BY oi.id;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 9.</b> For each line item, show <code>c.name AS customer</code>, <code>p.name AS product</code>, <code>oi.qty</code> (join all four tables as above), sorted by <code>oi.id</code>.</span>\r\n<template class=\"st\">SELECT c.name AS customer, p.name AS product, oi.qty\r\nFROM order_items oi\r\nJOIN orders o ON oi.order_id = o.id\r\nJOIN customers c ON o.customer_id = c.id\r\nJOIN products p ON </template>\r\n<template class=\"ref\">SELECT c.name AS customer, p.name AS product, oi.qty FROM order_items oi JOIN orders o ON oi.order_id = o.id JOIN customers c ON o.customer_id = c.id JOIN products p ON oi.product_id = p.id ORDER BY oi.id</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 10.</b> Number of orders per customer (with names): join <code>orders</code> to <code>customers</code>, group by <code>c.id</code>, show <code>c.name AS customer</code> and <code>COUNT(*) AS order_count</code>, sorted by <code>c.id</code>.</span>\r\n<template class=\"st\">SELECT c.name AS customer, COUNT(*) AS order_count\r\nFROM orders o\r\nJOIN customers c ON o.customer_id = c.id\r\nGROUP BY </template>\r\n<template class=\"ref\">SELECT c.name AS customer, COUNT(*) AS order_count FROM orders o JOIN customers c ON o.customer_id = c.id GROUP BY c.id ORDER BY c.id</template></div>\r\n\r\n<h4>7. Putting it all together</h4>\r\n<div class=\"ex stretch\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 11. 🔥 Stretch.</b> <b>Total spend per customer.</b> Join <code>orders</code> → <code>order_items</code> → <code>products</code> → <code>customers</code>, group by <code>c.id</code>, show <code>c.name AS customer</code> and <code>SUM(p.price * oi.qty) AS total_spent</code>, sorted by <code>total_spent</code> descending.</span>\r\n<template class=\"st\">SELECT c.name AS customer, SUM(p.price * oi.qty) AS total_spent\r\nFROM orders o\r\nJOIN order_items oi ON oi.order_id = o.id\r\nJOIN products p ON oi.product_id = p.id\r\nJOIN customers c ON o.customer_id = c.id\r\nGROUP BY c.id\r\nORDER BY </template>\r\n<template class=\"ref\">SELECT c.name AS customer, SUM(p.price * oi.qty) AS total_spent FROM orders o JOIN order_items oi ON oi.order_id = o.id JOIN products p ON oi.product_id = p.id JOIN customers c ON o.customer_id = c.id GROUP BY c.id ORDER BY total_spent DESC</template></div>\r\n\r\n<h4>🏠 Homework</h4>\r\n<p>Four take-home exercises, auto-graded right on the page. The last one is a stretch.</p>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 1.</b> Join <code>orders</code> to <code>customers</code>: show <code>o.order_date</code> and <code>c.name AS customer</code>, sorted by <code>o.order_date</code>.</span>\r\n<template class=\"st\">SELECT o.order_date, c.name AS customer\r\nFROM orders o\r\nJOIN customers c ON </template>\r\n<template class=\"ref\">SELECT o.order_date, c.name AS customer FROM orders o JOIN customers c ON o.customer_id = c.id ORDER BY o.order_date</template></div>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 2.</b> Line items in the <code>'Đồ uống'</code> category: join <code>order_items</code> to <code>products</code>, filter <code>p.category = 'Đồ uống'</code>, show <code>p.name AS product</code>, <code>oi.qty</code>, sorted by <code>oi.id</code>.</span>\r\n<template class=\"st\">SELECT p.name AS product, oi.qty\r\nFROM order_items oi\r\nJOIN products p ON oi.product_id = p.id\r\nWHERE </template>\r\n<template class=\"ref\">SELECT p.name AS product, oi.qty FROM order_items oi JOIN products p ON oi.product_id = p.id WHERE p.category = 'Đồ uống' ORDER BY oi.id</template></div>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 3.</b> Revenue per <b>product</b>: join <code>order_items</code> to <code>products</code>, group by <code>p.id</code>, show <code>p.name AS product</code> and <code>SUM(p.price * oi.qty) AS revenue</code>, sorted by <code>revenue</code> descending.</span>\r\n<template class=\"st\">SELECT p.name AS product, SUM(p.price * oi.qty) AS revenue\r\nFROM order_items oi\r\nJOIN products p ON oi.product_id = p.id\r\nGROUP BY p.id\r\nORDER BY </template>\r\n<template class=\"ref\">SELECT p.name AS product, SUM(p.price * oi.qty) AS revenue FROM order_items oi JOIN products p ON oi.product_id = p.id GROUP BY p.id ORDER BY revenue DESC</template></div>\r\n<div class=\"ex homework stretch\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 4. 🔥 Stretch.</b> <b>Number of distinct products each customer bought.</b> Join <code>orders</code> → <code>order_items</code> → <code>customers</code>, group by <code>c.id</code>, show <code>c.name AS customer</code> and <code>COUNT(DISTINCT oi.product_id) AS distinct_products</code>, sorted by <code>c.id</code>.</span>\r\n<template class=\"st\">SELECT c.name AS customer, COUNT(DISTINCT oi.product_id) AS distinct_products\r\nFROM orders o\r\nJOIN order_items oi ON oi.order_id = o.id\r\nJOIN customers c ON o.customer_id = c.id\r\nGROUP BY c.id\r\nORDER BY </template>\r\n<template class=\"ref\">SELECT c.name AS customer, COUNT(DISTINCT oi.product_id) AS distinct_products FROM orders o JOIN order_items oi ON oi.order_id = o.id JOIN customers c ON o.customer_id = c.id GROUP BY c.id ORDER BY c.id</template></div>"}},{"t":{"vi":"LEFT JOIN & NULL","en":"LEFT JOIN & NULL"},"html":{"vi":"<h3>Bài 10 — LEFT JOIN & NULL</h3>\r\n<p><code>JOIN</code> ở Bài 9 (còn gọi là <b>INNER JOIN</b>) chỉ giữ những dòng <b>khớp được</b> ở cả hai bảng. Nhưng nhiều câu hỏi quan trọng lại nằm ở chỗ <i>không</i> khớp: \"khách nào <b>chưa từng</b> đặt hàng?\", \"sản phẩm nào <b>chưa bán được</b> cái nào?\". INNER JOIN sẽ <b>giấu mất</b> đúng những dòng bạn cần tìm.</p>\r\n<p><code>LEFT JOIN</code> giải quyết việc đó: nó giữ <b>tất cả</b> các dòng của bảng bên trái, và với những dòng không tìm được cặp khớp bên phải, nó điền <code>NULL</code> (giá trị \"trống\"). Nhờ vậy khách hàng không có đơn vẫn xuất hiện — kèm <code>NULL</code> ở các cột của đơn.</p>\r\n<p>Khách hàng <b>Phạm Thị D</b> chưa có đơn nào, và vài sản phẩm chưa bán được — đây là dữ liệu hoàn hảo để luyện <code>LEFT JOIN</code> và cách xử lý <code>NULL</code> bằng <code>IS NULL</code> và <code>COALESCE</code>.</p>\r\n\r\n<h4>1. LEFT JOIN — giữ mọi dòng bên trái</h4>\r\n<p>Đổi <code>JOIN</code> thành <code>LEFT JOIN</code>: mọi khách hàng đều xuất hiện, kể cả người không có đơn (cột đơn hàng sẽ là <code>NULL</code>).</p>\r\n<pre class=\"run\">SELECT c.name AS customer, o.id AS order_id\r\nFROM customers c\r\nLEFT JOIN orders o ON o.customer_id = c.id\r\nORDER BY c.id, o.id;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 1.</b> Ghép <code>customers</code> với <code>orders</code> bằng <code>LEFT JOIN</code>, hiển thị <code>c.name AS customer</code> và <code>o.id AS order_id</code> (mọi khách, kể cả người chưa có đơn), sắp theo <code>c.id, o.id</code>.</span>\r\n<template class=\"st\">SELECT c.name AS customer, o.id AS order_id\r\nFROM customers c\r\nLEFT JOIN orders o ON </template>\r\n<template class=\"ref\">SELECT c.name AS customer, o.id AS order_id FROM customers c LEFT JOIN orders o ON o.customer_id = c.id ORDER BY c.id, o.id</template></div>\r\n\r\n<h4>2. IS NULL — tìm những dòng không khớp</h4>\r\n<p>Không thể so sánh <code>NULL</code> bằng <code>=</code>. Phải dùng <code>IS NULL</code> (hoặc <code>IS NOT NULL</code>). Kết hợp <code>LEFT JOIN</code> + <code>WHERE ... IS NULL</code> là cách kinh điển để tìm \"những cái không có cặp\".</p>\r\n<pre class=\"run\">SELECT c.name AS customer\r\nFROM customers c\r\nLEFT JOIN orders o ON o.customer_id = c.id\r\nWHERE o.id IS NULL;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 2.</b> Tìm khách <b>chưa từng đặt hàng</b>: <code>LEFT JOIN</code> <code>customers</code> với <code>orders</code>, lọc <code>o.id IS NULL</code>, hiển thị <code>c.name AS customer</code>, sắp theo <code>c.id</code>.</span>\r\n<template class=\"st\">SELECT c.name AS customer\r\nFROM customers c\r\nLEFT JOIN orders o ON o.customer_id = c.id\r\nWHERE </template>\r\n<template class=\"ref\">SELECT c.name AS customer FROM customers c LEFT JOIN orders o ON o.customer_id = c.id WHERE o.id IS NULL ORDER BY c.id</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 3.</b> Tìm sản phẩm <b>chưa bán được cái nào</b>: <code>LEFT JOIN</code> <code>products</code> với <code>order_items</code>, lọc <code>oi.id IS NULL</code>, hiển thị <code>p.name AS product</code>, sắp theo <code>p.id</code>.</span>\r\n<template class=\"st\">SELECT p.name AS product\r\nFROM products p\r\nLEFT JOIN order_items oi ON oi.product_id = p.id\r\nWHERE </template>\r\n<template class=\"ref\">SELECT p.name AS product FROM products p LEFT JOIN order_items oi ON oi.product_id = p.id WHERE oi.id IS NULL ORDER BY p.id</template></div>\r\n\r\n<h4>3. Đếm kèm số 0</h4>\r\n<p>Điểm khác biệt tinh tế: <code>COUNT(*)</code> đếm cả dòng, nhưng <code>COUNT(cột)</code> <b>bỏ qua NULL</b>. Vì vậy <code>COUNT(o.id)</code> trên kết quả <code>LEFT JOIN</code> cho ra <b>0</b> đúng với khách không có đơn.</p>\r\n<pre class=\"run\">SELECT c.name AS customer, COUNT(o.id) AS order_count\r\nFROM customers c\r\nLEFT JOIN orders o ON o.customer_id = c.id\r\nGROUP BY c.id\r\nORDER BY c.id;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 4.</b> Đếm <b>số đơn mỗi khách, kể cả 0</b>: <code>LEFT JOIN</code> <code>customers</code> với <code>orders</code>, gom theo <code>c.id</code>, hiển thị <code>c.name AS customer</code> và <code>COUNT(o.id) AS order_count</code>, sắp theo <code>c.id</code>.</span>\r\n<template class=\"st\">SELECT c.name AS customer, COUNT(o.id) AS order_count\r\nFROM customers c\r\nLEFT JOIN orders o ON o.customer_id = c.id\r\nGROUP BY </template>\r\n<template class=\"ref\">SELECT c.name AS customer, COUNT(o.id) AS order_count FROM customers c LEFT JOIN orders o ON o.customer_id = c.id GROUP BY c.id ORDER BY c.id</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 5.</b> Đếm <b>số dòng hàng mỗi khách, kể cả 0</b>: <code>LEFT JOIN</code> <code>customers</code> → <code>orders</code> → <code>order_items</code>, gom theo <code>c.id</code>, hiển thị <code>c.name AS customer</code> và <code>COUNT(oi.id) AS line_count</code>, sắp theo <code>c.id</code>.</span>\r\n<template class=\"st\">SELECT c.name AS customer, COUNT(oi.id) AS line_count\r\nFROM customers c\r\nLEFT JOIN orders o ON o.customer_id = c.id\r\nLEFT JOIN order_items oi ON oi.order_id = o.id\r\nGROUP BY </template>\r\n<template class=\"ref\">SELECT c.name AS customer, COUNT(oi.id) AS line_count FROM customers c LEFT JOIN orders o ON o.customer_id = c.id LEFT JOIN order_items oi ON oi.order_id = o.id GROUP BY c.id ORDER BY c.id</template></div>\r\n\r\n<h4>4. COALESCE — thay NULL bằng giá trị khác</h4>\r\n<p><code>SUM</code> trên nhóm rỗng trả về <code>NULL</code>, không phải 0. <code>COALESCE(x, 0)</code> nghĩa là \"nếu <code>x</code> là NULL thì dùng 0\". Rất hợp cho báo cáo tiền.</p>\r\n<pre class=\"run\">SELECT c.name AS customer,\r\n       COALESCE(SUM(p.price * oi.qty), 0) AS total_spent\r\nFROM customers c\r\nLEFT JOIN orders o      ON o.customer_id = c.id\r\nLEFT JOIN order_items oi ON oi.order_id = o.id\r\nLEFT JOIN products p     ON oi.product_id = p.id\r\nGROUP BY c.id\r\nORDER BY c.id;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 6.</b> Tổng chi tiêu mỗi khách, <b>khách không mua ghi 0</b>: dùng chuỗi <code>LEFT JOIN</code> như ví dụ, hiển thị <code>c.name AS customer</code> và <code>COALESCE(SUM(p.price * oi.qty), 0) AS total_spent</code>, gom theo <code>c.id</code>, sắp theo <code>c.id</code>.</span>\r\n<template class=\"st\">SELECT c.name AS customer, COALESCE(SUM(p.price * oi.qty), 0) AS total_spent\r\nFROM customers c\r\nLEFT JOIN orders o ON o.customer_id = c.id\r\nLEFT JOIN order_items oi ON oi.order_id = o.id\r\nLEFT JOIN products p ON oi.product_id = p.id\r\nGROUP BY </template>\r\n<template class=\"ref\">SELECT c.name AS customer, COALESCE(SUM(p.price * oi.qty), 0) AS total_spent FROM customers c LEFT JOIN orders o ON o.customer_id = c.id LEFT JOIN order_items oi ON oi.order_id = o.id LEFT JOIN products p ON oi.product_id = p.id GROUP BY c.id ORDER BY c.id</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 7.</b> Tổng số lượng bán ra mỗi sản phẩm, <b>chưa bán ghi 0</b>: <code>LEFT JOIN</code> <code>products</code> với <code>order_items</code>, hiển thị <code>p.name AS product</code> và <code>COALESCE(SUM(oi.qty), 0) AS total_qty</code>, gom theo <code>p.id</code>, sắp theo <code>p.id</code>.</span>\r\n<template class=\"st\">SELECT p.name AS product, COALESCE(SUM(oi.qty), 0) AS total_qty\r\nFROM products p\r\nLEFT JOIN order_items oi ON oi.product_id = p.id\r\nGROUP BY </template>\r\n<template class=\"ref\">SELECT p.name AS product, COALESCE(SUM(oi.qty), 0) AS total_qty FROM products p LEFT JOIN order_items oi ON oi.product_id = p.id GROUP BY p.id ORDER BY p.id</template></div>\r\n\r\n<h4>5. IS NOT NULL và HAVING</h4>\r\n<p>Ngược lại, <code>IS NOT NULL</code> giữ những dòng <i>có</i> khớp. Và bạn có thể lọc nhóm \"rỗng\" bằng <code>HAVING COUNT(...) = 0</code>.</p>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 8.</b> Đếm <b>số lần mỗi sản phẩm xuất hiện trong các dòng hàng, kể cả 0</b>: <code>LEFT JOIN</code> <code>products</code> với <code>order_items</code>, hiển thị <code>p.name AS product</code> và <code>COUNT(oi.id) AS times_ordered</code>, gom theo <code>p.id</code>, sắp theo <code>times_ordered</code> giảm dần rồi <code>p.id</code>.</span>\r\n<template class=\"st\">SELECT p.name AS product, COUNT(oi.id) AS times_ordered\r\nFROM products p\r\nLEFT JOIN order_items oi ON oi.product_id = p.id\r\nGROUP BY p.id\r\nORDER BY </template>\r\n<template class=\"ref\">SELECT p.name AS product, COUNT(oi.id) AS times_ordered FROM products p LEFT JOIN order_items oi ON oi.product_id = p.id GROUP BY p.id ORDER BY times_ordered DESC, p.id</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 9.</b> Tìm sản phẩm chưa bán được, <b>bằng HAVING</b>: <code>LEFT JOIN</code> <code>products</code> với <code>order_items</code>, gom theo <code>p.id</code>, giữ nhóm có <code>COUNT(oi.id) = 0</code>, hiển thị <code>p.name AS product</code>, sắp theo <code>p.id</code>.</span>\r\n<template class=\"st\">SELECT p.name AS product\r\nFROM products p\r\nLEFT JOIN order_items oi ON oi.product_id = p.id\r\nGROUP BY p.id\r\nHAVING </template>\r\n<template class=\"ref\">SELECT p.name AS product FROM products p LEFT JOIN order_items oi ON oi.product_id = p.id GROUP BY p.id HAVING COUNT(oi.id) = 0 ORDER BY p.id</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 10.</b> Liệt kê tên các khách <b>có ít nhất một đơn</b> (dùng <code>IS NOT NULL</code>): <code>LEFT JOIN</code> <code>customers</code> với <code>orders</code>, lọc <code>o.id IS NOT NULL</code>, hiển thị <code>DISTINCT c.name AS customer</code>, sắp theo <code>c.id</code>.</span>\r\n<template class=\"st\">SELECT DISTINCT c.name AS customer\r\nFROM customers c\r\nLEFT JOIN orders o ON o.customer_id = c.id\r\nWHERE </template>\r\n<template class=\"ref\">SELECT DISTINCT c.name AS customer FROM customers c LEFT JOIN orders o ON o.customer_id = c.id WHERE o.id IS NOT NULL ORDER BY c.id</template></div>\r\n\r\n<h4>6. Báo cáo tổng hợp không bỏ sót ai</h4>\r\n<div class=\"ex stretch\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 11. 🔥 Nâng cao.</b> Báo cáo mỗi khách gồm <b>số đơn</b> và <b>tổng chi tiêu</b>, <b>không bỏ sót khách nào</b>. Dùng chuỗi <code>LEFT JOIN</code> <code>customers</code> → <code>orders</code> → <code>order_items</code> → <code>products</code>; hiển thị <code>c.name AS customer</code>, <code>COUNT(DISTINCT o.id) AS order_count</code>, <code>COALESCE(SUM(p.price * oi.qty), 0) AS total_spent</code>; gom theo <code>c.id</code>; sắp theo <code>total_spent</code> giảm dần rồi <code>c.id</code>.</span>\r\n<template class=\"st\">SELECT c.name AS customer, COUNT(DISTINCT o.id) AS order_count, COALESCE(SUM(p.price * oi.qty), 0) AS total_spent\r\nFROM customers c\r\nLEFT JOIN orders o ON o.customer_id = c.id\r\nLEFT JOIN order_items oi ON oi.order_id = o.id\r\nLEFT JOIN products p ON oi.product_id = p.id\r\nGROUP BY c.id\r\nORDER BY </template>\r\n<template class=\"ref\">SELECT c.name AS customer, COUNT(DISTINCT o.id) AS order_count, COALESCE(SUM(p.price * oi.qty), 0) AS total_spent FROM customers c LEFT JOIN orders o ON o.customer_id = c.id LEFT JOIN order_items oi ON oi.order_id = o.id LEFT JOIN products p ON oi.product_id = p.id GROUP BY c.id ORDER BY total_spent DESC, c.id</template></div>\r\n\r\n<h4>🏠 Homework</h4>\r\n<p>Bốn bài làm ở nhà, tự động chấm ngay trên trang. Bài cuối là bài nâng cao.</p>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 1.</b> <code>LEFT JOIN</code> <code>customers</code> với <code>orders</code>, hiển thị <code>c.name AS customer</code> và <code>o.order_date</code> (mọi khách, kể cả người chưa có đơn), sắp theo <code>c.id, o.order_date</code>.</span>\r\n<template class=\"st\">SELECT c.name AS customer, o.order_date\r\nFROM customers c\r\nLEFT JOIN orders o ON </template>\r\n<template class=\"ref\">SELECT c.name AS customer, o.order_date FROM customers c LEFT JOIN orders o ON o.customer_id = c.id ORDER BY c.id, o.order_date</template></div>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 2.</b> Tìm khách chưa có đơn <b>bằng HAVING</b>: <code>LEFT JOIN</code> <code>customers</code> với <code>orders</code>, gom theo <code>c.id</code>, giữ nhóm có <code>COUNT(o.id) = 0</code>, hiển thị <code>c.name AS customer</code> và <code>COUNT(o.id) AS order_count</code>, sắp theo <code>c.id</code>.</span>\r\n<template class=\"st\">SELECT c.name AS customer, COUNT(o.id) AS order_count\r\nFROM customers c\r\nLEFT JOIN orders o ON o.customer_id = c.id\r\nGROUP BY c.id\r\nHAVING </template>\r\n<template class=\"ref\">SELECT c.name AS customer, COUNT(o.id) AS order_count FROM customers c LEFT JOIN orders o ON o.customer_id = c.id GROUP BY c.id HAVING COUNT(o.id) = 0 ORDER BY c.id</template></div>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 3.</b> Tổng số lượng bán ra mỗi sản phẩm (chưa bán ghi 0), sắp theo lượng bán: <code>LEFT JOIN</code> <code>products</code> với <code>order_items</code>, hiển thị <code>p.name AS product</code> và <code>COALESCE(SUM(oi.qty), 0) AS total_qty</code>, gom theo <code>p.id</code>, sắp theo <code>total_qty</code> giảm dần rồi <code>p.id</code>.</span>\r\n<template class=\"st\">SELECT p.name AS product, COALESCE(SUM(oi.qty), 0) AS total_qty\r\nFROM products p\r\nLEFT JOIN order_items oi ON oi.product_id = p.id\r\nGROUP BY p.id\r\nORDER BY </template>\r\n<template class=\"ref\">SELECT p.name AS product, COALESCE(SUM(oi.qty), 0) AS total_qty FROM products p LEFT JOIN order_items oi ON oi.product_id = p.id GROUP BY p.id ORDER BY total_qty DESC, p.id</template></div>\r\n<div class=\"ex homework stretch\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 4. 🔥 Nâng cao.</b> Báo cáo mỗi khách gồm số đơn và tổng chi tiêu (không bỏ sót ai), sắp <b>tăng dần</b> theo chi tiêu để khách chưa mua lên đầu. Dùng <code>LEFT JOIN</code> <code>customers</code> → <code>orders</code> → <code>order_items</code> → <code>products</code>; hiển thị <code>c.name AS customer</code>, <code>COUNT(DISTINCT o.id) AS orders</code>, <code>COALESCE(SUM(p.price * oi.qty), 0) AS total_spent</code>; gom theo <code>c.id</code>; sắp theo <code>total_spent</code> tăng dần rồi <code>c.id</code>.</span>\r\n<template class=\"st\">SELECT c.name AS customer, COUNT(DISTINCT o.id) AS orders, COALESCE(SUM(p.price * oi.qty), 0) AS total_spent\r\nFROM customers c\r\nLEFT JOIN orders o ON o.customer_id = c.id\r\nLEFT JOIN order_items oi ON oi.order_id = o.id\r\nLEFT JOIN products p ON oi.product_id = p.id\r\nGROUP BY c.id\r\nORDER BY </template>\r\n<template class=\"ref\">SELECT c.name AS customer, COUNT(DISTINCT o.id) AS orders, COALESCE(SUM(p.price * oi.qty), 0) AS total_spent FROM customers c LEFT JOIN orders o ON o.customer_id = c.id LEFT JOIN order_items oi ON oi.order_id = o.id LEFT JOIN products p ON oi.product_id = p.id GROUP BY c.id ORDER BY total_spent ASC, c.id</template></div>","en":"<h3>Lesson 10 — LEFT JOIN & NULL</h3>\r\n<p>The <code>JOIN</code> from Lesson 9 (also called <b>INNER JOIN</b>) keeps only rows that <b>match</b> in both tables. But many important questions live in the <i>non</i>-matches: \"which customer has <b>never</b> ordered?\", \"which product has <b>never</b> sold?\". An INNER JOIN <b>hides</b> exactly the rows you're looking for.</p>\r\n<p><code>LEFT JOIN</code> solves this: it keeps <b>all</b> rows from the left table, and for rows with no match on the right it fills in <code>NULL</code> (the \"empty\" value). So a customer with no orders still appears — with <code>NULL</code> in the order columns.</p>\r\n<p>Customer <b>Phạm Thị D</b> has no orders, and several products never sold — perfect data to practise <code>LEFT JOIN</code> and handling <code>NULL</code> with <code>IS NULL</code> and <code>COALESCE</code>.</p>\r\n\r\n<h4>1. LEFT JOIN — keep every left row</h4>\r\n<p>Change <code>JOIN</code> to <code>LEFT JOIN</code>: every customer appears, even those with no orders (the order columns will be <code>NULL</code>).</p>\r\n<pre class=\"run\">SELECT c.name AS customer, o.id AS order_id\r\nFROM customers c\r\nLEFT JOIN orders o ON o.customer_id = c.id\r\nORDER BY c.id, o.id;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 1.</b> Join <code>customers</code> to <code>orders</code> with <code>LEFT JOIN</code>, show <code>c.name AS customer</code> and <code>o.id AS order_id</code> (every customer, including those with no orders), sorted by <code>c.id, o.id</code>.</span>\r\n<template class=\"st\">SELECT c.name AS customer, o.id AS order_id\r\nFROM customers c\r\nLEFT JOIN orders o ON </template>\r\n<template class=\"ref\">SELECT c.name AS customer, o.id AS order_id FROM customers c LEFT JOIN orders o ON o.customer_id = c.id ORDER BY c.id, o.id</template></div>\r\n\r\n<h4>2. IS NULL — find the non-matches</h4>\r\n<p>You can't compare <code>NULL</code> with <code>=</code>. You must use <code>IS NULL</code> (or <code>IS NOT NULL</code>). The combination <code>LEFT JOIN</code> + <code>WHERE ... IS NULL</code> is the classic way to find \"the ones with no match\".</p>\r\n<pre class=\"run\">SELECT c.name AS customer\r\nFROM customers c\r\nLEFT JOIN orders o ON o.customer_id = c.id\r\nWHERE o.id IS NULL;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 2.</b> Find customers who have <b>never ordered</b>: <code>LEFT JOIN</code> <code>customers</code> to <code>orders</code>, filter <code>o.id IS NULL</code>, show <code>c.name AS customer</code>, sorted by <code>c.id</code>.</span>\r\n<template class=\"st\">SELECT c.name AS customer\r\nFROM customers c\r\nLEFT JOIN orders o ON o.customer_id = c.id\r\nWHERE </template>\r\n<template class=\"ref\">SELECT c.name AS customer FROM customers c LEFT JOIN orders o ON o.customer_id = c.id WHERE o.id IS NULL ORDER BY c.id</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 3.</b> Find products that have <b>never sold</b>: <code>LEFT JOIN</code> <code>products</code> to <code>order_items</code>, filter <code>oi.id IS NULL</code>, show <code>p.name AS product</code>, sorted by <code>p.id</code>.</span>\r\n<template class=\"st\">SELECT p.name AS product\r\nFROM products p\r\nLEFT JOIN order_items oi ON oi.product_id = p.id\r\nWHERE </template>\r\n<template class=\"ref\">SELECT p.name AS product FROM products p LEFT JOIN order_items oi ON oi.product_id = p.id WHERE oi.id IS NULL ORDER BY p.id</template></div>\r\n\r\n<h4>3. Counting including zero</h4>\r\n<p>A subtle difference: <code>COUNT(*)</code> counts rows, but <code>COUNT(column)</code> <b>skips NULL</b>. So <code>COUNT(o.id)</code> over a <code>LEFT JOIN</code> correctly gives <b>0</b> for a customer with no orders.</p>\r\n<pre class=\"run\">SELECT c.name AS customer, COUNT(o.id) AS order_count\r\nFROM customers c\r\nLEFT JOIN orders o ON o.customer_id = c.id\r\nGROUP BY c.id\r\nORDER BY c.id;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 4.</b> Count the <b>number of orders per customer, including 0</b>: <code>LEFT JOIN</code> <code>customers</code> to <code>orders</code>, group by <code>c.id</code>, show <code>c.name AS customer</code> and <code>COUNT(o.id) AS order_count</code>, sorted by <code>c.id</code>.</span>\r\n<template class=\"st\">SELECT c.name AS customer, COUNT(o.id) AS order_count\r\nFROM customers c\r\nLEFT JOIN orders o ON o.customer_id = c.id\r\nGROUP BY </template>\r\n<template class=\"ref\">SELECT c.name AS customer, COUNT(o.id) AS order_count FROM customers c LEFT JOIN orders o ON o.customer_id = c.id GROUP BY c.id ORDER BY c.id</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 5.</b> Count the <b>number of line items per customer, including 0</b>: <code>LEFT JOIN</code> <code>customers</code> → <code>orders</code> → <code>order_items</code>, group by <code>c.id</code>, show <code>c.name AS customer</code> and <code>COUNT(oi.id) AS line_count</code>, sorted by <code>c.id</code>.</span>\r\n<template class=\"st\">SELECT c.name AS customer, COUNT(oi.id) AS line_count\r\nFROM customers c\r\nLEFT JOIN orders o ON o.customer_id = c.id\r\nLEFT JOIN order_items oi ON oi.order_id = o.id\r\nGROUP BY </template>\r\n<template class=\"ref\">SELECT c.name AS customer, COUNT(oi.id) AS line_count FROM customers c LEFT JOIN orders o ON o.customer_id = c.id LEFT JOIN order_items oi ON oi.order_id = o.id GROUP BY c.id ORDER BY c.id</template></div>\r\n\r\n<h4>4. COALESCE — replace NULL with something else</h4>\r\n<p><code>SUM</code> over an empty group returns <code>NULL</code>, not 0. <code>COALESCE(x, 0)</code> means \"if <code>x</code> is NULL, use 0 instead\". Perfect for money reports.</p>\r\n<pre class=\"run\">SELECT c.name AS customer,\r\n       COALESCE(SUM(p.price * oi.qty), 0) AS total_spent\r\nFROM customers c\r\nLEFT JOIN orders o      ON o.customer_id = c.id\r\nLEFT JOIN order_items oi ON oi.order_id = o.id\r\nLEFT JOIN products p     ON oi.product_id = p.id\r\nGROUP BY c.id\r\nORDER BY c.id;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 6.</b> Total spend per customer, with <b>0 for non-buyers</b>: use the <code>LEFT JOIN</code> chain shown, show <code>c.name AS customer</code> and <code>COALESCE(SUM(p.price * oi.qty), 0) AS total_spent</code>, group by <code>c.id</code>, sorted by <code>c.id</code>.</span>\r\n<template class=\"st\">SELECT c.name AS customer, COALESCE(SUM(p.price * oi.qty), 0) AS total_spent\r\nFROM customers c\r\nLEFT JOIN orders o ON o.customer_id = c.id\r\nLEFT JOIN order_items oi ON oi.order_id = o.id\r\nLEFT JOIN products p ON oi.product_id = p.id\r\nGROUP BY </template>\r\n<template class=\"ref\">SELECT c.name AS customer, COALESCE(SUM(p.price * oi.qty), 0) AS total_spent FROM customers c LEFT JOIN orders o ON o.customer_id = c.id LEFT JOIN order_items oi ON oi.order_id = o.id LEFT JOIN products p ON oi.product_id = p.id GROUP BY c.id ORDER BY c.id</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 7.</b> Total quantity sold per product, with <b>0 for unsold</b>: <code>LEFT JOIN</code> <code>products</code> to <code>order_items</code>, show <code>p.name AS product</code> and <code>COALESCE(SUM(oi.qty), 0) AS total_qty</code>, group by <code>p.id</code>, sorted by <code>p.id</code>.</span>\r\n<template class=\"st\">SELECT p.name AS product, COALESCE(SUM(oi.qty), 0) AS total_qty\r\nFROM products p\r\nLEFT JOIN order_items oi ON oi.product_id = p.id\r\nGROUP BY </template>\r\n<template class=\"ref\">SELECT p.name AS product, COALESCE(SUM(oi.qty), 0) AS total_qty FROM products p LEFT JOIN order_items oi ON oi.product_id = p.id GROUP BY p.id ORDER BY p.id</template></div>\r\n\r\n<h4>5. IS NOT NULL and HAVING</h4>\r\n<p>Conversely, <code>IS NOT NULL</code> keeps rows that <i>did</i> match. And you can filter for \"empty\" groups with <code>HAVING COUNT(...) = 0</code>.</p>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 8.</b> Count <b>how many line items each product appears in, including 0</b>: <code>LEFT JOIN</code> <code>products</code> to <code>order_items</code>, show <code>p.name AS product</code> and <code>COUNT(oi.id) AS times_ordered</code>, group by <code>p.id</code>, sorted by <code>times_ordered</code> descending then <code>p.id</code>.</span>\r\n<template class=\"st\">SELECT p.name AS product, COUNT(oi.id) AS times_ordered\r\nFROM products p\r\nLEFT JOIN order_items oi ON oi.product_id = p.id\r\nGROUP BY p.id\r\nORDER BY </template>\r\n<template class=\"ref\">SELECT p.name AS product, COUNT(oi.id) AS times_ordered FROM products p LEFT JOIN order_items oi ON oi.product_id = p.id GROUP BY p.id ORDER BY times_ordered DESC, p.id</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 9.</b> Find unsold products <b>using HAVING</b>: <code>LEFT JOIN</code> <code>products</code> to <code>order_items</code>, group by <code>p.id</code>, keep groups with <code>COUNT(oi.id) = 0</code>, show <code>p.name AS product</code>, sorted by <code>p.id</code>.</span>\r\n<template class=\"st\">SELECT p.name AS product\r\nFROM products p\r\nLEFT JOIN order_items oi ON oi.product_id = p.id\r\nGROUP BY p.id\r\nHAVING </template>\r\n<template class=\"ref\">SELECT p.name AS product FROM products p LEFT JOIN order_items oi ON oi.product_id = p.id GROUP BY p.id HAVING COUNT(oi.id) = 0 ORDER BY p.id</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 10.</b> List the names of customers who have <b>at least one order</b> (using <code>IS NOT NULL</code>): <code>LEFT JOIN</code> <code>customers</code> to <code>orders</code>, filter <code>o.id IS NOT NULL</code>, show <code>DISTINCT c.name AS customer</code>, sorted by <code>c.id</code>.</span>\r\n<template class=\"st\">SELECT DISTINCT c.name AS customer\r\nFROM customers c\r\nLEFT JOIN orders o ON o.customer_id = c.id\r\nWHERE </template>\r\n<template class=\"ref\">SELECT DISTINCT c.name AS customer FROM customers c LEFT JOIN orders o ON o.customer_id = c.id WHERE o.id IS NOT NULL ORDER BY c.id</template></div>\r\n\r\n<h4>6. A report that leaves no one out</h4>\r\n<div class=\"ex stretch\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 11. 🔥 Stretch.</b> Per-customer report of <b>order count</b> and <b>total spend</b>, <b>leaving no customer out</b>. Use the <code>LEFT JOIN</code> chain <code>customers</code> → <code>orders</code> → <code>order_items</code> → <code>products</code>; show <code>c.name AS customer</code>, <code>COUNT(DISTINCT o.id) AS order_count</code>, <code>COALESCE(SUM(p.price * oi.qty), 0) AS total_spent</code>; group by <code>c.id</code>; sort by <code>total_spent</code> descending then <code>c.id</code>.</span>\r\n<template class=\"st\">SELECT c.name AS customer, COUNT(DISTINCT o.id) AS order_count, COALESCE(SUM(p.price * oi.qty), 0) AS total_spent\r\nFROM customers c\r\nLEFT JOIN orders o ON o.customer_id = c.id\r\nLEFT JOIN order_items oi ON oi.order_id = o.id\r\nLEFT JOIN products p ON oi.product_id = p.id\r\nGROUP BY c.id\r\nORDER BY </template>\r\n<template class=\"ref\">SELECT c.name AS customer, COUNT(DISTINCT o.id) AS order_count, COALESCE(SUM(p.price * oi.qty), 0) AS total_spent FROM customers c LEFT JOIN orders o ON o.customer_id = c.id LEFT JOIN order_items oi ON oi.order_id = o.id LEFT JOIN products p ON oi.product_id = p.id GROUP BY c.id ORDER BY total_spent DESC, c.id</template></div>\r\n\r\n<h4>🏠 Homework</h4>\r\n<p>Four take-home exercises, auto-graded right on the page. The last one is a stretch.</p>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 1.</b> <code>LEFT JOIN</code> <code>customers</code> to <code>orders</code>, show <code>c.name AS customer</code> and <code>o.order_date</code> (every customer, including those with no orders), sorted by <code>c.id, o.order_date</code>.</span>\r\n<template class=\"st\">SELECT c.name AS customer, o.order_date\r\nFROM customers c\r\nLEFT JOIN orders o ON </template>\r\n<template class=\"ref\">SELECT c.name AS customer, o.order_date FROM customers c LEFT JOIN orders o ON o.customer_id = c.id ORDER BY c.id, o.order_date</template></div>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 2.</b> Find customers with no orders <b>using HAVING</b>: <code>LEFT JOIN</code> <code>customers</code> to <code>orders</code>, group by <code>c.id</code>, keep groups with <code>COUNT(o.id) = 0</code>, show <code>c.name AS customer</code> and <code>COUNT(o.id) AS order_count</code>, sorted by <code>c.id</code>.</span>\r\n<template class=\"st\">SELECT c.name AS customer, COUNT(o.id) AS order_count\r\nFROM customers c\r\nLEFT JOIN orders o ON o.customer_id = c.id\r\nGROUP BY c.id\r\nHAVING </template>\r\n<template class=\"ref\">SELECT c.name AS customer, COUNT(o.id) AS order_count FROM customers c LEFT JOIN orders o ON o.customer_id = c.id GROUP BY c.id HAVING COUNT(o.id) = 0 ORDER BY c.id</template></div>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 3.</b> Total quantity sold per product (0 for unsold), sorted by amount sold: <code>LEFT JOIN</code> <code>products</code> to <code>order_items</code>, show <code>p.name AS product</code> and <code>COALESCE(SUM(oi.qty), 0) AS total_qty</code>, group by <code>p.id</code>, sorted by <code>total_qty</code> descending then <code>p.id</code>.</span>\r\n<template class=\"st\">SELECT p.name AS product, COALESCE(SUM(oi.qty), 0) AS total_qty\r\nFROM products p\r\nLEFT JOIN order_items oi ON oi.product_id = p.id\r\nGROUP BY p.id\r\nORDER BY </template>\r\n<template class=\"ref\">SELECT p.name AS product, COALESCE(SUM(oi.qty), 0) AS total_qty FROM products p LEFT JOIN order_items oi ON oi.product_id = p.id GROUP BY p.id ORDER BY total_qty DESC, p.id</template></div>\r\n<div class=\"ex homework stretch\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 4. 🔥 Stretch.</b> Per-customer report of order count and total spend (no customer left out), sorted <b>ascending</b> by spend so non-buyers come first. Use <code>LEFT JOIN</code> <code>customers</code> → <code>orders</code> → <code>order_items</code> → <code>products</code>; show <code>c.name AS customer</code>, <code>COUNT(DISTINCT o.id) AS orders</code>, <code>COALESCE(SUM(p.price * oi.qty), 0) AS total_spent</code>; group by <code>c.id</code>; sort by <code>total_spent</code> ascending then <code>c.id</code>.</span>\r\n<template class=\"st\">SELECT c.name AS customer, COUNT(DISTINCT o.id) AS orders, COALESCE(SUM(p.price * oi.qty), 0) AS total_spent\r\nFROM customers c\r\nLEFT JOIN orders o ON o.customer_id = c.id\r\nLEFT JOIN order_items oi ON oi.order_id = o.id\r\nLEFT JOIN products p ON oi.product_id = p.id\r\nGROUP BY c.id\r\nORDER BY </template>\r\n<template class=\"ref\">SELECT c.name AS customer, COUNT(DISTINCT o.id) AS orders, COALESCE(SUM(p.price * oi.qty), 0) AS total_spent FROM customers c LEFT JOIN orders o ON o.customer_id = c.id LEFT JOIN order_items oi ON oi.order_id = o.id LEFT JOIN products p ON oi.product_id = p.id GROUP BY c.id ORDER BY total_spent ASC, c.id</template></div>"}},{"t":{"vi":"Truy vấn con (subquery)","en":"Subqueries"},"html":{"vi":"<h3>Bài 11 — Truy vấn con (subquery)</h3>\r\n<p>Đôi khi để trả lời một câu hỏi, bạn cần <i>kết quả của một câu hỏi khác</i> trước. \"Sản phẩm nào <b>đắt hơn mức trung bình</b>?\" — muốn biết, trước hết phải tính mức trung bình. \"Khách nào <b>chưa từng đặt hàng</b>?\" — cần danh sách các khách <i>đã</i> đặt để loại ra.</p>\r\n<p><b>Truy vấn con</b> (subquery) là một câu <code>SELECT</code> đặt lồng bên trong một câu <code>SELECT</code> khác, trong ngoặc đơn <code>( … )</code>. SQL chạy truy vấn con trước, lấy kết quả, rồi dùng nó cho truy vấn ngoài.</p>\r\n<p>Có hai kiểu bạn sẽ gặp nhiều nhất: truy vấn con trả về <b>một giá trị</b> (dùng để so sánh, như <code>&gt; (SELECT AVG(...))</code>), và truy vấn con trả về <b>một danh sách</b> (dùng với <code>IN</code> / <code>NOT IN</code>).</p>\r\n\r\n<h4>1. Truy vấn con trả về một giá trị</h4>\r\n<p>Một <code>SELECT</code> tổng hợp (như <code>AVG</code>, <code>MAX</code>) trả về đúng một số. Đặt nó trong ngoặc và so sánh trực tiếp.</p>\r\n<pre class=\"run\">SELECT name, price\r\nFROM products\r\nWHERE price > (SELECT AVG(price) FROM products)\r\nORDER BY price;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 1.</b> Sản phẩm có giá <b>trên mức trung bình</b>: hiển thị <code>name</code>, <code>price</code>, lọc <code>price &gt; (SELECT AVG(price) FROM products)</code>, sắp theo <code>price</code>.</span>\r\n<template class=\"st\">SELECT name, price\r\nFROM products\r\nWHERE price > (</template>\r\n<template class=\"ref\">SELECT name, price FROM products WHERE price > (SELECT AVG(price) FROM products) ORDER BY price</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 2.</b> Sản phẩm có giá <b>dưới mức trung bình</b>: hiển thị <code>name</code>, <code>price</code>, lọc <code>price &lt; (SELECT AVG(price) FROM products)</code>, sắp theo <code>price</code>.</span>\r\n<template class=\"st\">SELECT name, price\r\nFROM products\r\nWHERE price < (</template>\r\n<template class=\"ref\">SELECT name, price FROM products WHERE price < (SELECT AVG(price) FROM products) ORDER BY price</template></div>\r\n\r\n<h4>2. So với một giá trị lọc từ nhóm</h4>\r\n<p>Truy vấn con có thể tự nó có <code>WHERE</code>. Ví dụ: \"rẻ hơn món đắt nhất trong nhóm Đồ uống\".</p>\r\n<pre class=\"run\">SELECT name, price\r\nFROM products\r\nWHERE price < (SELECT MAX(price) FROM products WHERE category = 'Đồ uống')\r\nORDER BY price;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 3.</b> Sản phẩm rẻ hơn <b>món đắt nhất nhóm 'Đồ uống'</b>: hiển thị <code>name</code>, <code>price</code>, lọc <code>price &lt; (SELECT MAX(price) FROM products WHERE category = 'Đồ uống')</code>, sắp theo <code>price</code>.</span>\r\n<template class=\"st\">SELECT name, price\r\nFROM products\r\nWHERE price < (</template>\r\n<template class=\"ref\">SELECT name, price FROM products WHERE price < (SELECT MAX(price) FROM products WHERE category = 'Đồ uống') ORDER BY price</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 4.</b> Sản phẩm đắt hơn <b>'Cà phê đen đá'</b>: hiển thị <code>name</code>, <code>price</code>, lọc <code>price &gt; (SELECT price FROM products WHERE name = 'Cà phê đen đá')</code>, sắp theo <code>price</code>.</span>\r\n<template class=\"st\">SELECT name, price\r\nFROM products\r\nWHERE price > (</template>\r\n<template class=\"ref\">SELECT name, price FROM products WHERE price > (SELECT price FROM products WHERE name = 'Cà phê đen đá') ORDER BY price</template></div>\r\n\r\n<h4>3. Truy vấn con trả về danh sách: IN</h4>\r\n<p>Nếu truy vấn con trả về <b>nhiều dòng một cột</b>, dùng <code>IN</code> để kiểm tra \"có nằm trong danh sách này không\".</p>\r\n<pre class=\"run\">SELECT name\r\nFROM products\r\nWHERE id IN (SELECT product_id FROM order_items)\r\nORDER BY id;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 5.</b> Sản phẩm <b>đã từng được bán</b>: hiển thị <code>name</code>, lọc <code>id IN (SELECT product_id FROM order_items)</code>, sắp theo <code>id</code>.</span>\r\n<template class=\"st\">SELECT name\r\nFROM products\r\nWHERE id IN (</template>\r\n<template class=\"ref\">SELECT name FROM products WHERE id IN (SELECT product_id FROM order_items) ORDER BY id</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 6.</b> Khách hàng <b>đã từng đặt hàng</b>: hiển thị <code>name</code>, lọc <code>id IN (SELECT customer_id FROM orders)</code>, sắp theo <code>id</code>.</span>\r\n<template class=\"st\">SELECT name\r\nFROM customers\r\nWHERE id IN (</template>\r\n<template class=\"ref\">SELECT name FROM customers WHERE id IN (SELECT customer_id FROM orders) ORDER BY id</template></div>\r\n\r\n<h4>4. NOT IN — những cái không nằm trong danh sách</h4>\r\n<p>Đảo lại thành <code>NOT IN</code> để tìm \"những cái vắng mặt\" — một cách khác (bên cạnh <code>LEFT JOIN</code> ở Bài 10) để tìm khách/sản phẩm chưa hoạt động.</p>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 7.</b> Sản phẩm <b>chưa từng được bán</b>: hiển thị <code>name</code>, lọc <code>id NOT IN (SELECT product_id FROM order_items)</code>, sắp theo <code>id</code>.</span>\r\n<template class=\"st\">SELECT name\r\nFROM products\r\nWHERE id NOT IN (</template>\r\n<template class=\"ref\">SELECT name FROM products WHERE id NOT IN (SELECT product_id FROM order_items) ORDER BY id</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 8.</b> Khách hàng <b>chưa từng đặt hàng</b>: hiển thị <code>name</code>, lọc <code>id NOT IN (SELECT customer_id FROM orders)</code>, sắp theo <code>id</code>.</span>\r\n<template class=\"st\">SELECT name\r\nFROM customers\r\nWHERE id NOT IN (</template>\r\n<template class=\"ref\">SELECT name FROM customers WHERE id NOT IN (SELECT customer_id FROM orders) ORDER BY id</template></div>\r\n\r\n<h4>5. Truy vấn con trong SELECT</h4>\r\n<p>Bạn cũng có thể đặt một giá trị tính sẵn vào <i>mỗi dòng</i> để tiện so sánh — ví dụ kèm mức giá trung bình bên cạnh từng sản phẩm.</p>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 9.</b> Với mỗi sản phẩm, hiển thị <code>name</code>, <code>price</code>, và <b>giá trung bình toàn cửa hàng</b> ở cột <code>avg_all</code>: <code>(SELECT ROUND(AVG(price)) FROM products) AS avg_all</code>. Sắp theo <code>id</code>.</span>\r\n<template class=\"st\">SELECT name, price, (SELECT ROUND(AVG(price)) FROM products) AS avg_all\r\nFROM products\r\nORDER BY </template>\r\n<template class=\"ref\">SELECT name, price, (SELECT ROUND(AVG(price)) FROM products) AS avg_all FROM products ORDER BY id</template></div>\r\n\r\n<h4>6. Truy vấn con lồng nhiều tầng</h4>\r\n<p>Một truy vấn con có thể chứa truy vấn con khác. \"Những sản phẩm mà khách số 1 đã mua\" = sản phẩm nằm trong các dòng hàng thuộc các đơn của khách số 1.</p>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 10.</b> Sản phẩm mà <b>khách số 1 đã mua</b>: hiển thị <code>name</code>, lọc <code>id IN (SELECT product_id FROM order_items WHERE order_id IN (SELECT id FROM orders WHERE customer_id = 1))</code>, sắp theo <code>id</code>.</span>\r\n<template class=\"st\">SELECT name\r\nFROM products\r\nWHERE id IN (SELECT product_id FROM order_items WHERE order_id IN (\r\n  </template>\r\n<template class=\"ref\">SELECT name FROM products WHERE id IN (SELECT product_id FROM order_items WHERE order_id IN (SELECT id FROM orders WHERE customer_id = 1)) ORDER BY id</template></div>\r\n\r\n<h4>7. Kết hợp với GROUP BY</h4>\r\n<div class=\"ex stretch\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 11. 🔥 Nâng cao.</b> Những <b>danh mục có giá trung bình cao hơn mức trung bình toàn cửa hàng</b>: gom nhóm theo <code>category</code>, hiển thị <code>category</code> và <code>ROUND(AVG(price)) AS avg_price</code>, giữ nhóm có <code>AVG(price) &gt; (SELECT AVG(price) FROM products)</code>, sắp theo <code>avg_price</code> giảm dần.</span>\r\n<template class=\"st\">SELECT category, ROUND(AVG(price)) AS avg_price\r\nFROM products\r\nGROUP BY category\r\nHAVING AVG(price) > (</template>\r\n<template class=\"ref\">SELECT category, ROUND(AVG(price)) AS avg_price FROM products GROUP BY category HAVING AVG(price) > (SELECT AVG(price) FROM products) ORDER BY avg_price DESC</template></div>\r\n\r\n<h4>🏠 Homework</h4>\r\n<p>Bốn bài làm ở nhà, tự động chấm ngay trên trang. Bài cuối là bài nâng cao.</p>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 1.</b> Sản phẩm có <b>tồn kho trên mức trung bình</b>: hiển thị <code>name</code>, <code>stock</code>, lọc <code>stock &gt; (SELECT AVG(stock) FROM products)</code>, sắp theo <code>stock</code> giảm dần.</span>\r\n<template class=\"st\">SELECT name, stock\r\nFROM products\r\nWHERE stock > (</template>\r\n<template class=\"ref\">SELECT name, stock FROM products WHERE stock > (SELECT AVG(stock) FROM products) ORDER BY stock DESC</template></div>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 2.</b> Sản phẩm đắt hơn <b>giá trung bình của nhóm 'Đồ uống'</b>: hiển thị <code>name</code>, <code>price</code>, lọc <code>price &gt; (SELECT AVG(price) FROM products WHERE category = 'Đồ uống')</code>, sắp theo <code>price</code>.</span>\r\n<template class=\"st\">SELECT name, price\r\nFROM products\r\nWHERE price > (</template>\r\n<template class=\"ref\">SELECT name, price FROM products WHERE price > (SELECT AVG(price) FROM products WHERE category = 'Đồ uống') ORDER BY price</template></div>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 3.</b> Sản phẩm <b>chưa từng được bán</b> (kèm giá): hiển thị <code>name</code>, <code>price</code>, lọc <code>id NOT IN (SELECT product_id FROM order_items)</code>, sắp theo <code>price</code>.</span>\r\n<template class=\"st\">SELECT name, price\r\nFROM products\r\nWHERE id NOT IN (</template>\r\n<template class=\"ref\">SELECT name, price FROM products WHERE id NOT IN (SELECT product_id FROM order_items) ORDER BY price</template></div>\r\n<div class=\"ex homework stretch\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 4. 🔥 Nâng cao.</b> Sản phẩm <b>đắt hơn mọi món trong nhóm 'Đồ uống'</b> (tức đắt hơn món đắt nhất của nhóm đó): hiển thị <code>name</code>, <code>price</code>, lọc <code>price &gt; (SELECT MAX(price) FROM products WHERE category = 'Đồ uống')</code>, sắp theo <code>price</code>.</span>\r\n<template class=\"st\">SELECT name, price\r\nFROM products\r\nWHERE price > (</template>\r\n<template class=\"ref\">SELECT name, price FROM products WHERE price > (SELECT MAX(price) FROM products WHERE category = 'Đồ uống') ORDER BY price</template></div>","en":"<h3>Lesson 11 — Subqueries</h3>\r\n<p>Sometimes, to answer one question you first need <i>the result of another question</i>. \"Which products are <b>above the average price</b>?\" — to know that, you first have to compute the average. \"Which customer has <b>never ordered</b>?\" — you need the list of customers who <i>did</i> order, to exclude them.</p>\r\n<p>A <b>subquery</b> is a <code>SELECT</code> nested inside another <code>SELECT</code>, wrapped in parentheses <code>( … )</code>. SQL runs the subquery first, takes its result, then uses it in the outer query.</p>\r\n<p>Two kinds show up most: a subquery that returns <b>a single value</b> (for comparison, like <code>&gt; (SELECT AVG(...))</code>), and one that returns <b>a list</b> (used with <code>IN</code> / <code>NOT IN</code>).</p>\r\n\r\n<h4>1. A subquery returning one value</h4>\r\n<p>An aggregate <code>SELECT</code> (like <code>AVG</code>, <code>MAX</code>) returns exactly one number. Put it in parentheses and compare directly.</p>\r\n<pre class=\"run\">SELECT name, price\r\nFROM products\r\nWHERE price > (SELECT AVG(price) FROM products)\r\nORDER BY price;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 1.</b> Products priced <b>above average</b>: show <code>name</code>, <code>price</code>, filter <code>price &gt; (SELECT AVG(price) FROM products)</code>, sorted by <code>price</code>.</span>\r\n<template class=\"st\">SELECT name, price\r\nFROM products\r\nWHERE price > (</template>\r\n<template class=\"ref\">SELECT name, price FROM products WHERE price > (SELECT AVG(price) FROM products) ORDER BY price</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 2.</b> Products priced <b>below average</b>: show <code>name</code>, <code>price</code>, filter <code>price &lt; (SELECT AVG(price) FROM products)</code>, sorted by <code>price</code>.</span>\r\n<template class=\"st\">SELECT name, price\r\nFROM products\r\nWHERE price < (</template>\r\n<template class=\"ref\">SELECT name, price FROM products WHERE price < (SELECT AVG(price) FROM products) ORDER BY price</template></div>\r\n\r\n<h4>2. Comparing to a value filtered from a group</h4>\r\n<p>The subquery can have its own <code>WHERE</code>. For example: \"cheaper than the priciest drink\".</p>\r\n<pre class=\"run\">SELECT name, price\r\nFROM products\r\nWHERE price < (SELECT MAX(price) FROM products WHERE category = 'Đồ uống')\r\nORDER BY price;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 3.</b> Products cheaper than the <b>priciest 'Đồ uống' item</b>: show <code>name</code>, <code>price</code>, filter <code>price &lt; (SELECT MAX(price) FROM products WHERE category = 'Đồ uống')</code>, sorted by <code>price</code>.</span>\r\n<template class=\"st\">SELECT name, price\r\nFROM products\r\nWHERE price < (</template>\r\n<template class=\"ref\">SELECT name, price FROM products WHERE price < (SELECT MAX(price) FROM products WHERE category = 'Đồ uống') ORDER BY price</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 4.</b> Products more expensive than <b>'Cà phê đen đá'</b>: show <code>name</code>, <code>price</code>, filter <code>price &gt; (SELECT price FROM products WHERE name = 'Cà phê đen đá')</code>, sorted by <code>price</code>.</span>\r\n<template clas
