s=\"st\">SELECT name, price\r\nFROM products\r\nWHERE price > (</template>\r\n<template class=\"ref\">SELECT name, price FROM products WHERE price > (SELECT price FROM products WHERE name = 'Cà phê đen đá') ORDER BY price</template></div>\r\n\r\n<h4>3. A subquery returning a list: IN</h4>\r\n<p>If the subquery returns <b>many rows of one column</b>, use <code>IN</code> to test \"is it in this list?\".</p>\r\n<pre class=\"run\">SELECT name\r\nFROM products\r\nWHERE id IN (SELECT product_id FROM order_items)\r\nORDER BY id;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 5.</b> Products that <b>have been sold</b>: show <code>name</code>, filter <code>id IN (SELECT product_id FROM order_items)</code>, sorted by <code>id</code>.</span>\r\n<template class=\"st\">SELECT name\r\nFROM products\r\nWHERE id IN (</template>\r\n<template class=\"ref\">SELECT name FROM products WHERE id IN (SELECT product_id FROM order_items) ORDER BY id</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 6.</b> Customers who <b>have ordered</b>: show <code>name</code>, filter <code>id IN (SELECT customer_id FROM orders)</code>, sorted by <code>id</code>.</span>\r\n<template class=\"st\">SELECT name\r\nFROM customers\r\nWHERE id IN (</template>\r\n<template class=\"ref\">SELECT name FROM customers WHERE id IN (SELECT customer_id FROM orders) ORDER BY id</template></div>\r\n\r\n<h4>4. NOT IN — the ones not in the list</h4>\r\n<p>Flip it to <code>NOT IN</code> to find \"the ones missing\" — another way (besides <code>LEFT JOIN</code> from Lesson 10) to find inactive customers/products.</p>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 7.</b> Products that have <b>never sold</b>: show <code>name</code>, filter <code>id NOT IN (SELECT product_id FROM order_items)</code>, sorted by <code>id</code>.</span>\r\n<template class=\"st\">SELECT name\r\nFROM products\r\nWHERE id NOT IN (</template>\r\n<template class=\"ref\">SELECT name FROM products WHERE id NOT IN (SELECT product_id FROM order_items) ORDER BY id</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 8.</b> Customers who have <b>never ordered</b>: show <code>name</code>, filter <code>id NOT IN (SELECT customer_id FROM orders)</code>, sorted by <code>id</code>.</span>\r\n<template class=\"st\">SELECT name\r\nFROM customers\r\nWHERE id NOT IN (</template>\r\n<template class=\"ref\">SELECT name FROM customers WHERE id NOT IN (SELECT customer_id FROM orders) ORDER BY id</template></div>\r\n\r\n<h4>5. A subquery inside SELECT</h4>\r\n<p>You can also drop a precomputed value onto <i>every row</i> for easy comparison — e.g. showing the average price next to each product.</p>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 9.</b> For each product, show <code>name</code>, <code>price</code>, and the <b>store-wide average price</b> in an <code>avg_all</code> column: <code>(SELECT ROUND(AVG(price)) FROM products) AS avg_all</code>. Sort by <code>id</code>.</span>\r\n<template class=\"st\">SELECT name, price, (SELECT ROUND(AVG(price)) FROM products) AS avg_all\r\nFROM products\r\nORDER BY </template>\r\n<template class=\"ref\">SELECT name, price, (SELECT ROUND(AVG(price)) FROM products) AS avg_all FROM products ORDER BY id</template></div>\r\n\r\n<h4>6. Nesting subqueries</h4>\r\n<p>A subquery can contain another subquery. \"Products that customer 1 bought\" = products found in the line items of customer 1's orders.</p>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 10.</b> Products that <b>customer 1 bought</b>: show <code>name</code>, filter <code>id IN (SELECT product_id FROM order_items WHERE order_id IN (SELECT id FROM orders WHERE customer_id = 1))</code>, sorted by <code>id</code>.</span>\r\n<template class=\"st\">SELECT name\r\nFROM products\r\nWHERE id IN (SELECT product_id FROM order_items WHERE order_id IN (\r\n  </template>\r\n<template class=\"ref\">SELECT name FROM products WHERE id IN (SELECT product_id FROM order_items WHERE order_id IN (SELECT id FROM orders WHERE customer_id = 1)) ORDER BY id</template></div>\r\n\r\n<h4>7. Combining with GROUP BY</h4>\r\n<div class=\"ex stretch\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 11. 🔥 Stretch.</b> Categories whose <b>average price is higher than the store-wide average</b>: group by <code>category</code>, show <code>category</code> and <code>ROUND(AVG(price)) AS avg_price</code>, keep groups with <code>AVG(price) &gt; (SELECT AVG(price) FROM products)</code>, sorted by <code>avg_price</code> descending.</span>\r\n<template class=\"st\">SELECT category, ROUND(AVG(price)) AS avg_price\r\nFROM products\r\nGROUP BY category\r\nHAVING AVG(price) > (</template>\r\n<template class=\"ref\">SELECT category, ROUND(AVG(price)) AS avg_price FROM products GROUP BY category HAVING AVG(price) > (SELECT AVG(price) FROM products) ORDER BY avg_price DESC</template></div>\r\n\r\n<h4>🏠 Homework</h4>\r\n<p>Four take-home exercises, auto-graded right on the page. The last one is a stretch.</p>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 1.</b> Products with <b>above-average stock</b>: show <code>name</code>, <code>stock</code>, filter <code>stock &gt; (SELECT AVG(stock) FROM products)</code>, sorted by <code>stock</code> descending.</span>\r\n<template class=\"st\">SELECT name, stock\r\nFROM products\r\nWHERE stock > (</template>\r\n<template class=\"ref\">SELECT name, stock FROM products WHERE stock > (SELECT AVG(stock) FROM products) ORDER BY stock DESC</template></div>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 2.</b> Products more expensive than the <b>average price of the 'Đồ uống' category</b>: show <code>name</code>, <code>price</code>, filter <code>price &gt; (SELECT AVG(price) FROM products WHERE category = 'Đồ uống')</code>, sorted by <code>price</code>.</span>\r\n<template class=\"st\">SELECT name, price\r\nFROM products\r\nWHERE price > (</template>\r\n<template class=\"ref\">SELECT name, price FROM products WHERE price > (SELECT AVG(price) FROM products WHERE category = 'Đồ uống') ORDER BY price</template></div>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 3.</b> Products that have <b>never sold</b> (with price): show <code>name</code>, <code>price</code>, filter <code>id NOT IN (SELECT product_id FROM order_items)</code>, sorted by <code>price</code>.</span>\r\n<template class=\"st\">SELECT name, price\r\nFROM products\r\nWHERE id NOT IN (</template>\r\n<template class=\"ref\">SELECT name, price FROM products WHERE id NOT IN (SELECT product_id FROM order_items) ORDER BY price</template></div>\r\n<div class=\"ex homework stretch\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 4. 🔥 Stretch.</b> Products more expensive than <b>every item in the 'Đồ uống' category</b> (i.e. pricier than that category's most expensive item): show <code>name</code>, <code>price</code>, filter <code>price &gt; (SELECT MAX(price) FROM products WHERE category = 'Đồ uống')</code>, sorted by <code>price</code>.</span>\r\n<template class=\"st\">SELECT name, price\r\nFROM products\r\nWHERE price > (</template>\r\n<template class=\"ref\">SELECT name, price FROM products WHERE price > (SELECT MAX(price) FROM products WHERE category = 'Đồ uống') ORDER BY price</template></div>"}},{"t":{"vi":"Đồ án nhỏ: báo cáo bán hàng","en":"Mini project: sales report"},"html":"<h3>Đồ án nhỏ: báo cáo bán hàng</h3>\n<p><i>(Nội dung đang được biên soạn.)</i></p>"},{"t":{"vi":"INSERT, UPDATE & DELETE — thay đổi dữ liệu","en":"INSERT, UPDATE & DELETE — changing data"},"html":"<h3>INSERT, UPDATE & DELETE — thay đổi dữ liệu</h3>\n<p><i>(Nội dung đang được biên soạn.)</i></p>"},{"t":{"vi":"CREATE TABLE & kiểu dữ liệu","en":"CREATE TABLE & data types"},"html":"<h3>CREATE TABLE & kiểu dữ liệu</h3>\n<p><i>(Nội dung đang được biên soạn.)</i></p>"},{"t":{"vi"
