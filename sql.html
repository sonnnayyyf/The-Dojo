<script>
const COURSE={"id":"sql","ls":"mk:sql","title":{"vi":"SQL cho công việc dữ liệu","en":"SQL for Data Work"},"sub":{"vi":"14 bài · ~4 giờ tự học · Bài 1 miễn phí. Cơ sở dữ liệu chạy ngay trong trình duyệt — bạn gõ truy vấn thật từ phút đầu tiên.","en":"14 lessons · ~4 hours self-study · Lesson 1 free. The database runs in your browser — you write real queries from minute one."},"lessons":[{"t":{"vi":"SELECT — những truy vấn đầu tiên","en":"SELECT — your first queries"},"kind":"free","html":{"vi":"<h3>Bài 1 — SELECT: những truy vấn đầu tiên</h3>\r\n<p>Cơ sở dữ liệu (database) chỉ đơn giản là các <b>bảng</b> — giống hệt bảng tính Excel: mỗi bảng có các <b>cột</b> (column) và các <b>dòng</b> (row). SQL là ngôn ngữ để <i>đặt câu hỏi</i> cho những bảng đó và nhận về câu trả lời. Không cần cài đặt gì cả: bên dưới là một cơ sở dữ liệu <b>thật</b> của một cửa hàng nhỏ, chạy ngay trong trình duyệt của bạn.</p>\r\n<p>Trong bài này ta chỉ học một câu lệnh duy nhất — <code>SELECT</code> — nhưng đó là câu lệnh bạn sẽ dùng nhiều nhất trong cả sự nghiệp. Nó dùng để <b>đọc</b> dữ liệu: chọn cột nào, từ bảng nào. Ta chưa lọc dòng (bài 2), chưa sắp xếp (bài 3) — chỉ tập trung lấy đúng cột mình cần.</p>\r\n<p>Hãy đi thật chậm. Mỗi ô \"▶ Thử ngay\" là một trình soạn thảo thật: gõ truy vấn, chạy, xem kết quả, và được chấm ngay. Sai cũng không sao — cứ thử lại.</p>\r\n\r\n<h4>1. Cửa hàng của chúng ta có gì?</h4>\r\n<p>Cơ sở dữ liệu này có <b>bốn bảng</b>. Bạn sẽ dùng cả bốn xuyên suốt khóa học:</p>\r\n<table class=\"res\"><tr><th>Bảng</th><th>Chứa gì</th><th>Các cột</th></tr>\r\n<tr><td><code>products</code></td><td>sản phẩm bán ra</td><td><code>id, name, category, price, stock</code></td></tr>\r\n<tr><td><code>customers</code></td><td>khách hàng</td><td><code>id, name, city, joined_at</code></td></tr>\r\n<tr><td><code>orders</code></td><td>đơn hàng</td><td><code>id, customer_id, order_date</code></td></tr>\r\n<tr><td><code>order_items</code></td><td>chi tiết từng dòng trong đơn</td><td><code>id, order_id, product_id, qty</code></td></tr></table>\r\n<p>Bài này chủ yếu dùng bảng <code>products</code>. Giá (<code>price</code>) tính bằng đồng (₫).</p>\r\n\r\n<h4>2. Hình dạng của một truy vấn</h4>\r\n<p>Một câu <code>SELECT</code> cơ bản có hai phần: chọn <b>cột</b>, và chỉ ra <b>bảng</b>.</p>\r\n<pre class=\"run\">SELECT name, price\r\nFROM products;</pre>\r\n<p>Đọc là: \"<b>LẤY</b> các cột name, price <b>TỪ</b> bảng products\". Dấu <code>;</code> kết thúc câu lệnh. SQL không phân biệt chữ hoa/thường, nhưng thói quen tốt là viết <b>HOA</b> các từ khóa (<code>SELECT</code>, <code>FROM</code>) để dễ đọc.</p>\r\n\r\n<h4>3. SELECT * — tất cả các cột</h4>\r\n<p>Dấu <code>*</code> nghĩa là \"mọi cột\". Rất tiện để xem nhanh một bảng có gì.</p>\r\n<pre class=\"run\">SELECT * FROM products;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 1.</b> Hiển thị <b>tất cả các cột</b> của mọi sản phẩm trong bảng <code>products</code>.</span>\r\n<template class=\"st\">SELECT </template>\r\n<template class=\"ref\">SELECT * FROM products</template></div>\r\n\r\n<h4>4. Chọn đúng cột mình cần</h4>\r\n<p>Thực tế hiếm khi cần tất cả. Hãy nêu tên đúng những cột bạn muốn, cách nhau bằng dấu phẩy.</p>\r\n<pre class=\"run\">SELECT name, price FROM products;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 2.</b> Chỉ hiển thị hai cột <code>name</code> và <code>price</code> của mọi sản phẩm.</span>\r\n<template class=\"st\">SELECT </template>\r\n<template class=\"ref\">SELECT name, price FROM products</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 3.</b> Hiển thị ba cột <code>name</code>, <code>category</code>, <code>price</code>.</span>\r\n<template class=\"st\">SELECT </template>\r\n<template class=\"ref\">SELECT name, category, price FROM products</template></div>\r\n\r\n<h4>5. Thứ tự cột là do bạn quyết định</h4>\r\n<p>Các cột hiện ra <b>đúng theo thứ tự bạn viết</b> — không cần theo thứ tự trong bảng.</p>\r\n<pre class=\"run\">SELECT price, name FROM products;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 4.</b> Hiển thị <code>price</code> <b>trước</b>, rồi mới đến <code>name</code>.</span>\r\n<template class=\"st\">SELECT </template>\r\n<template class=\"ref\">SELECT price, name FROM products</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 5.</b> Hiển thị <code>id</code> rồi đến <code>name</code>.</span>\r\n<template class=\"st\">SELECT </template>\r\n<template class=\"ref\">SELECT id, name FROM products</template></div>\r\n\r\n<h4>6. Làm việc với các bảng khác</h4>\r\n<p><code>SELECT</code> dùng được cho <b>bất kỳ</b> bảng nào — chỉ cần đổi tên sau <code>FROM</code>.</p>\r\n<pre class=\"run\">SELECT * FROM customers;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 6.</b> Hiển thị <b>tất cả các cột</b> của mọi khách hàng trong bảng <code>customers</code>.</span>\r\n<template class=\"st\">SELECT </template>\r\n<template class=\"ref\">SELECT * FROM customers</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 7.</b> Từ bảng <code>customers</code>, hiển thị <code>name</code> và <code>city</code>.</span>\r\n<template class=\"st\">SELECT </template>\r\n<template class=\"ref\">SELECT name, city FROM customers</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 8.</b> Hiển thị <b>tất cả các cột</b> của mọi đơn hàng trong bảng <code>orders</code>.</span>\r\n<template class=\"st\">SELECT </template>\r\n<template class=\"ref\">SELECT * FROM orders</template></div>\r\n\r\n<h4>7. DISTINCT — loại bỏ trùng lặp</h4>\r\n<p>Nhiều sản phẩm cùng một danh mục. Nếu chỉ muốn biết \"cửa hàng có những <i>loại</i> hàng nào?\", thêm <code>DISTINCT</code> ngay sau <code>SELECT</code> để mỗi giá trị chỉ xuất hiện một lần.</p>\r\n<pre class=\"run\">SELECT DISTINCT category FROM products;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 9.</b> Liệt kê mỗi <code>category</code> đúng <b>một lần</b> (dùng <code>DISTINCT</code>).</span>\r\n<template class=\"st\">SELECT </template>\r\n<template class=\"ref\">SELECT DISTINCT category FROM products</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 10.</b> Từ bảng <code>customers</code>, liệt kê mỗi <code>city</code> đúng một lần.</span>\r\n<template class=\"st\">SELECT </template>\r\n<template class=\"ref\">SELECT DISTINCT city FROM customers</template></div>\r\n<div class=\"ex stretch\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 11. 🔥 Nâng cao.</b> Bảng <code>order_items</code> ghi từng dòng hàng trong mỗi đơn. Hiển thị ba cột <code>order_id</code>, <code>product_id</code>, <code>qty</code> của bảng này.</span>\r\n<template class=\"st\">SELECT </template>\r\n<template class=\"ref\">SELECT order_id, product_id, qty FROM order_items</template></div>\r\n\r\n<h4>🏠 Homework</h4>\r\n<p>Bốn bài làm ở nhà, tự động chấm ngay trên trang. Bài cuối là bài nâng cao.</p>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 1.</b> Từ bảng <code>products</code>, hiển thị <code>name</code> và <code>stock</code>.</span>\r\n<template class=\"st\">SELECT </template>\r\n<template class=\"ref\">SELECT name, stock FROM products</template></div>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 2.</b> Hiển thị <b>tất cả các cột</b> của bảng <code>order_items</code>.</span>\r\n<template class=\"st\">SELECT </template>\r\n<template class=\"ref\">SELECT * FROM order_items</template></div>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 3.</b> Từ bảng <code>orders</code>, liệt kê mỗi <code>customer_id</code> đúng một lần (dùng <code>DISTINCT</code>).</span>\r\n<template class=\"st\">SELECT </template>\r\n<template class=\"ref\">SELECT DISTINCT customer_id FROM orders</template></div>\r\n<div class=\"ex homework stretch\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 4. 🔥 Nâng cao.</b> Từ bảng <code>customers</code>, hiển thị theo đúng thứ tự: <code>joined_at</code>, <code>name</code>, <code>city</code>.</span>\r\n<template class=\"st\">SELECT </template>\r\n<template class=\"ref\">SELECT joined_at, name, city FROM customers</template></div>\r\n\r\n<div class=\"hw\"><b>Ghi nhớ bài 1:</b> <code>SELECT</code> chọn cột · <code>FROM</code> chọn bảng · <code>*</code> là tất cả · <code>DISTINCT</code> bỏ trùng · thứ tự cột do bạn quyết định. Chỉ vậy thôi — bài sau ta học cách <i>lọc dòng</i> với <code>WHERE</code>. Đi chậm mà chắc.</div>","en":"<h3>Lesson 1 — SELECT: your first queries</h3>\r\n<p>A database is simply a set of <b>tables</b> — exactly like an Excel spreadsheet: each table has <b>columns</b> and <b>rows</b>. SQL is the language you use to <i>ask questions</i> of those tables and get answers back. Nothing to install: below is a <b>real</b> database for a small shop, running right in your browser.</p>\r\n<p>This lesson covers just one statement — <code>SELECT</code> — but it's the one you'll use most in your whole career. It <b>reads</b> data: which columns, from which table. We won't filter rows yet (Lesson 2) or sort them (Lesson 3) — we'll just focus on pulling out the columns you want.</p>\r\n<p>Take it slow. Every \"▶ Try it\" box is a real editor: type a query, run it, see the result, and get graded instantly. Getting it wrong is fine — just try again.</p>\r\n\r\n<h4>1. What's in our shop?</h4>\r\n<p>This database has <b>four tables</b>. You'll use all four throughout the course:</p>\r\n<table class=\"res\"><tr><th>Table</th><th>Holds</th><th>Columns</th></tr>\r\n<tr><td><code>products</code></td><td>items for sale</td><td><code>id, name, category, price, stock</code></td></tr>\r\n<tr><td><code>customers</code></td><td>customers</td><td><code>id, name, city, joined_at</code></td></tr>\r\n<tr><td><code>orders</code></td><td>orders</td><td><code>id, customer_id, order_date</code></td></tr>\r\n<tr><td><code>order_items</code></td><td>each line within an order</td><td><code>id, order_id, product_id, qty</code></td></tr></table>\r\n<p>This lesson mainly uses the <code>products</code> table. Prices (<code>price</code>) are in Vietnamese đồng (₫).</p>\r\n\r\n<h4>2. The shape of a query</h4>\r\n<p>A basic <code>SELECT</code> has two parts: choose the <b>columns</b>, and name the <b>table</b>.</p>\r\n<pre class=\"run\">SELECT name, price\r\nFROM products;</pre>\r\n<p>Read it as: \"<b>SELECT</b> the columns name, price <b>FROM</b> the products table\". The <code>;</code> ends the statement. SQL is not case-sensitive, but a good habit is to write keywords in <b>UPPERCASE</b> (<code>SELECT</code>, <code>FROM</code>) so they stand out.</p>\r\n\r\n<h4>3. SELECT * — every column</h4>\r\n<p>The <code>*</code> means \"all columns\". Handy for a quick peek at what a table contains.</p>\r\n<pre class=\"run\">SELECT * FROM products;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 1.</b> Show <b>all columns</b> of every product in the <code>products</code> table.</span>\r\n<template class=\"st\">SELECT </template>\r\n<template class=\"ref\">SELECT * FROM products</template></div>\r\n\r\n<h4>4. Choosing just the columns you need</h4>\r\n<p>In practice you rarely want everything. Name exactly the columns you want, separated by commas.</p>\r\n<pre class=\"run\">SELECT name, price FROM products;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 2.</b> Show only the two columns <code>name</code> and <code>price</code> of every product.</span>\r\n<template class=\"st\">SELECT </template>\r\n<template class=\"ref\">SELECT name, price FROM products</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 3.</b> Show three columns: <code>name</code>, <code>category</code>, <code>price</code>.</span>\r\n<template class=\"st\">SELECT </template>\r\n<template class=\"ref\">SELECT name, category, price FROM products</template></div>\r\n\r\n<h4>5. Column order is up to you</h4>\r\n<p>Columns appear <b>in the order you write them</b> — they don't have to follow the table's order.</p>\r\n<pre class=\"run\">SELECT price, name FROM products;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 4.</b> Show <code>price</code> <b>first</b>, then <code>name</code>.</span>\r\n<template class=\"st\">SELECT </template>\r\n<template class=\"ref\">SELECT price, name FROM products</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 5.</b> Show <code>id</code> then <code>name</code>.</span>\r\n<template class=\"st\">SELECT </template>\r\n<template class=\"ref\">SELECT id, name FROM products</template></div>\r\n\r\n<h4>6. Working with the other tables</h4>\r\n<p><code>SELECT</code> works on <b>any</b> table — just change the name after <code>FROM</code>.</p>\r\n<pre class=\"run\">SELECT * FROM customers;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 6.</b> Show <b>all columns</b> of every customer in the <code>customers</code> table.</span>\r\n<template class=\"st\">SELECT </template>\r\n<template class=\"ref\">SELECT * FROM customers</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 7.</b> From the <code>customers</code> table, show <code>name</code> and <code>city</code>.</span>\r\n<template class=\"st\">SELECT </template>\r\n<template class=\"ref\">SELECT name, city FROM customers</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 8.</b> Show <b>all columns</b> of every order in the <code>orders</code> table.</span>\r\n<template class=\"st\">SELECT </template>\r\n<template class=\"ref\">SELECT * FROM orders</template></div>\r\n\r\n<h4>7. DISTINCT — remove duplicates</h4>\r\n<p>Many products share a category. If you only want to know \"what <i>kinds</i> of items does the shop sell?\", add <code>DISTINCT</code> right after <code>SELECT</code> so each value appears only once.</p>\r\n<pre class=\"run\">SELECT DISTINCT category FROM products;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 9.</b> List each <code>category</code> exactly <b>once</b> (use <code>DISTINCT</code>).</span>\r\n<template class=\"st\">SELECT </template>\r\n<template class=\"ref\">SELECT DISTINCT category FROM products</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 10.</b> From the <code>customers</code> table, list each <code>city</code> exactly once.</span>\r\n<template class=\"st\">SELECT </template>\r\n<template class=\"ref\">SELECT DISTINCT city FROM customers</template></div>\r\n<div class=\"ex stretch\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 11. 🔥 Stretch.</b> The <code>order_items</code> table records each line of goods in an order. Show three columns <code>order_id</code>, <code>product_id</code>, <code>qty</code> from it.</span>\r\n<template class=\"st\">SELECT </template>\r\n<template class=\"ref\">SELECT order_id, product_id, qty FROM order_items</template></div>\r\n\r\n<h4>🏠 Homework</h4>\r\n<p>Four take-home exercises, auto-graded right on the page. The last one is a stretch.</p>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 1.</b> From the <code>products</code> table, show <code>name</code> and <code>stock</code>.</span>\r\n<template class=\"st\">SELECT </template>\r\n<template class=\"ref\">SELECT name, stock FROM products</template></div>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 2.</b> Show <b>all columns</b> of the <code>order_items</code> table.</span>\r\n<template class=\"st\">SELECT </template>\r\n<template class=\"ref\">SELECT * FROM order_items</template></div>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 3.</b> From the <code>orders</code> table, list each <code>customer_id</code> exactly once (use <code>DISTINCT</code>).</span>\r\n<template class=\"st\">SELECT </template>\r\n<template class=\"ref\">SELECT DISTINCT customer_id FROM orders</template></div>\r\n<div class=\"ex homework stretch\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 4. 🔥 Stretch.</b> From the <code>customers</code> table, show in this exact order: <code>joined_at</code>, <code>name</code>, <code>city</code>.</span>\r\n<template class=\"st\">SELECT </template>\r\n<template class=\"ref\">SELECT joined_at, name, city FROM customers</template></div>\r\n\r\n<div class=\"hw\"><b>Lesson 1 recap:</b> <code>SELECT</code> picks columns · <code>FROM</code> picks the table · <code>*</code> means all · <code>DISTINCT</code> removes duplicates · column order is your choice. That's it — next lesson we learn to <i>filter rows</i> with <code>WHERE</code>. Slow and steady.</div>"}},{"t":{"vi":"WHERE — lọc đúng dòng mình cần","en":"WHERE — filtering rows"},"html":{"vi":"<h3>Bài 2 — WHERE: lọc đúng dòng bạn cần</h3>\r\n<p>Ở Bài 1 bạn đã lấy được các cột từ một bảng. Nhưng bảng thật có hàng nghìn, hàng triệu dòng — bạn hiếm khi muốn xem <i>tất cả</i>. Câu hỏi thực tế luôn có điều kiện: \"sản phẩm nào <b>đắt hơn</b> 30.000₫?\", \"khách hàng nào ở <b>Hà Nội</b>?\", \"món nào thuộc nhóm <b>Đồ uống</b>?\".</p>\r\n<p>Mệnh đề <code>WHERE</code> chính là bộ lọc. Nó đứng ngay sau <code>FROM</code> và giữ lại <b>chỉ những dòng</b> thỏa điều kiện bạn đặt ra. Mọi dòng khác bị loại khỏi kết quả — dữ liệu gốc không hề thay đổi, bạn chỉ đang <i>đặt câu hỏi</i>.</p>\r\n<p>Trong bài này bạn sẽ học cách so sánh số và chữ, kết hợp nhiều điều kiện bằng <code>AND</code>/<code>OR</code>, và khớp mẫu văn bản bằng <code>LIKE</code>. Đây là kỹ năng bạn sẽ dùng trong <i>gần như mọi</i> truy vấn về sau.</p>\r\n\r\n<h4>1. Hình dạng của WHERE</h4>\r\n<p>Thêm một dòng <code>WHERE điều_kiện</code> vào sau <code>FROM</code>:</p>\r\n<pre class=\"run\">SELECT name, price\r\nFROM products\r\nWHERE category = 'Đồ uống';</pre>\r\n<p>SQL xét từng dòng: nếu <code>category</code> đúng bằng <code>'Đồ uống'</code> thì giữ lại, ngược lại bỏ đi. Chuỗi văn bản phải nằm trong <b>dấu nháy đơn</b> <code>'...'</code>.</p>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 1.</b> Hiển thị <b>tất cả các cột</b> của những sản phẩm thuộc nhóm <code>'Đồ uống'</code>.</span>\r\n<template class=\"st\">SELECT * FROM products\r\nWHERE </template>\r\n<template class=\"ref\">SELECT * FROM products WHERE category = 'Đồ uống'</template></div>\r\n\r\n<h4>2. Các toán tử so sánh</h4>\r\n<p>Với số, bạn có đủ bộ so sánh quen thuộc:</p>\r\n<table class=\"res\"><tr><th>Toán tử</th><th>Ý nghĩa</th></tr>\r\n<tr><td><code>=</code></td><td>bằng</td></tr>\r\n<tr><td><code>&lt;&gt;</code></td><td>khác (không bằng)</td></tr>\r\n<tr><td><code>&gt;</code> <code>&lt;</code></td><td>lớn hơn, nhỏ hơn</td></tr>\r\n<tr><td><code>&gt;=</code> <code>&lt;=</code></td><td>lớn hơn hoặc bằng, nhỏ hơn hoặc bằng</td></tr></table>\r\n<pre class=\"run\">SELECT name, price\r\nFROM products\r\nWHERE price > 30000;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 2.</b> Lấy <code>name</code> và <code>price</code> của các sản phẩm có giá <b>lớn hơn</b> 30000.</span>\r\n<template class=\"st\">SELECT name, price FROM products\r\nWHERE </template>\r\n<template class=\"ref\">SELECT name, price FROM products WHERE price > 30000</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 3.</b> Lấy <code>name</code> và <code>price</code> của các sản phẩm có giá <b>nhỏ hơn hoặc bằng</b> 12000.</span>\r\n<template class=\"st\">SELECT name, price FROM products\r\nWHERE </template>\r\n<template class=\"ref\">SELECT name, price FROM products WHERE price <= 12000</template></div>\r\n\r\n<h4>3. Lọc theo văn bản</h4>\r\n<p>So sánh chuỗi cũng dùng <code>=</code> hoặc <code>&lt;&gt;</code>. Nhớ đặt giá trị trong dấu nháy đơn, và gõ đúng dấu tiếng Việt.</p>\r\n<pre class=\"run\">SELECT name FROM customers\r\nWHERE city = 'Hà Nội';</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 4.</b> Lấy <code>name</code> của các khách hàng ở <code>'Hà Nội'</code>.</span>\r\n<template class=\"st\">SELECT name FROM customers\r\nWHERE </template>\r\n<template class=\"ref\">SELECT name FROM customers WHERE city = 'Hà Nội'</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 5.</b> Lấy <code>name</code> và <code>category</code> của mọi sản phẩm <b>không</b> thuộc nhóm <code>'Văn phòng phẩm'</code> (dùng <code>&lt;&gt;</code>).</span>\r\n<template class=\"st\">SELECT name, category FROM products\r\nWHERE </template>\r\n<template class=\"ref\">SELECT name, category FROM products WHERE category <> 'Văn phòng phẩm'</template></div>\r\n\r\n<h4>4. Kết hợp điều kiện: AND, OR</h4>\r\n<p>Nối nhiều điều kiện bằng <code>AND</code> (phải thỏa <b>cả hai</b>) hoặc <code>OR</code> (thỏa <b>ít nhất một</b>).</p>\r\n<pre class=\"run\">SELECT name, price\r\nFROM products\r\nWHERE category = 'Đồ uống' AND price < 30000;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 6.</b> Lấy <code>name</code>, <code>price</code> của sản phẩm nhóm <code>'Đồ uống'</code> <b>và</b> giá nhỏ hơn 30000.</span>\r\n<template class=\"st\">SELECT name, price FROM products\r\nWHERE </template>\r\n<template class=\"ref\">SELECT name, price FROM products WHERE category = 'Đồ uống' AND price < 30000</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 7.</b> Lấy <code>name</code> của sản phẩm thuộc nhóm <code>'Điện tử'</code> <b>hoặc</b> có giá lớn hơn 40000.</span>\r\n<template class=\"st\">SELECT name FROM products\r\nWHERE </template>\r\n<template class=\"ref\">SELECT name FROM products WHERE category = 'Điện tử' OR price > 40000</template></div>\r\n\r\n<h4>5. Khoảng giá trị: BETWEEN và IN</h4>\r\n<p><code>BETWEEN a AND b</code> chọn giá trị trong khoảng, <b>bao gồm cả hai đầu</b>. <code>IN (…)</code> chọn giá trị khớp một trong danh sách — gọn hơn nhiều so với chuỗi <code>OR</code> dài.</p>\r\n<pre class=\"run\">SELECT name, price FROM products\r\nWHERE price BETWEEN 10000 AND 30000;\r\n\r\nSELECT name, category FROM products\r\nWHERE category IN ('Đồ ăn', 'Điện tử');</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 8.</b> Lấy <code>name</code>, <code>price</code> của sản phẩm có giá <b>từ 10000 đến 30000</b> (dùng <code>BETWEEN</code>).</span>\r\n<template class=\"st\">SELECT name, price FROM products\r\nWHERE </template>\r\n<template class=\"ref\">SELECT name, price FROM products WHERE price BETWEEN 10000 AND 30000</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 9.</b> Lấy <code>name</code>, <code>category</code> của sản phẩm thuộc nhóm <code>'Đồ ăn'</code> hoặc <code>'Điện tử'</code> (dùng <code>IN</code>).</span>\r\n<template class=\"st\">SELECT name, category FROM products\r\nWHERE </template>\r\n<template class=\"ref\">SELECT name, category FROM products WHERE category IN ('Đồ ăn', 'Điện tử')</template></div>\r\n\r\n<h4>6. Khớp mẫu văn bản: LIKE</h4>\r\n<p>Khi chỉ nhớ một phần tên, dùng <code>LIKE</code> với ký tự đại diện: <code>%</code> thay cho <b>bất kỳ chuỗi nào</b> (kể cả rỗng), <code>_</code> thay cho <b>đúng một ký tự</b>.</p>\r\n<table class=\"res\"><tr><th>Mẫu</th><th>Khớp</th></tr>\r\n<tr><td><code>'S%'</code></td><td>bắt đầu bằng S</td></tr>\r\n<tr><td><code>'%đá'</code></td><td>kết thúc bằng đá</td></tr>\r\n<tr><td><code>'%cam%'</code></td><td>chứa \"cam\" ở bất kỳ đâu</td></tr></table>\r\n<pre class=\"run\">SELECT name FROM products\r\nWHERE name LIKE 'S%';</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 10.</b> Lấy <code>name</code> của các sản phẩm có tên <b>bắt đầu bằng chữ \"S\"</b> (dùng <code>LIKE 'S%'</code>).</span>\r\n<template class=\"st\">SELECT name FROM products\r\nWHERE </template>\r\n<template class=\"ref\">SELECT name FROM products WHERE name LIKE 'S%'</template></div>\r\n\r\n<h4>7. Ghép mọi thứ lại</h4>\r\n<p>Sức mạnh thật sự đến khi bạn kết hợp bộ lọc với sắp xếp (bạn sẽ học kỹ <code>ORDER BY</code> ở Bài 3). Thử ngay bài tập nâng cao:</p>\r\n<div class=\"ex stretch\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 11. 🔥 Nâng cao.</b> Lấy <code>name</code>, <code>price</code> của sản phẩm nhóm <code>'Đồ uống'</code> có giá <b>từ 10000 đến 40000</b>, sắp xếp theo <code>price</code> <b>giảm dần</b> (<code>ORDER BY price DESC</code>).</span>\r\n<template class=\"st\">SELECT name, price FROM products\r\nWHERE \r\nORDER BY </template>\r\n<template class=\"ref\">SELECT name, price FROM products WHERE category = 'Đồ uống' AND price BETWEEN 10000 AND 40000 ORDER BY price DESC</template></div>\r\n\r\n<h4>🏠 Homework</h4>\r\n<p>Bốn bài làm ở nhà, tự động chấm ngay trên trang. Bài cuối là bài nâng cao.</p>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 1.</b> Lấy <code>name</code>, <code>stock</code> của các sản phẩm còn <b>ít hơn 50</b> trong kho.</span>\r\n<template class=\"st\">SELECT name, stock FROM products\r\nWHERE </template>\r\n<template class=\"ref\">SELECT name, stock FROM products WHERE stock < 50</template></div>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 2.</b> Lấy <code>name</code>, <code>price</code> của sản phẩm nhóm <code>'Văn phòng phẩm'</code> <b>và</b> có giá nhỏ hơn 15000.</span>\r\n<template class=\"st\">SELECT name, price FROM products\r\nWHERE </template>\r\n<template class=\"ref\">SELECT name, price FROM products WHERE category = 'Văn phòng phẩm' AND price < 15000</template></div>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 3.</b> Lấy <code>name</code>, <code>joined_at</code> của các khách hàng <b>gia nhập trong năm 2024</b> (dùng <code>LIKE '2024%'</code> trên cột <code>joined_at</code>).</span>\r\n<template class=\"st\">SELECT name, joined_at FROM customers\r\nWHERE </template>\r\n<template class=\"ref\">SELECT name, joined_at FROM customers WHERE joined_at LIKE '2024%'</template></div>\r\n<div class=\"ex homework stretch\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 4. 🔥 Nâng cao.</b> Lấy <code>name</code>, <code>price</code> của sản phẩm <b>không</b> thuộc nhóm <code>'Điện tử'</code> <b>và</b> có giá <b>từ 20000 trở lên</b>, sắp xếp theo <code>price</code> giảm dần.</span>\r\n<template class=\"st\">SELECT name, price FROM products\r\nWHERE \r\nORDER BY </template>\r\n<template class=\"ref\">SELECT name, price FROM products WHERE category <> 'Điện tử' AND price >= 20000 ORDER BY price DESC</template></div>","en":"<h3>Lesson 2 — WHERE: filter to the rows you need</h3>\r\n<p>In Lesson 1 you pulled columns out of a table. But real tables have thousands or millions of rows — you rarely want to see <i>all</i> of them. Real questions always come with a condition: \"which products cost <b>more than</b> 30,000₫?\", \"which customers are in <b>Hà Nội</b>?\", \"which items are in the <b>Đồ uống</b> (drinks) category?\".</p>\r\n<p>The <code>WHERE</code> clause is your filter. It sits right after <code>FROM</code> and keeps <b>only the rows</b> that satisfy your condition. Every other row is dropped from the result — the underlying data never changes, you are simply <i>asking a question</i>.</p>\r\n<p>In this lesson you'll compare numbers and text, combine conditions with <code>AND</code>/<code>OR</code>, and match text patterns with <code>LIKE</code>. You will use this skill in <i>almost every</i> query from here on.</p>\r\n\r\n<h4>1. The shape of WHERE</h4>\r\n<p>Add a <code>WHERE condition</code> line after <code>FROM</code>:</p>\r\n<pre class=\"run\">SELECT name, price\r\nFROM products\r\nWHERE category = 'Đồ uống';</pre>\r\n<p>SQL checks each row: if <code>category</code> equals <code>'Đồ uống'</code> it stays, otherwise it is dropped. Text values must sit inside <b>single quotes</b> <code>'...'</code>.</p>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 1.</b> Show <b>all columns</b> of every product in the <code>'Đồ uống'</code> category.</span>\r\n<template class=\"st\">SELECT * FROM products\r\nWHERE </template>\r\n<template class=\"ref\">SELECT * FROM products WHERE category = 'Đồ uống'</template></div>\r\n\r\n<h4>2. Comparison operators</h4>\r\n<p>For numbers you have the full set of comparisons:</p>\r\n<table class=\"res\"><tr><th>Operator</th><th>Meaning</th></tr>\r\n<tr><td><code>=</code></td><td>equal to</td></tr>\r\n<tr><td><code>&lt;&gt;</code></td><td>not equal to</td></tr>\r\n<tr><td><code>&gt;</code> <code>&lt;</code></td><td>greater than, less than</td></tr>\r\n<tr><td><code>&gt;=</code> <code>&lt;=</code></td><td>greater/less than or equal to</td></tr></table>\r\n<pre class=\"run\">SELECT name, price\r\nFROM products\r\nWHERE price > 30000;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 2.</b> Get <code>name</code> and <code>price</code> of products priced <b>greater than</b> 30000.</span>\r\n<template class=\"st\">SELECT name, price FROM products\r\nWHERE </template>\r\n<template class=\"ref\">SELECT name, price FROM products WHERE price > 30000</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 3.</b> Get <code>name</code> and <code>price</code> of products priced <b>less than or equal to</b> 12000.</span>\r\n<template class=\"st\">SELECT name, price FROM products\r\nWHERE </template>\r\n<template class=\"ref\">SELECT name, price FROM products WHERE price <= 12000</template></div>\r\n\r\n<h4>3. Filtering by text</h4>\r\n<p>Comparing text also uses <code>=</code> or <code>&lt;&gt;</code>. Remember the single quotes, and type the Vietnamese accents exactly.</p>\r\n<pre class=\"run\">SELECT name FROM customers\r\nWHERE city = 'Hà Nội';</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 4.</b> Get the <code>name</code> of customers in <code>'Hà Nội'</code>.</span>\r\n<template class=\"st\">SELECT name FROM customers\r\nWHERE </template>\r\n<template class=\"ref\">SELECT name FROM customers WHERE city = 'Hà Nội'</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 5.</b> Get <code>name</code> and <code>category</code> of every product that is <b>not</b> in the <code>'Văn phòng phẩm'</code> category (use <code>&lt;&gt;</code>).</span>\r\n<template class=\"st\">SELECT name, category FROM products\r\nWHERE </template>\r\n<template class=\"ref\">SELECT name, category FROM products WHERE category <> 'Văn phòng phẩm'</template></div>\r\n\r\n<h4>4. Combining conditions: AND, OR</h4>\r\n<p>Join conditions with <code>AND</code> (<b>both</b> must be true) or <code>OR</code> (<b>at least one</b> is true).</p>\r\n<pre class=\"run\">SELECT name, price\r\nFROM products\r\nWHERE category = 'Đồ uống' AND price < 30000;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 6.</b> Get <code>name</code>, <code>price</code> of products in the <code>'Đồ uống'</code> category <b>and</b> priced below 30000.</span>\r\n<template class=\"st\">SELECT name, price FROM products\r\nWHERE </template>\r\n<template class=\"ref\">SELECT name, price FROM products WHERE category = 'Đồ uống' AND price < 30000</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 7.</b> Get the <code>name</code> of products in the <code>'Điện tử'</code> category <b>or</b> priced above 40000.</span>\r\n<template class=\"st\">SELECT name FROM products\r\nWHERE </template>\r\n<template class=\"ref\">SELECT name FROM products WHERE category = 'Điện tử' OR price > 40000</template></div>\r\n\r\n<h4>5. Ranges: BETWEEN and IN</h4>\r\n<p><code>BETWEEN a AND b</code> selects values in a range, <b>inclusive of both ends</b>. <code>IN (…)</code> matches any value in a list — much tidier than a long chain of <code>OR</code>.</p>\r\n<pre class=\"run\">SELECT name, price FROM products\r\nWHERE price BETWEEN 10000 AND 30000;\r\n\r\nSELECT name, category FROM products\r\nWHERE category IN ('Đồ ăn', 'Điện tử');</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 8.</b> Get <code>name</code>, <code>price</code> of products priced <b>from 10000 to 30000</b> (use <code>BETWEEN</code>).</span>\r\n<template class=\"st\">SELECT name, price FROM products\r\nWHERE </template>\r\n<template class=\"ref\">SELECT name, price FROM products WHERE price BETWEEN 10000 AND 30000</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 9.</b> Get <code>name</code>, <code>category</code> of products in the <code>'Đồ ăn'</code> or <code>'Điện tử'</code> category (use <code>IN</code>).</span>\r\n<template class=\"st\">SELECT name, category FROM products\r\nWHERE </template>\r\n<template class=\"ref\">SELECT name, category FROM products WHERE category IN ('Đồ ăn', 'Điện tử')</template></div>\r\n\r\n<h4>6. Pattern matching: LIKE</h4>\r\n<p>When you only remember part of a name, use <code>LIKE</code> with wildcards: <code>%</code> stands for <b>any string</b> (including empty), <code>_</code> stands for <b>exactly one character</b>.</p>\r\n<table class=\"res\"><tr><th>Pattern</th><th>Matches</th></tr>\r\n<tr><td><code>'S%'</code></td><td>starts with S</td></tr>\r\n<tr><td><code>'%đá'</code></td><td>ends with đá</td></tr>\r\n<tr><td><code>'%cam%'</code></td><td>contains \"cam\" anywhere</td></tr></table>\r\n<pre class=\"run\">SELECT name FROM products\r\nWHERE name LIKE 'S%';</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 10.</b> Get the <code>name</code> of products whose name <b>starts with \"S\"</b> (use <code>LIKE 'S%'</code>).</span>\r\n<template class=\"st\">SELECT name FROM products\r\nWHERE </template>\r\n<template class=\"ref\">SELECT name FROM products WHERE name LIKE 'S%'</template></div>\r\n\r\n<h4>7. Putting it together</h4>\r\n<p>The real power appears when you combine a filter with sorting (you'll learn <code>ORDER BY</code> properly in Lesson 3). Try the stretch:</p>\r\n<div class=\"ex stretch\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 11. 🔥 Stretch.</b> Get <code>name</code>, <code>price</code> of products in the <code>'Đồ uống'</code> category priced <b>from 10000 to 40000</b>, sorted by <code>price</code> <b>descending</b> (<code>ORDER BY price DESC</code>).</span>\r\n<template class=\"st\">SELECT name, price FROM products\r\nWHERE \r\nORDER BY </template>\r\n<template class=\"ref\">SELECT name, price FROM products WHERE category = 'Đồ uống' AND price BETWEEN 10000 AND 40000 ORDER BY price DESC</template></div>\r\n\r\n<h4>🏠 Homework</h4>\r\n<p>Four take-home exercises, auto-graded right on the page. The last one is a stretch.</p>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 1.</b> Get <code>name</code>, <code>stock</code> of products with <b>fewer than 50</b> in stock.</span>\r\n<template class=\"st\">SELECT name, stock FROM products\r\nWHERE </template>\r\n<template class=\"ref\">SELECT name, stock FROM products WHERE stock < 50</template></div>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 2.</b> Get <code>name</code>, <code>price</code> of products in the <code>'Văn phòng phẩm'</code> category <b>and</b> priced below 15000.</span>\r\n<template class=\"st\">SELECT name, price FROM products\r\nWHERE </template>\r\n<template class=\"ref\">SELECT name, price FROM products WHERE category = 'Văn phòng phẩm' AND price < 15000</template></div>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 3.</b> Get <code>name</code>, <code>joined_at</code> of customers who <b>joined in 2024</b> (use <code>LIKE '2024%'</code> on <code>joined_at</code>).</span>\r\n<template class=\"st\">SELECT name, joined_at FROM customers\r\nWHERE </template>\r\n<template class=\"ref\">SELECT name, joined_at FROM customers WHERE joined_at LIKE '2024%'</template></div>\r\n<div class=\"ex homework stretch\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 4. 🔥 Stretch.</b> Get <code>name</code>, <code>price</code> of products <b>not</b> in the <code>'Điện tử'</code> category <b>and</b> priced <b>20000 or above</b>, sorted by <code>price</code> descending.</span>\r\n<template class=\"st\">SELECT name, price FROM products\r\nWHERE \r\nORDER BY </template>\r\n<template class=\"ref\">SELECT name, price FROM products WHERE category <> 'Điện tử' AND price >= 20000 ORDER BY price DESC</template></div>"}},{"t":{"vi":"ORDER BY & LIMIT — sắp xếp và lấy top","en":"ORDER BY & LIMIT — sorting and top-N"},"html":{"vi":"<h3>Bài 3 — ORDER BY & LIMIT: sắp xếp và lấy top</h3>\r\n<p>Kết quả truy vấn ở các bài trước trả về theo thứ tự \"tự nhiên\" của bảng — không có gì đảm bảo nó có ý nghĩa. Nhưng câu hỏi kinh doanh gần như luôn cần <b>thứ tự</b>: \"sản phẩm <b>đắt nhất</b>?\", \"khách hàng <b>mới nhất</b>?\", \"5 mặt hàng <b>tồn kho nhiều nhất</b>?\".</p>\r\n<p><code>ORDER BY</code> sắp xếp kết quả theo một (hoặc nhiều) cột. Kết hợp với <code>LIMIT</code> để chỉ lấy vài dòng đầu, bạn có ngay công cụ trả lời mọi câu hỏi dạng \"top N\" — thứ xuất hiện trong hầu hết báo cáo thực tế.</p>\r\n<p><code>ORDER BY</code> luôn đứng <b>sau</b> <code>WHERE</code> (nếu có), và <code>LIMIT</code> đứng <b>cuối cùng</b>. Hãy nhớ trật tự này: <code>SELECT … FROM … WHERE … ORDER BY … LIMIT …</code>.</p>\r\n\r\n<h4>1. ORDER BY — sắp xếp tăng dần</h4>\r\n<p>Mặc định <code>ORDER BY cột</code> sắp xếp <b>tăng dần</b> (nhỏ → lớn với số, A → Z với chữ):</p>\r\n<pre class=\"run\">SELECT name, price\r\nFROM products\r\nORDER BY price;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 1.</b> Lấy <code>name</code>, <code>price</code> của mọi sản phẩm, sắp xếp theo <code>price</code> <b>tăng dần</b>.</span>\r\n<template class=\"st\">SELECT name, price FROM products\r\nORDER BY </template>\r\n<template class=\"ref\">SELECT name, price FROM products ORDER BY price</template></div>\r\n\r\n<h4>2. Giảm dần với DESC</h4>\r\n<p>Thêm <code>DESC</code> để đảo chiều — lớn → nhỏ. (Chiều mặc định là <code>ASC</code>, thường không cần viết.)</p>\r\n<pre class=\"run\">SELECT name, price\r\nFROM products\r\nORDER BY price DESC;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 2.</b> Lấy <code>name</code>, <code>price</code> của mọi sản phẩm, sắp xếp theo <code>price</code> <b>giảm dần</b>.</span>\r\n<template class=\"st\">SELECT name, price FROM products\r\nORDER BY </template>\r\n<template class=\"ref\">SELECT name, price FROM products ORDER BY price DESC</template></div>\r\n\r\n<h4>3. Sắp xếp theo văn bản và ngày</h4>\r\n<p><code>ORDER BY</code> cũng dùng được với chữ (thứ tự bảng chữ cái) và với ngày dạng chuỗi <code>YYYY-MM-DD</code> (nhờ định dạng này, so sánh chuỗi cũng chính là so sánh thời gian).</p>\r\n<pre class=\"run\">SELECT name FROM products\r\nORDER BY name;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 3.</b> Lấy <code>name</code> của mọi sản phẩm, sắp xếp theo <b>bảng chữ cái</b> (theo cột <code>name</code>).</span>\r\n<template class=\"st\">SELECT name FROM products\r\nORDER BY </template>\r\n<template class=\"ref\">SELECT name FROM products ORDER BY name</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 4.</b> Lấy <code>name</code>, <code>joined_at</code> của mọi khách hàng, sắp xếp theo <code>joined_at</code> <b>tăng dần</b> (người gia nhập sớm nhất lên trước).</span>\r\n<template class=\"st\">SELECT name, joined_at FROM customers\r\nORDER BY </template>\r\n<template class=\"ref\">SELECT name, joined_at FROM customers ORDER BY joined_at</template></div>\r\n\r\n<h4>4. Sắp xếp nhiều cột</h4>\r\n<p>Liệt kê nhiều cột, cách nhau dấu phẩy. SQL sắp theo cột đầu trước; khi <b>bằng nhau</b> mới xét đến cột tiếp theo. Mỗi cột có thể có chiều riêng.</p>\r\n<pre class=\"run\">SELECT name, category, price\r\nFROM products\r\nORDER BY category, price;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 5.</b> Lấy <code>name</code>, <code>category</code>, <code>price</code>, sắp xếp theo <code>category</code> rồi theo <code>price</code> (cả hai tăng dần).</span>\r\n<template class=\"st\">SELECT name, category, price FROM products\r\nORDER BY </template>\r\n<template class=\"ref\">SELECT name, category, price FROM products ORDER BY category, price</template></div>\r\n\r\n<h4>5. LIMIT — chỉ lấy vài dòng đầu</h4>\r\n<p><code>LIMIT n</code> cắt kết quả xuống còn tối đa <code>n</code> dòng. Rất hữu ích để xem nhanh, hoặc kết hợp với <code>ORDER BY</code> để lấy \"top\".</p>\r\n<pre class=\"run\">SELECT name FROM products\r\nORDER BY id\r\nLIMIT 3;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 6.</b> Lấy <code>name</code> của <b>3 sản phẩm đầu tiên theo <code>id</code></b> (sắp theo <code>id</code>, giới hạn 3 dòng).</span>\r\n<template class=\"st\">SELECT name FROM products\r\nORDER BY id\r\n</template>\r\n<template class=\"ref\">SELECT name FROM products ORDER BY id LIMIT 3</template></div>\r\n\r\n<h4>6. Công thức \"top N\"</h4>\r\n<p>Ghép <code>ORDER BY … DESC</code> với <code>LIMIT n</code> là cách kinh điển để lấy \"n cái lớn nhất\". Đảo lại thành <code>ASC</code> để lấy \"n cái nhỏ nhất\".</p>\r\n<pre class=\"run\">SELECT name, price\r\nFROM products\r\nORDER BY price DESC\r\nLIMIT 3;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 7.</b> Lấy <code>name</code>, <code>price</code> của <b>3 sản phẩm đắt nhất</b>.</span>\r\n<template class=\"st\">SELECT name, price FROM products\r\n</template>\r\n<template class=\"ref\">SELECT name, price FROM products ORDER BY price DESC LIMIT 3</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 8.</b> Lấy <code>name</code>, <code>price</code> của <b>3 sản phẩm rẻ nhất</b>.</span>\r\n<template class=\"st\">SELECT name, price FROM products\r\n</template>\r\n<template class=\"ref\">SELECT name, price FROM products ORDER BY price ASC LIMIT 3</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 9.</b> Lấy <code>name</code>, <code>price</code> của <b>đúng 1 sản phẩm đắt nhất</b>.</span>\r\n<template class=\"st\">SELECT name, price FROM products\r\n</template>\r\n<template class=\"ref\">SELECT name, price FROM products ORDER BY price DESC LIMIT 1</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 10.</b> Lấy <code>name</code>, <code>stock</code> của <b>5 sản phẩm tồn kho nhiều nhất</b>.</span>\r\n<template class=\"st\">SELECT name, stock FROM products\r\n</template>\r\n<template class=\"ref\">SELECT name, stock FROM products ORDER BY stock DESC LIMIT 5</template></div>\r\n\r\n<h4>7. Bỏ qua vài dòng đầu: OFFSET</h4>\r\n<p><code>LIMIT n OFFSET k</code> bỏ qua <code>k</code> dòng đầu rồi lấy <code>n</code> dòng tiếp theo — dùng cho phân trang, hoặc lấy \"hạng nhì, hạng ba\".</p>\r\n<div class=\"ex stretch\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 11. 🔥 Nâng cao.</b> Lấy <code>name</code>, <code>price</code> của <b>sản phẩm đắt thứ 2 và thứ 3</b> (bỏ qua cái đắt nhất). Gợi ý: <code>ORDER BY price DESC LIMIT 2 OFFSET 1</code>.</span>\r\n<template class=\"st\">SELECT name, price FROM products\r\nORDER BY price DESC\r\n</template>\r\n<template class=\"ref\">SELECT name, price FROM products ORDER BY price DESC LIMIT 2 OFFSET 1</template></div>\r\n\r\n<h4>🏠 Homework</h4>\r\n<p>Bốn bài làm ở nhà, tự động chấm ngay trên trang. Bài cuối là bài nâng cao.</p>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 1.</b> Lấy <code>name</code>, <code>stock</code> của mọi sản phẩm, sắp xếp theo <code>stock</code> <b>tăng dần</b>.</span>\r\n<template class=\"st\">SELECT name, stock FROM products\r\nORDER BY </template>\r\n<template class=\"ref\">SELECT name, stock FROM products ORDER BY stock</template></div>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 2.</b> Lấy <code>name</code>, <code>price</code> của sản phẩm nhóm <code>'Đồ uống'</code>, sắp xếp theo <code>price</code> <b>giảm dần</b>.</span>\r\n<template class=\"st\">SELECT name, price FROM products\r\nWHERE \r\nORDER BY </template>\r\n<template class=\"ref\">SELECT name, price FROM products WHERE category = 'Đồ uống' ORDER BY price DESC</template></div>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 3.</b> Lấy <code>name</code>, <code>price</code> của <b>3 sản phẩm rẻ nhất KHÔNG thuộc nhóm <code>'Điện tử'</code></b>.</span>\r\n<template class=\"st\">SELECT name, price FROM products\r\nWHERE \r\nORDER BY </template>\r\n<template class=\"ref\">SELECT name, price FROM products WHERE category <> 'Điện tử' ORDER BY price ASC LIMIT 3</template></div>\r\n<div class=\"ex homework stretch\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 4. 🔥 Nâng cao.</b> Lấy <code>name</code>, <code>city</code> của mọi khách hàng, sắp xếp theo <code>city</code> rồi theo <code>name</code> (cả hai tăng dần).</span>\r\n<template class=\"st\">SELECT name, city FROM customers\r\nORDER BY </template>\r\n<template class=\"ref\">SELECT name, city FROM customers ORDER BY city, name</template></div>","en":"<h3>Lesson 3 — ORDER BY & LIMIT: sort and take the top</h3>\r\n<p>Query results so far came back in the table's \"natural\" order — nothing guarantees it means anything. But business questions almost always need an <b>order</b>: \"the <b>most expensive</b> product?\", \"the <b>newest</b> customer?\", \"the 5 items with the <b>most stock</b>?\".</p>\r\n<p><code>ORDER BY</code> sorts your results by one (or more) columns. Combine it with <code>LIMIT</code> to take just the first few rows and you have a tool for every \"top N\" question — which shows up in almost every real report.</p>\r\n<p><code>ORDER BY</code> always comes <b>after</b> <code>WHERE</code> (if present), and <code>LIMIT</code> comes <b>last</b>. Remember the order: <code>SELECT … FROM … WHERE … ORDER BY … LIMIT …</code>.</p>\r\n\r\n<h4>1. ORDER BY — ascending sort</h4>\r\n<p>By default <code>ORDER BY column</code> sorts <b>ascending</b> (small → large for numbers, A → Z for text):</p>\r\n<pre class=\"run\">SELECT name, price\r\nFROM products\r\nORDER BY price;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 1.</b> Get <code>name</code>, <code>price</code> of every product, sorted by <code>price</code> <b>ascending</b>.</span>\r\n<template class=\"st\">SELECT name, price FROM products\r\nORDER BY </template>\r\n<template class=\"ref\">SELECT name, price FROM products ORDER BY price</template></div>\r\n\r\n<h4>2. Descending with DESC</h4>\r\n<p>Add <code>DESC</code> to reverse it — large → small. (The default direction is <code>ASC</code>, which you usually don't write.)</p>\r\n<pre class=\"run\">SELECT name, price\r\nFROM products\r\nORDER BY price DESC;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 2.</b> Get <code>name</code>, <code>price</code> of every product, sorted by <code>price</code> <b>descending</b>.</span>\r\n<template class=\"st\">SELECT name, price FROM products\r\nORDER BY </template>\r\n<template class=\"ref\">SELECT name, price FROM products ORDER BY price DESC</template></div>\r\n\r\n<h4>3. Sorting text and dates</h4>\r\n<p><code>ORDER BY</code> also works on text (alphabetical order) and on dates stored as <code>YYYY-MM-DD</code> strings (thanks to that format, comparing the strings is the same as comparing the dates).</p>\r\n<pre class=\"run\">SELECT name FROM products\r\nORDER BY name;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 3.</b> Get the <code>name</code> of every product, sorted <b>alphabetically</b> (by the <code>name</code> column).</span>\r\n<template class=\"st\">SELECT name FROM products\r\nORDER BY </template>\r\n<template class=\"ref\">SELECT name FROM products ORDER BY name</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 4.</b> Get <code>name</code>, <code>joined_at</code> of every customer, sorted by <code>joined_at</code> <b>ascending</b> (earliest joiner first).</span>\r\n<template class=\"st\">SELECT name, joined_at FROM customers\r\nORDER BY </template>\r\n<template class=\"ref\">SELECT name, joined_at FROM customers ORDER BY joined_at</template></div>\r\n\r\n<h4>4. Sorting by multiple columns</h4>\r\n<p>List several columns separated by commas. SQL sorts by the first; only when values <b>tie</b> does it look at the next column. Each column can have its own direction.</p>\r\n<pre class=\"run\">SELECT name, category, price\r\nFROM products\r\nORDER BY category, price;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 5.</b> Get <code>name</code>, <code>category</code>, <code>price</code>, sorted by <code>category</code> then by <code>price</code> (both ascending).</span>\r\n<template class=\"st\">SELECT name, category, price FROM products\r\nORDER BY </template>\r\n<template class=\"ref\">SELECT name, category, price FROM products ORDER BY category, price</template></div>\r\n\r\n<h4>5. LIMIT — take only the first few rows</h4>\r\n<p><code>LIMIT n</code> trims the result to at most <code>n</code> rows. Great for a quick peek, or combined with <code>ORDER BY</code> to grab the \"top\".</p>\r\n<pre class=\"run\">SELECT name FROM products\r\nORDER BY id\r\nLIMIT 3;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 6.</b> Get the <code>name</code> of the <b>first 3 products by <code>id</code></b> (sort by <code>id</code>, limit to 3 rows).</span>\r\n<template class=\"st\">SELECT name FROM products\r\nORDER BY id\r\n</template>\r\n<template class=\"ref\">SELECT name FROM products ORDER BY id LIMIT 3</template></div>\r\n\r\n<h4>6. The \"top N\" formula</h4>\r\n<p>Pairing <code>ORDER BY … DESC</code> with <code>LIMIT n</code> is the classic way to get \"the n largest\". Flip it to <code>ASC</code> for \"the n smallest\".</p>\r\n<pre class=\"run\">SELECT name, price\r\nFROM products\r\nORDER BY price DESC\r\nLIMIT 3;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 7.</b> Get <code>name</code>, <code>price</code> of the <b>3 most expensive products</b>.</span>\r\n<template class=\"st\">SELECT name, price FROM products\r\n</template>\r\n<template class=\"ref\">SELECT name, price FROM products ORDER BY price DESC LIMIT 3</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 8.</b> Get <code>name</code>, <code>price</code> of the <b>3 cheapest products</b>.</span>\r\n<template class=\"st\">SELECT name, price FROM products\r\n</template>\r\n<template class=\"ref\">SELECT name, price FROM products ORDER BY price ASC LIMIT 3</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 9.</b> Get <code>name</code>, <code>price</code> of the <b>single most expensive product</b>.</span>\r\n<template class=\"st\">SELECT name, price FROM products\r\n</template>\r\n<template class=\"ref\">SELECT name, price FROM products ORDER BY price DESC LIMIT 1</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 10.</b> Get <code>name</code>, <code>stock</code> of the <b>5 products with the most stock</b>.</span>\r\n<template class=\"st\">SELECT name, stock FROM products\r\n</template>\r\n<template class=\"ref\">SELECT name, stock FROM products ORDER BY stock DESC LIMIT 5</template></div>\r\n\r\n<h4>7. Skipping rows: OFFSET</h4>\r\n<p><code>LIMIT n OFFSET k</code> skips the first <code>k</code> rows then takes the next <code>n</code> — useful for paging, or for \"2nd and 3rd place\".</p>\r\n<div class=\"ex stretch\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 11. 🔥 Stretch.</b> Get <code>name</code>, <code>price</code> of the <b>2nd and 3rd most expensive products</b> (skip the most expensive one). Hint: <code>ORDER BY price DESC LIMIT 2 OFFSET 1</code>.</span>\r\n<template class=\"st\">SELECT name, price FROM products\r\nORDER BY price DESC\r\n</template>\r\n<template class=\"ref\">SELECT name, price FROM products ORDER BY price DESC LIMIT 2 OFFSET 1</template></div>\r\n\r\n<h4>🏠 Homework</h4>\r\n<p>Four take-home exercises, auto-graded right on the page. The last one is a stretch.</p>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 1.</b> Get <code>name</code>, <code>stock</code> of every product, sorted by <code>stock</code> <b>ascending</b>.</span>\r\n<template class=\"st\">SELECT name, stock FROM products\r\nORDER BY </template>\r\n<template class=\"ref\">SELECT name, stock FROM products ORDER BY stock</template></div>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 2.</b> Get <code>name</code>, <code>price</code> of products in the <code>'Đồ uống'</code> category, sorted by <code>price</code> <b>descending</b>.</span>\r\n<template class=\"st\">SELECT name, price FROM products\r\nWHERE \r\nORDER BY </template>\r\n<template class=\"ref\">SELECT name, price FROM products WHERE category = 'Đồ uống' ORDER BY price DESC</template></div>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 3.</b> Get <code>name</code>, <code>price</code> of the <b>3 cheapest products NOT in the <code>'Điện tử'</code> category</b>.</span>\r\n<template class=\"st\">SELECT name, price FROM products\r\nWHERE \r\nORDER BY </template>\r\n<template class=\"ref\">SELECT name, price FROM products WHERE category <> 'Điện tử' ORDER BY price ASC LIMIT 3</template></div>\r\n<div class=\"ex homework stretch\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 4. 🔥 Stretch.</b> Get <code>name</code>, <code>city</code> of every customer, sorted by <code>city</code> then by <code>name</code> (both ascending).</span>\r\n<template class=\"st\">SELECT name, city FROM customers\r\nORDER BY </template>\r\n<template class=\"ref\">SELECT name, city FROM customers ORDER BY city, name</template></div>"}},{"t":{"vi":"Tính toán trong SELECT & AS","en":"Calculations in SELECT & AS"},"html":{"vi":"<h3>Bài 4 — Tính toán trong SELECT & đặt tên với AS</h3>\r\n<p>Cho tới giờ <code>SELECT</code> chỉ <i>lấy ra</i> những giá trị có sẵn. Nhưng SQL còn <b>tính toán</b> được: nhân giá với số lượng để ra doanh thu, cộng thuế VAT, giảm giá 10%, ghép chữ lại thành một nhãn dễ đọc. Bạn không cần export sang Excel — làm ngay trong truy vấn.</p>\r\n<p>Khi bạn viết một biểu thức trong <code>SELECT</code>, kết quả là một <b>cột mới</b> được tính cho từng dòng. Mặc định cột đó có cái tên xấu xí (chính là biểu thức bạn viết), nên ta dùng <code>AS</code> để <b>đặt tên</b> gọn gàng cho nó.</p>\r\n<p>Bài này giới thiệu bốn công cụ: phép tính số học, ghép chuỗi <code>||</code>, làm tròn <code>ROUND</code>, và bí danh <code>AS</code>. Chúng biến những cột thô thành thông tin có ý nghĩa.</p>\r\n\r\n<h4>1. Phép tính số học</h4>\r\n<p>Bạn có <code>+ - * /</code> ngay trong <code>SELECT</code>. SQL tính cho từng dòng:</p>\r\n<pre class=\"run\">SELECT name, price * stock\r\nFROM products;</pre>\r\n<p>Để cột kết quả có tên đẹp, thêm <code>AS tên_cột</code>:</p>\r\n<pre class=\"run\">SELECT name, price * stock AS inventory_value\r\nFROM products;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 1.</b> Với mỗi sản phẩm, hiển thị <code>name</code> và giá trị tồn kho <code>price * stock</code>, đặt tên cột là <code>inventory_value</code>.</span>\r\n<template class=\"st\">SELECT name, price * stock AS \r\nFROM products</template>\r\n<template class=\"ref\">SELECT name, price * stock AS inventory_value FROM products</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 2.</b> Hiển thị <code>name</code> và <b>gấp đôi giá</b> (<code>price * 2</code>), đặt tên cột là <code>double_price</code>.</span>\r\n<template class=\"st\">SELECT name, \r\nFROM products</template>\r\n<template class=\"ref\">SELECT name, price * 2 AS double_price FROM products</template></div>\r\n\r\n<h4>2. AS — đặt tên cho cột</h4>\r\n<p><code>AS</code> không chỉ dùng cho biểu thức — bạn có thể đổi tên cả cột có sẵn để báo cáo dễ đọc hơn.</p>\r\n<pre class=\"run\">SELECT name AS product_name, price AS vnd\r\nFROM products;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 3.</b> Hiển thị <code>name</code> đổi tên thành <code>product_name</code> và <code>price</code> đổi tên thành <code>vnd</code>.</span>\r\n<template class=\"st\">SELECT name AS product_name, \r\nFROM products</template>\r\n<template class=\"ref\">SELECT name AS product_name, price AS vnd FROM products</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 4.</b> Hiển thị <code>name</code> và giá sau khi <b>giảm phẳng 3000₫</b> (<code>price - 3000</code>), đặt tên cột là <code>discounted</code>.</span>\r\n<template class=\"st\">SELECT name, \r\nFROM products</template>\r\n<template class=\"ref\">SELECT name, price - 3000 AS discounted FROM products</template></div>\r\n\r\n<h4>3. Ghép chuỗi với ||</h4>\r\n<p>Toán tử <code>||</code> nối các chuỗi lại. Chèn thêm ký tự tĩnh (đặt trong dấu nháy) để tạo nhãn dễ đọc.</p>\r\n<pre class=\"run\">SELECT name || ' (' || category || ')' AS label\r\nFROM products;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 5.</b> Tạo cột <code>label</code> có dạng <code>name (category)</code> — ví dụ <code>Cà phê đen đá (Đồ uống)</code>. Dùng đúng mẫu <code>name || ' (' || category || ')'</code>.</span>\r\n<template class=\"st\">SELECT \r\nFROM products</template>\r\n<template class=\"ref\">SELECT name || ' (' || category || ')' AS label FROM products</template></div>\r\n\r\n<h4>4. Làm tròn với ROUND</h4>\r\n<p>Phép nhân với số thập phân (như giảm giá, thuế) cho ra số lẻ. <code>ROUND(biểu_thức)</code> làm tròn về số nguyên gần nhất.</p>\r\n<pre class=\"run\">SELECT name, ROUND(price * 0.9) AS sale_price\r\nFROM products;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 6.</b> Hiển thị <code>name</code> và giá sau khi <b>giảm 10%</b>: <code>ROUND(price * 0.9)</code>, đặt tên cột là <code>sale_price</code>.</span>\r\n<template class=\"st\">SELECT name, \r\nFROM products</template>\r\n<template class=\"ref\">SELECT name, ROUND(price * 0.9) AS sale_price FROM products</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 7.</b> Hiển thị <code>name</code> và giá đã <b>cộng 10% VAT</b>: <code>ROUND(price * 1.1)</code>, đặt tên cột là <code>price_with_vat</code>.</span>\r\n<template class=\"st\">SELECT name, \r\nFROM products</template>\r\n<template class=\"ref\">SELECT name, ROUND(price * 1.1) AS price_with_vat FROM products</template></div>\r\n\r\n<h4>5. Tính toán kết hợp với WHERE</h4>\r\n<p>Bạn có thể vừa lọc vừa tính. (Lưu ý: <code>WHERE</code> không dùng được bí danh <code>AS</code> — phải viết lại biểu thức đầy đủ trong <code>WHERE</code>.)</p>\r\n<pre class=\"run\">SELECT name, ROUND(price * 0.8) AS sale_price\r\nFROM products\r\nWHERE category = 'Đồ uống';</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 8.</b> Chỉ với nhóm <code>'Đồ uống'</code>: hiển thị <code>name</code> và giá <b>giảm 20%</b> (<code>ROUND(price * 0.8)</code>), đặt tên cột <code>sale_price</code>.</span>\r\n<template class=\"st\">SELECT name, ROUND(price * 0.8) AS sale_price\r\nFROM products\r\nWHERE </template>\r\n<template class=\"ref\">SELECT name, ROUND(price * 0.8) AS sale_price FROM products WHERE category = 'Đồ uống'</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 9.</b> Chỉ những sản phẩm có <b>giá trị tồn kho từ 1.000.000 trở lên</b>: hiển thị <code>name</code> và <code>price * stock AS inventory_value</code>. Nhớ dùng biểu thức <code>price * stock</code> trong <code>WHERE</code>.</span>\r\n<template class=\"st\">SELECT name, price * stock AS inventory_value\r\nFROM products\r\nWHERE </template>\r\n<template class=\"ref\">SELECT name, price * stock AS inventory_value FROM products WHERE price * stock >= 1000000</template></div>\r\n\r\n<h4>6. Sắp xếp theo giá trị đã tính</h4>\r\n<p><code>ORDER BY</code> cũng dùng được với biểu thức tính toán — rất hợp để tìm \"top\" theo một chỉ số bạn tự tạo.</p>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 10.</b> Lấy <b>3 sản phẩm có giá trị tồn kho lớn nhất</b>: hiển thị <code>name</code> và <code>price * stock AS inventory_value</code>, sắp theo giá trị đó <b>giảm dần</b>; nếu bằng nhau thì sắp theo <code>name</code>. Gợi ý: <code>ORDER BY price * stock DESC, name LIMIT 3</code>.</span>\r\n<template class=\"st\">SELECT name, price * stock AS inventory_value\r\nFROM products\r\nORDER BY </template>\r\n<template class=\"ref\">SELECT name, price * stock AS inventory_value FROM products ORDER BY price * stock DESC, name LIMIT 3</template></div>\r\n<div class=\"ex stretch\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 11. 🔥 Nâng cao.</b> Chỉ với nhóm <code>'Điện tử'</code>: hiển thị <code>name</code>, <code>price</code>, và giá <b>giảm 15%</b> <code>ROUND(price * 0.85) AS sale_price</code>, sắp theo <code>price</code> giảm dần.</span>\r\n<template class=\"st\">SELECT name, price, ROUND(price * 0.85) AS sale_price\r\nFROM products\r\nWHERE \r\nORDER BY </template>\r\n<template class=\"ref\">SELECT name, price, ROUND(price * 0.85) AS sale_price FROM products WHERE category = 'Điện tử' ORDER BY price DESC</template></div>\r\n\r\n<h4>🏠 Homework</h4>\r\n<p>Bốn bài làm ở nhà, tự động chấm ngay trên trang. Bài cuối là bài nâng cao.</p>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 1.</b> Hiển thị <code>name</code> và <b>giá tính theo nghìn đồng</b> <code>price / 1000</code>, đặt tên cột là <code>price_k</code>. (Vì cả hai là số nguyên, đây là phép chia lấy phần nguyên.)</span>\r\n<template class=\"st\">SELECT name, \r\nFROM products</template>\r\n<template class=\"ref\">SELECT name, price / 1000 AS price_k FROM products</template></div>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 2.</b> Từ bảng <code>customers</code>, tạo cột <code>who</code> dạng <code>name, city</code> — ví dụ <code>Nguyễn Văn A, Hà Nội</code>. Dùng mẫu <code>name || ', ' || city</code>.</span>\r\n<template class=\"st\">SELECT \r\nFROM customers</template>\r\n<template class=\"ref\">SELECT name || ', ' || city AS who FROM customers</template></div>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 3.</b> Hiển thị <code>name</code> và giá cộng <b>8% VAT</b>: <code>ROUND(price * 1.08)</code>, đặt tên cột là <code>price_vat8</code>.</span>\r\n<template class=\"st\">SELECT name, \r\nFROM products</template>\r\n<template class=\"ref\">SELECT name, ROUND(price * 1.08) AS price_vat8 FROM products</template></div>\r\n<div class=\"ex homework stretch\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 4. 🔥 Nâng cao.</b> Chỉ với nhóm <code>'Văn phòng phẩm'</code>: hiển thị <code>name</code> và <code>price * stock AS inventory_value</code>, sắp theo giá trị đó <b>giảm dần</b>; nếu bằng nhau thì sắp theo <code>name</code>.</span>\r\n<template class=\"st\">SELECT name, price * stock AS inventory_value\r\nFROM products\r\nWHERE \r\nORDER BY </template>\r\n<template class=\"ref\">SELECT name, price * stock AS inventory_value FROM products WHERE category = 'Văn phòng phẩm' ORDER BY price * stock DESC, name</template></div>","en":"<h3>Lesson 4 — Calculations in SELECT & naming with AS</h3>\r\n<p>So far <code>SELECT</code> only <i>pulls out</i> values that already exist. But SQL can also <b>calculate</b>: multiply price by quantity for revenue, add VAT, take 10% off, glue text together into a readable label. No need to export to Excel — do it right in the query.</p>\r\n<p>When you write an expression in <code>SELECT</code>, the result is a <b>new column</b> computed for every row. By default that column gets an ugly name (the expression itself), so we use <code>AS</code> to give it a tidy <b>alias</b>.</p>\r\n<p>This lesson introduces four tools: arithmetic, string concatenation with <code>||</code>, rounding with <code>ROUND</code>, and the <code>AS</code> alias. Together they turn raw columns into meaningful information.</p>\r\n\r\n<h4>1. Arithmetic</h4>\r\n<p>You have <code>+ - * /</code> right inside <code>SELECT</code>. SQL computes it per row:</p>\r\n<pre class=\"run\">SELECT name, price * stock\r\nFROM products;</pre>\r\n<p>To give the result column a nice name, add <code>AS column_name</code>:</p>\r\n<pre class=\"run\">SELECT name, price * stock AS inventory_value\r\nFROM products;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 1.</b> For each product, show <code>name</code> and the stock value <code>price * stock</code>, naming the column <code>inventory_value</code>.</span>\r\n<template class=\"st\">SELECT name, price * stock AS \r\nFROM products</template>\r\n<template class=\"ref\">SELECT name, price * stock AS inventory_value FROM products</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 2.</b> Show <code>name</code> and <b>double the price</b> (<code>price * 2</code>), naming the column <code>double_price</code>.</span>\r\n<template class=\"st\">SELECT name, \r\nFROM products</template>\r\n<template class=\"ref\">SELECT name, price * 2 AS double_price FROM products</template></div>\r\n\r\n<h4>2. AS — naming columns</h4>\r\n<p><code>AS</code> isn't only for expressions — you can rename an existing column to make a report easier to read.</p>\r\n<pre class=\"run\">SELECT name AS product_name, price AS vnd\r\nFROM products;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 3.</b> Show <code>name</code> renamed to <code>product_name</code> and <code>price</code> renamed to <code>vnd</code>.</span>\r\n<template class=\"st\">SELECT name AS product_name, \r\nFROM products</template>\r\n<template class=\"ref\">SELECT name AS product_name, price AS vnd FROM products</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 4.</b> Show <code>name</code> and the price after a <b>flat 3000₫ discount</b> (<code>price - 3000</code>), naming the column <code>discounted</code>.</span>\r\n<template class=\"st\">SELECT name, \r\nFROM products</template>\r\n<template class=\"ref\">SELECT name, price - 3000 AS discounted FROM products</template></div>\r\n\r\n<h4>3. Joining text with ||</h4>\r\n<p>The <code>||</code> operator concatenates strings. Insert static characters (in quotes) to build a readable label.</p>\r\n<pre class=\"run\">SELECT name || ' (' || category || ')' AS label\r\nFROM products;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 5.</b> Build a <code>label</code> column in the form <code>name (category)</code> — e.g. <code>Cà phê đen đá (Đồ uống)</code>. Use exactly <code>name || ' (' || category || ')'</code>.</span>\r\n<template class=\"st\">SELECT \r\nFROM products</template>\r\n<template class=\"ref\">SELECT name || ' (' || category || ')' AS label FROM products</template></div>\r\n\r\n<h4>4. Rounding with ROUND</h4>\r\n<p>Multiplying by a decimal (discounts, tax) produces fractional numbers. <code>ROUND(expression)</code> rounds to the nearest whole number.</p>\r\n<pre class=\"run\">SELECT name, ROUND(price * 0.9) AS sale_price\r\nFROM products;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 6.</b> Show <code>name</code> and the price after a <b>10% discount</b>: <code>ROUND(price * 0.9)</code>, naming the column <code>sale_price</code>.</span>\r\n<template class=\"st\">SELECT name, \r\nFROM products</template>\r\n<template class=\"ref\">SELECT name, ROUND(price * 0.9) AS sale_price FROM products</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 7.</b> Show <code>name</code> and the price with <b>10% VAT added</b>: <code>ROUND(price * 1.1)</code>, naming the column <code>price_with_vat</code>.</span>\r\n<template class=\"st\">SELECT name, \r\nFROM products</template>\r\n<template class=\"ref\">SELECT name, ROUND(price * 1.1) AS price_with_vat FROM products</template></div>\r\n\r\n<h4>5. Calculations combined with WHERE</h4>\r\n<p>You can filter and calculate at once. (Note: <code>WHERE</code> cannot use an <code>AS</code> alias — you must repeat the full expression in <code>WHERE</code>.)</p>\r\n<pre class=\"run\">SELECT name, ROUND(price * 0.8) AS sale_price\r\nFROM products\r\nWHERE category = 'Đồ uống';</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 8.</b> For the <code>'Đồ uống'</code> category only: show <code>name</code> and the price at a <b>20% discount</b> (<code>ROUND(price * 0.8)</code>), naming the column <code>sale_price</code>.</span>\r\n<template class=\"st\">SELECT name, ROUND(price * 0.8) AS sale_price\r\nFROM products\r\nWHERE </template>\r\n<template class=\"ref\">SELECT name, ROUND(price * 0.8) AS sale_price FROM products WHERE category = 'Đồ uống'</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 9.</b> Only products with a <b>stock value of 1,000,000 or more</b>: show <code>name</code> and <code>price * stock AS inventory_value</code>. Use the expression <code>price * stock</code> in <code>WHERE</code>.</span>\r\n<template class=\"st\">SELECT name, price * stock AS inventory_value\r\nFROM products\r\nWHERE </template>\r\n<template class=\"ref\">SELECT name, price * stock AS inventory_value FROM products WHERE price * stock >= 1000000</template></div>\r\n\r\n<h4>6. Sorting by a calculated value</h4>\r\n<p><code>ORDER BY</code> also works on a computed expression — perfect for finding the \"top\" by a metric you invent.</p>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 10.</b> Get the <b>3 products with the highest stock value</b>: show <code>name</code> and <code>price * stock AS inventory_value</code>, sorted by that value <b>descending</b>; break ties by <code>name</code>. Hint: <code>ORDER BY price * stock DESC, name LIMIT 3</code>.</span>\r\n<template class=\"st\">SELECT name, price * stock AS inventory_value\r\nFROM products\r\nORDER BY </template>\r\n<template class=\"ref\">SELECT name, price * stock AS inventory_value FROM products ORDER BY price * stock DESC, name LIMIT 3</template></div>\r\n<div class=\"ex stretch\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 11. 🔥 Stretch.</b> For the <code>'Điện tử'</code> category only: show <code>name</code>, <code>price</code>, and the price at a <b>15% discount</b> <code>ROUND(price * 0.85) AS sale_price</code>, sorted by <code>price</code> descending.</span>\r\n<template class=\"st\">SELECT name, price, ROUND(price * 0.85) AS sale_price\r\nFROM products\r\nWHERE \r\nORDER BY </template>\r\n<template class=\"ref\">SELECT name, price, ROUND(price * 0.85) AS sale_price FROM products WHERE category = 'Điện tử' ORDER BY price DESC</template></div>\r\n\r\n<h4>🏠 Homework</h4>\r\n<p>Four take-home exercises, auto-graded right on the page. The last one is a stretch.</p>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 1.</b> Show <code>name</code> and the <b>price in thousands</b> <code>price / 1000</code>, naming the column <code>price_k</code>. (Since both are integers, this is integer division.)</span>\r\n<template class=\"st\">SELECT name, \r\nFROM products</template>\r\n<template class=\"ref\">SELECT name, price / 1000 AS price_k FROM products</template></div>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 2.</b> From <code>customers</code>, build a <code>who</code> column in the form <code>name, city</code> — e.g. <code>Nguyễn Văn A, Hà Nội</code>. Use <code>name || ', ' || city</code>.</span>\r\n<template class=\"st\">SELECT \r\nFROM customers</template>\r\n<template class=\"ref\">SELECT name || ', ' || city AS who FROM customers</template></div>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 3.</b> Show <code>name</code> and the price with <b>8% VAT</b> added: <code>ROUND(price * 1.08)</code>, naming the column <code>price_vat8</code>.</span>\r\n<template class=\"st\">SELECT name, \r\nFROM products</template>\r\n<template class=\"ref\">SELECT name, ROUND(price * 1.08) AS price_vat8 FROM products</template></div>\r\n<div class=\"ex homework stretch\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 4. 🔥 Stretch.</b> For the <code>'Văn phòng phẩm'</code> category only: show <code>name</code> and <code>price * stock AS inventory_value</code>, sorted by that value <b>descending</b>; break ties by <code>name</code>.</span>\r\n<template class=\"st\">SELECT name, price * stock AS inventory_value\r\nFROM products\r\nWHERE \r\nORDER BY </template>\r\n<template class=\"ref\">SELECT name, price * stock AS inventory_value FROM products WHERE category = 'Văn phòng phẩm' ORDER BY price * stock DESC, name</template></div>"}},{"t":{"vi":"Hàm gộp: COUNT, SUM, AVG, MIN, MAX","en":"Aggregates: COUNT, SUM, AVG, MIN, MAX"},"html":{"vi":"<h3>Bài 5 — Hàm tổng hợp: COUNT, SUM, AVG, MIN, MAX</h3>\r\n<p>Đến giờ mỗi truy vấn trả về <i>từng dòng</i>. Nhưng sếp hiếm khi hỏi \"liệt kê 10.000 đơn hàng\" — họ hỏi <b>một con số</b>: \"có <b>bao nhiêu</b> sản phẩm?\", \"<b>tổng</b> tồn kho là bao nhiêu?\", \"giá <b>trung bình</b>?\", \"món <b>đắt nhất</b> giá bao nhiêu?\".</p>\r\n<p>Đó là việc của <b>hàm tổng hợp</b> (aggregate function). Chúng \"gộp\" nhiều dòng thành <b>một giá trị duy nhất</b>: <code>COUNT</code> đếm, <code>SUM</code> cộng, <code>AVG</code> tính trung bình, <code>MIN</code>/<code>MAX</code> tìm nhỏ nhất/lớn nhất.</p>\r\n<p>Kết hợp với <code>WHERE</code>, bạn tính được con số cho đúng nhóm mình quan tâm. Đây là nền tảng của mọi báo cáo — và ở Bài 6 bạn sẽ học <code>GROUP BY</code> để tính các con số này cho <i>từng nhóm</i> cùng lúc.</p>\r\n\r\n<h4>1. COUNT — đếm số dòng</h4>\r\n<p><code>COUNT(*)</code> đếm số dòng khớp truy vấn. Luôn đặt tên cột bằng <code>AS</code> cho gọn.</p>\r\n<pre class=\"run\">SELECT COUNT(*) AS total\r\nFROM products;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 1.</b> Đếm tổng số sản phẩm trong bảng <code>products</code>, đặt tên cột là <code>total</code>.</span>\r\n<template class=\"st\">SELECT COUNT(*) AS total\r\nFROM </template>\r\n<template class=\"ref\">SELECT COUNT(*) AS total FROM products</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 2.</b> Đếm số sản phẩm thuộc nhóm <code>'Đồ uống'</code>, đặt tên cột là <code>n</code>.</span>\r\n<template class=\"st\">SELECT COUNT(*) AS n\r\nFROM products\r\nWHERE </template>\r\n<template class=\"ref\">SELECT COUNT(*) AS n FROM products WHERE category = 'Đồ uống'</template></div>\r\n\r\n<h4>2. Đếm giá trị khác nhau: COUNT(DISTINCT …)</h4>\r\n<p>Muốn biết có <b>bao nhiêu loại</b> khác nhau, dùng <code>COUNT(DISTINCT cột)</code> — nó bỏ qua các giá trị lặp.</p>\r\n<pre class=\"run\">SELECT COUNT(DISTINCT category) AS categories\r\nFROM products;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 3.</b> Đếm số <b>nhóm hàng khác nhau</b> (<code>category</code>) trong bảng <code>products</code>, đặt tên cột là <code>categories</code>.</span>\r\n<template class=\"st\">SELECT COUNT(DISTINCT category) AS categories\r\nFROM </template>\r\n<template class=\"ref\">SELECT COUNT(DISTINCT category) AS categories FROM products</template></div>\r\n\r\n<h4>3. SUM — cộng dồn</h4>\r\n<p><code>SUM(cột)</code> cộng tất cả giá trị của một cột số.</p>\r\n<pre class=\"run\">SELECT SUM(stock) AS total_stock\r\nFROM products;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 4.</b> Tính <b>tổng tồn kho</b> (<code>SUM(stock)</code>) của tất cả sản phẩm, đặt tên cột là <code>total_stock</code>.</span>\r\n<template class=\"st\">SELECT \r\nFROM products</template>\r\n<template class=\"ref\">SELECT SUM(stock) AS total_stock FROM products</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 5.</b> Tính <b>tổng giá</b> (<code>SUM(price)</code>) của các sản phẩm nhóm <code>'Điện tử'</code>, đặt tên cột là <code>total</code>.</span>\r\n<template class=\"st\">SELECT SUM(price) AS total\r\nFROM products\r\nWHERE </template>\r\n<template class=\"ref\">SELECT SUM(price) AS total FROM products WHERE category = 'Điện tử'</template></div>\r\n\r\n<h4>4. AVG — trung bình</h4>\r\n<p><code>AVG(cột)</code> tính trung bình cộng. Kết quả thường là số lẻ, nên hay bọc thêm <code>ROUND(…)</code>.</p>\r\n<pre class=\"run\">SELECT AVG(price) AS avg_price\r\nFROM products;\r\n\r\nSELECT ROUND(AVG(price)) AS avg_price\r\nFROM products\r\nWHERE category = 'Đồ uống';</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 6.</b> Tính <b>giá trung bình</b> (<code>AVG(price)</code>) của tất cả sản phẩm, đặt tên cột là <code>avg_price</code>.</span>\r\n<template class=\"st\">SELECT \r\nFROM products</template>\r\n<template class=\"ref\">SELECT AVG(price) AS avg_price FROM products</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 7.</b> Tính giá trung bình của nhóm <code>'Đồ uống'</code>, <b>làm tròn</b> bằng <code>ROUND(AVG(price))</code>, đặt tên cột là <code>avg_price</code>.</span>\r\n<template class=\"st\">SELECT ROUND(AVG(price)) AS avg_price\r\nFROM products\r\nWHERE </template>\r\n<template class=\"ref\">SELECT ROUND(AVG(price)) AS avg_price FROM products WHERE category = 'Đồ uống'</template></div>\r\n\r\n<h4>5. MIN và MAX</h4>\r\n<p><code>MIN</code> tìm giá trị nhỏ nhất, <code>MAX</code> tìm lớn nhất — dùng được cho cả số, chữ và ngày.</p>\r\n<pre class=\"run\">SELECT MIN(price) AS cheapest, MAX(price) AS most_expensive\r\nFROM products;</pre>\r
