\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 8.</b> Tìm <b>giá thấp nhất</b> trong bảng <code>products</code> (<code>MIN(price)</code>), đặt tên cột là <code>cheapest</code>.</span>\r\n<template class=\"st\">SELECT \r\nFROM products</template>\r\n<template class=\"ref\">SELECT MIN(price) AS cheapest FROM products</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 9.</b> Tìm <b>giá cao nhất</b> trong bảng <code>products</code> (<code>MAX(price)</code>), đặt tên cột là <code>most_expensive</code>.</span>\r\n<template class=\"st\">SELECT \r\nFROM products</template>\r\n<template class=\"ref\">SELECT MAX(price) AS most_expensive FROM products</template></div>\r\n\r\n<h4>6. Tổng hợp trên bảng khác</h4>\r\n<p>Hàm tổng hợp dùng cho bảng nào cũng được. Bảng <code>order_items</code> ghi số lượng bán ra ở cột <code>qty</code>.</p>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 10.</b> Tính <b>tổng số lượng đã bán</b> (<code>SUM(qty)</code>) trong bảng <code>order_items</code>, đặt tên cột là <code>total_qty</code>.</span>\r\n<template class=\"st\">SELECT \r\nFROM order_items</template>\r\n<template class=\"ref\">SELECT SUM(qty) AS total_qty FROM order_items</template></div>\r\n\r\n<h4>7. Nhiều số liệu trong một truy vấn</h4>\r\n<p>Bạn có thể đặt nhiều hàm tổng hợp cạnh nhau để có cả một \"bảng tóm tắt\" trong một dòng.</p>\r\n<div class=\"ex stretch\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 11. 🔥 Nâng cao.</b> Chỉ với nhóm <code>'Đồ uống'</code>, tạo một dòng tóm tắt gồm 4 cột: <code>COUNT(*) AS n</code>, <code>MIN(price) AS cheapest</code>, <code>MAX(price) AS most_expensive</code>, và <code>ROUND(AVG(price)) AS avg_price</code>.</span>\r\n<template class=\"st\">SELECT COUNT(*) AS n, MIN(price) AS cheapest, \r\nFROM products\r\nWHERE </template>\r\n<template class=\"ref\">SELECT COUNT(*) AS n, MIN(price) AS cheapest, MAX(price) AS most_expensive, ROUND(AVG(price)) AS avg_price FROM products WHERE category = 'Đồ uống'</template></div>\r\n\r\n<h4>🏠 Homework</h4>\r\n<p>Bốn bài làm ở nhà, tự động chấm ngay trên trang. Bài cuối là bài nâng cao.</p>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 1.</b> Đếm tổng số khách hàng trong bảng <code>customers</code>, đặt tên cột là <code>total</code>.</span>\r\n<template class=\"st\">SELECT \r\nFROM customers</template>\r\n<template class=\"ref\">SELECT COUNT(*) AS total FROM customers</template></div>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 2.</b> Tính tổng tồn kho (<code>SUM(stock)</code>) của nhóm <code>'Văn phòng phẩm'</code>, đặt tên cột là <code>total_stock</code>.</span>\r\n<template class=\"st\">SELECT SUM(stock) AS total_stock\r\nFROM products\r\nWHERE </template>\r\n<template class=\"ref\">SELECT SUM(stock) AS total_stock FROM products WHERE category = 'Văn phòng phẩm'</template></div>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 3.</b> Tìm giá cao nhất (<code>MAX(price)</code>) trong nhóm <code>'Đồ ăn'</code>, đặt tên cột là <code>most_expensive</code>.</span>\r\n<template class=\"st\">SELECT MAX(price) AS most_expensive\r\nFROM products\r\nWHERE </template>\r\n<template class=\"ref\">SELECT MAX(price) AS most_expensive FROM products WHERE category = 'Đồ ăn'</template></div>\r\n<div class=\"ex homework stretch\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 4. 🔥 Nâng cao.</b> Từ bảng <code>order_items</code>, tạo một dòng tóm tắt gồm 3 cột: <code>COUNT(*) AS lines</code> (số dòng đơn), <code>SUM(qty) AS total_qty</code> (tổng số lượng), và <code>MAX(qty) AS biggest_line</code> (dòng có số lượng lớn nhất).</span>\r\n<template class=\"st\">SELECT COUNT(*) AS lines, \r\nFROM order_items</template>\r\n<template class=\"ref\">SELECT COUNT(*) AS lines, SUM(qty) AS total_qty, MAX(qty) AS biggest_line FROM order_items</template></div>","en":"<h3>Lesson 5 — Aggregates: COUNT, SUM, AVG, MIN, MAX</h3>\r\n<p>Every query so far returned <i>individual rows</i>. But a manager rarely asks \"list all 10,000 orders\" — they ask for <b>one number</b>: \"<b>how many</b> products do we have?\", \"what's the <b>total</b> stock?\", \"the <b>average</b> price?\", \"how much does the <b>most expensive</b> item cost?\".</p>\r\n<p>That's the job of <b>aggregate functions</b>. They collapse many rows into a <b>single value</b>: <code>COUNT</code> counts, <code>SUM</code> adds, <code>AVG</code> averages, <code>MIN</code>/<code>MAX</code> find the smallest/largest.</p>\r\n<p>Combined with <code>WHERE</code>, you compute a number for exactly the group you care about. This is the foundation of every report — and in Lesson 6 you'll learn <code>GROUP BY</code> to compute these numbers for <i>each group</i> at once.</p>\r\n\r\n<h4>1. COUNT — count rows</h4>\r\n<p><code>COUNT(*)</code> counts the rows that match the query. Always name the column with <code>AS</code>.</p>\r\n<pre class=\"run\">SELECT COUNT(*) AS total\r\nFROM products;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 1.</b> Count the total number of products in <code>products</code>, naming the column <code>total</code>.</span>\r\n<template class=\"st\">SELECT COUNT(*) AS total\r\nFROM </template>\r\n<template class=\"ref\">SELECT COUNT(*) AS total FROM products</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 2.</b> Count the products in the <code>'Đồ uống'</code> category, naming the column <code>n</code>.</span>\r\n<template class=\"st\">SELECT COUNT(*) AS n\r\nFROM products\r\nWHERE </template>\r\n<template class=\"ref\">SELECT COUNT(*) AS n FROM products WHERE category = 'Đồ uống'</template></div>\r\n\r\n<h4>2. Counting distinct values: COUNT(DISTINCT …)</h4>\r\n<p>To find out <b>how many different</b> values exist, use <code>COUNT(DISTINCT column)</code> — it ignores duplicates.</p>\r\n<pre class=\"run\">SELECT COUNT(DISTINCT category) AS categories\r\nFROM products;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 3.</b> Count the number of <b>distinct categories</b> (<code>category</code>) in <code>products</code>, naming the column <code>categories</code>.</span>\r\n<template class=\"st\">SELECT COUNT(DISTINCT category) AS categories\r\nFROM </template>\r\n<template class=\"ref\">SELECT COUNT(DISTINCT category) AS categories FROM products</template></div>\r\n\r\n<h4>3. SUM — add it all up</h4>\r\n<p><code>SUM(column)</code> adds every value in a numeric column.</p>\r\n<pre class=\"run\">SELECT SUM(stock) AS total_stock\r\nFROM products;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 4.</b> Compute the <b>total stock</b> (<code>SUM(stock)</code>) across all products, naming the column <code>total_stock</code>.</span>\r\n<template class=\"st\">SELECT \r\nFROM products</template>\r\n<template class=\"ref\">SELECT SUM(stock) AS total_stock FROM products</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 5.</b> Compute the <b>total price</b> (<code>SUM(price)</code>) of products in the <code>'Điện tử'</code> category, naming the column <code>total</code>.</span>\r\n<template class=\"st\">SELECT SUM(price) AS total\r\nFROM products\r\nWHERE </template>\r\n<template class=\"ref\">SELECT SUM(price) AS total FROM products WHERE category = 'Điện tử'</template></div>\r\n\r\n<h4>4. AVG — the average</h4>\r\n<p><code>AVG(column)</code> computes the mean. The result is usually fractional, so it's common to wrap it in <code>ROUND(…)</code>.</p>\r\n<pre class=\"run\">SELECT AVG(price) AS avg_price\r\nFROM products;\r\n\r\nSELECT ROUND(AVG(price)) AS avg_price\r\nFROM products\r\nWHERE category = 'Đồ uống';</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 6.</b> Compute the <b>average price</b> (<code>AVG(price)</code>) of all products, naming the column <code>avg_price</code>.</span>\r\n<template class=\"st\">SELECT \r\nFROM products</template>\r\n<template class=\"ref\">SELECT AVG(price) AS avg_price FROM products</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 7.</b> Compute the average price of the <code>'Đồ uống'</code> category, <b>rounded</b> with <code>ROUND(AVG(price))</code>, naming the column <code>avg_price</code>.</span>\r\n<template class=\"st\">SELECT ROUND(AVG(price)) AS avg_price\r\nFROM products\r\nWHERE </template>\r\n<template class=\"ref\">SELECT ROUND(AVG(price)) AS avg_price FROM products WHERE category = 'Đồ uống'</template></div>\r\n\r\n<h4>5. MIN and MAX</h4>\r\n<p><code>MIN</code> finds the smallest value, <code>MAX</code> the largest — they work on numbers, text, and dates.</p>\r\n<pre class=\"run\">SELECT MIN(price) AS cheapest, MAX(price) AS most_expensive\r\nFROM products;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 8.</b> Find the <b>lowest price</b> in <code>products</code> (<code>MIN(price)</code>), naming the column <code>cheapest</code>.</span>\r\n<template class=\"st\">SELECT \r\nFROM products</template>\r\n<template class=\"ref\">SELECT MIN(price) AS cheapest FROM products</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 9.</b> Find the <b>highest price</b> in <code>products</code> (<code>MAX(price)</code>), naming the column <code>most_expensive</code>.</span>\r\n<template class=\"st\">SELECT \r\nFROM products</template>\r\n<template class=\"ref\">SELECT MAX(price) AS most_expensive FROM products</template></div>\r\n\r\n<h4>6. Aggregating another table</h4>\r\n<p>Aggregates work on any table. The <code>order_items</code> table records quantities sold in the <code>qty</code> column.</p>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 10.</b> Compute the <b>total quantity sold</b> (<code>SUM(qty)</code>) in <code>order_items</code>, naming the column <code>total_qty</code>.</span>\r\n<template class=\"st\">SELECT \r\nFROM order_items</template>\r\n<template class=\"ref\">SELECT SUM(qty) AS total_qty FROM order_items</template></div>\r\n\r\n<h4>7. Several numbers in one query</h4>\r\n<p>You can place multiple aggregates side by side to get a whole \"summary row\" at once.</p>\r\n<div class=\"ex stretch\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 11. 🔥 Stretch.</b> For the <code>'Đồ uống'</code> category only, build a one-row summary with 4 columns: <code>COUNT(*) AS n</code>, <code>MIN(price) AS cheapest</code>, <code>MAX(price) AS most_expensive</code>, and <code>ROUND(AVG(price)) AS avg_price</code>.</span>\r\n<template class=\"st\">SELECT COUNT(*) AS n, MIN(price) AS cheapest, \r\nFROM products\r\nWHERE </template>\r\n<template class=\"ref\">SELECT COUNT(*) AS n, MIN(price) AS cheapest, MAX(price) AS most_expensive, ROUND(AVG(price)) AS avg_price FROM products WHERE category = 'Đồ uống'</template></div>\r\n\r\n<h4>🏠 Homework</h4>\r\n<p>Four take-home exercises, auto-graded right on the page. The last one is a stretch.</p>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 1.</b> Count the total number of customers in <code>customers</code>, naming the column <code>total</code>.</span>\r\n<template class=\"st\">SELECT \r\nFROM customers</template>\r\n<template class=\"ref\">SELECT COUNT(*) AS total FROM customers</template></div>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 2.</b> Compute the total stock (<code>SUM(stock)</code>) of the <code>'Văn phòng phẩm'</code> category, naming the column <code>total_stock</code>.</span>\r\n<template class=\"st\">SELECT SUM(stock) AS total_stock\r\nFROM products\r\nWHERE </template>\r\n<template class=\"ref\">SELECT SUM(stock) AS total_stock FROM products WHERE category = 'Văn phòng phẩm'</template></div>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 3.</b> Find the highest price (<code>MAX(price)</code>) in the <code>'Đồ ăn'</code> category, naming the column <code>most_expensive</code>.</span>\r\n<template class=\"st\">SELECT MAX(price) AS most_expensive\r\nFROM products\r\nWHERE </template>\r\n<template class=\"ref\">SELECT MAX(price) AS most_expensive FROM products WHERE category = 'Đồ ăn'</template></div>\r\n<div class=\"ex homework stretch\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 4. 🔥 Stretch.</b> From <code>order_items</code>, build a one-row summary with 3 columns: <code>COUNT(*) AS lines</code> (number of order lines), <code>SUM(qty) AS total_qty</code> (total quantity), and <code>MAX(qty) AS biggest_line</code> (the largest single line).</span>\r\n<template class=\"st\">SELECT COUNT(*) AS lines, \r\nFROM order_items</template>\r\n<template class=\"ref\">SELECT COUNT(*) AS lines, SUM(qty) AS total_qty, MAX(qty) AS biggest_line FROM order_items</template></div>"}},{"t":{"vi":"GROUP BY & HAVING — báo cáo theo nhóm","en":"GROUP BY & HAVING — grouped reports"},"html":{"vi":"<h3>Bài 6 — GROUP BY & HAVING: báo cáo theo nhóm</h3>\r\n<p>Ở Bài 5 bạn tính được <i>một</i> con số cho cả bảng: tổng tồn kho, giá trung bình… Nhưng báo cáo thật luôn hỏi theo <b>nhóm</b>: \"doanh thu <b>từng danh mục</b>?\", \"số đơn <b>của mỗi khách</b>?\", \"đã bán bao nhiêu <b>mỗi sản phẩm</b>?\". Bạn không muốn chạy 4 truy vấn cho 4 danh mục — bạn muốn <b>một</b> truy vấn trả về một dòng cho mỗi nhóm.</p>\r\n<p>Đó chính là <code>GROUP BY</code>. Nó chia các dòng thành nhóm theo giá trị một cột, rồi <b>áp dụng hàm tổng hợp cho từng nhóm</b>. Kết quả: mỗi nhóm một dòng, kèm con số bạn tính.</p>\r\n<p>Và khi muốn <b>lọc chính các nhóm</b> đó (ví dụ \"chỉ danh mục có hơn 2 sản phẩm\"), bạn dùng <code>HAVING</code> — giống <code>WHERE</code> nhưng dành cho kết quả sau khi gộp nhóm.</p>\r\n\r\n<h4>1. GROUP BY — một dòng cho mỗi nhóm</h4>\r\n<p>Quy tắc vàng: cột nào đứng sau <code>GROUP BY</code> thì được phép đưa vào <code>SELECT</code>; các cột còn lại phải nằm trong hàm tổng hợp.</p>\r\n<pre class=\"run\">SELECT category, COUNT(*) AS n\r\nFROM products\r\nGROUP BY category\r\nORDER BY category;</pre>\r\n<p>Kết quả: mỗi danh mục một dòng, kèm số sản phẩm trong danh mục đó. (Thêm <code>ORDER BY</code> để thứ tự luôn ổn định.)</p>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 1.</b> Đếm <b>số sản phẩm trong mỗi <code>category</code></b>: hiển thị <code>category</code> và <code>COUNT(*) AS n</code>, gom nhóm theo <code>category</code>, sắp theo <code>category</code>.</span>\r\n<template class=\"st\">SELECT category, COUNT(*) AS n\r\nFROM products\r\nGROUP BY \r\nORDER BY category</template>\r\n<template class=\"ref\">SELECT category, COUNT(*) AS n FROM products GROUP BY category ORDER BY category</template></div>\r\n\r\n<h4>2. SUM và AVG theo nhóm</h4>\r\n<p>Đổi <code>COUNT</code> thành <code>SUM</code> hay <code>AVG</code> để có tổng/trung bình cho từng nhóm.</p>\r\n<pre class=\"run\">SELECT category, SUM(stock) AS total_stock\r\nFROM products\r\nGROUP BY category\r\nORDER BY category;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 2.</b> Tính <b>tổng tồn kho mỗi danh mục</b>: <code>category</code>, <code>SUM(stock) AS total_stock</code>, gom theo <code>category</code>, sắp theo <code>category</code>.</span>\r\n<template class=\"st\">SELECT category, SUM(stock) AS total_stock\r\nFROM products\r\nGROUP BY \r\nORDER BY category</template>\r\n<template class=\"ref\">SELECT category, SUM(stock) AS total_stock FROM products GROUP BY category ORDER BY category</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 3.</b> Tính <b>giá trung bình mỗi danh mục</b>, làm tròn: <code>category</code>, <code>ROUND(AVG(price)) AS avg_price</code>, gom theo <code>category</code>, sắp theo <code>category</code>.</span>\r\n<template class=\"st\">SELECT category, ROUND(AVG(price)) AS avg_price\r\nFROM products\r\nGROUP BY \r\nORDER BY category</template>\r\n<template class=\"ref\">SELECT category, ROUND(AVG(price)) AS avg_price FROM products GROUP BY category ORDER BY category</template></div>\r\n\r\n<h4>3. Nhiều số liệu cho mỗi nhóm</h4>\r\n<p>Bạn có thể đặt nhiều hàm tổng hợp cùng lúc — mỗi nhóm ra một \"hàng tóm tắt\".</p>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 4.</b> Với mỗi <code>category</code>, hiển thị <code>MIN(price) AS cheapest</code> và <code>MAX(price) AS most_expensive</code>. Gom theo <code>category</code>, sắp theo <code>category</code>.</span>\r\n<template class=\"st\">SELECT category, MIN(price) AS cheapest, MAX(price) AS most_expensive\r\nFROM products\r\nGROUP BY \r\nORDER BY category</template>\r\n<template class=\"ref\">SELECT category, MIN(price) AS cheapest, MAX(price) AS most_expensive FROM products GROUP BY category ORDER BY category</template></div>\r\n\r\n<h4>4. Sắp xếp theo con số vừa tính</h4>\r\n<p>Rất hay dùng: gộp nhóm rồi sắp theo chính con số tổng hợp để tìm nhóm \"nhiều nhất\".</p>\r\n<pre class=\"run\">SELECT category, COUNT(*) AS n\r\nFROM products\r\nGROUP BY category\r\nORDER BY n DESC, category;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 5.</b> Đếm số sản phẩm mỗi <code>category</code>, sắp theo số lượng <b>giảm dần</b>; nếu bằng nhau sắp theo <code>category</code>. (Gợi ý: <code>ORDER BY n DESC, category</code>.)</span>\r\n<template class=\"st\">SELECT category, COUNT(*) AS n\r\nFROM products\r\nGROUP BY category\r\nORDER BY </template>\r\n<template class=\"ref\">SELECT category, COUNT(*) AS n FROM products GROUP BY category ORDER BY n DESC, category</template></div>\r\n\r\n<h4>5. HAVING — lọc chính các nhóm</h4>\r\n<p><code>WHERE</code> lọc <i>dòng</i> trước khi gộp; <code>HAVING</code> lọc <i>nhóm</i> sau khi gộp. Vì vậy điều kiện dùng hàm tổng hợp (như <code>COUNT(*) &gt; 2</code>) phải đặt ở <code>HAVING</code>.</p>\r\n<pre class=\"run\">SELECT category, COUNT(*) AS n\r\nFROM products\r\nGROUP BY category\r\nHAVING COUNT(*) > 2\r\nORDER BY category;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 6.</b> Chỉ những <code>category</code> có <b>hơn 2 sản phẩm</b>: hiển thị <code>category</code>, <code>COUNT(*) AS n</code>. Dùng <code>HAVING COUNT(*) &gt; 2</code>, sắp theo <code>category</code>.</span>\r\n<template class=\"st\">SELECT category, COUNT(*) AS n\r\nFROM products\r\nGROUP BY category\r\nHAVING \r\nORDER BY category</template>\r\n<template class=\"ref\">SELECT category, COUNT(*) AS n FROM products GROUP BY category HAVING COUNT(*) > 2 ORDER BY category</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 7.</b> Chỉ những <code>category</code> có <b>tổng tồn kho từ 300 trở lên</b>: hiển thị <code>category</code>, <code>SUM(stock) AS total_stock</code>. Dùng <code>HAVING SUM(stock) &gt;= 300</code>, sắp theo <code>category</code>.</span>\r\n<template class=\"st\">SELECT category, SUM(stock) AS total_stock\r\nFROM products\r\nGROUP BY category\r\nHAVING \r\nORDER BY category</template>\r\n<template class=\"ref\">SELECT category, SUM(stock) AS total_stock FROM products GROUP BY category HAVING SUM(stock) >= 300 ORDER BY category</template></div>\r\n\r\n<h4>6. Gom nhóm trên các bảng khác</h4>\r\n<p><code>GROUP BY</code> tỏa sáng nhất với bảng chi tiết. Bảng <code>order_items</code> có nhiều dòng cho mỗi sản phẩm và mỗi đơn.</p>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 8.</b> Từ <code>order_items</code>, tính <b>tổng số lượng bán ra của mỗi sản phẩm</b>: <code>product_id</code>, <code>SUM(qty) AS total_qty</code>, gom theo <code>product_id</code>, sắp theo <code>product_id</code>.</span>\r\n<template class=\"st\">SELECT product_id, SUM(qty) AS total_qty\r\nFROM order_items\r\nGROUP BY \r\nORDER BY product_id</template>\r\n<template class=\"ref\">SELECT product_id, SUM(qty) AS total_qty FROM order_items GROUP BY product_id ORDER BY product_id</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 9.</b> Từ <code>orders</code>, đếm <b>số đơn của mỗi khách</b>: <code>customer_id</code>, <code>COUNT(*) AS order_count</code>, gom theo <code>customer_id</code>, sắp theo <code>customer_id</code>.</span>\r\n<template class=\"st\">SELECT customer_id, COUNT(*) AS order_count\r\nFROM orders\r\nGROUP BY \r\nORDER BY customer_id</template>\r\n<template class=\"ref\">SELECT customer_id, COUNT(*) AS order_count FROM orders GROUP BY customer_id ORDER BY customer_id</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 10.</b> Từ <code>order_items</code>, đếm <b>số dòng hàng trong mỗi đơn</b>: <code>order_id</code>, <code>COUNT(*) AS lines</code>, gom theo <code>order_id</code>, sắp theo <code>order_id</code>.</span>\r\n<template class=\"st\">SELECT order_id, COUNT(*) AS lines\r\nFROM order_items\r\nGROUP BY \r\nORDER BY order_id</template>\r\n<template class=\"ref\">SELECT order_id, COUNT(*) AS lines FROM order_items GROUP BY order_id ORDER BY order_id</template></div>\r\n\r\n<h4>7. Ghép GROUP BY + HAVING + ORDER BY</h4>\r\n<div class=\"ex stretch\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 11. 🔥 Nâng cao.</b> Chỉ những <code>category</code> có <b>giá trung bình từ 20000 trở lên</b>: hiển thị <code>category</code>, <code>COUNT(*) AS n</code>, <code>ROUND(AVG(price)) AS avg_price</code>. Dùng <code>HAVING AVG(price) &gt;= 20000</code>, sắp theo <code>avg_price</code> giảm dần.</span>\r\n<template class=\"st\">SELECT category, COUNT(*) AS n, ROUND(AVG(price)) AS avg_price\r\nFROM products\r\nGROUP BY category\r\nHAVING \r\nORDER BY </template>\r\n<template class=\"ref\">SELECT category, COUNT(*) AS n, ROUND(AVG(price)) AS avg_price FROM products GROUP BY category HAVING AVG(price) >= 20000 ORDER BY avg_price DESC</template></div>\r\n\r\n<h4>🏠 Homework</h4>\r\n<p>Bốn bài làm ở nhà, tự động chấm ngay trên trang. Bài cuối là bài nâng cao.</p>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 1.</b> Từ <code>customers</code>, đếm <b>số khách mỗi thành phố</b>: <code>city</code>, <code>COUNT(*) AS n</code>, gom theo <code>city</code>, sắp theo <code>city</code>.</span>\r\n<template class=\"st\">SELECT city, COUNT(*) AS n\r\nFROM customers\r\nGROUP BY \r\nORDER BY city</template>\r\n<template class=\"ref\">SELECT city, COUNT(*) AS n FROM customers GROUP BY city ORDER BY city</template></div>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 2.</b> Tính <b>tổng giá niêm yết mỗi danh mục</b>: <code>category</code>, <code>SUM(price) AS total_price</code>, gom theo <code>category</code>, sắp theo <code>total_price</code> <b>giảm dần</b>.</span>\r\n<template class=\"st\">SELECT category, SUM(price) AS total_price\r\nFROM products\r\nGROUP BY category\r\nORDER BY </template>\r\n<template class=\"ref\">SELECT category, SUM(price) AS total_price FROM products GROUP BY category ORDER BY total_price DESC</template></div>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 3.</b> Từ <code>order_items</code>, chỉ những sản phẩm <b>bán được từ 2 đơn vị trở lên</b>: <code>product_id</code>, <code>SUM(qty) AS total_qty</code>. Dùng <code>HAVING SUM(qty) &gt;= 2</code>, sắp theo <code>total_qty</code> giảm dần rồi <code>product_id</code>.</span>\r\n<template class=\"st\">SELECT product_id, SUM(qty) AS total_qty\r\nFROM order_items\r\nGROUP BY product_id\r\nHAVING \r\nORDER BY </template>\r\n<template class=\"ref\">SELECT product_id, SUM(qty) AS total_qty FROM order_items GROUP BY product_id HAVING SUM(qty) >= 2 ORDER BY total_qty DESC, product_id</template></div>\r\n<div class=\"ex homework stretch\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 4. 🔥 Nâng cao.</b> Chỉ những <code>category</code> có <b>sản phẩm đắt nhất trên 40000</b>: hiển thị <code>category</code>, <code>COUNT(*) AS n</code>, <code>MAX(price) AS most_expensive</code>. Dùng <code>HAVING MAX(price) &gt; 40000</code>, sắp theo <code>most_expensive</code> giảm dần.</span>\r\n<template class=\"st\">SELECT category, COUNT(*) AS n, MAX(price) AS most_expensive\r\nFROM products\r\nGROUP BY category\r\nHAVING \r\nORDER BY </template>\r\n<template class=\"ref\">SELECT category, COUNT(*) AS n, MAX(price) AS most_expensive FROM products GROUP BY category HAVING MAX(price) > 40000 ORDER BY most_expensive DESC</template></div>","en":"<h3>Lesson 6 — GROUP BY & HAVING: grouped reports</h3>\r\n<p>In Lesson 5 you computed <i>one</i> number for the whole table: total stock, average price… But real reports always ask <b>per group</b>: \"revenue <b>per category</b>?\", \"orders <b>per customer</b>?\", \"how many sold <b>per product</b>?\". You don't want to run 4 queries for 4 categories — you want <b>one</b> query that returns one row per group.</p>\r\n<p>That's <code>GROUP BY</code>. It splits rows into groups by a column's value, then <b>applies an aggregate function to each group</b>. The result: one row per group, with the number you computed.</p>\r\n<p>And when you want to <b>filter the groups themselves</b> (e.g. \"only categories with more than 2 products\"), you use <code>HAVING</code> — like <code>WHERE</code>, but for the results after grouping.</p>\r\n\r\n<h4>1. GROUP BY — one row per group</h4>\r\n<p>Golden rule: a column after <code>GROUP BY</code> may appear in <code>SELECT</code>; every other column must be inside an aggregate function.</p>\r\n<pre class=\"run\">SELECT category, COUNT(*) AS n\r\nFROM products\r\nGROUP BY category\r\nORDER BY category;</pre>\r\n<p>The result: one row per category with its product count. (Add <code>ORDER BY</code> so the order is always stable.)</p>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 1.</b> Count the <b>number of products in each <code>category</code></b>: show <code>category</code> and <code>COUNT(*) AS n</code>, grouped by <code>category</code>, sorted by <code>category</code>.</span>\r\n<template class=\"st\">SELECT category, COUNT(*) AS n\r\nFROM products\r\nGROUP BY \r\nORDER BY category</template>\r\n<template class=\"ref\">SELECT category, COUNT(*) AS n FROM products GROUP BY category ORDER BY category</template></div>\r\n\r\n<h4>2. SUM and AVG per group</h4>\r\n<p>Swap <code>COUNT</code> for <code>SUM</code> or <code>AVG</code> to get a total/average for each group.</p>\r\n<pre class=\"run\">SELECT category, SUM(stock) AS total_stock\r\nFROM products\r\nGROUP BY category\r\nORDER BY category;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 2.</b> Compute the <b>total stock per category</b>: <code>category</code>, <code>SUM(stock) AS total_stock</code>, grouped by <code>category</code>, sorted by <code>category</code>.</span>\r\n<template class=\"st\">SELECT category, SUM(stock) AS total_stock\r\nFROM products\r\nGROUP BY \r\nORDER BY category</template>\r\n<template class=\"ref\">SELECT category, SUM(stock) AS total_stock FROM products GROUP BY category ORDER BY category</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 3.</b> Compute the <b>average price per category</b>, rounded: <code>category</code>, <code>ROUND(AVG(price)) AS avg_price</code>, grouped by <code>category</code>, sorted by <code>category</code>.</span>\r\n<template class=\"st\">SELECT category, ROUND(AVG(price)) AS avg_price\r\nFROM products\r\nGROUP BY \r\nORDER BY category</template>\r\n<template class=\"ref\">SELECT category, ROUND(AVG(price)) AS avg_price FROM products GROUP BY category ORDER BY category</template></div>\r\n\r\n<h4>3. Several numbers per group</h4>\r\n<p>You can place multiple aggregates at once — each group gets a \"summary row\".</p>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 4.</b> For each <code>category</code>, show <code>MIN(price) AS cheapest</code> and <code>MAX(price) AS most_expensive</code>. Grouped by <code>category</code>, sorted by <code>category</code>.</span>\r\n<template class=\"st\">SELECT category, MIN(price) AS cheapest, MAX(price) AS most_expensive\r\nFROM products\r\nGROUP BY \r\nORDER BY category</template>\r\n<template class=\"ref\">SELECT category, MIN(price) AS cheapest, MAX(price) AS most_expensive FROM products GROUP BY category ORDER BY category</template></div>\r\n\r\n<h4>4. Sorting by the computed number</h4>\r\n<p>Very common: group, then sort by the aggregate itself to find the \"biggest\" group.</p>\r\n<pre class=\"run\">SELECT category, COUNT(*) AS n\r\nFROM products\r\nGROUP BY category\r\nORDER BY n DESC, category;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 5.</b> Count products per <code>category</code>, sorted by count <b>descending</b>; break ties by <code>category</code>. (Hint: <code>ORDER BY n DESC, category</code>.)</span>\r\n<template class=\"st\">SELECT category, COUNT(*) AS n\r\nFROM products\r\nGROUP BY category\r\nORDER BY </template>\r\n<template class=\"ref\">SELECT category, COUNT(*) AS n FROM products GROUP BY category ORDER BY n DESC, category</template></div>\r\n\r\n<h4>5. HAVING — filter the groups</h4>\r\n<p><code>WHERE</code> filters <i>rows</i> before grouping; <code>HAVING</code> filters <i>groups</i> after grouping. So a condition using an aggregate (like <code>COUNT(*) &gt; 2</code>) must go in <code>HAVING</code>.</p>\r\n<pre class=\"run\">SELECT category, COUNT(*) AS n\r\nFROM products\r\nGROUP BY category\r\nHAVING COUNT(*) > 2\r\nORDER BY category;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 6.</b> Only categories with <b>more than 2 products</b>: show <code>category</code>, <code>COUNT(*) AS n</code>. Use <code>HAVING COUNT(*) &gt; 2</code>, sorted by <code>category</code>.</span>\r\n<template class=\"st\">SELECT category, COUNT(*) AS n\r\nFROM products\r\nGROUP BY category\r\nHAVING \r\nORDER BY category</template>\r\n<template class=\"ref\">SELECT category, COUNT(*) AS n FROM products GROUP BY category HAVING COUNT(*) > 2 ORDER BY category</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 7.</b> Only categories with <b>total stock of 300 or more</b>: show <code>category</code>, <code>SUM(stock) AS total_stock</code>. Use <code>HAVING SUM(stock) &gt;= 300</code>, sorted by <code>category</code>.</span>\r\n<template class=\"st\">SELECT category, SUM(stock) AS total_stock\r\nFROM products\r\nGROUP BY category\r\nHAVING \r\nORDER BY category</template>\r\n<template class=\"ref\">SELECT category, SUM(stock) AS total_stock FROM products GROUP BY category HAVING SUM(stock) >= 300 ORDER BY category</template></div>\r\n\r\n<h4>6. Grouping other tables</h4>\r\n<p><code>GROUP BY</code> shines most on detail tables. The <code>order_items</code> table has many rows per product and per order.</p>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 8.</b> From <code>order_items</code>, compute the <b>total quantity sold per product</b>: <code>product_id</code>, <code>SUM(qty) AS total_qty</code>, grouped by <code>product_id</code>, sorted by <code>product_id</code>.</span>\r\n<template class=\"st\">SELECT product_id, SUM(qty) AS total_qty\r\nFROM order_items\r\nGROUP BY \r\nORDER BY product_id</template>\r\n<template class=\"ref\">SELECT product_id, SUM(qty) AS total_qty FROM order_items GROUP BY product_id ORDER BY product_id</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 9.</b> From <code>orders</code>, count the <b>number of orders per customer</b>: <code>customer_id</code>, <code>COUNT(*) AS order_count</code>, grouped by <code>customer_id</code>, sorted by <code>customer_id</code>.</span>\r\n<template class=\"st\">SELECT customer_id, COUNT(*) AS order_count\r\nFROM orders\r\nGROUP BY \r\nORDER BY customer_id</template>\r\n<template class=\"ref\">SELECT customer_id, COUNT(*) AS order_count FROM orders GROUP BY customer_id ORDER BY customer_id</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 10.</b> From <code>order_items</code>, count the <b>number of line items per order</b>: <code>order_id</code>, <code>COUNT(*) AS lines</code>, grouped by <code>order_id</code>, sorted by <code>order_id</code>.</span>\r\n<template class=\"st\">SELECT order_id, COUNT(*) AS lines\r\nFROM order_items\r\nGROUP BY \r\nORDER BY order_id</template>\r\n<template class=\"ref\">SELECT order_id, COUNT(*) AS lines FROM order_items GROUP BY order_id ORDER BY order_id</template></div>\r\n\r\n<h4>7. Combining GROUP BY + HAVING + ORDER BY</h4>\r\n<div class=\"ex stretch\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 11. 🔥 Stretch.</b> Only categories with an <b>average price of 20000 or more</b>: show <code>category</code>, <code>COUNT(*) AS n</code>, <code>ROUND(AVG(price)) AS avg_price</code>. Use <code>HAVING AVG(price) &gt;= 20000</code>, sorted by <code>avg_price</code> descending.</span>\r\n<template class=\"st\">SELECT category, COUNT(*) AS n, ROUND(AVG(price)) AS avg_price\r\nFROM products\r\nGROUP BY category\r\nHAVING \r\nORDER BY </template>\r\n<template class=\"ref\">SELECT category, COUNT(*) AS n, ROUND(AVG(price)) AS avg_price FROM products GROUP BY category HAVING AVG(price) >= 20000 ORDER BY avg_price DESC</template></div>\r\n\r\n<h4>🏠 Homework</h4>\r\n<p>Four take-home exercises, auto-graded right on the page. The last one is a stretch.</p>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 1.</b> From <code>customers</code>, count the <b>number of customers per city</b>: <code>city</code>, <code>COUNT(*) AS n</code>, grouped by <code>city</code>, sorted by <code>city</code>.</span>\r\n<template class=\"st\">SELECT city, COUNT(*) AS n\r\nFROM customers\r\nGROUP BY \r\nORDER BY city</template>\r\n<template class=\"ref\">SELECT city, COUNT(*) AS n FROM customers GROUP BY city ORDER BY city</template></div>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 2.</b> Compute the <b>total list price per category</b>: <code>category</code>, <code>SUM(price) AS total_price</code>, grouped by <code>category</code>, sorted by <code>total_price</code> <b>descending</b>.</span>\r\n<template class=\"st\">SELECT category, SUM(price) AS total_price\r\nFROM products\r\nGROUP BY category\r\nORDER BY </template>\r\n<template class=\"ref\">SELECT category, SUM(price) AS total_price FROM products GROUP BY category ORDER BY total_price DESC</template></div>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 3.</b> From <code>order_items</code>, only products that <b>sold 2 or more units</b>: <code>product_id</code>, <code>SUM(qty) AS total_qty</code>. Use <code>HAVING SUM(qty) &gt;= 2</code>, sorted by <code>total_qty</code> descending then <code>product_id</code>.</span>\r\n<template class=\"st\">SELECT product_id, SUM(qty) AS total_qty\r\nFROM order_items\r\nGROUP BY product_id\r\nHAVING \r\nORDER BY </template>\r\n<template class=\"ref\">SELECT product_id, SUM(qty) AS total_qty FROM order_items GROUP BY product_id HAVING SUM(qty) >= 2 ORDER BY total_qty DESC, product_id</template></div>\r\n<div class=\"ex homework stretch\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 4. 🔥 Stretch.</b> Only categories whose <b>most expensive product is above 40000</b>: show <code>category</code>, <code>COUNT(*) AS n</code>, <code>MAX(price) AS most_expensive</code>. Use <code>HAVING MAX(price) &gt; 40000</code>, sorted by <code>most_expensive</code> descending.</span>\r\n<template class=\"st\">SELECT category, COUNT(*) AS n, MAX(price) AS most_expensive\r\nFROM products\r\nGROUP BY category\r\nHAVING \r\nORDER BY </template>\r\n<template class=\"ref\">SELECT category, COUNT(*) AS n, MAX(price) AS most_expensive FROM products GROUP BY category HAVING MAX(price) > 40000 ORDER BY most_expensive DESC</template></div>"}},{"t":{"vi":"CASE WHEN & hàm xử lý (chữ, số, ngày)","en":"CASE WHEN & functions (text, number, date)"},"html":{"vi":"<h3>Bài 7 — CASE WHEN & hàm xử lý (chữ, số, ngày)</h3>\r\n<p>Dữ liệu thô không phải lúc nào cũng ở dạng bạn cần. Sếp không muốn thấy con số <code>350000</code> — họ muốn nhãn \"hàng cao cấp\". Cột <code>joined_at</code> là <code>'2024-01-10'</code> nhưng báo cáo chỉ cần <b>năm</b>. Đây là lúc dùng <code>CASE WHEN</code> và các <b>hàm</b> có sẵn của SQL để biến dữ liệu thô thành thông tin dễ đọc.</p>\r\n<p><code>CASE WHEN</code> là \"if/else\" của SQL: xét từng dòng, trả về giá trị tùy điều kiện. Ngoài ra SQL có sẵn hàm xử lý <b>chuỗi</b> (<code>LENGTH</code>, <code>SUBSTR</code>, <code>REPLACE</code>), <b>số</b> (<code>ROUND</code>), và <b>ngày tháng</b> (<code>strftime</code>).</p>\r\n<p>Mọi cột tạo ra ở đây đều nên có <code>AS</code> để đặt tên rõ ràng — như bạn đã quen từ Bài 4.</p>\r\n\r\n<h4>1. CASE WHEN — gán nhãn theo điều kiện</h4>\r\n<p>Cú pháp: <code>CASE WHEN điều_kiện THEN giá_trị ... ELSE giá_trị_mặc_định END</code>. SQL xét các nhánh <b>từ trên xuống</b>, dừng ở nhánh đầu tiên đúng.</p>\r\n<pre class=\"run\">SELECT name,\r\n  CASE WHEN price >= 100000 THEN 'high'\r\n       WHEN price >= 20000  THEN 'medium'\r\n       ELSE 'low' END AS tier\r\nFROM products;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 1.</b> Với mỗi sản phẩm, tạo cột <code>tier</code>: <code>'high'</code> nếu <code>price &gt;= 100000</code>, <code>'medium'</code> nếu <code>price &gt;= 20000</code>, còn lại <code>'low'</code>. Hiển thị <code>name</code> và <code>tier</code>.</span>\r\n<template class=\"st\">SELECT name,\r\n  CASE WHEN price >= 100000 THEN 'high'\r\n       WHEN price >= 20000 THEN 'medium'\r\n       ELSE 'low' END AS tier\r\nFROM products</template>\r\n<template class=\"ref\">SELECT name, CASE WHEN price >= 100000 THEN 'high' WHEN price >= 20000 THEN 'medium' ELSE 'low' END AS tier FROM products</template></div>\r\n\r\n<h4>2. CASE hai nhánh đơn giản</h4>\r\n<p>Chỉ cần một <code>WHEN</code> và một <code>ELSE</code> là đủ để chia hai loại.</p>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 2.</b> Tạo cột <code>stock_level</code>: <code>'plenty'</code> nếu <code>stock &gt;= 100</code>, còn lại <code>'low'</code>. Hiển thị <code>name</code> và <code>stock_level</code>.</span>\r\n<template class=\"st\">SELECT name,\r\n  CASE WHEN stock >= 100 THEN 'plenty' ELSE 'low' END AS stock_level\r\nFROM products</template>\r\n<template class=\"ref\">SELECT name, CASE WHEN stock >= 100 THEN 'plenty' ELSE 'low' END AS stock_level FROM products</template></div>\r\n\r\n<h4>3. CASE trả về số</h4>\r\n<p><code>CASE</code> không chỉ trả về chữ — nó trả về được cả số, nên rất hợp để tính giá trị có điều kiện.</p>\r\n<pre class=\"run\">SELECT name,\r\n  ROUND(CASE WHEN category = 'Điện tử' THEN price * 0.85\r\n             ELSE price * 0.95 END) AS final_price\r\nFROM products;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 3.</b> Tính <code>final_price</code>: hàng <code>'Điện tử'</code> giảm 15% (<code>price * 0.85</code>), còn lại giảm 5% (<code>price * 0.95</code>), rồi <code>ROUND</code>. Hiển thị <code>name</code> và <code>final_price</code>.</span>\r\n<template class=\"st\">SELECT name,\r\n  ROUND(CASE WHEN category = 'Điện tử' THEN price * 0.85 ELSE price * 0.95 END) AS final_price\r\nFROM products</template>\r\n<template class=\"ref\">SELECT name, ROUND(CASE WHEN category = 'Điện tử' THEN price * 0.85 ELSE price * 0.95 END) AS final_price FROM products</template></div>\r\n\r\n<h4>4. Hàm chuỗi: LENGTH, SUBSTR</h4>\r\n<p><code>LENGTH(chuỗi)</code> đếm số ký tự. <code>SUBSTR(chuỗi, bắt_đầu, độ_dài)</code> cắt một đoạn (vị trí đầu tiên là 1).</p>\r\n<pre class=\"run\">SELECT name, LENGTH(name) AS name_len\r\nFROM products;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 4.</b> Hiển thị <code>name</code> và <b>độ dài tên</b> <code>LENGTH(name) AS name_len</code>.</span>\r\n<template class=\"st\">SELECT name, \r\nFROM products</template>\r\n<template class=\"ref\">SELECT name, LENGTH(name) AS name_len FROM products</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 5.</b> Hiển thị <code>name</code> và <b>3 ký tự đầu</b> của tên: <code>SUBSTR(name, 1, 3) AS prefix</code>.</span>\r\n<template class=\"st\">SELECT name, \r\nFROM products</template>\r\n<template class=\"ref\">SELECT name, SUBSTR(name, 1, 3) AS prefix FROM products</template></div>\r\n\r\n<h4>5. Hàm chuỗi: REPLACE</h4>\r\n<p><code>REPLACE(chuỗi, tìm, thay)</code> thay mọi lần xuất hiện của một đoạn con.</p>\r\n<pre class=\"run\">SELECT name, REPLACE(city, 'TP. ', '') AS short_city\r\nFROM customers;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 6.</b> Từ <code>customers</code>, bỏ tiền tố <code>'TP. '</code> khỏi <code>city</code>: <code>REPLACE(city, 'TP. ', '') AS short_city</code>. Hiển thị <code>name</code> và <code>short_city</code>.</span>\r\n<template class=\"st\">SELECT name, \r\nFROM customers</template>\r\n<template class=\"ref\">SELECT name, REPLACE(city, 'TP. ', '') AS short_city FROM customers</template></div>\r\n\r\n<h4>6. Hàm ngày tháng</h4>\r\n<p>Ngày lưu dạng <code>'YYYY-MM-DD'</code>. Bạn có thể cắt bằng <code>SUBSTR</code>, hoặc dùng <code>strftime</code> để trích phần cần: <code>strftime('%Y', ngày)</code> lấy năm, <code>'%m'</code> lấy tháng.</p>\r\n<pre class=\"run\">SELECT name, SUBSTR(joined_at, 1, 4) AS year\r\nFROM customers;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 7.</b> Từ <code>customers</code>, lấy <b>năm gia nhập</b> bằng cách cắt 4 ký tự đầu: <code>SUBSTR(joined_at, 1, 4) AS year</code>. Hiển thị <code>name</code> và <code>year</code>.</span>\r\n<template class=\"st\">SELECT name, \r\nFROM customers</template>\r\n<template class=\"ref\">SELECT name, SUBSTR(joined_at, 1, 4) AS year FROM customers</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 8.</b> Từ <code>customers</code>, lấy <b>tháng gia nhập</b> (2 ký tự ở vị trí 6): <code>SUBSTR(joined_at, 6, 2) AS month</code>. Hiển thị <code>name</code> và <code>month</code>.</span>\r\n<template class=\"st\">SELECT name, \r\nFROM customers</template>\r\n<template class=\"ref\">SELECT name, SUBSTR(joined_at, 6, 2) AS month FROM customers</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 9.</b> Từ <code>orders</code>, lấy <b>năm đặt hàng</b> bằng <code>strftime('%Y', order_date) AS year</code>. Hiển thị <code>id</code> và <code>year</code>.</span>\r\n<template class=\"st\">SELECT id, \r\nFROM orders</template>\r\n<template class=\"ref\">SELECT id, strftime('%Y', order_date) AS year FROM orders</template></div>\r\n\r\n<h4>7. Hàm số: ROUND nhiều chữ số</h4>\r\n<p><code>ROUND(số, k)</code> làm tròn tới <code>k</code> chữ số thập phân.</p>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 10.</b> Hiển thị <code>name</code> và giá (đã cộng 10% VAT) tính theo <b>nghìn đồng, một chữ số thập phân</b>: <code>ROUND(price * 1.1 / 1000.0, 1) AS k_vat</code>.</span>\r\n<template class=\"st\">SELECT name, \r\nFROM products</template>\r\n<template class=\"ref\">SELECT name, ROUND(price * 1.1 / 1000.0, 1) AS k_vat FROM products</template></div>\r\n\r\n<h4>8. Ghép CASE với lọc và sắp xếp</h4>\r\n<div class=\"ex stretch\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 11. 🔥 Nâng cao.</b> Chỉ với nhóm <code>'Đồ uống'</code> và <code>'Đồ ăn'</code>: hiển thị <code>name</code>, <code>price</code>, và cột <code>tier</code> = <code>'premium'</code> nếu <code>price &gt;= 30000</code>, còn lại <code>'regular'</code>. Sắp theo <code>price</code> giảm dần.</span>\r\n<template class=\"st\">SELECT name, price,\r\n  CASE WHEN price >= 30000 THEN 'premium' ELSE 'regular' END AS tier\r\nFROM products\r\nWHERE category IN ('Đồ uống', 'Đồ ăn')\r\nORDER BY </template>\r\n<template class=\"ref\">SELECT name, price, CASE WHEN price >= 30000 THEN 'premium' ELSE 'regular' END AS tier FROM products WHERE category IN ('Đồ uống', 'Đồ ăn') ORDER BY price DESC</template></div>\r\n\r\n<h4>🏠 Homework</h4>\r\n<p>Bốn bài làm ở nhà, tự động chấm ngay trên trang. Bài cuối là bài nâng cao.</p>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 1.</b> Tạo cột <code>bucket</code>: <code>'expensive'</code> nếu <code>price &gt;= 50000</code>, còn lại <code>'affordable'</code>. Hiển thị <code>name</code> và <code>bucket</code>.</span>\r\n<template class=\"st\">SELECT name,\r\n  CASE WHEN price >= 50000 THEN 'expensive' ELSE 'affordable' END AS bucket\r\nFROM products</template>\r\n<template class=\"ref\">SELECT name, CASE WHEN price >= 50000 THEN 'expensive' ELSE 'affordable' END AS bucket FROM products</template></div>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 2.</b> Từ <code>customers</code>, hiển thị <code>name</code> và <b>độ dài tên thành phố</b>: <code>LENGTH(city) AS city_len</code>.</span>\r\n<template class=\"st\">SELECT name, \r\nFROM customers</template>\r\n<template class=\"ref\">SELECT name, LENGTH(city) AS city_len FROM customers</template></div>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 3.</b> Từ <code>customers</code>, lấy <b>năm gia nhập</b> bằng <code>strftime('%Y', joined_at) AS year</code>. Hiển thị <code>name</code> và <code>year</code>.</span>\r\n<template class=\"st\">SELECT name, \r\nFROM customers</template>\r\n<template class=\"ref\">SELECT name, strftime('%Y', joined_at) AS year FROM customers</template></div>\r\n<div class=\"ex homework stretch\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 4. 🔥 Nâng cao.</b> Tạo cột <code>kind</code>: <code>'tech'</code> nếu <code>category = 'Điện tử'</code>, còn lại <code>'non-tech'</code>. Hiển thị <code>name</code>, <code>category</code>, <code>kind</code>, sắp theo <code>kind</code> rồi <code>name</code>.</span>\r\n<template class=\"st\">SELECT name, category,\r\n  CASE WHEN category = 'Điện tử' THEN 'tech' ELSE 'non-tech' END AS kind\r\nFROM products\r\nORDER BY </template>\r\n<template class=\"ref\">SELECT name, category, CASE WHEN category = 'Điện tử' THEN 'tech' ELSE 'non-tech' END AS kind FROM products ORDER BY kind, name</template></div>","en":"<h3>Lesson 7 — CASE WHEN & functions (text, number, date)</h3>\r\n<p>Raw data isn't always in the shape you need. A manager doesn't want to see <code>350000</code> — they want the label \"premium\". The <code>joined_at</code> column is <code>'2024-01-10'</code> but a report only needs the <b>year</b>. This is where <code>CASE WHEN</code> and SQL's built-in <b>functions</b> turn raw data into readable information.</p>\r\n<p><code>CASE WHEN</code> is SQL's \"if/else\": it looks at each row and returns a value depending on a condition. SQL also ships with functions for <b>text</b> (<code>LENGTH</code>, <code>SUBSTR</code>, <code>REPLACE</code>), <b>numbers</b> (<code>ROUND</code>), and <b>dates</b> (<code>strftime</code>).</p>\r\n<p>Every column you create here should get an <code>AS</code> alias for a clear name — as you learned in Lesson 4.</p>\r\n\r\n<h4>1. CASE WHEN — labels by condition</h4>\r\n<p>Syntax: <code>CASE WHEN condition THEN value ... ELSE default END</code>. SQL checks the branches <b>top to bottom</b> and stops at the first true one.</p>\r\n<pre class=\"run\">SELECT name,\r\n  CASE WHEN price >= 100000 THEN 'high'\r\n       WHEN price >= 20000  THEN 'medium'\r\n       ELSE 'low' END AS tier\r\nFROM products;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 1.</b> For each product, build a <code>tier</code> column: <code>'high'</code> if <code>price &gt;= 100000</code>, <code>'medium'</code> if <code>price &gt;= 20000</code>, otherwise <code>'low'</code>. Show <code>name</code> and <code>tier</code>.</span>\r\n<template class=\"st\">SELECT name,\r\n  CASE WHEN price >= 100000 THEN 'high'\r\n       WHEN price >= 20000 THEN 'medium'\r\n       ELSE 'low' END AS tier\r\nFROM products</template>\r\n<template class=\"ref\">SELECT name, CASE WHEN price >= 100000 THEN 'high' WHEN price >= 20000 THEN 'medium' ELSE 'low' END AS tier FROM products</template></div>\r\n\r\n<h4>2. A simple two-way CASE</h4>\r\n<p>One <code>WHEN</code> and one <code>ELSE</code> is enough to split into two buckets.</p>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 2.</b> Build a <code>stock_level</code> column: <code>'plenty'</code> if <code>stock &gt;= 100</code>, otherwise <code>'low'</code>. Show <code>name</code> and <code>stock_level</code>.</span>\r\n<template class=\"st\">SELECT name,\r\n  CASE WHEN stock >= 100 THEN 'plenty' ELSE 'low' END AS stock_level\r\nFROM products</template>\r\n<template class=\"ref\">SELECT name, CASE WHEN stock >= 100 THEN 'plenty' ELSE 'low' END AS stock_level FROM products</template></div>\r\n\r\n<h4>3. CASE returning a number</h4>\r\n<p><code>CASE</code> doesn't only return text — it can return numbers too, perfect for a conditional calculation.</p>\r\n<pre class=\"run\">SELECT name,\r\n  ROUND(CASE WHEN category = 'Điện tử' THEN price * 0.85\r\n             ELSE price * 0.95 END) AS final_price\r\nFROM products;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 3.</b> Compute <code>final_price</code>: <code>'Điện tử'</code> items get 15% off (<code>price * 0.85</code>), everything else 5% off (<code>price * 0.95</code>), then <code>ROUND</code>. Show <code>name</code> and <code>final_price</code>.</span>\r\n<template class=\"st\">SELECT name,\r\n  ROUND(CASE WHEN category = 'Điện tử' THEN price * 0.85 ELSE price * 0.95 END) AS final_price\r\nFROM products</template>\r\n<template class=\"ref\">SELECT name, ROUND(CASE WHEN category = 'Điện tử' THEN price * 0.85 ELSE price * 0.95 END) AS final_price FROM products</template></div>\r\n\r\n<h4>4. Text functions: LENGTH, SUBSTR</h4>\r\n<p><code>LENGTH(text)</code> counts characters. <code>SUBSTR(text, start, length)</code> cuts out a slice (the first position is 1).</p>\r\n<pre class=\"run\">SELECT name, LENGTH(name) AS name_len\r\nFROM products;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 4.</b> Show <code>name</code> and its <b>length</b> <code>LENGTH(name) AS name_len</code>.</span>\r\n<template class=\"st\">SELECT name, \r\nFROM products</template>\r\n<template class=\"ref\">SELECT name, LENGTH(name) AS name_len FROM products</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 5.</b> Show <code>name</code> and the <b>first 3 characters</b> of the name: <code>SUBSTR(name, 1, 3) AS prefix</code>.</span>\r\n<template class=\"st\">SELECT name, \r\nFROM products</template>\r\n<template class=\"ref\">SELECT name, SUBSTR(name, 1, 3) AS prefix FROM products</template></div>\r\n\r\n<h4>5. Text functions: REPLACE</h4>\r\n<p><code>REPLACE(text, find, replace)</code> swaps every occurrence of a substring.</p>\r\n<pre class=\"run\">SELECT name, REPLACE(city, 'TP. ', '') AS short_city\r\nFROM customers;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 6.</b> From <code>customers</code>, strip the <code>'TP. '</code> prefix from <code>city</code>: <code>REPLACE(city, 'TP. ', '') AS short_city</code>. Show <code>name</code> and <code>short_city</code>.</span>\r\n<template class=\"st\">SELECT name, \r\nFROM customers</template>\r\n<template class=\"ref\">SELECT name, REPLACE(city, 'TP. ', '') AS short_city FROM customers</template></div>\r\n\r\n<h4>6. Date functions</h4>\r\n<p>Dates are stored as <code>'YYYY-MM-DD'</code>. You can slice them with <code>SUBSTR</code>, or use <code>strftime</code> to extract a part: <code>strftime('%Y', date)</code> for the year, <code>'%m'</code> for the month.</p>\r\n<pre class=\"run\">SELECT name, SUBSTR(joined_at, 1, 4) AS year\r\nFROM customers;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 7.</b> From <code>customers</code>, get the <b>join year</b> by slicing the first 4 characters: <code>SUBSTR(joined_at, 1, 4) AS year</code>. Show <code>name</code> and <code>year</code>.</span>\r\n<template class=\"st\">SELECT name, \r\nFROM customers</template>\r\n<template class=\"ref\">SELECT name, SUBSTR(joined_at, 1, 4) AS year FROM customers</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 8.</b> From <code>customers</code>, get the <b>join month</b> (2 characters at position 6): <code>SUBSTR(joined_at, 6, 2) AS month</code>. Show <code>name</code> and <code>month</code>.</span>\r\n<template class=\"st\">SELECT name, \r\nFROM customers</template>\r\n<template class=\"ref\">SELECT name, SUBSTR(joined_at, 6, 2) AS month FROM customers</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 9.</b> From <code>orders</code>, get the <b>order year</b> with <code>strftime('%Y', order_date) AS year</code>. Show <code>id</code> and <code>year</code>.</span>\r\n<template class=\"st\">SELECT id, \r\nFROM orders</template>\r\n<template class=\"ref\">SELECT id, strftime('%Y', order_date) AS year FROM orders</template></div>\r\n\r\n<h4>7. Number functions: ROUND with decimals</h4>\r\n<p><code>ROUND(number, k)</code> rounds to <code>k</code> decimal places.</p>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 10.</b> Show <code>name</code> and the price (with 10% VAT) in <b>thousands, to one decimal</b>: <code>ROUND(price * 1.1 / 1000.0, 1) AS k_vat</code>.</span>\r\n<template class=\"st\">SELECT name, \r\nFROM products</template>\r\n<template class=\"ref\">SELECT name, ROUND(price * 1.1 / 1000.0, 1) AS k_vat FROM products</template></div>\r\n\r\n<h4>8. Combining CASE with filter and sort</h4>\r\n<div class=\"ex stretch\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 11. 🔥 Stretch.</b> For the <code>'Đồ uống'</code> and <code>'Đồ ăn'</code> categories only: show <code>name</code>, <code>price</code>, and a <code>tier</code> column = <code>'premium'</code> if <code>price &gt;= 30000</code>, otherwise <code>'regular'</code>. Sort by <code>price</code> descending.</span>\r\n<template class=\"st\">SELECT name, price,\r\n  CASE WHEN price >= 30000 THEN 'premium' ELSE 'regular' END AS tier\r\nFROM products\r\nWHERE category IN ('Đồ uống', 'Đồ ăn')\r\nORDER BY </template>\r\n<template class=\"ref\">SELECT name, price, CASE WHEN price >= 30000 THEN 'premium' ELSE 'regular' END AS tier FROM products WHERE category IN ('Đồ uống', 'Đồ ăn') ORDER BY price DESC</template></div>\r\n\r\n<h4>🏠 Homework</h4>\r\n<p>Four take-home exercises, auto-graded right on the page. The last one is a stretch.</p>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 1.</b> Build a <code>bucket</code> column: <code>'expensive'</code> if <code>price &gt;= 50000</code>, otherwise <code>'affordable'</code>. Show <code>name</code> and <code>bucket</code>.</span>\r\n<template class=\"st\">SELECT name,\r\n  CASE WHEN price >= 50000 THEN 'expensive' ELSE 'affordable' END AS bucket\r\nFROM products</template>\r\n<template class=\"ref\">SELECT name, CASE WHEN price >= 50000 THEN 'expensive' ELSE 'affordable' END AS bucket FROM products</template></div>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 2.</b> From <code>customers</code>, show <code>name</code> and the <b>length of the city name</b>: <code>LENGTH(city) AS city_len</code>.</span>\r\n<template class=\"st\">SELECT name, \r\nFROM customers</template>\r\n<template class=\"ref\">SELECT name, LENGTH(city) AS city_len FROM customers</template></div>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 3.</b> From <code>customers</code>, get the <b>join year</b> with <code>strftime('%Y', joined_at) AS year</code>. Show <code>name</code> and <code>year</code>.</span>\r\n<template class=\"st\">SELECT name, \r\nFROM customers</template>\r\n<template class=\"ref\">SELECT name, strftime('%Y', joined_at) AS year FROM customers</template></div>\r\n<div class=\"ex homework stretch\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 4. 🔥 Stretch.</b> Build a <code>kind</code> column: <code>'tech'</code> if <code>category = 'Điện tử'</code>, otherwise <code>'non-tech'</code>. Show <code>name</code>, <code>category</code>, <code>kind</code>, sorted by <code>kind</code> then <code>name</code>.</span>\r\n<template class=\"st\">SELECT name, category,\r\n  CASE WHEN category = 'Điện tử' THEN 'tech' ELSE 'non-tech' END AS kind\r\nFROM products\r\nORDER BY </template>\r\n<template class=\"ref\">SELECT name, category, CASE WHEN category = 'Điện tử' THEN 'tech' ELSE 'non-tech' END AS kind FROM products ORDER BY kind, name</template></div>"}},{"t":{"vi":"JOIN — kết nối các bảng","en":"JOIN — connecting tables"},"html":{"vi":"<h3>Bài 8 — JOIN: kết nối các bảng</h3>\r\n<p>Dữ liệu thật không nằm gọn trong một bảng — nó được <b>tách ra</b> để tránh lặp. Bảng <code>orders</code> chỉ lưu <code>customer_id</code> chứ không lưu tên khách; muốn biết \"ai đã đặt đơn này?\" bạn phải <b>nối</b> <code>orders</code> với <code>customers</code>. Đây là kỹ năng phân biệt người biết SQL cơ bản với người dùng SQL thật sự.</p>\r\n<p><code>JOIN</code> ghép các dòng của hai bảng lại theo một điều kiện khớp — thường là <b>khóa ngoại</b> (foreign key) khớp với <b>khóa chính</b> (primary key). Ví dụ <code>orders.customer_id = customers.id</code>.</p>\r\n<p>Cửa hàng của chúng ta có bốn bảng liên kết như sơ đồ dưới. Nắm được các mối nối này, bạn trả lời được gần như mọi câu hỏi.</p>\r\n\r\n<figure class=\"diagram\">\r\n<svg viewBox=\"0 0 640 200\" width=\"100%\" role=\"img\" aria-label=\"Sơ đồ liên kết bốn bảng\">\r\n<style>\r\n.tb{fill:#121C30;stroke:#22304C;rx:8}.tt{fill:#F5B942;font:600 13px IBM Plex Mono,monospace}\r\n.tc{fill:#E8E4D8;font:400 11px IBM Plex Mono,monospace}.ln{stroke:#7FD1C0;stroke-width:2;fill:none}\r\n.lb{fill:#7FD1C0;font:400 10px IBM Plex Sans,sans-serif}\r\n</style>\r\n<rect class=\"tb\" x=\"10\" y=\"40\" width=\"130\" height=\"70\"/><text class=\"tt\" x=\"20\" y=\"60\">customers</text><text class=\"tc\" x=\"20\" y=\"80\">id (PK)</text><text class=\"tc\" x=\"20\" y=\"96\">name, city</text>\r\n<rect class=\"tb\" x=\"230\" y=\"40\" width=\"130\" height=\"70\"/><text class=\"tt\" x=\"240\" y=\"60\">orders</text><text class=\"tc\" x=\"240\" y=\"80\">id (PK)</text><text class=\"tc\" x=\"240\" y=\"96\">customer_id (FK)</text>\r\n<rect class=\"tb\" x=\"450\" y=\"20\" width=\"180\" height=\"70\"/><text class=\"tt\" x=\"460\" y=\"40\">order_items</text><text class=\"tc\" x=\"460\" y=\"60\">order_id (FK)</text><text class=\"tc\" x=\"460\" y=\"76\">product_id (FK)</text>\r\n<rect class=\"tb\" x=\"450\" y=\"120\" width=\"180\" height=\"60\"/><text class=\"tt\" x=\"460\" y=\"140\">products</text><text class=\"tc\" x=\"460\" y=\"160\">id (PK), name, price</text>\r\n<path class=\"ln\" d=\"M140 75 L230 75\"/><text class=\"lb\" x=\"150\" y=\"70\">customer_id → id</text>\r\n<path class=\"ln\" d=\"M360 70 L450 55\"/><text class=\"lb\" x=\"360\" y=\"48\">order_id → id</text>\r\n<path class=\"ln\" d=\"M540 90 L540 120\"/><text class=\"lb\" x=\"545\" y=\"110\">product_id → id</text>\r\n</svg>\r\n<figcaption>Khóa ngoại (FK) của bảng này trỏ tới khóa chính (PK) của bảng kia — đó là chỗ để JOIN.</figcaption>\r\n</figure>\r\n\r\n<h4>1. INNER JOIN — ghép theo điều kiện khớp</h4>\r\n<p>Cú pháp: liệt kê bảng đầu ở <code>FROM</code>, bảng thứ hai ở <code>JOIN</code>, và nêu điều kiện khớp ở <code>ON</code>. Dùng <b>bí danh bảng</b> ngắn (<code>o</code>, <code>c</code>) rồi gọi cột dạng <code>o.cột</code>.</p>\r\n<pre class=\"run\">SELECT o.id AS order_id, c.name AS customer\r\nFROM orders o\r\nJOIN customers c ON o.customer_id = c.id\r\nORDER BY o.id;</pre>\r\n<p>Mỗi đơn hàng được ghép với đúng khách hàng của nó. Vì cột <code>name</code> có ở cả hai bảng, ta <b>phải</b> ghi rõ <code>c.name</code>.</p>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 1.</b> Ghép <code>orders</code> với <code>customers</code>: hiển thị <code>o.id AS order_id</code> và <code>c.name AS customer</code>, sắp theo <code>o.id</code>.</span>\r\n<template class=\"st\">SELECT o.id AS order_id, c.name AS customer\r\nFROM orders o\r\nJOIN customers c ON </template>\r\n<template class=\"ref\">SELECT o.id AS order_id, c.name AS customer FROM orders o JOIN customers c ON o.customer_id = c.id ORDER BY o.id</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 2.</b> Như trên nhưng thêm cột <code>o.order_date</code> vào giữa: <code>order_id</code>, <code>order_date</code>, <code>customer</code>. Sắp theo <code>o.id</code>.</span>\r\n<template class=\"st\">SELECT o.id AS order_id, o.order_date, c.name AS customer\r\nFROM orders o\r\nJOIN customers c ON </template>\r\n<template class=\"ref\">SELECT o.id AS order_id, o.order_date, c.name AS customer FROM orders o JOIN customers c ON o.customer_id = c.id ORDER BY o.id</template></div>\r\n\r\n<h4>2. Nối bảng chi tiết với danh mục</h4>\r\n<p><code>order_items</code> chỉ có <code>product_id</code> — nối với <code>products</code> để lấy tên và giá.</p>\r\n<pre class=\"run\">SELECT oi.order_id, p.name AS product, oi.qty\r\nFROM order_items oi\r\nJOIN products p ON oi.product_id = p.id\r\nORDER BY oi.id;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 3.</b> Ghép <code>order_items</code> với <code>products</code>: hiển thị <code>oi.order_id</code>, <code>p.name AS product</code>, <code>oi.qty</code>, sắp theo <code>oi.id</code>.</span>\r\n<template class=\"st\">SELECT oi.order_id, p.name AS product, oi.qty\r\nFROM order_items oi\r\nJOIN products p ON </template>\r\n<template class=\"ref\">SELECT oi.order_id, p.name AS product, oi.qty FROM order_items oi JOIN products p ON oi.product_id = p.id ORDER BY oi.id</template></div>\r\n\r\n<h4>3. Tính toán sau khi nối</h4>\r\n<p>Nối xong, bạn dùng được cột của <i>cả hai</i> bảng trong một biểu thức — ví dụ thành tiền mỗi dòng = giá × số lượng.</p>\r\n<pre class=\"run\">SELECT p.name AS product, oi.qty, p.price,\r\n       p.price * oi.qty AS line_total\r\nFROM order_items oi\r\nJOIN products p ON oi.product_id = p.id\r\nORDER BY oi.id;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 4.</b> Ghép <code>order_items</code> với <code>products</code>; hiển thị <code>p.name AS product</code>, <code>oi.qty</code>, <code>p.price</code>, và <code>p.price * oi.qty AS line_total</code>. Sắp theo <code>oi.id</code>.</span>\r\n<template class=\"st\">SELECT p.name AS product, oi.qty, p.price, p.price * oi.qty AS line_total\r\nFROM order_items oi\r\nJOIN products p ON </template>\r\n<template class=\"ref\">SELECT p.name AS product, oi.qty, p.price, p.price * oi.qty AS line_total FROM order_items oi JOIN products p ON oi.product_id = p.id ORDER BY oi.id</template></div>\r\n\r\n<h4>4. Nối kèm lọc (WHERE)</h4>\r\n<p><code>WHERE</code> hoạt động bình thường sau khi nối — và bạn lọc được theo cột của bất kỳ bảng nào.</p>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 5.</b> Các mặt hàng thuộc <b>đơn số 4</b>: ghép <code>order_items</code> với <code>products</code>, lọc <code>oi.order_id = 4</code>, hiển thị <code>p.name AS product</code>, <code>oi.qty</code>, sắp theo <code>oi.id</code>.</span>\r\n<template class=\"st\">SELECT p.name AS product, oi.qty\r\nFROM order_items oi\r\nJOIN products p ON oi.product_id = p.id\r\nWHERE </template>\r\n<template class=\"ref\">SELECT p.name AS product, oi.qty FROM order_items oi JOIN products p ON oi.product_id = p.id WHERE oi.order_id = 4 ORDER BY oi.id</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 6.</b> Các đơn hàng của khách ở <b>Hà Nội</b>: ghép <code>orders</code> với <code>customers</code>, lọc <code>c.city = 'Hà Nội'</code>, hiển thị <code>o.id AS order_id</code>, <code>c.name AS customer</code>, sắp theo <code>o.id</code>.</span>\r\n<template class=\"st\">SELECT o.id AS order_id, c.name AS customer\r\nFROM orders o\r\nJOIN customers c ON o.customer_id = c.id\r\nWHERE </template>\r\n<template class=\"ref\">SELECT o.id AS order_id, c.name AS customer FROM orders o JOIN customers c ON o.customer_id = c.id WHERE c.city = 'Hà Nội' ORDER BY o.id</template></div>\r\n\r\n<h4>5. Nối rồi gộp nhóm (JOIN + GROUP BY)</h4>\r\n<p>Sức mạnh thật sự: nối các bảng rồi tổng hợp. Ví dụ tổng số lượng mỗi khách đã mua.</p>\r\n<pre class=\"run\">SELECT o.customer_id, SUM(oi.qty) AS total_qty\r\nFROM orders o\r\nJOIN order_items oi ON oi.order_id = o.id\r\nGROUP BY o.customer_id\r\nORDER BY o.customer_id;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 7.</b> Tổng số lượng mỗi khách đã mua: ghép <code>orders</code> với <code>order_items</code>, gom theo <code>o.customer_id</code>, hiển thị <code>o.customer_id</code> và <code>SUM(oi.qty) AS total_qty</code>, sắp theo <code>o.customer_id</code>.</span>\r\n<template class=\"st\">SELECT o.customer_id, SUM(oi.qty) AS total_qty\r\nFROM orders o\r\nJOIN order_items oi ON oi.order_id = o.id\r\nGROUP BY </template>\r\n<template class=\"ref\">SELECT o.customer_id, SUM(oi.qty) AS total_qty FROM orders o JOIN order_items oi ON oi.order_id = o.id GROUP BY o.customer_id ORDER BY o.customer_id</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 8.</b> Doanh thu mỗi <b>danh mục</b>: ghép <code>order_items</code> với <code>products</code>, gom theo <code>p.category</code>, hiển thị <code>p.category</code> và <code>SUM(p.price * oi.qty) AS revenue</code>, sắp theo <code>p.category</code>.</span>\r\n<template class=\"st\">SELECT p.category, SUM(p.price * oi.qty) AS revenue\r\nFROM order_items oi\r\nJOIN products p ON oi.product_id = p.id\r\nGROUP BY </template>\r\n<template class=\"ref\">SELECT p.category, SUM(p.price * oi.qty) AS revenue FROM order_items oi JOIN products p ON oi.product_id = p.id GROUP BY p.category ORDER BY p.category</template></div>\r\n\r\n<h4>6. Nối ba bảng trở lên</h4>\r\n<p>Cần cả tên khách <i>và</i> tên sản phẩm cho mỗi dòng hàng? Chỉ việc nối tiếp thêm bảng — mỗi bảng một <code>JOIN … ON …</code>.</p>\r\n<pre class=\"run\">SELECT c.name AS customer, p.name AS product, oi.qty\r\nFROM order_items oi\r\nJOIN orders o    ON oi.order_id = o.id\r\nJOIN customers c ON o.customer_id = c.id\r\nJOIN products p  ON oi.product_id = p.id\r\nORDER BY oi.id;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 9.</b> Với mỗi dòng hàng, hiển thị <code>c.name AS customer</code>, <code>p.name AS product</code>, <code>oi.qty</code> (nối cả bốn bảng như ví dụ trên), sắp theo <code>oi.id</code>.</span>\r\n<template class=\"st\">SELECT c.name AS customer, p.name AS product, oi.qty\r\nFROM order_items oi\r\nJOIN orders o ON oi.order_id = o.id\r\nJOIN customers c ON o.customer_id = c.id\r\nJOIN products p ON </template>\r\n<template class=\"ref\">SELECT c.name AS customer, p.name AS product, oi.qty FROM order_items oi JOIN orders o ON oi.order_id = o.id JOIN customers c ON o.customer_id = c.id JOIN products p ON oi.product_id = p.id ORDER BY oi.id</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 10.</b> Số đơn của mỗi khách (kèm tên): ghép <code>orders</code> với <code>customers</code>, gom theo <code>c.id</code>, hiển thị <code>c.name AS customer</code> và <code>COUNT(*) AS order_count</code>, sắp theo <code>c.id</code>.</span>\r\n<template class=\"st\">SELECT c.name AS customer, COUNT(*) AS order_count\r\nFROM orders o\r\nJOIN customers c ON o.customer_id = c.id\r\nGROUP BY </template>\r\n<template class=\"ref\">SELECT c.name AS customer, COUNT(*) AS order_count FROM orders o JOIN customers c ON o.customer_id = c.id GROUP BY c.id ORDER BY c.id</template></div>\r\n\r\n<h4>7. Bài toán tổng hợp</h4>\r\n<div class=\"ex stretch\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 11. 🔥 Nâng cao.</b> <b>Tổng chi tiêu của mỗi khách.</b> Nối <code>orders</code> → <code>order_items</code> → <code>products</code> → <code>customers</code>, gom theo <code>c.id</code>, hiển thị <code>c.name AS customer</code> và <code>SUM(p.price * oi.qty) AS total_spent</code>, sắp theo <code>total_spent</code> giảm dần.</span>\r\n<template class=\"st\">SELECT c.name AS customer, SUM(p.price * oi.qty) AS total_spent\r\nFROM orders o\r\nJOIN order_items oi ON oi.order_id = o.id\r\nJOIN products p ON oi.product_id = p.id\r\nJOIN customers c ON o.customer_id = c.id\r\nGROUP BY c.id\r\nORDER BY </template>\r\n<template class=\"ref\">SELECT c.name AS customer, SUM(p.price * oi.qty) AS total_spent FROM orders o JOIN order_items oi ON oi.order_id = o.id JOIN products p ON oi.product_id = p.id JOIN customers c ON o.customer_id = c.id GROUP BY c.id ORDER BY total_spent DESC</template></div>\r\n\r\n<h4>🏠 Homework</h4>\r\n<p>Bốn bài làm ở nhà, tự động chấm ngay trên trang. Bài cuối là bài nâng cao.</p>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 1.</b> Ghép <code>orders</code> với <code>customers</code>: hiển thị <code>o.order_date</code> và <code>c.name AS customer</code>, sắp theo <code>o.order_date</code>.</span>\r\n<template class=\"st\">SELECT o.order_date, c.name AS customer\r\nFROM orders o\r\nJOIN customers c ON </template>\r\n<template class=\"ref\">SELECT o.order_date, c.name AS customer FROM orders o JOIN customers c ON o.customer_id = c.id ORDER BY o.order_date</template></div>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 2.</b> Các dòng hàng thuộc nhóm <code>'Đồ uống'</code>: ghép <code>order_items</code> với <code>products</code>, lọc <code>p.category = 'Đồ uống'</code>, hiển thị <code>p.name AS product</code>, <code>oi.qty</code>, sắp theo <code>oi.id</code>.</span>\r\n<template class=\"st\">SELECT p.name AS product, oi.qty\r\nFROM order_items oi\r\nJOIN products p ON oi.product_id = p.id\r\nWHERE </template>\r\n<template class=\"ref\">SELECT p.name AS product, oi.qty FROM order_items oi JOIN products p ON oi.product_id = p.id WHERE p.category = 'Đồ uống' ORDER BY oi.id</template></div>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 3.</b> Doanh thu mỗi <b>sản phẩm</b>: ghép <code>order_items</code> với <code>products</code>, gom theo <code>p.id</code>, hiển thị <code>p.name AS product</code> và <code>SUM(p.price * oi.qty) AS revenue</code>, sắp theo <code>revenue</code> giảm dần.</span>\r\n<template class=\"st\">SELECT p.name AS product, SUM(p.price * oi.qty) AS revenue\r\nFROM order_items oi\r\nJOIN products p ON oi.product_id = p.id\r\nGROUP BY p.id\r\nORDER BY </template>\r\n<template class=\"ref\">SELECT p.name AS product, SUM(p.price * oi.qty) AS revenue FROM order_items oi JOIN products p ON oi.product_id = p.id GROUP BY p.id ORDER BY revenue DESC</template></div>\r\n<div class=\"ex homework stretch\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 4. 🔥 Nâng cao.</b> <b>Số sản phẩm khác nhau mỗi khách đã mua.</b> Nối <code>orders</code> → <code>order_items</code> → <code>customers</code>, gom theo <code>c.id</code>, hiển thị <code>c.name AS customer</code> và <code>COUNT(DISTINCT oi.product_id) AS distinct_products</code>, sắp theo <code>c.id</code>.</span>\r\n<template class=\"st\">SELECT c.name AS customer, COUNT(DISTINCT oi.product_id) AS distinct_products\r\nFROM orders o\r\nJOIN order_items oi ON oi.order_id = o.id\r\nJOIN customers c ON o.customer_id = c.id\r\nGROUP BY c.id\r\nORDER BY </template>\r\n<template class=\"ref\">SELECT c.name AS customer, COUNT(DISTINCT oi.product_id) AS distinct_products FROM orders o JOIN order_items oi ON oi.order_id = o.id JOIN customers c ON o.customer_id = c.id GROUP BY c.id ORDER BY c.id</template></div>","en":"<h3>Lesson 8 — JOIN: connecting tables</h3>\r\n<p>Real data doesn't sit in one table — it's <b>split apart</b> to avoid repetition. The <code>orders</code> table only stores a <code>customer_id</code>, not the customer's name; to answer \"who placed this order?\" you have to <b>join</b> <code>orders</code> to <code>customers</code>. This is the skill that separates people who know basic SQL from people who really use it.</p>\r\n<p><code>JOIN</code> stitches rows from two tables together on a matching condition — usually a <b>foreign key</b> matching a <b>primary key</b>. For example <code>orders.customer_id = customers.id</code>.</p>\r\n<p>Our shop has four linked tables, shown below. Once you understand these links, you can answer almost any question.</p>\r\n\r\n<figure class=\"diagram\">\r\n<svg viewBox=\"0 0 640 200\" width=\"100%\" role=\"img\" aria-label=\"Diagram of four linked tables\">\r\n<style>\r\n.tb{fill:#121C30;stroke:#22304C;rx:8}.tt{fill:#F5B942;font:600 13px IBM Plex Mono,monospace}\r\n.tc{fill:#E8E4D8;font:400 11px IBM Plex Mono,monospace}.ln{stroke:#7FD1C0;stroke-width:2;fill:none}\r\n.lb{fill:#7FD1C0;font:400 10px IBM Plex Sans,sans-serif}\r\n</style>\r\n<rect class=\"tb\" x=\"10\" y=\"40\" width=\"130\" height=\"70\"/><text class=\"tt\" x=\"20\" y=\"60\">customers</text><text class=\"tc\" x=\"20\" y=\"80\">id (PK)</text><text class=\"tc\" x=\"20\" y=\"96\">name, city</text>\r\n<rect class=\"tb\" x=\"230\" y=\"40\" width=\"130\" height=\"70\"/><text class=\"tt\" x=\"240\" y=\"60\">orders</text><text class=\"tc\" x=\"240\" y=\"80\">id (PK)</text><text class=\"tc\" x=\"240\" y=\"96\">customer_id (FK)</text>\r\n<rect class=\"tb\" x=\"450\" y=\"20\" width=\"180\" height=\"70\"/><text class=\"tt\" x=\"460\" y=\"40\">order_items</text><text class=\"tc\" x=\"460\" y=\"60\">order_id (FK)</text><text class=\"tc\" x=\"460\" y=\"76\">product_id (FK)</text>\r\n<rect class=\"tb\" x=\"450\" y=\"120\" width=\"180\" height=\"60\"/><text class=\"tt\" x=\"460\" y=\"140\">products</text><text class=\"tc\" x=\"460\" y=\"160\">id (PK), name, price</text>\r\n<path class=\"ln\" d=\"M140 75 L230 75\"/><text class=\"lb\" x=\"150\" y=\"70\">customer_id → id</text>\r\n<path class=\"ln\" d=\"M360 70 L450 55\"/><text class=\"lb\" x=\"360\" y=\"48\">order_id → id</text>\r\n<path class=\"ln\" d=\"M540 90 L540 120\"/><text class=\"lb\" x=\"545\" y=\"110\">product_id → id</text>\r\n</svg>\r\n<figcaption>A table's foreign key (FK) points to another table's primary key (PK) — that's where you JOIN.</figcaption>\r\n</figure>\r\n\r\n<h4>1. INNER JOIN — match rows together</h4>\r\n<p>Syntax: name the first table in <code>FROM</code>, the second in <code>JOIN</code>, and state the match condition in <code>ON</code>. Use short <b>table aliases</b> (<code>o</code>, <code>c</code>) and refer to columns as <code>o.column</code>.</p>\r\n<pre class=\"run\">SELECT o.id AS order_id, c.name AS customer\r\nFROM orders o\r\nJOIN customers c ON o.customer_id = c.id\r\nORDER BY o.id;</pre>\r\n<p>Each order is matched to its customer. Because <code>name</code> exists in both tables, you <b>must</b> write <code>c.name</code>.</p>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 1.</b> Join <code>orders</code> to <code>customers</code>: show <code>o.id AS order_id</code> and <code>c.name AS customer</code>, sorted by <code>o.id</code>.</span>\r\n<template class=\"st\">SELECT o.id AS order_id, c.name AS customer\r\nFROM orders o\r\nJOIN customers c ON </template>\r\n<template class=\"ref\">SELECT o.id AS order_id, c.name AS customer FROM orders o JOIN customers c ON o.customer_id = c.id ORDER BY o.id</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 2.</b> As above but add <code>o.order_date</code> in the middle: <code>order_id</code>, <code>order_date</code>, <code>customer</code>. Sort by <code>o.id</code>.</span>\r\n<template class=\"st\">SELECT o.id AS order_id, o.order_date, c.name AS customer\r\nFROM orders o\r\nJOIN customers c ON </template>\r\n<template class=\"ref\">SELECT o.id AS order_id, o.order_date, c.name AS customer FROM orders o JOIN customers c ON o.customer_id = c.id ORDER BY o.id</template></div>\r\n\r\n<h4>2. Joining a detail table to its catalog</h4>\r\n<p><code>order_items</code> only has a <code>product_id</code> — join to <code>products</code> to get the name and price.</p>\r\n<pre class=\"run\">SELECT oi.order_id, p.name AS product, oi.qty\r\nFROM order_items oi\r\nJOIN products p ON oi.product_id = p.id\r\nORDER BY oi.id;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 3.</b> Join <code>order_items</code> to <code>products</code>: show <code>oi.order_id</code>, <code>p.name AS product</code>, <code>oi.qty</code>, sorted by <code>oi.id</code>.</span>\r\n<template class=\"st\">SELECT oi.order_id, p.name AS product, oi.qty\r\nFROM order_items oi\r\nJOIN products p ON </template>\r\n<template class=\"ref\">SELECT oi.order_id, p.name AS product, oi.qty FROM order_items oi JOIN products p ON oi.product_id = p.id ORDER BY oi.id</template></div>\r\n\r\n<h4>3. Calculating after a join</h4>\r\n<p>Once joined, you can use columns from <i>both</i> tables in one expression — e.g. line total = price × quantity.</p>\r\n<pre class=\"run\">SELECT p.name AS product, oi.qty, p.price,\r\n       p.price * oi.qty AS line_total\r\nFROM order_items oi\r\nJOIN products p ON oi.product_id = p.id\r\nORDER BY oi.id;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 4.</b> Join <code>order_items</code> to <code>products</code>; show <code>p.name AS product</code>, <code>oi.qty</code>, <code>p.price</code>, and <code>p.price * oi.qty AS line_total</code>. Sort by <code>oi.id</code>.</span>\r\n<template class=\"st\">SELECT p.name AS product, oi.qty, p.price, p.price * oi.qty AS line_total\r\nFROM order_items oi\r\nJOIN products p ON </template>\r\n<template class=\"ref\">SELECT p.name AS product, oi.qty, p.price, p.price * oi.qty AS line_total FROM order_items oi JOIN products p ON oi.product_id = p.id ORDER BY oi.id</template></div>\r\n\r\n<h4>4. Join with a filter (WHERE)</h4>\r\n<p><code>WHERE</code> works as usual after a join — and you can filter on a column from any table.</p>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 5.</b> Items in <b>order 4</b>: join <code>order_items</code> to <code>products</code>, filter <code>oi.order_id = 4</code>, show <code>p.name AS product</code>, <code>oi.qty</code>, sorted by <code>oi.id</code>.</span>\r\n<template class=\"st\">SELECT p.name AS product, oi.qty\r\nFROM order_items oi\r\nJOIN products p ON oi.product_id = p.id\r\nWHERE </template>\r\n<template class=\"ref\">SELECT p.name AS product, oi.qty FROM order_items oi JOIN products p ON oi.product_id = p.id WHERE oi.order_id = 4 ORDER BY oi.id</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 6.</b> Orders from customers in <b>Hà Nội</b>: join <code>orders</code> to <code>customers</code>, filter <code>c.city = 'Hà Nội'</code>, show <code>o.id AS order_id</code>, <code>c.name AS customer</code>, sorted by <code>o.id</code>.</span>\r\n<template class=\"st\">SELECT o.id AS order_id, c.name AS customer\r\nFROM orders o\r\nJOIN customers c ON o.customer_id = c.id\r\nWHERE </template>\r\n<template class=\"ref\">SELECT o.id AS order_id, c.name AS customer FROM orders o JOIN customers c ON o.customer_id = c.id WHERE c.city = 'Hà Nội' ORDER BY o.id</template></div>\r\n\r\n<h4>5. Join then group (JOIN + GROUP BY)</h4>\r\n<p>The real power: join tables, then aggregate. For example, total quantity each customer bought.</p>\r\n<pre class=\"run\">SELECT o.customer_id, SUM(oi.qty) AS total_qty\r\nFROM orders o\r\nJOIN order_items oi ON oi.order_id = o.id\r\nGROUP BY o.customer_id\r\nORDER BY o.customer_id;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 7.</b> Total quantity each customer bought: join <code>orders</code> to <code>order_items</code>, group by <code>o.customer_id</code>, show <code>o.customer_id</code> and <code>SUM(oi.qty) AS total_qty</code>, sorted by <code>o.customer_id</code>.</span>\r\n<template class=\"st\">SELECT o.
