t</code>, <code>MAX(price) AS most_expensive</code>, and <code>ROUND(AVG(price)) AS avg_price</code>.</span>\r\n<template class=\"st\">SELECT COUNT(*) AS n, MIN(price) AS cheapest, \r\nFROM products\r\nWHERE </template>\r\n<template class=\"ref\">SELECT COUNT(*) AS n, MIN(price) AS cheapest, MAX(price) AS most_expensive, ROUND(AVG(price)) AS avg_price FROM products WHERE category = 'Đồ uống'</template></div>\r\n\r\n<h4>🏠 Homework</h4>\r\n<p>Four take-home exercises, auto-graded right on the page. The last one is a stretch.</p>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 1.</b> Count the total number of customers in <code>customers</code>, naming the column <code>total</code>.</span>\r\n<template class=\"st\">SELECT \r\nFROM customers</template>\r\n<template class=\"ref\">SELECT COUNT(*) AS total FROM customers</template></div>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 2.</b> Compute the total stock (<code>SUM(stock)</code>) of the <code>'Văn phòng phẩm'</code> category, naming the column <code>total_stock</code>.</span>\r\n<template class=\"st\">SELECT SUM(stock) AS total_stock\r\nFROM products\r\nWHERE </template>\r\n<template class=\"ref\">SELECT SUM(stock) AS total_stock FROM products WHERE category = 'Văn phòng phẩm'</template></div>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 3.</b> Find the highest price (<code>MAX(price)</code>) in the <code>'Đồ ăn'</code> category, naming the column <code>most_expensive</code>.</span>\r\n<template class=\"st\">SELECT MAX(price) AS most_expensive\r\nFROM products\r\nWHERE </template>\r\n<template class=\"ref\">SELECT MAX(price) AS most_expensive FROM products WHERE category = 'Đồ ăn'</template></div>\r\n<div class=\"ex homework stretch\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 4. 🔥 Stretch.</b> From <code>order_items</code>, build a one-row summary with 3 columns: <code>COUNT(*) AS lines</code> (number of order lines), <code>SUM(qty) AS total_qty</code> (total quantity), and <code>MAX(qty) AS biggest_line</code> (the largest single line).</span>\r\n<template class=\"st\">SELECT COUNT(*) AS lines, \r\nFROM order_items</template>\r\n<template class=\"ref\">SELECT COUNT(*) AS lines, SUM(qty) AS total_qty, MAX(qty) AS biggest_line FROM order_items</template></div>"}},{"t":{"vi":"GROUP BY & HAVING — báo cáo theo nhóm","en":"GROUP BY & HAVING — grouped reports"},"html":{"vi":"<h3>Bài 5 — GROUP BY & HAVING: báo cáo theo nhóm</h3>\r\n<p>Ở Bài 4 bạn tính được <i>một</i> con số cho cả bảng: tổng tồn kho, giá trung bình… Nhưng báo cáo thật luôn hỏi theo <b>nhóm</b>: \"doanh thu <b>từng danh mục</b>?\", \"số đơn <b>của mỗi khách</b>?\", \"đã bán bao nhiêu <b>mỗi sản phẩm</b>?\". Bạn không muốn chạy 4 truy vấn cho 4 danh mục — bạn muốn <b>một</b> truy vấn trả về một dòng cho mỗi nhóm.</p>\r\n<p>Đó chính là <code>GROUP BY</code>. Nó chia các dòng thành nhóm theo giá trị một cột, rồi <b>áp dụng hàm tổng hợp cho từng nhóm</b>. Kết quả: mỗi nhóm một dòng, kèm con số bạn tính.</p>\r\n<p>Và khi muốn <b>lọc chính các nhóm</b> đó (ví dụ \"chỉ danh mục có hơn 2 sản phẩm\"), bạn dùng <code>HAVING</code> — giống <code>WHERE</code> nhưng dành cho kết quả sau khi gộp nhóm.</p>\r\n\r\n<h4>1. GROUP BY — một dòng cho mỗi nhóm</h4>\r\n<p>Quy tắc vàng: cột nào đứng sau <code>GROUP BY</code> thì được phép đưa vào <code>SELECT</code>; các cột còn lại phải nằm trong hàm tổng hợp.</p>\r\n<pre class=\"run\">SELECT category, COUNT(*) AS n\r\nFROM products\r\nGROUP BY category\r\nORDER BY category;</pre>\r\n<p>Kết quả: mỗi danh mục một dòng, kèm số sản phẩm trong danh mục đó. (Thêm <code>ORDER BY</code> để thứ tự luôn ổn định.)</p>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 1.</b> Đếm <b>số sản phẩm trong mỗi <code>category</code></b>: hiển thị <code>category</code> và <code>COUNT(*) AS n</code>, gom nhóm theo <code>category</code>, sắp theo <code>category</code>.</span>\r\n<template class=\"st\">SELECT category, COUNT(*) AS n\r\nFROM products\r\nGROUP BY \r\nORDER BY category</template>\r\n<template class=\"ref\">SELECT category, COUNT(*) AS n FROM products GROUP BY category ORDER BY category</template></div>\r\n\r\n<h4>2. SUM và AVG theo nhóm</h4>\r\n<p>Đổi <code>COUNT</code> thành <code>SUM</code> hay <code>AVG</code> để có tổng/trung bình cho từng nhóm.</p>\r\n<pre class=\"run\">SELECT category, SUM(stock) AS total_stock\r\nFROM products\r\nGROUP BY category\r\nORDER BY category;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 2.</b> Tính <b>tổng tồn kho mỗi danh mục</b>: <code>category</code>, <code>SUM(stock) AS total_stock</code>, gom theo <code>category</code>, sắp theo <code>category</code>.</span>\r\n<template class=\"st\">SELECT category, SUM(stock) AS total_stock\r\nFROM products\r\nGROUP BY \r\nORDER BY category</template>\r\n<template class=\"ref\">SELECT category, SUM(stock) AS total_stock FROM products GROUP BY category ORDER BY category</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 3.</b> Tính <b>giá trung bình mỗi danh mục</b>, làm tròn: <code>category</code>, <code>ROUND(AVG(price)) AS avg_price</code>, gom theo <code>category</code>, sắp theo <code>category</code>.</span>\r\n<template class=\"st\">SELECT category, ROUND(AVG(price)) AS avg_price\r\nFROM products\r\nGROUP BY \r\nORDER BY category</template>\r\n<template class=\"ref\">SELECT category, ROUND(AVG(price)) AS avg_price FROM products GROUP BY category ORDER BY category</template></div>\r\n\r\n<h4>3. Nhiều số liệu cho mỗi nhóm</h4>\r\n<p>Bạn có thể đặt nhiều hàm tổng hợp cùng lúc — mỗi nhóm ra một \"hàng tóm tắt\".</p>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 4.</b> Với mỗi <code>category</code>, hiển thị <code>MIN(price) AS cheapest</code> và <code>MAX(price) AS most_expensive</code>. Gom theo <code>category</code>, sắp theo <code>category</code>.</span>\r\n<template class=\"st\">SELECT category, MIN(price) AS cheapest, MAX(price) AS most_expensive\r\nFROM products\r\nGROUP BY \r\nORDER BY category</template>\r\n<template class=\"ref\">SELECT category, MIN(price) AS cheapest, MAX(price) AS most_expensive FROM products GROUP BY category ORDER BY category</template></div>\r\n\r\n<h4>4. Sắp xếp theo con số vừa tính</h4>\r\n<p>Rất hay dùng: gộp nhóm rồi sắp theo chính con số tổng hợp để tìm nhóm \"nhiều nhất\".</p>\r\n<pre class=\"run\">SELECT category, COUNT(*) AS n\r\nFROM products\r\nGROUP BY category\r\nORDER BY n DESC, category;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 5.</b> Đếm số sản phẩm mỗi <code>category</code>, sắp theo số lượng <b>giảm dần</b>; nếu bằng nhau sắp theo <code>category</code>. (Gợi ý: <code>ORDER BY n DESC, category</code>.)</span>\r\n<template class=\"st\">SELECT category, COUNT(*) AS n\r\nFROM products\r\nGROUP BY category\r\nORDER BY </template>\r\n<template class=\"ref\">SELECT category, COUNT(*) AS n FROM products GROUP BY category ORDER BY n DESC, category</template></div>\r\n\r\n<h4>5. HAVING — lọc chính các nhóm</h4>\r\n<p><code>WHERE</code> lọc <i>dòng</i> trước khi gộp; <code>HAVING</code> lọc <i>nhóm</i> sau khi gộp. Vì vậy điều kiện dùng hàm tổng hợp (như <code>COUNT(*) &gt; 2</code>) phải đặt ở <code>HAVING</code>.</p>\r\n<pre class=\"run\">SELECT category, COUNT(*) AS n\r\nFROM products\r\nGROUP BY category\r\nHAVING COUNT(*) > 2\r\nORDER BY category;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 6.</b> Chỉ những <code>category</code> có <b>hơn 2 sản phẩm</b>: hiển thị <code>category</code>, <code>COUNT(*) AS n</code>. Dùng <code>HAVING COUNT(*) &gt; 2</code>, sắp theo <code>category</code>.</span>\r\n<template class=\"st\">SELECT category, COUNT(*) AS n\r\nFROM products\r\nGROUP BY category\r\nHAVING \r\nORDER BY category</template>\r\n<template class=\"ref\">SELECT category, COUNT(*) AS n FROM products GROUP BY category HAVING COUNT(*) > 2 ORDER BY category</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 7.</b> Chỉ những <code>category</code> có <b>tổng tồn kho từ 300 trở lên</b>: hiển thị <code>category</code>, <code>SUM(stock) AS total_stock</code>. Dùng <code>HAVING SUM(stock) &gt;= 300</code>, sắp theo <code>category</code>.</span>\r\n<template class=\"st\">SELECT category, SUM(stock) AS total_stock\r\nFROM products\r\nGROUP BY category\r\nHAVING \r\nORDER BY category</template>\r\n<template class=\"ref\">SELECT category, SUM(stock) AS total_stock FROM products GROUP BY category HAVING SUM(stock) >= 300 ORDER BY category</template></div>\r\n\r\n<h4>6. Gom nhóm trên các bảng khác</h4>\r\n<p><code>GROUP BY</code> tỏa sáng nhất với bảng chi tiết. Bảng <code>order_items</code> có nhiều dòng cho mỗi sản phẩm và mỗi đơn.</p>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 8.</b> Từ <code>order_items</code>, tính <b>tổng số lượng bán ra của mỗi sản phẩm</b>: <code>product_id</code>, <code>SUM(qty) AS total_qty</code>, gom theo <code>product_id</code>, sắp theo <code>product_id</code>.</span>\r\n<template class=\"st\">SELECT product_id, SUM(qty) AS total_qty\r\nFROM order_items\r\nGROUP BY \r\nORDER BY product_id</template>\r\n<template class=\"ref\">SELECT product_id, SUM(qty) AS total_qty FROM order_items GROUP BY product_id ORDER BY product_id</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 9.</b> Từ <code>orders</code>, đếm <b>số đơn của mỗi khách</b>: <code>customer_id</code>, <code>COUNT(*) AS order_count</code>, gom theo <code>customer_id</code>, sắp theo <code>customer_id</code>.</span>\r\n<template class=\"st\">SELECT customer_id, COUNT(*) AS order_count\r\nFROM orders\r\nGROUP BY \r\nORDER BY customer_id</template>\r\n<template class=\"ref\">SELECT customer_id, COUNT(*) AS order_count FROM orders GROUP BY customer_id ORDER BY customer_id</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 10.</b> Từ <code>order_items</code>, đếm <b>số dòng hàng trong mỗi đơn</b>: <code>order_id</code>, <code>COUNT(*) AS lines</code>, gom theo <code>order_id</code>, sắp theo <code>order_id</code>.</span>\r\n<template class=\"st\">SELECT order_id, COUNT(*) AS lines\r\nFROM order_items\r\nGROUP BY \r\nORDER BY order_id</template>\r\n<template class=\"ref\">SELECT order_id, COUNT(*) AS lines FROM order_items GROUP BY order_id ORDER BY order_id</template></div>\r\n\r\n<h4>7. Ghép GROUP BY + HAVING + ORDER BY</h4>\r\n<div class=\"ex stretch\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 11. 🔥 Nâng cao.</b> Chỉ những <code>category</code> có <b>giá trung bình từ 20000 trở lên</b>: hiển thị <code>category</code>, <code>COUNT(*) AS n</code>, <code>ROUND(AVG(price)) AS avg_price</code>. Dùng <code>HAVING AVG(price) &gt;= 20000</code>, sắp theo <code>avg_price</code> giảm dần.</span>\r\n<template class=\"st\">SELECT category, COUNT(*) AS n, ROUND(AVG(price)) AS avg_price\r\nFROM products\r\nGROUP BY category\r\nHAVING \r\nORDER BY </template>\r\n<template class=\"ref\">SELECT category, COUNT(*) AS n, ROUND(AVG(price)) AS avg_price FROM products GROUP BY category HAVING AVG(price) >= 20000 ORDER BY avg_price DESC</template></div>\r\n\r\n<h4>🏠 Homework</h4>\r\n<p>Bốn bài làm ở nhà, tự động chấm ngay trên trang. Bài cuối là bài nâng cao.</p>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 1.</b> Từ <code>customers</code>, đếm <b>số khách mỗi thành phố</b>: <code>city</code>, <code>COUNT(*) AS n</code>, gom theo <code>city</code>, sắp theo <code>city</code>.</span>\r\n<template class=\"st\">SELECT city, COUNT(*) AS n\r\nFROM customers\r\nGROUP BY \r\nORDER BY city</template>\r\n<template class=\"ref\">SELECT city, COUNT(*) AS n FROM customers GROUP BY city ORDER BY city</template></div>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 2.</b> Tính <b>tổng giá niêm yết mỗi danh mục</b>: <code>category</code>, <code>SUM(price) AS total_price</code>, gom theo <code>category</code>, sắp theo <code>total_price</code> <b>giảm dần</b>.</span>\r\n<template class=\"st\">SELECT category, SUM(price) AS total_price\r\nFROM products\r\nGROUP BY category\r\nORDER BY </template>\r\n<template class=\"ref\">SELECT category, SUM(price) AS total_price FROM products GROUP BY category ORDER BY total_price DESC</template></div>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 3.</b> Từ <code>order_items</code>, chỉ những sản phẩm <b>bán được từ 2 đơn vị trở lên</b>: <code>product_id</code>, <code>SUM(qty) AS total_qty</code>. Dùng <code>HAVING SUM(qty) &gt;= 2</code>, sắp theo <code>total_qty</code> giảm dần rồi <code>product_id</code>.</span>\r\n<template class=\"st\">SELECT product_id, SUM(qty) AS total_qty\r\nFROM order_items\r\nGROUP BY product_id\r\nHAVING \r\nORDER BY </template>\r\n<template class=\"ref\">SELECT product_id, SUM(qty) AS total_qty FROM order_items GROUP BY product_id HAVING SUM(qty) >= 2 ORDER BY total_qty DESC, product_id</template></div>\r\n<div class=\"ex homework stretch\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 4. 🔥 Nâng cao.</b> Chỉ những <code>category</code> có <b>sản phẩm đắt nhất trên 40000</b>: hiển thị <code>category</code>, <code>COUNT(*) AS n</code>, <code>MAX(price) AS most_expensive</code>. Dùng <code>HAVING MAX(price) &gt; 40000</code>, sắp theo <code>most_expensive</code> giảm dần.</span>\r\n<template class=\"st\">SELECT category, COUNT(*) AS n, MAX(price) AS most_expensive\r\nFROM products\r\nGROUP BY category\r\nHAVING \r\nORDER BY </template>\r\n<template class=\"ref\">SELECT category, COUNT(*) AS n, MAX(price) AS most_expensive FROM products GROUP BY category HAVING MAX(price) > 40000 ORDER BY most_expensive DESC</template></div>","en":"<h3>Lesson 5 — GROUP BY & HAVING: grouped reports</h3>\r\n<p>In Lesson 4 you computed <i>one</i> number for the whole table: total stock, average price… But real reports always ask <b>per group</b>: \"revenue <b>per category</b>?\", \"orders <b>per customer</b>?\", \"how many sold <b>per product</b>?\". You don't want to run 4 queries for 4 categories — you want <b>one</b> query that returns one row per group.</p>\r\n<p>That's <code>GROUP BY</code>. It splits rows into groups by a column's value, then <b>applies an aggregate function to each group</b>. The result: one row per group, with the number you computed.</p>\r\n<p>And when you want to <b>filter the groups themselves</b> (e.g. \"only categories with more than 2 products\"), you use <code>HAVING</code> — like <code>WHERE</code>, but for the results after grouping.</p>\r\n\r\n<h4>1. GROUP BY — one row per group</h4>\r\n<p>Golden rule: a column after <code>GROUP BY</code> may appear in <code>SELECT</code>; every other column must be inside an aggregate function.</p>\r\n<pre class=\"run\">SELECT category, COUNT(*) AS n\r\nFROM products\r\nGROUP BY category\r\nORDER BY category;</pre>\r\n<p>The result: one row per category with its product count. (Add <code>ORDER BY</code> so the order is always stable.)</p>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 1.</b> Count the <b>number of products in each <code>category</code></b>: show <code>category</code> and <code>COUNT(*) AS n</code>, grouped by <code>category</code>, sorted by <code>category</code>.</span>\r\n<template class=\"st\">SELECT category, COUNT(*) AS n\r\nFROM products\r\nGROUP BY \r\nORDER BY category</template>\r\n<template class=\"ref\">SELECT category, COUNT(*) AS n FROM products GROUP BY category ORDER BY category</template></div>\r\n\r\n<h4>2. SUM and AVG per group</h4>\r\n<p>Swap <code>COUNT</code> for <code>SUM</code> or <code>AVG</code> to get a total/average for each group.</p>\r\n<pre class=\"run\">SELECT category, SUM(stock) AS total_stock\r\nFROM products\r\nGROUP BY category\r\nORDER BY category;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 2.</b> Compute the <b>total stock per category</b>: <code>category</code>, <code>SUM(stock) AS total_stock</code>, grouped by <code>category</code>, sorted by <code>category</code>.</span>\r\n<template class=\"st\">SELECT category, SUM(stock) AS total_stock\r\nFROM products\r\nGROUP BY \r\nORDER BY category</template>\r\n<template class=\"ref\">SELECT category, SUM(stock) AS total_stock FROM products GROUP BY category ORDER BY category</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 3.</b> Compute the <b>average price per category</b>, rounded: <code>category</code>, <code>ROUND(AVG(price)) AS avg_price</code>, grouped by <code>category</code>, sorted by <code>category</code>.</span>\r\n<template class=\"st\">SELECT category, ROUND(AVG(price)) AS avg_price\r\nFROM products\r\nGROUP BY \r\nORDER BY category</template>\r\n<template class=\"ref\">SELECT category, ROUND(AVG(price)) AS avg_price FROM products GROUP BY category ORDER BY category</template></div>\r\n\r\n<h4>3. Several numbers per group</h4>\r\n<p>You can place multiple aggregates at once — each group gets a \"summary row\".</p>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 4.</b> For each <code>category</code>, show <code>MIN(price) AS cheapest</code> and <code>MAX(price) AS most_expensive</code>. Grouped by <code>category</code>, sorted by <code>category</code>.</span>\r\n<template class=\"st\">SELECT category, MIN(price) AS cheapest, MAX(price) AS most_expensive\r\nFROM products\r\nGROUP BY \r\nORDER BY category</template>\r\n<template class=\"ref\">SELECT category, MIN(price) AS cheapest, MAX(price) AS most_expensive FROM products GROUP BY category ORDER BY category</template></div>\r\n\r\n<h4>4. Sorting by the computed number</h4>\r\n<p>Very common: group, then sort by the aggregate itself to find the \"biggest\" group.</p>\r\n<pre class=\"run\">SELECT category, COUNT(*) AS n\r\nFROM products\r\nGROUP BY category\r\nORDER BY n DESC, category;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 5.</b> Count products per <code>category</code>, sorted by count <b>descending</b>; break ties by <code>category</code>. (Hint: <code>ORDER BY n DESC, category</code>.)</span>\r\n<template class=\"st\">SELECT category, COUNT(*) AS n\r\nFROM products\r\nGROUP BY category\r\nORDER BY </template>\r\n<template class=\"ref\">SELECT category, COUNT(*) AS n FROM products GROUP BY category ORDER BY n DESC, category</template></div>\r\n\r\n<h4>5. HAVING — filter the groups</h4>\r\n<p><code>WHERE</code> filters <i>rows</i> before grouping; <code>HAVING</code> filters <i>groups</i> after grouping. So a condition using an aggregate (like <code>COUNT(*) &gt; 2</code>) must go in <code>HAVING</code>.</p>\r\n<pre class=\"run\">SELECT category, COUNT(*) AS n\r\nFROM products\r\nGROUP BY category\r\nHAVING COUNT(*) > 2\r\nORDER BY category;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 6.</b> Only categories with <b>more than 2 products</b>: show <code>category</code>, <code>COUNT(*) AS n</code>. Use <code>HAVING COUNT(*) &gt; 2</code>, sorted by <code>category</code>.</span>\r\n<template class=\"st\">SELECT category, COUNT(*) AS n\r\nFROM products\r\nGROUP BY category\r\nHAVING \r\nORDER BY category</template>\r\n<template class=\"ref\">SELECT category, COUNT(*) AS n FROM products GROUP BY category HAVING COUNT(*) > 2 ORDER BY category</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 7.</b> Only categories with <b>total stock of 300 or more</b>: show <code>category</code>, <code>SUM(stock) AS total_stock</code>. Use <code>HAVING SUM(stock) &gt;= 300</code>, sorted by <code>category</code>.</span>\r\n<template class=\"st\">SELECT category, SUM(stock) AS total_stock\r\nFROM products\r\nGROUP BY category\r\nHAVING \r\nORDER BY category</template>\r\n<template class=\"ref\">SELECT category, SUM(stock) AS total_stock FROM products GROUP BY category HAVING SUM(stock) >= 300 ORDER BY category</template></div>\r\n\r\n<h4>6. Grouping other tables</h4>\r\n<p><code>GROUP BY</code> shines most on detail tables. The <code>order_items</code> table has many rows per product and per order.</p>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 8.</b> From <code>order_items</code>, compute the <b>total quantity sold per product</b>: <code>product_id</code>, <code>SUM(qty) AS total_qty</code>, grouped by <code>product_id</code>, sorted by <code>product_id</code>.</span>\r\n<template class=\"st\">SELECT product_id, SUM(qty) AS total_qty\r\nFROM order_items\r\nGROUP BY \r\nORDER BY product_id</template>\r\n<template class=\"ref\">SELECT product_id, SUM(qty) AS total_qty FROM order_items GROUP BY product_id ORDER BY product_id</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 9.</b> From <code>orders</code>, count the <b>number of orders per customer</b>: <code>customer_id</code>, <code>COUNT(*) AS order_count</code>, grouped by <code>customer_id</code>, sorted by <code>customer_id</code>.</span>\r\n<template class=\"st\">SELECT customer_id, COUNT(*) AS order_count\r\nFROM orders\r\nGROUP BY \r\nORDER BY customer_id</template>\r\n<template class=\"ref\">SELECT customer_id, COUNT(*) AS order_count FROM orders GROUP BY customer_id ORDER BY customer_id</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 10.</b> From <code>order_items</code>, count the <b>number of line items per order</b>: <code>order_id</code>, <code>COUNT(*) AS lines</code>, grouped by <code>order_id</code>, sorted by <code>order_id</code>.</span>\r\n<template class=\"st\">SELECT order_id, COUNT(*) AS lines\r\nFROM order_items\r\nGROUP BY \r\nORDER BY order_id</template>\r\n<template class=\"ref\">SELECT order_id, COUNT(*) AS lines FROM order_items GROUP BY order_id ORDER BY order_id</template></div>\r\n\r\n<h4>7. Combining GROUP BY + HAVING + ORDER BY</h4>\r\n<div class=\"ex stretch\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 11. 🔥 Stretch.</b> Only categories with an <b>average price of 20000 or more</b>: show <code>category</code>, <code>COUNT(*) AS n</code>, <code>ROUND(AVG(price)) AS avg_price</code>. Use <code>HAVING AVG(price) &gt;= 20000</code>, sorted by <code>avg_price</code> descending.</span>\r\n<template class=\"st\">SELECT category, COUNT(*) AS n, ROUND(AVG(price)) AS avg_price\r\nFROM products\r\nGROUP BY category\r\nHAVING \r\nORDER BY </template>\r\n<template class=\"ref\">SELECT category, COUNT(*) AS n, ROUND(AVG(price)) AS avg_price FROM products GROUP BY category HAVING AVG(price) >= 20000 ORDER BY avg_price DESC</template></div>\r\n\r\n<h4>🏠 Homework</h4>\r\n<p>Four take-home exercises, auto-graded right on the page. The last one is a stretch.</p>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 1.</b> From <code>customers</code>, count the <b>number of customers per city</b>: <code>city</code>, <code>COUNT(*) AS n</code>, grouped by <code>city</code>, sorted by <code>city</code>.</span>\r\n<template class=\"st\">SELECT city, COUNT(*) AS n\r\nFROM customers\r\nGROUP BY \r\nORDER BY city</template>\r\n<template class=\"ref\">SELECT city, COUNT(*) AS n FROM customers GROUP BY city ORDER BY city</template></div>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 2.</b> Compute the <b>total list price per category</b>: <code>category</code>, <code>SUM(price) AS total_price</code>, grouped by <code>category</code>, sorted by <code>total_price</code> <b>descending</b>.</span>\r\n<template class=\"st\">SELECT category, SUM(price) AS total_price\r\nFROM products\r\nGROUP BY category\r\nORDER BY </template>\r\n<template class=\"ref\">SELECT category, SUM(price) AS total_price FROM products GROUP BY category ORDER BY total_price DESC</template></div>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 3.</b> From <code>order_items</code>, only products that <b>sold 2 or more units</b>: <code>product_id</code>, <code>SUM(qty) AS total_qty</code>. Use <code>HAVING SUM(qty) &gt;= 2</code>, sorted by <code>total_qty</code> descending then <code>product_id</code>.</span>\r\n<template class=\"st\">SELECT product_id, SUM(qty) AS total_qty\r\nFROM order_items\r\nGROUP BY product_id\r\nHAVING \r\nORDER BY </template>\r\n<template class=\"ref\">SELECT product_id, SUM(qty) AS total_qty FROM order_items GROUP BY product_id HAVING SUM(qty) >= 2 ORDER BY total_qty DESC, product_id</template></div>\r\n<div class=\"ex homework stretch\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 4. 🔥 Stretch.</b> Only categories whose <b>most expensive product is above 40000</b>: show <code>category</code>, <code>COUNT(*) AS n</code>, <code>MAX(price) AS most_expensive</code>. Use <code>HAVING MAX(price) &gt; 40000</code>, sorted by <code>most_expensive</code> descending.</span>\r\n<template class=\"st\">SELECT category, COUNT(*) AS n, MAX(price) AS most_expensive\r\nFROM products\r\nGROUP BY category\r\nHAVING \r\nORDER BY </template>\r\n<template class=\"ref\">SELECT category, COUNT(*) AS n, MAX(price) AS most_expensive FROM products GROUP BY category HAVING MAX(price) > 40000 ORDER BY most_expensive DESC</template></div>"}},{"t":{"vi":"CASE WHEN — logic điều kiện","en":"CASE WHEN — conditional logic"},"html":{"vi":"<h3>Bài 6 — CASE WHEN: logic điều kiện trong truy vấn</h3>\r\n<p>Dữ liệu thô không phải lúc nào cũng ở dạng bạn cần. Sếp không muốn thấy con số <code>350000</code> — họ muốn nhãn \"hàng cao cấp\". Một cột <code>stock</code> thấp cần được đánh dấu \"cần nhập thêm\". Đây là lúc dùng <code>CASE WHEN</code> — chính là câu lệnh \"if/else\" của SQL.</p>\r\n<p><code>CASE WHEN</code> xét <b>từng dòng</b> và trả về một giá trị tùy điều kiện. Nó dùng được ở <code>SELECT</code> (tạo cột mới), ở <code>ORDER BY</code> (sắp theo nhãn), và thậm chí bên trong hàm tổng hợp để <b>đếm/cộng có điều kiện</b> — một kỹ thuật cực mạnh cho báo cáo.</p>\r\n<p>Mọi cột tạo ra ở đây đều nên có <code>AS</code> để đặt tên rõ ràng — như bạn đã quen từ Bài 3.</p>\r\n\r\n<h4>1. CASE WHEN — gán nhãn theo điều kiện</h4>\r\n<p>Cú pháp: <code>CASE WHEN điều_kiện THEN giá_trị ... ELSE giá_trị_mặc_định END</code>. SQL xét các nhánh <b>từ trên xuống</b>, dừng ở nhánh đầu tiên đúng.</p>\r\n<pre class=\"run\">SELECT name,\r\n  CASE WHEN price >= 100000 THEN 'high'\r\n       WHEN price >= 20000  THEN 'medium'\r\n       ELSE 'low' END AS tier\r\nFROM products;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 1.</b> Với mỗi sản phẩm, tạo cột <code>tier</code>: <code>'high'</code> nếu <code>price &gt;= 100000</code>, <code>'medium'</code> nếu <code>price &gt;= 20000</code>, còn lại <code>'low'</code>. Hiển thị <code>name</code> và <code>tier</code>.</span>\r\n<template class=\"st\">SELECT name,\r\n  CASE WHEN price >= 100000 THEN 'high'\r\n       WHEN price >= 20000 THEN 'medium'\r\n       ELSE 'low' END AS tier\r\nFROM products</template>\r\n<template class=\"ref\">SELECT name, CASE WHEN price >= 100000 THEN 'high' WHEN price >= 20000 THEN 'medium' ELSE 'low' END AS tier FROM products</template></div>\r\n\r\n<h4>2. CASE hai nhánh đơn giản</h4>\r\n<p>Chỉ cần một <code>WHEN</code> và một <code>ELSE</code> là đủ để chia hai loại.</p>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 2.</b> Tạo cột <code>stock_level</code>: <code>'plenty'</code> nếu <code>stock &gt;= 100</code>, còn lại <code>'low'</code>. Hiển thị <code>name</code> và <code>stock_level</code>.</span>\r\n<template class=\"st\">SELECT name,\r\n  CASE WHEN stock >= 100 THEN 'plenty' ELSE 'low' END AS stock_level\r\nFROM products</template>\r\n<template class=\"ref\">SELECT name, CASE WHEN stock >= 100 THEN 'plenty' ELSE 'low' END AS stock_level FROM products</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 3.</b> Tạo cột <code>status</code>: <code>'reorder'</code> nếu <code>stock &lt; 50</code>, còn lại <code>'ok'</code>. Hiển thị <code>name</code>, <code>stock</code>, <code>status</code>.</span>\r\n<template class=\"st\">SELECT name, stock,\r\n  CASE WHEN stock < 50 THEN 'reorder' ELSE 'ok' END AS status\r\nFROM products</template>\r\n<template class=\"ref\">SELECT name, stock, CASE WHEN stock < 50 THEN 'reorder' ELSE 'ok' END AS status FROM products</template></div>\r\n\r\n<h4>3. CASE trả về số</h4>\r\n<p><code>CASE</code> không chỉ trả về chữ — nó trả về được cả số, nên rất hợp để tính giá trị có điều kiện.</p>\r\n<pre class=\"run\">SELECT name,\r\n  ROUND(CASE WHEN category = 'Điện tử' THEN price * 0.85\r\n             ELSE price * 0.95 END) AS final_price\r\nFROM products;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 4.</b> Tính <code>final_price</code>: hàng <code>'Điện tử'</code> giảm 15% (<code>price * 0.85</code>), còn lại giảm 5% (<code>price * 0.95</code>), rồi <code>ROUND</code>. Hiển thị <code>name</code> và <code>final_price</code>.</span>\r\n<template class=\"st\">SELECT name,\r\n  ROUND(CASE WHEN category = 'Điện tử' THEN price * 0.85 ELSE price * 0.95 END) AS final_price\r\nFROM products</template>\r\n<template class=\"ref\">SELECT name, ROUND(CASE WHEN category = 'Điện tử' THEN price * 0.85 ELSE price * 0.95 END) AS final_price FROM products</template></div>\r\n\r\n<h4>4. Phân loại theo danh mục và nhiều nhánh</h4>\r\n<p>Điều kiện của <code>CASE</code> dùng được với cả chữ, và bạn có thể có nhiều <code>WHEN</code>.</p>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 5.</b> Tạo cột <code>kind</code>: <code>'tech'</code> nếu <code>category = 'Điện tử'</code>, còn lại <code>'non-tech'</code>. Hiển thị <code>name</code> và <code>kind</code>.</span>\r\n<template class=\"st\">SELECT name,\r\n  CASE WHEN category = 'Điện tử' THEN 'tech' ELSE 'non-tech' END AS kind\r\nFROM products</template>\r\n<template class=\"ref\">SELECT name, CASE WHEN category = 'Điện tử' THEN 'tech' ELSE 'non-tech' END AS kind FROM products</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 6.</b> Từ <code>customers</code>, tạo cột <code>region</code>: <code>'North'</code> nếu <code>city = 'Hà Nội'</code>, <code>'Central'</code> nếu <code>city = 'Đà Nẵng'</code>, còn lại <code>'South'</code>. Hiển thị <code>name</code> và <code>region</code>.</span>\r\n<template class=\"st\">SELECT name,\r\n  CASE WHEN city = 'Hà Nội' THEN 'North'\r\n       WHEN city = 'Đà Nẵng' THEN 'Central'\r\n       ELSE 'South' END AS region\r\nFROM customers</template>\r\n<template class=\"ref\">SELECT name, CASE WHEN city = 'Hà Nội' THEN 'North' WHEN city = 'Đà Nẵng' THEN 'Central' ELSE 'South' END AS region FROM customers</template></div>\r\n\r\n<h4>5. Điều kiện kết hợp trong CASE</h4>\r\n<p>Mỗi <code>WHEN</code> có thể chứa <code>AND</code>/<code>OR</code> như một mệnh đề <code>WHERE</code> thu nhỏ.</p>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 7.</b> Tạo cột <code>label</code>: <code>'premium tech'</code> nếu <code>category = 'Điện tử'</code> <b>và</b> <code>price &gt; 300000</code>, còn lại <code>'other'</code>. Hiển thị <code>name</code> và <code>label</code>.</span>\r\n<template class=\"st\">SELECT name,\r\n  CASE WHEN category = 'Điện tử' AND price > 300000 THEN 'premium tech' ELSE 'other' END AS label\r\nFROM products</template>\r\n<template class=\"ref\">SELECT name, CASE WHEN category = 'Điện tử' AND price > 300000 THEN 'premium tech' ELSE 'other' END AS label FROM products</template></div>\r\n\r\n<h4>6. Sắp xếp theo kết quả CASE</h4>\r\n<p>Bí danh của cột <code>CASE</code> dùng được trong <code>ORDER BY</code> — sắp xếp theo nhãn bạn tự đặt.</p>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 8.</b> Hiển thị <code>name</code>, <code>price</code>, và cột <code>tier</code> = <code>'high'</code> nếu <code>price &gt;= 100000</code> còn lại <code>'normal'</code>. Sắp theo <code>tier</code> rồi <code>price</code> giảm dần (<code>ORDER BY tier, price DESC</code>).</span>\r\n<template class=\"st\">SELECT name, price,\r\n  CASE WHEN price >= 100000 THEN 'high' ELSE 'normal' END AS tier\r\nFROM products\r\nORDER BY </template>\r\n<template class=\"ref\">SELECT name, price, CASE WHEN price >= 100000 THEN 'high' ELSE 'normal' END AS tier FROM products ORDER BY tier, price DESC</template></div>\r\n\r\n<h4>7. Đếm và cộng có điều kiện</h4>\r\n<p>Đặt <code>CASE</code> <b>bên trong</b> <code>SUM</code> để đếm hoặc cộng chỉ những dòng thỏa điều kiện — một mẹo báo cáo rất hay: <code>SUM(CASE WHEN … THEN 1 ELSE 0 END)</code> đếm số dòng đúng điều kiện.</p>\r\n<pre class=\"run\">SELECT SUM(CASE WHEN price >= 50000 THEN 1 ELSE 0 END) AS expensive_count\r\nFROM products;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 9.</b> Đếm số sản phẩm <b>đắt</b> (<code>price &gt;= 50000</code>) bằng <code>SUM(CASE WHEN price &gt;= 50000 THEN 1 ELSE 0 END) AS expensive_count</code>.</span>\r\n<template class=\"st\">SELECT \r\nFROM products</template>\r\n<template class=\"ref\">SELECT SUM(CASE WHEN price >= 50000 THEN 1 ELSE 0 END) AS expensive_count FROM products</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 10.</b> Tính <b>tổng giá của riêng hàng 'Điện tử'</b> bằng <code>SUM(CASE WHEN category = 'Điện tử' THEN price ELSE 0 END) AS electronics_value</code>.</span>\r\n<template class=\"st\">SELECT \r\nFROM products</template>\r\n<template class=\"ref\">SELECT SUM(CASE WHEN category = 'Điện tử' THEN price ELSE 0 END) AS electronics_value FROM products</template></div>\r\n\r\n<h4>8. Ghép CASE với lọc và sắp xếp</h4>\r\n<div class=\"ex stretch\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 11. 🔥 Nâng cao.</b> Chỉ với nhóm <code>'Đồ uống'</code> và <code>'Đồ ăn'</code>: hiển thị <code>name</code>, <code>price</code>, và cột <code>tier</code> = <code>'premium'</code> nếu <code>price &gt;= 30000</code>, còn lại <code>'regular'</code>. Sắp theo <code>price</code> giảm dần.</span>\r\n<template class=\"st\">SELECT name, price,\r\n  CASE WHEN price >= 30000 THEN 'premium' ELSE 'regular' END AS tier\r\nFROM products\r\nWHERE category IN ('Đồ uống', 'Đồ ăn')\r\nORDER BY </template>\r\n<template class=\"ref\">SELECT name, price, CASE WHEN price >= 30000 THEN 'premium' ELSE 'regular' END AS tier FROM products WHERE category IN ('Đồ uống', 'Đồ ăn') ORDER BY price DESC</template></div>\r\n\r\n<h4>🏠 Homework</h4>\r\n<p>Bốn bài làm ở nhà, tự động chấm ngay trên trang. Bài cuối là bài nâng cao.</p>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 1.</b> Tạo cột <code>bucket</code>: <code>'expensive'</code> nếu <code>price &gt;= 50000</code>, còn lại <code>'affordable'</code>. Hiển thị <code>name</code> và <code>bucket</code>.</span>\r\n<template class=\"st\">SELECT name,\r\n  CASE WHEN price >= 50000 THEN 'expensive' ELSE 'affordable' END AS bucket\r\nFROM products</template>\r\n<template class=\"ref\">SELECT name, CASE WHEN price >= 50000 THEN 'expensive' ELSE 'affordable' END AS bucket FROM products</template></div>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 2.</b> Tạo cột <code>kind</code>: <code>'big ticket'</code> nếu <code>price &gt;= 100000</code>, còn lại <code>'everyday'</code>. Hiển thị <code>name</code> và <code>kind</code>.</span>\r\n<template class=\"st\">SELECT name,\r\n  CASE WHEN price >= 100000 THEN 'big ticket' ELSE 'everyday' END AS kind\r\nFROM products</template>\r\n<template class=\"ref\">SELECT name, CASE WHEN price >= 100000 THEN 'big ticket' ELSE 'everyday' END AS kind FROM products</template></div>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 3.</b> Đếm số sản phẩm nhóm <code>'Đồ uống'</code> bằng đếm có điều kiện: <code>SUM(CASE WHEN category = 'Đồ uống' THEN 1 ELSE 0 END) AS drink_count</code>.</span>\r\n<template class=\"st\">SELECT \r\nFROM products</template>\r\n<template class=\"ref\">SELECT SUM(CASE WHEN category = 'Đồ uống' THEN 1 ELSE 0 END) AS drink_count FROM products</template></div>\r\n<div class=\"ex homework stretch\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 4. 🔥 Nâng cao.</b> Tạo cột <code>kind</code>: <code>'tech'</code> nếu <code>category = 'Điện tử'</code>, còn lại <code>'non-tech'</code>. Hiển thị <code>name</code>, <code>category</code>, <code>kind</code>, sắp theo <code>kind</code> rồi <code>name</code>.</span>\r\n<template class=\"st\">SELECT name, category,\r\n  CASE WHEN category = 'Điện tử' THEN 'tech' ELSE 'non-tech' END AS kind\r\nFROM products\r\nORDER BY </template>\r\n<template class=\"ref\">SELECT name, category, CASE WHEN category = 'Điện tử' THEN 'tech' ELSE 'non-tech' END AS kind FROM products ORDER BY kind, name</template></div>","en":"<h3>Lesson 6 — CASE WHEN: conditional logic in queries</h3>\r\n<p>Raw data isn't always in the shape you need. A manager doesn't want to see <code>350000</code> — they want the label \"premium\". A low <code>stock</code> value needs flagging as \"reorder\". This is where <code>CASE WHEN</code> comes in — it's SQL's \"if/else\".</p>\r\n<p><code>CASE WHEN</code> looks at <b>each row</b> and returns a value depending on a condition. You can use it in <code>SELECT</code> (to build a new column), in <code>ORDER BY</code> (to sort by a label), and even inside an aggregate to <b>count/sum conditionally</b> — a very powerful reporting trick.</p>\r\n<p>Every column you create here should get an <code>AS</code> alias for a clear name — as you learned in Lesson 3.</p>\r\n\r\n<h4>1. CASE WHEN — labels by condition</h4>\r\n<p>Syntax: <code>CASE WHEN condition THEN value ... ELSE default END</code>. SQL checks the branches <b>top to bottom</b> and stops at the first true one.</p>\r\n<pre class=\"run\">SELECT name,\r\n  CASE WHEN price >= 100000 THEN 'high'\r\n       WHEN price >= 20000  THEN 'medium'\r\n       ELSE 'low' END AS tier\r\nFROM products;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 1.</b> For each product, build a <code>tier</code> column: <code>'high'</code> if <code>price &gt;= 100000</code>, <code>'medium'</code> if <code>price &gt;= 20000</code>, otherwise <code>'low'</code>. Show <code>name</code> and <code>tier</code>.</span>\r\n<template class=\"st\">SELECT name,\r\n  CASE WHEN price >= 100000 THEN 'high'\r\n       WHEN price >= 20000 THEN 'medium'\r\n       ELSE 'low' END AS tier\r\nFROM products</template>\r\n<template class=\"ref\">SELECT name, CASE WHEN price >= 100000 THEN 'high' WHEN price >= 20000 THEN 'medium' ELSE 'low' END AS tier FROM products</template></div>\r\n\r\n<h4>2. A simple two-way CASE</h4>\r\n<p>One <code>WHEN</code> and one <code>ELSE</code> is enough to split into two buckets.</p>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 2.</b> Build a <code>stock_level</code> column: <code>'plenty'</code> if <code>stock &gt;= 100</code>, otherwise <code>'low'</code>. Show <code>name</code> and <code>stock_level</code>.</span>\r\n<template class=\"st\">SELECT name,\r\n  CASE WHEN stock >= 100 THEN 'plenty' ELSE 'low' END AS stock_level\r\nFROM products</template>\r\n<template class=\"ref\">SELECT name, CASE WHEN stock >= 100 THEN 'plenty' ELSE 'low' END AS stock_level FROM products</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 3.</b> Build a <code>status</code> column: <code>'reorder'</code> if <code>stock &lt; 50</code>, otherwise <code>'ok'</code>. Show <code>name</code>, <code>stock</code>, <code>status</code>.</span>\r\n<template class=\"st\">SELECT name, stock,\r\n  CASE WHEN stock < 50 THEN 'reorder' ELSE 'ok' END AS status\r\nFROM products</template>\r\n<template class=\"ref\">SELECT name, stock, CASE WHEN stock < 50 THEN 'reorder' ELSE 'ok' END AS status FROM products</template></div>\r\n\r\n<h4>3. CASE returning a number</h4>\r\n<p><code>CASE</code> doesn't only return text — it can return numbers too, perfect for a conditional calculation.</p>\r\n<pre class=\"run\">SELECT name,\r\n  ROUND(CASE WHEN category = 'Điện tử' THEN price * 0.85\r\n             ELSE price * 0.95 END) AS final_price\r\nFROM products;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 4.</b> Compute <code>final_price</code>: <code>'Điện tử'</code> items get 15% off (<code>price * 0.85</code>), everything else 5% off (<code>price * 0.95</code>), then <code>ROUND</code>. Show <code>name</code> and <code>final_price</code>.</span>\r\n<template class=\"st\">SELECT name,\r\n  ROUND(CASE WHEN category = 'Điện tử' THEN price * 0.85 ELSE price * 0.95 END) AS final_price\r\nFROM products</template>\r\n<template class=\"ref\">SELECT name, ROUND(CASE WHEN category = 'Điện tử' THEN price * 0.85 ELSE price * 0.95 END) AS final_price FROM products</template></div>\r\n\r\n<h4>4. Classifying by text, with multiple branches</h4>\r\n<p><code>CASE</code> conditions work on text too, and you can have several <code>WHEN</code> branches.</p>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 5.</b> Build a <code>kind</code> column: <code>'tech'</code> if <code>category = 'Điện tử'</code>, otherwise <code>'non-tech'</code>. Show <code>name</code> and <code>kind</code>.</span>\r\n<template class=\"st\">SELECT name,\r\n  CASE WHEN category = 'Điện tử' THEN 'tech' ELSE 'non-tech' END AS kind\r\nFROM products</template>\r\n<template class=\"ref\">SELECT name, CASE WHEN category = 'Điện tử' THEN 'tech' ELSE 'non-tech' END AS kind FROM products</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 6.</b> From <code>customers</code>, build a <code>region</code> column: <code>'North'</code> if <code>city = 'Hà Nội'</code>, <code>'Central'</code> if <code>city = 'Đà Nẵng'</code>, otherwise <code>'South'</code>. Show <code>name</code> and <code>region</code>.</span>\r\n<template class=\"st\">SELECT name,\r\n  CASE WHEN city = 'Hà Nội' THEN 'North'\r\n       WHEN city = 'Đà Nẵng' THEN 'Central'\r\n       ELSE 'South' END AS region\r\nFROM customers</template>\r\n<template class=\"ref\">SELECT name, CASE WHEN city = 'Hà Nội' THEN 'North' WHEN city = 'Đà Nẵng' THEN 'Central' ELSE 'South' END AS region FROM customers</template></div>\r\n\r\n<h4>5. Combined conditions inside CASE</h4>\r\n<p>Each <code>WHEN</code> can contain <code>AND</code>/<code>OR</code>, like a mini <code>WHERE</code>.</p>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 7.</b> Build a <code>label</code> column: <code>'premium tech'</code> if <code>category = 'Điện tử'</code> <b>and</b> <code>price &gt; 300000</code>, otherwise <code>'other'</code>. Show <code>name</code> and <code>label</code>.</span>\r\n<template class=\"st\">SELECT name,\r\n  CASE WHEN category = 'Điện tử' AND price > 300000 THEN 'premium tech' ELSE 'other' END AS label\r\nFROM products</template>\r\n<template class=\"ref\">SELECT name, CASE WHEN category = 'Điện tử' AND price > 300000 THEN 'premium tech' ELSE 'other' END AS label FROM products</template></div>\r\n\r\n<h4>6. Sorting by a CASE result</h4>\r\n<p>A <code>CASE</code> column's alias works in <code>ORDER BY</code> — sort by the label you invented.</p>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 8.</b> Show <code>name</code>, <code>price</code>, and a <code>tier</code> column = <code>'high'</code> if <code>price &gt;= 100000</code> else <code>'normal'</code>. Sort by <code>tier</code> then <code>price</code> descending (<code>ORDER BY tier, price DESC</code>).</span>\r\n<template class=\"st\">SELECT name, price,\r\n  CASE WHEN price >= 100000 THEN 'high' ELSE 'normal' END AS tier\r\nFROM products\r\nORDER BY </template>\r\n<template class=\"ref\">SELECT name, price, CASE WHEN price >= 100000 THEN 'high' ELSE 'normal' END AS tier FROM products ORDER BY tier, price DESC</template></div>\r\n\r\n<h4>7. Conditional counting and summing</h4>\r\n<p>Put <code>CASE</code> <b>inside</b> <code>SUM</code> to count or add only the rows that meet a condition — a very handy reporting trick: <code>SUM(CASE WHEN … THEN 1 ELSE 0 END)</code> counts matching rows.</p>\r\n<pre class=\"run\">SELECT SUM(CASE WHEN price >= 50000 THEN 1 ELSE 0 END) AS expensive_count\r\nFROM products;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 9.</b> Count the number of <b>expensive</b> products (<code>price &gt;= 50000</code>) with <code>SUM(CASE WHEN price &gt;= 50000 THEN 1 ELSE 0 END) AS expensive_count</code>.</span>\r\n<template class=\"st\">SELECT \r\nFROM products</template>\r\n<template class=\"ref\">SELECT SUM(CASE WHEN price >= 50000 THEN 1 ELSE 0 END) AS expensive_count FROM products</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 10.</b> Compute the <b>total price of only 'Điện tử' items</b> with <code>SUM(CASE WHEN category = 'Điện tử' THEN price ELSE 0 END) AS electronics_value</code>.</span>\r\n<template class=\"st\">SELECT \r\nFROM products</template>\r\n<template class=\"ref\">SELECT SUM(CASE WHEN category = 'Điện tử' THEN price ELSE 0 END) AS electronics_value FROM products</template></div>\r\n\r\n<h4>8. Combining CASE with filter and sort</h4>\r\n<div class=\"ex stretch\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 11. 🔥 Stretch.</b> For the <code>'Đồ uống'</code> and <code>'Đồ ăn'</code> categories only: show <code>name</code>, <code>price</code>, and a <code>tier</code> column = <code>'premium'</code> if <code>price &gt;= 30000</code>, otherwise <code>'regular'</code>. Sort by <code>price</code> descending.</span>\r\n<template class=\"st\">SELECT name, price,\r\n  CASE WHEN price >= 30000 THEN 'premium' ELSE 'regular' END AS tier\r\nFROM products\r\nWHERE category IN ('Đồ uống', 'Đồ ăn')\r\nORDER BY </template>\r\n<template class=\"ref\">SELECT name, price, CASE WHEN price >= 30000 THEN 'premium' ELSE 'regular' END AS tier FROM products WHERE category IN ('Đồ uống', 'Đồ ăn') ORDER BY price DESC</template></div>\r\n\r\n<h4>🏠 Homework</h4>\r\n<p>Four take-home exercises, auto-graded right on the page. The last one is a stretch.</p>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 1.</b> Build a <code>bucket</code> column: <code>'expensive'</code> if <code>price &gt;= 50000</code>, otherwise <code>'affordable'</code>. Show <code>name</code> and <code>bucket</code>.</span>\r\n<template class=\"st\">SELECT name,\r\n  CASE WHEN price >= 50000 THEN 'expensive' ELSE 'affordable' END AS bucket\r\nFROM products</template>\r\n<template class=\"ref\">SELECT name, CASE WHEN price >= 50000 THEN 'expensive' ELSE 'affordable' END AS bucket FROM products</template></div>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 2.</b> Build a <code>kind</code> column: <code>'big ticket'</code> if <code>price &gt;= 100000</code>, otherwise <code>'everyday'</code>. Show <code>name</code> and <code>kind</code>.</span>\r\n<template class=\"st\">SELECT name,\r\n  CASE WHEN price >= 100000 THEN 'big ticket' ELSE 'everyday' END AS kind\r\nFROM products</template>\r\n<template class=\"ref\">SELECT name, CASE WHEN price >= 100000 THEN 'big ticket' ELSE 'everyday' END AS kind FROM products</template></div>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 3.</b> Count the products in the <code>'Đồ uống'</code> category with conditional counting: <code>SUM(CASE WHEN category = 'Đồ uống' THEN 1 ELSE 0 END) AS drink_count</code>.</span>\r\n<template class=\"st\">SELECT \r\nFROM products</template>\r\n<template class=\"ref\">SELECT SUM(CASE WHEN category = 'Đồ uống' THEN 1 ELSE 0 END) AS drink_count FROM products</template></div>\r\n<div class=\"ex homework stretch\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 4. 🔥 Stretch.</b> Build a <code>kind</code> column: <code>'tech'</code> if <code>category = 'Điện tử'</code>, otherwise <code>'non-tech'</code>. Show <code>name</code>, <code>category</code>, <code>kind</code>, sorted by <code>kind</code> then <code>name</code>.</span>\r\n<template class=\"st\">SELECT name, category,\r\n  CASE WHEN category = 'Điện tử' THEN 'tech' ELSE 'non-tech' END AS kind\r\nFROM products\r\nORDER BY </template>\r\n<template class=\"ref\">SELECT name, category, CASE WHEN category = 'Điện tử' THEN 'tech' ELSE 'non-tech' END AS kind FROM products ORDER BY kind, name</template></div>"}},{"t":{"vi":"Hàm xử lý chữ và số","en":"Text & number functions"},"html":{"vi":"<h3>Bài 7 — Hàm xử lý chữ và số</h3>\r\n<p>SQL không chỉ lấy dữ liệu ra — nó còn <b>biến đổi</b> dữ liệu ngay trong truy vấn. Muốn cắt lấy vài ký tự đầu của tên? Bỏ tiền tố \"TP.\" khỏi tên thành phố? Làm tròn giá tới một chữ số thập phân? Tất cả đều có <b>hàm</b> dựng sẵn.</p>\r\n<p>Bài này gom các hàm hay dùng nhất cho <b>chuỗi</b> (<code>LENGTH</code>, <code>SUBSTR</code>, <code>REPLACE</code>, ghép <code>||</code>) và cho <b>số</b> (<code>ROUND</code>, phép chia lấy nguyên). Ngày tháng có bộ hàm riêng — bạn sẽ học ở Bài 8.</p>\r\n<p>Như thường lệ, mọi cột tính ra nên đặt tên bằng <code>AS</code>.</p>\r\n\r\n<h4>1. LENGTH — đếm số ký tự</h4>\r\n<p><code>LENGTH(chuỗi)</code> trả về số ký tự của chuỗi.</p>\r\n<pre class=\"run\">SELECT name, LENGTH(name) AS name_len\r\nFROM products;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 1.</b> Hiển thị <code>name</code> và <b>độ dài tên</b> <code>LENGTH(name) AS name_len</code>.</span>\r\n<template class=\"st\">SELECT name, \r\nFROM products</template>\r\n<template class=\"ref\">SELECT name, LENGTH(name) AS name_len FROM products</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 2.</b> Từ <code>customers</code>, hiển thị <code>name</code> và <b>độ dài tên thành phố</b> <code>LENGTH(city) AS city_len</code>.</span>\r\n<template class=\"st\">SELECT name, \r\nFROM customers</template>\r\n<template class=\"ref\">SELECT name, LENGTH(city) AS city_len FROM customers</template></div>\r\n\r\n<h4>2. SUBSTR — cắt một đoạn</h4>\r\n<p><code>SUBSTR(chuỗi, bắt_đầu, độ_dài)</code> cắt ra một đoạn con. Vị trí đầu tiên là <b>1</b>.</p>\r\n<pre class=\"run\">SELECT name, SUBSTR(name, 1, 3) AS prefix\r\nFROM products;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 3.</b> Hiển thị <code>name</code> và <b>3 ký tự đầu</b>: <code>SUBSTR(name, 1, 3) AS prefix</code>.</span>\r\n<template class=\"st\">SELECT name, \r\nFROM products</template>\r\n<template class=\"ref\">SELECT name, SUBSTR(name, 1, 3) AS prefix FROM products</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 4.</b> Hiển thị <code>name</code> và <b>6 ký tự đầu</b>: <code>SUBSTR(name, 1, 6) AS first6</code>.</span>\r\n<template class=\"st\">SELECT name, \r\nFROM products</template>\r\n<template class=\"ref\">SELECT name, SUBSTR(name, 1, 6) AS first6 FROM products</template></div>\r\n\r\n<h4>3. REPLACE — thay thế</h4>\r\n<p><code>REPLACE(chuỗi, tìm, thay)</code> thay mọi lần xuất hiện của một đoạn con.</p>\r\n<pre class=\"run\">SELECT name, REPLACE(city, 'TP. ', '') AS short_city\r\nFROM customers;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 5.</b> Từ <code>customers</code>, bỏ tiền tố <code>'TP. '</code> khỏi <code>city</code>: <code>REPLACE(city, 'TP. ', '') AS short_city</code>. Hiển thị <code>name</code> và <code>short_city</code>.</span>\r\n<template class=\"st\">SELECT name, \r\nFROM customers</template>\r\n<template class=\"ref\">SELECT name, REPLACE(city, 'TP. ', '') AS short_city FROM customers</template></div>\r\n\r\n<h4>4. Ghép chuỗi với ||</h4>\r\n<p>Toán tử <code>||</code> nối các chuỗi lại (bạn đã gặp ở Bài 3). Ghép cả cột lẫn ký tự tĩnh để tạo nhãn dễ đọc.</p>\r\n<pre class=\"run\">SELECT name || ' - ' || category AS label\r\nFROM products;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 6.</b> Tạo cột <code>label</code> dạng <code>name - category</code> bằng <code>name || ' - ' || category</code>.</span>\r\n<template class=\"st\">SELECT \r\nFROM products</template>\r\n<template class=\"ref\">SELECT name || ' - ' || category AS label FROM products</template></div>\r\n\r\n<h4>5. Hàm số: ROUND</h4>\r\n<p><code>ROUND(số)</code> làm tròn về số nguyên; <code>ROUND(số, k)</code> làm tròn tới <code>k</code> chữ số thập phân.</p>\r\n<pre class=\"run\">SELECT name, ROUND(price * 1.1 / 1000.0, 1) AS k_vat\r\nFROM products;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 7.</b> Hiển thị <code>name</code> và giá (đã cộng 10% VAT) tính theo <b>nghìn đồng, một chữ số thập phân</b>: <code>ROUND(price * 1.1 / 1000.0, 1) AS k_vat</code>.</span>\r\n<template class=\"st\">SELECT name, \r\nFROM products</template>\r\n<template class=\"ref\">SELECT name, ROUND(price * 1.1 / 1000.0, 1) AS k_vat FROM products</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 8.</b> Hiển thị <code>name</code> và giá sau khi <b>giảm 10%</b>, làm tròn nguyên: <code>ROUND(price * 0.9) AS sale_price</code>.</span>\r\n<template class=\"st\">SELECT name, \r\nFROM products</template>\r\n<template class=\"ref\">SELECT name, ROUND(price * 0.9) AS sale_price FROM products</template></div>\r\n\r\n<h4>6. Phép chia lấy phần nguyên</h4>\r\n<p>Chia hai số nguyên trong SQL cho ra <b>phần nguyên</b> (bỏ phần lẻ). Đây là cách nhanh để quy giá về \"nghìn đồng\".</p>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 9.</b> Hiển thị <code>name</code> và giá theo nghìn đồng bằng phép chia nguyên: <code>price / 1000 AS price_k</code>.</span>\r\n<template class=\"st\">SELECT name, \r\nFROM products</template>\r\n<template class=\"ref\">SELECT name, price / 1000 AS price_k FROM products</template></div>\r\n\r\n<h4>7. Dùng hàm trong WHERE</h4>\r\n<p>Hàm cũng dùng được trong <code>WHERE</code> để lọc. Ví dụ: tìm sản phẩm có tên dài.</p>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 10.</b> Tìm sản phẩm có <b>tên dài hơn 15 ký tự</b>: hiển thị <code>name</code> và <code>LENGTH(name) AS name_len</code>, lọc <code>LENGTH(name) &gt; 15</code>, sắp theo <code>name_len</code> giảm dần rồi <code>name</code>.</span>\r\n<template class=\"st\">SELECT name, LENGTH(name) AS name_len\r\nFROM products\r\nWHERE \r\nORDER BY </template>\r\n<template class=\"ref\">SELECT name, LENGTH(name) AS name_len FROM products WHERE LENGTH(name) > 15 ORDER BY name_len DESC, name</template></div>\r\n\r\n<h4>8. Ghép nhiều hàm</h4>\r\n<div class=\"ex stretch\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 11. 🔥 Nâng cao.</b> Tạo cột <code>short</code> = 3 ký tự đầu của tên, thêm dấu <code>...</code> phía sau. Dùng <code>SUBSTR(name, 1, 3) || '...'</code>. Hiển thị <code>name</code> và <code>short</code>.</span>\r\n<template class=\"st\">SELECT name, \r\nFROM products</template>\r\n<template class=\"ref\">SELECT name, SUBSTR(name, 1, 3) || '...' AS short FROM products</template></div>\r\n\r\n<h4>🏠 Homework</h4>\r\n<p>Bốn bài làm ở nhà, tự động chấm ngay trên trang. Bài cuối là bài nâng cao.</p>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 1.</b> Hiển thị <code>name</code> và <b>4 ký tự đầu</b>: <code>SUBSTR(name, 1, 4) AS code</code>.</span>\r\n<template class=\"st\">SELECT name, \r\nFROM products</template>\r\n<template class=\"ref\">SELECT name, SUBSTR(name, 1, 4) AS code FROM products</template></div>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 2.</b> Tạo cột <code>label</code> dạng <code>name (category)</code> bằng <code>name || ' (' || category || ')'</code>.</span>\r\n<template class=\"st\">SELECT \r\nFROM products</template>\r\n<template class=\"ref\">SELECT name || ' (' || category || ')' AS label FROM products</template></div>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 3.</b> Hiển thị <code>name</code> và giá cộng <b>8% VAT</b>, làm tròn nguyên: <code>ROUND(price * 1.08) AS price_vat8</code>.</span>\r\n<template class=\"st\">SELECT name, \r\nFROM products</template>\r\n<template class=\"ref\">SELECT name, ROUND(price * 1.08) AS price_vat8 FROM products</template></div>\r\n<div class=\"ex homework stretch\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 4. 🔥 Nâng cao.</b> Tìm sản phẩm có <b>tên ngắn (từ 12 ký tự trở xuống)</b>: hiển thị <code>name</code> và <code>LENGTH(name) AS name_len</code>, lọc <code>LENGTH(name) &lt;= 12</code>, sắp theo <code>name_len</code> rồi <code>name</code>.</span>\r\n<template class=\"st\">SELECT name, LENGTH(name) AS name_len\r\nFROM products\r\nWHERE \r\nORDER BY </template>\r\n<template class=\"ref\">SELECT name, LENGTH(name) AS name_len FROM products WHERE LENGTH(name) <= 12 ORDER BY name_len, name</template></div>","en":"<h3>Lesson 7 — Text & number functions</h3>\r\n<p>SQL doesn't just fetch data — it can <b>transform</b> it right in the query. Want the first few characters of a name? To strip the \"TP.\" prefix off a city? To round a price to one decimal? There's a built-in <b>function</b> for each.</p>\r\n<p>This lesson gathers the most useful functions for <b>text</b> (<code>LENGTH</code>, <code>SUBSTR</code>, <code>REPLACE</code>, concatenation with <code>||</code>) and for <b>numbers</b> (<code>ROUND</code>, integer division). Dates have their own set of functions — you'll learn those in Lesson 8.</p>\r\n<p>As always, give every computed column a name with <code>AS</code>.</p>\r\n\r\n<h4>1. LENGTH — count characters</h4>\r\n<p><code>LENGTH(text)</code> returns the number of characters in a string.</p>\r\n<pre class=\"run\">SELECT name, LENGTH(name) AS name_len\r\nFROM products;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 1.</b> Show <code>name</code> and its <b>length</b> <code>LENGTH(name) AS name_len</code>.</span>\r\n<template class=\"st\">SELECT name, \r\nFROM products</template>\r\n<template class=\"ref\">SELECT name, LENGTH(name) AS name_len FROM products</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 2.</b> From <code>customers</code>, show <code>name</code> and the <b>length of the city name</b> <code>LENGTH(city) AS city_len</code>.</span>\r\n<template class=\"st\">SELECT name, \r\nFROM customers</template>\r\n<template class=\"ref\">SELECT name, LENGTH(city) AS city_len FROM customers</template></div>\r\n\r\n<h4>2. SUBSTR — cut a slice</h4>\r\n<p><code>SUBSTR(text, start, length)</code> cuts out a substring. The first position is <b>1</b>.</p>\r\n<pre class=\"run\">SELECT name, SUBSTR(name, 1, 3) AS prefix\r\nFROM products;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 3.</b> Show <code>name</code> and the <b>first 3 characters</b>: <code>SUBSTR(name, 1, 3) AS prefix</code>.</span>\r\n<template class=\"st\">SELECT name, \r\nFROM products</template>\r\n<template class=\"ref\">SELECT name, SUBSTR(name, 1, 3) AS prefix FROM products</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 4.</b> Show <code>name</code> and the <b>first 6 characters</b>: <code>SUBSTR(name, 1, 6) AS first6</code>.</span>\r\n<template class=\"st\">SELECT name, \r\nFROM products</template>\r\n<template class=\"ref\">SELECT name, SUBSTR(name, 1, 6) AS first6 FROM products</template></div>\r\n\r\n<h4>3. REPLACE — swap text</h4>\r\n<p><code>REPLACE(text, find, replace)</code> swaps every occurrence of a substring.</p>\r\n<pre class=\"run\">SELECT name, REPLACE(city, 'TP. ', '') AS short_city\r\nFROM customers;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 5.</b> From <code>customers</code>, strip the <code>'TP. '</code> prefix off <code>city</code>: <code>REPLACE(city, 'TP. ', '') AS short_city</code>. Show <code>name</code> and <code>short_city</code>.</span>\r\n<template class=\"st\">SELECT name, \r\nFROM customers</template>\r\n<template class=\"ref\">SELECT name, REPLACE(city, 'TP. ', '') AS short_city FROM customers</template></div>\r\n\r\n<h4>4. Joining text with ||</h4>\r\n<p>The <code>||</code> operator concatenates strings (you met it in Lesson 3). Combine columns with static characters to build a readable label.</p>\r\n<pre class=\"run\">SELECT name || ' - ' || category AS label\r\nFROM products;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 6.</b> Build a <code>label</code> column in the form <code>name - category</code> with <code>name || ' - ' || category</code>.</span>\r\n<template class=\"st\">SELECT \r\nFROM products</template>\r\n<template class=\"ref\">SELECT name || ' - ' || category AS label FROM products</template></div>\r\n\r\n<h4>5. Number function: ROUND</h4>\r\n<p><code>ROUND(number)</code> rounds to a whole number; <code>ROUND(number, k)</code> rounds to <code>k</code> decimal places.</p>\r\n<pre class=\"run\">SELECT name, ROUND(price * 1.1 / 1000.0, 1) AS k_vat\r\nFROM products;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 7.</b> Show <code>name</code> and the price (with 10% VAT) in <b>thousands, to one decimal</b>: <code>ROUND(price * 1.1 / 1000.0, 1) AS k_vat</code>.</span>\r\n<template class=\"st\">SELECT name, \r\nFROM products</template>\r\n<template class=\"ref\">SELECT name, ROUND(price * 1.1 / 1000.0, 1) AS k_vat FROM products</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 8.</b> Show <code>name</code> and the price after a <b>10% discount</b>, rounded to a whole number: <code>ROUND(price * 0.9) AS sale_price</code>.</span>\r\n<template class=\"st\">SELECT name, \r\nFROM products</template>\r\n<template class=\"ref\">SELECT name, ROUND(price * 0.9) AS sale_price FROM products</template></div>\r\n\r\n<h4>6. Integer division</h4>\r\n<p>Dividing two integers in SQL gives the <b>whole-number part</b> (the remainder is dropped). It's a quick way to express a price in \"thousands\".</p>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 9.</b> Show <code>name</code> and the price in thousands using integer division: <code>price / 1000 AS price_k</code>.</span>\r\n<template class=\"st\">SELECT name, \r\nFROM products</template>\r\n<template class=\"ref\">SELECT name, price / 1000 AS price_k FROM products</template></div>\r\n\r\n<h4>7. Using functions in WHERE</h4>\r\n<p>Functions also work in <code>WHERE</code> for filtering. For example, find products with long names.</p>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 10.</b> Find products with a <b>name longer than 15 characters</b>: show <code>name</code> and <code>LENGTH(name) AS name_len</code>, filter <code>LENGTH(name) &gt; 15</code>, sorted by <code>name_len</code> descending then <code>name</code>.</span>\r\n<template class=\"st\">SELECT name, LENGTH(name) AS name_len\r\nFROM products\r\nWHERE \r\nORDER BY </template>\r\n<template class=\"ref\">SELECT name, LENGTH(name) AS name_len FROM products WHERE LENGTH(name) > 15 ORDER BY name_len DESC, name</template></div>\r\n\r\n<h4>8. Nesting functions</h4>\r\n<div class=\"ex stretch\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 11. 🔥 Stretch.</b> Build a <code>short</code> column = the first 3 characters of the name, with <code>...</code> appended. Use <code>SUBSTR(name, 1, 3) || '...'</code>. Show <code>name</code> and <code>short</code>.</span>\r\n<template class=\"st\">SELECT name, \r\nFROM products</template>\r\n<template class=\"ref\">SELECT name, SUBSTR(name, 1, 3) || '...' AS short FROM products</template></div>\r\n\r\n<h4>🏠 Homework</h4>\r\n<p>Four take-home exercises, auto-graded right on the page. The last one is a stretch.</p>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 1.</b> Show <code>name</code> and the <b>first 4 characters</b>: <code>SUBSTR(name, 1, 4) AS code</code>.</span>\r\n<template class=\"st\">SELECT name, \r\nFROM products</template>\r\n<template class=\"ref\">SELECT name, SUBSTR(name, 1, 4) AS code FROM products</template></div>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 2.</b> Build a <code>label</code> column in the form <code>name (category)</code> with <code>name || ' (' || category || ')'</code>.</span>\r\n<template class=\"st\">SELECT \r\nFROM products</template>\r\n<template class=\"ref\">SELECT name || ' (' || category || ')' AS label FROM products</template></div>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 3.</b> Show <code>name</code> and the price with <b>8% VAT</b> added, rounded to a whole number: <code>ROUND(price * 1.08) AS price_vat8</code>.</span>\r\n<template class=\"st\">SELECT name, \r\nFROM products</template>\r\n<template class=\"ref\">SELECT name, ROUND(price * 1.08) AS price_vat8 FROM products</template></div>\r\n<div class=\"ex homework stretch\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 4. 🔥 Stretch.</b> Find products with a <b>short name (12 characters or fewer)</b>: show <code>name</code> and <code>LENGTH(name) AS name_len</code>, filter <code>LENGTH(name) &lt;= 12</code>, sorted by <code>name_len</code> then <code>name</code>.</span>\r\n<template class=\"st\">SELECT name, LENGTH(name) AS name_len\r\nFROM products\r\nWHERE \r\nORDER BY </template>\r\n<template class=\"ref\">SELECT name, LENGTH(name) AS name_len FROM products WHERE LENGTH(name) <= 12 ORDER BY name_len, name</template></div>"}},{"t":{"vi":"Ngày tháng & thời gian","en":"Dates & time"},"html":{"vi":"<h3>Bài 8 — Ngày tháng & thời gian</h3>\r\n<p>Gần như mọi bảng dữ liệu đều có cột ngày tháng: ngày đặt hàng, ngày khách gia nhập, ngày sinh… Và rất nhiều câu hỏi kinh doanh xoay quanh thời gian: \"đơn hàng <b>trong tháng 5</b>?\", \"khách gia nhập <b>năm 2024</b>?\", \"mỗi tháng có bao nhiêu đơn?\".</p>\r\n<p>Trong cơ sở dữ liệu này, ngày được lưu dạng chuỗi <code>'YYYY-MM-DD'</code> (ví dụ <code>'2025-05-01'</code>). Định dạng này có một điểm cực tiện: <b>so sánh chuỗi cũng chính là so sánh thời gian</b> — <code>'2025-05-10' &gt; '2025-05-03'</code> đúng như bạn mong đợi.</p>\r\n<p>Bài này dùng hai cột ngày: <code>orders.order_date</code> và <code>customers.joined_at</code>. Bạn sẽ học so sánh ngày, lọc theo khoảng, và trích năm/tháng/ngày bằng <code>strftime</code>.</p>\r\n\r\n<h4>1. So sánh ngày</h4>\r\n<p>Vì ngày ở dạng <code>'YYYY-MM-DD'</code>, bạn dùng ngay các toán tử <code>&gt;</code>, <code>&lt;</code>, <code>&gt;=</code> như với số — nhớ đặt ngày trong dấu nháy đơn.</p>\r\n<pre class=\"run\">SELECT id, order_date\r\nFROM orders\r\nWHERE order_date >= '2025-05-05'\r\nORDER BY order_date;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 1.</b> Lấy <code>id</code>, <code>order_date</code> của các đơn <b>từ ngày 2025-05-05 trở đi</b>, sắp theo <code>order_date</code>.</span>\r\n<template class=\"st\">SELECT id, order_date FROM orders\r\nWHERE \r\nORDER BY order_date</template>\r\n<template class=\"ref\">SELECT id, order_date FROM orders WHERE order_date >= '2025-05-05' ORDER BY order_date</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 2.</b> Lấy <code>id</code>, <code>order_date</code> của các đơn <b>trước ngày 2025-06-01</b>, sắp theo <code>order_date</code>.</span>\r\n<template class=\"st\">SELECT id, order_date FROM orders\r\nWHERE \r\nORDER BY order_date</template>\r\n<template class=\"ref\">SELECT id, order_date FROM orders WHERE order_date < '2025-06-01' ORDER BY order_date</template></div>\r\n\r\n<h4>2. Khoảng thời gian với BETWEEN</h4>\r\n<p><code>BETWEEN</code> hoạt động với ngày y như với số — chọn khoảng bao gồm cả hai đầu.</p>\r\n<pre class=\"run\">SELECT id, order_date\r\nFROM orders\r\nWHERE order_date BETWEEN '2025-05-01' AND '2025-05-31'\r\nORDER BY order_date;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 3.</b> Lấy <code>id</code>, <code>order_date</code> của các đơn <b>trong tháng 5/2025</b> (<code>BETWEEN '2025-05-01' AND '2025-05-31'</code>), sắp theo <code>order_date</code>.</span>\r\n<template class=\"st\">SELECT id, order_date FROM orders\r\nWHERE \r\nORDER BY order_date</template>\r\n<template class=\"ref\">SELECT id, order_date FROM orders WHERE order_date BETWEEN '2025-05-01' AND '2025-05-31' ORDER BY order_date</template></div>\r\n\r\n<h4>3. Trích năm, tháng, ngày với strftime</h4>\r\n<p><code>strftime(mẫu, ngày)</code> rút ra một phần của ngày: <code>'%Y'</code> = năm, <code>'%m'</code> = tháng, <code>'%d'</code> = ngày. Kết quả là chuỗi (ví dụ <code>'2024'</code>, <code>'05'</code>).</p>\r\n<pre class=\"run\">SELECT name, strftime('%Y', joined_at) AS year\r\nFROM customers;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 4.</b> Từ <code>customers</code>, lấy <b>năm gia nhập</b>: <code>strftime('%Y', joined_at) AS year</code>. Hiển thị <code>name</code> và <code>year</code>.</span>\r\n<template class=\"st\">SELECT name, \r\nFROM customers</template>\r\n<template class=\"ref\">SELECT name, strftime('%Y', joined_at) AS year FROM customers</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 5.</b> Từ <code>orders</code>, lấy <b>tháng đặt hàng</b>: <code>strftime('%m', order_date) AS month</code>. Hiển thị <code>id</code> và <code>month</code>.</span>\r\n<template class=\"st\">SELECT id, \r\nFROM orders</template>\r\n<template class=\"ref\">SELECT id, strftime('%m', order_date) AS month FROM orders</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 6.</b> Từ <code>customers</code>, lấy <b>ngày trong tháng</b> khi gia nhập: <code>strftime('%d', joined_at) AS day</code>. Hiển thị <code>name</code> và <code>day</code>.</span>\r\n<template class=\"st\">SELECT name, \r\nFROM customers</template>\r\n<template class=\"ref\">SELECT name, strftime('%d', joined_at) AS day FROM customers</template></div>\r\n\r\n<h4>4. Lọc theo phần của ngày</h4>\r\n<p>Đặt <code>strftime</code> vào <code>WHERE</code> để lọc theo năm hoặc tháng.</p>\r\n<pre class=\"run\">SELECT name\r\nFROM customers\r\nWHERE strftime('%Y', joined_at) = '2024'\r\nORDER BY joined_at;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 7.</b> Lấy <code>name</code> của khách <b>gia nhập năm 2024</b> (<code>strftime('%Y', joined_at) = '2024'</code>), sắp theo <code>joined_at</code>.</span>\r\n<template class=\"st\">SELECT name FROM customers\r\nWHERE \r\nORDER BY joined_at</template>\r\n<template class=\"ref\">SELECT name FROM customers WHERE strftime('%Y', joined_at) = '2024' ORDER BY joined_at</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 8.</b> Lấy <code>id</code>, <code>order_date</code> của các đơn <b>trong tháng 5/2025</b> dùng <code>strftime('%Y-%m', order_date) = '2025-05'</code>, sắp theo <code>order_date</code>.</span>\r\n<template class=\"st\">SELECT id, order_date FROM orders\r\nWHERE \r\nORDER BY order_date</template>\r\n<template class=\"ref\">SELECT id, order_date FROM orders WHERE strftime('%Y-%m', order_date) = '2025-05' ORDER BY order_date</template></div>\r\n\r\n<h4>5. MIN, MAX với ngày</h4>\r\n<p><code>MIN</code>/<code>MAX</code> dùng được cho ngày — tìm đơn sớm nhất và muộn nhất.</p>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 9.</b> Tìm <b>ngày đơn sớm nhất và muộn nhất</b>: <code>MIN(order_date) AS first_order</code>, <code>MAX(order_date) AS last_order</code> từ <code>orders</code>.</span>\r\n<template class=\"st\">SELECT \r\nFROM orders</template>\r\n<template class=\"ref\">SELECT MIN(order_date) AS first_order, MAX(order_date) AS last_order FROM orders</template></div>\r\n\r\n<h4>6. Gộp nhóm theo thời gian</h4>\r\n<p>Kết hợp <code>strftime</code> với <code>GROUP BY</code> để có báo cáo \"theo tháng\", \"theo năm\".</p>\r\n<pre class=\"run\">SELECT strftime('%m', order_date) AS month, COUNT(*) AS n\r\nFROM orders\r\nGROUP BY month\r\nORDER BY month;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 10.</b> Đếm <b>số đơn mỗi tháng</b>: <code>strftime('%m', order_date) AS month</code>, <code>COUNT(*) AS n</code>, gom theo <code>month</code>, sắp theo <code>month</code>.</span>\r\n<template class=\"st\">SELECT strftime('%m', order_date) AS month, COUNT(*) AS n\r\nFROM orders\r\nGROUP BY \r\nORDER BY month</template>\r\n<template class=\"ref\">SELECT strftime('%m', order_date) AS month, COUNT(*) AS n FROM orders GROUP BY month ORDER BY month</template></div>\r\n<div class=\"ex stretch\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 11. 🔥 Nâng cao.</b> Báo cáo <b>theo năm gia nhập</b>: <code>strftime('%Y', joined_at) AS year</code>, <code>COUNT(*) AS n</code>, và <code>MIN(joined_at) AS first_join</code>; gom theo <code>year</code>, sắp theo <code>year</code>.</span>\r\n<template class=\"st\">SELECT strftime('%Y', joined_at) AS year, COUNT(*) AS n, MIN(joined_at) AS first_join\r\nFROM customers\r\nGROUP BY \r\nORDER BY year</template>\r\n<template class=\"ref\">SELECT strftime('%Y', joined_at) AS year, COUNT(*) AS n, MIN(joined_at) AS first_join FROM customers GROUP BY year ORDER BY year</template></div>\r\n\r\n<h4>🏠 Homework</h4>\r\n<p>Bốn bài làm ở nhà, tự động chấm ngay trên trang. Bài cuối là bài nâng cao.</p>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 1.</b> Lấy <code>id</code>, <code>order_date</code> của các đơn <b>trước ngày 2025-06-01</b>, sắp theo <code>order_date</code>.</span>\r\n<template class=\"st\">SELECT id, order_date FROM orders\r\nWHERE \r\nORDER BY order_date</template>\r\n<template class=\"ref\">SELECT id, order_date FROM orders WHERE order_date < '2025-06-01' ORDER BY order_date</template></div>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 2.</b> Từ <code>orders</code>, lấy <b>năm đặt hàng</b>: <code>strftime('%Y', order_date) AS year</code>. Hiển thị <code>id</code> và <code>year</code>.</span>\r\n<template class=\"st\">SELECT id, \r\nFROM orders</template>\r\n<template class=\"ref\">SELECT id, strftime('%Y', order_date) AS year FROM orders</template></div>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 3.</b> Đếm <b>số khách gia nhập mỗi tháng</b>: <code>strftime('%m', joined_at) AS month</code>, <code>COUNT(*) AS n</code>, gom theo <code>month</code>, sắp theo <code>month</code>.</span>\r\n<template class=\"st\">SELECT strftime('%m', joined_at) AS month, COUNT(*) AS n\r\nFROM customers\r\nGROUP BY \r\nORDER BY month</template>\r\n<template class=\"ref\">SELECT strftime('%m', joined_at) AS month, COUNT(*) AS n FROM customers GROUP BY month ORDER BY month</template></div>\r\n<div class=\"ex homework stretch\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 4. 🔥 Nâng cao.</b> Lấy <code>id</code>, <code>order_date</code>, và <code>strftime('%m', order_date) AS month</code> cho các đơn <b>trong tháng 5/2025</b> (<code>BETWEEN '2025-05-01' AND '2025-05-31'</code>), sắp theo <code>order_date</code>.</span>\r\n<template class=\"st\">SELECT id, order_date, strftime('%m', order_date) AS month\r\nFROM orders\r\nWHERE \r\nORDER BY order_date</template>\r\n<template class=\"ref\">SELECT id, order_date, strftime('%m', order_date) AS month FROM orders WHERE order_date BETWEEN '2025-05-01' AND '2025-05-31' ORDER BY order_date</template></div>","en":"<h3>Lesson 8 — Dates & time</h3>\r\n<p>Almost every data table has a date column: order date, sign-up date, birthday… And many business questions revolve around time: \"orders <b>in May</b>?\", \"customers who joined <b>in 2024</b>?\", \"how many orders per month?\".</p>\r\n<p>In this database, dates are stored as <code>'YYYY-MM-DD'</code> strings (e.g. <code>'2025-05-01'</code>). This format has a very handy property: <b>comparing the strings is the same as comparing the dates</b> — <code>'2025-05-10' &gt; '2025-05-03'</code> works exactly as you'd expect.</p>\r\n<p>This lesson uses two date columns: <code>orders.order_date</code> and <code>customers.joined_at</code>. You'll compare dates, filter by range, and extract year/month/day with <code>strftime</code>.</p>\r\n\r\n<h4>1. Comparing dates</h4>\r\n<p>Because dates are <code>'YYYY-MM-DD'</code>, you use the operators <code>&gt;</code>, <code>&lt;</code>, <code>&gt;=</code> just like with numbers — remember to quote the date.</p>\r\n<pre class=\"run\">SELECT id, order_date\r\nFROM orders\r\nWHERE order_date >= '2025-05-05'\r\nORDER BY order_date;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 1.</b> Get <code>id</code>, <code>order_date</code> of orders <b>on or after 2025-05-05</b>, sorted by <code>order_date</code>.</span>\r\n<template class=\"st\">SELECT id, order_date FROM orders\r\nWHERE \r\nORDER BY order_date</template>\r\n<template class=\"ref\">SELECT id, order_date FROM orders WHERE order_date >= '2025-05-05' ORDER BY order_date</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 2.</b> Get <code>id</code>, <code>order_date</code> of orders <b>before 2025-06-01</b>, sorted by <code>order_date</code>.</span>\r\n<template class=\"st\">SELECT id, order_date FROM orders\r\nWHERE \r\nORDER BY order_date</template>\r\n<template class=\"ref\">SELECT id, order_date FROM orders WHERE order_date < '2025-06-01' ORDER BY order_date</template></div>\r\n\r\n<h4>2. Date ranges with BETWEEN</h4>\r\n<p><code>BETWEEN</code> works with dates just like with numbers — an inclusive range.</p>\r\n<pre class=\"run\">SELECT id, order_date\r\nFROM orders\r\nWHERE order_date BETWEEN '2025-05-01' AND '2025-05-31'\r\nORDER BY order_date;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 3.</b> Get <code>id</code>, <code>order_date</code> of orders <b>in May 2025</b> (<code>BETWEEN '2025-05-01' AND '2025-05-31'</code>), sorted by <code>order_date</code>.</span>\r\n<template class=\"st\">SELECT id, order_date FROM orders\r\nWHERE \r\nORDER BY order_date</template>\r\n<template class=\"ref\">SELECT id, order_date FROM orders WHERE order_date BETWEEN '2025-05-01' AND '2025-05-31' ORDER BY order_date</template></div>\r\n\r\n<h4>3. Extracting year, month, day with strftime</h4>\r\n<p><code>strftime(pattern, date)</code> pulls out a part of a date: <code>'%Y'</code> = year, <code>'%m'</code> = month, <code>'%d'</code> = day. The result is text (e.g. <code>'2024'</code>, <code>'05'</code>).</p>\r\n<pre class=\"run\">SELECT name, strftime('%Y', joined_at) AS year\r\nFROM customers;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 4.</b> From <code>customers</code>, get the <b>join year</b>: <code>strftime('%Y', joined_at) AS year</code>. Show <code>name</code> and <code>year</code>.</span>\r\n<template class=\"st\">SELECT name, \r\nFROM customers</template>\r\n<template class=\"ref\">SELECT name, strftime('%Y', joined_at) AS year FROM customers</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 5.</b> From <code>orders</code>, get the <b>order month</b>: <code>strftime('%m', order_date) AS month</code>. Show <code>id</code> and <code>month</code>.</span>\r\n<template class=\"st\">SELECT id, \r\nFROM orders</template>\r\n<template class=\"ref\">SELECT id, strftime('%m', order_date) AS month FROM orders</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 6.</b> From <code>customers</code>, get the <b>day of month</b> they joined: <code>strftime('%d', joined_at) AS day</code>. Show <code>name</code> and <code>day</code>.</span>\r\n<template class=\"st\">SELECT name, \r\nFROM customers</template>\r\n<template class=\"ref\">SELECT name, strftime('%d', joined_at) AS day FROM customers</template></div>\r\n\r\n<h4>4. Filtering by a part of the date</h4>\r\n<p>Put <code>strftime</code> in <code>WHERE</code> to filter by year or mo
