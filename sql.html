customer_id, SUM(oi.qty) AS total_qty\r\nFROM orders o\r\nJOIN order_items oi ON oi.order_id = o.id\r\nGROUP BY </template>\r\n<template class=\"ref\">SELECT o.customer_id, SUM(oi.qty) AS total_qty FROM orders o JOIN order_items oi ON oi.order_id = o.id GROUP BY o.customer_id ORDER BY o.customer_id</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 8.</b> Revenue per <b>category</b>: join <code>order_items</code> to <code>products</code>, group by <code>p.category</code>, show <code>p.category</code> and <code>SUM(p.price * oi.qty) AS revenue</code>, sorted by <code>p.category</code>.</span>\r\n<template class=\"st\">SELECT p.category, SUM(p.price * oi.qty) AS revenue\r\nFROM order_items oi\r\nJOIN products p ON oi.product_id = p.id\r\nGROUP BY </template>\r\n<template class=\"ref\">SELECT p.category, SUM(p.price * oi.qty) AS revenue FROM order_items oi JOIN products p ON oi.product_id = p.id GROUP BY p.category ORDER BY p.category</template></div>\r\n\r\n<h4>6. Joining three tables or more</h4>\r\n<p>Need both the customer name <i>and</i> the product name for each line? Just keep chaining tables — one <code>JOIN … ON …</code> each.</p>\r\n<pre class=\"run\">SELECT c.name AS customer, p.name AS product, oi.qty\r\nFROM order_items oi\r\nJOIN orders o    ON oi.order_id = o.id\r\nJOIN customers c ON o.customer_id = c.id\r\nJOIN products p  ON oi.product_id = p.id\r\nORDER BY oi.id;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 9.</b> For each line item, show <code>c.name AS customer</code>, <code>p.name AS product</code>, <code>oi.qty</code> (join all four tables as above), sorted by <code>oi.id</code>.</span>\r\n<template class=\"st\">SELECT c.name AS customer, p.name AS product, oi.qty\r\nFROM order_items oi\r\nJOIN orders o ON oi.order_id = o.id\r\nJOIN customers c ON o.customer_id = c.id\r\nJOIN products p ON </template>\r\n<template class=\"ref\">SELECT c.name AS customer, p.name AS product, oi.qty FROM order_items oi JOIN orders o ON oi.order_id = o.id JOIN customers c ON o.customer_id = c.id JOIN products p ON oi.product_id = p.id ORDER BY oi.id</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 10.</b> Number of orders per customer (with names): join <code>orders</code> to <code>customers</code>, group by <code>c.id</code>, show <code>c.name AS customer</code> and <code>COUNT(*) AS order_count</code>, sorted by <code>c.id</code>.</span>\r\n<template class=\"st\">SELECT c.name AS customer, COUNT(*) AS order_count\r\nFROM orders o\r\nJOIN customers c ON o.customer_id = c.id\r\nGROUP BY </template>\r\n<template class=\"ref\">SELECT c.name AS customer, COUNT(*) AS order_count FROM orders o JOIN customers c ON o.customer_id = c.id GROUP BY c.id ORDER BY c.id</template></div>\r\n\r\n<h4>7. Putting it all together</h4>\r\n<div class=\"ex stretch\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 11. 🔥 Stretch.</b> <b>Total spend per customer.</b> Join <code>orders</code> → <code>order_items</code> → <code>products</code> → <code>customers</code>, group by <code>c.id</code>, show <code>c.name AS customer</code> and <code>SUM(p.price * oi.qty) AS total_spent</code>, sorted by <code>total_spent</code> descending.</span>\r\n<template class=\"st\">SELECT c.name AS customer, SUM(p.price * oi.qty) AS total_spent\r\nFROM orders o\r\nJOIN order_items oi ON oi.order_id = o.id\r\nJOIN products p ON oi.product_id = p.id\r\nJOIN customers c ON o.customer_id = c.id\r\nGROUP BY c.id\r\nORDER BY </template>\r\n<template class=\"ref\">SELECT c.name AS customer, SUM(p.price * oi.qty) AS total_spent FROM orders o JOIN order_items oi ON oi.order_id = o.id JOIN products p ON oi.product_id = p.id JOIN customers c ON o.customer_id = c.id GROUP BY c.id ORDER BY total_spent DESC</template></div>\r\n\r\n<h4>🏠 Homework</h4>\r\n<p>Four take-home exercises, auto-graded right on the page. The last one is a stretch.</p>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 1.</b> Join <code>orders</code> to <code>customers</code>: show <code>o.order_date</code> and <code>c.name AS customer</code>, sorted by <code>o.order_date</code>.</span>\r\n<template class=\"st\">SELECT o.order_date, c.name AS customer\r\nFROM orders o\r\nJOIN customers c ON </template>\r\n<template class=\"ref\">SELECT o.order_date, c.name AS customer FROM orders o JOIN customers c ON o.customer_id = c.id ORDER BY o.order_date</template></div>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 2.</b> Line items in the <code>'Đồ uống'</code> category: join <code>order_items</code> to <code>products</code>, filter <code>p.category = 'Đồ uống'</code>, show <code>p.name AS product</code>, <code>oi.qty</code>, sorted by <code>oi.id</code>.</span>\r\n<template class=\"st\">SELECT p.name AS product, oi.qty\r\nFROM order_items oi\r\nJOIN products p ON oi.product_id = p.id\r\nWHERE </template>\r\n<template class=\"ref\">SELECT p.name AS product, oi.qty FROM order_items oi JOIN products p ON oi.product_id = p.id WHERE p.category = 'Đồ uống' ORDER BY oi.id</template></div>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 3.</b> Revenue per <b>product</b>: join <code>order_items</code> to <code>products</code>, group by <code>p.id</code>, show <code>p.name AS product</code> and <code>SUM(p.price * oi.qty) AS revenue</code>, sorted by <code>revenue</code> descending.</span>\r\n<template class=\"st\">SELECT p.name AS product, SUM(p.price * oi.qty) AS revenue\r\nFROM order_items oi\r\nJOIN products p ON oi.product_id = p.id\r\nGROUP BY p.id\r\nORDER BY </template>\r\n<template class=\"ref\">SELECT p.name AS product, SUM(p.price * oi.qty) AS revenue FROM order_items oi JOIN products p ON oi.product_id = p.id GROUP BY p.id ORDER BY revenue DESC</template></div>\r\n<div class=\"ex homework stretch\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 4. 🔥 Stretch.</b> <b>Number of distinct products each customer bought.</b> Join <code>orders</code> → <code>order_items</code> → <code>customers</code>, group by <code>c.id</code>, show <code>c.name AS customer</code> and <code>COUNT(DISTINCT oi.product_id) AS distinct_products</code>, sorted by <code>c.id</code>.</span>\r\n<template class=\"st\">SELECT c.name AS customer, COUNT(DISTINCT oi.product_id) AS distinct_products\r\nFROM orders o\r\nJOIN order_items oi ON oi.order_id = o.id\r\nJOIN customers c ON o.customer_id = c.id\r\nGROUP BY c.id\r\nORDER BY </template>\r\n<template class=\"ref\">SELECT c.name AS customer, COUNT(DISTINCT oi.product_id) AS distinct_products FROM orders o JOIN order_items oi ON oi.order_id = o.id JOIN customers c ON o.customer_id = c.id GROUP BY c.id ORDER BY c.id</template></div>"}},{"t":{"vi":"LEFT JOIN & NULL","en":"LEFT JOIN & NULL"},"html":{"vi":"<h3>Bài 9 — LEFT JOIN & NULL</h3>\r\n<p><code>JOIN</code> ở Bài 8 (còn gọi là <b>INNER JOIN</b>) chỉ giữ những dòng <b>khớp được</b> ở cả hai bảng. Nhưng nhiều câu hỏi quan trọng lại nằm ở chỗ <i>không</i> khớp: \"khách nào <b>chưa từng</b> đặt hàng?\", \"sản phẩm nào <b>chưa bán được</b> cái nào?\". INNER JOIN sẽ <b>giấu mất</b> đúng những dòng bạn cần tìm.</p>\r\n<p><code>LEFT JOIN</code> giải quyết việc đó: nó giữ <b>tất cả</b> các dòng của bảng bên trái, và với những dòng không tìm được cặp khớp bên phải, nó điền <code>NULL</code> (giá trị \"trống\"). Nhờ vậy khách hàng không có đơn vẫn xuất hiện — kèm <code>NULL</code> ở các cột của đơn.</p>\r\n<p>Khách hàng <b>Phạm Thị D</b> chưa có đơn nào, và vài sản phẩm chưa bán được — đây là dữ liệu hoàn hảo để luyện <code>LEFT JOIN</code> và cách xử lý <code>NULL</code> bằng <code>IS NULL</code> và <code>COALESCE</code>.</p>\r\n\r\n<h4>1. LEFT JOIN — giữ mọi dòng bên trái</h4>\r\n<p>Đổi <code>JOIN</code> thành <code>LEFT JOIN</code>: mọi khách hàng đều xuất hiện, kể cả người không có đơn (cột đơn hàng sẽ là <code>NULL</code>).</p>\r\n<pre class=\"run\">SELECT c.name AS customer, o.id AS order_id\r\nFROM customers c\r\nLEFT JOIN orders o ON o.customer_id = c.id\r\nORDER BY c.id, o.id;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 1.</b> Ghép <code>customers</code> với <code>orders</code> bằng <code>LEFT JOIN</code>, hiển thị <code>c.name AS customer</code> và <code>o.id AS order_id</code> (mọi khách, kể cả người chưa có đơn), sắp theo <code>c.id, o.id</code>.</span>\r\n<template class=\"st\">SELECT c.name AS customer, o.id AS order_id\r\nFROM customers c\r\nLEFT JOIN orders o ON </template>\r\n<template class=\"ref\">SELECT c.name AS customer, o.id AS order_id FROM customers c LEFT JOIN orders o ON o.customer_id = c.id ORDER BY c.id, o.id</template></div>\r\n\r\n<h4>2. IS NULL — tìm những dòng không khớp</h4>\r\n<p>Không thể so sánh <code>NULL</code> bằng <code>=</code>. Phải dùng <code>IS NULL</code> (hoặc <code>IS NOT NULL</code>). Kết hợp <code>LEFT JOIN</code> + <code>WHERE ... IS NULL</code> là cách kinh điển để tìm \"những cái không có cặp\".</p>\r\n<pre class=\"run\">SELECT c.name AS customer\r\nFROM customers c\r\nLEFT JOIN orders o ON o.customer_id = c.id\r\nWHERE o.id IS NULL;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 2.</b> Tìm khách <b>chưa từng đặt hàng</b>: <code>LEFT JOIN</code> <code>customers</code> với <code>orders</code>, lọc <code>o.id IS NULL</code>, hiển thị <code>c.name AS customer</code>, sắp theo <code>c.id</code>.</span>\r\n<template class=\"st\">SELECT c.name AS customer\r\nFROM customers c\r\nLEFT JOIN orders o ON o.customer_id = c.id\r\nWHERE </template>\r\n<template class=\"ref\">SELECT c.name AS customer FROM customers c LEFT JOIN orders o ON o.customer_id = c.id WHERE o.id IS NULL ORDER BY c.id</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 3.</b> Tìm sản phẩm <b>chưa bán được cái nào</b>: <code>LEFT JOIN</code> <code>products</code> với <code>order_items</code>, lọc <code>oi.id IS NULL</code>, hiển thị <code>p.name AS product</code>, sắp theo <code>p.id</code>.</span>\r\n<template class=\"st\">SELECT p.name AS product\r\nFROM products p\r\nLEFT JOIN order_items oi ON oi.product_id = p.id\r\nWHERE </template>\r\n<template class=\"ref\">SELECT p.name AS product FROM products p LEFT JOIN order_items oi ON oi.product_id = p.id WHERE oi.id IS NULL ORDER BY p.id</template></div>\r\n\r\n<h4>3. Đếm kèm số 0</h4>\r\n<p>Điểm khác biệt tinh tế: <code>COUNT(*)</code> đếm cả dòng, nhưng <code>COUNT(cột)</code> <b>bỏ qua NULL</b>. Vì vậy <code>COUNT(o.id)</code> trên kết quả <code>LEFT JOIN</code> cho ra <b>0</b> đúng với khách không có đơn.</p>\r\n<pre class=\"run\">SELECT c.name AS customer, COUNT(o.id) AS order_count\r\nFROM customers c\r\nLEFT JOIN orders o ON o.customer_id = c.id\r\nGROUP BY c.id\r\nORDER BY c.id;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 4.</b> Đếm <b>số đơn mỗi khách, kể cả 0</b>: <code>LEFT JOIN</code> <code>customers</code> với <code>orders</code>, gom theo <code>c.id</code>, hiển thị <code>c.name AS customer</code> và <code>COUNT(o.id) AS order_count</code>, sắp theo <code>c.id</code>.</span>\r\n<template class=\"st\">SELECT c.name AS customer, COUNT(o.id) AS order_count\r\nFROM customers c\r\nLEFT JOIN orders o ON o.customer_id = c.id\r\nGROUP BY </template>\r\n<template class=\"ref\">SELECT c.name AS customer, COUNT(o.id) AS order_count FROM customers c LEFT JOIN orders o ON o.customer_id = c.id GROUP BY c.id ORDER BY c.id</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 5.</b> Đếm <b>số dòng hàng mỗi khách, kể cả 0</b>: <code>LEFT JOIN</code> <code>customers</code> → <code>orders</code> → <code>order_items</code>, gom theo <code>c.id</code>, hiển thị <code>c.name AS customer</code> và <code>COUNT(oi.id) AS line_count</code>, sắp theo <code>c.id</code>.</span>\r\n<template class=\"st\">SELECT c.name AS customer, COUNT(oi.id) AS line_count\r\nFROM customers c\r\nLEFT JOIN orders o ON o.customer_id = c.id\r\nLEFT JOIN order_items oi ON oi.order_id = o.id\r\nGROUP BY </template>\r\n<template class=\"ref\">SELECT c.name AS customer, COUNT(oi.id) AS line_count FROM customers c LEFT JOIN orders o ON o.customer_id = c.id LEFT JOIN order_items oi ON oi.order_id = o.id GROUP BY c.id ORDER BY c.id</template></div>\r\n\r\n<h4>4. COALESCE — thay NULL bằng giá trị khác</h4>\r\n<p><code>SUM</code> trên nhóm rỗng trả về <code>NULL</code>, không phải 0. <code>COALESCE(x, 0)</code> nghĩa là \"nếu <code>x</code> là NULL thì dùng 0\". Rất hợp cho báo cáo tiền.</p>\r\n<pre class=\"run\">SELECT c.name AS customer,\r\n       COALESCE(SUM(p.price * oi.qty), 0) AS total_spent\r\nFROM customers c\r\nLEFT JOIN orders o      ON o.customer_id = c.id\r\nLEFT JOIN order_items oi ON oi.order_id = o.id\r\nLEFT JOIN products p     ON oi.product_id = p.id\r\nGROUP BY c.id\r\nORDER BY c.id;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 6.</b> Tổng chi tiêu mỗi khách, <b>khách không mua ghi 0</b>: dùng chuỗi <code>LEFT JOIN</code> như ví dụ, hiển thị <code>c.name AS customer</code> và <code>COALESCE(SUM(p.price * oi.qty), 0) AS total_spent</code>, gom theo <code>c.id</code>, sắp theo <code>c.id</code>.</span>\r\n<template class=\"st\">SELECT c.name AS customer, COALESCE(SUM(p.price * oi.qty), 0) AS total_spent\r\nFROM customers c\r\nLEFT JOIN orders o ON o.customer_id = c.id\r\nLEFT JOIN order_items oi ON oi.order_id = o.id\r\nLEFT JOIN products p ON oi.product_id = p.id\r\nGROUP BY </template>\r\n<template class=\"ref\">SELECT c.name AS customer, COALESCE(SUM(p.price * oi.qty), 0) AS total_spent FROM customers c LEFT JOIN orders o ON o.customer_id = c.id LEFT JOIN order_items oi ON oi.order_id = o.id LEFT JOIN products p ON oi.product_id = p.id GROUP BY c.id ORDER BY c.id</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 7.</b> Tổng số lượng bán ra mỗi sản phẩm, <b>chưa bán ghi 0</b>: <code>LEFT JOIN</code> <code>products</code> với <code>order_items</code>, hiển thị <code>p.name AS product</code> và <code>COALESCE(SUM(oi.qty), 0) AS total_qty</code>, gom theo <code>p.id</code>, sắp theo <code>p.id</code>.</span>\r\n<template class=\"st\">SELECT p.name AS product, COALESCE(SUM(oi.qty), 0) AS total_qty\r\nFROM products p\r\nLEFT JOIN order_items oi ON oi.product_id = p.id\r\nGROUP BY </template>\r\n<template class=\"ref\">SELECT p.name AS product, COALESCE(SUM(oi.qty), 0) AS total_qty FROM products p LEFT JOIN order_items oi ON oi.product_id = p.id GROUP BY p.id ORDER BY p.id</template></div>\r\n\r\n<h4>5. IS NOT NULL và HAVING</h4>\r\n<p>Ngược lại, <code>IS NOT NULL</code> giữ những dòng <i>có</i> khớp. Và bạn có thể lọc nhóm \"rỗng\" bằng <code>HAVING COUNT(...) = 0</code>.</p>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 8.</b> Đếm <b>số lần mỗi sản phẩm xuất hiện trong các dòng hàng, kể cả 0</b>: <code>LEFT JOIN</code> <code>products</code> với <code>order_items</code>, hiển thị <code>p.name AS product</code> và <code>COUNT(oi.id) AS times_ordered</code>, gom theo <code>p.id</code>, sắp theo <code>times_ordered</code> giảm dần rồi <code>p.id</code>.</span>\r\n<template class=\"st\">SELECT p.name AS product, COUNT(oi.id) AS times_ordered\r\nFROM products p\r\nLEFT JOIN order_items oi ON oi.product_id = p.id\r\nGROUP BY p.id\r\nORDER BY </template>\r\n<template class=\"ref\">SELECT p.name AS product, COUNT(oi.id) AS times_ordered FROM products p LEFT JOIN order_items oi ON oi.product_id = p.id GROUP BY p.id ORDER BY times_ordered DESC, p.id</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 9.</b> Tìm sản phẩm chưa bán được, <b>bằng HAVING</b>: <code>LEFT JOIN</code> <code>products</code> với <code>order_items</code>, gom theo <code>p.id</code>, giữ nhóm có <code>COUNT(oi.id) = 0</code>, hiển thị <code>p.name AS product</code>, sắp theo <code>p.id</code>.</span>\r\n<template class=\"st\">SELECT p.name AS product\r\nFROM products p\r\nLEFT JOIN order_items oi ON oi.product_id = p.id\r\nGROUP BY p.id\r\nHAVING </template>\r\n<template class=\"ref\">SELECT p.name AS product FROM products p LEFT JOIN order_items oi ON oi.product_id = p.id GROUP BY p.id HAVING COUNT(oi.id) = 0 ORDER BY p.id</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 10.</b> Liệt kê tên các khách <b>có ít nhất một đơn</b> (dùng <code>IS NOT NULL</code>): <code>LEFT JOIN</code> <code>customers</code> với <code>orders</code>, lọc <code>o.id IS NOT NULL</code>, hiển thị <code>DISTINCT c.name AS customer</code>, sắp theo <code>c.id</code>.</span>\r\n<template class=\"st\">SELECT DISTINCT c.name AS customer\r\nFROM customers c\r\nLEFT JOIN orders o ON o.customer_id = c.id\r\nWHERE </template>\r\n<template class=\"ref\">SELECT DISTINCT c.name AS customer FROM customers c LEFT JOIN orders o ON o.customer_id = c.id WHERE o.id IS NOT NULL ORDER BY c.id</template></div>\r\n\r\n<h4>6. Báo cáo tổng hợp không bỏ sót ai</h4>\r\n<div class=\"ex stretch\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 11. 🔥 Nâng cao.</b> Báo cáo mỗi khách gồm <b>số đơn</b> và <b>tổng chi tiêu</b>, <b>không bỏ sót khách nào</b>. Dùng chuỗi <code>LEFT JOIN</code> <code>customers</code> → <code>orders</code> → <code>order_items</code> → <code>products</code>; hiển thị <code>c.name AS customer</code>, <code>COUNT(DISTINCT o.id) AS order_count</code>, <code>COALESCE(SUM(p.price * oi.qty), 0) AS total_spent</code>; gom theo <code>c.id</code>; sắp theo <code>total_spent</code> giảm dần rồi <code>c.id</code>.</span>\r\n<template class=\"st\">SELECT c.name AS customer, COUNT(DISTINCT o.id) AS order_count, COALESCE(SUM(p.price * oi.qty), 0) AS total_spent\r\nFROM customers c\r\nLEFT JOIN orders o ON o.customer_id = c.id\r\nLEFT JOIN order_items oi ON oi.order_id = o.id\r\nLEFT JOIN products p ON oi.product_id = p.id\r\nGROUP BY c.id\r\nORDER BY </template>\r\n<template class=\"ref\">SELECT c.name AS customer, COUNT(DISTINCT o.id) AS order_count, COALESCE(SUM(p.price * oi.qty), 0) AS total_spent FROM customers c LEFT JOIN orders o ON o.customer_id = c.id LEFT JOIN order_items oi ON oi.order_id = o.id LEFT JOIN products p ON oi.product_id = p.id GROUP BY c.id ORDER BY total_spent DESC, c.id</template></div>\r\n\r\n<h4>🏠 Homework</h4>\r\n<p>Bốn bài làm ở nhà, tự động chấm ngay trên trang. Bài cuối là bài nâng cao.</p>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 1.</b> <code>LEFT JOIN</code> <code>customers</code> với <code>orders</code>, hiển thị <code>c.name AS customer</code> và <code>o.order_date</code> (mọi khách, kể cả người chưa có đơn), sắp theo <code>c.id, o.order_date</code>.</span>\r\n<template class=\"st\">SELECT c.name AS customer, o.order_date\r\nFROM customers c\r\nLEFT JOIN orders o ON </template>\r\n<template class=\"ref\">SELECT c.name AS customer, o.order_date FROM customers c LEFT JOIN orders o ON o.customer_id = c.id ORDER BY c.id, o.order_date</template></div>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 2.</b> Tìm khách chưa có đơn <b>bằng HAVING</b>: <code>LEFT JOIN</code> <code>customers</code> với <code>orders</code>, gom theo <code>c.id</code>, giữ nhóm có <code>COUNT(o.id) = 0</code>, hiển thị <code>c.name AS customer</code> và <code>COUNT(o.id) AS order_count</code>, sắp theo <code>c.id</code>.</span>\r\n<template class=\"st\">SELECT c.name AS customer, COUNT(o.id) AS order_count\r\nFROM customers c\r\nLEFT JOIN orders o ON o.customer_id = c.id\r\nGROUP BY c.id\r\nHAVING </template>\r\n<template class=\"ref\">SELECT c.name AS customer, COUNT(o.id) AS order_count FROM customers c LEFT JOIN orders o ON o.customer_id = c.id GROUP BY c.id HAVING COUNT(o.id) = 0 ORDER BY c.id</template></div>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 3.</b> Tổng số lượng bán ra mỗi sản phẩm (chưa bán ghi 0), sắp theo lượng bán: <code>LEFT JOIN</code> <code>products</code> với <code>order_items</code>, hiển thị <code>p.name AS product</code> và <code>COALESCE(SUM(oi.qty), 0) AS total_qty</code>, gom theo <code>p.id</code>, sắp theo <code>total_qty</code> giảm dần rồi <code>p.id</code>.</span>\r\n<template class=\"st\">SELECT p.name AS product, COALESCE(SUM(oi.qty), 0) AS total_qty\r\nFROM products p\r\nLEFT JOIN order_items oi ON oi.product_id = p.id\r\nGROUP BY p.id\r\nORDER BY </template>\r\n<template class=\"ref\">SELECT p.name AS product, COALESCE(SUM(oi.qty), 0) AS total_qty FROM products p LEFT JOIN order_items oi ON oi.product_id = p.id GROUP BY p.id ORDER BY total_qty DESC, p.id</template></div>\r\n<div class=\"ex homework stretch\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 4. 🔥 Nâng cao.</b> Báo cáo mỗi khách gồm số đơn và tổng chi tiêu (không bỏ sót ai), sắp <b>tăng dần</b> theo chi tiêu để khách chưa mua lên đầu. Dùng <code>LEFT JOIN</code> <code>customers</code> → <code>orders</code> → <code>order_items</code> → <code>products</code>; hiển thị <code>c.name AS customer</code>, <code>COUNT(DISTINCT o.id) AS orders</code>, <code>COALESCE(SUM(p.price * oi.qty), 0) AS total_spent</code>; gom theo <code>c.id</code>; sắp theo <code>total_spent</code> tăng dần rồi <code>c.id</code>.</span>\r\n<template class=\"st\">SELECT c.name AS customer, COUNT(DISTINCT o.id) AS orders, COALESCE(SUM(p.price * oi.qty), 0) AS total_spent\r\nFROM customers c\r\nLEFT JOIN orders o ON o.customer_id = c.id\r\nLEFT JOIN order_items oi ON oi.order_id = o.id\r\nLEFT JOIN products p ON oi.product_id = p.id\r\nGROUP BY c.id\r\nORDER BY </template>\r\n<template class=\"ref\">SELECT c.name AS customer, COUNT(DISTINCT o.id) AS orders, COALESCE(SUM(p.price * oi.qty), 0) AS total_spent FROM customers c LEFT JOIN orders o ON o.customer_id = c.id LEFT JOIN order_items oi ON oi.order_id = o.id LEFT JOIN products p ON oi.product_id = p.id GROUP BY c.id ORDER BY total_spent ASC, c.id</template></div>","en":"<h3>Lesson 9 — LEFT JOIN & NULL</h3>\r\n<p>The <code>JOIN</code> from Lesson 8 (also called <b>INNER JOIN</b>) keeps only rows that <b>match</b> in both tables. But many important questions live in the <i>non</i>-matches: \"which customer has <b>never</b> ordered?\", \"which product has <b>never</b> sold?\". An INNER JOIN <b>hides</b> exactly the rows you're looking for.</p>\r\n<p><code>LEFT JOIN</code> solves this: it keeps <b>all</b> rows from the left table, and for rows with no match on the right it fills in <code>NULL</code> (the \"empty\" value). So a customer with no orders still appears — with <code>NULL</code> in the order columns.</p>\r\n<p>Customer <b>Phạm Thị D</b> has no orders, and several products never sold — perfect data to practise <code>LEFT JOIN</code> and handling <code>NULL</code> with <code>IS NULL</code> and <code>COALESCE</code>.</p>\r\n\r\n<h4>1. LEFT JOIN — keep every left row</h4>\r\n<p>Change <code>JOIN</code> to <code>LEFT JOIN</code>: every customer appears, even those with no orders (the order columns will be <code>NULL</code>).</p>\r\n<pre class=\"run\">SELECT c.name AS customer, o.id AS order_id\r\nFROM customers c\r\nLEFT JOIN orders o ON o.customer_id = c.id\r\nORDER BY c.id, o.id;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 1.</b> Join <code>customers</code> to <code>orders</code> with <code>LEFT JOIN</code>, show <code>c.name AS customer</code> and <code>o.id AS order_id</code> (every customer, including those with no orders), sorted by <code>c.id, o.id</code>.</span>\r\n<template class=\"st\">SELECT c.name AS customer, o.id AS order_id\r\nFROM customers c\r\nLEFT JOIN orders o ON </template>\r\n<template class=\"ref\">SELECT c.name AS customer, o.id AS order_id FROM customers c LEFT JOIN orders o ON o.customer_id = c.id ORDER BY c.id, o.id</template></div>\r\n\r\n<h4>2. IS NULL — find the non-matches</h4>\r\n<p>You can't compare <code>NULL</code> with <code>=</code>. You must use <code>IS NULL</code> (or <code>IS NOT NULL</code>). The combination <code>LEFT JOIN</code> + <code>WHERE ... IS NULL</code> is the classic way to find \"the ones with no match\".</p>\r\n<pre class=\"run\">SELECT c.name AS customer\r\nFROM customers c\r\nLEFT JOIN orders o ON o.customer_id = c.id\r\nWHERE o.id IS NULL;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 2.</b> Find customers who have <b>never ordered</b>: <code>LEFT JOIN</code> <code>customers</code> to <code>orders</code>, filter <code>o.id IS NULL</code>, show <code>c.name AS customer</code>, sorted by <code>c.id</code>.</span>\r\n<template class=\"st\">SELECT c.name AS customer\r\nFROM customers c\r\nLEFT JOIN orders o ON o.customer_id = c.id\r\nWHERE </template>\r\n<template class=\"ref\">SELECT c.name AS customer FROM customers c LEFT JOIN orders o ON o.customer_id = c.id WHERE o.id IS NULL ORDER BY c.id</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 3.</b> Find products that have <b>never sold</b>: <code>LEFT JOIN</code> <code>products</code> to <code>order_items</code>, filter <code>oi.id IS NULL</code>, show <code>p.name AS product</code>, sorted by <code>p.id</code>.</span>\r\n<template class=\"st\">SELECT p.name AS product\r\nFROM products p\r\nLEFT JOIN order_items oi ON oi.product_id = p.id\r\nWHERE </template>\r\n<template class=\"ref\">SELECT p.name AS product FROM products p LEFT JOIN order_items oi ON oi.product_id = p.id WHERE oi.id IS NULL ORDER BY p.id</template></div>\r\n\r\n<h4>3. Counting including zero</h4>\r\n<p>A subtle difference: <code>COUNT(*)</code> counts rows, but <code>COUNT(column)</code> <b>skips NULL</b>. So <code>COUNT(o.id)</code> over a <code>LEFT JOIN</code> correctly gives <b>0</b> for a customer with no orders.</p>\r\n<pre class=\"run\">SELECT c.name AS customer, COUNT(o.id) AS order_count\r\nFROM customers c\r\nLEFT JOIN orders o ON o.customer_id = c.id\r\nGROUP BY c.id\r\nORDER BY c.id;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 4.</b> Count the <b>number of orders per customer, including 0</b>: <code>LEFT JOIN</code> <code>customers</code> to <code>orders</code>, group by <code>c.id</code>, show <code>c.name AS customer</code> and <code>COUNT(o.id) AS order_count</code>, sorted by <code>c.id</code>.</span>\r\n<template class=\"st\">SELECT c.name AS customer, COUNT(o.id) AS order_count\r\nFROM customers c\r\nLEFT JOIN orders o ON o.customer_id = c.id\r\nGROUP BY </template>\r\n<template class=\"ref\">SELECT c.name AS customer, COUNT(o.id) AS order_count FROM customers c LEFT JOIN orders o ON o.customer_id = c.id GROUP BY c.id ORDER BY c.id</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 5.</b> Count the <b>number of line items per customer, including 0</b>: <code>LEFT JOIN</code> <code>customers</code> → <code>orders</code> → <code>order_items</code>, group by <code>c.id</code>, show <code>c.name AS customer</code> and <code>COUNT(oi.id) AS line_count</code>, sorted by <code>c.id</code>.</span>\r\n<template class=\"st\">SELECT c.name AS customer, COUNT(oi.id) AS line_count\r\nFROM customers c\r\nLEFT JOIN orders o ON o.customer_id = c.id\r\nLEFT JOIN order_items oi ON oi.order_id = o.id\r\nGROUP BY </template>\r\n<template class=\"ref\">SELECT c.name AS customer, COUNT(oi.id) AS line_count FROM customers c LEFT JOIN orders o ON o.customer_id = c.id LEFT JOIN order_items oi ON oi.order_id = o.id GROUP BY c.id ORDER BY c.id</template></div>\r\n\r\n<h4>4. COALESCE — replace NULL with something else</h4>\r\n<p><code>SUM</code> over an empty group returns <code>NULL</code>, not 0. <code>COALESCE(x, 0)</code> means \"if <code>x</code> is NULL, use 0 instead\". Perfect for money reports.</p>\r\n<pre class=\"run\">SELECT c.name AS customer,\r\n       COALESCE(SUM(p.price * oi.qty), 0) AS total_spent\r\nFROM customers c\r\nLEFT JOIN orders o      ON o.customer_id = c.id\r\nLEFT JOIN order_items oi ON oi.order_id = o.id\r\nLEFT JOIN products p     ON oi.product_id = p.id\r\nGROUP BY c.id\r\nORDER BY c.id;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 6.</b> Total spend per customer, with <b>0 for non-buyers</b>: use the <code>LEFT JOIN</code> chain shown, show <code>c.name AS customer</code> and <code>COALESCE(SUM(p.price * oi.qty), 0) AS total_spent</code>, group by <code>c.id</code>, sorted by <code>c.id</code>.</span>\r\n<template class=\"st\">SELECT c.name AS customer, COALESCE(SUM(p.price * oi.qty), 0) AS total_spent\r\nFROM customers c\r\nLEFT JOIN orders o ON o.customer_id = c.id\r\nLEFT JOIN order_items oi ON oi.order_id = o.id\r\nLEFT JOIN products p ON oi.product_id = p.id\r\nGROUP BY </template>\r\n<template class=\"ref\">SELECT c.name AS customer, COALESCE(SUM(p.price * oi.qty), 0) AS total_spent FROM customers c LEFT JOIN orders o ON o.customer_id = c.id LEFT JOIN order_items oi ON oi.order_id = o.id LEFT JOIN products p ON oi.product_id = p.id GROUP BY c.id ORDER BY c.id</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 7.</b> Total quantity sold per product, with <b>0 for unsold</b>: <code>LEFT JOIN</code> <code>products</code> to <code>order_items</code>, show <code>p.name AS product</code> and <code>COALESCE(SUM(oi.qty), 0) AS total_qty</code>, group by <code>p.id</code>, sorted by <code>p.id</code>.</span>\r\n<template class=\"st\">SELECT p.name AS product, COALESCE(SUM(oi.qty), 0) AS total_qty\r\nFROM products p\r\nLEFT JOIN order_items oi ON oi.product_id = p.id\r\nGROUP BY </template>\r\n<template class=\"ref\">SELECT p.name AS product, COALESCE(SUM(oi.qty), 0) AS total_qty FROM products p LEFT JOIN order_items oi ON oi.product_id = p.id GROUP BY p.id ORDER BY p.id</template></div>\r\n\r\n<h4>5. IS NOT NULL and HAVING</h4>\r\n<p>Conversely, <code>IS NOT NULL</code> keeps rows that <i>did</i> match. And you can filter for \"empty\" groups with <code>HAVING COUNT(...) = 0</code>.</p>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 8.</b> Count <b>how many line items each product appears in, including 0</b>: <code>LEFT JOIN</code> <code>products</code> to <code>order_items</code>, show <code>p.name AS product</code> and <code>COUNT(oi.id) AS times_ordered</code>, group by <code>p.id</code>, sorted by <code>times_ordered</code> descending then <code>p.id</code>.</span>\r\n<template class=\"st\">SELECT p.name AS product, COUNT(oi.id) AS times_ordered\r\nFROM products p\r\nLEFT JOIN order_items oi ON oi.product_id = p.id\r\nGROUP BY p.id\r\nORDER BY </template>\r\n<template class=\"ref\">SELECT p.name AS product, COUNT(oi.id) AS times_ordered FROM products p LEFT JOIN order_items oi ON oi.product_id = p.id GROUP BY p.id ORDER BY times_ordered DESC, p.id</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 9.</b> Find unsold products <b>using HAVING</b>: <code>LEFT JOIN</code> <code>products</code> to <code>order_items</code>, group by <code>p.id</code>, keep groups with <code>COUNT(oi.id) = 0</code>, show <code>p.name AS product</code>, sorted by <code>p.id</code>.</span>\r\n<template class=\"st\">SELECT p.name AS product\r\nFROM products p\r\nLEFT JOIN order_items oi ON oi.product_id = p.id\r\nGROUP BY p.id\r\nHAVING </template>\r\n<template class=\"ref\">SELECT p.name AS product FROM products p LEFT JOIN order_items oi ON oi.product_id = p.id GROUP BY p.id HAVING COUNT(oi.id) = 0 ORDER BY p.id</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 10.</b> List the names of customers who have <b>at least one order</b> (using <code>IS NOT NULL</code>): <code>LEFT JOIN</code> <code>customers</code> to <code>orders</code>, filter <code>o.id IS NOT NULL</code>, show <code>DISTINCT c.name AS customer</code>, sorted by <code>c.id</code>.</span>\r\n<template class=\"st\">SELECT DISTINCT c.name AS customer\r\nFROM customers c\r\nLEFT JOIN orders o ON o.customer_id = c.id\r\nWHERE </template>\r\n<template class=\"ref\">SELECT DISTINCT c.name AS customer FROM customers c LEFT JOIN orders o ON o.customer_id = c.id WHERE o.id IS NOT NULL ORDER BY c.id</template></div>\r\n\r\n<h4>6. A report that leaves no one out</h4>\r\n<div class=\"ex stretch\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 11. 🔥 Stretch.</b> Per-customer report of <b>order count</b> and <b>total spend</b>, <b>leaving no customer out</b>. Use the <code>LEFT JOIN</code> chain <code>customers</code> → <code>orders</code> → <code>order_items</code> → <code>products</code>; show <code>c.name AS customer</code>, <code>COUNT(DISTINCT o.id) AS order_count</code>, <code>COALESCE(SUM(p.price * oi.qty), 0) AS total_spent</code>; group by <code>c.id</code>; sort by <code>total_spent</code> descending then <code>c.id</code>.</span>\r\n<template class=\"st\">SELECT c.name AS customer, COUNT(DISTINCT o.id) AS order_count, COALESCE(SUM(p.price * oi.qty), 0) AS total_spent\r\nFROM customers c\r\nLEFT JOIN orders o ON o.customer_id = c.id\r\nLEFT JOIN order_items oi ON oi.order_id = o.id\r\nLEFT JOIN products p ON oi.product_id = p.id\r\nGROUP BY c.id\r\nORDER BY </template>\r\n<template class=\"ref\">SELECT c.name AS customer, COUNT(DISTINCT o.id) AS order_count, COALESCE(SUM(p.price * oi.qty), 0) AS total_spent FROM customers c LEFT JOIN orders o ON o.customer_id = c.id LEFT JOIN order_items oi ON oi.order_id = o.id LEFT JOIN products p ON oi.product_id = p.id GROUP BY c.id ORDER BY total_spent DESC, c.id</template></div>\r\n\r\n<h4>🏠 Homework</h4>\r\n<p>Four take-home exercises, auto-graded right on the page. The last one is a stretch.</p>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 1.</b> <code>LEFT JOIN</code> <code>customers</code> to <code>orders</code>, show <code>c.name AS customer</code> and <code>o.order_date</code> (every customer, including those with no orders), sorted by <code>c.id, o.order_date</code>.</span>\r\n<template class=\"st\">SELECT c.name AS customer, o.order_date\r\nFROM customers c\r\nLEFT JOIN orders o ON </template>\r\n<template class=\"ref\">SELECT c.name AS customer, o.order_date FROM customers c LEFT JOIN orders o ON o.customer_id = c.id ORDER BY c.id, o.order_date</template></div>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 2.</b> Find customers with no orders <b>using HAVING</b>: <code>LEFT JOIN</code> <code>customers</code> to <code>orders</code>, group by <code>c.id</code>, keep groups with <code>COUNT(o.id) = 0</code>, show <code>c.name AS customer</code> and <code>COUNT(o.id) AS order_count</code>, sorted by <code>c.id</code>.</span>\r\n<template class=\"st\">SELECT c.name AS customer, COUNT(o.id) AS order_count\r\nFROM customers c\r\nLEFT JOIN orders o ON o.customer_id = c.id\r\nGROUP BY c.id\r\nHAVING </template>\r\n<template class=\"ref\">SELECT c.name AS customer, COUNT(o.id) AS order_count FROM customers c LEFT JOIN orders o ON o.customer_id = c.id GROUP BY c.id HAVING COUNT(o.id) = 0 ORDER BY c.id</template></div>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 3.</b> Total quantity sold per product (0 for unsold), sorted by amount sold: <code>LEFT JOIN</code> <code>products</code> to <code>order_items</code>, show <code>p.name AS product</code> and <code>COALESCE(SUM(oi.qty), 0) AS total_qty</code>, group by <code>p.id</code>, sorted by <code>total_qty</code> descending then <code>p.id</code>.</span>\r\n<template class=\"st\">SELECT p.name AS product, COALESCE(SUM(oi.qty), 0) AS total_qty\r\nFROM products p\r\nLEFT JOIN order_items oi ON oi.product_id = p.id\r\nGROUP BY p.id\r\nORDER BY </template>\r\n<template class=\"ref\">SELECT p.name AS product, COALESCE(SUM(oi.qty), 0) AS total_qty FROM products p LEFT JOIN order_items oi ON oi.product_id = p.id GROUP BY p.id ORDER BY total_qty DESC, p.id</template></div>\r\n<div class=\"ex homework stretch\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 4. 🔥 Stretch.</b> Per-customer report of order count and total spend (no customer left out), sorted <b>ascending</b> by spend so non-buyers come first. Use <code>LEFT JOIN</code> <code>customers</code> → <code>orders</code> → <code>order_items</code> → <code>products</code>; show <code>c.name AS customer</code>, <code>COUNT(DISTINCT o.id) AS orders</code>, <code>COALESCE(SUM(p.price * oi.qty), 0) AS total_spent</code>; group by <code>c.id</code>; sort by <code>total_spent</code> ascending then <code>c.id</code>.</span>\r\n<template class=\"st\">SELECT c.name AS customer, COUNT(DISTINCT o.id) AS orders, COALESCE(SUM(p.price * oi.qty), 0) AS total_spent\r\nFROM customers c\r\nLEFT JOIN orders o ON o.customer_id = c.id\r\nLEFT JOIN order_items oi ON oi.order_id = o.id\r\nLEFT JOIN products p ON oi.product_id = p.id\r\nGROUP BY c.id\r\nORDER BY </template>\r\n<template class=\"ref\">SELECT c.name AS customer, COUNT(DISTINCT o.id) AS orders, COALESCE(SUM(p.price * oi.qty), 0) AS total_spent FROM customers c LEFT JOIN orders o ON o.customer_id = c.id LEFT JOIN order_items oi ON oi.order_id = o.id LEFT JOIN products p ON oi.product_id = p.id GROUP BY c.id ORDER BY total_spent ASC, c.id</template></div>"}},{"t":{"vi":"Truy vấn con (subquery)","en":"Subqueries"},"html":{"vi":"<h3>Bài 10 — Truy vấn con (subquery)</h3>\r\n<p>Đôi khi để trả lời một câu hỏi, bạn cần <i>kết quả của một câu hỏi khác</i> trước. \"Sản phẩm nào <b>đắt hơn mức trung bình</b>?\" — muốn biết, trước hết phải tính mức trung bình. \"Khách nào <b>chưa từng đặt hàng</b>?\" — cần danh sách các khách <i>đã</i> đặt để loại ra.</p>\r\n<p><b>Truy vấn con</b> (subquery) là một câu <code>SELECT</code> đặt lồng bên trong một câu <code>SELECT</code> khác, trong ngoặc đơn <code>( … )</code>. SQL chạy truy vấn con trước, lấy kết quả, rồi dùng nó cho truy vấn ngoài.</p>\r\n<p>Có hai kiểu bạn sẽ gặp nhiều nhất: truy vấn con trả về <b>một giá trị</b> (dùng để so sánh, như <code>&gt; (SELECT AVG(...))</code>), và truy vấn con trả về <b>một danh sách</b> (dùng với <code>IN</code> / <code>NOT IN</code>).</p>\r\n\r\n<h4>1. Truy vấn con trả về một giá trị</h4>\r\n<p>Một <code>SELECT</code> tổng hợp (như <code>AVG</code>, <code>MAX</code>) trả về đúng một số. Đặt nó trong ngoặc và so sánh trực tiếp.</p>\r\n<pre class=\"run\">SELECT name, price\r\nFROM products\r\nWHERE price > (SELECT AVG(price) FROM products)\r\nORDER BY price;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 1.</b> Sản phẩm có giá <b>trên mức trung bình</b>: hiển thị <code>name</code>, <code>price</code>, lọc <code>price &gt; (SELECT AVG(price) FROM products)</code>, sắp theo <code>price</code>.</span>\r\n<template class=\"st\">SELECT name, price\r\nFROM products\r\nWHERE price > (</template>\r\n<template class=\"ref\">SELECT name, price FROM products WHERE price > (SELECT AVG(price) FROM products) ORDER BY price</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 2.</b> Sản phẩm có giá <b>dưới mức trung bình</b>: hiển thị <code>name</code>, <code>price</code>, lọc <code>price &lt; (SELECT AVG(price) FROM products)</code>, sắp theo <code>price</code>.</span>\r\n<template class=\"st\">SELECT name, price\r\nFROM products\r\nWHERE price < (</template>\r\n<template class=\"ref\">SELECT name, price FROM products WHERE price < (SELECT AVG(price) FROM products) ORDER BY price</template></div>\r\n\r\n<h4>2. So với một giá trị lọc từ nhóm</h4>\r\n<p>Truy vấn con có thể tự nó có <code>WHERE</code>. Ví dụ: \"rẻ hơn món đắt nhất trong nhóm Đồ uống\".</p>\r\n<pre class=\"run\">SELECT name, price\r\nFROM products\r\nWHERE price < (SELECT MAX(price) FROM products WHERE category = 'Đồ uống')\r\nORDER BY price;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 3.</b> Sản phẩm rẻ hơn <b>món đắt nhất nhóm 'Đồ uống'</b>: hiển thị <code>name</code>, <code>price</code>, lọc <code>price &lt; (SELECT MAX(price) FROM products WHERE category = 'Đồ uống')</code>, sắp theo <code>price</code>.</span>\r\n<template class=\"st\">SELECT name, price\r\nFROM products\r\nWHERE price < (</template>\r\n<template class=\"ref\">SELECT name, price FROM products WHERE price < (SELECT MAX(price) FROM products WHERE category = 'Đồ uống') ORDER BY price</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 4.</b> Sản phẩm đắt hơn <b>'Cà phê đen đá'</b>: hiển thị <code>name</code>, <code>price</code>, lọc <code>price &gt; (SELECT price FROM products WHERE name = 'Cà phê đen đá')</code>, sắp theo <code>price</code>.</span>\r\n<template class=\"st\">SELECT name, price\r\nFROM products\r\nWHERE price > (</template>\r\n<template class=\"ref\">SELECT name, price FROM products WHERE price > (SELECT price FROM products WHERE name = 'Cà phê đen đá') ORDER BY price</template></div>\r\n\r\n<h4>3. Truy vấn con trả về danh sách: IN</h4>\r\n<p>Nếu truy vấn con trả về <b>nhiều dòng một cột</b>, dùng <code>IN</code> để kiểm tra \"có nằm trong danh sách này không\".</p>\r\n<pre class=\"run\">SELECT name\r\nFROM products\r\nWHERE id IN (SELECT product_id FROM order_items)\r\nORDER BY id;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 5.</b> Sản phẩm <b>đã từng được bán</b>: hiển thị <code>name</code>, lọc <code>id IN (SELECT product_id FROM order_items)</code>, sắp theo <code>id</code>.</span>\r\n<template class=\"st\">SELECT name\r\nFROM products\r\nWHERE id IN (</template>\r\n<template class=\"ref\">SELECT name FROM products WHERE id IN (SELECT product_id FROM order_items) ORDER BY id</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 6.</b> Khách hàng <b>đã từng đặt hàng</b>: hiển thị <code>name</code>, lọc <code>id IN (SELECT customer_id FROM orders)</code>, sắp theo <code>id</code>.</span>\r\n<template class=\"st\">SELECT name\r\nFROM customers\r\nWHERE id IN (</template>\r\n<template class=\"ref\">SELECT name FROM customers WHERE id IN (SELECT customer_id FROM orders) ORDER BY id</template></div>\r\n\r\n<h4>4. NOT IN — những cái không nằm trong danh sách</h4>\r\n<p>Đảo lại thành <code>NOT IN</code> để tìm \"những cái vắng mặt\" — một cách khác (bên cạnh <code>LEFT JOIN</code> ở Bài 9) để tìm khách/sản phẩm chưa hoạt động.</p>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 7.</b> Sản phẩm <b>chưa từng được bán</b>: hiển thị <code>name</code>, lọc <code>id NOT IN (SELECT product_id FROM order_items)</code>, sắp theo <code>id</code>.</span>\r\n<template class=\"st\">SELECT name\r\nFROM products\r\nWHERE id NOT IN (</template>\r\n<template class=\"ref\">SELECT name FROM products WHERE id NOT IN (SELECT product_id FROM order_items) ORDER BY id</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 8.</b> Khách hàng <b>chưa từng đặt hàng</b>: hiển thị <code>name</code>, lọc <code>id NOT IN (SELECT customer_id FROM orders)</code>, sắp theo <code>id</code>.</span>\r\n<template class=\"st\">SELECT name\r\nFROM customers\r\nWHERE id NOT IN (</template>\r\n<template class=\"ref\">SELECT name FROM customers WHERE id NOT IN (SELECT customer_id FROM orders) ORDER BY id</template></div>\r\n\r\n<h4>5. Truy vấn con trong SELECT</h4>\r\n<p>Bạn cũng có thể đặt một giá trị tính sẵn vào <i>mỗi dòng</i> để tiện so sánh — ví dụ kèm mức giá trung bình bên cạnh từng sản phẩm.</p>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 9.</b> Với mỗi sản phẩm, hiển thị <code>name</code>, <code>price</code>, và <b>giá trung bình toàn cửa hàng</b> ở cột <code>avg_all</code>: <code>(SELECT ROUND(AVG(price)) FROM products) AS avg_all</code>. Sắp theo <code>id</code>.</span>\r\n<template class=\"st\">SELECT name, price, (SELECT ROUND(AVG(price)) FROM products) AS avg_all\r\nFROM products\r\nORDER BY </template>\r\n<template class=\"ref\">SELECT name, price, (SELECT ROUND(AVG(price)) FROM products) AS avg_all FROM products ORDER BY id</template></div>\r\n\r\n<h4>6. Truy vấn con lồng nhiều tầng</h4>\r\n<p>Một truy vấn con có thể chứa truy vấn con khác. \"Những sản phẩm mà khách số 1 đã mua\" = sản phẩm nằm trong các dòng hàng thuộc các đơn của khách số 1.</p>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 10.</b> Sản phẩm mà <b>khách số 1 đã mua</b>: hiển thị <code>name</code>, lọc <code>id IN (SELECT product_id FROM order_items WHERE order_id IN (SELECT id FROM orders WHERE customer_id = 1))</code>, sắp theo <code>id</code>.</span>\r\n<template class=\"st\">SELECT name\r\nFROM products\r\nWHERE id IN (SELECT product_id FROM order_items WHERE order_id IN (\r\n  </template>\r\n<template class=\"ref\">SELECT name FROM products WHERE id IN (SELECT product_id FROM order_items WHERE order_id IN (SELECT id FROM orders WHERE customer_id = 1)) ORDER BY id</template></div>\r\n\r\n<h4>7. Kết hợp với GROUP BY</h4>\r\n<div class=\"ex stretch\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 11. 🔥 Nâng cao.</b> Những <b>danh mục có giá trung bình cao hơn mức trung bình toàn cửa hàng</b>: gom nhóm theo <code>category</code>, hiển thị <code>category</code> và <code>ROUND(AVG(price)) AS avg_price</code>, giữ nhóm có <code>AVG(price) &gt; (SELECT AVG(price) FROM products)</code>, sắp theo <code>avg_price</code> giảm dần.</span>\r\n<template class=\"st\">SELECT category, ROUND(AVG(price)) AS avg_price\r\nFROM products\r\nGROUP BY category\r\nHAVING AVG(price) > (</template>\r\n<template class=\"ref\">SELECT category, ROUND(AVG(price)) AS avg_price FROM products GROUP BY category HAVING AVG(price) > (SELECT AVG(price) FROM products) ORDER BY avg_price DESC</template></div>\r\n\r\n<h4>🏠 Homework</h4>\r\n<p>Bốn bài làm ở nhà, tự động chấm ngay trên trang. Bài cuối là bài nâng cao.</p>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 1.</b> Sản phẩm có <b>tồn kho trên mức trung bình</b>: hiển thị <code>name</code>, <code>stock</code>, lọc <code>stock &gt; (SELECT AVG(stock) FROM products)</code>, sắp theo <code>stock</code> giảm dần.</span>\r\n<template class=\"st\">SELECT name, stock\r\nFROM products\r\nWHERE stock > (</template>\r\n<template class=\"ref\">SELECT name, stock FROM products WHERE stock > (SELECT AVG(stock) FROM products) ORDER BY stock DESC</template></div>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 2.</b> Sản phẩm đắt hơn <b>giá trung bình của nhóm 'Đồ uống'</b>: hiển thị <code>name</code>, <code>price</code>, lọc <code>price &gt; (SELECT AVG(price) FROM products WHERE category = 'Đồ uống')</code>, sắp theo <code>price</code>.</span>\r\n<template class=\"st\">SELECT name, price\r\nFROM products\r\nWHERE price > (</template>\r\n<template class=\"ref\">SELECT name, price FROM products WHERE price > (SELECT AVG(price) FROM products WHERE category = 'Đồ uống') ORDER BY price</template></div>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 3.</b> Sản phẩm <b>chưa từng được bán</b> (kèm giá): hiển thị <code>name</code>, <code>price</code>, lọc <code>id NOT IN (SELECT product_id FROM order_items)</code>, sắp theo <code>price</code>.</span>\r\n<template class=\"st\">SELECT name, price\r\nFROM products\r\nWHERE id NOT IN (</template>\r\n<template class=\"ref\">SELECT name, price FROM products WHERE id NOT IN (SELECT product_id FROM order_items) ORDER BY price</template></div>\r\n<div class=\"ex homework stretch\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 4. 🔥 Nâng cao.</b> Sản phẩm <b>đắt hơn mọi món trong nhóm 'Đồ uống'</b> (tức đắt hơn món đắt nhất của nhóm đó): hiển thị <code>name</code>, <code>price</code>, lọc <code>price &gt; (SELECT MAX(price) FROM products WHERE category = 'Đồ uống')</code>, sắp theo <code>price</code>.</span>\r\n<template class=\"st\">SELECT name, price\r\nFROM products\r\nWHERE price > (</template>\r\n<template class=\"ref\">SELECT name, price FROM products WHERE price > (SELECT MAX(price) FROM products WHERE category = 'Đồ uống') ORDER BY price</template></div>","en":"<h3>Lesson 10 — Subqueries</h3>\r\n<p>Sometimes, to answer one question you first need <i>the result of another question</i>. \"Which products are <b>above the average price</b>?\" — to know that, you first have to compute the average. \"Which customer has <b>never ordered</b>?\" — you need the list of customers who <i>did</i> order, to exclude them.</p>\r\n<p>A <b>subquery</b> is a <code>SELECT</code> nested inside another <code>SELECT</code>, wrapped in parentheses <code>( … )</code>. SQL runs the subquery first, takes its result, then uses it in the outer query.</p>\r\n<p>Two kinds show up most: a subquery that returns <b>a single value</b> (for comparison, like <code>&gt; (SELECT AVG(...))</code>), and one that returns <b>a list</b> (used with <code>IN</code> / <code>NOT IN</code>).</p>\r\n\r\n<h4>1. A subquery returning one value</h4>\r\n<p>An aggregate <code>SELECT</code> (like <code>AVG</code>, <code>MAX</code>) returns exactly one number. Put it in parentheses and compare directly.</p>\r\n<pre class=\"run\">SELECT name, price\r\nFROM products\r\nWHERE price > (SELECT AVG(price) FROM products)\r\nORDER BY price;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 1.</b> Products priced <b>above average</b>: show <code>name</code>, <code>price</code>, filter <code>price &gt; (SELECT AVG(price) FROM products)</code>, sorted by <code>price</code>.</span>\r\n<template class=\"st\">SELECT name, price\r\nFROM products\r\nWHERE price > (</template>\r\n<template class=\"ref\">SELECT name, price FROM products WHERE price > (SELECT AVG(price) FROM products) ORDER BY price</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 2.</b> Products priced <b>below average</b>: show <code>name</code>, <code>price</code>, filter <code>price &lt; (SELECT AVG(price) FROM products)</code>, sorted by <code>price</code>.</span>\r\n<template class=\"st\">SELECT name, price\r\nFROM products\r\nWHERE price < (</template>\r\n<template class=\"ref\">SELECT name, price FROM products WHERE price < (SELECT AVG(price) FROM products) ORDER BY price</template></div>\r\n\r\n<h4>2. Comparing to a value filtered from a group</h4>\r\n<p>The subquery can have its own <code>WHERE</code>. For example: \"cheaper than the priciest drink\".</p>\r\n<pre class=\"run\">SELECT name, price\r\nFROM products\r\nWHERE price < (SELECT MAX(price) FROM products WHERE category = 'Đồ uống')\r\nORDER BY price;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 3.</b> Products cheaper than the <b>priciest 'Đồ uống' item</b>: show <code>name</code>, <code>price</code>, filter <code>price &lt; (SELECT MAX(price) FROM products WHERE category = 'Đồ uống')</code>, sorted by <code>price</code>.</span>\r\n<template class=\"st\">SELECT name, price\r\nFROM products\r\nWHERE price < (</template>\r\n<template class=\"ref\">SELECT name, price FROM products WHERE price < (SELECT MAX(price) FROM products WHERE category = 'Đồ uống') ORDER BY price</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 4.</b> Products more expensive than <b>'Cà phê đen đá'</b>: show <code>name</code>, <code>price</code>, filter <code>price &gt; (SELECT price FROM products WHERE name = 'Cà phê đen đá')</code>, sorted by <code>price</code>.</span>\r\n<template class=\"st\">SELECT name, price\r\nFROM products\r\nWHERE price > (</template>\r\n<template class=\"ref\">SELECT name, price FROM products WHERE price > (SELECT price FROM products WHERE name = 'Cà phê đen đá') ORDER BY price</template></div>\r\n\r\n<h4>3. A subquery returning a list: IN</h4>\r\n<p>If the subquery returns <b>many rows of one column</b>, use <code>IN</code> to test \"is it in this list?\".</p>\r\n<pre class=\"run\">SELECT name\r\nFROM products\r\nWHERE id IN (SELECT product_id FROM order_items)\r\nORDER BY id;</pre>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 5.</b> Products that <b>have been sold</b>: show <code>name</code>, filter <code>id IN (SELECT product_id FROM order_items)</code>, sorted by <code>id</code>.</span>\r\n<template class=\"st\">SELECT name\r\nFROM products\r\nWHERE id IN (</template>\r\n<template class=\"ref\">SELECT name FROM products WHERE id IN (SELECT product_id FROM order_items) ORDER BY id</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 6.</b> Customers who <b>have ordered</b>: show <code>name</code>, filter <code>id IN (SELECT customer_id FROM orders)</code>, sorted by <code>id</code>.</span>\r\n<template class=\"st\">SELECT name\r\nFROM customers\r\nWHERE id IN (</template>\r\n<template class=\"ref\">SELECT name FROM customers WHERE id IN (SELECT customer_id FROM orders) ORDER BY id</template></div>\r\n\r\n<h4>4. NOT IN — the ones not in the list</h4>\r\n<p>Flip it to <code>NOT IN</code> to find \"the ones missing\" — another way (besides <code>LEFT JOIN</code> from Lesson 9) to find inactive customers/products.</p>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 7.</b> Products that have <b>never sold</b>: show <code>name</code>, filter <code>id NOT IN (SELECT product_id FROM order_items)</code>, sorted by <code>id</code>.</span>\r\n<template class=\"st\">SELECT name\r\nFROM products\r\nWHERE id NOT IN (</template>\r\n<template class=\"ref\">SELECT name FROM products WHERE id NOT IN (SELECT product_id FROM order_items) ORDER BY id</template></div>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 8.</b> Customers who have <b>never ordered</b>: show <code>name</code>, filter <code>id NOT IN (SELECT customer_id FROM orders)</code>, sorted by <code>id</code>.</span>\r\n<template class=\"st\">SELECT name\r\nFROM customers\r\nWHERE id NOT IN (</template>\r\n<template class=\"ref\">SELECT name FROM customers WHERE id NOT IN (SELECT customer_id FROM orders) ORDER BY id</template></div>\r\n\r\n<h4>5. A subquery inside SELECT</h4>\r\n<p>You can also drop a precomputed value onto <i>every row</i> for easy comparison — e.g. showing the average price next to each product.</p>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 9.</b> For each product, show <code>name</code>, <code>price</code>, and the <b>store-wide average price</b> in an <code>avg_all</code> column: <code>(SELECT ROUND(AVG(price)) FROM products) AS avg_all</code>. Sort by <code>id</code>.</span>\r\n<template class=\"st\">SELECT name, price, (SELECT ROUND(AVG(price)) FROM products) AS avg_all\r\nFROM products\r\nORDER BY </template>\r\n<template class=\"ref\">SELECT name, price, (SELECT ROUND(AVG(price)) FROM products) AS avg_all FROM products ORDER BY id</template></div>\r\n\r\n<h4>6. Nesting subqueries</h4>\r\n<p>A subquery can contain another subquery. \"Products that customer 1 bought\" = products found in the line items of customer 1's orders.</p>\r\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 10.</b> Products that <b>customer 1 bought</b>: show <code>name</code>, filter <code>id IN (SELECT product_id FROM order_items WHERE order_id IN (SELECT id FROM orders WHERE customer_id = 1))</code>, sorted by <code>id</code>.</span>\r\n<template class=\"st\">SELECT name\r\nFROM products\r\nWHERE id IN (SELECT product_id FROM order_items WHERE order_id IN (\r\n  </template>\r\n<template class=\"ref\">SELECT name FROM products WHERE id IN (SELECT product_id FROM order_items WHERE order_id IN (SELECT id FROM orders WHERE customer_id = 1)) ORDER BY id</template></div>\r\n\r\n<h4>7. Combining with GROUP BY</h4>\r\n<div class=\"ex stretch\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 11. 🔥 Stretch.</b> Categories whose <b>average price is higher than the store-wide average</b>: group by <code>category</code>, show <code>category</code> and <code>ROUND(AVG(price)) AS avg_price</code>, keep groups with <code>AVG(price) &gt; (SELECT AVG(price) FROM products)</code>, sorted by <code>avg_price</code> descending.</span>\r\n<template class=\"st\">SELECT category, ROUND(AVG(price)) AS avg_price\r\nFROM products\r\nGROUP BY category\r\nHAVING AVG(price) > (</template>\r\n<template class=\"ref\">SELECT category, ROUND(AVG(price)) AS avg_price FROM products GROUP BY category HAVING AVG(price) > (SELECT AVG(price) FROM products) ORDER BY avg_price DESC</template></div>\r\n\r\n<h4>🏠 Homework</h4>\r\n<p>Four take-home exercises, auto-graded right on the page. The last one is a stretch.</p>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 1.</b> Products with <b>above-average stock</b>: show <code>name</code>, <code>stock</code>, filter <code>stock &gt; (SELECT AVG(stock) FROM products)</code>, sorted by <code>stock</code> descending.</span>\r\n<template class=\"st\">SELECT name, stock\r\nFROM products\r\nWHERE stock > (</template>\r\n<template class=\"ref\">SELECT name, stock FROM products WHERE stock > (SELECT AVG(stock) FROM products) ORDER BY stock DESC</template></div>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 2.</b> Products more expensive than the <b>average price of the 'Đồ uống' category</b>: show <code>name</code>, <code>price</code>, filter <code>price &gt; (SELECT AVG(price) FROM products WHERE category = 'Đồ uống')</code>, sorted by <code>price</code>.</span>\r\n<template class=\"st\">SELECT name, price\r\nFROM products\r\nWHERE price > (</template>\r\n<template class=\"ref\">SELECT name, price FROM products WHERE price > (SELECT AVG(price) FROM products WHERE category = 'Đồ uống') ORDER BY price</template></div>\r\n<div class=\"ex homework\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 3.</b> Products that have <b>never sold</b> (with price): show <code>name</code>, <code>price</code>, filter <code>id NOT IN (SELECT product_id FROM order_items)</code>, sorted by <code>price</code>.</span>\r\n<template class=\"st\">SELECT name, price\r\nFROM products\r\nWHERE id NOT IN (</template>\r\n<template class=\"ref\">SELECT name, price FROM products WHERE id NOT IN (SELECT product_id FROM order_items) ORDER BY price</template></div>\r\n<div class=\"ex homework stretch\" data-kind=\"sql\"><span class=\"exq\"><b>Exercise 4. 🔥 Stretch.</b> Products more expensive than <b>every item in the 'Đồ uống' category</b> (i.e. pricier than that category's most expensive item): show <code>name</code>, <code>price</code>, filter <code>price &gt; (SELECT MAX(price) FROM products WHERE category = 'Đồ uống')</code>, sorted by <code>price</code>.</span>\r\n<template class=\"st\">SELECT name, price\r\nFROM products\r\nWHERE price > (</template>\r\n<template class=\"ref\">SELECT name, price FROM products WHERE price > (SELECT MAX(price) FROM products WHERE category = 'Đồ uống') ORDER BY price</template></div>"}},{"t":{"vi":"Đồ án nhỏ: báo cáo bán hàng","en":"Mini project: sales report"},"html":"<h3>Bài 11 — Đồ án nhỏ: báo cáo bán hàng</h3>\n<p><i>(Nội dung đang được biên soạn.)</i></p>"},{"t":{"vi":"INSERT, UPDATE & DELETE — thay đổi dữ liệu","en":"INSERT, UPDATE & DELETE — changing data"},"html":"<h3>Bài 12 — INSERT, UPDATE & DELETE — thay đổi dữ liệu</h3>\n<p><i>(Nội dung đang được biên soạn.)</i></p>"},{"t":{"vi":"CREATE TABLE & kiểu dữ liệu","en":"CREATE TABLE & data types"},"html":"<h3>Bài 13 — CREATE TABLE & kiểu dữ liệu</h3>\n<p><i>(Nội dung đang được biên soạn.)</i></p>"},{"t":{"vi":"Đồ án tốt nghiệp: phân tích khách hàng","en":"Capstone: customer analysis"},"html":"<h3>Bài 14 — Đồ án tốt nghiệp: phân tích khách hàng</h3>\n<p><i>(Nội dung đang được biên soạn.)</i></p>"}]};
