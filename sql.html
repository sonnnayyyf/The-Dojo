const COURSE={"id":"sql","ls":"mk:sql","title":{"vi":"SQL cho công việc dữ liệu","en":"SQL for Data Work"},"sub":{"vi":"20 bài · ~4 giờ tự học · Bài 1 miễn phí. Cơ sở dữ liệu chạy ngay trong trình duyệt — bạn gõ truy vấn thật từ phút đầu tiên.","en":"20 lessons · ~4 hours self-study · Lesson 1 free. The database runs in your browser — you write real queries from minute one."},"lessons":[{"t":{"vi":"SELECT — những truy vấn đầu tiên","en":"SELECT — your first queries"},"kind":"free","html":"<h3>Bài 1 — SELECT: những truy vấn đầu tiên</h3>\n<p>Cơ sở dữ liệu (database) đơn giản là các <b>bảng</b> — giống bảng tính Excel: có cột, có dòng. SQL là ngôn ngữ để <i>đặt câu hỏi</i> cho các bảng đó. Bên dưới là một cơ sở dữ liệu thật của một cửa hàng nhỏ, chạy ngay trong trình duyệt của bạn.</p>\n<h4>Cửa hàng của chúng ta có gì?</h4>\n<p>Bốn bảng — nhưng bài này chỉ cần một: bảng <code>products</code> (sản phẩm) với các cột <code>id, name, category, price</code>. Giá tính bằng đồng (₫).</p>\n<h4>Hình dạng của một truy vấn</h4>\n<pre>SELECT cot_1, cot_2\nFROM ten_bang;</pre>\n<p>Đọc là: \"LẤY các cột này TỪ bảng kia\". Dấu <code>;</code> kết thúc câu lệnh. SQL không phân biệt hoa thường, nhưng thói quen tốt là viết HOA các từ khóa (SELECT, FROM).</p>\n<p><code>SELECT *</code> nghĩa là \"tất cả các cột\". Thử ngay:</p>\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 1.</b> Hiển thị tất cả các cột của mọi sản phẩm trong bảng <code>products</code>.</span>\n<template class=\"st\">SELECT </template>\n<template class=\"ref\">SELECT * FROM products</template></div>\n<h4>Chọn đúng cột mình cần</h4>\n<p>Thực tế hiếm khi cần tất cả. Hãy nêu tên đúng những cột bạn muốn, cách nhau dấu phẩy, theo thứ tự bạn muốn thấy.</p>\n<pre>SELECT name, price FROM products;</pre>\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 2.</b> Chỉ hiển thị hai cột <code>name</code> và <code>price</code>.</span>\n<template class=\"st\"></template>\n<template class=\"ref\">SELECT name, price FROM products</template></div>\n<h4>DISTINCT — loại bỏ trùng lặp</h4>\n<p>Nhiều sản phẩm cùng một danh mục. Nếu chỉ muốn biết \"cửa hàng có những <i>loại</i> hàng nào?\", dùng <code>DISTINCT</code>:</p>\n<pre>SELECT DISTINCT category FROM products;</pre>\n<div class=\"ex\" data-kind=\"sql\"><span class=\"exq\"><b>Bài tập 3.</b> Liệt kê mỗi danh mục (category) đúng một lần.</span>\n<template class=\"st\"></template>\n<template class=\"ref\">SELECT DISTINCT category FROM products</template></div>\n<div class=\"hw\"><b>Ghi nhớ bài 1:</b> SELECT chọn cột · FROM chọn bảng · * là tất cả · DISTINCT bỏ trùng. Chỉ vậy thôi — bài sau mới học cách <i>lọc dòng</i>. Đi chậm mà chắc.</div>\n"},{"t":{"vi":"WHERE — lọc đúng dòng mình cần","en":"WHERE — filtering rows"},"html":"<h3>Bài 2 — WHERE — lọc đúng dòng mình cần</h3>\n<p><i>(Nội dung đang được biên soạn.)</i></p>"},{"t":{"vi":"ORDER BY & LIMIT — sắp xếp và lấy top","en":"ORDER BY & LIMIT — sorting and top-N"},"html":"<h3>Bài 3 — ORDER BY & LIMIT — sắp xếp và lấy top</h3>\n<p><i>(Nội dung đang được biên soạn.)</i></p>"},{"t":{"vi":"Tính toán trong SELECT & AS","en":"Calculations in SELECT & AS"},"html":"<h3>Bài 4 — Tính toán trong SELECT & AS</h3>\n<p><i>(Nội dung đang được biên soạn.)</i></p>"},{"t":{"vi":"Hàm gộp: COUNT, SUM, AVG, MIN, MAX","en":"Aggregates: COUNT, SUM, AVG, MIN, MAX"},"html":"<h3>Bài 5 — Hàm gộp: COUNT, SUM, AVG, MIN, MAX</h3>\n<p><i>(Nội dung đang được biên soạn.)</i></p>"},{"t":{"vi":"GROUP BY & HAVING — báo cáo theo nhóm","en":"GROUP BY & HAVING — grouped reports"},"html":"<h3>Bài 6 — GROUP BY & HAVING — báo cáo theo nhóm</h3>\n<p><i>(Nội dung đang được biên soạn.)</i></p>"},{"t":{"vi":"JOIN — kết nối các bảng","en":"JOIN — connecting tables"},"html":"<h3>Bài 7 — JOIN — kết nối các bảng</h3>\n<p><i>(Nội dung đang được biên soạn.)</i></p>"},{"t":{"vi":"LEFT JOIN & NULL","en":"LEFT JOIN & NULL"},"html":"<h3>Bài 8 — LEFT JOIN & NULL</h3>\n<p><i>(Nội dung đang được biên soạn.)</i></p>"},{"t":{"vi":"Truy vấn con (subquery)","en":"Subqueries"},"html":"<h3>Bài 9 — Truy vấn con (subquery)</h3>\n<p><i>(Nội dung đang được biên soạn.)</i></p>"},{"t":{"vi":"Đồ án nhỏ: báo cáo bán hàng","en":"Mini project: sales report"},"html":"<h3>Bài 10 — Đồ án nhỏ: báo cáo bán hàng</h3>\n<p><i>(Nội dung đang được biên soạn.)</i></p>"},{"t":{"vi":"INSERT — thêm dữ liệu","en":"INSERT — adding data"},"html":"<h3>Bài 11 — INSERT — thêm dữ liệu</h3>\n<p><i>(Nội dung đang được biên soạn.)</i></p>"},{"t":{"vi":"UPDATE & DELETE — sửa và xóa","en":"UPDATE & DELETE — modify and remove"},"html":"<h3>Bài 12 — UPDATE & DELETE — sửa và xóa</h3>\n<p><i>(Nội dung đang được biên soạn.)</i></p>"},{"t":{"vi":"CREATE TABLE — tự thiết kế bảng","en":"CREATE TABLE — designing tables"},"html":"<h3>Bài 13 — CREATE TABLE — tự thiết kế bảng</h3>\n<p><i>(Nội dung đang được biên soạn.)</i></p>"},{"t":{"vi":"CASE WHEN — logic trong truy vấn","en":"CASE WHEN — logic in queries"},"html":"<h3>Bài 14 — CASE WHEN — logic trong truy vấn</h3>\n<p><i>(Nội dung đang được biên soạn.)</i></p>"},{"t":{"vi":"Hàm chuỗi & ngày tháng","en":"String & date functions"},"html":"<h3>Bài 15 — Hàm chuỗi & ngày tháng</h3>\n<p><i>(Nội dung đang được biên soạn.)</i></p>"},{"t":{"vi":"JOIN nâng cao: tự nối & nhiều điều kiện","en":"Advanced JOIN: self-joins & conditions"},"html":"<h3>Bài 16 — JOIN nâng cao: tự nối & nhiều điều kiện</h3>\n<p><i>(Nội dung đang được biên soạn.)</i></p>"},{"t":{"vi":"UNION — ghép kết quả","en":"UNION — stacking results"},"html":"<h3>Bài 17 — UNION — ghép kết quả</h3>\n<p><i>(Nội dung đang được biên soạn.)</i></p>"},{"t":{"vi":"Window function, nhẹ nhàng","en":"Window functions, gently"},"html":"<h3>Bài 18 — Window function, nhẹ nhàng</h3>\n<p><i>(Nội dung đang được biên soạn.)</i></p>"},{"t":{"vi":"Index & vì sao truy vấn chậm","en":"Indexes & why queries get slow"},"html":"<h3>Bài 19 — Index & vì sao truy vấn chậm</h3>\n<p><i>(Nội dung đang được biên soạn.)</i></p>"},{"t":{"vi":"Đồ án tốt nghiệp: phân tích khách hàng","en":"Capstone: customer analysis"},"html":"<h3>Bài 20 — Đồ án tốt nghiệp: phân tích khách hàng</h3>\n<p><i>(Nội dung đang được biên soạn.)</i></p>"}]};
