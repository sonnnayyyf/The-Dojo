i>\r\n<li><code>response.reload()</code></li>\r\n</ol></div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 10. ✍️ Đến lượt bạn.</b> Xử lý một phản hồi API. Giả sử <code>data</code> là thứ một fetch trả về. Đọc <code>data.title</code> và đặt nó vào <code>#out</code> (phải đọc <code>Dune</code>).</span>\r\n<template class=\"st\">&lt;p id=\"out\"&gt;…&lt;/p&gt;\r\n&lt;script&gt;\r\nlet data = { title: \"Dune\", author: \"Herbert\" };\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(document.querySelector('#out').textContent.trim() === 'Dune', 'đặt data.title vào #out');\r\n</template>\r\n</div>\r\n\r\n<h4>5. Ghép lại</h4>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 11. ✍️ Đến lượt bạn.</b> Một form thêm-mục hoạt động. Khi submit, nếu <code>#item</code> rỗng hiện <code>#err</code> = <code>Required</code>; ngược lại nối value thành một <code>&lt;li&gt;</code> trong <code>#list</code> và xóa <code>#err</code>. Nhớ <code>e.preventDefault()</code>.</span>\r\n<template class=\"st\">&lt;form&gt;&lt;input id=\"item\"&gt;&lt;button&gt;Add&lt;/button&gt;&lt;/form&gt;\r\n&lt;p id=\"err\"&gt;&lt;/p&gt;\r\n&lt;ul id=\"list\"&gt;&lt;/ul&gt;\r\n&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nvar form = document.querySelector('form'), item = document.querySelector('#item'), err = document.querySelector('#err');\r\nitem.value = ''; form.dispatchEvent(new Event('submit'));\r\nassert(err.textContent.trim() === 'Required', 'ô rỗng phải hiện \"Required\" và không thêm gì');\r\nassert(document.querySelectorAll('#list li').length === 0, 'không thêm gì khi rỗng');\r\nitem.value = 'Milk'; form.dispatchEvent(new Event('submit'));\r\nvar items = document.querySelectorAll('#list li');\r\nassert(items.length === 1 && items[0].textContent.trim() === 'Milk', 'ô đã điền phải thêm một <li> \"Milk\"');\r\n</template>\r\n</div>\r\n<div class=\"ex stretch\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 12. 🔥 Nâng cao — ✍️ đến lượt bạn.</b> Một bộ kiểm tra đăng ký. Khi submit: nếu <code>#user</code> rỗng → <code>#err</code> = <code>Name required</code>; nếu không mà độ dài <code>#pw</code> &lt; 6 → <code>#err</code> = <code>Password too short</code>; nếu không → <code>#err</code> = <code>Welcome</code>. (Bộ chấm thử cả ba trường hợp.)</span>\r\n<template class=\"st\">&lt;form&gt;&lt;input id=\"user\"&gt;&lt;input id=\"pw\"&gt;&lt;button&gt;Sign up&lt;/button&gt;&lt;/form&gt;\r\n&lt;p id=\"err\"&gt;&lt;/p&gt;\r\n&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nvar form = document.querySelector('form'), user = document.querySelector('#user'), pw = document.querySelector('#pw'), err = document.querySelector('#err');\r\nuser.value = ''; pw.value = 'abcdef'; form.dispatchEvent(new Event('submit'));\r\nassert(err.textContent.trim() === 'Name required', 'tên rỗng → \"Name required\"');\r\nuser.value = 'Mai'; pw.value = '123'; form.dispatchEvent(new Event('submit'));\r\nassert(err.textContent.trim() === 'Password too short', 'mật khẩu ngắn → \"Password too short\"');\r\nuser.value = 'Mai'; pw.value = 'secret123'; form.dispatchEvent(new Event('submit'));\r\nassert(err.textContent.trim() === 'Welcome', 'form hợp lệ → \"Welcome\"');\r\n</template>\r\n</div>\r\n\r\n<h4>🏠 Bài tập về nhà</h4>\r\n<p>Bốn bài mang về nhà, chấm tự động — tất cả đều thực hành. Bài cuối là bài nâng cao.</p>\r\n<div class=\"ex homework\" data-kind=\"quiz\" data-a=\"1\"><span class=\"exq\"><b>Bài tập 1.</b> <code>JSON.parse(text)</code> làm gì?</span>\r\n<ol class=\"opts\">\r\n<li>Biến một object thành text</li>\r\n<li>Biến một chuỗi JSON thành một object</li>\r\n<li>Gửi một request tới máy chủ</li>\r\n<li>Tải lại trang</li>\r\n</ol></div>\r\n<div class=\"ex homework\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 2. ✍️</b> Khi submit, gọi <code>e.preventDefault()</code> và gán <code>#out</code> thành <code>Thanks!</code>.</span>\r\n<template class=\"st\">&lt;form&gt;&lt;input&gt;&lt;button&gt;Send&lt;/button&gt;&lt;/form&gt;\r\n&lt;p id=\"out\"&gt;…&lt;/p&gt;\r\n&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\ndocument.querySelector('form').dispatchEvent(new Event('submit'));\r\nassert(document.querySelector('#out').textContent.trim() === 'Thanks!', 'khi submit, gán #out thành \"Thanks!\"');\r\n</template>\r\n</div>\r\n<div class=\"ex homework\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 3. ✍️</b> Chuỗi <code>text</code> là JSON. Parse nó và <code>console.log</code> trường <code>name</code> (phải in <code>Nam</code>).</span>\r\n<template class=\"st\">&lt;script&gt;\r\nlet text = '{\"name\":\"Nam\",\"age\":25}';\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(_OUT_.trim() === 'Nam', 'parse text và console.log name của nó → \"Nam\"');\r\n</template>\r\n</div>\r\n<div class=\"ex homework stretch\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 4. 🔥 Nâng cao — ✍️</b> Khi submit, nếu value của <code>#age</code> dưới dạng số nhỏ hơn 18 (dùng <code>Number(...)</code>), gán <code>#err</code> thành <code>Too young</code>; ngược lại <code>Allowed</code>.</span>\r\n<template class=\"st\">&lt;form&gt;&lt;input id=\"age\"&gt;&lt;button&gt;Enter&lt;/button&gt;&lt;/form&gt;\r\n&lt;p id=\"err\"&gt;&lt;/p&gt;\r\n&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nvar form = document.querySelector('form'), age = document.querySelector('#age'), err = document.querySelector('#err');\r\nage.value = '15'; form.dispatchEvent(new Event('submit'));\r\nassert(err.textContent.trim() === 'Too young', 'tuổi 15 → \"Too young\"');\r\nage.value = '20'; form.dispatchEvent(new Event('submit'));\r\nassert(err.textContent.trim() === 'Allowed', 'tuổi 20 → \"Allowed\"');\r\n</template>\r\n</div>","en":"<h3>Lesson 15 — Forms, validation &amp; fetch</h3>\r\n<p>Forms are how the web collects real information — a login, a sign-up, a search, a checkout. You already know how to build a form's HTML; now you'll make it <i>work</i> with JavaScript: catch the submit, read what was typed, and <b>validate</b> it (is the email filled in? is the password long enough?) before doing anything. Good validation is what separates a toy from a real product.</p>\r\n<p>You'll also meet the two things that let a page talk to the outside world. <b>JSON</b> is the universal text format for data — every API on earth speaks it — and JavaScript can turn JSON text into objects (<code>JSON.parse</code>) and back (<code>JSON.stringify</code>). And <b>fetch</b> is the function that requests data from a server without reloading the page, the technique behind live search, feeds and \"load more\" buttons.</p>\r\n<p>You'll wire up submit handlers, block empty forms with clear error messages, and turn JSON into a rendered list — exactly what a real app does with data it fetches. Let's handle some real input.</p>\r\n\r\n<h4>1. Handling form submit</h4>\r\n<p>When a form is submitted it tries to <b>reload the page</b> by default. In a JavaScript app you stop that with <code>event.preventDefault()</code>, then handle everything yourself in a <code>submit</code> listener.</p>\r\n<pre class=\"snippet\">let form = document.querySelector(\"form\");\r\nform.addEventListener(\"submit\", function (e) {\r\n  e.preventDefault();               // stop the reload\r\n  document.querySelector(\"#out\").textContent = \"Submitted!\";\r\n});</pre>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 1. ✍️ Your turn.</b> Catch the submit. Add a <code>submit</code> listener to the form that calls <code>e.preventDefault()</code> and sets <code>#out</code> to <code>Sent</code>. (The grader submits the form.)</span>\r\n<template class=\"st\">&lt;form&gt;&lt;input&gt;&lt;button&gt;Send&lt;/button&gt;&lt;/form&gt;\r\n&lt;p id=\"out\"&gt;…&lt;/p&gt;\r\n&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\ndocument.querySelector('form').dispatchEvent(new Event('submit'));\r\nassert(document.querySelector('#out').textContent.trim() === 'Sent', 'on submit, set #out to \"Sent\"');\r\n</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"quiz\" data-a=\"1\"><span class=\"exq\"><b>Exercise 2.</b> Which call stops a form from reloading the page when submitted?</span>\r\n<ol class=\"opts\">\r\n<li><code>e.stop()</code></li>\r\n<li><code>e.preventDefault()</code></li>\r\n<li><code>form.reload()</code></li>\r\n<li><code>return true</code></li>\r\n</ol></div>\r\n\r\n<h4>2. Reading fields &amp; validating</h4>\r\n<p>Inside the submit handler, read each field's <code>.value</code> and check it. If something's wrong, show a message and stop; otherwise proceed. This is <b>validation</b>.</p>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 3. ✍️ Your turn.</b> Require a name. On submit, if <code>#name</code>'s value is empty, set <code>#err</code> to <code>Required</code>; otherwise set it to <code>OK</code>. (The grader tests both an empty and a filled field.)</span>\r\n<template class=\"st\">&lt;form&gt;&lt;input id=\"name\"&gt;&lt;button&gt;Go&lt;/button&gt;&lt;/form&gt;\r\n&lt;p id=\"err\"&gt;&lt;/p&gt;\r\n&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nvar form = document.querySelector('form'), name = document.querySelector('#name'), err = document.querySelector('#err');\r\nname.value = ''; form.dispatchEvent(new Event('submit'));\r\nassert(err.textContent.trim() === 'Required', 'an empty name should show \"Required\"');\r\nname.value = 'Mai'; form.dispatchEvent(new Event('submit'));\r\nassert(err.textContent.trim() === 'OK', 'a filled name should show \"OK\"');\r\n</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 4. ✍️ Your turn.</b> Check length. On submit, if <code>#pw</code>'s value has fewer than 6 characters (<code>.length &lt; 6</code>), set <code>#err</code> to <code>Too short</code>; otherwise <code>Good</code>.</span>\r\n<template class=\"st\">&lt;form&gt;&lt;input id=\"pw\"&gt;&lt;button&gt;Set&lt;/button&gt;&lt;/form&gt;\r\n&lt;p id=\"err\"&gt;&lt;/p&gt;\r\n&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nvar form = document.querySelector('form'), pw = document.querySelector('#pw'), err = document.querySelector('#err');\r\npw.value = '123'; form.dispatchEvent(new Event('submit'));\r\nassert(err.textContent.trim() === 'Too short', 'a 3-character password should show \"Too short\"');\r\npw.value = 'longenough'; form.dispatchEvent(new Event('submit'));\r\nassert(err.textContent.trim() === 'Good', 'a long password should show \"Good\"');\r\n</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 5. ✍️ Your turn.</b> Check an email looks valid. On submit, if <code>#email</code>'s value does <b>not</b> contain an <code>@</code> (use <code>.includes(\"@\")</code>), set <code>#err</code> to <code>Invalid</code>; otherwise <code>Valid</code>.</span>\r\n<template class=\"st\">&lt;form&gt;&lt;input id=\"email\"&gt;&lt;button&gt;Check&lt;/button&gt;&lt;/form&gt;\r\n&lt;p id=\"err\"&gt;&lt;/p&gt;\r\n&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nvar form = document.querySelector('form'), email = document.querySelector('#email'), err = document.querySelector('#err');\r\nemail.value = 'nope'; form.dispatchEvent(new Event('submit'));\r\nassert(err.textContent.trim() === 'Invalid', 'an address with no @ should show \"Invalid\"');\r\nemail.value = 'me@dojo.dev'; form.dispatchEvent(new Event('submit'));\r\nassert(err.textContent.trim() === 'Valid', 'a proper address should show \"Valid\"');\r\n</template>\r\n</div>\r\n\r\n<h4>3. JSON — the language of data</h4>\r\n<p><b>JSON</b> is text that looks like JavaScript objects and arrays. <code>JSON.parse(text)</code> turns a JSON string into a real object you can read; <code>JSON.stringify(obj)</code> does the reverse. This is how data travels between apps and servers.</p>\r\n<pre class=\"snippet\">let text = '{\"name\":\"Mai\",\"age\":20}';\r\nlet user = JSON.parse(text);\r\nconsole.log(user.name);            // Mai\r\nconsole.log(JSON.stringify(user)); // back to text</pre>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 6. ✍️ Your turn.</b> Parse JSON. The variable <code>text</code> is a JSON string. <code>JSON.parse</code> it into <code>user</code>, then <code>console.log(user.city)</code> (should print <code>Hanoi</code>).</span>\r\n<template class=\"st\">&lt;script&gt;\r\nlet text = '{\"city\":\"Hanoi\",\"population\":8000000}';\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(_OUT_.trim() === 'Hanoi', 'parse text and console.log(user.city) → \"Hanoi\"');\r\n</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 7. ✍️ Your turn.</b> Make JSON. Create <code>let book = { title: \"Dune\" };</code>, then <code>console.log(JSON.stringify(book))</code> (should print <code>{\"title\":\"Dune\"}</code>).</span>\r\n<template class=\"st\">&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(_OUT_.trim() === '{\"title\":\"Dune\"}', 'console.log(JSON.stringify(book)) should print {\"title\":\"Dune\"}');\r\n</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 8. ✍️ Your turn.</b> Render fetched-style data. <code>text</code> is a JSON array of book objects. Parse it, then loop to fill <code>#list</code> with an <code>&lt;li&gt;</code> per title. (Three items should appear.)</span>\r\n<template class=\"st\">&lt;ul id=\"list\"&gt;&lt;/ul&gt;\r\n&lt;script&gt;\r\nlet text = '[{\"title\":\"Dune\"},{\"title\":\"Emma\"},{\"title\":\"1984\"}]';\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nvar items = document.querySelectorAll('#list li');\r\nassert(items.length === 3, 'parse the JSON and render three <li> items');\r\nassert(items[0].textContent.trim() === 'Dune' && items[2].textContent.trim() === '1984', 'the items should be the book titles in order');\r\n</template>\r\n</div>\r\n\r\n<h4>4. fetch — data from a server</h4>\r\n<p>To load data from an API without reloading, you use <code>fetch(url)</code>. It returns a <b>promise</b>, so you chain <code>.then()</code> to handle the response when it arrives — first turning it into JSON, then using it:</p>\r\n<pre class=\"snippet\">fetch(\"https://api.example.com/books\")\r\n  .then(response =&gt; response.json())   // parse the JSON body\r\n  .then(data =&gt; {\r\n    console.log(data);                 // now use the data\r\n  });</pre>\r\n<p>The data you get back is JSON — exactly what you practised parsing above. (This box can't reach the network, so real requests are a deployed-site thing, but the shape is always this.)</p>\r\n<div class=\"ex\" data-kind=\"quiz\" data-a=\"1\"><span class=\"exq\"><b>Exercise 9.</b> After <code>fetch(url)</code>, what do you call to turn the response body into a usable object?</span>\r\n<ol class=\"opts\">\r\n<li><code>response.text</code> only</li>\r\n<li><code>response.json()</code></li>\r\n<li><code>JSON.fetch()</code></li>\r\n<li><code>response.reload()</code></li>\r\n</ol></div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 10. ✍️ Your turn.</b> Handle an API response. Pretend <code>data</code> is what a fetch returned. Read <code>data.title</code> and put it into <code>#out</code> (should read <code>Dune</code>).</span>\r\n<template class=\"st\">&lt;p id=\"out\"&gt;…&lt;/p&gt;\r\n&lt;script&gt;\r\nlet data = { title: \"Dune\", author: \"Herbert\" };\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(document.querySelector('#out').textContent.trim() === 'Dune', 'put data.title into #out');\r\n</template>\r\n</div>\r\n\r\n<h4>5. Put it together</h4>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 11. ✍️ Your turn.</b> A working add-item form. On submit, if <code>#item</code> is empty show <code>#err</code> = <code>Required</code>; otherwise append the value as an <code>&lt;li&gt;</code> in <code>#list</code> and clear <code>#err</code>. Remember <code>e.preventDefault()</code>.</span>\r\n<template class=\"st\">&lt;form&gt;&lt;input id=\"item\"&gt;&lt;button&gt;Add&lt;/button&gt;&lt;/form&gt;\r\n&lt;p id=\"err\"&gt;&lt;/p&gt;\r\n&lt;ul id=\"list\"&gt;&lt;/ul&gt;\r\n&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nvar form = document.querySelector('form'), item = document.querySelector('#item'), err = document.querySelector('#err');\r\nitem.value = ''; form.dispatchEvent(new Event('submit'));\r\nassert(err.textContent.trim() === 'Required', 'empty input should show \"Required\" and add nothing');\r\nassert(document.querySelectorAll('#list li').length === 0, 'nothing should be added when empty');\r\nitem.value = 'Milk'; form.dispatchEvent(new Event('submit'));\r\nvar items = document.querySelectorAll('#list li');\r\nassert(items.length === 1 && items[0].textContent.trim() === 'Milk', 'a filled input should add an <li> \"Milk\"');\r\n</template>\r\n</div>\r\n<div class=\"ex stretch\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 12. 🔥 Stretch — ✍️ your turn.</b> A sign-up validator. On submit: if <code>#user</code> is empty → <code>#err</code> = <code>Name required</code>; else if <code>#pw</code>'s length &lt; 6 → <code>#err</code> = <code>Password too short</code>; else → <code>#err</code> = <code>Welcome</code>. (The grader tests all three cases.)</span>\r\n<template class=\"st\">&lt;form&gt;&lt;input id=\"user\"&gt;&lt;input id=\"pw\"&gt;&lt;button&gt;Sign up&lt;/button&gt;&lt;/form&gt;\r\n&lt;p id=\"err\"&gt;&lt;/p&gt;\r\n&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nvar form = document.querySelector('form'), user = document.querySelector('#user'), pw = document.querySelector('#pw'), err = document.querySelector('#err');\r\nuser.value = ''; pw.value = 'abcdef'; form.dispatchEvent(new Event('submit'));\r\nassert(err.textContent.trim() === 'Name required', 'empty name → \"Name required\"');\r\nuser.value = 'Mai'; pw.value = '123'; form.dispatchEvent(new Event('submit'));\r\nassert(err.textContent.trim() === 'Password too short', 'short password → \"Password too short\"');\r\nuser.value = 'Mai'; pw.value = 'secret123'; form.dispatchEvent(new Event('submit'));\r\nassert(err.textContent.trim() === 'Welcome', 'valid form → \"Welcome\"');\r\n</template>\r\n</div>\r\n\r\n<h4>🏠 Homework</h4>\r\n<p>Four take-home exercises, auto-graded — all hands-on. The last one is a stretch.</p>\r\n<div class=\"ex homework\" data-kind=\"quiz\" data-a=\"1\"><span class=\"exq\"><b>Exercise 1.</b> What does <code>JSON.parse(text)</code> do?</span>\r\n<ol class=\"opts\">\r\n<li>Turns an object into text</li>\r\n<li>Turns a JSON string into an object</li>\r\n<li>Sends a request to a server</li>\r\n<li>Reloads the page</li>\r\n</ol></div>\r\n<div class=\"ex homework\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 2. ✍️</b> On submit, call <code>e.preventDefault()</code> and set <code>#out</code> to <code>Thanks!</code>.</span>\r\n<template class=\"st\">&lt;form&gt;&lt;input&gt;&lt;button&gt;Send&lt;/button&gt;&lt;/form&gt;\r\n&lt;p id=\"out\"&gt;…&lt;/p&gt;\r\n&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\ndocument.querySelector('form').dispatchEvent(new Event('submit'));\r\nassert(document.querySelector('#out').textContent.trim() === 'Thanks!', 'on submit, set #out to \"Thanks!\"');\r\n</template>\r\n</div>\r\n<div class=\"ex homework\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 3. ✍️</b> The string <code>text</code> is JSON. Parse it and <code>console.log</code> the <code>name</code> field (should print <code>Nam</code>).</span>\r\n<template class=\"st\">&lt;script&gt;\r\nlet text = '{\"name\":\"Nam\",\"age\":25}';\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(_OUT_.trim() === 'Nam', 'parse text and console.log its name → \"Nam\"');\r\n</template>\r\n</div>\r\n<div class=\"ex homework stretch\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 4. 🔥 Stretch — ✍️</b> On submit, if <code>#age</code>'s value as a number is under 18 (use <code>Number(...)</code>), set <code>#err</code> to <code>Too young</code>; otherwise <code>Allowed</code>.</span>\r\n<template class=\"st\">&lt;form&gt;&lt;input id=\"age\"&gt;&lt;button&gt;Enter&lt;/button&gt;&lt;/form&gt;\r\n&lt;p id=\"err\"&gt;&lt;/p&gt;\r\n&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nvar form = document.querySelector('form'), age = document.querySelector('#age'), err = document.querySelector('#err');\r\nage.value = '15'; form.dispatchEvent(new Event('submit'));\r\nassert(err.textContent.trim() === 'Too young', 'age 15 → \"Too young\"');\r\nage.value = '20'; form.dispatchEvent(new Event('submit'));\r\nassert(err.textContent.trim() === 'Allowed', 'age 20 → \"Allowed\"');\r\n</template>\r\n</div>"}},{"t":{"vi":"Capstone: ứng dụng web tương tác","en":"Capstone: an interactive web app"},"kind":"free","html":null}]};
