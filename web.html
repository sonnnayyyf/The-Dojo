const COURSE={"id":"web","ls":"mk:web","title":{"vi":"Lập trình Web căn bản","en":"Web Programming Fundamentals"},"sub":{"vi":"16 bài · front-end từ số 0 · Bài 1 miễn phí. HTML → CSS → JavaScript, xem kết quả trang web chạy ngay trong trình duyệt.","en":"16 lessons · front-end from zero · Lesson 1 free. HTML → CSS → JavaScript, with the live website rendering right in your browser."},"lessons":[{"t":{"vi":"Web hoạt động như thế nào","en":"How the web works"},"kind":"free","html":{"vi":"<h3>Bài 1 — Web hoạt động như thế nào</h3>\r\n<p>Mỗi lần bạn mở một trang web — trang tin tức, một cửa hàng, một ứng dụng xem video — rất nhiều thứ diễn ra trong nửa giây trước khi trang hiện ra. Thiết bị của bạn gửi một <b>yêu cầu (request)</b> qua internet đến một máy tính khác, máy tính đó gửi các tệp về, và <b>trình duyệt (browser)</b> của bạn biến những tệp đó thành trang mà bạn nhìn thấy và chạm vào. Trước khi viết dòng code đầu tiên, hiểu được hành trình này rất đáng giá. Đó là mô hình tư duy mà cả khóa học này dựa vào.</p>\r\n<p>Đây là ý tưởng cốt lõi ta sẽ xây dựng suốt mười sáu bài: một trang web được tạo từ <b>ba ngôn ngữ riêng biệt</b>, mỗi ngôn ngữ một nhiệm vụ. <b>HTML</b> là <i>cấu trúc</i> — tiêu đề, đoạn văn, hình ảnh và nút bấm (phần \"cái gì\"). <b>CSS</b> là <i>kiểu dáng</i> — màu sắc, khoảng cách, phông chữ và bố cục (phần \"trông ra sao\"). <b>JavaScript</b> là <i>hành vi</i> — điều gì xảy ra khi bạn nhấp, gõ hay cuộn (phần \"làm được gì\"). Cũng ba ngôn ngữ đó vận hành <i>mọi</i> trang web trên đời, từ một blog cá nhân đến một ngân hàng.</p>\r\n<p>Bài đầu tiên này là để <i>nhìn thấy</i> bức tranh đó thật rõ, để bạn không bao giờ lẫn lộn ngôn ngữ nào làm việc gì. Chưa cần thuộc cú pháp nào cả — thay vào đó bạn sẽ trả lời các câu hỏi nhanh và <b>chạy những trang nhỏ thật</b> ngay tại đây trong trình duyệt để thấy từng lớp hoạt động. Trả lời sai cũng không sao: đáp án đúng sẽ sáng lên để bạn học ngay.</p>\r\n\r\n<h4>1. Hành trình yêu cầu – phản hồi</h4>\r\n<p>Khi bạn gõ một địa chỉ (một <b>URL</b>) và nhấn Enter, trình duyệt của bạn (bên <b>client</b>) gửi một <b>yêu cầu (request)</b> đến một <b>máy chủ (server)</b> — một máy tính đâu đó có nhiệm vụ lưu và trao ra các tệp web. Máy chủ gửi lại một <b>phản hồi (response)</b>: các tệp của trang. Sự qua lại này chính là nhịp đập của web.</p>\r\n<figure class=\"diagram\">\r\n<svg viewBox=\"0 0 470 170\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"13\">\r\n  <rect x=\"20\" y=\"55\" width=\"130\" height=\"60\" rx=\"8\" fill=\"#121C30\" stroke=\"#7FD1C0\"/>\r\n  <text x=\"85\" y=\"82\" text-anchor=\"middle\" fill=\"#E8E4D8\" font-size=\"14\">Trình duyệt</text>\r\n  <text x=\"85\" y=\"102\" text-anchor=\"middle\" fill=\"#8FA0BC\" font-size=\"11\">(client)</text>\r\n  <rect x=\"320\" y=\"55\" width=\"130\" height=\"60\" rx=\"8\" fill=\"#121C30\" stroke=\"#F5B942\"/>\r\n  <text x=\"385\" y=\"82\" text-anchor=\"middle\" fill=\"#E8E4D8\" font-size=\"14\">Máy chủ</text>\r\n  <text x=\"385\" y=\"102\" text-anchor=\"middle\" fill=\"#8FA0BC\" font-size=\"11\">(giữ các tệp)</text>\r\n  <line x1=\"152\" y1=\"72\" x2=\"316\" y2=\"72\" stroke=\"#F5B942\" stroke-width=\"2\" marker-end=\"url(#ar)\"/>\r\n  <text x=\"234\" y=\"64\" text-anchor=\"middle\" fill=\"#F5B942\" font-size=\"12\">1. yêu cầu →</text>\r\n  <line x1=\"318\" y1=\"100\" x2=\"154\" y2=\"100\" stroke=\"#7FD1C0\" stroke-width=\"2\" marker-end=\"url(#ar2)\"/>\r\n  <text x=\"236\" y=\"118\" text-anchor=\"middle\" fill=\"#7FD1C0\" font-size=\"12\">← 2. phản hồi (HTML, CSS, JS)</text>\r\n  <defs>\r\n    <marker id=\"ar\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L7,3 L0,6 Z\" fill=\"#F5B942\"/></marker>\r\n    <marker id=\"ar2\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L7,3 L0,6 Z\" fill=\"#7FD1C0\"/></marker>\r\n  </defs>\r\n</svg>\r\n<figcaption>Trình duyệt hỏi; máy chủ trả lời bằng các tệp tạo nên trang.</figcaption>\r\n</figure>\r\n<div class=\"ex\" data-kind=\"quiz\" data-a=\"1\"><span class=\"exq\"><b>Bài tập 1.</b> Trong hành trình này, <b>máy chủ (server)</b> làm gì?</span>\r\n<ol class=\"opts\">\r\n<li>Vẽ trang lên màn hình của bạn.</li>\r\n<li>Lưu các tệp web và gửi trả lại khi được yêu cầu.</li>\r\n<li>Quyết định nút bấm có màu gì.</li>\r\n<li>Chính là trình duyệt của bạn.</li>\r\n</ol></div>\r\n<div class=\"ex\" data-kind=\"quiz\" data-a=\"2\"><span class=\"exq\"><b>Bài tập 2.</b> Thông điệp trình duyệt gửi đi để xin một trang được gọi là…</span>\r\n<ol class=\"opts\">\r\n<li>phản hồi (response)</li>\r\n<li>bảng kiểu (stylesheet)</li>\r\n<li>yêu cầu (request)</li>\r\n<li>máy chủ (server)</li>\r\n</ol></div>\r\n\r\n<h4>2. Ba ngôn ngữ, ba nhiệm vụ</h4>\r\n<p>Phản hồi (hầu như) gồm ba loại tệp, mỗi loại một trách nhiệm duy nhất. Hãy ghi bảng này vào đầu — cả khóa học được sắp xếp quanh nó.</p>\r\n<table class=\"res\"><tr><th>Ngôn ngữ</th><th>Nhiệm vụ</th><th>Ví như một căn nhà</th></tr>\r\n<tr><td><code>HTML</code></td><td><b>Cấu trúc</b> — tiêu đề, chữ, hình, nút</td><td>tường &amp; các phòng</td></tr>\r\n<tr><td><code>CSS</code></td><td><b>Kiểu dáng</b> — màu, phông, khoảng cách, bố cục</td><td>sơn &amp; nội thất</td></tr>\r\n<tr><td><code>JavaScript</code></td><td><b>Hành vi</b> — điều xảy ra khi nhấp/gõ/cuộn</td><td>điện &amp; nước</td></tr></table>\r\n<div class=\"ex\" data-kind=\"quiz\" data-a=\"0\"><span class=\"exq\"><b>Bài tập 3.</b> Ngôn ngữ nào chịu trách nhiệm cho <b>cấu trúc</b> của trang (tiêu đề, đoạn văn, hình ảnh)?</span>\r\n<ol class=\"opts\">\r\n<li>HTML</li>\r\n<li>CSS</li>\r\n<li>JavaScript</li>\r\n<li>Máy chủ</li>\r\n</ol></div>\r\n<div class=\"ex\" data-kind=\"quiz\" data-a=\"1\"><span class=\"exq\"><b>Bài tập 4.</b> Bạn muốn đổi <b>màu sắc và khoảng cách</b> của trang. Bạn dùng ngôn ngữ nào?</span>\r\n<ol class=\"opts\">\r\n<li>HTML</li>\r\n<li>CSS</li>\r\n<li>JavaScript</li>\r\n<li>URL</li>\r\n</ol></div>\r\n<div class=\"ex\" data-kind=\"quiz\" data-a=\"2\"><span class=\"exq\"><b>Bài tập 5.</b> Một nút cần <b>hiện thông báo khi được nhấp</b>. Đó là việc của…</span>\r\n<ol class=\"opts\">\r\n<li>HTML</li>\r\n<li>CSS</li>\r\n<li>JavaScript</li>\r\n<li>máy chủ</li>\r\n</ol></div>\r\n\r\n<h4>3. Xem HTML một mình</h4>\r\n<p>Hãy làm cho ba lớp trở nên cụ thể. Bên dưới là một trang nhỏ viết bằng <b>chỉ HTML</b> — thuần cấu trúc, không kiểu dáng. Nhấn <b>▶ Chạy</b> và xem nó hiển thị trong ô xem trước. Để ý là nó hoạt động, nhưng trông đơn sơ: chữ đen trên nền trắng, phông mặc định. Đó là HTML làm đúng một việc của mình — cấu trúc — và không gì hơn. Thử đổi chữ giữa các thẻ rồi Chạy lại.</p>\r\n<div class=\"ex\" data-kind=\"web\"><span class=\"exq\"><b>Bài tập 6.</b> Chạy trang chỉ-HTML này và đọc kết quả. Sau đó đổi chữ tiêu đề và Chạy lại.</span>\r\n<template class=\"st\">&lt;!doctype html&gt;\r\n&lt;html&gt;\r\n  &lt;body&gt;\r\n    &lt;h1&gt;Dojo News&lt;/h1&gt;\r\n    &lt;p&gt;Structure with no styling looks plain — and that's fine.&lt;/p&gt;\r\n    &lt;button&gt;Read more&lt;/button&gt;\r\n  &lt;/body&gt;\r\n&lt;/html&gt;</template>\r\n</div>\r\n\r\n<h4>4. Thêm CSS và xem nó đổi thay</h4>\r\n<p>Vẫn cấu trúc đó — nhưng giờ ta thêm một khối <b>CSS</b> trong <code>&lt;style&gt;</code>. Không có gì về <i>nội dung</i> thay đổi; chỉ <i>vẻ ngoài</i> đổi. Chạy nó và so với trang trước: màu sắc, khoảng cách và phông chữ xuất hiện, nhưng bên dưới vẫn là đúng những tiêu đề và nút đó. Đây là sức mạnh của việc tách cấu trúc khỏi kiểu dáng.</p>\r\n<div class=\"ex\" data-kind=\"web\"><span class=\"exq\"><b>Bài tập 7.</b> Chạy trang này và xem CSS tô lại đúng phần HTML đó thế nào. Thử đổi <code>tomato</code> thành <code>teal</code>.</span>\r\n<template class=\"st\">&lt;!doctype html&gt;\r\n&lt;html&gt;\r\n  &lt;head&gt;\r\n    &lt;style&gt;\r\n      body { font-family: sans-serif; padding: 20px; background: #0E1626; color: #E8E4D8; }\r\n      h1 { color: tomato; }\r\n      button { background: #F5B942; border: none; padding: 8px 14px; border-radius: 6px; }\r\n    &lt;/style&gt;\r\n  &lt;/head&gt;\r\n  &lt;body&gt;\r\n    &lt;h1&gt;Dojo News&lt;/h1&gt;\r\n    &lt;p&gt;Same structure — new look, thanks to CSS.&lt;/p&gt;\r\n    &lt;button&gt;Read more&lt;/button&gt;\r\n  &lt;/body&gt;\r\n&lt;/html&gt;</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"quiz\" data-a=\"1\"><span class=\"exq\"><b>Bài tập 8.</b> Giữa hai trang ở trên, tiêu đề và nút hoàn toàn giống nhau. Vậy điều gì thực sự làm vẻ ngoài thay đổi?</span>\r\n<ol class=\"opts\">\r\n<li>Cấu trúc HTML được viết lại.</li>\r\n<li>Một khối CSS <code>&lt;style&gt;</code> được thêm vào.</li>\r\n<li>Máy chủ gửi một trang khác.</li>\r\n<li>JavaScript di chuyển các phần tử.</li>\r\n</ol></div>\r\n\r\n<h4>5. Thêm JavaScript để có hành vi</h4>\r\n<p>Cấu trúc và kiểu dáng là <b>tĩnh</b> — chúng chỉ nằm đó. <b>JavaScript</b> làm trang biết <i>phản ứng</i>. Trang bên dưới có một nút gắn một đoạn script nhỏ: nhấp vào là chữ đổi. Bạn chưa cần hiểu code (đó là nửa sau khóa học) — chỉ cần chạy, nhấp nút, và để ý rằng <i>có điều gì đó xảy ra</i>. Cái \"có điều gì đó xảy ra khi tương tác\" chính là thứ JavaScript thêm vào.</p>\r\n<div class=\"ex\" data-kind=\"web\"><span class=\"exq\"><b>Bài tập 9.</b> Chạy trang, rồi nhấp nút <b>Cheer!</b> trong ô xem trước và xem thông báo đổi.</span>\r\n<template class=\"st\">&lt;!doctype html&gt;\r\n&lt;html&gt;\r\n  &lt;head&gt;&lt;style&gt;body{font-family:sans-serif;padding:20px}&lt;/style&gt;&lt;/head&gt;\r\n  &lt;body&gt;\r\n    &lt;h1 id=\"msg\"&gt;Hello&lt;/h1&gt;\r\n    &lt;button onclick=\"document.getElementById('msg').textContent = 'You clicked! 🎉'\"&gt;Cheer!&lt;/button&gt;\r\n  &lt;/body&gt;\r\n&lt;/html&gt;</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"quiz\" data-a=\"2\"><span class=\"exq\"><b>Bài tập 10.</b> Trước khi bạn nhấp, tiêu đề ghi \"Hello\". Sau khi nhấp nó đổi. Ngôn ngữ nào làm <b>thay đổi đó xảy ra khi nhấp</b>?</span>\r\n<ol class=\"opts\">\r\n<li>HTML</li>\r\n<li>CSS</li>\r\n<li>JavaScript</li>\r\n<li>URL</li>\r\n</ol></div>\r\n\r\n<h4>6. Ghép bức tranh lại</h4>\r\n<p>Giờ bạn đã có mô hình tư duy đầy đủ: trình duyệt <b>yêu cầu</b> một trang, máy chủ <b>phản hồi</b> bằng các tệp, và trình duyệt vẽ chúng bằng ba ngôn ngữ — HTML cho cấu trúc, CSS cho kiểu dáng, JavaScript cho hành vi. Mọi thứ còn lại trong khóa học chỉ là chi tiết chồng lên nền này.</p>\r\n<div class=\"ex stretch\" data-kind=\"quiz\" data-a=\"3\"><span class=\"exq\"><b>Bài tập 11. 🔥 Nâng cao.</b> Một trang bán hàng bày sản phẩm thành lưới gọn gàng (bố cục), và nhấp \"Thêm vào giỏ\" làm bộ đếm tăng lên. Hãy ghép việc: <b>bố cục lưới</b> và <b>bộ đếm tăng khi nhấp</b> được xử lý bởi…</span>\r\n<ol class=\"opts\">\r\n<li>CSS cho cả hai.</li>\r\n<li>JavaScript cho cả hai.</li>\r\n<li>HTML cho lưới, máy chủ cho bộ đếm.</li>\r\n<li>CSS cho bố cục lưới, JavaScript cho bộ đếm.</li>\r\n</ol></div>\r\n\r\n<h4>🏠 Bài tập về nhà</h4>\r\n<p>Bốn bài mang về nhà, chấm tự động ngay trên trang. Bài cuối là bài nâng cao.</p>\r\n<div class=\"ex homework\" data-kind=\"quiz\" data-a=\"1\"><span class=\"exq\"><b>Bài tập 1.</b> Trình duyệt của bạn được mô tả đúng nhất là…</span>\r\n<ol class=\"opts\">\r\n<li>máy chủ lưu các tệp.</li>\r\n<li>client yêu cầu các trang và hiển thị chúng.</li>\r\n<li>ngôn ngữ dùng để tạo kiểu cho trang.</li>\r\n<li>sợi cáp internet.</li>\r\n</ol></div>\r\n<div class=\"ex homework\" data-kind=\"quiz\" data-a=\"0\"><span class=\"exq\"><b>Bài tập 2.</b> Bộ ba nào liệt kê ba ngôn ngữ web cốt lõi theo thứ tự <b>cấu trúc, kiểu dáng, hành vi</b>?</span>\r\n<ol class=\"opts\">\r\n<li>HTML, CSS, JavaScript</li>\r\n<li>CSS, HTML, JavaScript</li>\r\n<li>JavaScript, CSS, HTML</li>\r\n<li>HTML, JavaScript, CSS</li>\r\n</ol></div>\r\n<div class=\"ex homework\" data-kind=\"web\"><span class=\"exq\"><b>Bài tập 3.</b> Chạy trang này. Nó dùng cả ba ngôn ngữ cùng lúc — đọc các chú thích để nhận ra dòng nào là HTML, dòng nào là CSS, dòng nào là JavaScript.</span>\r\n<template class=\"st\">&lt;!doctype html&gt;\r\n&lt;html&gt;\r\n  &lt;head&gt;\r\n    &lt;style&gt;\r\n      /* CSS: the style */\r\n      body { font-family: sans-serif; padding: 20px; }\r\n      h1 { color: teal; }\r\n    &lt;/style&gt;\r\n  &lt;/head&gt;\r\n  &lt;body&gt;\r\n    &lt;!-- HTML: the structure --&gt;\r\n    &lt;h1 id=\"title\"&gt;Three in one&lt;/h1&gt;\r\n    &lt;button onclick=\"document.getElementById('title').textContent = 'Behaviour!'\"&gt;Click me&lt;/button&gt;\r\n    &lt;!-- JavaScript: the behaviour is in the onclick above --&gt;\r\n  &lt;/body&gt;\r\n&lt;/html&gt;</template>\r\n</div>\r\n<div class=\"ex homework stretch\" data-kind=\"quiz\" data-a=\"3\"><span class=\"exq\"><b>Bài tập 4. 🔥 Nâng cao.</b> Một trang tải xong ngay lập tức nhưng có biểu tượng ảnh vỡ ở chỗ đáng lẽ là hình, và nhấp một nút thì không có gì xảy ra. Chẩn đoán một câu nào hợp nhất?</span>\r\n<ol class=\"opts\">\r\n<li>Thiếu CSS, nên không có cấu trúc.</li>\r\n<li>Máy chủ không hề phản hồi, nên không gì tải được.</li>\r\n<li>URL là một yêu cầu, nên trang không thể hiển thị.</li>\r\n<li>HTML/phản hồi đã tải, nhưng một tệp ảnh bị thiếu và JavaScript của nút không chạy.</li>\r\n</ol></div>","en":"<h3>Lesson 1 — How the web works</h3>\r\n<p>Every time you open a website — a news page, a shop, a video app — a lot happens in the half-second before it appears. Your device sends a <b>request</b> across the internet to another computer, that computer sends files back, and your <b>browser</b> turns those files into the page you see and touch. Before you write a single line of code, it pays to understand this journey. It's the mental model everything else in this course hangs on.</p>\r\n<p>Here's the key idea we'll build on for sixteen lessons: a web page is made of <b>three separate languages</b>, each with one job. <b>HTML</b> is the <i>structure</i> — the headings, paragraphs, images and buttons (the \"what\"). <b>CSS</b> is the <i>style</i> — colours, spacing, fonts and layout (the \"how it looks\"). <b>JavaScript</b> is the <i>behaviour</i> — what happens when you click, type or scroll (the \"what it does\"). Same three languages power <i>every</i> website on earth, from a personal blog to a bank.</p>\r\n<p>This first lesson is about <i>seeing</i> that picture clearly, so you're never confused about which language does what. There's no syntax to memorise yet — instead you'll answer quick quizzes and <b>run real mini-pages</b> right here in the browser to watch each layer in action. Getting a quiz wrong is fine: the correct answer lights up so you learn instantly.</p>\r\n\r\n<h4>1. The request–response journey</h4>\r\n<p>When you type an address (a <b>URL</b>) and press Enter, your browser (the <b>client</b>) sends a <b>request</b> to a <b>server</b> — a computer somewhere whose job is to hold and hand out web files. The server sends back a <b>response</b>: the page's files. This back-and-forth is the heartbeat of the web.</p>\r\n<figure class=\"diagram\">\r\n<svg viewBox=\"0 0 470 170\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"13\">\r\n  <rect x=\"20\" y=\"55\" width=\"130\" height=\"60\" rx=\"8\" fill=\"#121C30\" stroke=\"#7FD1C0\"/>\r\n  <text x=\"85\" y=\"82\" text-anchor=\"middle\" fill=\"#E8E4D8\" font-size=\"14\">Your browser</text>\r\n  <text x=\"85\" y=\"102\" text-anchor=\"middle\" fill=\"#8FA0BC\" font-size=\"11\">(the client)</text>\r\n  <rect x=\"320\" y=\"55\" width=\"130\" height=\"60\" rx=\"8\" fill=\"#121C30\" stroke=\"#F5B942\"/>\r\n  <text x=\"385\" y=\"82\" text-anchor=\"middle\" fill=\"#E8E4D8\" font-size=\"14\">The server</text>\r\n  <text x=\"385\" y=\"102\" text-anchor=\"middle\" fill=\"#8FA0BC\" font-size=\"11\">(holds the files)</text>\r\n  <line x1=\"152\" y1=\"72\" x2=\"316\" y2=\"72\" stroke=\"#F5B942\" stroke-width=\"2\" marker-end=\"url(#ar)\"/>\r\n  <text x=\"234\" y=\"64\" text-anchor=\"middle\" fill=\"#F5B942\" font-size=\"12\">1. request →</text>\r\n  <line x1=\"318\" y1=\"100\" x2=\"154\" y2=\"100\" stroke=\"#7FD1C0\" stroke-width=\"2\" marker-end=\"url(#ar2)\"/>\r\n  <text x=\"236\" y=\"118\" text-anchor=\"middle\" fill=\"#7FD1C0\" font-size=\"12\">← 2. response (HTML, CSS, JS)</text>\r\n  <defs>\r\n    <marker id=\"ar\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L7,3 L0,6 Z\" fill=\"#F5B942\"/></marker>\r\n    <marker id=\"ar2\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L7,3 L0,6 Z\" fill=\"#7FD1C0\"/></marker>\r\n  </defs>\r\n</svg>\r\n<figcaption>The browser asks; the server answers with the files that make up the page.</figcaption>\r\n</figure>\r\n<div class=\"ex\" data-kind=\"quiz\" data-a=\"1\"><span class=\"exq\"><b>Exercise 1.</b> In this journey, what does the <b>server</b> do?</span>\r\n<ol class=\"opts\">\r\n<li>It draws the page on your screen.</li>\r\n<li>It stores the web files and sends them back when asked.</li>\r\n<li>It decides what colour the buttons are.</li>\r\n<li>It is the same thing as your browser.</li>\r\n</ol></div>\r\n<div class=\"ex\" data-kind=\"quiz\" data-a=\"2\"><span class=\"exq\"><b>Exercise 2.</b> The message your browser sends to ask for a page is called the…</span>\r\n<ol class=\"opts\">\r\n<li>response</li>\r\n<li>stylesheet</li>\r\n<li>request</li>\r\n<li>server</li>\r\n</ol></div>\r\n\r\n<h4>2. Three languages, three jobs</h4>\r\n<p>The response is (mostly) three kinds of file, each with a single responsibility. Keep this table in your head — the whole course is organised around it.</p>\r\n<table class=\"res\"><tr><th>Language</th><th>Job</th><th>Think of a house</th></tr>\r\n<tr><td><code>HTML</code></td><td><b>Structure</b> — headings, text, images, buttons</td><td>the walls &amp; rooms</td></tr>\r\n<tr><td><code>CSS</code></td><td><b>Style</b> — colours, fonts, spacing, layout</td><td>the paint &amp; furniture</td></tr>\r\n<tr><td><code>JavaScript</code></td><td><b>Behaviour</b> — what happens on click/type/scroll</td><td>the electricity &amp; plumbing</td></tr></table>\r\n<div class=\"ex\" data-kind=\"quiz\" data-a=\"0\"><span class=\"exq\"><b>Exercise 3.</b> Which language is responsible for the <b>structure</b> of a page (its headings, paragraphs and images)?</span>\r\n<ol class=\"opts\">\r\n<li>HTML</li>\r\n<li>CSS</li>\r\n<li>JavaScript</li>\r\n<li>The server</li>\r\n</ol></div>\r\n<div class=\"ex\" data-kind=\"quiz\" data-a=\"1\"><span class=\"exq\"><b>Exercise 4.</b> You want to change the page's <b>colours and spacing</b>. Which language do you reach for?</span>\r\n<ol class=\"opts\">\r\n<li>HTML</li>\r\n<li>CSS</li>\r\n<li>JavaScript</li>\r\n<li>URL</li>\r\n</ol></div>\r\n<div class=\"ex\" data-kind=\"quiz\" data-a=\"2\"><span class=\"exq\"><b>Exercise 5.</b> A button should <b>show a message when clicked</b>. That's a job for…</span>\r\n<ol class=\"opts\">\r\n<li>HTML</li>\r\n<li>CSS</li>\r\n<li>JavaScript</li>\r\n<li>the server</li>\r\n</ol></div>\r\n\r\n<h4>3. See HTML on its own</h4>\r\n<p>Let's make the three layers concrete. Below is a tiny page written in <b>HTML only</b> — pure structure, no styling. Press <b>▶ Run</b> and watch it render in the preview. Notice it works, but looks plain: black text on white, default fonts. That's HTML doing its one job — structure — and nothing more. Try changing the text between the tags, then Run again.</p>\r\n<div class=\"ex\" data-kind=\"web\"><span class=\"exq\"><b>Exercise 6.</b> Run this HTML-only page and read the result. Then change the heading text and Run again.</span>\r\n<template class=\"st\">&lt;!doctype html&gt;\r\n&lt;html&gt;\r\n  &lt;body&gt;\r\n    &lt;h1&gt;Dojo News&lt;/h1&gt;\r\n    &lt;p&gt;Structure with no styling looks plain — and that's fine.&lt;/p&gt;\r\n    &lt;button&gt;Read more&lt;/button&gt;\r\n  &lt;/body&gt;\r\n&lt;/html&gt;</template>\r\n</div>\r\n\r\n<h4>4. Add CSS and watch it change</h4>\r\n<p>Same structure — but now we've added a <b>CSS</b> block inside <code>&lt;style&gt;</code>. Nothing about the <i>content</i> changed; only the <i>look</i> did. Run it and compare with the previous page: colours, spacing and fonts appear, but it's the exact same headings and button underneath. This is the power of separating structure from style.</p>\r\n<div class=\"ex\" data-kind=\"web\"><span class=\"exq\"><b>Exercise 7.</b> Run this page and see how CSS restyles the very same HTML. Try changing <code>tomato</code> to <code>teal</code>.</span>\r\n<template class=\"st\">&lt;!doctype html&gt;\r\n&lt;html&gt;\r\n  &lt;head&gt;\r\n    &lt;style&gt;\r\n      body { font-family: sans-serif; padding: 20px; background: #0E1626; color: #E8E4D8; }\r\n      h1 { color: tomato; }\r\n      button { background: #F5B942; border: none; padding: 8px 14px; border-radius: 6px; }\r\n    &lt;/style&gt;\r\n  &lt;/head&gt;\r\n  &lt;body&gt;\r\n    &lt;h1&gt;Dojo News&lt;/h1&gt;\r\n    &lt;p&gt;Same structure — new look, thanks to CSS.&lt;/p&gt;\r\n    &lt;button&gt;Read more&lt;/button&gt;\r\n  &lt;/body&gt;\r\n&lt;/html&gt;</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"quiz\" data-a=\"1\"><span class=\"exq\"><b>Exercise 8.</b> Between the two pages above, the headings and button were identical. What actually changed the appearance?</span>\r\n<ol class=\"opts\">\r\n<li>The HTML structure was rewritten.</li>\r\n<li>A CSS <code>&lt;style&gt;</code> block was added.</li>\r\n<li>The server sent a different page.</li>\r\n<li>JavaScript moved the elements.</li>\r\n</ol></div>\r\n\r\n<h4>5. Add JavaScript for behaviour</h4>\r\n<p>Structure and style are <b>static</b> — they just sit there. <b>JavaScript</b> makes a page <i>react</i>. The page below has a button wired with a tiny script: click it and the text changes. You don't need to understand the code yet (that's the second half of the course) — just run it, click the button, and notice that <i>something happens</i>. That \"something happens on interaction\" is exactly what JavaScript adds.</p>\r\n<div class=\"ex\" data-kind=\"web\"><span class=\"exq\"><b>Exercise 9.</b> Run the page, then click the <b>Cheer!</b> button in the preview and watch the message change.</span>\r\n<template class=\"st\">&lt;!doctype html&gt;\r\n&lt;html&gt;\r\n  &lt;head&gt;&lt;style&gt;body{font-family:sans-serif;padding:20px}&lt;/style&gt;&lt;/head&gt;\r\n  &lt;body&gt;\r\n    &lt;h1 id=\"msg\"&gt;Hello&lt;/h1&gt;\r\n    &lt;button onclick=\"document.getElementById('msg').textContent = 'You clicked! 🎉'\"&gt;Cheer!&lt;/button&gt;\r\n  &lt;/body&gt;\r\n&lt;/html&gt;</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"quiz\" data-a=\"2\"><span class=\"exq\"><b>Exercise 10.</b> Before you clicked, the heading said \"Hello\". After the click it changed. Which language made that <b>change happen on click</b>?</span>\r\n<ol class=\"opts\">\r\n<li>HTML</li>\r\n<li>CSS</li>\r\n<li>JavaScript</li>\r\n<li>The URL</li>\r\n</ol></div>\r\n\r\n<h4>6. Putting the picture together</h4>\r\n<p>You now have the full mental model: a browser <b>requests</b> a page, a server <b>responds</b> with files, and the browser paints them using three languages — HTML for structure, CSS for style, JavaScript for behaviour. Everything else in this course is detail on top of this.</p>\r\n<div class=\"ex stretch\" data-kind=\"quiz\" data-a=\"3\"><span class=\"exq\"><b>Exercise 11. 🔥 Stretch.</b> A shopping page shows products in a neat grid (layout), and clicking \"Add to cart\" updates a counter. Match the work: <b>grid layout</b> and <b>the counter updating on click</b> are handled by…</span>\r\n<ol class=\"opts\">\r\n<li>CSS for both.</li>\r\n<li>JavaScript for both.</li>\r\n<li>HTML for the grid, the server for the counter.</li>\r\n<li>CSS for the grid layout, JavaScript for the counter update.</li>\r\n</ol></div>\r\n\r\n<h4>🏠 Homework</h4>\r\n<p>Four take-home exercises, auto-graded right on the page. The last one is a stretch.</p>\r\n<div class=\"ex homework\" data-kind=\"quiz\" data-a=\"1\"><span class=\"exq\"><b>Exercise 1.</b> Your browser is best described as the…</span>\r\n<ol class=\"opts\">\r\n<li>server that stores the files.</li>\r\n<li>client that requests pages and renders them.</li>\r\n<li>language used to style pages.</li>\r\n<li>internet cable.</li>\r\n</ol></div>\r\n<div class=\"ex homework\" data-kind=\"quiz\" data-a=\"0\"><span class=\"exq\"><b>Exercise 2.</b> Which trio lists the three core web languages in the order <b>structure, style, behaviour</b>?</span>\r\n<ol class=\"opts\">\r\n<li>HTML, CSS, JavaScript</li>\r\n<li>CSS, HTML, JavaScript</li>\r\n<li>JavaScript, CSS, HTML</li>\r\n<li>HTML, JavaScript, CSS</li>\r\n</ol></div>\r\n<div class=\"ex homework\" data-kind=\"web\"><span class=\"exq\"><b>Exercise 3.</b> Run this page. It uses all three languages at once — read the comments to spot which line is HTML, which is CSS, and which is JavaScript.</span>\r\n<template class=\"st\">&lt;!doctype html&gt;\r\n&lt;html&gt;\r\n  &lt;head&gt;\r\n    &lt;style&gt;\r\n      /* CSS: the style */\r\n      body { font-family: sans-serif; padding: 20px; }\r\n      h1 { color: teal; }\r\n    &lt;/style&gt;\r\n  &lt;/head&gt;\r\n  &lt;body&gt;\r\n    &lt;!-- HTML: the structure --&gt;\r\n    &lt;h1 id=\"title\"&gt;Three in one&lt;/h1&gt;\r\n    &lt;button onclick=\"document.getElementById('title').textContent = 'Behaviour!'\"&gt;Click me&lt;/button&gt;\r\n    &lt;!-- JavaScript: the behaviour is in the onclick above --&gt;\r\n  &lt;/body&gt;\r\n&lt;/html&gt;</template>\r\n</div>\r\n<div class=\"ex homework stretch\" data-kind=\"quiz\" data-a=\"3\"><span class=\"exq\"><b>Exercise 4. 🔥 Stretch.</b> A page loads instantly but a broken photo icon shows where a picture should be, and clicking a button does nothing. Which single-sentence diagnosis fits best?</span>\r\n<ol class=\"opts\">\r\n<li>The CSS is missing, so there is no structure.</li>\r\n<li>The server never responded, so nothing loaded.</li>\r\n<li>The URL is a request, so the page cannot render.</li>\r\n<li>The HTML/response loaded, but an image file is missing and the button's JavaScript isn't working.</li>\r\n</ol></div>"}},{"t":{"vi":"HTML căn bản","en":"HTML essentials"},"kind":"locked","html":null},{"t":{"vi":"Cấu trúc HTML: danh sách, bảng, form & bố cục ngữ nghĩa","en":"HTML structure: lists, tables, forms & semantic layout"},"kind":"locked","html":null},{"t":{"vi":"CSS căn bản & box model","en":"CSS essentials & the box model"},"kind":"locked","html":null},{"t":{"vi":"Bố cục với Flexbox","en":"CSS layout with flexbox"},"kind":"locked","html":null},{"t":{"vi":"Định vị & di chuyển phần tử","en":"CSS positioning & moving things"},"kind":"locked","html":null},{"t":{"vi":"CSS Grid & responsive","en":"CSS grid & responsive design"},"kind":"locked","html":null},{"t":{"vi":"Chuyển động & animation","en":"CSS transitions, transforms & animations"},"kind":"locked","html":null},{"t":{"vi":"Dự án nhỏ: trang landing page","en":"Mini project: a landing page"},"kind":"locked","html":null},{"t":{"vi":"JavaScript căn bản","en":"JavaScript basics"},"kind":"locked","html":null},{"t":{"vi":"Luồng điều khiển & dữ liệu","en":"Control flow & data"},"kind":"locked","html":null},{"t":{"vi":"Hàm trong JavaScript","en":"JavaScript functions"},"kind":"locked","html":null},{"t":{"vi":"DOM — chọn & thay đổi phần tử","en":"The DOM — select & change elements"},"kind":"locked","html":null},{"t":{"vi":"Sự kiện & tương tác","en":"Events & interactivity"},"kind":"locked","html":null},{"t":{"vi":"Form, kiểm tra dữ liệu & fetch","en":"Forms, validation & fetch"},"kind":"locked","html":null},{"t":{"vi":"Capstone: ứng dụng web tương tác","en":"Capstone: an interactive web app"},"kind":"locked","html":null}]};
