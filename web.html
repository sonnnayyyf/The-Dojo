<script>
const COURSE={"id":"web","ls":"mk:web","title":{"vi":"Lập trình Web căn bản","en":"Web Programming Fundamentals"},"sub":{"vi":"16 bài · front-end từ số 0 · Bài 1 miễn phí. HTML → CSS → JavaScript, xem kết quả trang web chạy ngay trong trình duyệt.","en":"16 lessons · front-end from zero · Lesson 1 free. HTML → CSS → JavaScript, with the live website rendering right in your browser."},"lessons":[{"t":{"vi":"Web hoạt động như thế nào","en":"How the web works"},"kind":"free","html":{"vi":"<h3>Bài 1 — Web hoạt động như thế nào</h3>\r\n<p>Mỗi lần bạn mở một trang web — trang tin tức, một cửa hàng, một ứng dụng xem video — rất nhiều thứ diễn ra trong nửa giây trước khi trang hiện ra. Thiết bị của bạn gửi một <b>yêu cầu (request)</b> qua internet đến một máy tính khác, máy tính đó gửi các tệp về, và <b>trình duyệt (browser)</b> của bạn biến những tệp đó thành trang mà bạn nhìn thấy và chạm vào. Trước khi viết dòng code đầu tiên, hiểu được hành trình này rất đáng giá. Đó là mô hình tư duy mà cả khóa học này dựa vào.</p>\r\n<p>Đây là ý tưởng cốt lõi ta sẽ xây dựng suốt mười sáu bài: một trang web được tạo từ <b>ba ngôn ngữ riêng biệt</b>, mỗi ngôn ngữ một nhiệm vụ. <b>HTML</b> là <i>cấu trúc</i> — tiêu đề, đoạn văn, hình ảnh và nút bấm (phần \"cái gì\"). <b>CSS</b> là <i>kiểu dáng</i> — màu sắc, khoảng cách, phông chữ và bố cục (phần \"trông ra sao\"). <b>JavaScript</b> là <i>hành vi</i> — điều gì xảy ra khi bạn nhấp, gõ hay cuộn (phần \"làm được gì\"). Cũng ba ngôn ngữ đó vận hành <i>mọi</i> trang web trên đời, từ một blog cá nhân đến một ngân hàng.</p>\r\n<p>Bạn sẽ không chỉ đọc về điều này — bạn sẽ <b>tự tay làm</b>. Phần lớn bài học là chỉnh sửa thật: bạn đổi tiêu đề, đổi màu chữ, đổi nền và ghép những trang nhỏ ngay trong trình soạn thảo, nhấn <b>Chạy</b> để thấy trang web hiện ra và được chấm ngay. Chưa cần thuộc cú pháp nào; bạn sửa cái có sẵn và xem nó sống dậy. Làm sai cũng không sao — cứ thử lại đến khi đạt.</p>\r\n\r\n<h4>1. Hành trình yêu cầu – phản hồi</h4>\r\n<p>Khi bạn gõ một địa chỉ (một <b>URL</b>) và nhấn Enter, trình duyệt của bạn (bên <b>client</b>) gửi một <b>yêu cầu (request)</b> đến một <b>máy chủ (server)</b> — một máy tính đâu đó có nhiệm vụ lưu và trao ra các tệp web. Máy chủ gửi lại một <b>phản hồi (response)</b>: các tệp của trang. Sự qua lại này chính là nhịp đập của web.</p>\r\n<figure class=\"diagram\">\r\n<svg viewBox=\"0 0 470 170\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"13\">\r\n  <rect x=\"20\" y=\"55\" width=\"130\" height=\"60\" rx=\"8\" fill=\"#121C30\" stroke=\"#7FD1C0\"/>\r\n  <text x=\"85\" y=\"82\" text-anchor=\"middle\" fill=\"#E8E4D8\" font-size=\"14\">Trình duyệt</text>\r\n  <text x=\"85\" y=\"102\" text-anchor=\"middle\" fill=\"#8FA0BC\" font-size=\"11\">(client)</text>\r\n  <rect x=\"320\" y=\"55\" width=\"130\" height=\"60\" rx=\"8\" fill=\"#121C30\" stroke=\"#F5B942\"/>\r\n  <text x=\"385\" y=\"82\" text-anchor=\"middle\" fill=\"#E8E4D8\" font-size=\"14\">Máy chủ</text>\r\n  <text x=\"385\" y=\"102\" text-anchor=\"middle\" fill=\"#8FA0BC\" font-size=\"11\">(giữ các tệp)</text>\r\n  <line x1=\"152\" y1=\"72\" x2=\"316\" y2=\"72\" stroke=\"#F5B942\" stroke-width=\"2\" marker-end=\"url(#ar)\"/>\r\n  <text x=\"234\" y=\"64\" text-anchor=\"middle\" fill=\"#F5B942\" font-size=\"12\">1. yêu cầu →</text>\r\n  <line x1=\"318\" y1=\"100\" x2=\"154\" y2=\"100\" stroke=\"#7FD1C0\" stroke-width=\"2\" marker-end=\"url(#ar2)\"/>\r\n  <text x=\"236\" y=\"118\" text-anchor=\"middle\" fill=\"#7FD1C0\" font-size=\"12\">← 2. phản hồi (HTML, CSS, JS)</text>\r\n  <defs>\r\n    <marker id=\"ar\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L7,3 L0,6 Z\" fill=\"#F5B942\"/></marker>\r\n    <marker id=\"ar2\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L7,3 L0,6 Z\" fill=\"#7FD1C0\"/></marker>\r\n  </defs>\r\n</svg>\r\n<figcaption>Trình duyệt hỏi; máy chủ trả lời bằng các tệp tạo nên trang.</figcaption>\r\n</figure>\r\n<div class=\"ex\" data-kind=\"quiz\" data-a=\"1\"><span class=\"exq\"><b>Bài tập 1.</b> Trong hành trình này, <b>máy chủ (server)</b> làm gì?</span>\r\n<ol class=\"opts\">\r\n<li>Vẽ trang lên màn hình của bạn.</li>\r\n<li>Lưu các tệp web và gửi trả lại khi được yêu cầu.</li>\r\n<li>Quyết định nút bấm có màu gì.</li>\r\n<li>Chính là trình duyệt của bạn.</li>\r\n</ol></div>\r\n\r\n<h4>2. Ba ngôn ngữ, ba nhiệm vụ</h4>\r\n<p>Phản hồi (hầu như) gồm ba loại tệp, mỗi loại một trách nhiệm duy nhất. Hãy ghi bảng này vào đầu — cả khóa học được sắp xếp quanh nó. Ở các phần sau bạn sẽ dựng một trang nhỏ từng lớp một và <i>cảm nhận</i> sự khác biệt.</p>\r\n<table class=\"res\"><tr><th>Ngôn ngữ</th><th>Nhiệm vụ</th><th>Ví như một căn nhà</th></tr>\r\n<tr><td><code>HTML</code></td><td><b>Cấu trúc</b> — tiêu đề, chữ, hình, nút</td><td>tường &amp; các phòng</td></tr>\r\n<tr><td><code>CSS</code></td><td><b>Kiểu dáng</b> — màu, phông, khoảng cách, bố cục</td><td>sơn &amp; nội thất</td></tr>\r\n<tr><td><code>JavaScript</code></td><td><b>Hành vi</b> — điều xảy ra khi nhấp/gõ/cuộn</td><td>điện &amp; nước</td></tr></table>\r\n\r\n<h4>3. HTML — cấu trúc bạn có thể sửa</h4>\r\n<p>Bên dưới là một trang nhỏ viết bằng <b>chỉ HTML</b> — thuần cấu trúc, không kiểu dáng. Nhấn <b>▶ Chạy</b> và xem nó hiển thị trong ô xem trước. Nó hoạt động, nhưng trông đơn sơ: chữ đen trên nền trắng, phông mặc định. Đó là HTML làm đúng một việc của mình — cấu trúc — và không gì hơn.</p>\r\n<div class=\"ex\" data-kind=\"web\"><span class=\"exq\"><b>Bài tập 2.</b> Chạy trang chỉ-HTML này và đọc kết quả. Rồi đổi vài chữ giữa các thẻ và Chạy lại để thấy nó cập nhật.</span>\r\n<template class=\"st\">&lt;!doctype html&gt;\r\n&lt;html&gt;\r\n  &lt;body&gt;\r\n    &lt;h1&gt;Dojo News&lt;/h1&gt;\r\n    &lt;p&gt;Structure with no styling looks plain — and that's fine.&lt;/p&gt;\r\n    &lt;button&gt;Read more&lt;/button&gt;\r\n  &lt;/body&gt;\r\n&lt;/html&gt;</template>\r\n</div>\r\n<p>Giờ đến lượt bạn. Chữ bạn thấy trên trang nằm <i>giữa</i> một thẻ mở như <code>&lt;h1&gt;</code> và một thẻ đóng như <code>&lt;/h1&gt;</code>. Đổi chữ đó là trang đổi.</p>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 3. ✍️ Đến lượt bạn.</b> Đổi chữ giữa <code>&lt;h1&gt;</code> và <code>&lt;/h1&gt;</code> sao cho tiêu đề hiện đúng <code>Dojo Daily</code>, rồi nhấn Chạy.</span>\r\n<template class=\"st\">&lt;h1&gt;Change this text&lt;/h1&gt;</template>\r\n<template class=\"ts\">\r\nassert(document.querySelector('h1'), 'giữ lại tiêu đề h1');\r\nassert(document.querySelector('h1').textContent.trim() === 'Dojo Daily', 'tiêu đề phải hiện đúng \"Dojo Daily\"');\r\n</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 4. ✍️ Đến lượt bạn.</b> Một đoạn văn dùng <code>&lt;p&gt;…&lt;/p&gt;</code>. Đổi chữ đoạn văn sao cho nó hiện đúng <code>Welcome to my website.</code></span>\r\n<template class=\"st\">&lt;h1&gt;Dojo Daily&lt;/h1&gt;\r\n&lt;p&gt;Old text here&lt;/p&gt;</template>\r\n<template class=\"ts\">\r\nassert(document.querySelector('p'), 'giữ lại đoạn văn');\r\nassert(document.querySelector('p').textContent.trim() === 'Welcome to my website.', 'đoạn văn phải hiện đúng \"Welcome to my website.\"');\r\n</template>\r\n</div>\r\n\r\n<h4>4. CSS — kiểu dáng bạn có thể đổi</h4>\r\n<p>Vẫn cấu trúc đó — nhưng giờ ta thêm một khối <b>CSS</b> trong <code>&lt;style&gt;</code>. Không có gì về <i>nội dung</i> thay đổi; chỉ <i>vẻ ngoài</i> đổi. Chạy nó và so sánh: màu sắc, khoảng cách và phông chữ xuất hiện, nhưng bên dưới vẫn là đúng những tiêu đề và nút đó. Đây là sức mạnh của việc tách cấu trúc khỏi kiểu dáng.</p>\r\n<div class=\"ex\" data-kind=\"web\"><span class=\"exq\"><b>Bài tập 5.</b> Chạy trang này và xem CSS tô lại đúng phần HTML đó thế nào. Thử đổi <code>tomato</code> thành <code>teal</code>.</span>\r\n<template class=\"st\">&lt;!doctype html&gt;\r\n&lt;html&gt;\r\n  &lt;head&gt;\r\n    &lt;style&gt;\r\n      body { font-family: sans-serif; padding: 20px; background: #0E1626; color: #E8E4D8; }\r\n      h1 { color: tomato; }\r\n      button { background: #F5B942; border: none; padding: 8px 14px; border-radius: 6px; }\r\n    &lt;/style&gt;\r\n  &lt;/head&gt;\r\n  &lt;body&gt;\r\n    &lt;h1&gt;Dojo News&lt;/h1&gt;\r\n    &lt;p&gt;Same structure — new look, thanks to CSS.&lt;/p&gt;\r\n    &lt;button&gt;Read more&lt;/button&gt;\r\n  &lt;/body&gt;\r\n&lt;/html&gt;</template>\r\n</div>\r\n<p>Từ đây trở đi, <b>HTML</b> và <b>CSS</b> nằm ở hai ô riêng — sửa ô nào cũng được rồi nhấn Chạy để ghép chúng lại. Một luật CSS trông như <code>selector { property: value; }</code>.</p>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 6. ✍️ Đến lượt bạn.</b> Trong ô <b>CSS</b>, đổi <code>black</code> thành <code>gold</code> để tiêu đề chuyển sang vàng gold, rồi nhấn Chạy.</span>\r\n<template class=\"html\">&lt;h1 id=\"title\"&gt;Sunset Blog&lt;/h1&gt;</template>\r\n<template class=\"css\">#title { color: black; }</template>\r\n<template class=\"ts\">\r\nassert(getComputedStyle(document.querySelector('#title')).color === 'rgb(255, 215, 0)', 'đặt màu tiêu đề thành gold (đổi black thành gold trong CSS)');\r\n</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 7. ✍️ Đến lượt bạn.</b> Cho trang một giao diện tối: trong <b>CSS</b>, đổi nền của <code>body</code> từ <code>white</code> thành <code>navy</code>, rồi nhấn Chạy.</span>\r\n<template class=\"html\">&lt;h1&gt;Night mode&lt;/h1&gt;\r\n&lt;p&gt;A whole new mood.&lt;/p&gt;</template>\r\n<template class=\"css\">body { background: white; color: white; padding: 16px; }</template>\r\n<template class=\"ts\">\r\nassert(getComputedStyle(document.body).backgroundColor === 'rgb(0, 0, 128)', 'đặt nền body thành navy (đổi white thành navy)');\r\n</template>\r\n</div>\r\n\r\n<h4>5. JavaScript — hành vi</h4>\r\n<p>Cấu trúc và kiểu dáng là <b>tĩnh</b> — chúng chỉ nằm đó. <b>JavaScript</b> làm trang biết <i>phản ứng</i>. Trang bên dưới có một nút gắn một đoạn script nhỏ: nhấp vào là chữ đổi. Bạn chưa cần hiểu code (đó là nửa sau khóa học) — chỉ cần chạy, nhấp nút, và để ý rằng <i>có điều gì đó xảy ra</i>.</p>\r\n<div class=\"ex\" data-kind=\"web\"><span class=\"exq\"><b>Bài tập 8.</b> Chạy trang, rồi nhấp nút <b>Cheer!</b> trong ô xem trước và xem thông báo đổi.</span>\r\n<template class=\"st\">&lt;!doctype html&gt;\r\n&lt;html&gt;\r\n  &lt;head&gt;&lt;style&gt;body{font-family:sans-serif;padding:20px}&lt;/style&gt;&lt;/head&gt;\r\n  &lt;body&gt;\r\n    &lt;h1 id=\"msg\"&gt;Hello&lt;/h1&gt;\r\n    &lt;button onclick=\"document.getElementById('msg').textContent = 'You clicked! 🎉'\"&gt;Cheer!&lt;/button&gt;\r\n  &lt;/body&gt;\r\n&lt;/html&gt;</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"quiz\" data-a=\"2\"><span class=\"exq\"><b>Bài tập 9.</b> Trước khi bạn nhấp, tiêu đề ghi \"Hello\". Sau khi nhấp nó đổi. Ngôn ngữ nào làm <b>thay đổi đó xảy ra khi nhấp</b>?</span>\r\n<ol class=\"opts\">\r\n<li>HTML</li>\r\n<li>CSS</li>\r\n<li>JavaScript</li>\r\n<li>URL</li>\r\n</ol></div>\r\n\r\n<h4>6. Ghép các lớp lại</h4>\r\n<p>Giờ bạn đã chạm cả ba lớp. Hãy kết hợp chỉnh sửa qua các lớp. Nhớ nhé: <b>chữ</b> nằm trong HTML, <b>màu</b> nằm trong CSS.</p>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 10. ✍️ Đến lượt bạn.</b> Sửa <b>HTML</b> sao cho tiêu đề hiện <code>My Shop</code> và nút hiện <code>Buy now</code>, rồi nhấn Chạy.</span>\r\n<template class=\"st\">&lt;h1&gt;Store name&lt;/h1&gt;\r\n&lt;button&gt;Label&lt;/button&gt;</template>\r\n<template class=\"ts\">\r\nassert(document.querySelector('h1') && document.querySelector('h1').textContent.trim() === 'My Shop', 'tiêu đề phải hiện \"My Shop\"');\r\nassert(document.querySelector('button') && document.querySelector('button').textContent.trim() === 'Buy now', 'nút phải hiện \"Buy now\"');\r\n</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 11. ✍️ Đến lượt bạn.</b> Lần này hai tệp: trong <b>HTML</b> đổi chữ tiêu đề thành <code>Big Sale</code>, và trong <b>CSS</b> đổi màu của nó thành <code>red</code>. Rồi nhấn Chạy.</span>\r\n<template class=\"html\">&lt;h1 id=\"hero\"&gt;Change me&lt;/h1&gt;</template>\r\n<template class=\"css\">#hero { color: black; }</template>\r\n<template class=\"ts\">\r\nassert(document.querySelector('#hero') && document.querySelector('#hero').textContent.trim() === 'Big Sale', 'tiêu đề phải hiện \"Big Sale\"');\r\nassert(getComputedStyle(document.querySelector('#hero')).color === 'rgb(255, 0, 0)', 'đặt màu tiêu đề thành red trong CSS');\r\n</template>\r\n</div>\r\n<div class=\"ex stretch\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 12. 🔥 Nâng cao — ✍️ đến lượt bạn.</b> Tự dựng một trang nhỏ toàn chữ. Thay các chỗ trống sao cho tiêu đề ghi <code>My First Page</code> và đoạn văn ghi <code>I am learning web.</code> — rồi nhấn Chạy.</span>\r\n<template class=\"st\">&lt;h1&gt;___&lt;/h1&gt;\r\n&lt;p&gt;___&lt;/p&gt;</template>\r\n<template class=\"ts\">\r\nassert(document.querySelector('h1') && document.querySelector('h1').textContent.trim() === 'My First Page', 'tiêu đề (h1) phải ghi \"My First Page\"');\r\nassert(document.querySelector('p') && document.querySelector('p').textContent.trim() === 'I am learning web.', 'đoạn văn (p) phải ghi \"I am learning web.\"');\r\n</template>\r\n</div>\r\n\r\n<h4>🏠 Bài tập về nhà</h4>\r\n<p>Bốn bài mang về nhà, chấm tự động ngay trên trang — phần lớn là thực hành. Bài cuối là bài nâng cao.</p>\r\n<div class=\"ex homework\" data-kind=\"quiz\" data-a=\"0\"><span class=\"exq\"><b>Bài tập 1.</b> Bộ ba nào liệt kê ba ngôn ngữ web cốt lõi theo thứ tự <b>cấu trúc, kiểu dáng, hành vi</b>?</span>\r\n<ol class=\"opts\">\r\n<li>HTML, CSS, JavaScript</li>\r\n<li>CSS, HTML, JavaScript</li>\r\n<li>JavaScript, CSS, HTML</li>\r\n<li>HTML, JavaScript, CSS</li>\r\n</ol></div>\r\n<div class=\"ex homework\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 2. ✍️</b> Đổi nhãn của nút sao cho nó hiện đúng <code>Sign up</code>, rồi nhấn Chạy.</span>\r\n<template class=\"st\">&lt;button&gt;Click here&lt;/button&gt;</template>\r\n<template class=\"ts\">\r\nassert(document.querySelector('button'), 'giữ lại nút');\r\nassert(document.querySelector('button').textContent.trim() === 'Sign up', 'nút phải hiện đúng \"Sign up\"');\r\n</template>\r\n</div>\r\n<div class=\"ex homework\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 3. ✍️</b> Hai tệp: trong <b>HTML</b> đổi chữ tiêu đề thành <code>About Me</code>, và trong <b>CSS</b> đổi màu của nó thành <code>green</code>. Rồi nhấn Chạy.</span>\r\n<template class=\"html\">&lt;h1 id=\"t\"&gt;Heading&lt;/h1&gt;</template>\r\n<template class=\"css\">#t { color: black; }</template>\r\n<template class=\"ts\">\r\nassert(document.querySelector('#t') && document.querySelector('#t').textContent.trim() === 'About Me', 'tiêu đề phải hiện \"About Me\"');\r\nassert(getComputedStyle(document.querySelector('#t')).color === 'rgb(0, 128, 0)', 'đặt màu tiêu đề thành green trong CSS');\r\n</template>\r\n</div>\r\n<div class=\"ex homework stretch\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 4. 🔥 Nâng cao — ✍️</b> Dựng một thẻ nhỏ. Trong <b>HTML</b> cho tiêu đề ghi <code>Contact</code> và đoạn văn ghi <code>Email me anytime.</code>, và trong <b>CSS</b> đổi nền trang thành <code>gold</code>. Rồi nhấn Chạy.</span>\r\n<template class=\"html\">&lt;h1&gt;___&lt;/h1&gt;\r\n&lt;p&gt;___&lt;/p&gt;</template>\r\n<template class=\"css\">body { background: white; padding: 16px; }</template>\r\n<template class=\"ts\">\r\nassert(document.querySelector('h1') && document.querySelector('h1').textContent.trim() === 'Contact', 'tiêu đề phải ghi \"Contact\"');\r\nassert(document.querySelector('p') && document.querySelector('p').textContent.trim() === 'Email me anytime.', 'đoạn văn phải ghi \"Email me anytime.\"');\r\nassert(getComputedStyle(document.body).backgroundColor === 'rgb(255, 215, 0)', 'đặt nền trang thành gold');\r\n</template>\r\n</div>","en":"<h3>Lesson 1 — How the web works</h3>\r\n<p>Every time you open a website — a news page, a shop, a video app — a lot happens in the half-second before it appears. Your device sends a <b>request</b> across the internet to another computer, that computer sends files back, and your <b>browser</b> turns those files into the page you see and touch. Before you write a single line of code, it pays to understand this journey. It's the mental model everything else in this course hangs on.</p>\r\n<p>Here's the key idea we'll build on for sixteen lessons: a web page is made of <b>three separate languages</b>, each with one job. <b>HTML</b> is the <i>structure</i> — the headings, paragraphs, images and buttons (the \"what\"). <b>CSS</b> is the <i>style</i> — colours, spacing, fonts and layout (the \"how it looks\"). <b>JavaScript</b> is the <i>behaviour</i> — what happens when you click, type or scroll (the \"what it does\"). Same three languages power <i>every</i> website on earth, from a personal blog to a bank.</p>\r\n<p>You won't just read about this — you'll <b>build it</b>. Most of this lesson is real editing: you'll change headings, recolour text, restyle backgrounds and assemble tiny pages in a live editor, pressing <b>Run</b> to see the website render and get graded instantly. There's no syntax to memorise yet; you edit what's given and watch it come alive. Getting it wrong is fine — you just try again until it passes.</p>\r\n\r\n<h4>1. The request–response journey</h4>\r\n<p>When you type an address (a <b>URL</b>) and press Enter, your browser (the <b>client</b>) sends a <b>request</b> to a <b>server</b> — a computer somewhere whose job is to hold and hand out web files. The server sends back a <b>response</b>: the page's files. This back-and-forth is the heartbeat of the web.</p>\r\n<figure class=\"diagram\">\r\n<svg viewBox=\"0 0 470 170\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"13\">\r\n  <rect x=\"20\" y=\"55\" width=\"130\" height=\"60\" rx=\"8\" fill=\"#121C30\" stroke=\"#7FD1C0\"/>\r\n  <text x=\"85\" y=\"82\" text-anchor=\"middle\" fill=\"#E8E4D8\" font-size=\"14\">Your browser</text>\r\n  <text x=\"85\" y=\"102\" text-anchor=\"middle\" fill=\"#8FA0BC\" font-size=\"11\">(the client)</text>\r\n  <rect x=\"320\" y=\"55\" width=\"130\" height=\"60\" rx=\"8\" fill=\"#121C30\" stroke=\"#F5B942\"/>\r\n  <text x=\"385\" y=\"82\" text-anchor=\"middle\" fill=\"#E8E4D8\" font-size=\"14\">The server</text>\r\n  <text x=\"385\" y=\"102\" text-anchor=\"middle\" fill=\"#8FA0BC\" font-size=\"11\">(holds the files)</text>\r\n  <line x1=\"152\" y1=\"72\" x2=\"316\" y2=\"72\" stroke=\"#F5B942\" stroke-width=\"2\" marker-end=\"url(#ar)\"/>\r\n  <text x=\"234\" y=\"64\" text-anchor=\"middle\" fill=\"#F5B942\" font-size=\"12\">1. request →</text>\r\n  <line x1=\"318\" y1=\"100\" x2=\"154\" y2=\"100\" stroke=\"#7FD1C0\" stroke-width=\"2\" marker-end=\"url(#ar2)\"/>\r\n  <text x=\"236\" y=\"118\" text-anchor=\"middle\" fill=\"#7FD1C0\" font-size=\"12\">← 2. response (HTML, CSS, JS)</text>\r\n  <defs>\r\n    <marker id=\"ar\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L7,3 L0,6 Z\" fill=\"#F5B942\"/></marker>\r\n    <marker id=\"ar2\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L7,3 L0,6 Z\" fill=\"#7FD1C0\"/></marker>\r\n  </defs>\r\n</svg>\r\n<figcaption>The browser asks; the server answers with the files that make up the page.</figcaption>\r\n</figure>\r\n<div class=\"ex\" data-kind=\"quiz\" data-a=\"1\"><span class=\"exq\"><b>Exercise 1.</b> In this journey, what does the <b>server</b> do?</span>\r\n<ol class=\"opts\">\r\n<li>It draws the page on your screen.</li>\r\n<li>It stores the web files and sends them back when asked.</li>\r\n<li>It decides what colour the buttons are.</li>\r\n<li>It is the same thing as your browser.</li>\r\n</ol></div>\r\n\r\n<h4>2. Three languages, three jobs</h4>\r\n<p>The response is (mostly) three kinds of file, each with a single responsibility. Keep this table in your head — the whole course is organised around it. In the next sections you'll build a small page one layer at a time and <i>feel</i> the difference.</p>\r\n<table class=\"res\"><tr><th>Language</th><th>Job</th><th>Think of a house</th></tr>\r\n<tr><td><code>HTML</code></td><td><b>Structure</b> — headings, text, images, buttons</td><td>the walls &amp; rooms</td></tr>\r\n<tr><td><code>CSS</code></td><td><b>Style</b> — colours, fonts, spacing, layout</td><td>the paint &amp; furniture</td></tr>\r\n<tr><td><code>JavaScript</code></td><td><b>Behaviour</b> — what happens on click/type/scroll</td><td>the electricity &amp; plumbing</td></tr></table>\r\n\r\n<h4>3. HTML — structure you can edit</h4>\r\n<p>Below is a tiny page written in <b>HTML only</b> — pure structure, no styling. Press <b>▶ Run</b> and watch it render in the preview. It works, but looks plain: black text on white, default fonts. That's HTML doing its one job — structure — and nothing more.</p>\r\n<div class=\"ex\" data-kind=\"web\"><span class=\"exq\"><b>Exercise 2.</b> Run this HTML-only page and read the result. Then change some text between the tags and Run again to see it update.</span>\r\n<template class=\"st\">&lt;!doctype html&gt;\r\n&lt;html&gt;\r\n  &lt;body&gt;\r\n    &lt;h1&gt;Dojo News&lt;/h1&gt;\r\n    &lt;p&gt;Structure with no styling looks plain — and that's fine.&lt;/p&gt;\r\n    &lt;button&gt;Read more&lt;/button&gt;\r\n  &lt;/body&gt;\r\n&lt;/html&gt;</template>\r\n</div>\r\n<p>Now your turn. The text you see on a page lives <i>between</i> an opening tag like <code>&lt;h1&gt;</code> and a closing tag like <code>&lt;/h1&gt;</code>. Change that text and the page changes.</p>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 3. ✍️ Your turn.</b> Change the text between <code>&lt;h1&gt;</code> and <code>&lt;/h1&gt;</code> so the heading reads exactly <code>Dojo Daily</code>, then press Run.</span>\r\n<template class=\"st\">&lt;h1&gt;Change this text&lt;/h1&gt;</template>\r\n<template class=\"ts\">\r\nassert(document.querySelector('h1'), 'keep the h1 heading');\r\nassert(document.querySelector('h1').textContent.trim() === 'Dojo Daily', 'the heading should read exactly \"Dojo Daily\"');\r\n</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 4. ✍️ Your turn.</b> A paragraph uses <code>&lt;p&gt;…&lt;/p&gt;</code>. Change the paragraph text so it reads exactly <code>Welcome to my website.</code></span>\r\n<template class=\"st\">&lt;h1&gt;Dojo Daily&lt;/h1&gt;\r\n&lt;p&gt;Old text here&lt;/p&gt;</template>\r\n<template class=\"ts\">\r\nassert(document.querySelector('p'), 'keep the paragraph');\r\nassert(document.querySelector('p').textContent.trim() === 'Welcome to my website.', 'the paragraph should read exactly \"Welcome to my website.\"');\r\n</template>\r\n</div>\r\n\r\n<h4>4. CSS — style you can change</h4>\r\n<p>Same structure — but now we've added a <b>CSS</b> block inside <code>&lt;style&gt;</code>. Nothing about the <i>content</i> changed; only the <i>look</i> did. Run it and compare: colours, spacing and fonts appear, but it's the exact same headings and button underneath. This is the power of separating structure from style.</p>\r\n<div class=\"ex\" data-kind=\"web\"><span class=\"exq\"><b>Exercise 5.</b> Run this page and see how CSS restyles the very same HTML. Try changing <code>tomato</code> to <code>teal</code>.</span>\r\n<template class=\"st\">&lt;!doctype html&gt;\r\n&lt;html&gt;\r\n  &lt;head&gt;\r\n    &lt;style&gt;\r\n      body { font-family: sans-serif; padding: 20px; background: #0E1626; color: #E8E4D8; }\r\n      h1 { color: tomato; }\r\n      button { background: #F5B942; border: none; padding: 8px 14px; border-radius: 6px; }\r\n    &lt;/style&gt;\r\n  &lt;/head&gt;\r\n  &lt;body&gt;\r\n    &lt;h1&gt;Dojo News&lt;/h1&gt;\r\n    &lt;p&gt;Same structure — new look, thanks to CSS.&lt;/p&gt;\r\n    &lt;button&gt;Read more&lt;/button&gt;\r\n  &lt;/body&gt;\r\n&lt;/html&gt;</template>\r\n</div>\r\n<p>From here on, the <b>HTML</b> and <b>CSS</b> live in separate boxes — edit either one and press Run to combine them. A CSS rule looks like <code>selector { property: value; }</code>.</p>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 6. ✍️ Your turn.</b> In the <b>CSS</b> box, change <code>black</code> to <code>gold</code> so the title turns gold, then press Run.</span>\r\n<template class=\"html\">&lt;h1 id=\"title\"&gt;Sunset Blog&lt;/h1&gt;</template>\r\n<template class=\"css\">#title { color: black; }</template>\r\n<template class=\"ts\">\r\nassert(getComputedStyle(document.querySelector('#title')).color === 'rgb(255, 215, 0)', 'set the title colour to gold (change black to gold in the CSS)');\r\n</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 7. ✍️ Your turn.</b> Give the page a dark theme: in the <b>CSS</b>, change the <code>body</code> background from <code>white</code> to <code>navy</code>, then press Run.</span>\r\n<template class=\"html\">&lt;h1&gt;Night mode&lt;/h1&gt;\r\n&lt;p&gt;A whole new mood.&lt;/p&gt;</template>\r\n<template class=\"css\">body { background: white; color: white; padding: 16px; }</template>\r\n<template class=\"ts\">\r\nassert(getComputedStyle(document.body).backgroundColor === 'rgb(0, 0, 128)', 'set the body background to navy (change white to navy)');\r\n</template>\r\n</div>\r\n\r\n<h4>5. JavaScript — behaviour</h4>\r\n<p>Structure and style are <b>static</b> — they just sit there. <b>JavaScript</b> makes a page <i>react</i>. The page below has a button wired with a tiny script: click it and the text changes. You don't need to understand the code yet (that's the second half of the course) — just run it, click the button, and notice that <i>something happens</i>.</p>\r\n<div class=\"ex\" data-kind=\"web\"><span class=\"exq\"><b>Exercise 8.</b> Run the page, then click the <b>Cheer!</b> button in the preview and watch the message change.</span>\r\n<template class=\"st\">&lt;!doctype html&gt;\r\n&lt;html&gt;\r\n  &lt;head&gt;&lt;style&gt;body{font-family:sans-serif;padding:20px}&lt;/style&gt;&lt;/head&gt;\r\n  &lt;body&gt;\r\n    &lt;h1 id=\"msg\"&gt;Hello&lt;/h1&gt;\r\n    &lt;button onclick=\"document.getElementById('msg').textContent = 'You clicked! 🎉'\"&gt;Cheer!&lt;/button&gt;\r\n  &lt;/body&gt;\r\n&lt;/html&gt;</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"quiz\" data-a=\"2\"><span class=\"exq\"><b>Exercise 9.</b> Before you clicked, the heading said \"Hello\". After the click it changed. Which language made that <b>change happen on click</b>?</span>\r\n<ol class=\"opts\">\r\n<li>HTML</li>\r\n<li>CSS</li>\r\n<li>JavaScript</li>\r\n<li>The URL</li>\r\n</ol></div>\r\n\r\n<h4>6. Put the layers together</h4>\r\n<p>You've now touched all three layers. Let's combine editing across them. Remember: <b>text</b> lives in the HTML, <b>colour</b> lives in the CSS.</p>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 10. ✍️ Your turn.</b> Edit the <b>HTML</b> so the heading reads <code>My Shop</code> and the button reads <code>Buy now</code>, then press Run.</span>\r\n<template class=\"st\">&lt;h1&gt;Store name&lt;/h1&gt;\r\n&lt;button&gt;Label&lt;/button&gt;</template>\r\n<template class=\"ts\">\r\nassert(document.querySelector('h1') && document.querySelector('h1').textContent.trim() === 'My Shop', 'the heading should read \"My Shop\"');\r\nassert(document.querySelector('button') && document.querySelector('button').textContent.trim() === 'Buy now', 'the button should read \"Buy now\"');\r\n</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 11. ✍️ Your turn.</b> Two files this time: in the <b>HTML</b> change the heading text to <code>Big Sale</code>, and in the <b>CSS</b> change its colour to <code>red</code>. Then press Run.</span>\r\n<template class=\"html\">&lt;h1 id=\"hero\"&gt;Change me&lt;/h1&gt;</template>\r\n<template class=\"css\">#hero { color: black; }</template>\r\n<template class=\"ts\">\r\nassert(document.querySelector('#hero') && document.querySelector('#hero').textContent.trim() === 'Big Sale', 'the heading should read \"Big Sale\"');\r\nassert(getComputedStyle(document.querySelector('#hero')).color === 'rgb(255, 0, 0)', 'set the heading colour to red in the CSS');\r\n</template>\r\n</div>\r\n<div class=\"ex stretch\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 12. 🔥 Stretch — ✍️ your turn.</b> Build a tiny page from scratch of text. Replace the blanks so the heading says <code>My First Page</code> and the paragraph says <code>I am learning web.</code> — then press Run.</span>\r\n<template class=\"st\">&lt;h1&gt;___&lt;/h1&gt;\r\n&lt;p&gt;___&lt;/p&gt;</template>\r\n<template class=\"ts\">\r\nassert(document.querySelector('h1') && document.querySelector('h1').textContent.trim() === 'My First Page', 'the heading (h1) should say \"My First Page\"');\r\nassert(document.querySelector('p') && document.querySelector('p').textContent.trim() === 'I am learning web.', 'the paragraph (p) should say \"I am learning web.\"');\r\n</template>\r\n</div>\r\n\r\n<h4>🏠 Homework</h4>\r\n<p>Four take-home exercises, auto-graded right on the page — mostly hands-on. The last one is a stretch.</p>\r\n<div class=\"ex homework\" data-kind=\"quiz\" data-a=\"0\"><span class=\"exq\"><b>Exercise 1.</b> Which trio lists the three core web languages in the order <b>structure, style, behaviour</b>?</span>\r\n<ol class=\"opts\">\r\n<li>HTML, CSS, JavaScript</li>\r\n<li>CSS, HTML, JavaScript</li>\r\n<li>JavaScript, CSS, HTML</li>\r\n<li>HTML, JavaScript, CSS</li>\r\n</ol></div>\r\n<div class=\"ex homework\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 2. ✍️</b> Change the button's label so it reads exactly <code>Sign up</code>, then press Run.</span>\r\n<template class=\"st\">&lt;button&gt;Click here&lt;/button&gt;</template>\r\n<template class=\"ts\">\r\nassert(document.querySelector('button'), 'keep the button');\r\nassert(document.querySelector('button').textContent.trim() === 'Sign up', 'the button should read exactly \"Sign up\"');\r\n</template>\r\n</div>\r\n<div class=\"ex homework\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 3. ✍️</b> Two files: in the <b>HTML</b> change the heading text to <code>About Me</code>, and in the <b>CSS</b> change its colour to <code>green</code>. Then press Run.</span>\r\n<template class=\"html\">&lt;h1 id=\"t\"&gt;Heading&lt;/h1&gt;</template>\r\n<template class=\"css\">#t { color: black; }</template>\r\n<template class=\"ts\">\r\nassert(document.querySelector('#t') && document.querySelector('#t').textContent.trim() === 'About Me', 'the heading should read \"About Me\"');\r\nassert(getComputedStyle(document.querySelector('#t')).color === 'rgb(0, 128, 0)', 'set the heading colour to green in the CSS');\r\n</template>\r\n</div>\r\n<div class=\"ex homework stretch\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 4. 🔥 Stretch — ✍️</b> Build a little card. In the <b>HTML</b> make the heading say <code>Contact</code> and the paragraph say <code>Email me anytime.</code>, and in the <b>CSS</b> change the page background to <code>gold</code>. Then press Run.</span>\r\n<template class=\"html\">&lt;h1&gt;___&lt;/h1&gt;\r\n&lt;p&gt;___&lt;/p&gt;</template>\r\n<template class=\"css\">body { background: white; padding: 16px; }</template>\r\n<template class=\"ts\">\r\nassert(document.querySelector('h1') && document.querySelector('h1').textContent.trim() === 'Contact', 'the heading should say \"Contact\"');\r\nassert(document.querySelector('p') && document.querySelector('p').textContent.trim() === 'Email me anytime.', 'the paragraph should say \"Email me anytime.\"');\r\nassert(getComputedStyle(document.body).backgroundColor === 'rgb(255, 215, 0)', 'set the page background to gold');\r\n</template>\r\n</div>"}},{"t":{"vi":"HTML căn bản","en":"HTML essentials"},"enc":"XZXK8aU9bEsruq5ba/cwv7nWsLNj2ZeBbJDFX00J3wc1z5/22E5IH4WLUNIZpGsuoICN/ZTaTfkYhyrg8MtfVknYcsPbqbVxLSjUdGo/cTScz9/K6BD+sx29yUef6mTPeDeMw4tOffiA4/j4//fxF2stDTFyeF4do6d9zCP3KQbzYoFygBVLSgNKbJfMVkTwJQ6x84K4RgjLNQ26mPm3vLNQKnFssa9+cIIN9GAMUKBpbmCAHnXrbrVT8LCKgLHdpz/r53NrFzlQuSrNHCcv3I1oVtR98LZUYw6N4zxMz1bCFJEzfYxZbggEkt+8BlhVSOp2sS72882XF3mYLyzWwdoWZNFJDEvnmXRK3WUABhK1yk5FBfZCi2B9+isyeVfp+AceF3ScnWoDp0NCthnjh9xF0E7pKhD2ScvzZUUSqrmaHdmPmUrFXVZw1mgyQM26CvGAEMppuQlIhWEIK9Te4RvOJdBwOL9Qf6ikTpbngvVuohMp+Ic5OJVhW/D1cXEYyh1qZqTnZOJhbgMeP8PdYv9b1blVdURsv+3G5XiZ09RdbZGdNipF6PJyPYH8xFcbEezJkXA/EWgBiAwcWlZyNFZoO+EY8GdodR2/5MbAirNeI/F2lmkMf39azgiVrz88I/tnXIDyqZjrNbJjTKYqlUv6omW/wCx0KefHvmB39Yt74pC6iHCmkLiQ4r/U9X7XdvINmq//WAFaUjooe2d89tpxCdcp6Vl0ESYZ+pV8lt9I/WdOS5DUwerVUOgrt5pnf2Tad5yI82HyJrZlnt001iJEtzAiprh/VxscLflOy7sqUjUDNwWuLEH/NgFbpVZhk6N8xU7Yvf61VcKlWNnpvskq1txDRNyDwz8YI+fKSmGrzg0LN+ZqvLlkZcSJQi7xFU0yRP97XpydbFnEXuh41/+C3Zi0wqhWef/cqv2NJ1UwCnaEMdBFCRBoExw8A3nTTjasAAnf70F/L8VQQ8/HeUyqe7Nzab2jEIZSV84PWrHskMjES/ILn34hTnCu0R/ORZXjsicGl2KAp3hYbGxa/61GB2TpCW0wocFE8NU4VHcT3YpPebrbMPc2Hva+unxv3ZJYbXIWdeQLMjtiJk1FKOlxVAueOTnEufXchmswA+aUobUOAHI1rLwZVsh2GjcLD+Jx6PYL4L5uViY1iBZUhDpZ31o+yu9vR+QH11vYweSzwIxj+V2Y+bbqFGZaW5bsBA/4Sj6yY6QixGveqLHdIwFPVEJrUzNPZD92nFjk5Wyb+YT2mD/3NwpxGCrZKnEBxvuITc/jVAjmmdycBfaPOYtX04ENHGxKRjh/5xljS0twkGNpoofYI+Nj1Jrd9Ls9RQHJ9YM8i7BHSelQwjYBi3gb8WvvOMWWNj3pHs1ZNGrZRJaDaax6YxJKnrW/PGxZYBQrb8cNInOo395Lb3c4boCAVQQWgWcZhJy6urMX8AZiwIKtAKwGtmPEqVC9cnjRKL4qk1gQdfGl4jz6qM4gLHtPf+OBUWyJgIw1M9GE98v0GyXPVx5cOVQmjgaVHtVCaJiaTvdORDT1V+bLHvnyyEOufU0weIOqZ+yCUdRzIdOMJ2o6xCbeN4WQG/G5SeKl1Dj5ayrkIYlBTGxh/pVucmXrww9+NIIsSczUpjvIEUE6/Ulco9apai6coYOdQ/ksfXIEO65eO5FyUsgnzQUL06SXusm4sSmiP1t05cpC2oQtGOAKaWh5EAr94xUEpMwpqEXhzcaS76SwE+LhIhK0CsSSoZVJio5IPuiwK31jlzfWFciG3TveytAbyZYN8bfcQN/SJojX+i7+y6loUjJJiDmjKFrJtmusVUTZXNwIrBD5taT+wEF5tTS9gcUfBnJw+8XCtZ1f6gjLMSuMOS+9JB9/YBrTla4dK1ZxR
