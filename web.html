;span class=\"badge\"&gt;Hot&lt;/span&gt;&lt;/div&gt;</template>\r\n<template class=\"css\">.card { position: relative; height: 70px; background: navy; color: white; padding: 10px; }\r\n.badge { background: #E2604C; color: white; padding: 3px 7px; }</template>\r\n<template class=\"ts\">\r\nvar s = getComputedStyle(document.querySelector('.badge'));\r\nassert(s.position === 'absolute', 'đặt position thành absolute');\r\nassert(s.bottom === '0px', 'đặt bottom thành 0');\r\nassert(s.left === '0px', 'đặt left thành 0');\r\n</template>\r\n</div>\r\n<div class=\"ex homework stretch\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 4. 🔥 Nâng cao — ✍️</b> Dựng một footer fixed luôn nằm trên nội dung: <code>.footer</code> là <code>position: fixed</code>, <code>bottom: 0</code>, <code>left: 0</code>, <code>right: 0</code>, với <code>z-index: 5</code>.</span>\r\n<template class=\"html\">&lt;div class=\"footer\"&gt;© Dojo&lt;/div&gt;</template>\r\n<template class=\"css\">.footer { background: #121C30; color: #E8E4D8; padding: 10px; }</template>\r\n<template class=\"ts\">\r\nvar s = getComputedStyle(document.querySelector('.footer'));\r\nassert(s.position === 'fixed', 'đặt position thành fixed');\r\nassert(s.bottom === '0px', 'đặt bottom thành 0');\r\nassert(s.zIndex === '5', 'đặt z-index thành 5');\r\n</template>\r\n</div>","en":"<h3>Lesson 6 — CSS positioning &amp; moving things</h3>\r\n<p>Flexbox arranges boxes in tidy rows and columns — but sometimes you need to place something <i>exactly</i>: a \"New!\" badge pinned to the corner of a card, a header that stays glued to the top as you scroll, a notification dot floating over an icon. That's the job of the <code>position</code> property. It lets you lift an element out of the normal flow and move it precisely with <code>top</code>, <code>right</code>, <code>bottom</code> and <code>left</code>.</p>\r\n<p>By default every element is <code>position: static</code> — it just sits where the flow puts it, and the offset properties do nothing. The magic starts when you change that. <code>relative</code> nudges an element from its normal spot; <code>absolute</code> pins it to a chosen container; <code>fixed</code> locks it to the screen; and <code>sticky</code> lets it scroll until it reaches an edge, then holds. When boxes overlap, <code>z-index</code> decides which one sits on top.</p>\r\n<p>These effects are all about <i>movement</i>, so you'll watch every one happen live. Set a property, press Run, and see the box jump, pin or float into place. Let's move some things around.</p>\r\n\r\n<h4>1. relative — nudge from home</h4>\r\n<p><code>position: relative</code> keeps an element in the flow but lets you shift it with <code>top</code>/<code>left</code>/<code>right</code>/<code>bottom</code>. <code>top: 20px</code> pushes it <i>down</i> 20px from where it would normally sit; <code>left: 20px</code> pushes it right.</p>\r\n<div class=\"ex\" data-kind=\"web\"><span class=\"exq\"><b>Exercise 1.</b> Run. The middle box is nudged down and right. Change its <code>top</code> and <code>left</code> and Run again.</span>\r\n<template class=\"html\">&lt;span class=\"box\"&gt;A&lt;/span&gt;&lt;span class=\"box move\"&gt;B&lt;/span&gt;&lt;span class=\"box\"&gt;C&lt;/span&gt;</template>\r\n<template class=\"css\">.box { display: inline-block; background: #7FD1C0; color: #0E1626; padding: 10px; margin: 4px; }\r\n.move { position: relative; top: 20px; left: 20px; background: #F5B942; }</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"quiz\" data-a=\"0\"><span class=\"exq\"><b>Exercise 2.</b> What is the default <code>position</code> value of every element?</span>\r\n<ol class=\"opts\">\r\n<li><code>static</code></li>\r\n<li><code>relative</code></li>\r\n<li><code>absolute</code></li>\r\n<li><code>fixed</code></li>\r\n</ol></div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 3. ✍️ Your turn.</b> Nudge the box down. Set <code>.box</code>'s <code>position</code> to <code>relative</code> and its <code>top</code> to <code>20px</code>.</span>\r\n<template class=\"html\">&lt;div class=\"box\"&gt;Move me&lt;/div&gt;</template>\r\n<template class=\"css\">.box { background: gold; padding: 10px; }</template>\r\n<template class=\"ts\">\r\nvar s = getComputedStyle(document.querySelector('.box'));\r\nassert(s.position === 'relative', 'set position to relative');\r\nassert(s.top === '20px', 'set top to 20px');\r\n</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 4. ✍️ Your turn.</b> Now slide it right. Keep <code>position: relative</code> and set <code>left</code> to <code>30px</code>.</span>\r\n<template class=\"html\">&lt;div class=\"box\"&gt;Slide me&lt;/div&gt;</template>\r\n<template class=\"css\">.box { position: relative; background: teal; color: white; padding: 10px; }</template>\r\n<template class=\"ts\">\r\nvar s = getComputedStyle(document.querySelector('.box'));\r\nassert(s.position === 'relative', 'keep position relative');\r\nassert(s.left === '30px', 'set left to 30px');\r\n</template>\r\n</div>\r\n\r\n<h4>2. absolute — pin to a container</h4>\r\n<p><code>position: absolute</code> takes an element <i>out of the flow</i> and pins it to its nearest ancestor that has a position set (usually a <code>relative</code> parent). This is how you drop a badge into a corner: make the card <code>relative</code>, make the badge <code>absolute</code>, then push it with <code>top: 0; right: 0</code>.</p>\r\n<figure class=\"diagram\">\r\n<svg viewBox=\"0 0 380 160\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"12\">\r\n  <rect x=\"40\" y=\"30\" width=\"300\" height=\"110\" fill=\"#121C30\" stroke=\"#7FD1C0\"/>\r\n  <text x=\"55\" y=\"90\" fill=\"#E8E4D8\">.card (position: relative)</text>\r\n  <rect x=\"280\" y=\"20\" width=\"60\" height=\"26\" fill=\"#E2604C\"/>\r\n  <text x=\"310\" y=\"37\" text-anchor=\"middle\" fill=\"#0E1626\" font-size=\"11\">badge</text>\r\n  <text x=\"230\" y=\"15\" fill=\"#F5B942\" font-size=\"11\">absolute; top:0; right:0</text>\r\n</svg>\r\n<figcaption>A relative card + an absolute badge pinned to its top-right corner.</figcaption>\r\n</figure>\r\n<div class=\"ex\" data-kind=\"web\"><span class=\"exq\"><b>Exercise 5.</b> Run and see the badge pinned to the corner. Change <code>right: 0</code> to <code>left: 0</code> and Run.</span>\r\n<template class=\"html\">&lt;div class=\"card\"&gt;Product&lt;span class=\"badge\"&gt;New&lt;/span&gt;&lt;/div&gt;</template>\r\n<template class=\"css\">.card { position: relative; height: 80px; background: #121C30; color: #E8E4D8; padding: 12px; }\r\n.badge { position: absolute; top: 0; right: 0; background: #E2604C; color: white; padding: 4px 8px; }</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 6. ✍️ Your turn.</b> Pin the dot to the top-right. Set <code>.dot</code>'s <code>position</code> to <code>absolute</code>, <code>top</code> to <code>0</code>, and <code>right</code> to <code>0</code>.</span>\r\n<template class=\"html\">&lt;div class=\"wrap\"&gt;Inbox&lt;span class=\"dot\"&gt;3&lt;/span&gt;&lt;/div&gt;</template>\r\n<template class=\"css\">.wrap { position: relative; height: 60px; background: navy; color: white; padding: 10px; }\r\n.dot { background: gold; padding: 2px 7px; }</template>\r\n<template class=\"ts\">\r\nvar s = getComputedStyle(document.querySelector('.dot'));\r\nassert(s.position === 'absolute', 'set position to absolute');\r\nassert(s.top === '0px', 'set top to 0');\r\nassert(s.right === '0px', 'set right to 0');\r\n</template>\r\n</div>\r\n\r\n<h4>3. z-index — who sits on top</h4>\r\n<p>When positioned boxes overlap, the one with the higher <code>z-index</code> wins and appears in front. It only works on elements that have a <code>position</code> other than <code>static</code>.</p>\r\n<div class=\"ex\" data-kind=\"web\"><span class=\"exq\"><b>Exercise 7.</b> Run — the gold box covers the teal one. Raise the teal box's <code>z-index</code> above <code>2</code> and Run to flip which is on top.</span>\r\n<template class=\"html\">&lt;div class=\"a\"&gt;teal&lt;/div&gt;&lt;div class=\"b\"&gt;gold&lt;/div&gt;</template>\r\n<template class=\"css\">.a, .b { position: absolute; width: 90px; height: 90px; padding: 8px; }\r\n.a { background: teal; color: white; top: 20px; left: 20px; z-index: 1; }\r\n.b { background: gold; top: 50px; left: 50px; z-index: 2; }</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 8. ✍️ Your turn.</b> Bring the front box forward. Set <code>.front</code>'s <code>z-index</code> to <code>10</code>.</span>\r\n<template class=\"html\">&lt;div class=\"back\"&gt;back&lt;/div&gt;&lt;div class=\"front\"&gt;front&lt;/div&gt;</template>\r\n<template class=\"css\">.back, .front { position: absolute; width: 80px; height: 80px; padding: 6px; }\r\n.back { background: #E2604C; top: 10px; left: 10px; z-index: 5; }\r\n.front { background: gold; top: 30px; left: 30px; }</template>\r\n<template class=\"ts\">\r\nassert(getComputedStyle(document.querySelector('.front')).zIndex === '10', 'set .front z-index to 10');\r\n</template>\r\n</div>\r\n\r\n<h4>4. fixed &amp; sticky — stay in view</h4>\r\n<p><code>position: fixed</code> pins an element to the <b>screen</b> — it stays put even as the page scrolls (think of a top navbar that's always there). <code>position: sticky</code> is a hybrid: the element scrolls normally until it reaches a given offset (like <code>top: 0</code>), then \"sticks\" there.</p>\r\n<div class=\"ex\" data-kind=\"web\"><span class=\"exq\"><b>Exercise 9.</b> Run and see a fixed banner sit at the top of the preview.</span>\r\n<template class=\"html\">&lt;div class=\"banner\"&gt;Always here&lt;/div&gt;\r\n&lt;p style=\"margin-top:50px\"&gt;Page content…&lt;/p&gt;</template>\r\n<template class=\"css\">.banner { position: fixed; top: 0; left: 0; right: 0; background: #F5B942; color: #0E1626; padding: 10px; }</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 10. ✍️ Your turn.</b> Lock the header to the screen. Set <code>.header</code>'s <code>position</code> to <code>fixed</code> and <code>top</code> to <code>0</code>.</span>\r\n<template class=\"html\">&lt;div class=\"header\"&gt;My Site&lt;/div&gt;</template>\r\n<template class=\"css\">.header { background: #121C30; color: #E8E4D8; padding: 12px; }</template>\r\n<template class=\"ts\">\r\nvar s = getComputedStyle(document.querySelector('.header'));\r\nassert(s.position === 'fixed', 'set position to fixed');\r\nassert(s.top === '0px', 'set top to 0');\r\n</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 11. ✍️ Your turn.</b> Make a sticky bar. Set <code>.bar</code>'s <code>position</code> to <code>sticky</code> and <code>top</code> to <code>0</code>.</span>\r\n<template class=\"html\">&lt;div class=\"bar\"&gt;Sticky menu&lt;/div&gt;</template>\r\n<template class=\"css\">.bar { background: teal; color: white; padding: 10px; }</template>\r\n<template class=\"ts\">\r\nvar s = getComputedStyle(document.querySelector('.bar'));\r\nassert(s.position === 'sticky', 'set position to sticky');\r\nassert(s.top === '0px', 'set top to 0');\r\n</template>\r\n</div>\r\n\r\n<h4>5. Put it together</h4>\r\n<div class=\"ex stretch\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 12. 🔥 Stretch — ✍️ your turn.</b> Pin a \"Sale\" badge to a card corner and lift it above other content. Make <code>.card</code> <code>position: relative</code>. Make <code>.tag</code> <code>position: absolute</code> with <code>top: 8px</code>, <code>right: 8px</code>, and <code>z-index: 2</code>.</span>\r\n<template class=\"html\">&lt;div class=\"card\"&gt;&lt;h3&gt;Shoes&lt;/h3&gt;&lt;span class=\"tag\"&gt;Sale&lt;/span&gt;&lt;/div&gt;</template>\r\n<template class=\"css\">.card { height: 90px; background: #121C30; color: #E8E4D8; padding: 12px; }\r\n.tag { background: gold; padding: 3px 8px; }</template>\r\n<template class=\"ts\">\r\nassert(getComputedStyle(document.querySelector('.card')).position === 'relative', 'set .card position to relative');\r\nvar s = getComputedStyle(document.querySelector('.tag'));\r\nassert(s.position === 'absolute', 'set .tag position to absolute');\r\nassert(s.top === '8px', 'set .tag top to 8px');\r\nassert(s.right === '8px', 'set .tag right to 8px');\r\nassert(s.zIndex === '2', 'set .tag z-index to 2');\r\n</template>\r\n</div>\r\n\r\n<h4>🏠 Homework</h4>\r\n<p>Four take-home exercises, auto-graded — all hands-on. The last one is a stretch.</p>\r\n<div class=\"ex homework\" data-kind=\"quiz\" data-a=\"2\"><span class=\"exq\"><b>Exercise 1.</b> An <code>absolute</code> element is positioned relative to…</span>\r\n<ol class=\"opts\">\r\n<li>the whole screen, always</li>\r\n<li>its own original spot</li>\r\n<li>its nearest positioned ancestor</li>\r\n<li>the first paragraph on the page</li>\r\n</ol></div>\r\n<div class=\"ex homework\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 2. ✍️</b> Set <code>.box</code> to <code>position: relative</code> with <code>top: 15px</code> and <code>left: 15px</code>.</span>\r\n<template class=\"html\">&lt;div class=\"box\"&gt;Nudge&lt;/div&gt;</template>\r\n<template class=\"css\">.box { background: gold; padding: 10px; }</template>\r\n<template class=\"ts\">\r\nvar s = getComputedStyle(document.querySelector('.box'));\r\nassert(s.position === 'relative', 'set position to relative');\r\nassert(s.top === '15px', 'set top to 15px');\r\nassert(s.left === '15px', 'set left to 15px');\r\n</template>\r\n</div>\r\n<div class=\"ex homework\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 3. ✍️</b> Pin <code>.badge</code> to the bottom-left of the card: <code>position: absolute</code>, <code>bottom: 0</code>, <code>left: 0</code>.</span>\r\n<template class=\"html\">&lt;div class=\"card\"&gt;Item&lt;span class=\"badge\"&gt;Hot&lt;/span&gt;&lt;/div&gt;</template>\r\n<template class=\"css\">.card { position: relative; height: 70px; background: navy; color: white; padding: 10px; }\r\n.badge { background: #E2604C; color: white; padding: 3px 7px; }</template>\r\n<template class=\"ts\">\r\nvar s = getComputedStyle(document.querySelector('.badge'));\r\nassert(s.position === 'absolute', 'set position to absolute');\r\nassert(s.bottom === '0px', 'set bottom to 0');\r\nassert(s.left === '0px', 'set left to 0');\r\n</template>\r\n</div>\r\n<div class=\"ex homework stretch\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 4. 🔥 Stretch — ✍️</b> Build a fixed footer that stays on top of content: <code>.footer</code> is <code>position: fixed</code>, <code>bottom: 0</code>, <code>left: 0</code>, <code>right: 0</code>, with <code>z-index: 5</code>.</span>\r\n<template class=\"html\">&lt;div class=\"footer\"&gt;© Dojo&lt;/div&gt;</template>\r\n<template class=\"css\">.footer { background: #121C30; color: #E8E4D8; padding: 10px; }</template>\r\n<template class=\"ts\">\r\nvar s = getComputedStyle(document.querySelector('.footer'));\r\nassert(s.position === 'fixed', 'set position to fixed');\r\nassert(s.bottom === '0px', 'set bottom to 0');\r\nassert(s.zIndex === '5', 'set z-index to 5');\r\n</template>\r\n</div>"}},{"t":{"vi":"CSS Grid & responsive","en":"CSS grid & responsive design"},"kind":"free","html":{"vi":"<h3>Bài 7 — CSS Grid &amp; responsive</h3>\r\n<p>Flexbox tuyệt vời cho việc bố cục theo <b>một chiều</b> — một hàng hoặc một cột. Nhưng nhiều thiết kế là <b>lưới</b> thật sự: một thư viện ảnh, một bảng điều khiển, danh sách sản phẩm của cửa hàng — tất cả vừa hàng <i>vừa</i> cột cùng lúc. Cho việc đó, CSS có một công cụ chuyên dụng: <b>CSS Grid</b>. Bạn định nghĩa các cột, thả các mục vào, và trình duyệt xếp chúng thành một ma trận gọn gàng.</p>\r\n<p>Grid hoạt động giống flexbox: bạn đặt <code>display: grid</code> trên một <b>container</b>, rồi mô tả các cột bằng <code>grid-template-columns</code>. Thành phần thần kỳ là <b>đơn vị phân số</b> <code>fr</code>, chia không gian còn lại thành các phần bằng nhau — <code>1fr 1fr 1fr</code> cho ba cột bằng nhau co giãn vừa mọi màn hình. Thêm <code>gap</code> để có khoảng cách, y hệt flexbox.</p>\r\n<p>Nửa còn lại của bài là <b>responsive</b> — làm cho một trang trông đẹp trên cả điện thoại <i>lẫn</i> laptop. Công cụ là <b>media query</b>: một khối CSS chỉ áp dụng dưới (hoặc trên) một bề rộng màn hình được chọn, cho phép bạn gộp lưới ba cột thành một cột trên màn hình hẹp. Bạn sẽ dựng lưới trực tiếp và xem nó phản hồi.</p>\r\n\r\n<h4>1. display: grid</h4>\r\n<p>Biến một container thành lưới và cho nó các cột. <code>grid-template-columns: 1fr 1fr 1fr</code> nghĩa là \"ba cột bằng nhau\". Các con tự động chảy vào các ô, xuống hàng mới khi cần.</p>\r\n<div class=\"ex\" data-kind=\"web\"><span class=\"exq\"><b>Bài tập 1.</b> Chạy — sáu hộp rơi vào lưới 3 cột. Đổi <code>1fr 1fr 1fr</code> thành <code>1fr 1fr</code> rồi Chạy để có hai cột.</span>\r\n<template class=\"html\">&lt;div class=\"grid\"&gt;\r\n  &lt;div class=\"box\"&gt;1&lt;/div&gt;&lt;div class=\"box\"&gt;2&lt;/div&gt;&lt;div class=\"box\"&gt;3&lt;/div&gt;\r\n  &lt;div class=\"box\"&gt;4&lt;/div&gt;&lt;div class=\"box\"&gt;5&lt;/div&gt;&lt;div class=\"box\"&gt;6&lt;/div&gt;\r\n&lt;/div&gt;</template>\r\n<template class=\"css\">.grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }\r\n.box { background: #7FD1C0; color: #0E1626; padding: 18px; text-align: center; }</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 2. ✍️ Đến lượt bạn.</b> Biến container thành lưới. Đặt <code>display</code> của <code>.grid</code> thành <code>grid</code>.</span>\r\n<template class=\"html\">&lt;div class=\"grid\"&gt;&lt;div class=\"box\"&gt;A&lt;/div&gt;&lt;div class=\"box\"&gt;B&lt;/div&gt;&lt;/div&gt;</template>\r\n<template class=\"css\">.grid { }\r\n.box { background: gold; padding: 12px; }</template>\r\n<template class=\"ts\">\r\nassert(getComputedStyle(document.querySelector('.grid')).display === 'grid', 'đặt display của .grid thành grid');\r\n</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 3. ✍️ Đến lượt bạn.</b> Làm ba cột bằng nhau. Trên <code>.grid</code> (đã là grid), đặt <code>grid-template-columns</code> thành <code>1fr 1fr 1fr</code>.</span>\r\n<template class=\"html\">&lt;div class=\"grid\"&gt;&lt;div class=\"box\"&gt;1&lt;/div&gt;&lt;div class=\"box\"&gt;2&lt;/div&gt;&lt;div class=\"box\"&gt;3&lt;/div&gt;&lt;/div&gt;</template>\r\n<template class=\"css\">.grid { display: grid; gap: 8px; }\r\n.box { background: teal; color: white; padding: 12px; }</template>\r\n<template class=\"ts\">\r\nvar cols = getComputedStyle(document.querySelector('.grid')).gridTemplateColumns.split(/\\s+/).filter(Boolean);\r\nassert(cols.length === 3, 'grid-template-columns phải định nghĩa đúng ba cột (1fr 1fr 1fr)');\r\n</template>\r\n</div>\r\n\r\n<h4>2. Khoảng cách và đơn vị phân số</h4>\r\n<p>Đơn vị <code>fr</code> chia sẻ không gian. <code>2fr 1fr</code> làm cột đầu rộng gấp đôi cột sau. <code>gap</code> thêm khoảng cách đều giữa mọi ô — không cần margin.</p>\r\n<div class=\"ex\" data-kind=\"web\"><span class=\"exq\"><b>Bài tập 4.</b> Chạy — cột đầu rộng gấp đôi. Đổi thành <code>1fr 3fr</code> rồi Chạy.</span>\r\n<template class=\"html\">&lt;div class=\"grid\"&gt;&lt;div class=\"box\"&gt;wide&lt;/div&gt;&lt;div class=\"box\"&gt;narrow&lt;/div&gt;&lt;/div&gt;</template>\r\n<template class=\"css\">.grid { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; }\r\n.box { background: #F5B942; color: #0E1626; padding: 16px; }</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 5. ✍️ Đến lượt bạn.</b> Thêm khoảng cách. Trên <code>.grid</code>, thêm <code>gap</code> là <code>16px</code>.</span>\r\n<template class=\"html\">&lt;div class=\"grid\"&gt;&lt;div class=\"box\"&gt;1&lt;/div&gt;&lt;div class=\"box\"&gt;2&lt;/div&gt;&lt;/div&gt;</template>\r\n<template class=\"css\">.grid { display: grid; grid-template-columns: 1fr 1fr; }\r\n.box { background: navy; color: white; padding: 12px; }</template>\r\n<template class=\"ts\">\r\nassert(getComputedStyle(document.querySelector('.grid')).rowGap === '16px', 'thêm gap: 16px vào lưới');\r\n</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"quiz\" data-a=\"2\"><span class=\"exq\"><b>Bài tập 6.</b> Trong lưới, <code>grid-template-columns: 1fr 1fr 1fr</code> tạo ra gì?</span>\r\n<ol class=\"opts\">\r\n<li>Ba hàng</li>\r\n<li>Một cột, ba hàng</li>\r\n<li>Ba cột rộng bằng nhau</li>\r\n<li>Một khoảng cách 3 pixel</li>\r\n</ol></div>\r\n\r\n<h4>3. Một lưới thẻ thật</h4>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 7. ✍️ Đến lượt bạn.</b> Bố cục một lưới sản phẩm: cho <code>.cards</code> là lưới với <b>ba</b> cột bằng nhau (<code>1fr 1fr 1fr</code>) và <code>gap</code> là <code>12px</code>.</span>\r\n<template class=\"html\">&lt;div class=\"cards\"&gt;\r\n  &lt;div class=\"card\"&gt;Book A&lt;/div&gt;&lt;div class=\"card\"&gt;Book B&lt;/div&gt;&lt;div class=\"card\"&gt;Book C&lt;/div&gt;\r\n&lt;/div&gt;</template>\r\n<template class=\"css\">.cards { }\r\n.card { background: #121C30; color: #E8E4D8; padding: 20px; text-align: center; }</template>\r\n<template class=\"ts\">\r\nvar s = getComputedStyle(document.querySelector('.cards'));\r\nassert(s.display === 'grid', 'đặt display thành grid');\r\nassert(s.gridTemplateColumns.split(/\\s+/).filter(Boolean).length === 3, 'dùng ba cột (1fr 1fr 1fr)');\r\nassert(s.rowGap === '12px', 'đặt gap thành 12px');\r\n</template>\r\n</div>\r\n\r\n<h4>4. Responsive &amp; media query</h4>\r\n<p>Màn hình điện thoại thì hẹp; laptop thì rộng. Thiết kế <b>responsive</b> điều chỉnh bố cục cho vừa. Công cụ cốt lõi là <b>media query</b>: <code>@media (max-width: 600px) { … }</code> — các luật bên trong chỉ áp dụng khi màn hình rộng 600px trở xuống. Một mẫu kinh điển: ba cột bình thường, một cột trên điện thoại.</p>\r\n<figure class=\"diagram\">\r\n<svg viewBox=\"0 0 420 150\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"12\">\r\n  <text x=\"20\" y=\"20\" fill=\"#8FA0BC\">Màn hình rộng → 3 cột</text>\r\n  <rect x=\"20\" y=\"28\" width=\"70\" height=\"40\" fill=\"#7FD1C0\"/><rect x=\"98\" y=\"28\" width=\"70\" height=\"40\" fill=\"#7FD1C0\"/><rect x=\"176\" y=\"28\" width=\"70\" height=\"40\" fill=\"#7FD1C0\"/>\r\n  <text x=\"20\" y=\"98\" fill=\"#8FA0BC\">Điện thoại → 1 cột</text>\r\n  <rect x=\"20\" y=\"106\" width=\"70\" height=\"12\" fill=\"#F5B942\"/><rect x=\"20\" y=\"120\" width=\"70\" height=\"12\" fill=\"#F5B942\"/><rect x=\"20\" y=\"134\" width=\"70\" height=\"12\" fill=\"#F5B942\"/>\r\n</svg>\r\n<figcaption>Một media query gộp lưới thành một cột trên màn hình hẹp.</figcaption>\r\n</figure>\r\n<div class=\"ex\" data-kind=\"web\"><span class=\"exq\"><b>Bài tập 8.</b> Chạy cái này. Nó hiện 3 cột; media query sẽ chuyển thành 1 cột trên điện thoại hẹp. (Thử thu nhỏ cửa sổ trình duyệt trên một trang đã triển khai thật.)</span>\r\n<template class=\"html\">&lt;div class=\"grid\"&gt;&lt;div class=\"box\"&gt;1&lt;/div&gt;&lt;div class=\"box\"&gt;2&lt;/div&gt;&lt;div class=\"box\"&gt;3&lt;/div&gt;&lt;/div&gt;</template>\r\n<template class=\"css\">.grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }\r\n.box { background: #7FD1C0; color: #0E1626; padding: 16px; text-align: center; }\r\n@media (max-width: 500px) {\r\n  .grid { grid-template-columns: 1fr; }\r\n}</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"quiz\" data-a=\"1\"><span class=\"exq\"><b>Bài tập 9.</b> Khi nào các luật bên trong <code>@media (max-width: 600px) { … }</code> áp dụng?</span>\r\n<ol class=\"opts\">\r\n<li>Luôn luôn</li>\r\n<li>Chỉ khi màn hình rộng 600px trở xuống</li>\r\n<li>Chỉ khi màn hình rộng hơn 600px</li>\r\n<li>Chỉ trên máy in</li>\r\n</ol></div>\r\n\r\n<h4>5. Đơn vị: px, %, và rem</h4>\r\n<p>Bạn đã dùng <code>px</code> (pixel cố định). Hai đơn vị nữa quan trọng: <code>%</code> đo theo phần trăm của cha (một hộp <code>width: 50%</code> rộng bằng nửa container — tự nhiên responsive), và <code>rem</code> co giãn theo cỡ chữ gốc (tuyệt cho chữ và khoảng cách biết thích ứng).</p>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 10. ✍️ Đến lượt bạn.</b> Làm thanh rộng nửa. Đặt <code>width</code> của <code>.bar</code> thành <code>50%</code>.</span>\r\n<template class=\"html\">&lt;div class=\"bar\"&gt;Half&lt;/div&gt;</template>\r\n<template class=\"css\">.bar { background: gold; padding: 10px; }</template>\r\n<template class=\"ts\">\r\nvar bar = document.querySelector('.bar');\r\nvar ratio = bar.offsetWidth / bar.parentElement.offsetWidth;\r\nassert(ratio > 0.4 && ratio < 0.6, 'đặt width thành 50% (khoảng nửa container)');\r\n</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 11. ✍️ Đến lượt bạn.</b> Dựng một thư viện ảnh responsive: cho <code>.gallery</code> là lưới với <b>hai</b> cột bằng nhau và <code>gap</code> là <code>10px</code>.</span>\r\n<template class=\"html\">&lt;div class=\"gallery\"&gt;&lt;div class=\"pic\"&gt;1&lt;/div&gt;&lt;div class=\"pic\"&gt;2&lt;/div&gt;&lt;div class=\"pic\"&gt;3&lt;/div&gt;&lt;div class=\"pic\"&gt;4&lt;/div&gt;&lt;/div&gt;</template>\r\n<template class=\"css\">.gallery { }\r\n.pic { background: #E2604C; color: white; padding: 24px; text-align: center; }</template>\r\n<template class=\"ts\">\r\nvar s = getComputedStyle(document.querySelector('.gallery'));\r\nassert(s.display === 'grid', 'đặt display thành grid');\r\nassert(s.gridTemplateColumns.split(/\\s+/).filter(Boolean).length === 2, 'dùng hai cột (1fr 1fr)');\r\nassert(s.rowGap === '10px', 'đặt gap thành 10px');\r\n</template>\r\n</div>\r\n<div class=\"ex stretch\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 12. 🔥 Nâng cao — ✍️ đến lượt bạn.</b> Làm một lưới bảng điều khiển: <code>.dash</code> là lưới với cột <code>1fr 2fr</code> (thanh bên hẹp + phần chính rộng), <code>gap</code> là <code>16px</code>, và <code>padding</code> là <code>12px</code>.</span>\r\n<template class=\"html\">&lt;div class=\"dash\"&gt;&lt;div class=\"side\"&gt;Menu&lt;/div&gt;&lt;div class=\"main\"&gt;Content&lt;/div&gt;&lt;/div&gt;</template>\r\n<template class=\"css\">.dash { }\r\n.side { background: #121C30; color: #E8E4D8; padding: 16px; }\r\n.main { background: #1a2740; color: #E8E4D8; padding: 16px; }</template>\r\n<template class=\"ts\">\r\nvar s = getComputedStyle(document.querySelector('.dash'));\r\nassert(s.display === 'grid', 'đặt display thành grid');\r\nassert(s.gridTemplateColumns.split(/\\s+/).filter(Boolean).length === 2, 'dùng hai cột (1fr 2fr)');\r\nassert(s.rowGap === '16px', 'đặt gap thành 16px');\r\nassert(s.paddingTop === '12px', 'đặt padding thành 12px');\r\n</template>\r\n</div>\r\n\r\n<h4>🏠 Bài tập về nhà</h4>\r\n<p>Bốn bài mang về nhà, chấm tự động — phần lớn là thực hành. Bài cuối là bài nâng cao.</p>\r\n<div class=\"ex homework\" data-kind=\"quiz\" data-a=\"1\"><span class=\"exq\"><b>Bài tập 1.</b> Công cụ bố cục nào tốt nhất cho một thư viện hai chiều gồm hàng <b>và</b> cột?</span>\r\n<ol class=\"opts\">\r\n<li>float</li>\r\n<li>CSS grid</li>\r\n<li>một bảng chữ</li>\r\n<li>position: absolute</li>\r\n</ol></div>\r\n<div class=\"ex homework\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 2. ✍️</b> Cho <code>.grid</code> là lưới với hai cột bằng nhau (<code>1fr 1fr</code>).</span>\r\n<template class=\"html\">&lt;div class=\"grid\"&gt;&lt;div class=\"box\"&gt;A&lt;/div&gt;&lt;div class=\"box\"&gt;B&lt;/div&gt;&lt;/div&gt;</template>\r\n<template class=\"css\">.grid { }\r\n.box { background: teal; color: white; padding: 12px; }</template>\r\n<template class=\"ts\">\r\nvar s = getComputedStyle(document.querySelector('.grid'));\r\nassert(s.display === 'grid', 'đặt display thành grid');\r\nassert(s.gridTemplateColumns.split(/\\s+/).filter(Boolean).length === 2, 'dùng hai cột');\r\n</template>\r\n</div>\r\n<div class=\"ex homework\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 3. ✍️</b> Cho <code>.grid</code> là lưới với bốn cột (<code>1fr 1fr 1fr 1fr</code>) và <code>gap</code> là <code>6px</code>.</span>\r\n<template class=\"html\">&lt;div class=\"grid\"&gt;&lt;div class=\"b\"&gt;1&lt;/div&gt;&lt;div class=\"b\"&gt;2&lt;/div&gt;&lt;div class=\"b\"&gt;3&lt;/div&gt;&lt;div class=\"b\"&gt;4&lt;/div&gt;&lt;/div&gt;</template>\r\n<template class=\"css\">.grid { }\r\n.b { background: gold; padding: 10px; text-align: center; }</template>\r\n<template class=\"ts\">\r\nvar s = getComputedStyle(document.querySelector('.grid'));\r\nassert(s.display === 'grid', 'đặt display thành grid');\r\nassert(s.gridTemplateColumns.split(/\\s+/).filter(Boolean).length === 4, 'dùng bốn cột');\r\nassert(s.rowGap === '6px', 'đặt gap thành 6px');\r\n</template>\r\n</div>\r\n<div class=\"ex homework stretch\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 4. 🔥 Nâng cao — ✍️</b> Dựng một lưới ảnh: <code>.photos</code> là lưới, ba cột (<code>1fr 1fr 1fr</code>), <code>gap</code> <code>8px</code>, <code>padding</code> <code>10px</code>.</span>\r\n<template class=\"html\">&lt;div class=\"photos\"&gt;&lt;div class=\"p\"&gt;1&lt;/div&gt;&lt;div class=\"p\"&gt;2&lt;/div&gt;&lt;div class=\"p\"&gt;3&lt;/div&gt;&lt;/div&gt;</template>\r\n<template class=\"css\">.photos { }\r\n.p { background: #E2604C; color: white; padding: 20px; text-align: center; }</template>\r\n<template class=\"ts\">\r\nvar s = getComputedStyle(document.querySelector('.photos'));\r\nassert(s.display === 'grid', 'đặt display thành grid');\r\nassert(s.gridTemplateColumns.split(/\\s+/).filter(Boolean).length === 3, 'dùng ba cột');\r\nassert(s.rowGap === '8px', 'đặt gap thành 8px');\r\nassert(s.paddingTop === '10px', 'đặt padding thành 10px');\r\n</template>\r\n</div>","en":"<h3>Lesson 7 — CSS grid &amp; responsive design</h3>\r\n<p>Flexbox is perfect for laying things out in <b>one direction</b> — a row or a column. But many designs are true <b>grids</b>: a photo gallery, a dashboard, a shop's product listing, all rows <i>and</i> columns at once. For that, CSS has a purpose-built tool: <b>CSS Grid</b>. You define the columns, drop your items in, and the browser places them into a neat matrix.</p>\r\n<p>Grid works like flexbox: you set <code>display: grid</code> on a <b>container</b>, then describe the columns with <code>grid-template-columns</code>. The magic ingredient is the <b>fraction unit</b> <code>fr</code>, which splits leftover space into equal shares — <code>1fr 1fr 1fr</code> gives three equal columns that stretch to fit any screen. Add <code>gap</code> for spacing, exactly like flexbox.</p>\r\n<p>The other half of this lesson is <b>responsive design</b> — making one page look good on a phone <i>and</i> a laptop. The tool is the <b>media query</b>: a block of CSS that only applies below (or above) a chosen screen width, letting you collapse a three-column grid into a single column on narrow screens. You'll build grids live and watch them respond.</p>\r\n\r\n<h4>1. display: grid</h4>\r\n<p>Turn a container into a grid and give it columns. <code>grid-template-columns: 1fr 1fr 1fr</code> means \"three equal columns\". The children flow into the cells automatically, wrapping to new rows as needed.</p>\r\n<div class=\"ex\" data-kind=\"web\"><span class=\"exq\"><b>Exercise 1.</b> Run — six boxes fall into a 3-column grid. Change <code>1fr 1fr 1fr</code> to <code>1fr 1fr</code> and Run to get two columns.</span>\r\n<template class=\"html\">&lt;div class=\"grid\"&gt;\r\n  &lt;div class=\"box\"&gt;1&lt;/div&gt;&lt;div class=\"box\"&gt;2&lt;/div&gt;&lt;div class=\"box\"&gt;3&lt;/div&gt;\r\n  &lt;div class=\"box\"&gt;4&lt;/div&gt;&lt;div class=\"box\"&gt;5&lt;/div&gt;&lt;div class=\"box\"&gt;6&lt;/div&gt;\r\n&lt;/div&gt;</template>\r\n<template class=\"css\">.grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }\r\n.box { background: #7FD1C0; color: #0E1626; padding: 18px; text-align: center; }</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 2. ✍️ Your turn.</b> Turn the container into a grid. Set <code>.grid</code>'s <code>display</code> to <code>grid</code>.</span>\r\n<template class=\"html\">&lt;div class=\"grid\"&gt;&lt;div class=\"box\"&gt;A&lt;/div&gt;&lt;div class=\"box\"&gt;B&lt;/div&gt;&lt;/div&gt;</template>\r\n<template class=\"css\">.grid { }\r\n.box { background: gold; padding: 12px; }</template>\r\n<template class=\"ts\">\r\nassert(getComputedStyle(document.querySelector('.grid')).display === 'grid', 'set .grid display to grid');\r\n</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 3. ✍️ Your turn.</b> Make three equal columns. On <code>.grid</code> (already grid), set <code>grid-template-columns</code> to <code>1fr 1fr 1fr</code>.</span>\r\n<template class=\"html\">&lt;div class=\"grid\"&gt;&lt;div class=\"box\"&gt;1&lt;/div&gt;&lt;div class=\"box\"&gt;2&lt;/div&gt;&lt;div class=\"box\"&gt;3&lt;/div&gt;&lt;/div&gt;</template>\r\n<template class=\"css\">.grid { display: grid; gap: 8px; }\r\n.box { background: teal; color: white; padding: 12px; }</template>\r\n<template class=\"ts\">\r\nvar cols = getComputedStyle(document.querySelector('.grid')).gridTemplateColumns.split(/\\s+/).filter(Boolean);\r\nassert(cols.length === 3, 'grid-template-columns should define exactly three columns (1fr 1fr 1fr)');\r\n</template>\r\n</div>\r\n\r\n<h4>2. Spacing and the fraction unit</h4>\r\n<p>The <code>fr</code> unit shares out space. <code>2fr 1fr</code> makes the first column twice as wide as the second. <code>gap</code> adds even spacing between all cells — no margins needed.</p>\r\n<div class=\"ex\" data-kind=\"web\"><span class=\"exq\"><b>Exercise 4.</b> Run — the first column is twice as wide. Swap to <code>1fr 3fr</code> and Run.</span>\r\n<template class=\"html\">&lt;div class=\"grid\"&gt;&lt;div class=\"box\"&gt;wide&lt;/div&gt;&lt;div class=\"box\"&gt;narrow&lt;/div&gt;&lt;/div&gt;</template>\r\n<template class=\"css\">.grid { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; }\r\n.box { background: #F5B942; color: #0E1626; padding: 16px; }</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 5. ✍️ Your turn.</b> Add spacing. On <code>.grid</code>, add a <code>gap</code> of <code>16px</code>.</span>\r\n<template class=\"html\">&lt;div class=\"grid\"&gt;&lt;div class=\"box\"&gt;1&lt;/div&gt;&lt;div class=\"box\"&gt;2&lt;/div&gt;&lt;/div&gt;</template>\r\n<template class=\"css\">.grid { display: grid; grid-template-columns: 1fr 1fr; }\r\n.box { background: navy; color: white; padding: 12px; }</template>\r\n<template class=\"ts\">\r\nassert(getComputedStyle(document.querySelector('.grid')).rowGap === '16px', 'add gap: 16px to the grid');\r\n</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"quiz\" data-a=\"2\"><span class=\"exq\"><b>Exercise 6.</b> In a grid, what does <code>grid-template-columns: 1fr 1fr 1fr</code> create?</span>\r\n<ol class=\"opts\">\r\n<li>Three rows</li>\r\n<li>One column, three rows</li>\r\n<li>Three equal-width columns</li>\r\n<li>A 3-pixel gap</li>\r\n</ol></div>\r\n\r\n<h4>3. A real card grid</h4>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 7. ✍️ Your turn.</b> Lay out a product grid: make <code>.cards</code> a grid with <b>three</b> equal columns (<code>1fr 1fr 1fr</code>) and a <code>gap</code> of <code>12px</code>.</span>\r\n<template class=\"html\">&lt;div class=\"cards\"&gt;\r\n  &lt;div class=\"card\"&gt;Book A&lt;/div&gt;&lt;div class=\"card\"&gt;Book B&lt;/div&gt;&lt;div class=\"card\"&gt;Book C&lt;/div&gt;\r\n&lt;/div&gt;</template>\r\n<template class=\"css\">.cards { }\r\n.card { background: #121C30; color: #E8E4D8; padding: 20px; text-align: center; }</template>\r\n<template class=\"ts\">\r\nvar s = getComputedStyle(document.querySelector('.cards'));\r\nassert(s.display === 'grid', 'set display to grid');\r\nassert(s.gridTemplateColumns.split(/\\s+/).filter(Boolean).length === 3, 'use three columns (1fr 1fr 1fr)');\r\nassert(s.rowGap === '12px', 'set gap to 12px');\r\n</template>\r\n</div>\r\n\r\n<h4>4. Responsive design &amp; media queries</h4>\r\n<p>A phone screen is narrow; a laptop is wide. <b>Responsive</b> design adapts the layout to fit. The core tool is the <b>media query</b>: <code>@media (max-width: 600px) { … }</code> — the rules inside only apply when the screen is 600px wide or less. A classic pattern: three columns normally, one column on phones.</p>\r\n<figure class=\"diagram\">\r\n<svg viewBox=\"0 0 420 150\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"12\">\r\n  <text x=\"20\" y=\"20\" fill=\"#8FA0BC\">Wide screen → 3 columns</text>\r\n  <rect x=\"20\" y=\"28\" width=\"70\" height=\"40\" fill=\"#7FD1C0\"/><rect x=\"98\" y=\"28\" width=\"70\" height=\"40\" fill=\"#7FD1C0\"/><rect x=\"176\" y=\"28\" width=\"70\" height=\"40\" fill=\"#7FD1C0\"/>\r\n  <text x=\"20\" y=\"98\" fill=\"#8FA0BC\">Phone → 1 column</text>\r\n  <rect x=\"20\" y=\"106\" width=\"70\" height=\"12\" fill=\"#F5B942\"/><rect x=\"20\" y=\"120\" width=\"70\" height=\"12\" fill=\"#F5B942\"/><rect x=\"20\" y=\"134\" width=\"70\" height=\"12\" fill=\"#F5B942\"/>\r\n</svg>\r\n<figcaption>A media query collapses the grid to one column on narrow screens.</figcaption>\r\n</figure>\r\n<div class=\"ex\" data-kind=\"web\"><span class=\"exq\"><b>Exercise 8.</b> Run this. It shows 3 columns; the media query would switch to 1 column on a narrow phone. (Try shrinking your browser window on a real deployed page.)</span>\r\n<template class=\"html\">&lt;div class=\"grid\"&gt;&lt;div class=\"box\"&gt;1&lt;/div&gt;&lt;div class=\"box\"&gt;2&lt;/div&gt;&lt;div class=\"box\"&gt;3&lt;/div&gt;&lt;/div&gt;</template>\r\n<template class=\"css\">.grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }\r\n.box { background: #7FD1C0; color: #0E1626; padding: 16px; text-align: center; }\r\n@media (max-width: 500px) {\r\n  .grid { grid-template-columns: 1fr; }\r\n}</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"quiz\" data-a=\"1\"><span class=\"exq\"><b>Exercise 9.</b> When do the rules inside <code>@media (max-width: 600px) { … }</code> apply?</span>\r\n<ol class=\"opts\">\r\n<li>Always</li>\r\n<li>Only when the screen is 600px wide or narrower</li>\r\n<li>Only when the screen is wider than 600px</li>\r\n<li>Only on printers</li>\r\n</ol></div>\r\n\r\n<h4>5. Units: px, %, and rem</h4>\r\n<p>You've used <code>px</code> (fixed pixels). Two more matter: <code>%</code> sizes relative to the parent (a <code>width: 50%</code> box is half its container — naturally responsive), and <code>rem</code> scales with the base font size (great for text and spacing that adapt).</p>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 10. ✍️ Your turn.</b> Make the bar half-width. Set <code>.bar</code>'s <code>width</code> to <code>50%</code>.</span>\r\n<template class=\"html\">&lt;div class=\"bar\"&gt;Half&lt;/div&gt;</template>\r\n<template class=\"css\">.bar { background: gold; padding: 10px; }</template>\r\n<template class=\"ts\">\r\nvar bar = document.querySelector('.bar');\r\nvar ratio = bar.offsetWidth / bar.parentElement.offsetWidth;\r\nassert(ratio > 0.4 && ratio < 0.6, 'set the width to 50% (about half the container)');\r\n</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 11. ✍️ Your turn.</b> Build a responsive gallery: make <code>.gallery</code> a grid with <b>two</b> equal columns and a <code>gap</code> of <code>10px</code>.</span>\r\n<template class=\"html\">&lt;div class=\"gallery\"&gt;&lt;div class=\"pic\"&gt;1&lt;/div&gt;&lt;div class=\"pic\"&gt;2&lt;/div&gt;&lt;div class=\"pic\"&gt;3&lt;/div&gt;&lt;div class=\"pic\"&gt;4&lt;/div&gt;&lt;/div&gt;</template>\r\n<template class=\"css\">.gallery { }\r\n.pic { background: #E2604C; color: white; padding: 24px; text-align: center; }</template>\r\n<template class=\"ts\">\r\nvar s = getComputedStyle(document.querySelector('.gallery'));\r\nassert(s.display === 'grid', 'set display to grid');\r\nassert(s.gridTemplateColumns.split(/\\s+/).filter(Boolean).length === 2, 'use two columns (1fr 1fr)');\r\nassert(s.rowGap === '10px', 'set gap to 10px');\r\n</template>\r\n</div>\r\n<div class=\"ex stretch\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 12. 🔥 Stretch — ✍️ your turn.</b> Make a dashboard grid: <code>.dash</code> is a grid with columns <code>1fr 2fr</code> (a narrow sidebar + wide main), a <code>gap</code> of <code>16px</code>, and <code>padding</code> of <code>12px</code>.</span>\r\n<template class=\"html\">&lt;div class=\"dash\"&gt;&lt;div class=\"side\"&gt;Menu&lt;/div&gt;&lt;div class=\"main\"&gt;Content&lt;/div&gt;&lt;/div&gt;</template>\r\n<template class=\"css\">.dash { }\r\n.side { background: #121C30; color: #E8E4D8; padding: 16px; }\r\n.main { background: #1a2740; color: #E8E4D8; padding: 16px; }</template>\r\n<template class=\"ts\">\r\nvar s = getComputedStyle(document.querySelector('.dash'));\r\nassert(s.display === 'grid', 'set display to grid');\r\nassert(s.gridTemplateColumns.split(/\\s+/).filter(Boolean).length === 2, 'use two columns (1fr 2fr)');\r\nassert(s.rowGap === '16px', 'set gap to 16px');\r\nassert(s.paddingTop === '12px', 'set padding to 12px');\r\n</template>\r\n</div>\r\n\r\n<h4>🏠 Homework</h4>\r\n<p>Four take-home exercises, auto-graded — mostly hands-on. The last one is a stretch.</p>\r\n<div class=\"ex homework\" data-kind=\"quiz\" data-a=\"1\"><span class=\"exq\"><b>Exercise 1.</b> Which layout tool is best for a two-dimensional gallery of rows <b>and</b> columns?</span>\r\n<ol class=\"opts\">\r\n<li>float</li>\r\n<li>CSS grid</li>\r\n<li>a table of text</li>\r\n<li>position: absolute</li>\r\n</ol></div>\r\n<div class=\"ex homework\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 2. ✍️</b> Make <code>.grid</code> a grid with two equal columns (<code>1fr 1fr</code>).</span>\r\n<template class=\"html\">&lt;div class=\"grid\"&gt;&lt;div class=\"box\"&gt;A&lt;/div&gt;&lt;div class=\"box\"&gt;B&lt;/div&gt;&lt;/div&gt;</template>\r\n<template class=\"css\">.grid { }\r\n.box { background: teal; color: white; padding: 12px; }</template>\r\n<template class=\"ts\">\r\nvar s = getComputedStyle(document.querySelector('.grid'));\r\nassert(s.display === 'grid', 'set display to grid');\r\nassert(s.gridTemplateColumns.split(/\\s+/).filter(Boolean).length === 2, 'use two columns');\r\n</template>\r\n</div>\r\n<div class=\"ex homework\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 3. ✍️</b> Make <code>.grid</code> a grid with four columns (<code>1fr 1fr 1fr 1fr</code>) and a <code>gap</code> of <code>6px</code>.</span>\r\n<template class=\"html\">&lt;div class=\"grid\"&gt;&lt;div class=\"b\"&gt;1&lt;/div&gt;&lt;div class=\"b\"&gt;2&lt;/div&gt;&lt;div class=\"b\"&gt;3&lt;/div&gt;&lt;div class=\"b\"&gt;4&lt;/div&gt;&lt;/div&gt;</template>\r\n<template class=\"css\">.grid { }\r\n.b { background: gold; padding: 10px; text-align: center; }</template>\r\n<template class=\"ts\">\r\nvar s = getComputedStyle(document.querySelector('.grid'));\r\nassert(s.display === 'grid', 'set display to grid');\r\nassert(s.gridTemplateColumns.split(/\\s+/).filter(Boolean).length === 4, 'use four columns');\r\nassert(s.rowGap === '6px', 'set gap to 6px');\r\n</template>\r\n</div>\r\n<div class=\"ex homework stretch\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 4. 🔥 Stretch — ✍️</b> Build a photo grid: <code>.photos</code> is a grid, three columns (<code>1fr 1fr 1fr</code>), <code>gap</code> <code>8px</code>, <code>padding</code> <code>10px</code>.</span>\r\n<template class=\"html\">&lt;div class=\"photos\"&gt;&lt;div class=\"p\"&gt;1&lt;/div&gt;&lt;div class=\"p\"&gt;2&lt;/div&gt;&lt;div class=\"p\"&gt;3&lt;/div&gt;&lt;/div&gt;</template>\r\n<template class=\"css\">.photos { }\r\n.p { background: #E2604C; color: white; padding: 20px; text-align: center; }</template>\r\n<template class=\"ts\">\r\nvar s = getComputedStyle(document.querySelector('.photos'));\r\nassert(s.display === 'grid', 'set display to grid');\r\nassert(s.gridTemplateColumns.split(/\\s+/).filter(Boolean).length === 3, 'use three columns');\r\nassert(s.rowGap === '8px', 'set gap to 8px');\r\nassert(s.paddingTop === '10px', 'set padding to 10px');\r\n</template>\r\n</div>"}},{"t":{"vi":"Chuyển động & animation","en":"CSS transitions, transforms & animations"},"kind":"free","html":{"vi":"<h3>Bài 8 — Chuyển động &amp; animation</h3>\r\n<p>Trang tĩnh cũng ổn, nhưng web thấy <i>sống động</i> vì mọi thứ chuyển động: một nút phình nhẹ khi bạn rê chuột, một thẻ nhấc lên khi chạm, một vòng xoay đang tải, một thông báo trượt vào. Những chi tiết nhỏ đó làm giao diện thấy chỉn chu và biết phản hồi người dùng. Điều tuyệt nhất — chúng thuần CSS. Không cần JavaScript.</p>\r\n<p>Ba công cụ cho bạn tất cả. <b>transform</b> di chuyển, xoay hoặc phóng to một phần tử mà không làm xáo trộn bố cục xung quanh. <b>transition</b> làm một thay đổi diễn ra <i>mượt</i> theo thời gian thay vì bật ngay — thuộc tính \"làm cho thấy đã\" hữu ích nhất. Và <b>@keyframes</b> + <b>animation</b> cho bạn viết một chuyển động lặp lại, nhiều bước như một vòng xoay hay một nhịp đập.</p>\r\n<p>Chuyển động thì không thể cảm được trên giấy, nên mọi ví dụ ở đây đều trực tiếp. Chạy chúng, rê chuột lên ô xem trước, và chỉnh các con số để cảm nhận thời lượng và tỉ lệ đổi tâm trạng thế nào. Cho mọi thứ chuyển động nào.</p>\r\n\r\n<h4>1. transform — di chuyển, xoay, phóng to</h4>\r\n<p><code>transform</code> thay đổi phần tử về mặt hình ảnh: <code>rotate(20deg)</code> nghiêng nó, <code>scale(1.5)</code> làm nó to gấp 1.5 lần, <code>translate(10px, 0)</code> dịch nó. Quan trọng là nó không đẩy các phần tử khác — đây là hiệu ứng thuần hình ảnh, hoàn hảo cho hover và animation.</p>\r\n<div class=\"ex\" data-kind=\"web\"><span class=\"exq\"><b>Bài tập 1.</b> Chạy và xem ba phép biến đổi. Đổi góc và tỉ lệ rồi Chạy lại.</span>\r\n<template class=\"html\">&lt;span class=\"box r\"&gt;rotate&lt;/span&gt;&lt;span class=\"box s\"&gt;scale&lt;/span&gt;&lt;span class=\"box t\"&gt;move&lt;/span&gt;</template>\r\n<template class=\"css\">.box { display: inline-block; background: #7FD1C0; color: #0E1626; padding: 14px; margin: 16px; }\r\n.r { transform: rotate(15deg); }\r\n.s { transform: scale(1.4); }\r\n.t { transform: translate(0, 12px); }</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 2. ✍️ Đến lượt bạn.</b> Nghiêng hộp. Cho <code>.box</code> một <code>transform</code> là <code>rotate(20deg)</code>.</span>\r\n<template class=\"html\">&lt;div class=\"box\"&gt;Tilt me&lt;/div&gt;</template>\r\n<template class=\"css\">.box { display: inline-block; background: gold; padding: 14px; }</template>\r\n<template class=\"ts\">\r\nassert(getComputedStyle(document.querySelector('.box')).transform !== 'none', 'áp dụng transform: rotate(20deg) cho .box');\r\n</template>\r\n</div>\r\n\r\n<h4>2. transition — mượt, không đột ngột</h4>\r\n<p>Mặc định một thay đổi kiểu là tức thì. <code>transition</code> trải nó ra theo thời gian. <code>transition: all 0.3s</code> nghĩa là \"làm mượt mọi thay đổi của phần tử này trong 0.3 giây\". Kết hợp với một luật <code>:hover</code> — trạng thái hover định nghĩa vẻ ngoài <i>cuối</i>, còn transition làm việc đến đó thật mượt.</p>\r\n<div class=\"ex\" data-kind=\"web\"><span class=\"exq\"><b>Bài tập 3.</b> Chạy, rồi <b>rê chuột lên hộp</b> trong ô xem trước — nó phình mượt nhờ transition.</span>\r\n<template class=\"html\">&lt;div class=\"box\"&gt;Hover me&lt;/div&gt;</template>\r\n<template class=\"css\">.box { display: inline-block; background: #F5B942; color: #0E1626; padding: 16px; transition: all 0.3s; }\r\n.box:hover { transform: scale(1.3); background: #E2604C; }</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"quiz\" data-a=\"1\"><span class=\"exq\"><b>Bài tập 4.</b> Thuộc tính nào làm một thay đổi diễn ra <b>mượt theo thời gian</b> thay vì tức thì?</span>\r\n<ol class=\"opts\">\r\n<li><code>transform</code></li>\r\n<li><code>transition</code></li>\r\n<li><code>display</code></li>\r\n<li><code>position</code></li>\r\n</ol></div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 5. ✍️ Đến lượt bạn.</b> Làm nó mượt. Cho <code>.box</code> một <code>transition</code> là <code>all 0.3s</code>.</span>\r\n<template class=\"html\">&lt;div class=\"box\"&gt;Smooth&lt;/div&gt;</template>\r\n<template class=\"css\">.box { display: inline-block; background: teal; color: white; padding: 14px; }</template>\r\n<template class=\"ts\">\r\nassert(getComputedStyle(document.querySelector('.box')).transitionDuration === '0.3s', 'đặt transition thành all 0.3s');\r\n</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 6. ✍️ Đến lượt bạn.</b> Phóng to hộp. Cho <code>.box</code> một <code>transform</code> là <code>scale(1.2)</code>.</span>\r\n<template class=\"html\">&lt;div class=\"box\"&gt;Bigger&lt;/div&gt;</template>\r\n<template class=\"css\">.box { display: inline-block; background: navy; color: white; padding: 14px; }</template>\r\n<template class=\"ts\">\r\nassert(getComputedStyle(document.querySelector('.box')).transform !== 'none', 'áp dụng transform: scale(1.2)');\r\n</template>\r\n</div>\r\n\r\n<h4>3. Hiệu ứng hover</h4>\r\n<p>Lớp giả <code>:hover</code> nhắm một phần tử chỉ khi chuột đang ở trên nó. Kết hợp <code>transition</code> (ở luật gốc) với một thay đổi (ở luật <code>:hover</code>) cho một nút tương tác kinh điển.</p>\r\n<div class=\"ex\" data-kind=\"web\"><span class=\"exq\"><b>Bài tập 7.</b> Chạy, rồi rê chuột lên nút — nó đổi màu mượt. Thử đổi màu hover.</span>\r\n<template class=\"html\">&lt;button class=\"btn\"&gt;Buy now&lt;/button&gt;</template>\r\n<template class=\"css\">.btn { background: #7FD1C0; color: #0E1626; border: none; padding: 10px 18px; border-radius: 6px; transition: all 0.25s; }\r\n.btn:hover { background: #F5B942; transform: translateY(-3px); }</template>\r\n</div>\r\n\r\n<h4>4. @keyframes &amp; animation</h4>\r\n<p>Cho chuyển động tự chạy (vòng xoay, nhịp đập), định nghĩa các bước bằng <code>@keyframes name { from { … } to { … } }</code>, rồi gắn nó bằng <code>animation: name duration timing repeat</code>. Ví dụ <code>animation: spin 2s linear infinite</code> chạy keyframes <code>spin</code> mãi mãi, 2 giây mỗi vòng.</p>\r\n<div class=\"ex\" data-kind=\"web\"><span class=\"exq\"><b>Bài tập 8.</b> Chạy và xem hộp xoay mãi, do <code>@keyframes</code> điều khiển.</span>\r\n<template class=\"html\">&lt;div class=\"spinner\"&gt;↻&lt;/div&gt;</template>\r\n<template class=\"css\">.spinner { display: inline-block; font-size: 30px; color: #7FD1C0; animation: spin 2s linear infinite; }\r\n@keyframes spin {\r\n  from { transform: rotate(0deg); }\r\n  to   { transform: rotate(360deg); }\r\n}</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 9. ✍️ Đến lượt bạn.</b> Gắn animation. <code>@keyframes spin</code> đã viết sẵn — trên <code>.loader</code>, thêm <code>animation: spin 2s linear infinite;</code></span>\r\n<template class=\"html\">&lt;div class=\"loader\"&gt;↻&lt;/div&gt;</template>\r\n<template class=\"css\">.loader { display: inline-block; font-size: 28px; color: gold; }\r\n@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }</template>\r\n<template class=\"ts\">\r\nassert(getComputedStyle(document.querySelector('.loader')).animationName === 'spin', 'thêm animation: spin 2s linear infinite; vào .loader');\r\n</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 10. ✍️ Đến lượt bạn.</b> Làm nó chậm lại. Trên <code>.loader</code>, cho animation kéo dài <code>2s</code> (viết <code>animation: spin 2s linear infinite;</code>).</span>\r\n<template class=\"html\">&lt;div class=\"loader\"&gt;●&lt;/div&gt;</template>\r\n<template class=\"css\">.loader { display: inline-block; font-size: 24px; color: #E2604C; }\r\n@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }</template>\r\n<template class=\"ts\">\r\nvar s = getComputedStyle(document.querySelector('.loader'));\r\nassert(s.animationName === 'spin', 'gắn animation spin');\r\nassert(s.animationDuration === '2s', 'cho thời lượng là 2s');\r\n</template>\r\n</div>\r\n\r\n<h4>5. Ghép lại</h4>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 11. ✍️ Đến lượt bạn.</b> Làm nền cho một thẻ tương tác: cho <code>.card</code> một <code>transition</code> là <code>all 0.3s</code> và một <code>transform</code> là <code>scale(1.05)</code>.</span>\r\n<template class=\"html\">&lt;div class=\"card\"&gt;Featured&lt;/div&gt;</template>\r\n<template class=\"css\">.card { background: #121C30; color: #E8E4D8; padding: 20px; }</template>\r\n<template class=\"ts\">\r\nvar s = getComputedStyle(document.querySelector('.card'));\r\nassert(s.transitionDuration === '0.3s', 'đặt transition thành all 0.3s');\r\nassert(s.transform !== 'none', 'áp dụng transform: scale(1.05)');\r\n</template>\r\n</div>\r\n<div class=\"ex stretch\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 12. 🔥 Nâng cao — ✍️ đến lượt bạn.</b> Dựng một huy hiệu đập nhịp. <code>@keyframes pulse</code> đã có sẵn — trên <code>.badge</code>, thêm <code>animation: pulse 1s ease-in-out infinite;</code> để <code>animation-name</code> là <code>pulse</code> và <code>animation-duration</code> là <code>1s</code>.</span>\r\n<template class=\"html\">&lt;div class=\"badge\"&gt;LIVE&lt;/div&gt;</template>\r\n<template class=\"css\">.badge { display: inline-block; background: #E2604C; color: white; padding: 8px 14px; border-radius: 20px; }\r\n@keyframes pulse {\r\n  0%   { transform: scale(1); }\r\n  50%  { transform: scale(1.15); }\r\n  100% { transform: scale(1); }\r\n}</template>\r\n<template class=\"ts\">\r\nvar s = getComputedStyle(document.querySelector('.badge'));\r\nassert(s.animationName === 'pulse', 'đặt animation thành pulse');\r\nassert(s.animationDuration === '1s', 'cho thời lượng là 1s');\r\n</template>\r\n</div>\r\n\r\n<h4>🏠 Bài tập về nhà</h4>\r\n<p>Bốn bài mang về nhà, chấm tự động — phần lớn là thực hành. Bài cuối là bài nâng cao.</p>\r\n<div class=\"ex homework\" data-kind=\"quiz\" data-a=\"0\"><span class=\"exq\"><b>Bài tập 1.</b> Thuộc tính nào xoay hoặc phóng to một phần tử về mặt hình ảnh mà không đẩy hàng xóm?</span>\r\n<ol class=\"opts\">\r\n<li><code>transform</code></li>\r\n<li><code>margin</code></li>\r\n<li><code>display</code></li>\r\n<li><code>gap</code></li>\r\n</ol></div>\r\n<div class=\"ex homework\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 2. ✍️</b> Cho <code>.box</code> một <code>transition</code> là <code>all 0.5s</code> và một <code>transform</code> là <code>rotate(10deg)</code>.</span>\r\n<template class=\"html\">&lt;div class=\"box\"&gt;Tilt&lt;/div&gt;</template>\r\n<template class=\"css\">.box { display: inline-block; background: gold; padding: 14px; }</template>\r\n<template class=\"ts\">\r\nvar s = getComputedStyle(document.querySelector('.box'));\r\nassert(s.transitionDuration === '0.5s', 'đặt transition thành all 0.5s');\r\nassert(s.transform !== 'none', 'áp dụng transform: rotate(10deg)');\r\n</template>\r\n</div>\r\n<div class=\"ex homework\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 3. ✍️</b> Gắn animation spin vào <code>.wheel</code>: <code>animation: spin 3s linear infinite;</code> (keyframes có sẵn).</span>\r\n<template class=\"html\">&lt;div class=\"wheel\"&gt;✦&lt;/div&gt;</template>\r\n<template class=\"css\">.wheel { display: inline-block; font-size: 26px; color: teal; }\r\n@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }</template>\r\n<template class=\"ts\">\r\nvar s = getComputedStyle(document.querySelector('.wheel'));\r\nassert(s.animationName === 'spin', 'gắn animation spin');\r\nassert(s.animationDuration === '3s', 'cho thời lượng là 3s');\r\n</template>\r\n</div>\r\n<div class=\"ex homework stretch\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 4. 🔥 Nâng cao — ✍️</b> Làm một chấm nảy. <code>@keyframes bounce</code> có sẵn — trên <code>.dot</code> thêm <code>animation: bounce 0.6s ease infinite;</code> (tên <code>bounce</code>, thời lượng <code>0.6s</code>).</span>\r\n<template class=\"html\">&lt;div class=\"dot\"&gt;●&lt;/div&gt;</template>\r\n<template class=\"css\">.dot { display: inline-block; font-size: 24px; color: #F5B942; }\r\n@keyframes bounce {\r\n  0%, 100% { transform: translateY(0); }\r\n  50%      { transform: translateY(-12px); }\r\n}</template>\r\n<template class=\"ts\">\r\nvar s = getComputedStyle(document.querySelector('.dot'));\r\nassert(s.animationName === 'bounce', 'đặt animation thành bounce');\r\nassert(s.animationDuration === '0.6s', 'cho thời lượng là 0.6s');\r\n</template>\r\n</div>","en":"<h3>Lesson 8 — CSS transitions, transforms &amp; animations</h3>\r\n<p>Static pages are fine, but the web feels <i>alive</i> because things move: a button that gently grows when you hover, a card that lifts on tap, a loading spinner that turns, a notification that slides in. These little touches make an interface feel polished and responsive to the user. The best part — they're pure CSS. No JavaScript required.</p>\r\n<p>Three tools give you all of it. <b>transform</b> moves, rotates or scales an element without disturbing the layout around it. <b>transition</b> makes a change happen <i>smoothly</i> over time instead of snapping — the single most useful \"make it feel nice\" property. And <b>@keyframes</b> + <b>animation</b> let you script a repeating, multi-step motion like a spinner or a pulse.</p>\r\n<p>Motion is impossible to appreciate on paper, so every example here is live. Run them, hover over the previews, and tweak the numbers to feel how duration and scale change the mood. Let's make things move.</p>\r\n\r\n<h4>1. transform — move, rotate, scale</h4>\r\n<p><code>transform</code> visually changes an element: <code>rotate(20deg)</code> tilts it, <code>scale(1.5)</code> makes it 1.5× bigger, <code>translate(10px, 0)</code> shifts it. Crucially, it doesn't push other elements around — it's a purely visual effect, perfect for hover and animation.</p>\r\n<div class=\"ex\" data-kind=\"web\"><span class=\"exq\"><b>Exercise 1.</b> Run and see three transforms. Change the angles and scales and Run again.</span>\r\n<template class=\"html\">&lt;span class=\"box r\"&gt;rotate&lt;/span&gt;&lt;span class=\"box s\"&gt;scale&lt;/span&gt;&lt;span class=\"box t\"&gt;move&lt;/span&gt;</template>\r\n<template class=\"css\">.box { display: inline-block; background: #7FD1C0; color: #0E1626; padding: 14px; margin: 16px; }\r\n.r { transform: rotate(15deg); }\r\n.s { transform: scale(1.4); }\r\n.t { transform: translate(0, 12px); }</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 2. ✍️ Your turn.</b> Tilt the box. Give <code>.box</code> a <code>transform</code> of <code>rotate(20deg)</code>.</span>\r\n<template class=\"html\">&lt;div class=\"box\"&gt;Tilt me&lt;/div&gt;</template>\r\n<template class=\"css\">.box { display: inline-block; background: gold; padding: 14px; }</template>\r\n<template class=\"ts\">\r\nassert(getComputedStyle(document.querySelector('.box')).transform !== 'none', 'apply a transform: rotate(20deg) to .box');\r\n</template>\r\n</div>\r\n\r\n<h4>2. transition — smooth, not sudden</h4>\r\n<p>By default a style change is instant. <code>transition</code> spreads it over time. <code>transition: all 0.3s</code> means \"animate any change to this element over 0.3 seconds\". Pair it with a <code>:hover</code> rule — the hover state defines the <i>end</i> look, and the transition makes getting there smooth.</p>\r\n<div class=\"ex\" data-kind=\"web\"><span class=\"exq\"><b>Exercise 3.</b> Run, then <b>hover your mouse over the box</b> in the preview — it grows smoothly because of the transition.</span>\r\n<template class=\"html\">&lt;div class=\"box\"&gt;Hover me&lt;/div&gt;</template>\r\n<template class=\"css\">.box { display: inline-block; background: #F5B942; color: #0E1626; padding: 16px; transition: all 0.3s; }\r\n.box:hover { transform: scale(1.3); background: #E2604C; }</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"quiz\" data-a=\"1\"><span class=\"exq\"><b>Exercise 4.</b> Which property makes a change happen <b>smoothly over time</b> instead of instantly?</span>\r\n<ol class=\"opts\">\r\n<li><code>transform</code></li>\r\n<li><code>transition</code></li>\r\n<li><code>display</code></li>\r\n<li><code>position</code></li>\r\n</ol></div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 5. ✍️ Your turn.</b> Make it smooth. Give <code>.box</code> a <code>transition</code> of <code>all 0.3s</code>.</span>\r\n<template class=\"html\">&lt;div class=\"box\"&gt;Smooth&lt;/div&gt;</template>\r\n<template class=\"css\">.box { display: inline-block; background: teal; color: white; padding: 14px; }</template>\r\n<template class=\"ts\">\r\nassert(getComputedStyle(document.querySelector('.box')).transitionDuration === '0.3s', 'set transition to all 0.3s');\r\n</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 6. ✍️ Your turn.</b> Grow the box. Give <code>.box</code> a <code>transform</code> of <code>scale(1.2)</code>.</span>\r\n<template class=\"html\">&lt;div class=\"box\"&gt;Bigger&lt;/div&gt;</template>\r\n<template class=\"css\">.box { display: inline-block; background: navy; color: white; padding: 14px; }</template>\r\n<template class=\"ts\">\r\nassert(getComputedStyle(document.querySelector('.box')).transform !== 'none', 'apply transform: scale(1.2)');\r\n</template>\r\n</div>\r\n\r\n<h4>3. Hover effects</h4>\r\n<p>The <code>:hover</code> pseudo-class targets an element only while the mouse is over it. Combine <code>transition</code> (on the base rule) with a change (on the <code>:hover</code> rule) for a classic interactive button.</p>\r\n<div class=\"ex\" data-kind=\"web\"><span class=\"exq\"><b>Exercise 7.</b> Run, then hover the button — it changes colour smoothly. Try changing the hover colour.</span>\r\n<template class=\"html\">&lt;button class=\"btn\"&gt;Buy now&lt;/button&gt;</template>\r\n<template class=\"css\">.btn { background: #7FD1C0; color: #0E1626; border: none; padding: 10px 18px; border-radius: 6px; transition: all 0.25s; }\r\n.btn:hover { background: #F5B942; transform: translateY(-3px); }</template>\r\n</div>\r\n\r\n<h4>4. @keyframes &amp; animation</h4>\r\n<p>For motion that runs on its own (a spinner, a pulse), define the steps with <code>@keyframes name { from { … } to { … } }</code>, then attach it with <code>animation: name duration timing repeat</code>. For example <code>animation: spin 2s linear infinite</code> runs the <code>spin</code> keyframes forever, 2 seconds per loop.</p>\r\n<div class=\"ex\" data-kind=\"web\"><span class=\"exq\"><b>Exercise 8.</b> Run and watch the box spin forever, driven by the <code>@keyframes</code>.</span>\r\n<template class=\"html\">&lt;div class=\"spinner\"&gt;↻&lt;/div&gt;</template>\r\n<template class=\"css\">.spinner { display: inline-block; font-size: 30px; color: #7FD1C0; animation: spin 2s linear infinite; }\r\n@keyframes spin {\r\n  from { transform: rotate(0deg); }\r\n  to   { transform: rotate(360deg); }\r\n}</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 9. ✍️ Your turn.</b> Attach the animation. The <code>@keyframes spin</code> is already written — on <code>.loader</code>, add <code>animation: spin 2s linear infinite;</code></span>\r\n<template class=\"html\">&lt;div class=\"loader\"&gt;↻&lt;/div&gt;</template>\r\n<template class=\"css\">.loader { display: inline-block; font-size: 28px; color: gold; }\r\n@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }</template>\r\n<template class=\"ts\">\r\nassert(getComputedStyle(document.querySelector('.loader')).animationName === 'spin', 'add animation: spin 2s linear infinite; to .loader');\r\n</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 10. ✍️ Your turn.</b> Slow it down. On <code>.loader</code>, make the animation last <code>2s</code> (write <code>animation: spin 2s linear infinite;</code>).</span>\r\n<template class=\"html\">&lt;div class=\"loader\"&gt;●&lt;/div&gt;</template>\r\n<template class=\"css\">.loader { display: inline-block; font-size: 24px; color: #E2604C; }\r\n@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }</template>\r\n<template class=\"ts\">\r\nvar s = getComputedStyle(document.querySelector('.loader'));\r\nassert(s.animationName === 'spin', 'attach the spin animation');\r\nassert(s.animationDuration === '2s', 'make the duration 2s');\r\n</template>\r\n</div>\r\n\r\n<h4>5. Put it together</h4>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 11. ✍️ Your turn.</b> Make an interactive card base: give <code>.card</code> a <code>transition</code> of <code>all 0.3s</code> and a <code>transform</code> of <code>scale(1.05)</code>.</span>\r\n<template class=\"html\">&lt;div class=\"card\"&gt;Featured&lt;/div&gt;</template>\r\n<template class=\"css\">.card { background: #121C30; color: #E8E4D8; padding: 20px; }</template>\r\n<template class=\"ts\">\r\nvar s = getComputedStyle(document.querySelector('.card'));\r\nassert(s.transitionDuration === '0.3s', 'set transition to all 0.3s');\r\nassert(s.transform !== 'none', 'apply transform: scale(1.05)');\r\n</template>\r\n</div>\r\n<div class=\"ex stretch\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 12. 🔥 Stretch — ✍️ your turn.</b> Build a pulsing badge. The <code>@keyframes pulse</code> is provided — on <code>.badge</code>, add <code>animation: pulse 1s ease-in-out infinite;</code> so its <code>animation-name</code> is <code>pulse</code> and <code>animation-duration</code> is <code>1s</code>.</span>\r\n<template class=\"html\">&lt;div class=\"badge\"&gt;LIVE&lt;/div&gt;</template>\r\n<template class=\"css\">.badge { display: inline-block; background: #E2604C; color: white; padding: 8px 14px; border-radius: 20px; }\r\n@keyframes pulse {\r\n  0%   { transform: scale(1); }\r\n  50%  { transform: scale(1.15); }\r\n  100% { transform: scale(1); }\r\n}</template>\r\n<template class=\"ts\">\r\nvar s = getComputedStyle(document.querySelector('.badge'));\r\nassert(s.animationName === 'pulse', 'set the animation to pulse');\r\nassert(s.animationDuration === '1s', 'make the duration 1s');\r\n</template>\r\n</div>\r\n\r\n<h4>🏠 Homework</h4>\r\n<p>Four take-home exercises, auto-graded — mostly hands-on. The last one is a stretch.</p>\r\n<div class=\"ex homework\" data-kind=\"quiz\" data-a=\"0\"><span class=\"exq\"><b>Exercise 1.</b> Which property visually rotates or scales an element without moving its neighbours?</span>\r\n<ol class=\"opts\">\r\n<li><code>transform</code></li>\r\n<li><code>margin</code></li>\r\n<li><code>display</code></li>\r\n<li><code>gap</code></li>\r\n</ol></div>\r\n<div class=\"ex homework\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 2. ✍️</b> Give <code>.box</code> a <code>transition</code> of <code>all 0.5s</code> and a <code>transform</code> of <code>rotate(10deg)</code>.</span>\r\n<template class=\"html\">&lt;div class=\"box\"&gt;Tilt&lt;/div&gt;</template>\r\n<template class=\"css\">.box { display: inline-block; background: gold; padding: 14px; }</template>\r\n<template class=\"ts\">\r\nvar s = getComputedStyle(document.querySelector('.box'));\r\nassert(s.transitionDuration === '0.5s', 'set transition to all 0.5s');\r\nassert(s.transform !== 'none', 'apply transform: rotate(10deg)');\r\n</template>\r\n</div>\r\n<div class=\"ex homework\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 3. ✍️</b> Attach the spin animation to <code>.wheel</code>: <code>animation: spin 3s linear infinite;</code> (keyframes provided).</span>\r\n<template class=\"html\">&lt;div class=\"wheel\"&gt;✦&lt;/div&gt;</template>\r\n<template class=\"css\">.wheel { display: inline-block; font-size: 26px; color: teal; }\r\n@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }</template>\r\n<template class=\"ts\">\r\nvar s = getComputedStyle(document.querySelector('.wheel'));\r\nassert(s.animationName === 'spin', 'attach the spin animation');\r\nassert(s.animationDuration === '3s', 'make the duration 3s');\r\n</template>\r\n</div>\r\n<div class=\"ex homework stretch\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 4. 🔥 Stretch — ✍️</b> Make a bouncing dot. The <code>@keyframes bounce</code> is provided — on <code>.dot</code> add <code>animation: bounce 0.6s ease infinite;</code> (name <code>bounce</code>, duration <code>0.6s</code>).</span>\r\n<template class=\"html\">&lt;div class=\"dot\"&gt;●&lt;/div&gt;</template>\r\n<template class=\"css\">.dot { display: inline-block; font-size: 24px; color: #F5B942; }\r\n@keyframes bounce {\r\n  0%, 100% { transform: translateY(0); }\r\n  50%      { transform: translateY(-12px); }\r\n}</template>\r\n<template class=\"ts\">\r\nvar s = getComputedStyle(document.querySelector('.dot'));\r\nassert(s.animationName === 'bounce', 'set the animation to bounce');\r\nassert(s.animationDuration === '0.6s', 'make the duration 0.6s');\r\n</template>\r\n</div>"}},{"t":{"vi":"Dự án nhỏ: trang thư viện","en":"Mini project: a library site"},"kind":"free","html":{"vi":"<h3>Bài 9 — Dự án nhỏ: trang thư viện tĩnh</h3>\r\n<p>Đến lúc ghép mọi thứ lại. Qua tám bài trước bạn đã học dựng cấu trúc trang bằng HTML, tạo kiểu bằng CSS, bố cục bằng flexbox và grid, và thêm chuyển động. Giờ bạn sẽ dựng một website thật, nhiều trang: <b>City Library</b> — một trang chủ cùng các trang con cho <i>Books</i>, <i>About</i> và <i>Contact</i>, nối với nhau bằng một thanh điều hướng. Đây đúng là cách các trang nhỏ thật được dựng.</p>\r\n<p>Trước tiên bạn sẽ gặp hai thứ mà mọi trang thật đều cần nhưng các đoạn nhỏ của ta đã bỏ qua: <b>bộ khung tài liệu HTML</b> đầy đủ (phần bọc <code>&lt;!doctype&gt;</code>, <code>&lt;head&gt;</code> và <code>&lt;body&gt;</code>, với một <code>&lt;title&gt;</code> và một stylesheet được liên kết), và <b>liên kết giữa các trang</b> — các URL tương đối như <code>books.html</code> biến các tệp riêng lẻ thành một website nối liền. Bạn cũng sẽ dùng <code>&lt;div&gt;</code> và <code>&lt;span&gt;</code>, những hộp chứa tổng quát mà bạn gom nhóm và tạo kiểu bằng class.</p>\r\n<p>Rồi bạn sẽ dựng site từng phần — một thanh nav, một header, một lưới sách, các trang con — mỗi phần được chấm dần, kết thúc bằng một trang chủ hoàn chỉnh có kiểu. Xuất bản một website nào.</p>\r\n\r\n<h4>1. Bộ khung tài liệu đầy đủ</h4>\r\n<p>Mọi tệp HTML thật bắt đầu bằng một bộ khung cố định. <code>&lt;!doctype html&gt;</code> nói cho trình duyệt đây là HTML hiện đại. Bên trong <code>&lt;html&gt;</code> có hai phần: <code>&lt;head&gt;</code> giữ thông tin <i>về</i> trang — bộ ký tự, <code>&lt;title&gt;</code> (hiện trên tab trình duyệt), và liên kết tới các tệp CSS — còn <code>&lt;body&gt;</code> giữ mọi thứ bạn thực sự thấy.</p>\r\n<div class=\"ex\" data-kind=\"web\"><span class=\"exq\"><b>Bài tập 1.</b> Chạy tài liệu hoàn chỉnh này. Nội dung nhìn thấy đến từ <code>&lt;body&gt;</code>; <code>&lt;title&gt;</code> trong <code>&lt;head&gt;</code> sẽ hiện trên tab trình duyệt.</span>\r\n<template class=\"st\">&lt;!doctype html&gt;\r\n&lt;html&gt;\r\n  &lt;head&gt;\r\n    &lt;meta charset=\"utf-8\"&gt;\r\n    &lt;title&gt;City Library&lt;/title&gt;\r\n    &lt;style&gt; body { font-family: sans-serif; padding: 16px; } &lt;/style&gt;\r\n  &lt;/head&gt;\r\n  &lt;body&gt;\r\n    &lt;h1&gt;City Library&lt;/h1&gt;\r\n    &lt;p&gt;Everything visible lives in the body.&lt;/p&gt;\r\n  &lt;/body&gt;\r\n&lt;/html&gt;</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"quiz\" data-a=\"1\"><span class=\"exq\"><b>Bài tập 2.</b> Phần nào của tài liệu giữ <code>&lt;title&gt;</code> và liên kết tới stylesheet?</span>\r\n<ol class=\"opts\">\r\n<li><code>&lt;body&gt;</code></li>\r\n<li><code>&lt;head&gt;</code></li>\r\n<li><code>&lt;footer&gt;</code></li>\r\n<li><code>&lt;main&gt;</code></li>\r\n</ol></div>\r\n<p>Trên một site thật, mỗi trang (<code>index.html</code>, <code>books.html</code>…) là một tệp riêng liên kết tới một <code>style.css</code> dùng chung qua <code>&lt;link rel=\"stylesheet\" href=\"style.css\"&gt;</code> trong head. Trong các bài tập này, ô CSS <i>chính là</i> stylesheet dùng chung đó.</p>\r\n\r\n<h4>2. Nối các trang với nhau</h4>\r\n<p>Một site nhiều trang chỉ là vài tệp HTML liên kết với nhau. Một liên kết tới trang khác trong cùng thư mục dùng một <b>URL tương đối</b> — chỉ là tên tệp: <code>&lt;a href=\"books.html\"&gt;Books&lt;/a&gt;</code>. Đặt các liên kết này trong một <code>&lt;nav&gt;</code> và mọi trang đều đến được nhau. (Trong sandbox các liên kết sẽ không chuyển trang, nhưng trên một site đã triển khai chúng nhảy giữa các trang.)</p>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 3. ✍️ Đến lượt bạn.</b> Dựng thanh điều hướng của site. Trong <code>&lt;nav&gt;</code>, thêm ba liên kết: <code>Home</code> → <code>index.html</code>, <code>Books</code> → <code>books.html</code>, <code>About</code> → <code>about.html</code>.</span>\r\n<template class=\"st\">&lt;nav&gt;\r\n\r\n&lt;/nav&gt;</template>\r\n<template class=\"ts\">\r\nvar links = document.querySelectorAll('nav a');\r\nassert(links.length === 3, 'nav phải chứa đúng ba liên kết');\r\nassert(document.querySelector('nav a[href=\"index.html\"]'), 'thêm liên kết Home tới index.html');\r\nassert(document.querySelector('nav a[href=\"books.html\"]'), 'thêm liên kết Books tới books.html');\r\nassert(document.querySelector('nav a[href=\"about.html\"]'), 'thêm liên kết About tới about.html');\r\nassert(links[0].textContent.trim() === 'Home' && links[1].textContent.trim() === 'Books' && links[2].textContent.trim() === 'About', 'chữ các liên kết phải là Home, Books, About');\r\n</template>\r\n</div>\r\n\r\n<h4>3. Dựng trang chủ, từng phần</h4>\r\n<p>Một trang là các vùng xếp theo thứ tự: một <code>&lt;header&gt;</code>, một <code>&lt;nav&gt;</code>, một <code>&lt;main&gt;</code>, một <code>&lt;footer&gt;</code>. Dựng từng cái nào.</p>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 4. ✍️ Đến lượt bạn.</b> Làm header. Thêm một <code>&lt;header&gt;</code> chứa một <code>&lt;h1&gt;</code> ghi <code>City Library</code>.</span>\r\n<template class=\"st\">\r\n</template>\r\n<template class=\"ts\">\r\nvar h1 = document.querySelector('header h1');\r\nassert(h1, 'thêm một header có h1 bên trong');\r\nassert(h1.textContent.trim() === 'City Library', 'h1 phải ghi \"City Library\"');\r\n</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 5. ✍️ Đến lượt bạn.</b> Thêm phần chào mừng. Thêm một <code>&lt;main&gt;</code> chứa một <code>&lt;h2&gt;</code> ghi <code>Welcome</code> và một <code>&lt;p&gt;</code> ghi <code>Borrow books for free.</code></span>\r\n<template class=\"st\">\r\n</template>\r\n<template class=\"ts\">\r\nvar h2 = document.querySelector('main h2');\r\nvar p = document.querySelector('main p');\r\nassert(h2 && h2.textContent.trim() === 'Welcome', 'main phải chứa một h2 ghi \"Welcome\"');\r\nassert(p && p.textContent.trim() === 'Borrow books for free.', 'main phải chứa một p ghi \"Borrow books for free.\"');\r\n</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 6. ✍️ Đến lượt bạn.</b> Thêm footer. Thêm một <code>&lt;footer&gt;</code> ghi <code>© 2026 City Library</code>.</span>\r\n<template class=\"st\">\r\n</template>\r\n<template class=\"ts\">\r\nvar f = document.querySelector('footer');\r\nassert(f && f.textContent.trim() === '© 2026 City Library', 'thêm một footer ghi \"© 2026 City Library\"');\r\n</template>\r\n</div>\r\n\r\n<h4>4. Tạo kiểu cho thanh điều hướng</h4>\r\n<p>Giờ làm cho nav trông như một menu thật: một thanh ngang với các liên kết cách nhau. Flexbox ở Bài 5 làm được.</p>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 7. ✍️ Đến lượt bạn.</b> Trong <b>CSS</b>, biến <code>.menu</code> thành một hàng flex với <code>gap</code> là <code>16px</code>.</span>\r\n<template class=\"html\">&lt;nav class=\"menu\"&gt;\r\n  &lt;a href=\"index.html\"&gt;Home&lt;/a&gt;\r\n  &lt;a href=\"books.html\"&gt;Books&lt;/a&gt;\r\n  &lt;a href=\"about.html\"&gt;About&lt;/a&gt;\r\n&lt;/nav&gt;</template>\r\n<template class=\"css\">.menu { background: #121C30; padding: 12px; }\r\n.menu a { color: #7FD1C0; text-decoration: none; }</template>\r\n<template class=\"ts\">\r\nvar s = getComputedStyle(document.querySelector('.menu'));\r\nassert(s.display === 'flex', 'đặt display của .menu thành flex');\r\nassert(s.gap === '16px', 'đặt gap thành 16px');\r\n</template>\r\n</div>\r\n\r\n<h4>5. Trang con Books — một lưới sách</h4>\r\n<p>Trang Books trưng danh mục dưới dạng một lưới thẻ. Mỗi thẻ là một <code>&lt;div class=\"book\"&gt;</code> với tiêu đề và tác giả.</p>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 8. ✍️ Đến lượt bạn.</b> Làm một thẻ sách. Tạo một <code>&lt;div class=\"book\"&gt;</code> chứa một <code>&lt;h3&gt;</code> ghi <code>Dune</code> và một <code>&lt;p&gt;</code> ghi <code>Frank Herbert</code>.</span>\r\n<template class=\"st\">\r\n</template>\r\n<template class=\"ts\">\r\nvar book = document.querySelector('.book');\r\nassert(book, 'thêm một <div class=\"book\">');\r\nvar h3 = book.querySelector('h3');\r\nvar p = book.querySelector('p');\r\nassert(h3 && h3.textContent.trim() === 'Dune', 'thẻ sách phải có h3 ghi \"Dune\"');\r\nassert(p && p.textContent.trim() === 'Frank Herbert', 'thẻ sách phải có p ghi \"Frank Herbert\"');\r\n</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 9. ✍️ Đến lượt bạn.</b> Bố cục danh mục. Trong <b>CSS</b>, cho <code>.catalog</code> là lưới với <b>ba</b> cột (<code>1fr 1fr 1fr</code>) và <code>gap</code> là <code>12px</code>.</span>\r\n<template class=\"html\">&lt;div class=\"catalog\"&gt;\r\n  &lt;div class=\"book\"&gt;Dune&lt;/div&gt;&lt;div class=\"book\"&gt;1984&lt;/div&gt;&lt;div class=\"book\"&gt;Emma&lt;/div&gt;\r\n&lt;/div&gt;</template>\r\n<template class=\"css\">.catalog { }\r\n.book { background: #121C30; color: #E8E4D8; padding: 18px; text-align: center; }</template>\r\n<template class=\"ts\">\r\nvar s = getComputedStyle(document.querySelector('.catalog'));\r\nassert(s.display === 'grid', 'đặt display thành grid');\r\nassert(s.gridTemplateColumns.split(/\\s+/).filter(Boolean).length === 3, 'dùng ba cột');\r\nassert(s.rowGap === '12px', 'đặt gap thành 12px');\r\n</template>\r\n</div>\r\n\r\n<h4>6. Trang con About</h4>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 10. ✍️ Đến lượt bạn.</b> Dựng nội dung trang About: một <code>&lt;header&gt;</code> với một <code>&lt;h1&gt;</code> ghi <code>About us</code>, và một <code>&lt;main&gt;</code> với một <code>&lt;p&gt;</code> ghi <code>We opened in 1998.</code></span>\r\n<template class=\"st\">\r\n</template>\r\n<template class=\"ts\">\r\nvar h1 = document.querySelector('header h1');\r\nvar p = document.querySelector('main p');\r\nassert(h1 && h1.textContent.trim() === 'About us', 'thêm một header với h1 ghi \"About us\"');\r\nassert(p && p.textContent.trim() === 'We opened in 1998.', 'thêm một main với p ghi \"We opened in 1998.\"');\r\n</template>\r\n</div>\r\n\r\n<h4>7. Trang chủ hoàn chỉnh</h4>\r\n<div class=\"ex\" data-kind=\"web\"><span class=\"exq\"><b>Bài tập 11.</b> Chạy trang chủ có kiểu này để thấy mục tiêu — mọi thứ bạn đã học, cùng hoạt động.</span>\r\n<template class=\"st\">&lt;!doctype html&gt;\r\n&lt;html&gt;\r\n&lt;head&gt;&lt;
