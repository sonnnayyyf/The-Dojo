aded as you go.</p>\r\n\r\n<h4>1. Lists</h4>\r\n<p>Use an <b>unordered list</b> <code>&lt;ul&gt;</code> for items where order doesn't matter (bullets), and an <b>ordered list</b> <code>&lt;ol&gt;</code> when it does (numbered steps). Both hold <b>list items</b>, <code>&lt;li&gt;</code> — one per entry.</p>\r\n<div class=\"ex\" data-kind=\"web\"><span class=\"exq\"><b>Exercise 1.</b> Run and compare a bulleted list with a numbered one.</span>\r\n<template class=\"st\">&lt;ul&gt;\r\n  &lt;li&gt;Coffee&lt;/li&gt;\r\n  &lt;li&gt;Tea&lt;/li&gt;\r\n&lt;/ul&gt;\r\n&lt;ol&gt;\r\n  &lt;li&gt;Boil water&lt;/li&gt;\r\n  &lt;li&gt;Add leaves&lt;/li&gt;\r\n&lt;/ol&gt;</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 2. ✍️ Your turn.</b> Build a bulleted menu: a <code>&lt;ul&gt;</code> containing exactly three <code>&lt;li&gt;</code> items reading <code>Home</code>, <code>Menu</code> and <code>Contact</code>.</span>\r\n<template class=\"st\">&lt;ul&gt;\r\n\r\n&lt;/ul&gt;</template>\r\n<template class=\"ts\">\r\nvar items = document.querySelectorAll('ul li');\r\nassert(items.length === 3, 'the ul should contain exactly three li items');\r\nassert(items[0].textContent.trim() === 'Home', 'the first item should be \"Home\"');\r\nassert(items[1].textContent.trim() === 'Menu', 'the second item should be \"Menu\"');\r\nassert(items[2].textContent.trim() === 'Contact', 'the third item should be \"Contact\"');\r\n</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 3. ✍️ Your turn.</b> Make a numbered recipe: an <code>&lt;ol&gt;</code> with two <code>&lt;li&gt;</code> items reading <code>Mix</code> and <code>Bake</code>.</span>\r\n<template class=\"st\">&lt;ol&gt;\r\n\r\n&lt;/ol&gt;</template>\r\n<template class=\"ts\">\r\nvar ol = document.querySelector('ol');\r\nassert(ol, 'use an <ol> (ordered list)');\r\nvar items = ol.querySelectorAll('li');\r\nassert(items.length === 2, 'the ol should contain exactly two li items');\r\nassert(items[0].textContent.trim() === 'Mix' && items[1].textContent.trim() === 'Bake', 'the items should be \"Mix\" then \"Bake\"');\r\n</template>\r\n</div>\r\n\r\n<h4>2. Tables</h4>\r\n<p>Tables show data in rows and columns. A <code>&lt;table&gt;</code> holds <b>rows</b> <code>&lt;tr&gt;</code>; each row holds <b>cells</b>. Use <code>&lt;th&gt;</code> for header cells (bold) and <code>&lt;td&gt;</code> for data cells.</p>\r\n<figure class=\"diagram\">\r\n<svg viewBox=\"0 0 440 150\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"IBM Plex Mono, monospace\" font-size=\"12\">\r\n  <rect x=\"40\" y=\"20\" width=\"360\" height=\"40\" fill=\"#121C30\" stroke=\"#F5B942\"/>\r\n  <text x=\"70\" y=\"45\" fill=\"#F5B942\">th: Item</text>\r\n  <text x=\"250\" y=\"45\" fill=\"#F5B942\">th: Price</text>\r\n  <line x1=\"220\" y1=\"20\" x2=\"220\" y2=\"140\" stroke=\"#22304C\"/>\r\n  <rect x=\"40\" y=\"60\" width=\"360\" height=\"40\" fill=\"#0E1626\" stroke=\"#22304C\"/>\r\n  <text x=\"70\" y=\"85\" fill=\"#E8E4D8\">td: Coffee</text>\r\n  <text x=\"250\" y=\"85\" fill=\"#E8E4D8\">td: 25000</text>\r\n  <rect x=\"40\" y=\"100\" width=\"360\" height=\"40\" fill=\"#0E1626\" stroke=\"#22304C\"/>\r\n  <text x=\"70\" y=\"125\" fill=\"#E8E4D8\">td: Tea</text>\r\n  <text x=\"250\" y=\"125\" fill=\"#E8E4D8\">td: 30000</text>\r\n  <text x=\"10\" y=\"45\" fill=\"#7FD1C0\" font-size=\"11\" transform=\"rotate(-90 10,45)\">tr</text>\r\n</svg>\r\n<figcaption>A table is rows (tr) of cells: th for headers, td for data.</figcaption>\r\n</figure>\r\n<div class=\"ex\" data-kind=\"web\"><span class=\"exq\"><b>Exercise 4.</b> Run and see a two-column table render.</span>\r\n<template class=\"st\">&lt;table border=\"1\" cellpadding=\"6\"&gt;\r\n  &lt;tr&gt;&lt;th&gt;Item&lt;/th&gt;&lt;th&gt;Price&lt;/th&gt;&lt;/tr&gt;\r\n  &lt;tr&gt;&lt;td&gt;Coffee&lt;/td&gt;&lt;td&gt;25000&lt;/td&gt;&lt;/tr&gt;\r\n&lt;/table&gt;</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 5. ✍️ Your turn.</b> Add a data row. Inside the table, add one more <code>&lt;tr&gt;</code> with two <code>&lt;td&gt;</code> cells reading <code>Tea</code> and <code>30000</code>.</span>\r\n<template class=\"st\">&lt;table&gt;\r\n  &lt;tr&gt;&lt;th&gt;Item&lt;/th&gt;&lt;th&gt;Price&lt;/th&gt;&lt;/tr&gt;\r\n  &lt;tr&gt;&lt;td&gt;Coffee&lt;/td&gt;&lt;td&gt;25000&lt;/td&gt;&lt;/tr&gt;\r\n\r\n&lt;/table&gt;</template>\r\n<template class=\"ts\">\r\nvar rows = document.querySelectorAll('table tr');\r\nassert(rows.length === 3, 'the table should have three rows (1 header + 2 data)');\r\nvar last = rows[2].querySelectorAll('td');\r\nassert(last.length === 2, 'the new row needs two td cells');\r\nassert(last[0].textContent.trim() === 'Tea' && last[1].textContent.trim() === '30000', 'the new cells should read \"Tea\" and \"30000\"');\r\n</template>\r\n</div>\r\n\r\n<h4>3. Forms</h4>\r\n<p>Forms collect input from the user. A <code>&lt;form&gt;</code> wraps controls like <code>&lt;input&gt;</code> (a text box) and <code>&lt;button&gt;</code>. An input's <code>type</code> attribute picks the kind (<code>text</code>, <code>email</code>, <code>password</code>…), and <code>placeholder</code> shows grey hint text. A <code>&lt;label&gt;</code> names a field so it's clear and accessible.</p>\r\n<div class=\"ex\" data-kind=\"web\"><span class=\"exq\"><b>Exercise 6.</b> Run and try typing into the field.</span>\r\n<template class=\"st\">&lt;form&gt;\r\n  &lt;label&gt;Your name&lt;/label&gt;\r\n  &lt;input type=\"text\" placeholder=\"Type here\"&gt;\r\n  &lt;button&gt;Send&lt;/button&gt;\r\n&lt;/form&gt;</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 7. ✍️ Your turn.</b> Add an email field. Inside the form, add an <code>&lt;input&gt;</code> whose <code>type</code> is <code>email</code> and whose <code>placeholder</code> is exactly <code>you@example.com</code>.</span>\r\n<template class=\"st\">&lt;form&gt;\r\n\r\n  &lt;button&gt;Sign up&lt;/button&gt;\r\n&lt;/form&gt;</template>\r\n<template class=\"ts\">\r\nvar inp = document.querySelector('form input');\r\nassert(inp, 'add an <input> inside the form');\r\nassert(inp.getAttribute('type') === 'email', 'the input type should be \"email\"');\r\nassert(inp.getAttribute('placeholder') === 'you@example.com', 'the placeholder should be exactly \"you@example.com\"');\r\n</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 8. ✍️ Your turn.</b> Add a submit button. Inside the form add a <code>&lt;button&gt;</code> whose text is exactly <code>Subscribe</code>.</span>\r\n<template class=\"st\">&lt;form&gt;\r\n  &lt;input type=\"text\" placeholder=\"Name\"&gt;\r\n\r\n&lt;/form&gt;</template>\r\n<template class=\"ts\">\r\nvar btn = document.querySelector('form button');\r\nassert(btn, 'add a <button> inside the form');\r\nassert(btn.textContent.trim() === 'Subscribe', 'the button text should be exactly \"Subscribe\"');\r\n</template>\r\n</div>\r\n\r\n<h4>4. Semantic layout</h4>\r\n<p>You <i>could</i> build a whole page out of plain boxes, but HTML gives <b>semantic</b> elements that name a page's regions: <code>&lt;header&gt;</code> (top bar / title), <code>&lt;nav&gt;</code> (navigation links), <code>&lt;main&gt;</code> (the primary content), <code>&lt;section&gt;</code> (a grouped chunk) and <code>&lt;footer&gt;</code> (bottom bar). They render the same as a plain box but tell browsers, screen-readers and search engines <i>what each region means</i>.</p>\r\n<figure class=\"diagram\">\r\n<svg viewBox=\"0 0 400 200\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"13\">\r\n  <rect x=\"20\" y=\"15\" width=\"360\" height=\"34\" fill=\"#121C30\" stroke=\"#F5B942\"/><text x=\"200\" y=\"37\" text-anchor=\"middle\" fill=\"#F5B942\">header</text>\r\n  <rect x=\"20\" y=\"53\" width=\"360\" height=\"26\" fill=\"#0E1626\" stroke=\"#7FD1C0\"/><text x=\"200\" y=\"71\" text-anchor=\"middle\" fill=\"#7FD1C0\">nav</text>\r\n  <rect x=\"20\" y=\"83\" width=\"360\" height=\"80\" fill=\"#0E1626\" stroke=\"#22304C\"/><text x=\"200\" y=\"110\" text-anchor=\"middle\" fill=\"#E8E4D8\">main</text>\r\n  <rect x=\"35\" y=\"120\" width=\"330\" height=\"34\" fill=\"#121C30\" stroke=\"#22304C\"/><text x=\"200\" y=\"142\" text-anchor=\"middle\" fill=\"#8FA0BC\">section</text>\r\n  <rect x=\"20\" y=\"167\" width=\"360\" height=\"28\" fill=\"#121C30\" stroke=\"#E2604C\"/><text x=\"200\" y=\"186\" text-anchor=\"middle\" fill=\"#E2604C\">footer</text>\r\n</svg>\r\n<figcaption>The usual skeleton: header, nav, main (with sections inside), footer.</figcaption>\r\n</figure>\r\n<div class=\"ex\" data-kind=\"web\"><span class=\"exq\"><b>Exercise 9.</b> Run this semantic skeleton — it looks plain, but the regions are meaningful.</span>\r\n<template class=\"st\">&lt;header&gt;&lt;h1&gt;My Site&lt;/h1&gt;&lt;/header&gt;\r\n&lt;nav&gt;Home · About&lt;/nav&gt;\r\n&lt;main&gt;\r\n  &lt;section&gt;&lt;p&gt;Welcome to the site.&lt;/p&gt;&lt;/section&gt;\r\n&lt;/main&gt;\r\n&lt;footer&gt;© 2026&lt;/footer&gt;</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"quiz\" data-a=\"2\"><span class=\"exq\"><b>Exercise 10.</b> Which element is meant for the page's <b>primary content</b>?</span>\r\n<ol class=\"opts\">\r\n<li><code>&lt;header&gt;</code></li>\r\n<li><code>&lt;nav&gt;</code></li>\r\n<li><code>&lt;main&gt;</code></li>\r\n<li><code>&lt;footer&gt;</code></li>\r\n</ol></div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 11. ✍️ Your turn.</b> Add a footer. Below the main, add a <code>&lt;footer&gt;</code> whose text is exactly <code>© 2026 Dojo</code>.</span>\r\n<template class=\"st\">&lt;header&gt;&lt;h1&gt;Dojo&lt;/h1&gt;&lt;/header&gt;\r\n&lt;main&gt;&lt;p&gt;Hello&lt;/p&gt;&lt;/main&gt;\r\n</template>\r\n<template class=\"ts\">\r\nvar f = document.querySelector('footer');\r\nassert(f, 'add a <footer> element');\r\nassert(f.textContent.trim() === '© 2026 Dojo', 'the footer should read exactly \"© 2026 Dojo\"');\r\n</template>\r\n</div>\r\n\r\n<h4>5. Structure a whole page</h4>\r\n<div class=\"ex stretch\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 12. 🔥 Stretch — ✍️ your turn.</b> Lay out a page skeleton: a <code>&lt;header&gt;</code> containing an <code>&lt;h1&gt;</code> reading <code>Dojo Cafe</code>, a <code>&lt;nav&gt;</code> containing a <code>&lt;ul&gt;</code> with two <code>&lt;li&gt;</code> items (<code>Home</code>, <code>Menu</code>), and a <code>&lt;main&gt;</code> containing a <code>&lt;p&gt;</code> reading <code>Freshly brewed.</code></span>\r\n<template class=\"st\">&lt;header&gt;\r\n\r\n&lt;/header&gt;\r\n&lt;nav&gt;\r\n\r\n&lt;/nav&gt;\r\n&lt;main&gt;\r\n\r\n&lt;/main&gt;</template>\r\n<template class=\"ts\">\r\nvar h1 = document.querySelector('header h1');\r\nassert(h1 && h1.textContent.trim() === 'Dojo Cafe', 'the header should contain an h1 reading \"Dojo Cafe\"');\r\nvar navItems = document.querySelectorAll('nav ul li');\r\nassert(navItems.length === 2, 'the nav should contain a ul with two li items');\r\nassert(navItems[0].textContent.trim() === 'Home' && navItems[1].textContent.trim() === 'Menu', 'the nav items should be \"Home\" and \"Menu\"');\r\nvar p = document.querySelector('main p');\r\nassert(p && p.textContent.trim() === 'Freshly brewed.', 'main should contain a p reading \"Freshly brewed.\"');\r\n</template>\r\n</div>\r\n\r\n<h4>🏠 Homework</h4>\r\n<p>Four take-home exercises, auto-graded — mostly hands-on. The last one is a stretch.</p>\r\n<div class=\"ex homework\" data-kind=\"quiz\" data-a=\"1\"><span class=\"exq\"><b>Exercise 1.</b> Which pair correctly nests: a list holding its items?</span>\r\n<ol class=\"opts\">\r\n<li><code>&lt;li&gt;</code> holding <code>&lt;ul&gt;</code></li>\r\n<li><code>&lt;ul&gt;</code> holding <code>&lt;li&gt;</code></li>\r\n<li><code>&lt;tr&gt;</code> holding <code>&lt;ul&gt;</code></li>\r\n<li><code>&lt;ol&gt;</code> holding <code>&lt;td&gt;</code></li>\r\n</ol></div>\r\n<div class=\"ex homework\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 2. ✍️</b> Build a <code>&lt;ul&gt;</code> with three <code>&lt;li&gt;</code> items: <code>Red</code>, <code>Green</code>, <code>Blue</code>.</span>\r\n<template class=\"st\">&lt;ul&gt;\r\n\r\n&lt;/ul&gt;</template>\r\n<template class=\"ts\">\r\nvar items = document.querySelectorAll('ul li');\r\nassert(items.length === 3, 'the ul needs exactly three li items');\r\nassert(items[0].textContent.trim() === 'Red' && items[1].textContent.trim() === 'Green' && items[2].textContent.trim() === 'Blue', 'the items should be Red, Green, Blue');\r\n</template>\r\n</div>\r\n<div class=\"ex homework\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 3. ✍️</b> Add a text input with a <code>placeholder</code> of exactly <code>Search…</code> inside the form.</span>\r\n<template class=\"st\">&lt;form&gt;\r\n\r\n  &lt;button&gt;Go&lt;/button&gt;\r\n&lt;/form&gt;</template>\r\n<template class=\"ts\">\r\nvar inp = document.querySelector('form input');\r\nassert(inp, 'add an <input> inside the form');\r\nassert(inp.getAttribute('placeholder') === 'Search…', 'the placeholder should be exactly \"Search…\"');\r\n</template>\r\n</div>\r\n<div class=\"ex homework stretch\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 4. 🔥 Stretch — ✍️</b> Make a 2-row table: a header row with <code>&lt;th&gt;</code> cells <code>Name</code> and <code>Age</code>, then a data row with <code>&lt;td&gt;</code> cells <code>Mai</code> and <code>20</code>.</span>\r\n<template class=\"st\">&lt;table&gt;\r\n\r\n&lt;/table&gt;</template>\r\n<template class=\"ts\">\r\nvar rows = document.querySelectorAll('table tr');\r\nassert(rows.length === 2, 'the table should have two rows');\r\nvar th = rows[0].querySelectorAll('th');\r\nassert(th.length === 2 && th[0].textContent.trim() === 'Name' && th[1].textContent.trim() === 'Age', 'the header row needs th cells \"Name\" and \"Age\"');\r\nvar td = rows[1].querySelectorAll('td');\r\nassert(td.length === 2 && td[0].textContent.trim() === 'Mai' && td[1].textContent.trim() === '20', 'the data row needs td cells \"Mai\" and \"20\"');\r\n</template>\r\n</div>"}},{"t":{"vi":"CSS căn bản & box model","en":"CSS essentials & the box model"},"kind":"free","html":{"vi":"<h3>Bài 4 — CSS căn bản &amp; box model</h3>\r\n<p>Giờ bạn đã dựng được cấu trúc trang — nhưng mọi thứ trông như một tài liệu năm 1994: chữ Times New Roman đen trên nền trắng. <b>CSS</b> (Cascading Style Sheets) là ngôn ngữ làm cho nó trông có thiết kế. Nếu HTML nói <i>cái gì</i> là gì, thì CSS nói <i>nó nên trông ra sao</i>: màu, cỡ, khoảng cách, viền, phông. Đó là đòn bẩy lớn nhất quyết định một trang trông chuyên nghiệp đến đâu.</p>\r\n<p>CSS hoạt động bằng cách <b>chọn (select)</b> các phần tử rồi cho chúng các <b>khai báo (declaration)</b>. Mọi luật đều cùng một hình dạng: một <b>selector</b> (chọn phần tử nào), rồi một khối các cặp <code>property: value;</code>. <code>h1 { color: teal; }</code> nghĩa là \"tìm mọi <code>&lt;h1&gt;</code> và tô chữ nó màu teal\". Bạn sẽ học ba selector thường dùng — theo phần tử, theo <b>class</b> và theo <b>id</b> — cùng các thuộc tính về màu và chữ.</p>\r\n<p>Rồi đến ý tưởng mở khóa toàn bộ bố cục: <b>box model</b> (mô hình hộp). Mỗi phần tử là một hộp chữ nhật với bốn lớp — nội dung, padding, viền và margin. Làm chủ bốn thứ đó là bạn kiểm soát được khoảng cách ở mọi nơi. Như thường lệ, bạn sẽ sửa CSS thật trong trình soạn thảo, nhấn Chạy để xem trang đổi kiểu ngay.</p>\r\n\r\n<h4>1. Hình dạng một luật CSS</h4>\r\n<figure class=\"diagram\">\r\n<svg viewBox=\"0 0 460 140\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"IBM Plex Mono, monospace\" font-size=\"15\">\r\n  <text x=\"30\" y=\"60\" fill=\"#F5B942\">h1</text>\r\n  <text x=\"60\" y=\"60\" fill=\"#E8E4D8\">{</text>\r\n  <text x=\"85\" y=\"60\" fill=\"#7FD1C0\">color</text>\r\n  <text x=\"140\" y=\"60\" fill=\"#E8E4D8\">:</text>\r\n  <text x=\"155\" y=\"60\" fill=\"#E2604C\">teal</text>\r\n  <text x=\"205\" y=\"60\" fill=\"#E8E4D8\">; }</text>\r\n  <line x1=\"38\" y1=\"70\" x2=\"38\" y2=\"95\" stroke=\"#F5B942\"/><text x=\"18\" y=\"112\" fill=\"#F5B942\" font-size=\"11\">selector</text>\r\n  <line x1=\"110\" y1=\"70\" x2=\"110\" y2=\"88\" stroke=\"#7FD1C0\"/><text x=\"86\" y=\"105\" fill=\"#7FD1C0\" font-size=\"11\">thuộc tính</text>\r\n  <line x1=\"172\" y1=\"70\" x2=\"172\" y2=\"95\" stroke=\"#E2604C\"/><text x=\"156\" y=\"112\" fill=\"#E2604C\" font-size=\"11\">giá trị</text>\r\n</svg>\r\n<figcaption>selector { property: value; } — hình dạng chung của mọi luật CSS.</figcaption>\r\n</figure>\r\n<p>Có ba selector bạn sẽ dùng liên tục: theo <b>tên phần tử</b> (<code>p</code> — mọi đoạn văn), theo <b>class</b> (<code>.note</code> — mọi phần tử có <code>class=\"note\"</code>, dùng lại được), và theo <b>id</b> (<code>#hero</code> — một phần tử duy nhất có <code>id=\"hero\"</code>). Dấu chấm là class; dấu thăng là id.</p>\r\n<div class=\"ex\" data-kind=\"web\"><span class=\"exq\"><b>Bài tập 1.</b> Chạy và xem ba loại selector tô màu các phần tử khác nhau.</span>\r\n<template class=\"html\">&lt;h1&gt;Element selector&lt;/h1&gt;\r\n&lt;p class=\"note\"&gt;Class selector&lt;/p&gt;\r\n&lt;p id=\"hero\"&gt;Id selector&lt;/p&gt;</template>\r\n<template class=\"css\">h1 { color: teal; }\r\n.note { color: orange; }\r\n#hero { color: tomato; }</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"quiz\" data-a=\"1\"><span class=\"exq\"><b>Bài tập 2.</b> Selector nào nhắm mọi phần tử có <code>class=\"tag\"</code>?</span>\r\n<ol class=\"opts\">\r\n<li><code>#tag</code></li>\r\n<li><code>.tag</code></li>\r\n<li><code>tag</code></li>\r\n<li><code>&lt;tag&gt;</code></li>\r\n</ol></div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 3. ✍️ Đến lượt bạn.</b> Dùng <b>element selector</b>, làm mọi đoạn văn màu xanh dương. Trong CSS, đặt <code>color</code> của <code>p</code> thành <code>blue</code>.</span>\r\n<template class=\"html\">&lt;p&gt;First&lt;/p&gt;\r\n&lt;p&gt;Second&lt;/p&gt;</template>\r\n<template class=\"css\">\r\n</template>\r\n<template class=\"ts\">\r\nassert(getComputedStyle(document.querySelectorAll('p')[1]).color === 'rgb(0, 0, 255)', 'chọn p và đặt color thành blue');\r\n</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 4. ✍️ Đến lượt bạn.</b> Dùng <b>class selector</b>, cho tag một <code>background</code> màu gold. Viết luật cho <code>.tag</code> với <code>background: gold;</code></span>\r\n<template class=\"html\">&lt;span class=\"tag\"&gt;Sale&lt;/span&gt;</template>\r\n<template class=\"css\">\r\n</template>\r\n<template class=\"ts\">\r\nassert(getComputedStyle(document.querySelector('.tag')).backgroundColor === 'rgb(255, 215, 0)', 'chọn .tag và đặt background thành gold');\r\n</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 5. ✍️ Đến lượt bạn.</b> Dùng <b>id selector</b>, làm hero màu đỏ. Viết luật cho <code>#hero</code> với <code>color: red;</code></span>\r\n<template class=\"html\">&lt;h1 id=\"hero\"&gt;Big News&lt;/h1&gt;</template>\r\n<template class=\"css\">\r\n</template>\r\n<template class=\"ts\">\r\nassert(getComputedStyle(document.querySelector('#hero')).color === 'rgb(255, 0, 0)', 'chọn #hero và đặt color thành red');\r\n</template>\r\n</div>\r\n\r\n<h4>2. Màu &amp; chữ</h4>\r\n<p>Các thuộc tính chữ thường ngày: <code>color</code> (màu chữ), <code>background</code> (nền phía sau), <code>font-size</code> (ví dụ <code>24px</code>), <code>font-weight</code> (<code>bold</code>), và <code>text-align</code> (<code>left</code>, <code>center</code>, <code>right</code>).</p>\r\n<div class=\"ex\" data-kind=\"web\"><span class=\"exq\"><b>Bài tập 6.</b> Chạy, rồi chỉnh một giá trị và Chạy lại để cảm nhận từng thuộc tính.</span>\r\n<template class=\"html\">&lt;h1&gt;Styled heading&lt;/h1&gt;\r\n&lt;p&gt;Some body text.&lt;/p&gt;</template>\r\n<template class=\"css\">h1 { color: #7FD1C0; font-size: 34px; text-align: center; }\r\np  { color: #E8E4D8; font-size: 16px; }\r\nbody { background: #0E1626; padding: 16px; }</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 7. ✍️ Đến lượt bạn.</b> Làm tiêu đề to. Đặt <code>font-size</code> của <code>h1</code> đúng bằng <code>40px</code>.</span>\r\n<template class=\"html\">&lt;h1&gt;Welcome&lt;/h1&gt;</template>\r\n<template class=\"css\">h1 { color: black; }</template>\r\n<template class=\"ts\">\r\nassert(getComputedStyle(document.querySelector('h1')).fontSize === '40px', 'đặt font-size của h1 thành 40px');\r\n</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 8. ✍️ Đến lượt bạn.</b> Căn giữa đoạn văn. Đặt <code>text-align</code> của <code>p</code> thành <code>center</code>.</span>\r\n<template class=\"html\">&lt;p&gt;Centre me&lt;/p&gt;</template>\r\n<template class=\"css\">p { color: navy; }</template>\r\n<template class=\"ts\">\r\nassert(getComputedStyle(document.querySelector('p')).textAlign === 'center', 'đặt text-align của đoạn văn thành center');\r\n</template>\r\n</div>\r\n\r\n<h4>3. Box model</h4>\r\n<p>Mỗi phần tử là một hộp với bốn lớp đồng tâm, từ trong ra ngoài: <b>content</b> (chữ/hình), <b>padding</b> (khoảng trống <i>bên trong</i> hộp, giữa nội dung và viền), <b>border</b> (đường viền quanh nó), và <b>margin</b> (khoảng trống <i>bên ngoài</i>, đẩy các hộp khác ra). Làm đúng bốn thứ này là 90% của bố cục đẹp.</p>\r\n<figure class=\"diagram\">\r\n<svg viewBox=\"0 0 400 200\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"12\">\r\n  <rect x=\"20\" y=\"15\" width=\"360\" height=\"170\" fill=\"#2a1f10\" stroke=\"#F5B942\" stroke-dasharray=\"4 3\"/>\r\n  <text x=\"30\" y=\"30\" fill=\"#F5B942\">margin</text>\r\n  <rect x=\"70\" y=\"45\" width=\"260\" height=\"110\" fill=\"#101a2e\" stroke=\"#7FD1C0\"/>\r\n  <text x=\"80\" y=\"60\" fill=\"#7FD1C0\">border</text>\r\n  <rect x=\"110\" y=\"72\" width=\"180\" height=\"60\" fill=\"#12241f\" stroke=\"#7FD1C0\" stroke-dasharray=\"3 3\"/>\r\n  <text x=\"120\" y=\"87\" fill=\"#7FD1C0\" font-size=\"11\">padding</text>\r\n  <rect x=\"150\" y=\"90\" width=\"100\" height=\"26\" fill=\"#E2604C\"/>\r\n  <text x=\"200\" y=\"107\" text-anchor=\"middle\" fill=\"#0E1626\" font-size=\"11\">content</text>\r\n</svg>\r\n<figcaption>Trong → ngoài: content, padding, border, margin.</figcaption>\r\n</figure>\r\n<div class=\"ex\" data-kind=\"web\"><span class=\"exq\"><b>Bài tập 9.</b> Chạy cái này. Đổi <code>padding</code> thành <code>4px</code>, Chạy, và xem hộp co lại quanh chữ.</span>\r\n<template class=\"html\">&lt;div class=\"card\"&gt;A padded, bordered box&lt;/div&gt;</template>\r\n<template class=\"css\">.card {\r\n  padding: 24px;\r\n  border: 3px solid #7FD1C0;\r\n  margin: 20px;\r\n  background: #121C30;\r\n  color: #E8E4D8;\r\n}</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 10. ✍️ Đến lượt bạn.</b> Cho hộp có khoảng thở. Đặt <code>padding</code> của <code>.box</code> đúng bằng <code>20px</code>.</span>\r\n<template class=\"html\">&lt;div class=\"box\"&gt;Hello&lt;/div&gt;</template>\r\n<template class=\"css\">.box { background: teal; color: white; }</template>\r\n<template class=\"ts\">\r\nassert(getComputedStyle(document.querySelector('.box')).paddingTop === '20px', 'đặt padding của .box thành 20px');\r\n</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 11. ✍️ Đến lượt bạn.</b> Thêm viền. Cho <code>.box</code> một <code>border</code> là <code>2px solid navy</code> (viết gộp: <code>border: 2px solid navy;</code>).</span>\r\n<template class=\"html\">&lt;div class=\"box\"&gt;Framed&lt;/div&gt;</template>\r\n<template class=\"css\">.box { padding: 12px; }</template>\r\n<template class=\"ts\">\r\nvar s = getComputedStyle(document.querySelector('.box'));\r\nassert(s.borderTopWidth === '2px', 'độ dày viền phải là 2px');\r\nassert(s.borderTopStyle === 'solid', 'kiểu viền phải là solid');\r\nassert(s.borderTopColor === 'rgb(0, 0, 128)', 'màu viền phải là navy');\r\n</template>\r\n</div>\r\n\r\n<h4>4. Dựng một thẻ có kiểu</h4>\r\n<div class=\"ex stretch\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 12. 🔥 Nâng cao — ✍️ đến lượt bạn.</b> Tạo kiểu cho <code>.card</code>: <code>background</code> <code>gold</code>, <code>color</code> chữ <code>navy</code>, <code>padding</code> <code>24px</code>, và <code>text-align</code> <code>center</code>.</span>\r\n<template class=\"html\">&lt;div class=\"card\"&gt;&lt;h2&gt;Special offer&lt;/h2&gt;&lt;p&gt;Today only.&lt;/p&gt;&lt;/div&gt;</template>\r\n<template class=\"css\">.card {\r\n  \r\n}</template>\r\n<template class=\"ts\">\r\nvar s = getComputedStyle(document.querySelector('.card'));\r\nassert(s.backgroundColor === 'rgb(255, 215, 0)', 'background phải là gold');\r\nassert(s.color === 'rgb(0, 0, 128)', 'màu chữ phải là navy');\r\nassert(s.paddingTop === '24px', 'padding phải là 24px');\r\nassert(s.textAlign === 'center', 'text-align phải là center');\r\n</template>\r\n</div>\r\n\r\n<h4>🏠 Bài tập về nhà</h4>\r\n<p>Bốn bài mang về nhà, chấm tự động — phần lớn là thực hành. Bài cuối là bài nâng cao.</p>\r\n<div class=\"ex homework\" data-kind=\"quiz\" data-a=\"3\"><span class=\"exq\"><b>Bài tập 1.</b> Trong box model, lớp nào là khoảng trống <b>bên ngoài</b> viền, đẩy các hộp khác ra?</span>\r\n<ol class=\"opts\">\r\n<li>content</li>\r\n<li>padding</li>\r\n<li>border</li>\r\n<li>margin</li>\r\n</ol></div>\r\n<div class=\"ex homework\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 2. ✍️</b> Cho <code>body</code> nền <code>navy</code> và <code>h1</code> màu <code>white</code>.</span>\r\n<template class=\"html\">&lt;h1&gt;Night&lt;/h1&gt;</template>\r\n<template class=\"css\">\r\n</template>\r\n<template class=\"ts\">\r\nassert(getComputedStyle(document.body).backgroundColor === 'rgb(0, 0, 128)', 'đặt nền body thành navy');\r\nassert(getComputedStyle(document.querySelector('h1')).color === 'rgb(255, 255, 255)', 'đặt màu h1 thành white');\r\n</template>\r\n</div>\r\n<div class=\"ex homework\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 3. ✍️</b> Đặt <code>font-size</code> của <code>h1</code> thành <code>28px</code> và <code>text-align</code> thành <code>center</code>.</span>\r\n<template class=\"html\">&lt;h1&gt;Centred title&lt;/h1&gt;</template>\r\n<template class=\"css\">h1 { }</template>\r\n<template class=\"ts\">\r\nvar s = getComputedStyle(document.querySelector('h1'));\r\nassert(s.fontSize === '28px', 'font-size phải là 28px');\r\nassert(s.textAlign === 'center', 'text-align phải là center');\r\n</template>\r\n</div>\r\n<div class=\"ex homework stretch\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 4. 🔥 Nâng cao — ✍️</b> Tạo kiểu <code>.btn</code> như một nút: <code>background</code> <code>green</code>, <code>color</code> <code>white</code>, <code>padding</code> <code>12px</code>, và một <code>border</code> là <code>2px solid green</code>.</span>\r\n<template class=\"html\">&lt;span class=\"btn\"&gt;Buy now&lt;/span&gt;</template>\r\n<template class=\"css\">.btn {\r\n  \r\n}</template>\r\n<template class=\"ts\">\r\nvar s = getComputedStyle(document.querySelector('.btn'));\r\nassert(s.backgroundColor === 'rgb(0, 128, 0)', 'background phải là green');\r\nassert(s.color === 'rgb(255, 255, 255)', 'màu chữ phải là white');\r\nassert(s.paddingTop === '12px', 'padding phải là 12px');\r\nassert(s.borderTopWidth === '2px' && s.borderTopStyle === 'solid' && s.borderTopColor === 'rgb(0, 128, 0)', 'viền phải là 2px solid green');\r\n</template>\r\n</div>","en":"<h3>Lesson 4 — CSS essentials &amp; the box model</h3>\r\n<p>You can now structure a page — but everything looks like a 1994 document: black Times New Roman on white. <b>CSS</b> (Cascading Style Sheets) is the language that makes it look designed. Where HTML says <i>what</i> something is, CSS says <i>how it should look</i>: colour, size, spacing, borders, fonts. It's the single biggest lever you have over how professional a page feels.</p>\r\n<p>CSS works by <b>selecting</b> elements and giving them <b>declarations</b>. Every rule has the same shape: a <b>selector</b> (which elements), then a block of <code>property: value;</code> pairs. <code>h1 { color: teal; }</code> means \"find every <code>&lt;h1&gt;</code> and paint its text teal\". You'll learn the three everyday selectors — by element, by <b>class</b> and by <b>id</b> — and the properties for colour and text.</p>\r\n<p>Then comes the idea that unlocks all of layout: the <b>box model</b>. Every element is a rectangular box with four layers — content, padding, border and margin. Master those four and you control spacing everywhere. As always you'll edit real CSS in a live editor, pressing Run to watch the page restyle instantly.</p>\r\n\r\n<h4>1. The shape of a CSS rule</h4>\r\n<figure class=\"diagram\">\r\n<svg viewBox=\"0 0 460 140\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"IBM Plex Mono, monospace\" font-size=\"15\">\r\n  <text x=\"30\" y=\"60\" fill=\"#F5B942\">h1</text>\r\n  <text x=\"60\" y=\"60\" fill=\"#E8E4D8\">{</text>\r\n  <text x=\"85\" y=\"60\" fill=\"#7FD1C0\">color</text>\r\n  <text x=\"140\" y=\"60\" fill=\"#E8E4D8\">:</text>\r\n  <text x=\"155\" y=\"60\" fill=\"#E2604C\">teal</text>\r\n  <text x=\"205\" y=\"60\" fill=\"#E8E4D8\">; }</text>\r\n  <line x1=\"38\" y1=\"70\" x2=\"38\" y2=\"95\" stroke=\"#F5B942\"/><text x=\"15\" y=\"112\" fill=\"#F5B942\" font-size=\"11\">selector</text>\r\n  <line x1=\"110\" y1=\"70\" x2=\"110\" y2=\"88\" stroke=\"#7FD1C0\"/><text x=\"88\" y=\"105\" fill=\"#7FD1C0\" font-size=\"11\">property</text>\r\n  <line x1=\"172\" y1=\"70\" x2=\"172\" y2=\"95\" stroke=\"#E2604C\"/><text x=\"158\" y=\"112\" fill=\"#E2604C\" font-size=\"11\">value</text>\r\n</svg>\r\n<figcaption>selector { property: value; } — the universal shape of every CSS rule.</figcaption>\r\n</figure>\r\n<p>There are three selectors you'll use constantly: by <b>element name</b> (<code>p</code> — every paragraph), by <b>class</b> (<code>.note</code> — every element with <code>class=\"note\"</code>, reusable), and by <b>id</b> (<code>#hero</code> — the one element with <code>id=\"hero\"</code>, unique). A dot means class; a hash means id.</p>\r\n<div class=\"ex\" data-kind=\"web\"><span class=\"exq\"><b>Exercise 1.</b> Run and see the same three selector types colour different elements.</span>\r\n<template class=\"html\">&lt;h1&gt;Element selector&lt;/h1&gt;\r\n&lt;p class=\"note\"&gt;Class selector&lt;/p&gt;\r\n&lt;p id=\"hero\"&gt;Id selector&lt;/p&gt;</template>\r\n<template class=\"css\">h1 { color: teal; }\r\n.note { color: orange; }\r\n#hero { color: tomato; }</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"quiz\" data-a=\"1\"><span class=\"exq\"><b>Exercise 2.</b> Which selector targets every element with <code>class=\"tag\"</code>?</span>\r\n<ol class=\"opts\">\r\n<li><code>#tag</code></li>\r\n<li><code>.tag</code></li>\r\n<li><code>tag</code></li>\r\n<li><code>&lt;tag&gt;</code></li>\r\n</ol></div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 3. ✍️ Your turn.</b> Using an <b>element selector</b>, make every paragraph blue. In the CSS, set <code>p</code>'s <code>color</code> to <code>blue</code>.</span>\r\n<template class=\"html\">&lt;p&gt;First&lt;/p&gt;\r\n&lt;p&gt;Second&lt;/p&gt;</template>\r\n<template class=\"css\">\r\n</template>\r\n<template class=\"ts\">\r\nassert(getComputedStyle(document.querySelectorAll('p')[1]).color === 'rgb(0, 0, 255)', 'select p and set color to blue');\r\n</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 4. ✍️ Your turn.</b> Using a <b>class selector</b>, give the tag a gold <code>background</code>. Write a rule for <code>.tag</code> with <code>background: gold;</code></span>\r\n<template class=\"html\">&lt;span class=\"tag\"&gt;Sale&lt;/span&gt;</template>\r\n<template class=\"css\">\r\n</template>\r\n<template class=\"ts\">\r\nassert(getComputedStyle(document.querySelector('.tag')).backgroundColor === 'rgb(255, 215, 0)', 'select .tag and set background to gold');\r\n</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 5. ✍️ Your turn.</b> Using an <b>id selector</b>, make the hero red. Write a rule for <code>#hero</code> with <code>color: red;</code></span>\r\n<template class=\"html\">&lt;h1 id=\"hero\"&gt;Big News&lt;/h1&gt;</template>\r\n<template class=\"css\">\r\n</template>\r\n<template class=\"ts\">\r\nassert(getComputedStyle(document.querySelector('#hero')).color === 'rgb(255, 0, 0)', 'select #hero and set color to red');\r\n</template>\r\n</div>\r\n\r\n<h4>2. Colour &amp; text</h4>\r\n<p>The everyday text properties: <code>color</code> (text colour), <code>background</code> (fill behind it), <code>font-size</code> (e.g. <code>24px</code>), <code>font-weight</code> (<code>bold</code>), and <code>text-align</code> (<code>left</code>, <code>center</code>, <code>right</code>).</p>\r\n<div class=\"ex\" data-kind=\"web\"><span class=\"exq\"><b>Exercise 6.</b> Run, then tweak a value and Run again to feel each property.</span>\r\n<template class=\"html\">&lt;h1&gt;Styled heading&lt;/h1&gt;\r\n&lt;p&gt;Some body text.&lt;/p&gt;</template>\r\n<template class=\"css\">h1 { color: #7FD1C0; font-size: 34px; text-align: center; }\r\np  { color: #E8E4D8; font-size: 16px; }\r\nbody { background: #0E1626; padding: 16px; }</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 7. ✍️ Your turn.</b> Make the heading big. Set the <code>h1</code>'s <code>font-size</code> to exactly <code>40px</code>.</span>\r\n<template class=\"html\">&lt;h1&gt;Welcome&lt;/h1&gt;</template>\r\n<template class=\"css\">h1 { color: black; }</template>\r\n<template class=\"ts\">\r\nassert(getComputedStyle(document.querySelector('h1')).fontSize === '40px', 'set the h1 font-size to 40px');\r\n</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 8. ✍️ Your turn.</b> Centre the paragraph. Set the <code>p</code>'s <code>text-align</code> to <code>center</code>.</span>\r\n<template class=\"html\">&lt;p&gt;Centre me&lt;/p&gt;</template>\r\n<template class=\"css\">p { color: navy; }</template>\r\n<template class=\"ts\">\r\nassert(getComputedStyle(document.querySelector('p')).textAlign === 'center', 'set the paragraph text-align to center');\r\n</template>\r\n</div>\r\n\r\n<h4>3. The box model</h4>\r\n<p>Every element is a box with four concentric layers, from the inside out: <b>content</b> (the text/image), <b>padding</b> (space <i>inside</i> the box, between content and border), <b>border</b> (the line around it), and <b>margin</b> (space <i>outside</i>, pushing other boxes away). Getting these right is 90% of good layout.</p>\r\n<figure class=\"diagram\">\r\n<svg viewBox=\"0 0 400 200\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"12\">\r\n  <rect x=\"20\" y=\"15\" width=\"360\" height=\"170\" fill=\"#2a1f10\" stroke=\"#F5B942\" stroke-dasharray=\"4 3\"/>\r\n  <text x=\"30\" y=\"30\" fill=\"#F5B942\">margin</text>\r\n  <rect x=\"70\" y=\"45\" width=\"260\" height=\"110\" fill=\"#101a2e\" stroke=\"#7FD1C0\"/>\r\n  <text x=\"80\" y=\"60\" fill=\"#7FD1C0\">border</text>\r\n  <rect x=\"110\" y=\"72\" width=\"180\" height=\"60\" fill=\"#12241f\" stroke=\"#7FD1C0\" stroke-dasharray=\"3 3\"/>\r\n  <text x=\"120\" y=\"87\" fill=\"#7FD1C0\" font-size=\"11\">padding</text>\r\n  <rect x=\"150\" y=\"90\" width=\"100\" height=\"26\" fill=\"#E2604C\"/>\r\n  <text x=\"200\" y=\"107\" text-anchor=\"middle\" fill=\"#0E1626\" font-size=\"11\">content</text>\r\n</svg>\r\n<figcaption>Inside → out: content, padding, border, margin.</figcaption>\r\n</figure>\r\n<div class=\"ex\" data-kind=\"web\"><span class=\"exq\"><b>Exercise 9.</b> Run this. Change <code>padding</code> to <code>4px</code>, Run, and watch the box tighten around the text.</span>\r\n<template class=\"html\">&lt;div class=\"card\"&gt;A padded, bordered box&lt;/div&gt;</template>\r\n<template class=\"css\">.card {\r\n  padding: 24px;\r\n  border: 3px solid #7FD1C0;\r\n  margin: 20px;\r\n  background: #121C30;\r\n  color: #E8E4D8;\r\n}</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 10. ✍️ Your turn.</b> Give the box breathing room. Set the <code>.box</code>'s <code>padding</code> to exactly <code>20px</code>.</span>\r\n<template class=\"html\">&lt;div class=\"box\"&gt;Hello&lt;/div&gt;</template>\r\n<template class=\"css\">.box { background: teal; color: white; }</template>\r\n<template class=\"ts\">\r\nassert(getComputedStyle(document.querySelector('.box')).paddingTop === '20px', 'set the .box padding to 20px');\r\n</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 11. ✍️ Your turn.</b> Add a border. Give <code>.box</code> a <code>border</code> of <code>2px solid navy</code> (write it as one shorthand: <code>border: 2px solid navy;</code>).</span>\r\n<template class=\"html\">&lt;div class=\"box\"&gt;Framed&lt;/div&gt;</template>\r\n<template class=\"css\">.box { padding: 12px; }</template>\r\n<template class=\"ts\">\r\nvar s = getComputedStyle(document.querySelector('.box'));\r\nassert(s.borderTopWidth === '2px', 'the border width should be 2px');\r\nassert(s.borderTopStyle === 'solid', 'the border style should be solid');\r\nassert(s.borderTopColor === 'rgb(0, 0, 128)', 'the border colour should be navy');\r\n</template>\r\n</div>\r\n\r\n<h4>4. Build a styled card</h4>\r\n<div class=\"ex stretch\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 12. 🔥 Stretch — ✍️ your turn.</b> Style the <code>.card</code>: <code>background</code> <code>gold</code>, text <code>color</code> <code>navy</code>, <code>padding</code> <code>24px</code>, and <code>text-align</code> <code>center</code>.</span>\r\n<template class=\"html\">&lt;div class=\"card\"&gt;&lt;h2&gt;Special offer&lt;/h2&gt;&lt;p&gt;Today only.&lt;/p&gt;&lt;/div&gt;</template>\r\n<template class=\"css\">.card {\r\n  \r\n}</template>\r\n<template class=\"ts\">\r\nvar s = getComputedStyle(document.querySelector('.card'));\r\nassert(s.backgroundColor === 'rgb(255, 215, 0)', 'background should be gold');\r\nassert(s.color === 'rgb(0, 0, 128)', 'text colour should be navy');\r\nassert(s.paddingTop === '24px', 'padding should be 24px');\r\nassert(s.textAlign === 'center', 'text-align should be center');\r\n</template>\r\n</div>\r\n\r\n<h4>🏠 Homework</h4>\r\n<p>Four take-home exercises, auto-graded — mostly hands-on. The last one is a stretch.</p>\r\n<div class=\"ex homework\" data-kind=\"quiz\" data-a=\"3\"><span class=\"exq\"><b>Exercise 1.</b> In the box model, which layer is the space <b>outside</b> the border, pushing other boxes away?</span>\r\n<ol class=\"opts\">\r\n<li>content</li>\r\n<li>padding</li>\r\n<li>border</li>\r\n<li>margin</li>\r\n</ol></div>\r\n<div class=\"ex homework\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 2. ✍️</b> Give the <code>body</code> a <code>navy</code> background and the <code>h1</code> a <code>white</code> colour.</span>\r\n<template class=\"html\">&lt;h1&gt;Night&lt;/h1&gt;</template>\r\n<template class=\"css\">\r\n</template>\r\n<template class=\"ts\">\r\nassert(getComputedStyle(document.body).backgroundColor === 'rgb(0, 0, 128)', 'set the body background to navy');\r\nassert(getComputedStyle(document.querySelector('h1')).color === 'rgb(255, 255, 255)', 'set the h1 colour to white');\r\n</template>\r\n</div>\r\n<div class=\"ex homework\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 3. ✍️</b> Set the <code>h1</code>'s <code>font-size</code> to <code>28px</code> and <code>text-align</code> to <code>center</code>.</span>\r\n<template class=\"html\">&lt;h1&gt;Centred title&lt;/h1&gt;</template>\r\n<template class=\"css\">h1 { }</template>\r\n<template class=\"ts\">\r\nvar s = getComputedStyle(document.querySelector('h1'));\r\nassert(s.fontSize === '28px', 'font-size should be 28px');\r\nassert(s.textAlign === 'center', 'text-align should be center');\r\n</template>\r\n</div>\r\n<div class=\"ex homework stretch\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 4. 🔥 Stretch — ✍️</b> Style <code>.btn</code> like a button: <code>background</code> <code>green</code>, <code>color</code> <code>white</code>, <code>padding</code> <code>12px</code>, and a <code>border</code> of <code>2px solid green</code>.</span>\r\n<template class=\"html\">&lt;span class=\"btn\"&gt;Buy now&lt;/span&gt;</template>\r\n<template class=\"css\">.btn {\r\n  \r\n}</template>\r\n<template class=\"ts\">\r\nvar s = getComputedStyle(document.querySelector('.btn'));\r\nassert(s.backgroundColor === 'rgb(0, 128, 0)', 'background should be green');\r\nassert(s.color === 'rgb(255, 255, 255)', 'colour should be white');\r\nassert(s.paddingTop === '12px', 'padding should be 12px');\r\nassert(s.borderTopWidth === '2px' && s.borderTopStyle === 'solid' && s.borderTopColor === 'rgb(0, 128, 0)', 'border should be 2px solid green');\r\n</template>\r\n</div>"}},{"t":{"vi":"Bố cục với Flexbox","en":"CSS layout with flexbox"},"kind":"free","html":{"vi":"<h3>Bài 5 — Bố cục với Flexbox</h3>\r\n<p>Mọi thứ bạn tạo kiểu đến giờ đều xếp <b>từ trên xuống</b>, khối này dưới khối kia. Nhưng giao diện thật đặt mọi thứ <i>cạnh nhau</i>: logo bên trái và menu bên phải, một hàng thẻ sản phẩm, các nút trong thanh công cụ. Suốt nhiều thập kỷ đây là phần khó nhất của CSS. Rồi <b>flexbox</b> xuất hiện và biến nó thành dễ — đây là công cụ bố cục bạn sẽ dùng mỗi ngày.</p>\r\n<p>Ý tưởng rất đơn giản: chọn một <b>hộp chứa (container)</b> và đặt <code>display: flex</code>. Ngay lập tức các con trực tiếp của nó xếp thành một <b>hàng</b>, và bạn có một bộ điều khiển để phân bố và căn chỉnh chúng. Hai thuộc tính làm phần lớn công việc: <code>justify-content</code> phân bố các mục dọc theo <b>trục chính</b> (mặc định là trái↔phải), và <code>align-items</code> căn chúng theo <b>trục phụ</b> (trên↔dưới). Thêm <code>gap</code> để có khoảng cách đều giữa chúng.</p>\r\n<p>Vì flexbox là trực quan, bạn học nó bằng cách <i>nhìn</i> nó chuyển động. Mỗi bài tập ở đây là một bản xem trước trực tiếp: đổi một thuộc tính, nhấn Chạy, và xem các hộp trượt vào chỗ. Bố cục nào.</p>\r\n\r\n<h4>1. display: flex — từ chồng thành hàng</h4>\r\n<p>Mặc định, phần tử khối xếp dọc. Biến <b>cha</b> của chúng thành một hộp flex và các con bật thành một hàng ngang.</p>\r\n<div class=\"ex\" data-kind=\"web\"><span class=\"exq\"><b>Bài tập 1.</b> Chạy một lần (đang xếp chồng). Rồi đổi <code>display: block</code> thành <code>display: flex</code> và Chạy lại — các hộp xếp thành hàng.</span>\r\n<template class=\"html\">&lt;div class=\"row\"&gt;\r\n  &lt;div class=\"box\"&gt;A&lt;/div&gt;\r\n  &lt;div class=\"box\"&gt;B&lt;/div&gt;\r\n  &lt;div class=\"box\"&gt;C&lt;/div&gt;\r\n&lt;/div&gt;</template>\r\n<template class=\"css\">.row { display: block; gap: 10px; }\r\n.box { background: #7FD1C0; color: #0E1626; padding: 16px; }</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 2. ✍️ Đến lượt bạn.</b> Biến container thành hàng. Đặt <code>display</code> của <code>.row</code> thành <code>flex</code>.</span>\r\n<template class=\"html\">&lt;div class=\"row\"&gt;\r\n  &lt;div class=\"box\"&gt;1&lt;/div&gt;\r\n  &lt;div class=\"box\"&gt;2&lt;/div&gt;\r\n&lt;/div&gt;</template>\r\n<template class=\"css\">.row { }\r\n.box { background: gold; padding: 12px; }</template>\r\n<template class=\"ts\">\r\nassert(getComputedStyle(document.querySelector('.row')).display === 'flex', 'đặt display của .row thành flex');\r\n</template>\r\n</div>\r\n\r\n<h4>2. justify-content — phân bố dọc theo hàng</h4>\r\n<p>Trên một hộp flex, <code>justify-content</code> điều khiển cách các mục nằm dọc theo trục chính (ngang): <code>flex-start</code> (mặc định, trái), <code>center</code>, <code>flex-end</code> (phải), <code>space-between</code> (đẩy ra hai mép, có khoảng trống ở giữa), và <code>space-around</code>.</p>\r\n<div class=\"ex\" data-kind=\"web\"><span class=\"exq\"><b>Bài tập 3.</b> Chạy, rồi thử từng giá trị của <code>justify-content</code> và xem ba hộp dịch chuyển.</span>\r\n<template class=\"html\">&lt;div class=\"row\"&gt;\r\n  &lt;div class=\"box\"&gt;A&lt;/div&gt;&lt;div class=\"box\"&gt;B&lt;/div&gt;&lt;div class=\"box\"&gt;C&lt;/div&gt;\r\n&lt;/div&gt;</template>\r\n<template class=\"css\">.row { display: flex; justify-content: center; background: #121C30; }\r\n.box { background: #F5B942; color: #0E1626; padding: 14px; margin: 4px; }</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"quiz\" data-a=\"1\"><span class=\"exq\"><b>Bài tập 4.</b> Thuộc tính nào đẩy các mục ra sát hai mép với khoảng trống ở giữa?</span>\r\n<ol class=\"opts\">\r\n<li><code>align-items: center</code></li>\r\n<li><code>justify-content: space-between</code></li>\r\n<li><code>display: block</code></li>\r\n<li><code>gap: 10px</code></li>\r\n</ol></div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 5. ✍️ Đến lượt bạn.</b> Căn giữa các mục. Trên <code>.row</code> (đã là flex), đặt <code>justify-content</code> thành <code>center</code>.</span>\r\n<template class=\"html\">&lt;div class=\"row\"&gt;&lt;div class=\"box\"&gt;X&lt;/div&gt;&lt;div class=\"box\"&gt;Y&lt;/div&gt;&lt;/div&gt;</template>\r\n<template class=\"css\">.row { display: flex; }\r\n.box { background: teal; color: white; padding: 12px; margin: 3px; }</template>\r\n<template class=\"ts\">\r\nassert(getComputedStyle(document.querySelector('.row')).justifyContent === 'center', 'đặt justify-content thành center');\r\n</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 6. ✍️ Đến lượt bạn.</b> Đẩy logo và menu ra xa. Trên <code>.bar</code> (flex), đặt <code>justify-content</code> thành <code>space-between</code>.</span>\r\n<template class=\"html\">&lt;div class=\"bar\"&gt;&lt;span&gt;Logo&lt;/span&gt;&lt;span&gt;Menu&lt;/span&gt;&lt;/div&gt;</template>\r\n<template class=\"css\">.bar { display: flex; background: #121C30; color: #E8E4D8; padding: 10px; }</template>\r\n<template class=\"ts\">\r\nassert(getComputedStyle(document.querySelector('.bar')).justifyContent === 'space-between', 'đặt justify-content thành space-between');\r\n</template>\r\n</div>\r\n\r\n<h4>3. align-items — trục phụ</h4>\r\n<p>Trong khi <code>justify-content</code> làm việc dọc theo hàng, <code>align-items</code> căn các mục <i>ngang qua</i> nó (theo chiều dọc, khi hàng nằm ngang): <code>flex-start</code> (trên), <code>center</code>, <code>flex-end</code> (dưới), <code>stretch</code>. Đặt <b>cả hai</b> thành <code>center</code> là cách kinh điển để căn giữa hoàn hảo một thứ.</p>\r\n<div class=\"ex\" data-kind=\"web\"><span class=\"exq\"><b>Bài tập 7.</b> Chạy — các hộp nằm giữa một hàng cao. Đổi <code>align-items</code> thành <code>flex-start</code> và Chạy để thấy chúng nhảy lên đỉnh.</span>\r\n<template class=\"html\">&lt;div class=\"row\"&gt;&lt;div class=\"box\"&gt;A&lt;/div&gt;&lt;div class=\"box\"&gt;B&lt;/div&gt;&lt;/div&gt;</template>\r\n<template class=\"css\">.row { display: flex; align-items: center; height: 120px; background: #121C30; }\r\n.box { background: #E2604C; color: white; padding: 12px; margin: 4px; }</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 8. ✍️ Đến lượt bạn.</b> Căn giữa các mục theo chiều dọc. Trên <code>.row</code>, đặt <code>align-items</code> thành <code>center</code>.</span>\r\n<template class=\"html\">&lt;div class=\"row\"&gt;&lt;div class=\"box\"&gt;Hi&lt;/div&gt;&lt;/div&gt;</template>\r\n<template class=\"css\">.row { display: flex; height: 100px; background: navy; }\r\n.box { background: gold; padding: 10px; }</template>\r\n<template class=\"ts\">\r\nassert(getComputedStyle(document.querySelector('.row')).alignItems === 'center', 'đặt align-items thành center');\r\n</template>\r\n</div>\r\n\r\n<h4>4. gap và flex-direction</h4>\r\n<p><code>gap</code> thêm khoảng cách đều <i>giữa</i> các mục flex — gọn hơn dùng margin. Và <code>flex-direction: column</code> lật trục chính thành dọc, nên các mục xếp chồng (nhưng vẫn có mọi điều khiển flex).</p>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 9. ✍️ Đến lượt bạn.</b> Cách đều các mục. Trên <code>.row</code>, thêm <code>gap</code> là <code>16px</code>.</span>\r\n<template class=\"html\">&lt;div class=\"row\"&gt;&lt;div class=\"box\"&gt;1&lt;/div&gt;&lt;div class=\"box\"&gt;2&lt;/div&gt;&lt;div class=\"box\"&gt;3&lt;/div&gt;&lt;/div&gt;</template>\r\n<template class=\"css\">.row { display: flex; }\r\n.box { background: teal; color: white; padding: 12px; }</template>\r\n<template class=\"ts\">\r\nassert(getComputedStyle(document.querySelector('.row')).gap === '16px', 'thêm gap: 16px vào .row');\r\n</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 10. ✍️ Đến lượt bạn.</b> Xếp các mục flex theo chiều dọc. Trên <code>.row</code>, đặt <code>flex-direction</code> thành <code>column</code>.</span>\r\n<template class=\"html\">&lt;div class=\"row\"&gt;&lt;div class=\"box\"&gt;Top&lt;/div&gt;&lt;div class=\"box\"&gt;Bottom&lt;/div&gt;&lt;/div&gt;</template>\r\n<template class=\"css\">.row { display: flex; gap: 6px; }\r\n.box { background: #F5B942; color: #0E1626; padding: 10px; }</template>\r\n<template class=\"ts\">\r\nassert(getComputedStyle(document.querySelector('.row')).flexDirection === 'column', 'đặt flex-direction thành column');\r\n</template>\r\n</div>\r\n\r\n<h4>5. Dựng bố cục thật</h4>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 11. ✍️ Đến lượt bạn.</b> Căn giữa hoàn hảo một huy hiệu: trên <code>.stage</code> (flex, cao), đặt <b>cả hai</b> <code>justify-content</code> và <code>align-items</code> thành <code>center</code>.</span>\r\n<template class=\"html\">&lt;div class=\"stage\"&gt;&lt;div class=\"badge\"&gt;★&lt;/div&gt;&lt;/div&gt;</template>\r\n<template class=\"css\">.stage { display: flex; height: 140px; background: #121C30; }\r\n.badge { background: gold; padding: 16px; }</template>\r\n<template class=\"ts\">\r\nvar s = getComputedStyle(document.querySelector('.stage'));\r\nassert(s.justifyContent === 'center', 'đặt justify-content thành center');\r\nassert(s.alignItems === 'center', 'đặt align-items thành center');\r\n</template>\r\n</div>\r\n<div class=\"ex stretch\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 12. 🔥 Nâng cao — ✍️ đến lượt bạn.</b> Dựng một navbar: cho <code>.nav</code> là một hàng flex với <code>justify-content: space-between</code>, <code>align-items: center</code>, và <code>gap</code> là <code>12px</code>.</span>\r\n<template class=\"html\">&lt;div class=\"nav\"&gt;&lt;span&gt;Dojo&lt;/span&gt;&lt;span&gt;Home&lt;/span&gt;&lt;span&gt;Login&lt;/span&gt;&lt;/div&gt;</template>\r\n<template class=\"css\">.nav {\r\n  background: #0E1626; color: #E8E4D8; padding: 12px;\r\n}</template>\r\n<template class=\"ts\">\r\nvar s = getComputedStyle(document.querySelector('.nav'));\r\nassert(s.display === 'flex', 'đặt display thành flex');\r\nassert(s.justifyContent === 'space-between', 'đặt justify-content thành space-between');\r\nassert(s.alignItems === 'center', 'đặt align-items thành center');\r\nassert(s.gap === '12px', 'đặt gap thành 12px');\r\n</template>\r\n</div>\r\n\r\n<h4>🏠 Bài tập về nhà</h4>\r\n<p>Bốn bài mang về nhà, chấm tự động — tất cả đều thực hành. Bài cuối là bài nâng cao.</p>\r\n<div class=\"ex homework\" data-kind=\"quiz\" data-a=\"2\"><span class=\"exq\"><b>Bài tập 1.</b> Để các con của một phần tử xếp thành hàng flex, bạn đặt <code>display</code> của phần tử thành…</span>\r\n<ol class=\"opts\">\r\n<li><code>block</code></li>\r\n<li><code>row</code></li>\r\n<li><code>flex</code></li>\r\n<li><code>grid</code></li>\r\n</ol></div>\r\n<div class=\"ex homework\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 2. ✍️</b> Biến <code>.row</code> thành hộp flex và đặt <code>justify-content</code> thành <code>center</code>.</span>\r\n<template class=\"html\">&lt;div class=\"row\"&gt;&lt;div class=\"box\"&gt;A&lt;/div&gt;&lt;div class=\"box\"&gt;B&lt;/div&gt;&lt;/div&gt;</template>\r\n<template class=\"css\">.row { }\r\n.box { background: teal; color: white; padding: 10px; margin: 3px; }</template>\r\n<template class=\"ts\">\r\nvar s = getComputedStyle(document.querySelector('.row'));\r\nassert(s.display === 'flex', 'đặt display thành flex');\r\nassert(s.justifyContent === 'center', 'đặt justify-content thành center');\r\n</template>\r\n</div>\r\n<div class=\"ex homework\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 3. ✍️</b> Biến <code>.list</code> thành cột flex với <code>gap</code> là <code>8px</code>.</span>\r\n<template class=\"html\">&lt;div class=\"list\"&gt;&lt;div class=\"box\"&gt;1&lt;/div&gt;&lt;div class=\"box\"&gt;2&lt;/div&gt;&lt;/div&gt;</template>\r\n<template class=\"css\">.list { display: flex; }\r\n.box { background: gold; padding: 8px; }</template>\r\n<template class=\"ts\">\r\nvar s = getComputedStyle(document.querySelector('.list'));\r\nassert(s.flexDirection === 'column', 'đặt flex-direction thành column');\r\nassert(s.gap === '8px', 'đặt gap thành 8px');\r\n</template>\r\n</div>\r\n<div class=\"ex homework stretch\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 4. 🔥 Nâng cao — ✍️</b> Dựng một thanh công cụ: <code>.bar</code> là flex, <code>justify-content: space-between</code>, <code>align-items: center</code>, <code>gap: 10px</code>.</span>\r\n<template class=\"html\">&lt;div class=\"bar\"&gt;&lt;span&gt;File&lt;/span&gt;&lt;span&gt;Edit&lt;/span&gt;&lt;span&gt;Help&lt;/span&gt;&lt;/div&gt;</template>\r\n<template class=\"css\">.bar { background: #121C30; color: #E8E4D8; padding: 10px; }</template>\r\n<template class=\"ts\">\r\nvar s = getComputedStyle(document.querySelector('.bar'));\r\nassert(s.display === 'flex', 'đặt display thành flex');\r\nassert(s.justifyContent === 'space-between', 'đặt justify-content thành space-between');\r\nassert(s.alignItems === 'center', 'đặt align-items thành center');\r\nassert(s.gap === '10px', 'đặt gap thành 10px');\r\n</template>\r\n</div>","en":"<h3>Lesson 5 — CSS layout with flexbox</h3>\r\n<p>Everything you've styled so far has stacked <b>top to bottom</b>, one block under the last. But real interfaces put things <i>side by side</i>: a logo on the left and a menu on the right, a row of product cards, buttons in a toolbar. For decades this was the hardest part of CSS. Then <b>flexbox</b> arrived and made it easy — it is the layout tool you'll reach for every single day.</p>\r\n<p>The idea is simple: pick a <b>container</b> and set <code>display: flex</code>. Instantly its direct children line up in a <b>row</b>, and you gain a set of controls to distribute and align them. Two properties do most of the work: <code>justify-content</code> spaces the items along the <b>main axis</b> (by default, left↔right), and <code>align-items</code> aligns them across the <b>cross axis</b> (top↔bottom). Add <code>gap</code> for even spacing between them.</p>\r\n<p>Because flexbox is visual, you learn it by <i>seeing</i> it move. Every exercise here is a live preview: change one property, press Run, and watch the boxes slide into place. Let's lay things out.</p>\r\n\r\n<h4>1. display: flex — from stack to row</h4>\r\n<p>By default, block elements stack vertically. Turn their <b>parent</b> into a flex container and the children snap into a horizontal row.</p>\r\n<div class=\"ex\" data-kind=\"web\"><span class=\"exq\"><b>Exercise 1.</b> Run it once (stacked). Then change <code>display: block</code> to <code>display: flex</code> and Run again — the boxes line up in a row.</span>\r\n<template class=\"html\">&lt;div class=\"row\"&gt;\r\n  &lt;div class=\"box\"&gt;A&lt;/div&gt;\r\n  &lt;div class=\"box\"&gt;B&lt;/div&gt;\r\n  &lt;div class=\"box\"&gt;C&lt;/div&gt;\r\n&lt;/div&gt;</template>\r\n<template class=\"css\">.row { display: block; gap: 10px; }\r\n.box { background: #7FD1C0; color: #0E1626; padding: 16px; }</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 2. ✍️ Your turn.</b> Turn the container into a row. Set <code>.row</code>'s <code>display</code> to <code>flex</code>.</span>\r\n<template class=\"html\">&lt;div class=\"row\"&gt;\r\n  &lt;div class=\"box\"&gt;1&lt;/div&gt;\r\n  &lt;div class=\"box\"&gt;2&lt;/div&gt;\r\n&lt;/div&gt;</template>\r\n<template class=\"css\">.row { }\r\n.box { background: gold; padding: 12px; }</template>\r\n<template class=\"ts\">\r\nassert(getComputedStyle(document.querySelector('.row')).display === 'flex', 'set .row display to flex');\r\n</template>\r\n</div>\r\n\r\n<h4>2. justify-content — spacing along the row</h4>\r\n<p>On a flex container, <code>justify-content</code> controls how items sit along the main (horizontal) axis: <code>flex-start</code> (default, left), <code>center</code>, <code>flex-end</code> (right), <code>space-between</code> (push to the edges, gaps between), and <code>space-around</code>.</p>\r\n<div class=\"ex\" data-kind=\"web\"><span class=\"exq\"><b>Exercise 3.</b> Run, then try each value of <code>justify-content</code> and watch the three boxes shift.</span>\r\n<template class=\"html\">&lt;div class=\"row\"&gt;\r\n  &lt;div class=\"box\"&gt;A&lt;/div&gt;&lt;div class=\"box\"&gt;B&lt;/div&gt;&lt;div class=\"box\"&gt;C&lt;/div&gt;\r\n&lt;/div&gt;</template>\r\n<template class=\"css\">.row { display: flex; justify-content: center; background: #121C30; }\r\n.box { background: #F5B942; color: #0E1626; padding: 14px; margin: 4px; }</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"quiz\" data-a=\"1\"><span class=\"exq\"><b>Exercise 4.</b> Which property spreads items to the far edges with space between them?</span>\r\n<ol class=\"opts\">\r\n<li><code>align-items: center</code></li>\r\n<li><code>justify-content: space-between</code></li>\r\n<li><code>display: block</code></li>\r\n<li><code>gap: 10px</code></li>\r\n</ol></div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 5. ✍️ Your turn.</b> Centre the items. On <code>.row</code> (already flex), set <code>justify-content</code> to <code>center</code>.</span>\r\n<template class=\"html\">&lt;div class=\"row\"&gt;&lt;div class=\"box\"&gt;X&lt;/div&gt;&lt;div class=\"box\"&gt;Y&lt;/div&gt;&lt;/div&gt;</template>\r\n<template class=\"css\">.row { display: flex; }\r\n.box { background: teal; color: white; padding: 12px; margin: 3px; }</template>\r\n<template class=\"ts\">\r\nassert(getComputedStyle(document.querySelector('.row')).justifyContent === 'center', 'set justify-content to center');\r\n</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 6. ✍️ Your turn.</b> Push a logo and a menu apart. On <code>.bar</code> (flex), set <code>justify-content</code> to <code>space-between</code>.</span>\r\n<template class=\"html\">&lt;div class=\"bar\"&gt;&lt;span&gt;Logo&lt;/span&gt;&lt;span&gt;Menu&lt;/span&gt;&lt;/div&gt;</template>\r\n<template class=\"css\">.bar { display: flex; background: #121C30; color: #E8E4D8; padding: 10px; }</template>\r\n<template class=\"ts\">\r\nassert(getComputedStyle(document.querySelector('.bar')).justifyContent === 'space-between', 'set justify-content to space-between');\r\n</template>\r\n</div>\r\n\r\n<h4>3. align-items — the cross axis</h4>\r\n<p>While <code>justify-content</code> works along the row, <code>align-items</code> aligns items <i>across</i> it (vertically, when the row is horizontal): <code>flex-start</code> (top), <code>center</code>, <code>flex-end</code> (bottom), <code>stretch</code>. Setting <b>both</b> to <code>center</code> is the classic way to perfectly centre something.</p>\r\n<div class=\"ex\" data-kind=\"web\"><span class=\"exq\"><b>Exercise 7.</b> Run — the boxes sit centred in a tall row. Change <code>align-items</code> to <code>flex-start</code> and Run to see them jump to the top.</span>\r\n<template class=\"html\">&lt;div class=\"row\"&gt;&lt;div class=\"box\"&gt;A&lt;/div&gt;&lt;div class=\"box\"&gt;B&lt;/div&gt;&lt;/div&gt;</template>\r\n<template class=\"css\">.row { display: flex; align-items: center; height: 120px; background: #121C30; }\r\n.box { background: #E2604C; color: white; padding: 12px; margin: 4px; }</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 8. ✍️ Your turn.</b> Vertically centre the items. On <code>.row</code>, set <code>align-items</code> to <code>center</code>.</span>\r\n<template class=\"html\">&lt;div class=\"row\"&gt;&lt;div class=\"box\"&gt;Hi&lt;/div&gt;&lt;/div&gt;</template>\r\n<template class=\"css\">.row { display: flex; height: 100px; background: navy; }\r\n.box { background: gold; padding: 10px; }</template>\r\n<template class=\"ts\">\r\nassert(getComputedStyle(document.querySelector('.row')).alignItems === 'center', 'set align-items to center');\r\n</template>\r\n</div>\r\n\r\n<h4>4. gap and flex-direction</h4>\r\n<p><code>gap</code> adds even spacing <i>between</i> flex items — cleaner than margins. And <code>flex-direction: column</code> flips the main axis to vertical, so items stack (but with all the flex controls still available).</p>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 9. ✍️ Your turn.</b> Space the items evenly. On <code>.row</code>, add a <code>gap</code> of <code>16px</code>.</span>\r\n<template class=\"html\">&lt;div class=\"row\"&gt;&lt;div class=\"box\"&gt;1&lt;/div&gt;&lt;div class=\"box\"&gt;2&lt;/div&gt;&lt;div class=\"box\"&gt;3&lt;/div&gt;&lt;/div&gt;</template>\r\n<template class=\"css\">.row { display: flex; }\r\n.box { background: teal; color: white; padding: 12px; }</template>\r\n<template class=\"ts\">\r\nassert(getComputedStyle(document.querySelector('.row')).gap === '16px', 'add gap: 16px to .row');\r\n</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 10. ✍️ Your turn.</b> Stack the flex items vertically. On <code>.row</code>, set <code>flex-direction</code> to <code>column</code>.</span>\r\n<template class=\"html\">&lt;div class=\"row\"&gt;&lt;div class=\"box\"&gt;Top&lt;/div&gt;&lt;div class=\"box\"&gt;Bottom&lt;/div&gt;&lt;/div&gt;</template>\r\n<template class=\"css\">.row { display: flex; gap: 6px; }\r\n.box { background: #F5B942; color: #0E1626; padding: 10px; }</template>\r\n<template class=\"ts\">\r\nassert(getComputedStyle(document.querySelector('.row')).flexDirection === 'column', 'set flex-direction to column');\r\n</template>\r\n</div>\r\n\r\n<h4>5. Build real layouts</h4>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 11. ✍️ Your turn.</b> Perfectly centre a badge: on <code>.stage</code> (flex, tall), set <b>both</b> <code>justify-content</code> and <code>align-items</code> to <code>center</code>.</span>\r\n<template class=\"html\">&lt;div class=\"stage\"&gt;&lt;div class=\"badge\"&gt;★&lt;/div&gt;&lt;/div&gt;</template>\r\n<template class=\"css\">.stage { display: flex; height: 140px; background: #121C30; }\r\n.badge { background: gold; padding: 16px; }</template>\r\n<template class=\"ts\">\r\nvar s = getComputedStyle(document.querySelector('.stage'));\r\nassert(s.justifyContent === 'center', 'set justify-content to center');\r\nassert(s.alignItems === 'center', 'set align-items to center');\r\n</template>\r\n</div>\r\n<div class=\"ex stretch\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 12. 🔥 Stretch — ✍️ your turn.</b> Build a navbar: make <code>.nav</code> a flex row with <code>justify-content: space-between</code>, <code>align-items: center</code>, and a <code>gap</code> of <code>12px</code>.</span>\r\n<template class=\"html\">&lt;div class=\"nav\"&gt;&lt;span&gt;Dojo&lt;/span&gt;&lt;span&gt;Home&lt;/span&gt;&lt;span&gt;Login&lt;/span&gt;&lt;/div&gt;</template>\r\n<template class=\"css\">.nav {\r\n  background: #0E1626; color: #E8E4D8; padding: 12px;\r\n}</template>\r\n<template class=\"ts\">\r\nvar s = getComputedStyle(document.querySelector('.nav'));\r\nassert(s.display === 'flex', 'set display to flex');\r\nassert(s.justifyContent === 'space-between', 'set justify-content to space-between');\r\nassert(s.alignItems === 'center', 'set align-items to center');\r\nassert(s.gap === '12px', 'set gap to 12px');\r\n</template>\r\n</div>\r\n\r\n<h4>🏠 Homework</h4>\r\n<p>Four take-home exercises, auto-graded — all hands-on. The last one is a stretch.</p>\r\n<div class=\"ex homework\" data-kind=\"quiz\" data-a=\"2\"><span class=\"exq\"><b>Exercise 1.</b> To make an element's children lay out in a flex row, you set the element's <code>display</code> to…</span>\r\n<ol class=\"opts\">\r\n<li><code>block</code></li>\r\n<li><code>row</code></li>\r\n<li><code>flex</code></li>\r\n<li><code>grid</code></li>\r\n</ol></div>\r\n<div class=\"ex homework\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 2. ✍️</b> Make <code>.row</code> a flex container and set <code>justify-content</code> to <code>center</code>.</span>\r\n<template class=\"html\">&lt;div class=\"row\"&gt;&lt;div class=\"box\"&gt;A&lt;/div&gt;&lt;div class=\"box\"&gt;B&lt;/div&gt;&lt;/div&gt;</template>\r\n<template class=\"css\">.row { }\r\n.box { background: teal; color: white; padding: 10px; margin: 3px; }</template>\r\n<template class=\"ts\">\r\nvar s = getComputedStyle(document.querySelector('.row'));\r\nassert(s.display === 'flex', 'set display to flex');\r\nassert(s.justifyContent === 'center', 'set justify-content to center');\r\n</template>\r\n</div>\r\n<div class=\"ex homework\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 3. ✍️</b> Make <code>.list</code> a flex column with a <code>gap</code> of <code>8px</code>.</span>\r\n<template class=\"html\">&lt;div class=\"list\"&gt;&lt;div class=\"box\"&gt;1&lt;/div&gt;&lt;div class=\"box\"&gt;2&lt;/div&gt;&lt;/div&gt;</template>\r\n<template class=\"css\">.list { display: flex; }\r\n.box { background: gold; padding: 8px; }</template>\r\n<template class=\"ts\">\r\nvar s = getComputedStyle(document.querySelector('.list'));\r\nassert(s.flexDirection === 'column', 'set flex-direction to column');\r\nassert(s.gap === '8px', 'set gap to 8px');\r\n</template>\r\n</div>\r\n<div class=\"ex homework stretch\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 4. 🔥 Stretch — ✍️</b> Build a toolbar: <code>.bar</code> is flex, <code>justify-content: space-between</code>, <code>align-items: center</code>, <code>gap: 10px</code>.</span>\r\n<template class=\"html\">&lt;div class=\"bar\"&gt;&lt;span&gt;File&lt;/span&gt;&lt;span&gt;Edit&lt;/span&gt;&lt;span&gt;Help&lt;/span&gt;&lt;/div&gt;</template>\r\n<template class=\"css\">.bar { background: #121C30; color: #E8E4D8; padding: 10px; }</template>\r\n<template class=\"ts\">\r\nvar s = getComputedStyle(document.querySelector('.bar'));\r\nassert(s.display === 'flex', 'set display to flex');\r\nassert(s.justifyContent === 'space-between', 'set justify-content to space-between');\r\nassert(s.alignItems === 'center', 'set align-items to center');\r\nassert(s.gap === '10px', 'set gap to 10px');\r\n</template>\r\n</div>"}},{"t":{"vi":"Định vị & di chuyển phần tử","en":"CSS positioning & moving things"},"kind":"free","html":{"vi":"<h3>Bài 6 — Định vị &amp; di chuyển phần tử</h3>\r\n<p>Flexbox sắp xếp các hộp thành hàng và cột gọn gàng — nhưng đôi khi bạn cần đặt một thứ <i>chính xác</i>: một huy hiệu \"New!\" ghim vào góc thẻ, một phần đầu dính chặt trên đỉnh khi bạn cuộn, một chấm thông báo lơ lửng trên một biểu tượng. Đó là việc của thuộc tính <code>position</code>. Nó cho phép bạn nhấc một phần tử ra khỏi luồng bình thường và di chuyển nó chính xác bằng <code>top</code>, <code>right</code>, <code>bottom</code> và <code>left</code>.</p>\r\n<p>Mặc định mọi phần tử là <code>position: static</code> — nó nằm đúng chỗ luồng đặt nó, và các thuộc tính offset không có tác dụng gì. Phép màu bắt đầu khi bạn đổi điều đó. <code>relative</code> đẩy nhẹ một phần tử khỏi chỗ bình thường; <code>absolute</code> ghim nó vào một hộp chứa được chọn; <code>fixed</code> khóa nó vào màn hình; và <code>sticky</code> cho nó cuộn đến khi chạm một mép rồi giữ lại. Khi các hộp chồng lên nhau, <code>z-index</code> quyết định cái nào nằm trên.</p>\r\n<p>Các hiệu ứng này đều nói về <i>chuyển động</i>, nên bạn sẽ xem từng cái xảy ra trực tiếp. Đặt một thuộc tính, nhấn Chạy, và thấy hộp nhảy, ghim hoặc lơ lửng vào chỗ. Di chuyển vài thứ nào.</p>\r\n\r\n<h4>1. relative — đẩy nhẹ khỏi chỗ cũ</h4>\r\n<p><code>position: relative</code> giữ phần tử trong luồng nhưng cho phép bạn dịch nó bằng <code>top</code>/<code>left</code>/<code>right</code>/<code>bottom</code>. <code>top: 20px</code> đẩy nó <i>xuống</i> 20px so với chỗ nó thường nằm; <code>left: 20px</code> đẩy nó sang phải.</p>\r\n<div class=\"ex\" data-kind=\"web\"><span class=\"exq\"><b>Bài tập 1.</b> Chạy. Hộp giữa bị đẩy xuống và sang phải. Đổi <code>top</code> và <code>left</code> của nó rồi Chạy lại.</span>\r\n<template class=\"html\">&lt;span class=\"box\"&gt;A&lt;/span&gt;&lt;span class=\"box move\"&gt;B&lt;/span&gt;&lt;span class=\"box\"&gt;C&lt;/span&gt;</template>\r\n<template class=\"css\">.box { display: inline-block; background: #7FD1C0; color: #0E1626; padding: 10px; margin: 4px; }\r\n.move { position: relative; top: 20px; left: 20px; background: #F5B942; }</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"quiz\" data-a=\"0\"><span class=\"exq\"><b>Bài tập 2.</b> Giá trị <code>position</code> mặc định của mọi phần tử là gì?</span>\r\n<ol class=\"opts\">\r\n<li><code>static</code></li>\r\n<li><code>relative</code></li>\r\n<li><code>absolute</code></li>\r\n<li><code>fixed</code></li>\r\n</ol></div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 3. ✍️ Đến lượt bạn.</b> Đẩy hộp xuống. Đặt <code>position</code> của <code>.box</code> thành <code>relative</code> và <code>top</code> thành <code>20px</code>.</span>\r\n<template class=\"html\">&lt;div class=\"box\"&gt;Move me&lt;/div&gt;</template>\r\n<template class=\"css\">.box { background: gold; padding: 10px; }</template>\r\n<template class=\"ts\">\r\nvar s = getComputedStyle(document.querySelector('.box'));\r\nassert(s.position === 'relative', 'đặt position thành relative');\r\nassert(s.top === '20px', 'đặt top thành 20px');\r\n</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 4. ✍️ Đến lượt bạn.</b> Giờ trượt nó sang phải. Giữ <code>position: relative</code> và đặt <code>left</code> thành <code>30px</code>.</span>\r\n<template class=\"html\">&lt;div class=\"box\"&gt;Slide me&lt;/div&gt;</template>\r\n<template class=\"css\">.box { position: relative; background: teal; color: white; padding: 10px; }</template>\r\n<template class=\"ts\">\r\nvar s = getComputedStyle(document.querySelector('.box'));\r\nassert(s.position === 'relative', 'giữ position relative');\r\nassert(s.left === '30px', 'đặt left thành 30px');\r\n</template>\r\n</div>\r\n\r\n<h4>2. absolute — ghim vào một hộp chứa</h4>\r\n<p><code>position: absolute</code> đưa một phần tử <i>ra khỏi luồng</i> và ghim nó vào tổ tiên gần nhất có đặt position (thường là một cha <code>relative</code>). Đây là cách bạn thả một huy hiệu vào góc: cho thẻ <code>relative</code>, cho huy hiệu <code>absolute</code>, rồi đẩy nó bằng <code>top: 0; right: 0</code>.</p>\r\n<figure class=\"diagram\">\r\n<svg viewBox=\"0 0 380 160\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"IBM Plex Sans, sans-serif\" font-size=\"12\">\r\n  <rect x=\"40\" y=\"30\" width=\"300\" height=\"110\" fill=\"#121C30\" stroke=\"#7FD1C0\"/>\r\n  <text x=\"55\" y=\"90\" fill=\"#E8E4D8\">.card (position: relative)</text>\r\n  <rect x=\"280\" y=\"20\" width=\"60\" height=\"26\" fill=\"#E2604C\"/>\r\n  <text x=\"310\" y=\"37\" text-anchor=\"middle\" fill=\"#0E1626\" font-size=\"11\">badge</text>\r\n  <text x=\"228\" y=\"15\" fill=\"#F5B942\" font-size=\"11\">absolute; top:0; right:0</text>\r\n</svg>\r\n<figcaption>Một thẻ relative + một huy hiệu absolute ghim vào góc trên-phải.</figcaption>\r\n</figure>\r\n<div class=\"ex\" data-kind=\"web\"><span class=\"exq\"><b>Bài tập 5.</b> Chạy và xem huy hiệu ghim vào góc. Đổi <code>right: 0</code> thành <code>left: 0</code> rồi Chạy.</span>\r\n<template class=\"html\">&lt;div class=\"card\"&gt;Product&lt;span class=\"badge\"&gt;New&lt;/span&gt;&lt;/div&gt;</template>\r\n<template class=\"css\">.card { position: relative; height: 80px; background: #121C30; color: #E8E4D8; padding: 12px; }\r\n.badge { position: absolute; top: 0; right: 0; background: #E2604C; color: white; padding: 4px 8px; }</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 6. ✍️ Đến lượt bạn.</b> Ghim chấm vào góc trên-phải. Đặt <code>position</code> của <code>.dot</code> thành <code>absolute</code>, <code>top</code> thành <code>0</code>, và <code>right</code> thành <code>0</code>.</span>\r\n<template class=\"html\">&lt;div class=\"wrap\"&gt;Inbox&lt;span class=\"dot\"&gt;3&lt;/span&gt;&lt;/div&gt;</template>\r\n<template class=\"css\">.wrap { position: relative; height: 60px; background: navy; color: white; padding: 10px; }\r\n.dot { background: gold; padding: 2px 7px; }</template>\r\n<template class=\"ts\">\r\nvar s = getComputedStyle(document.querySelector('.dot'));\r\nassert(s.position === 'absolute', 'đặt position thành absolute');\r\nassert(s.top === '0px', 'đặt top thành 0');\r\nassert(s.right === '0px', 'đặt right thành 0');\r\n</template>\r\n</div>\r\n\r\n<h4>3. z-index — ai nằm trên</h4>\r\n<p>Khi các hộp đã định vị chồng lên nhau, cái có <code>z-index</code> cao hơn thắng và hiện ra phía trước. Nó chỉ có tác dụng trên phần tử có <code>position</code> khác <code>static</code>.</p>\r\n<div class=\"ex\" data-kind=\"web\"><span class=\"exq\"><b>Bài tập 7.</b> Chạy — hộp gold che hộp teal. Nâng <code>z-index</code> của hộp teal lên trên <code>2</code> rồi Chạy để đảo cái nào nằm trên.</span>\r\n<template class=\"html\">&lt;div class=\"a\"&gt;teal&lt;/div&gt;&lt;div class=\"b\"&gt;gold&lt;/div&gt;</template>\r\n<template class=\"css\">.a, .b { position: absolute; width: 90px; height: 90px; padding: 8px; }\r\n.a { background: teal; color: white; top: 20px; left: 20px; z-index: 1; }\r\n.b { background: gold; top: 50px; left: 50px; z-index: 2; }</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 8. ✍️ Đến lượt bạn.</b> Đưa hộp trước ra phía trước. Đặt <code>z-index</code> của <code>.front</code> thành <code>10</code>.</span>\r\n<template class=\"html\">&lt;div class=\"back\"&gt;back&lt;/div&gt;&lt;div class=\"front\"&gt;front&lt;/div&gt;</template>\r\n<template class=\"css\">.back, .front { position: absolute; width: 80px; height: 80px; padding: 6px; }\r\n.back { background: #E2604C; top: 10px; left: 10px; z-index: 5; }\r\n.front { background: gold; top: 30px; left: 30px; }</template>\r\n<template class=\"ts\">\r\nassert(getComputedStyle(document.querySelector('.front')).zIndex === '10', 'đặt z-index của .front thành 10');\r\n</template>\r\n</div>\r\n\r\n<h4>4. fixed &amp; sticky — luôn trong tầm nhìn</h4>\r\n<p><code>position: fixed</code> ghim một phần tử vào <b>màn hình</b> — nó ở yên ngay cả khi trang cuộn (nghĩ đến thanh nav trên đỉnh luôn hiện). <code>position: sticky</code> là lai: phần tử cuộn bình thường đến khi chạm một offset cho trước (như <code>top: 0</code>), rồi \"dính\" tại đó.</p>\r\n<div class=\"ex\" data-kind=\"web\"><span class=\"exq\"><b>Bài tập 9.</b> Chạy và thấy một biểu ngữ fixed nằm trên đỉnh ô xem trước.</span>\r\n<template class=\"html\">&lt;div class=\"banner\"&gt;Always here&lt;/div&gt;\r\n&lt;p style=\"margin-top:50px\"&gt;Page content…&lt;/p&gt;</template>\r\n<template class=\"css\">.banner { position: fixed; top: 0; left: 0; right: 0; background: #F5B942; color: #0E1626; padding: 10px; }</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 10. ✍️ Đến lượt bạn.</b> Khóa phần đầu vào màn hình. Đặt <code>position</code> của <code>.header</code> thành <code>fixed</code> và <code>top</code> thành <code>0</code>.</span>\r\n<template class=\"html\">&lt;div class=\"header\"&gt;My Site&lt;/div&gt;</template>\r\n<template class=\"css\">.header { background: #121C30; color: #E8E4D8; padding: 12px; }</template>\r\n<template class=\"ts\">\r\nvar s = getComputedStyle(document.querySelector('.header'));\r\nassert(s.position === 'fixed', 'đặt position thành fixed');\r\nassert(s.top === '0px', 'đặt top thành 0');\r\n</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 11. ✍️ Đến lượt bạn.</b> Làm một thanh sticky. Đặt <code>position</code> của <code>.bar</code> thành <code>sticky</code> và <code>top</code> thành <code>0</code>.</span>\r\n<template class=\"html\">&lt;div class=\"bar\"&gt;Sticky menu&lt;/div&gt;</template>\r\n<template class=\"css\">.bar { background: teal; color: white; padding: 10px; }</template>\r\n<template class=\"ts\">\r\nvar s = getComputedStyle(document.querySelector('.bar'));\r\nassert(s.position === 'sticky', 'đặt position thành sticky');\r\nassert(s.top === '0px', 'đặt top thành 0');\r\n</template>\r\n</div>\r\n\r\n<h4>5. Ghép lại</h4>\r\n<div class=\"ex stretch\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 12. 🔥 Nâng cao — ✍️ đến lượt bạn.</b> Ghim một huy hiệu \"Sale\" vào góc thẻ và nâng nó lên trên nội dung khác. Cho <code>.card</code> <code>position: relative</code>. Cho <code>.tag</code> <code>position: absolute</code> với <code>top: 8px</code>, <code>right: 8px</code>, và <code>z-index: 2</code>.</span>\r\n<template class=\"html\">&lt;div class=\"card\"&gt;&lt;h3&gt;Shoes&lt;/h3&gt;&lt;span class=\"tag\"&gt;Sale&lt;/span&gt;&lt;/div&gt;</template>\r\n<template class=\"css\">.card { height: 90px; background: #121C30; color: #E8E4D8; padding: 12px; }\r\n.tag { background: gold; padding: 3px 8px; }</template>\r\n<template class=\"ts\">\r\nassert(getComputedStyle(document.querySelector('.card')).position === 'relative', 'đặt position của .card thành relative');\r\nvar s = getComputedStyle(document.querySelector('.tag'));\r\nassert(s.position === 'absolute', 'đặt position của .tag thành absolute');\r\nassert(s.top === '8px', 'đặt top của .tag thành 8px');\r\nassert(s.right === '8px', 'đặt right của .tag thành 8px');\r\nassert(s.zIndex === '2', 'đặt z-index của .tag thành 2');\r\n</template>\r\n</div>\r\n\r\n<h4>🏠 Bài tập về nhà</h4>\r\n<p>Bốn bài mang về nhà, chấm tự động — tất cả đều thực hành. Bài cuối là bài nâng cao.</p>\r\n<div class=\"ex homework\" data-kind=\"quiz\" data-a=\"2\"><span class=\"exq\"><b>Bài tập 1.</b> Một phần tử <code>absolute</code> được định vị so với…</span>\r\n<ol class=\"opts\">\r\n<li>toàn màn hình, luôn luôn</li>\r\n<li>chỗ ban đầu của chính nó</li>\r\n<li>tổ tiên đã định vị gần nhất</li>\r\n<li>đoạn văn đầu tiên trên trang</li>\r\n</ol></div>\r\n<div class=\"ex homework\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 2. ✍️</b> Đặt <code>.box</code> thành <code>position: relative</code> với <code>top: 15px</code> và <code>left: 15px</code>.</span>\r\n<template class=\"html\">&lt;div class=\"box\"&gt;Nudge&lt;/div&gt;</template>\r\n<template class=\"css\">.box { background: gold; padding: 10px; }</template>\r\n<template class=\"ts\">\r\nvar s = getComputedStyle(document.querySelector('.box'));\r\nassert(s.position === 'relative', 'đặt position thành relative');\r\nassert(s.top === '15px', 'đặt top thành 15px');\r\nassert(s.left === '15px', 'đặt left thành 15px');\r\n</template>\r\n</div>\r\n<div class=\"ex homework\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 3. ✍️</b> Ghim <code>.badge</code> vào góc dưới-trái của thẻ: <code>position: absolute</code>, <code>bottom: 0</code>, <code>left: 0</code>.</span>\r\n<template class=\"html\">&lt;div class=\"card\"&gt;Item&lt
