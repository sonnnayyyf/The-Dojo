meta charset=\"utf-8\"&gt;&lt;title&gt;City Library&lt;/title&gt;\r\n&lt;style&gt;\r\n  body { font-family: sans-serif; margin: 0; color: #E8E4D8; background: #0E1626; }\r\n  header { background: #121C30; padding: 18px; }\r\n  header h1 { margin: 0; color: #F5B942; }\r\n  nav { display: flex; gap: 16px; background: #1a2740; padding: 12px 18px; }\r\n  nav a { color: #7FD1C0; text-decoration: none; }\r\n  main { padding: 18px; }\r\n  .catalog { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-top: 12px; }\r\n  .book { background: #121C30; padding: 18px; border-radius: 8px; transition: all 0.25s; }\r\n  .book:hover { transform: translateY(-4px); }\r\n  footer { padding: 14px 18px; color: #8FA0BC; }\r\n&lt;/style&gt;&lt;/head&gt;\r\n&lt;body&gt;\r\n  &lt;header&gt;&lt;h1&gt;City Library&lt;/h1&gt;&lt;/header&gt;\r\n  &lt;nav&gt;&lt;a href=\"index.html\"&gt;Home&lt;/a&gt;&lt;a href=\"books.html\"&gt;Books&lt;/a&gt;&lt;a href=\"about.html\"&gt;About&lt;/a&gt;&lt;/nav&gt;\r\n  &lt;main&gt;\r\n    &lt;h2&gt;Welcome&lt;/h2&gt;&lt;p&gt;Borrow books for free.&lt;/p&gt;\r\n    &lt;div class=\"catalog\"&gt;\r\n      &lt;div class=\"book\"&gt;&lt;h3&gt;Dune&lt;/h3&gt;&lt;p&gt;Frank Herbert&lt;/p&gt;&lt;/div&gt;\r\n      &lt;div class=\"book\"&gt;&lt;h3&gt;1984&lt;/h3&gt;&lt;p&gt;George Orwell&lt;/p&gt;&lt;/div&gt;\r\n      &lt;div class=\"book\"&gt;&lt;h3&gt;Emma&lt;/h3&gt;&lt;p&gt;Jane Austen&lt;/p&gt;&lt;/div&gt;\r\n    &lt;/div&gt;\r\n  &lt;/main&gt;\r\n  &lt;footer&gt;© 2026 City Library&lt;/footer&gt;\r\n&lt;/body&gt;\r\n&lt;/html&gt;</template>\r\n</div>\r\n<h4>8. Các trang con, có kiểu</h4>\r\n<p>Cùng một stylesheet dùng chung làm các trang khác đồng bộ. Đây là trang danh mục <b>Books</b> và trang <b>About</b> — chạy từng cái để thấy diện mạo nhiều trang hoàn chỉnh.</p>\r\n<div class=\"ex\" data-kind=\"web\"><span class=\"exq\"><b>Bài tập 12.</b> Chạy trang danh mục <b>Books</b> có kiểu.</span>\r\n<template class=\"st\">&lt;!doctype html&gt;\r\n&lt;html&gt;\r\n&lt;head&gt;&lt;meta charset=\"utf-8\"&gt;&lt;title&gt;Books — City Library&lt;/title&gt;\r\n&lt;style&gt;\r\n  body { font-family: sans-serif; margin: 0; color: #E8E4D8; background: #0E1626; }\r\n  header { background: #121C30; padding: 18px; }\r\n  header h1 { margin: 0; color: #F5B942; }\r\n  nav { display: flex; gap: 16px; background: #1a2740; padding: 12px 18px; }\r\n  nav a { color: #7FD1C0; text-decoration: none; }\r\n  main { padding: 18px; }\r\n  .catalog { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-top: 12px; }\r\n  .book { background: #121C30; padding: 16px; border-radius: 8px; border: 1px solid #22304C; }\r\n  .book h3 { margin: 0 0 6px; color: #7FD1C0; }\r\n  .book p { margin: 0; color: #8FA0BC; }\r\n  footer { padding: 14px 18px; color: #8FA0BC; }\r\n&lt;/style&gt;&lt;/head&gt;\r\n&lt;body&gt;\r\n  &lt;header&gt;&lt;h1&gt;City Library&lt;/h1&gt;&lt;/header&gt;\r\n  &lt;nav&gt;&lt;a href=\"index.html\"&gt;Home&lt;/a&gt;&lt;a href=\"books.html\"&gt;Books&lt;/a&gt;&lt;a href=\"about.html\"&gt;About&lt;/a&gt;&lt;/nav&gt;\r\n  &lt;main&gt;\r\n    &lt;h2&gt;Our books&lt;/h2&gt;\r\n    &lt;div class=\"catalog\"&gt;\r\n      &lt;div class=\"book\"&gt;&lt;h3&gt;Dune&lt;/h3&gt;&lt;p&gt;Frank Herbert&lt;/p&gt;&lt;/div&gt;\r\n      &lt;div class=\"book\"&gt;&lt;h3&gt;1984&lt;/h3&gt;&lt;p&gt;George Orwell&lt;/p&gt;&lt;/div&gt;\r\n      &lt;div class=\"book\"&gt;&lt;h3&gt;Emma&lt;/h3&gt;&lt;p&gt;Jane Austen&lt;/p&gt;&lt;/div&gt;\r\n      &lt;div class=\"book\"&gt;&lt;h3&gt;Hamlet&lt;/h3&gt;&lt;p&gt;W. Shakespeare&lt;/p&gt;&lt;/div&gt;\r\n      &lt;div class=\"book\"&gt;&lt;h3&gt;The Hobbit&lt;/h3&gt;&lt;p&gt;J.R.R. Tolkien&lt;/p&gt;&lt;/div&gt;\r\n      &lt;div class=\"book\"&gt;&lt;h3&gt;Meditations&lt;/h3&gt;&lt;p&gt;Marcus Aurelius&lt;/p&gt;&lt;/div&gt;\r\n    &lt;/div&gt;\r\n  &lt;/main&gt;\r\n  &lt;footer&gt;© 2026 City Library&lt;/footer&gt;\r\n&lt;/body&gt;\r\n&lt;/html&gt;</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"web\"><span class=\"exq\"><b>Bài tập 13.</b> Chạy trang <b>About</b> có kiểu.</span>\r\n<template class=\"st\">&lt;!doctype html&gt;\r\n&lt;html&gt;\r\n&lt;head&gt;&lt;meta charset=\"utf-8\"&gt;&lt;title&gt;About — City Library&lt;/title&gt;\r\n&lt;style&gt;\r\n  body { font-family: sans-serif; margin: 0; color: #E8E4D8; background: #0E1626; }\r\n  header { background: #121C30; padding: 18px; }\r\n  header h1 { margin: 0; color: #F5B942; }\r\n  nav { display: flex; gap: 16px; background: #1a2740; padding: 12px 18px; }\r\n  nav a { color: #7FD1C0; text-decoration: none; }\r\n  main { padding: 18px; max-width: 520px; line-height: 1.6; }\r\n  main h2 { color: #7FD1C0; }\r\n  .hours { background: #121C30; border-left: 3px solid #F5B942; padding: 10px 14px; margin-top: 12px; }\r\n  footer { padding: 14px 18px; color: #8FA0BC; }\r\n&lt;/style&gt;&lt;/head&gt;\r\n&lt;body&gt;\r\n  &lt;header&gt;&lt;h1&gt;City Library&lt;/h1&gt;&lt;/header&gt;\r\n  &lt;nav&gt;&lt;a href=\"index.html\"&gt;Home&lt;/a&gt;&lt;a href=\"books.html\"&gt;Books&lt;/a&gt;&lt;a href=\"about.html\"&gt;About&lt;/a&gt;&lt;/nav&gt;\r\n  &lt;main&gt;\r\n    &lt;h2&gt;About us&lt;/h2&gt;\r\n    &lt;p&gt;City Library opened in 1998. We lend over 40,000 books for free to everyone in the city.&lt;/p&gt;\r\n    &lt;div class=\"hours\"&gt;&lt;strong&gt;Opening hours:&lt;/strong&gt; Mon–Sat, 9am–8pm.&lt;/div&gt;\r\n  &lt;/main&gt;\r\n  &lt;footer&gt;© 2026 City Library&lt;/footer&gt;\r\n&lt;/body&gt;\r\n&lt;/html&gt;</template>\r\n</div>\r\n\r\n<h4>9. Tự dựng trang chủ của bạn</h4>\r\n<div class=\"ex stretch\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 14. 🔥 Nâng cao — ✍️ đến lượt bạn.</b> Tự ghép trang chủ của bạn. Dựng: một <code>&lt;header&gt;</code> với một <code>&lt;h1&gt;</code> ghi <code>City Library</code>; một <code>&lt;nav&gt;</code> với liên kết tới <code>index.html</code> và <code>books.html</code>; một <code>&lt;main&gt;</code> với một <code>&lt;h2&gt;</code> ghi <code>Welcome</code>; và một <code>&lt;footer&gt;</code>. Rồi trong <b>CSS</b> làm <code>nav</code> thành một hàng flex với <code>gap</code> <code>16px</code>.</span>\r\n<template class=\"html\">\r\n</template>\r\n<template class=\"css\">\r\n</template>\r\n<template class=\"ts\">\r\nassert(document.querySelector('header h1') && document.querySelector('header h1').textContent.trim() === 'City Library', 'thêm một header với h1 \"City Library\"');\r\nassert(document.querySelector('nav a[href=\"index.html\"]') && document.querySelector('nav a[href=\"books.html\"]'), 'thêm một nav với liên kết tới index.html và books.html');\r\nassert(document.querySelector('main h2') && document.querySelector('main h2').textContent.trim() === 'Welcome', 'thêm một main với h2 \"Welcome\"');\r\nassert(document.querySelector('footer'), 'thêm một footer');\r\nvar s = getComputedStyle(document.querySelector('nav'));\r\nassert(s.display === 'flex', 'làm nav thành một hàng flex');\r\nassert(s.gap === '16px', 'cho nav một gap là 16px');\r\n</template>\r\n</div>\r\n\r\n<h4>🏠 Bài tập về nhà</h4>\r\n<p>Bốn bài mang về nhà, chấm tự động — dựng nốt phần còn lại của site. Bài cuối là bài nâng cao.</p>\r\n<div class=\"ex homework\" data-kind=\"quiz\" data-a=\"1\"><span class=\"exq\"><b>Bài tập 1.</b> Trên một site đã triển khai, bấm <code>&lt;a href=\"books.html\"&gt;Books&lt;/a&gt;</code> đưa người dùng tới…</span>\r\n<ol class=\"opts\">\r\n<li>một website bên ngoài tên là books</li>\r\n<li>trang books.html trong cùng thư mục</li>\r\n<li>không đâu cả — liên kết cần JavaScript</li>\r\n<li>phần head của trang hiện tại</li>\r\n</ol></div>\r\n<div class=\"ex homework\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 2. ✍️</b> Dựng form của trang Contact: một <code>&lt;form&gt;</code> chứa một <code>&lt;input&gt;</code> có <code>type</code> <code>email</code> và một <code>&lt;button&gt;</code> ghi <code>Send</code>.</span>\r\n<template class=\"st\">&lt;h1&gt;Contact&lt;/h1&gt;\r\n&lt;form&gt;\r\n\r\n&lt;/form&gt;</template>\r\n<template class=\"ts\">\r\nvar inp = document.querySelector('form input');\r\nvar btn = document.querySelector('form button');\r\nassert(inp && inp.getAttribute('type') === 'email', 'thêm một input email vào form');\r\nassert(btn && btn.textContent.trim() === 'Send', 'thêm một button ghi \"Send\"');\r\n</template>\r\n</div>\r\n<div class=\"ex homework\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 3. ✍️</b> Thêm liên kết Contact vào nav. Trong <code>&lt;nav&gt;</code>, thêm bốn liên kết: Home (<code>index.html</code>), Books (<code>books.html</code>), About (<code>about.html</code>), Contact (<code>contact.html</code>).</span>\r\n<template class=\"st\">&lt;nav&gt;\r\n\r\n&lt;/nav&gt;</template>\r\n<template class=\"ts\">\r\nassert(document.querySelectorAll('nav a').length === 4, 'nav phải có bốn liên kết');\r\nassert(document.querySelector('nav a[href=\"contact.html\"]'), 'thêm liên kết Contact tới contact.html');\r\nassert(document.querySelector('nav a[href=\"index.html\"]') && document.querySelector('nav a[href=\"books.html\"]') && document.querySelector('nav a[href=\"about.html\"]'), 'giữ lại các liên kết Home, Books và About');\r\n</template>\r\n</div>\r\n<div class=\"ex homework stretch\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 4. 🔥 Nâng cao — ✍️</b> Làm một thẻ sách chỉn chu. Dựng một <code>&lt;div class=\"book\"&gt;</code> với một <code>&lt;h3&gt;</code> ghi <code>Dune</code>. Trong <b>CSS</b> cho <code>.book</code> một <code>padding</code> là <code>16px</code>, một <code>border</code> là <code>1px solid teal</code>, và một <code>transition</code> là <code>all 0.3s</code>.</span>\r\n<template class=\"html\">\r\n</template>\r\n<template class=\"css\">\r\n</template>\r\n<template class=\"ts\">\r\nvar book = document.querySelector('.book');\r\nassert(book, 'thêm một <div class=\"book\">');\r\nassert(book.querySelector('h3') && book.querySelector('h3').textContent.trim() === 'Dune', 'thẻ cần một h3 ghi \"Dune\"');\r\nvar s = getComputedStyle(book);\r\nassert(s.paddingTop === '16px', 'đặt padding thành 16px');\r\nassert(s.borderTopWidth === '1px' && s.borderTopStyle === 'solid', 'thêm viền 1px solid');\r\nassert(s.transitionDuration === '0.3s', 'đặt transition thành all 0.3s');\r\n</template>\r\n</div>","en":"<h3>Lesson 9 — Mini project: a static library site</h3>\r\n<p>Time to put it all together. Over the last eight lessons you learned to structure pages with HTML, style them with CSS, lay them out with flexbox and grid, and add motion. Now you'll build a real, multi-page website: the <b>City Library</b> — a home page plus subpages for <i>Books</i>, <i>About</i> and <i>Contact</i>, tied together with a navigation bar. This is exactly how small real sites are built.</p>\r\n<p>First you'll meet two things every real page needs but our snippets skipped: the full <b>HTML document skeleton</b> (the <code>&lt;!doctype&gt;</code>, <code>&lt;head&gt;</code> and <code>&lt;body&gt;</code> wrapper, with a <code>&lt;title&gt;</code> and a linked stylesheet), and <b>links between pages</b> — the relative URLs like <code>books.html</code> that turn separate files into one connected site. You'll also use <code>&lt;div&gt;</code> and <code>&lt;span&gt;</code>, the generic containers you group and style with classes.</p>\r\n<p>Then you'll build the site piece by piece — a nav bar, a header, a book grid, subpages — each graded as you go, finishing with a full styled home page. Let's ship a website.</p>\r\n\r\n<h4>1. The full document skeleton</h4>\r\n<p>Every real HTML file starts with a fixed skeleton. <code>&lt;!doctype html&gt;</code> tells the browser this is modern HTML. Inside <code>&lt;html&gt;</code> there are two parts: the <code>&lt;head&gt;</code> holds information <i>about</i> the page — the character set, the <code>&lt;title&gt;</code> (shown in the browser tab), and links to CSS files — while the <code>&lt;body&gt;</code> holds everything you actually see.</p>\r\n<div class=\"ex\" data-kind=\"web\"><span class=\"exq\"><b>Exercise 1.</b> Run this complete document. The visible content comes from the <code>&lt;body&gt;</code>; the <code>&lt;title&gt;</code> in the <code>&lt;head&gt;</code> would show on the browser tab.</span>\r\n<template class=\"st\">&lt;!doctype html&gt;\r\n&lt;html&gt;\r\n  &lt;head&gt;\r\n    &lt;meta charset=\"utf-8\"&gt;\r\n    &lt;title&gt;City Library&lt;/title&gt;\r\n    &lt;style&gt; body { font-family: sans-serif; padding: 16px; } &lt;/style&gt;\r\n  &lt;/head&gt;\r\n  &lt;body&gt;\r\n    &lt;h1&gt;City Library&lt;/h1&gt;\r\n    &lt;p&gt;Everything visible lives in the body.&lt;/p&gt;\r\n  &lt;/body&gt;\r\n&lt;/html&gt;</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"quiz\" data-a=\"1\"><span class=\"exq\"><b>Exercise 2.</b> Which part of the document holds the <code>&lt;title&gt;</code> and links to stylesheets?</span>\r\n<ol class=\"opts\">\r\n<li><code>&lt;body&gt;</code></li>\r\n<li><code>&lt;head&gt;</code></li>\r\n<li><code>&lt;footer&gt;</code></li>\r\n<li><code>&lt;main&gt;</code></li>\r\n</ol></div>\r\n<p>On a real site each page (<code>index.html</code>, <code>books.html</code>…) is its own file linking to a shared <code>style.css</code> via <code>&lt;link rel=\"stylesheet\" href=\"style.css\"&gt;</code> in the head. In these exercises the CSS box <i>is</i> that shared stylesheet.</p>\r\n\r\n<h4>2. Linking pages together</h4>\r\n<p>A multi-page site is just several HTML files that link to each other. A link to another page in the same folder uses a <b>relative URL</b> — just the file name: <code>&lt;a href=\"books.html\"&gt;Books&lt;/a&gt;</code>. Put these links in a <code>&lt;nav&gt;</code> and every page can reach every other. (In the sandbox the links won't navigate, but on a deployed site they jump between pages.)</p>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 3. ✍️ Your turn.</b> Build the site navigation. Inside the <code>&lt;nav&gt;</code>, add three links: <code>Home</code> → <code>index.html</code>, <code>Books</code> → <code>books.html</code>, <code>About</code> → <code>about.html</code>.</span>\r\n<template class=\"st\">&lt;nav&gt;\r\n\r\n&lt;/nav&gt;</template>\r\n<template class=\"ts\">\r\nvar links = document.querySelectorAll('nav a');\r\nassert(links.length === 3, 'the nav should contain exactly three links');\r\nassert(document.querySelector('nav a[href=\"index.html\"]'), 'add a Home link to index.html');\r\nassert(document.querySelector('nav a[href=\"books.html\"]'), 'add a Books link to books.html');\r\nassert(document.querySelector('nav a[href=\"about.html\"]'), 'add an About link to about.html');\r\nassert(links[0].textContent.trim() === 'Home' && links[1].textContent.trim() === 'Books' && links[2].textContent.trim() === 'About', 'the link texts should be Home, Books, About');\r\n</template>\r\n</div>\r\n\r\n<h4>3. Build the home page, part by part</h4>\r\n<p>A page is regions stacked in order: a <code>&lt;header&gt;</code>, a <code>&lt;nav&gt;</code>, a <code>&lt;main&gt;</code>, a <code>&lt;footer&gt;</code>. Let's build each.</p>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 4. ✍️ Your turn.</b> Make the header. Add a <code>&lt;header&gt;</code> containing an <code>&lt;h1&gt;</code> that reads <code>City Library</code>.</span>\r\n<template class=\"st\">\r\n</template>\r\n<template class=\"ts\">\r\nvar h1 = document.querySelector('header h1');\r\nassert(h1, 'add a header with an h1 inside');\r\nassert(h1.textContent.trim() === 'City Library', 'the h1 should read \"City Library\"');\r\n</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 5. ✍️ Your turn.</b> Add the welcome section. Add a <code>&lt;main&gt;</code> containing an <code>&lt;h2&gt;</code> reading <code>Welcome</code> and a <code>&lt;p&gt;</code> reading <code>Borrow books for free.</code></span>\r\n<template class=\"st\">\r\n</template>\r\n<template class=\"ts\">\r\nvar h2 = document.querySelector('main h2');\r\nvar p = document.querySelector('main p');\r\nassert(h2 && h2.textContent.trim() === 'Welcome', 'main should contain an h2 reading \"Welcome\"');\r\nassert(p && p.textContent.trim() === 'Borrow books for free.', 'main should contain a p reading \"Borrow books for free.\"');\r\n</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 6. ✍️ Your turn.</b> Add the footer. Add a <code>&lt;footer&gt;</code> reading <code>© 2026 City Library</code>.</span>\r\n<template class=\"st\">\r\n</template>\r\n<template class=\"ts\">\r\nvar f = document.querySelector('footer');\r\nassert(f && f.textContent.trim() === '© 2026 City Library', 'add a footer reading \"© 2026 City Library\"');\r\n</template>\r\n</div>\r\n\r\n<h4>4. Style the navigation</h4>\r\n<p>Now make the nav look like a real menu: a horizontal bar with spaced-out links. Flexbox from Lesson 5 does it.</p>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 7. ✍️ Your turn.</b> In the <b>CSS</b>, turn <code>.menu</code> into a flex row with a <code>gap</code> of <code>16px</code>.</span>\r\n<template class=\"html\">&lt;nav class=\"menu\"&gt;\r\n  &lt;a href=\"index.html\"&gt;Home&lt;/a&gt;\r\n  &lt;a href=\"books.html\"&gt;Books&lt;/a&gt;\r\n  &lt;a href=\"about.html\"&gt;About&lt;/a&gt;\r\n&lt;/nav&gt;</template>\r\n<template class=\"css\">.menu { background: #121C30; padding: 12px; }\r\n.menu a { color: #7FD1C0; text-decoration: none; }</template>\r\n<template class=\"ts\">\r\nvar s = getComputedStyle(document.querySelector('.menu'));\r\nassert(s.display === 'flex', 'set .menu display to flex');\r\nassert(s.gap === '16px', 'set the gap to 16px');\r\n</template>\r\n</div>\r\n\r\n<h4>5. The Books subpage — a grid of books</h4>\r\n<p>The Books page shows the catalogue as a grid of cards. Each card is a <code>&lt;div class=\"book\"&gt;</code> with a title and author.</p>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 8. ✍️ Your turn.</b> Make one book card. Create a <code>&lt;div class=\"book\"&gt;</code> containing an <code>&lt;h3&gt;</code> reading <code>Dune</code> and a <code>&lt;p&gt;</code> reading <code>Frank Herbert</code>.</span>\r\n<template class=\"st\">\r\n</template>\r\n<template class=\"ts\">\r\nvar book = document.querySelector('.book');\r\nassert(book, 'add a <div class=\"book\">');\r\nvar h3 = book.querySelector('h3');\r\nvar p = book.querySelector('p');\r\nassert(h3 && h3.textContent.trim() === 'Dune', 'the book should have an h3 reading \"Dune\"');\r\nassert(p && p.textContent.trim() === 'Frank Herbert', 'the book should have a p reading \"Frank Herbert\"');\r\n</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 9. ✍️ Your turn.</b> Lay the catalogue out. In the <b>CSS</b>, make <code>.catalog</code> a grid with <b>three</b> columns (<code>1fr 1fr 1fr</code>) and a <code>gap</code> of <code>12px</code>.</span>\r\n<template class=\"html\">&lt;div class=\"catalog\"&gt;\r\n  &lt;div class=\"book\"&gt;Dune&lt;/div&gt;&lt;div class=\"book\"&gt;1984&lt;/div&gt;&lt;div class=\"book\"&gt;Emma&lt;/div&gt;\r\n&lt;/div&gt;</template>\r\n<template class=\"css\">.catalog { }\r\n.book { background: #121C30; color: #E8E4D8; padding: 18px; text-align: center; }</template>\r\n<template class=\"ts\">\r\nvar s = getComputedStyle(document.querySelector('.catalog'));\r\nassert(s.display === 'grid', 'set display to grid');\r\nassert(s.gridTemplateColumns.split(/\\s+/).filter(Boolean).length === 3, 'use three columns');\r\nassert(s.rowGap === '12px', 'set the gap to 12px');\r\n</template>\r\n</div>\r\n\r\n<h4>6. The About subpage</h4>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 10. ✍️ Your turn.</b> Build the About page content: a <code>&lt;header&gt;</code> with an <code>&lt;h1&gt;</code> reading <code>About us</code>, and a <code>&lt;main&gt;</code> with a <code>&lt;p&gt;</code> reading <code>We opened in 1998.</code></span>\r\n<template class=\"st\">\r\n</template>\r\n<template class=\"ts\">\r\nvar h1 = document.querySelector('header h1');\r\nvar p = document.querySelector('main p');\r\nassert(h1 && h1.textContent.trim() === 'About us', 'add a header with an h1 reading \"About us\"');\r\nassert(p && p.textContent.trim() === 'We opened in 1998.', 'add a main with a p reading \"We opened in 1998.\"');\r\n</template>\r\n</div>\r\n\r\n<h4>7. The finished home page</h4>\r\n<div class=\"ex\" data-kind=\"web\"><span class=\"exq\"><b>Exercise 11.</b> Run this styled home page to see the goal — everything you've learned, working together.</span>\r\n<template class=\"st\">&lt;!doctype html&gt;\r\n&lt;html&gt;\r\n&lt;head&gt;&lt;meta charset=\"utf-8\"&gt;&lt;title&gt;City Library&lt;/title&gt;\r\n&lt;style&gt;\r\n  body { font-family: sans-serif; margin: 0; color: #E8E4D8; background: #0E1626; }\r\n  header { background: #121C30; padding: 18px; }\r\n  header h1 { margin: 0; color: #F5B942; }\r\n  nav { display: flex; gap: 16px; background: #1a2740; padding: 12px 18px; }\r\n  nav a { color: #7FD1C0; text-decoration: none; }\r\n  main { padding: 18px; }\r\n  .catalog { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-top: 12px; }\r\n  .book { background: #121C30; padding: 18px; border-radius: 8px; transition: all 0.25s; }\r\n  .book:hover { transform: translateY(-4px); }\r\n  footer { padding: 14px 18px; color: #8FA0BC; }\r\n&lt;/style&gt;&lt;/head&gt;\r\n&lt;body&gt;\r\n  &lt;header&gt;&lt;h1&gt;City Library&lt;/h1&gt;&lt;/header&gt;\r\n  &lt;nav&gt;&lt;a href=\"index.html\"&gt;Home&lt;/a&gt;&lt;a href=\"books.html\"&gt;Books&lt;/a&gt;&lt;a href=\"about.html\"&gt;About&lt;/a&gt;&lt;/nav&gt;\r\n  &lt;main&gt;\r\n    &lt;h2&gt;Welcome&lt;/h2&gt;&lt;p&gt;Borrow books for free.&lt;/p&gt;\r\n    &lt;div class=\"catalog\"&gt;\r\n      &lt;div class=\"book\"&gt;&lt;h3&gt;Dune&lt;/h3&gt;&lt;p&gt;Frank Herbert&lt;/p&gt;&lt;/div&gt;\r\n      &lt;div class=\"book\"&gt;&lt;h3&gt;1984&lt;/h3&gt;&lt;p&gt;George Orwell&lt;/p&gt;&lt;/div&gt;\r\n      &lt;div class=\"book\"&gt;&lt;h3&gt;Emma&lt;/h3&gt;&lt;p&gt;Jane Austen&lt;/p&gt;&lt;/div&gt;\r\n    &lt;/div&gt;\r\n  &lt;/main&gt;\r\n  &lt;footer&gt;© 2026 City Library&lt;/footer&gt;\r\n&lt;/body&gt;\r\n&lt;/html&gt;</template>\r\n</div>\r\n<h4>8. The subpages, styled</h4>\r\n<p>The same shared stylesheet makes the other pages match. Here's the <b>Books</b> catalogue and the <b>About</b> page — run each to see the finished multi-page look.</p>\r\n<div class=\"ex\" data-kind=\"web\"><span class=\"exq\"><b>Exercise 12.</b> Run the styled <b>Books</b> catalogue page.</span>\r\n<template class=\"st\">&lt;!doctype html&gt;\r\n&lt;html&gt;\r\n&lt;head&gt;&lt;meta charset=\"utf-8\"&gt;&lt;title&gt;Books — City Library&lt;/title&gt;\r\n&lt;style&gt;\r\n  body { font-family: sans-serif; margin: 0; color: #E8E4D8; background: #0E1626; }\r\n  header { background: #121C30; padding: 18px; }\r\n  header h1 { margin: 0; color: #F5B942; }\r\n  nav { display: flex; gap: 16px; background: #1a2740; padding: 12px 18px; }\r\n  nav a { color: #7FD1C0; text-decoration: none; }\r\n  main { padding: 18px; }\r\n  .catalog { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-top: 12px; }\r\n  .book { background: #121C30; padding: 16px; border-radius: 8px; border: 1px solid #22304C; }\r\n  .book h3 { margin: 0 0 6px; color: #7FD1C0; }\r\n  .book p { margin: 0; color: #8FA0BC; }\r\n  footer { padding: 14px 18px; color: #8FA0BC; }\r\n&lt;/style&gt;&lt;/head&gt;\r\n&lt;body&gt;\r\n  &lt;header&gt;&lt;h1&gt;City Library&lt;/h1&gt;&lt;/header&gt;\r\n  &lt;nav&gt;&lt;a href=\"index.html\"&gt;Home&lt;/a&gt;&lt;a href=\"books.html\"&gt;Books&lt;/a&gt;&lt;a href=\"about.html\"&gt;About&lt;/a&gt;&lt;/nav&gt;\r\n  &lt;main&gt;\r\n    &lt;h2&gt;Our books&lt;/h2&gt;\r\n    &lt;div class=\"catalog\"&gt;\r\n      &lt;div class=\"book\"&gt;&lt;h3&gt;Dune&lt;/h3&gt;&lt;p&gt;Frank Herbert&lt;/p&gt;&lt;/div&gt;\r\n      &lt;div class=\"book\"&gt;&lt;h3&gt;1984&lt;/h3&gt;&lt;p&gt;George Orwell&lt;/p&gt;&lt;/div&gt;\r\n      &lt;div class=\"book\"&gt;&lt;h3&gt;Emma&lt;/h3&gt;&lt;p&gt;Jane Austen&lt;/p&gt;&lt;/div&gt;\r\n      &lt;div class=\"book\"&gt;&lt;h3&gt;Hamlet&lt;/h3&gt;&lt;p&gt;W. Shakespeare&lt;/p&gt;&lt;/div&gt;\r\n      &lt;div class=\"book\"&gt;&lt;h3&gt;The Hobbit&lt;/h3&gt;&lt;p&gt;J.R.R. Tolkien&lt;/p&gt;&lt;/div&gt;\r\n      &lt;div class=\"book\"&gt;&lt;h3&gt;Meditations&lt;/h3&gt;&lt;p&gt;Marcus Aurelius&lt;/p&gt;&lt;/div&gt;\r\n    &lt;/div&gt;\r\n  &lt;/main&gt;\r\n  &lt;footer&gt;© 2026 City Library&lt;/footer&gt;\r\n&lt;/body&gt;\r\n&lt;/html&gt;</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"web\"><span class=\"exq\"><b>Exercise 13.</b> Run the styled <b>About</b> page.</span>\r\n<template class=\"st\">&lt;!doctype html&gt;\r\n&lt;html&gt;\r\n&lt;head&gt;&lt;meta charset=\"utf-8\"&gt;&lt;title&gt;About — City Library&lt;/title&gt;\r\n&lt;style&gt;\r\n  body { font-family: sans-serif; margin: 0; color: #E8E4D8; background: #0E1626; }\r\n  header { background: #121C30; padding: 18px; }\r\n  header h1 { margin: 0; color: #F5B942; }\r\n  nav { display: flex; gap: 16px; background: #1a2740; padding: 12px 18px; }\r\n  nav a { color: #7FD1C0; text-decoration: none; }\r\n  main { padding: 18px; max-width: 520px; line-height: 1.6; }\r\n  main h2 { color: #7FD1C0; }\r\n  .hours { background: #121C30; border-left: 3px solid #F5B942; padding: 10px 14px; margin-top: 12px; }\r\n  footer { padding: 14px 18px; color: #8FA0BC; }\r\n&lt;/style&gt;&lt;/head&gt;\r\n&lt;body&gt;\r\n  &lt;header&gt;&lt;h1&gt;City Library&lt;/h1&gt;&lt;/header&gt;\r\n  &lt;nav&gt;&lt;a href=\"index.html\"&gt;Home&lt;/a&gt;&lt;a href=\"books.html\"&gt;Books&lt;/a&gt;&lt;a href=\"about.html\"&gt;About&lt;/a&gt;&lt;/nav&gt;\r\n  &lt;main&gt;\r\n    &lt;h2&gt;About us&lt;/h2&gt;\r\n    &lt;p&gt;City Library opened in 1998. We lend over 40,000 books for free to everyone in the city.&lt;/p&gt;\r\n    &lt;div class=\"hours\"&gt;&lt;strong&gt;Opening hours:&lt;/strong&gt; Mon–Sat, 9am–8pm.&lt;/div&gt;\r\n  &lt;/main&gt;\r\n  &lt;footer&gt;© 2026 City Library&lt;/footer&gt;\r\n&lt;/body&gt;\r\n&lt;/html&gt;</template>\r\n</div>\r\n\r\n<h4>9. Build your own home page</h4>\r\n<div class=\"ex stretch\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 14. 🔥 Stretch — ✍️ your turn.</b> Assemble your own home page. Build: a <code>&lt;header&gt;</code> with an <code>&lt;h1&gt;</code> reading <code>City Library</code>; a <code>&lt;nav&gt;</code> with links to <code>index.html</code> and <code>books.html</code>; a <code>&lt;main&gt;</code> with an <code>&lt;h2&gt;</code> reading <code>Welcome</code>; and a <code>&lt;footer&gt;</code>. Then in the <b>CSS</b> make the <code>nav</code> a flex row with <code>gap</code> <code>16px</code>.</span>\r\n<template class=\"html\">\r\n</template>\r\n<template class=\"css\">\r\n</template>\r\n<template class=\"ts\">\r\nassert(document.querySelector('header h1') && document.querySelector('header h1').textContent.trim() === 'City Library', 'add a header with an h1 \"City Library\"');\r\nassert(document.querySelector('nav a[href=\"index.html\"]') && document.querySelector('nav a[href=\"books.html\"]'), 'add a nav with links to index.html and books.html');\r\nassert(document.querySelector('main h2') && document.querySelector('main h2').textContent.trim() === 'Welcome', 'add a main with an h2 \"Welcome\"');\r\nassert(document.querySelector('footer'), 'add a footer');\r\nvar s = getComputedStyle(document.querySelector('nav'));\r\nassert(s.display === 'flex', 'make the nav a flex row');\r\nassert(s.gap === '16px', 'give the nav a gap of 16px');\r\n</template>\r\n</div>\r\n\r\n<h4>🏠 Homework</h4>\r\n<p>Four take-home exercises, auto-graded — building out the rest of the site. The last one is a stretch.</p>\r\n<div class=\"ex homework\" data-kind=\"quiz\" data-a=\"1\"><span class=\"exq\"><b>Exercise 1.</b> On a deployed site, clicking <code>&lt;a href=\"books.html\"&gt;Books&lt;/a&gt;</code> takes the user to…</span>\r\n<ol class=\"opts\">\r\n<li>an external website called books</li>\r\n<li>the books.html page in the same folder</li>\r\n<li>nowhere — links need JavaScript</li>\r\n<li>the head of the current page</li>\r\n</ol></div>\r\n<div class=\"ex homework\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 2. ✍️</b> Build the Contact page's form: a <code>&lt;form&gt;</code> containing an <code>&lt;input&gt;</code> of <code>type</code> <code>email</code> and a <code>&lt;button&gt;</code> reading <code>Send</code>.</span>\r\n<template class=\"st\">&lt;h1&gt;Contact&lt;/h1&gt;\r\n&lt;form&gt;\r\n\r\n&lt;/form&gt;</template>\r\n<template class=\"ts\">\r\nvar inp = document.querySelector('form input');\r\nvar btn = document.querySelector('form button');\r\nassert(inp && inp.getAttribute('type') === 'email', 'add an email input to the form');\r\nassert(btn && btn.textContent.trim() === 'Send', 'add a button reading \"Send\"');\r\n</template>\r\n</div>\r\n<div class=\"ex homework\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 3. ✍️</b> Add a Contact link to the nav. Inside <code>&lt;nav&gt;</code>, add four links: Home (<code>index.html</code>), Books (<code>books.html</code>), About (<code>about.html</code>), Contact (<code>contact.html</code>).</span>\r\n<template class=\"st\">&lt;nav&gt;\r\n\r\n&lt;/nav&gt;</template>\r\n<template class=\"ts\">\r\nassert(document.querySelectorAll('nav a').length === 4, 'the nav should have four links');\r\nassert(document.querySelector('nav a[href=\"contact.html\"]'), 'add a Contact link to contact.html');\r\nassert(document.querySelector('nav a[href=\"index.html\"]') && document.querySelector('nav a[href=\"books.html\"]') && document.querySelector('nav a[href=\"about.html\"]'), 'keep the Home, Books and About links');\r\n</template>\r\n</div>\r\n<div class=\"ex homework stretch\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 4. 🔥 Stretch — ✍️</b> Make a polished book card. Build a <code>&lt;div class=\"book\"&gt;</code> with an <code>&lt;h3&gt;</code> reading <code>Dune</code>. In the <b>CSS</b> give <code>.book</code> a <code>padding</code> of <code>16px</code>, a <code>border</code> of <code>1px solid teal</code>, and a <code>transition</code> of <code>all 0.3s</code>.</span>\r\n<template class=\"html\">\r\n</template>\r\n<template class=\"css\">\r\n</template>\r\n<template class=\"ts\">\r\nvar book = document.querySelector('.book');\r\nassert(book, 'add a <div class=\"book\">');\r\nassert(book.querySelector('h3') && book.querySelector('h3').textContent.trim() === 'Dune', 'the card needs an h3 reading \"Dune\"');\r\nvar s = getComputedStyle(book);\r\nassert(s.paddingTop === '16px', 'set padding to 16px');\r\nassert(s.borderTopWidth === '1px' && s.borderTopStyle === 'solid', 'add a 1px solid border');\r\nassert(s.transitionDuration === '0.3s', 'set transition to all 0.3s');\r\n</template>\r\n</div>"}},{"t":{"vi":"JavaScript căn bản","en":"JavaScript basics"},"kind":"free","html":{"vi":"<h3>Bài 10 — JavaScript căn bản</h3>\r\n<p>Giờ bạn đã dựng và tạo kiểu được trang — nhưng chúng chỉ nằm im. <b>JavaScript</b> là ngôn ngữ làm trang <i>biết nghĩ và phản ứng</i>: nhớ giá trị, làm phép tính, đáp lại cú nhấp, cập nhật màn hình. Đây là lớp thứ ba và cuối cùng của web, lớp biến một tấm áp phích thành một ứng dụng. Chào mừng đến nửa sau khóa học.</p>\r\n<p>Mọi chương trình, ở bất kỳ ngôn ngữ nào, đều được xây từ những viên gạch nhỏ như nhau: <b>giá trị (value)</b> (một đoạn chữ, một con số), <b>biến (variable)</b> (những hộp có tên lưu các giá trị đó), và <b>toán tử (operator)</b> (phép toán và so sánh). Làm chủ chúng thì mọi thứ còn lại — vòng lặp, hàm, cả một ứng dụng — chỉ là các tổ hợp của chúng. JavaScript là nơi thân thiện để học vì nó chạy khắp nơi và cho kết quả ngay.</p>\r\n<p>Người bạn thân mới của bạn là <code>console.log()</code> — nó in ra một giá trị để bạn <i>thấy</i> code đang làm gì. Trong các bài tập này, bất cứ gì bạn <code>console.log</code> đều hiện trong ô <b>Kết quả in ra</b> khi bạn nhấn Chạy. Gõ code, chạy, đọc kết quả, được chấm. Viết JavaScript nào.</p>\r\n\r\n<h4>1. console.log — thấy code suy nghĩ</h4>\r\n<p><code>console.log(x)</code> in <code>x</code> ra để bạn xem. Đó là cách mọi lập trình viên kiểm tra công việc. Chữ (một <b>string</b>) đặt trong dấu ngoặc kép; số thì không.</p>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 1. ✍️ Đến lượt bạn.</b> In một lời chào. Dùng <code>console.log</code> để in đúng <code>Hello, Dojo!</code> (trong dấu ngoặc kép).</span>\r\n<template class=\"st\">&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(_OUT_.trim() === 'Hello, Dojo!', 'console.log(\"Hello, Dojo!\") phải in đúng Hello, Dojo!');\r\n</template>\r\n</div>\r\n\r\n<h4>2. Biến — những hộp có tên</h4>\r\n<p>Một <b>biến</b> lưu một giá trị dưới một cái tên để bạn dùng lại. Khai báo bằng <code>let</code> (giá trị có thể đổi) hoặc <code>const</code> (giá trị không đổi). Rồi dùng cái tên đó ở đâu cũng được.</p>\r\n<pre class=\"snippet\">let city = \"Hanoi\";\r\nconsole.log(city);</pre>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 2. ✍️ Đến lượt bạn.</b> Tạo một biến <code>city</code> giữ chuỗi <code>Hanoi</code>, rồi <code>console.log(city)</code>.</span>\r\n<template class=\"st\">&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(typeof city !== 'undefined', 'khai báo một biến tên city');\r\nassert(city === 'Hanoi', 'city phải giữ chuỗi \"Hanoi\"');\r\nassert(_OUT_.trim() === 'Hanoi', 'console.log(city) phải in Hanoi');\r\n</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 3. ✍️ Đến lượt bạn.</b> Lưu một con số. Tạo <code>const age = 20;</code> rồi in nó bằng <code>console.log(age)</code>.</span>\r\n<template class=\"st\">&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(typeof age === 'number', 'age phải là số (không có dấu ngoặc)');\r\nassert(age === 20, 'age phải là 20');\r\nassert(_OUT_.trim() === '20', 'console.log(age) phải in 20');\r\n</template>\r\n</div>\r\n\r\n<h4>3. Kiểu dữ liệu — chữ, số, đúng/sai</h4>\r\n<p>Ba kiểu cơ bản bao phủ hầu hết những gì bạn lưu: một <b>string</b> (chữ trong ngoặc kép, <code>\"hi\"</code>), một <b>number</b> (<code>42</code>, không ngoặc), và một <b>boolean</b> (<code>true</code> hoặc <code>false</code>). Toán tử <code>typeof</code> cho bạn biết một giá trị thuộc kiểu nào.</p>\r\n<pre class=\"snippet\">console.log(typeof \"hi\");    // string\r\nconsole.log(typeof 42);      // number\r\nconsole.log(typeof true);    // boolean</pre>\r\n<div class=\"ex\" data-kind=\"quiz\" data-a=\"2\"><span class=\"exq\"><b>Bài tập 4.</b> Giá trị nào dưới đây là một <b>number</b> (không phải chuỗi)?</span>\r\n<ol class=\"opts\">\r\n<li><code>\"7\"</code></li>\r\n<li><code>\"seven\"</code></li>\r\n<li><code>7</code></li>\r\n<li><code>true</code></li>\r\n</ol></div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 5. ✍️ Đến lượt bạn.</b> Tạo một boolean. Tạo <code>let isOpen = true;</code> và in nó bằng <code>console.log(isOpen)</code>.</span>\r\n<template class=\"st\">&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(typeof isOpen === 'boolean', 'isOpen phải là boolean (true hoặc false, không ngoặc)');\r\nassert(isOpen === true, 'isOpen phải là true');\r\nassert(_OUT_.trim() === 'true', 'console.log(isOpen) phải in true');\r\n</template>\r\n</div>\r\n\r\n<h4>4. Toán tử — làm phép tính</h4>\r\n<p>Các phép số học quen thuộc: <code>+</code> cộng, <code>-</code> trừ, <code>*</code> nhân, <code>/</code> chia. Bạn có thể tính ngay trong <code>console.log</code>, hoặc lưu kết quả vào một biến.</p>\r\n<pre class=\"snippet\">console.log(5 + 3);      // 8\r\nconsole.log(10 * 2);     // 20\r\nlet total = 4 + 6;\r\nconsole.log(total);      // 10</pre>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 6. ✍️ Đến lượt bạn.</b> In kết quả của <code>7 * 6</code> bằng <code>console.log</code> (đáp án phải in ra là <code>42</code>).</span>\r\n<template class=\"st\">&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(_OUT_.trim() === '42', 'console.log(7 * 6) phải in 42');\r\n</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 7. ✍️ Đến lượt bạn.</b> Lưu một tổng. Tạo <code>let price = 25000;</code> và <code>let qty = 3;</code>, rồi <code>console.log(price * qty)</code> (phải in <code>75000</code>).</span>\r\n<template class=\"st\">&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(typeof price === 'number' && price === 25000, 'tạo price = 25000');\r\nassert(typeof qty === 'number' && qty === 3, 'tạo qty = 3');\r\nassert(_OUT_.trim() === '75000', 'console.log(price * qty) phải in 75000');\r\n</template>\r\n</div>\r\n\r\n<h4>5. Template literal — nhét giá trị vào chữ</h4>\r\n<p>Để dựng một câu có biến bên trong, dùng <b>template literal</b>: dấu backtick <code>`…`</code> với các lỗ <code>${…}</code>. <code>`Hi ${name}`</code> thả giá trị của <code>name</code> vào chuỗi.</p>\r\n<pre class=\"snippet\">let name = \"Mai\";\r\nconsole.log(`Hello, ${name}!`);   // Hello, Mai!</pre>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 8. ✍️ Đến lượt bạn.</b> Tạo <code>let name = \"Mai\";</code> rồi dùng template literal để in đúng <code>Hello, Mai!</code></span>\r\n<template class=\"st\">&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(_OUT_.trim() === 'Hello, Mai!', 'in \"Hello, Mai!\" bằng template literal `Hello, ${name}!`');\r\n</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 9. ✍️ Đến lượt bạn.</b> Kết hợp dữ liệu. Tạo <code>let item = \"Coffee\";</code> và <code>let cost = 25000;</code>, rồi in đúng <code>Coffee costs 25000</code> bằng template literal.</span>\r\n<template class=\"st\">&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(_OUT_.trim() === 'Coffee costs 25000', 'in \"Coffee costs 25000\" bằng `${item} costs ${cost}`');\r\n</template>\r\n</div>\r\n\r\n<h4>6. Hiện kết quả lên trang</h4>\r\n<p>Kết quả console là dành cho bạn, người lập trình. Để hiện gì đó cho <i>người dùng</i>, đặt nó lên trang — cách đơn giản nhất là <code>document.body.textContent = …</code>. (Các bài sau sẽ đi sâu hơn nhiều vào việc này.)</p>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 10. ✍️ Đến lượt bạn.</b> Đặt chữ lên trang. Gán <code>document.body.textContent</code> thành <code>Welcome!</code> — bạn sẽ thấy nó hiện trong ô xem trước.</span>\r\n<template class=\"st\">&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(document.body.textContent.trim() === 'Welcome!', 'gán document.body.textContent thành \"Welcome!\"');\r\n</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 11. ✍️ Đến lượt bạn.</b> Tính rồi hiện. Tạo <code>let a = 8;</code> và <code>let b = 5;</code>, rồi gán <code>document.body.textContent</code> thành chuỗi <code>Sum: 13</code> bằng template literal với <code>${a + b}</code>.</span>\r\n<template class=\"st\">&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(document.body.textContent.trim() === 'Sum: 13', 'hiện \"Sum: 13\" lên trang bằng `Sum: ${a + b}`');\r\n</template>\r\n</div>\r\n<div class=\"ex stretch\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 12. 🔥 Nâng cao — ✍️ đến lượt bạn.</b> Dựng một hóa đơn nhỏ. Tạo <code>let item = \"Tea\";</code>, <code>let price = 30000;</code>, <code>let qty = 2;</code>. <code>console.log</code> đúng <code>Tea x2</code>, và gán <code>document.body.textContent</code> thành <code>Total: 60000</code> (dùng <code>price * qty</code>).</span>\r\n<template class=\"st\">&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(_OUT_.trim() === 'Tea x2', 'console.log phải in \"Tea x2\" (dùng `${item} x${qty}`)');\r\nassert(document.body.textContent.trim() === 'Total: 60000', 'trang phải hiện \"Total: 60000\" (dùng price * qty)');\r\n</template>\r\n</div>\r\n\r\n<h4>🏠 Bài tập về nhà</h4>\r\n<p>Bốn bài mang về nhà, chấm tự động — tất cả đều thực hành. Bài cuối là bài nâng cao.</p>\r\n<div class=\"ex homework\" data-kind=\"quiz\" data-a=\"1\"><span class=\"exq\"><b>Bài tập 1.</b> Từ khóa nào khai báo một biến mà giá trị sẽ <b>không</b> đổi?</span>\r\n<ol class=\"opts\">\r\n<li><code>let</code></li>\r\n<li><code>const</code></li>\r\n<li><code>log</code></li>\r\n<li><code>var</code></li>\r\n</ol></div>\r\n<div class=\"ex homework\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 2. ✍️</b> Tạo <code>let country = \"Vietnam\";</code> và in nó bằng <code>console.log</code> (phải in <code>Vietnam</code>).</span>\r\n<template class=\"st\">&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(country === 'Vietnam', 'tạo country = \"Vietnam\"');\r\nassert(_OUT_.trim() === 'Vietnam', 'console.log(country) phải in Vietnam');\r\n</template>\r\n</div>\r\n<div class=\"ex homework\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 3. ✍️</b> Tạo <code>let x = 12;</code> và <code>let y = 8;</code>, rồi <code>console.log(x + y)</code> (phải in <code>20</code>).</span>\r\n<template class=\"st\">&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(_OUT_.trim() === '20', 'console.log(x + y) phải in 20');\r\n</template>\r\n</div>\r\n<div class=\"ex homework stretch\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 4. 🔥 Nâng cao — ✍️</b> Tạo <code>let user = \"Nam\";</code> và <code>let points = 90;</code>. Gán <code>document.body.textContent</code> thành đúng <code>Nam has 90 points</code> bằng template literal.</span>\r\n<template class=\"st\">&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(document.body.textContent.trim() === 'Nam has 90 points', 'hiện \"Nam has 90 points\" bằng `${user} has ${points} points`');\r\n</template>\r\n</div>","en":"<h3>Lesson 10 — JavaScript basics</h3>\r\n<p>You can now build and style pages — but they just sit there. <b>JavaScript</b> is the language that makes a page <i>think and react</i>: remember values, do calculations, respond to clicks, update the screen. It's the third and final layer of the web, and the one that turns a poster into an app. Welcome to the second half of the course.</p>\r\n<p>Every program, in any language, is built from the same tiny bricks: <b>values</b> (a piece of text, a number), <b>variables</b> (named boxes that store those values), and <b>operators</b> (math and comparisons). Master those and everything else — loops, functions, whole apps — is just combinations of them. JavaScript is a friendly place to learn them because it runs everywhere and shows results instantly.</p>\r\n<p>Your new best friend is <code>console.log()</code> — it prints a value so you can <i>see</i> what your code is doing. In these exercises, whatever you <code>console.log</code> shows up in the <b>Output</b> box when you press Run. Type code, run it, read the output, get graded. Let's write some JavaScript.</p>\r\n\r\n<h4>1. console.log — see your code think</h4>\r\n<p><code>console.log(x)</code> prints <code>x</code> so you can inspect it. It's how every developer checks their work. Text (a <b>string</b>) goes in quotes; numbers don't.</p>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 1. ✍️ Your turn.</b> Print a greeting. Use <code>console.log</code> to print exactly <code>Hello, Dojo!</code> (in quotes).</span>\r\n<template class=\"st\">&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(_OUT_.trim() === 'Hello, Dojo!', 'console.log(\"Hello, Dojo!\") should print exactly Hello, Dojo!');\r\n</template>\r\n</div>\r\n\r\n<h4>2. Variables — named boxes</h4>\r\n<p>A <b>variable</b> stores a value under a name so you can reuse it. Declare one with <code>let</code> (a value that can change) or <code>const</code> (one that won't). Then use the name anywhere.</p>\r\n<pre class=\"snippet\">let city = \"Hanoi\";\r\nconsole.log(city);</pre>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 2. ✍️ Your turn.</b> Create a variable <code>city</code> holding the string <code>Hanoi</code>, then <code>console.log(city)</code>.</span>\r\n<template class=\"st\">&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(typeof city !== 'undefined', 'declare a variable called city');\r\nassert(city === 'Hanoi', 'city should hold the string \"Hanoi\"');\r\nassert(_OUT_.trim() === 'Hanoi', 'console.log(city) should print Hanoi');\r\n</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 3. ✍️ Your turn.</b> Store a number. Create <code>const age = 20;</code> then print it with <code>console.log(age)</code>.</span>\r\n<template class=\"st\">&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(typeof age === 'number', 'age should be a number (no quotes)');\r\nassert(age === 20, 'age should be 20');\r\nassert(_OUT_.trim() === '20', 'console.log(age) should print 20');\r\n</template>\r\n</div>\r\n\r\n<h4>3. Data types — text, numbers, true/false</h4>\r\n<p>Three basic types cover most of what you store: a <b>string</b> (text in quotes, <code>\"hi\"</code>), a <b>number</b> (<code>42</code>, no quotes), and a <b>boolean</b> (<code>true</code> or <code>false</code>). The <code>typeof</code> operator tells you which one a value is.</p>\r\n<pre class=\"snippet\">console.log(typeof \"hi\");    // string\r\nconsole.log(typeof 42);      // number\r\nconsole.log(typeof true);    // boolean</pre>\r\n<div class=\"ex\" data-kind=\"quiz\" data-a=\"2\"><span class=\"exq\"><b>Exercise 4.</b> Which of these is a <b>number</b> value (not a string)?</span>\r\n<ol class=\"opts\">\r\n<li><code>\"7\"</code></li>\r\n<li><code>\"seven\"</code></li>\r\n<li><code>7</code></li>\r\n<li><code>true</code></li>\r\n</ol></div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 5. ✍️ Your turn.</b> Make a boolean. Create <code>let isOpen = true;</code> and print it with <code>console.log(isOpen)</code>.</span>\r\n<template class=\"st\">&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(typeof isOpen === 'boolean', 'isOpen should be a boolean (true or false, no quotes)');\r\nassert(isOpen === true, 'isOpen should be true');\r\nassert(_OUT_.trim() === 'true', 'console.log(isOpen) should print true');\r\n</template>\r\n</div>\r\n\r\n<h4>4. Operators — doing maths</h4>\r\n<p>The usual arithmetic works: <code>+</code> add, <code>-</code> subtract, <code>*</code> multiply, <code>/</code> divide. You can compute right inside <code>console.log</code>, or store the result in a variable.</p>\r\n<pre class=\"snippet\">console.log(5 + 3);      // 8\r\nconsole.log(10 * 2);     // 20\r\nlet total = 4 + 6;\r\nconsole.log(total);      // 10</pre>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 6. ✍️ Your turn.</b> Print the result of <code>7 * 6</code> using <code>console.log</code> (the answer should print as <code>42</code>).</span>\r\n<template class=\"st\">&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(_OUT_.trim() === '42', 'console.log(7 * 6) should print 42');\r\n</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 7. ✍️ Your turn.</b> Store a sum. Create <code>let price = 25000;</code> and <code>let qty = 3;</code>, then <code>console.log(price * qty)</code> (should print <code>75000</code>).</span>\r\n<template class=\"st\">&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(typeof price === 'number' && price === 25000, 'create price = 25000');\r\nassert(typeof qty === 'number' && qty === 3, 'create qty = 3');\r\nassert(_OUT_.trim() === '75000', 'console.log(price * qty) should print 75000');\r\n</template>\r\n</div>\r\n\r\n<h4>5. Template literals — put values into text</h4>\r\n<p>To build a sentence with variables inside, use a <b>template literal</b>: backticks <code>`…`</code> with <code>${…}</code> holes. <code>`Hi ${name}`</code> drops the value of <code>name</code> into the string.</p>\r\n<pre class=\"snippet\">let name = \"Mai\";\r\nconsole.log(`Hello, ${name}!`);   // Hello, Mai!</pre>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 8. ✍️ Your turn.</b> Create <code>let name = \"Mai\";</code> then use a template literal to print exactly <code>Hello, Mai!</code></span>\r\n<template class=\"st\">&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(_OUT_.trim() === 'Hello, Mai!', 'print \"Hello, Mai!\" using a template literal `Hello, ${name}!`');\r\n</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 9. ✍️ Your turn.</b> Combine data. Create <code>let item = \"Coffee\";</code> and <code>let cost = 25000;</code>, then print exactly <code>Coffee costs 25000</code> using a template literal.</span>\r\n<template class=\"st\">&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(_OUT_.trim() === 'Coffee costs 25000', 'print \"Coffee costs 25000\" using `${item} costs ${cost}`');\r\n</template>\r\n</div>\r\n\r\n<h4>6. Show a result on the page</h4>\r\n<p>Console output is for you, the developer. To show something to the <i>user</i>, put it on the page — the simplest way is <code>document.body.textContent = …</code>. (Next lessons go much deeper into this.)</p>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 10. ✍️ Your turn.</b> Put text on the page. Set <code>document.body.textContent</code> to <code>Welcome!</code> — you'll see it appear in the preview.</span>\r\n<template class=\"st\">&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(document.body.textContent.trim() === 'Welcome!', 'set document.body.textContent to \"Welcome!\"');\r\n</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 11. ✍️ Your turn.</b> Compute then show. Create <code>let a = 8;</code> and <code>let b = 5;</code>, then set <code>document.body.textContent</code> to the string <code>Sum: 13</code> using a template literal with <code>${a + b}</code>.</span>\r\n<template class=\"st\">&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(document.body.textContent.trim() === 'Sum: 13', 'show \"Sum: 13\" on the page using `Sum: ${a + b}`');\r\n</template>\r\n</div>\r\n<div class=\"ex stretch\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 12. 🔥 Stretch — ✍️ your turn.</b> Build a tiny receipt. Create <code>let item = \"Tea\";</code>, <code>let price = 30000;</code>, <code>let qty = 2;</code>. <code>console.log</code> exactly <code>Tea x2</code>, and set <code>document.body.textContent</code> to <code>Total: 60000</code> (use <code>price * qty</code>).</span>\r\n<template class=\"st\">&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(_OUT_.trim() === 'Tea x2', 'console.log should print \"Tea x2\" (use `${item} x${qty}`)');\r\nassert(document.body.textContent.trim() === 'Total: 60000', 'the page should show \"Total: 60000\" (use price * qty)');\r\n</template>\r\n</div>\r\n\r\n<h4>🏠 Homework</h4>\r\n<p>Four take-home exercises, auto-graded — all hands-on. The last one is a stretch.</p>\r\n<div class=\"ex homework\" data-kind=\"quiz\" data-a=\"1\"><span class=\"exq\"><b>Exercise 1.</b> Which keyword declares a variable whose value will <b>not</b> change?</span>\r\n<ol class=\"opts\">\r\n<li><code>let</code></li>\r\n<li><code>const</code></li>\r\n<li><code>log</code></li>\r\n<li><code>var</code></li>\r\n</ol></div>\r\n<div class=\"ex homework\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 2. ✍️</b> Create <code>let country = \"Vietnam\";</code> and print it with <code>console.log</code> (should print <code>Vietnam</code>).</span>\r\n<template class=\"st\">&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(country === 'Vietnam', 'create country = \"Vietnam\"');\r\nassert(_OUT_.trim() === 'Vietnam', 'console.log(country) should print Vietnam');\r\n</template>\r\n</div>\r\n<div class=\"ex homework\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 3. ✍️</b> Create <code>let x = 12;</code> and <code>let y = 8;</code>, then <code>console.log(x + y)</code> (should print <code>20</code>).</span>\r\n<template class=\"st\">&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(_OUT_.trim() === '20', 'console.log(x + y) should print 20');\r\n</template>\r\n</div>\r\n<div class=\"ex homework stretch\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 4. 🔥 Stretch — ✍️</b> Create <code>let user = \"Nam\";</code> and <code>let points = 90;</code>. Set <code>document.body.textContent</code> to exactly <code>Nam has 90 points</code> using a template literal.</span>\r\n<template class=\"st\">&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(document.body.textContent.trim() === 'Nam has 90 points', 'show \"Nam has 90 points\" using `${user} has ${points} points`');\r\n</template>\r\n</div>"}},{"t":{"vi":"Luồng điều khiển & dữ liệu","en":"Control flow & data"},"kind":"free","html":{"vi":"<h3>Bài 11 — Luồng điều khiển &amp; dữ liệu</h3>\r\n<p>Đến giờ code của bạn chạy thẳng một mạch, từ trên xuống. Chương trình thật cần <b>ra quyết định</b> (\"nếu giỏ hàng rỗng thì ẩn nút thanh toán\") và <b>lặp lại</b> công việc (\"với mỗi sản phẩm, vẽ một thẻ\"). Hai khả năng đó — rẽ nhánh và lặp — gọi là <b>luồng điều khiển (control flow)</b>, và chúng cho phép vài dòng code xử lý cả nghìn mục.</p>\r\n<p>Để làm được việc gì có ích, bạn cũng cần giữ các <b>tập hợp</b> dữ liệu, chứ không chỉ giá trị lẻ. JavaScript cho bạn hai hộp chứa thường ngày: <b>mảng (array)</b> — một danh sách có thứ tự như <code>[\"Mai\", \"Nam\", \"Lan\"]</code> — và <b>đối tượng (object)</b> — một bản ghi có nhãn như <code>{ name: \"Mai\", age: 20 }</code>. Gần như mọi ứng dụng đều là mảng của các object: một danh sách sản phẩm, một danh sách người dùng, một danh sách tin nhắn.</p>\r\n<p>Bài này kết hợp cả hai: lưu dữ liệu trong mảng và object, rồi dùng <code>if</code> và vòng lặp để xử lý nó. Như trước, <code>console.log</code> hiện kết quả trong ô Kết quả in ra. Dạy code của bạn biết quyết định và lặp nào.</p>\r\n\r\n<h4>1. if / else — ra quyết định</h4>\r\n<p>Một <code>if</code> chạy một khối chỉ khi điều kiện của nó là <code>true</code>. Thêm <code>else</code> cho trường hợp còn lại. Điều kiện dùng các phép so sánh: <code>&gt;</code>, <code>&lt;</code>, <code>&gt;=</code>, <code>&lt;=</code>, và <code>===</code> (bằng).</p>\r\n<pre class=\"snippet\">let score = 75;\r\nif (score &gt;= 50) {\r\n  console.log(\"Pass\");\r\n} else {\r\n  console.log(\"Fail\");\r\n}</pre>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 1. ✍️ Đến lượt bạn.</b> Biến <code>score</code> là 75. Viết một <code>if / else</code> <code>console.log</code> ra <code>Pass</code> khi <code>score &gt;= 50</code>, ngược lại <code>Fail</code>.</span>\r\n<template class=\"st\">&lt;script&gt;\r\nlet score = 75;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(_OUT_.trim() === 'Pass', 'với score = 75 code phải in \"Pass\"');\r\n</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 2. ✍️ Đến lượt bạn.</b> In một phép so sánh. <code>console.log</code> kết quả của <code>10 &gt; 5</code> (phải in <code>true</code>).</span>\r\n<template class=\"st\">&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(_OUT_.trim() === 'true', 'console.log(10 > 5) phải in true');\r\n</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"quiz\" data-a=\"2\"><span class=\"exq\"><b>Bài tập 3.</b> Toán tử nào kiểm tra hai giá trị có <b>bằng nhau</b> không?</span>\r\n<ol class=\"opts\">\r\n<li><code>=</code></li>\r\n<li><code>&gt;</code></li>\r\n<li><code>===</code></li>\r\n<li><code>=!</code></li>\r\n</ol></div>\r\n\r\n<h4>2. Mảng — danh sách có thứ tự</h4>\r\n<p>Một <b>mảng</b> giữ nhiều giá trị theo thứ tự, viết trong ngoặc vuông. Lấy một mục bằng <b>chỉ số (index)</b> (đếm từ 0): <code>fruits[0]</code> là cái đầu. <code>fruits.length</code> là số lượng, và <code>fruits.push(x)</code> thêm một cái vào cuối.</p>\r\n<pre class=\"snippet\">let fruits = [\"apple\", \"banana\", \"cherry\"];\r\nconsole.log(fruits[0]);        // apple\r\nconsole.log(fruits.length);    // 3\r\nfruits.push(\"date\");           // giờ có 4 mục</pre>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 4. ✍️ Đến lượt bạn.</b> Tạo một mảng <code>nums</code> giữ <code>10, 20, 30</code>, rồi <code>console.log(nums.length)</code> (phải in <code>3</code>).</span>\r\n<template class=\"st\">&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(Array.isArray(nums) && nums.length === 3, 'tạo nums = [10, 20, 30]');\r\nassert(_OUT_.trim() === '3', 'console.log(nums.length) phải in 3');\r\n</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 5. ✍️ Đến lượt bạn.</b> In mục đầu tiên. Với mảng có sẵn, <code>console.log</code> phần tử ở chỉ số <code>0</code> (phải in <code>red</code>).</span>\r\n<template class=\"st\">&lt;script&gt;\r\nlet colors = [\"red\", \"green\", \"blue\"];\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(_OUT_.trim() === 'red', 'console.log(colors[0]) phải in red');\r\n</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 6. ✍️ Đến lượt bạn.</b> Thêm một mục. <code>push</code> chuỗi <code>blue</code> vào mảng, rồi <code>console.log(colors.length)</code> (phải in <code>3</code>).</span>\r\n<template class=\"st\">&lt;script&gt;\r\nlet colors = [\"red\", \"green\"];\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(colors.length === 3 && colors[2] === 'blue', 'push \"blue\" vào colors');\r\nassert(_OUT_.trim() === '3', 'console.log(colors.length) phải in 3');\r\n</template>\r\n</div>\r\n\r\n<h4>3. Vòng lặp — lặp mà không lặp lại chính mình</h4>\r\n<p>Một vòng <code>for</code> lặp lại một khối. Dạng kinh điển đếm số: <code>for (let i = 1; i &lt;= 5; i++)</code>. Để duyệt các mục của mảng, vòng <code>for … of</code> gọn hơn trao cho bạn từng phần tử lần lượt.</p>\r\n<pre class=\"snippet\">let sum = 0;\r\nfor (let i = 1; i &lt;= 5; i++) {\r\n  sum = sum + i;\r\n}\r\nconsole.log(sum);   // 15\r\n\r\nfor (let name of [\"Mai\", \"Nam\"]) {\r\n  console.log(name);\r\n}</pre>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 7. ✍️ Đến lượt bạn.</b> Cộng từ 1 đến 5. Dùng một vòng <code>for</code> để dựng <code>sum</code>, rồi <code>console.log(sum)</code> (phải in <code>15</code>).</span>\r\n<template class=\"st\">&lt;script&gt;\r\nlet sum = 0;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(_OUT_.trim() === '15', 'lặp 1..5 cộng vào sum, rồi in — phải in 15');\r\n</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 8. ✍️ Đến lượt bạn.</b> In từng tên. Dùng một vòng <code>for … of</code> để <code>console.log</code> mỗi tên trong mảng (mỗi tên một dòng).</span>\r\n<template class=\"st\">&lt;script&gt;\r\nlet names = [\"Mai\", \"Nam\", \"Lan\"];\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(_OUT_.trim() === 'Mai\\nNam\\nLan', 'in mỗi tên theo thứ tự, mỗi dòng một tên');\r\n</template>\r\n</div>\r\n\r\n<h4>4. Object — bản ghi có nhãn</h4>\r\n<p>Một <b>object</b> lưu các giá trị dưới các tên (<b>key</b>), trong ngoặc nhọn. Đọc một giá trị bằng dấu chấm: <code>user.name</code>. Object là cách bạn mô hình một \"thứ\" có nhiều thuộc tính.</p>\r\n<pre class=\"snippet\">let user = { name: \"Mai\", age: 20 };\r\nconsole.log(user.name);   // Mai\r\nconsole.log(user.age);    // 20</pre>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 9. ✍️ Đến lượt bạn.</b> Tạo một object <code>book</code> với key <code>title</code> đặt là <code>Dune</code>, rồi <code>console.log(book.title)</code> (phải in <code>Dune</code>).</span>\r\n<template class=\"st\">&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(book && book.title === 'Dune', 'tạo book = { title: \"Dune\" }');\r\nassert(_OUT_.trim() === 'Dune', 'console.log(book.title) phải in Dune');\r\n</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 10. ✍️ Đến lượt bạn.</b> Hai thuộc tính. Tạo <code>let car = { make: \"Toyota\", year: 2020 };</code> và in đúng <code>Toyota 2020</code> bằng template literal.</span>\r\n<template class=\"st\">&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(car && car.make === 'Toyota' && car.year === 2020, 'tạo car = { make: \"Toyota\", year: 2020 }');\r\nassert(_OUT_.trim() === 'Toyota 2020', 'in \"Toyota 2020\" bằng `${car.make} ${car.year}`');\r\n</template>\r\n</div>\r\n\r\n<h4>5. Ghép lại</h4>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 11. ✍️ Đến lượt bạn.</b> Tính tổng giỏ hàng. Lặp qua mảng <code>prices</code>, cộng vào <code>total</code>, rồi gán <code>document.body.textContent</code> thành <code>Total: 90</code> (dùng template literal).</span>\r\n<template class=\"st\">&lt;script&gt;\r\nlet prices = [20, 30, 40];\r\nlet total = 0;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(document.body.textContent.trim() === 'Total: 90', 'cộng các prices (90) và hiện \"Total: 90\" lên trang');\r\n</template>\r\n</div>\r\n<div class=\"ex stretch\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 12. 🔥 Nâng cao — ✍️ đến lượt bạn.</b> Đếm sách rẻ. Bạn có một mảng các object sách. Lặp qua chúng và đếm bao nhiêu cuốn có <code>price &lt; 100</code>; <code>console.log</code> con số đó (phải in <code>2</code>).</span>\r\n<template class=\"st\">&lt;script&gt;\r\nlet books = [\r\n  { title: \"Dune\", price: 120 },\r\n  { title: \"Emma\", price: 80 },\r\n  { title: \"1984\", price: 95 }\r\n];\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(_OUT_.trim() === '2', 'đếm sách có price < 100 (có 2) và in con số');\r\n</template>\r\n</div>\r\n\r\n<h4>🏠 Bài tập về nhà</h4>\r\n<p>Bốn bài mang về nhà, chấm tự động — tất cả đều thực hành. Bài cuối là bài nâng cao.</p>\r\n<div class=\"ex homework\" data-kind=\"quiz\" data-a=\"0\"><span class=\"exq\"><b>Bài tập 1.</b> Trong mảng <code>[\"a\", \"b\", \"c\"]</code>, chỉ số của <code>\"a\"</code> là bao nhiêu?</span>\r\n<ol class=\"opts\">\r\n<li><code>0</code></li>\r\n<li><code>1</code></li>\r\n<li><code>3</code></li>\r\n<li><code>\"a\"</code></li>\r\n</ol></div>\r\n<div class=\"ex homework\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 2. ✍️</b> Tạo một mảng <code>days</code> với <code>\"Mon\", \"Tue\", \"Wed\"</code>, rồi <code>console.log</code> cái cuối bằng <code>days[2]</code> (phải in <code>Wed</code>).</span>\r\n<template class=\"st\">&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(Array.isArray(days) && days.length === 3, 'tạo days = [\"Mon\", \"Tue\", \"Wed\"]');\r\nassert(_OUT_.trim() === 'Wed', 'console.log(days[2]) phải in Wed');\r\n</template>\r\n</div>\r\n<div class=\"ex homework\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 3. ✍️</b> Lặp từ 1 đến 3 và <code>console.log</code> mỗi số (mỗi số một dòng: <code>1</code>, <code>2</code>, <code>3</code>).</span>\r\n<template class=\"st\">&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(_OUT_.trim() === '1\\n2\\n3', 'in 1, 2, 3 mỗi số một dòng');\r\n</template>\r\n</div>\r\n<div class=\"ex homework stretch\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 4. 🔥 Nâng cao — ✍️</b> Mảng <code>temps</code> giữ nhiệt độ mỗi ngày. Lặp qua nó, cộng dồn, và gán <code>document.body.textContent</code> thành <code>Total: 90</code> (tổng).</span>\r\n<template class=\"st\">&lt;script&gt;\r\nlet temps = [30, 28, 32];\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(document.body.textContent.trim() === 'Total: 90', 'cộng temps (90) và hiện \"Total: 90\" lên trang');\r\n</template>\r\n</div>","en":"<h3>Lesson 11 — Control flow &amp; data</h3>\r\n<p>So far your code has run straight down, top to bottom. Real programs need to make <b>decisions</b> (\"if the cart is empty, hide the checkout button\") and <b>repeat</b> work (\"for each product, draw a card\"). Those two abilities — branching and looping — are called <b>control flow</b>, and they're what let a handful of lines handle a thousand items.</p>\r\n<p>To do anything useful you also need to hold <b>collections</b> of data, not just single values. JavaScript gives you two everyday containers: the <b>array</b> — an ordered list like <code>[\"Mai\", \"Nam\", \"Lan\"]</code> — and the <b>object</b> — a labelled record like <code>{ name: \"Mai\", age: 20 }</code>. Almost every app is arrays of objects: a list of products, a list of users, a list of messages.</p>\r\n<p>This lesson combines the two ideas: store data in arrays and objects, then use <code>if</code> and loops to work through it. As before, <code>console.log</code> shows your results in the Output box. Let's teach your code to decide and repeat.</p>\r\n\r\n<h4>1. if / else — making decisions</h4>\r\n<p>An <code>if</code> runs a block only when its condition is <code>true</code>. Add <code>else</code> for the alternative. Conditions use comparisons: <code>&gt;</code>, <code>&lt;</code>, <code>&gt;=</code>, <code>&lt;=</code>, and <code>===</code> (equal).</p>\r\n<pre class=\"snippet\">let score = 75;\r\nif (score &gt;= 50) {\r\n  console.log(\"Pass\");\r\n} else {\r\n  console.log(\"Fail\");\r\n}</pre>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 1. ✍️ Your turn.</b> The variable <code>score</code> is 75. Write an <code>if / else</code> that <code>console.log</code>s <code>Pass</code> when <code>score &gt;= 50</code>, otherwise <code>Fail</code>.</span>\r\n<template class=\"st\">&lt;script&gt;\r\nlet score = 75;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(_OUT_.trim() === 'Pass', 'with score = 75 the code should log \"Pass\"');\r\n</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 2. ✍️ Your turn.</b> Print a comparison. <code>console.log</code> the result of <code>10 &gt; 5</code> (it should print <code>true</code>).</span>\r\n<template class=\"st\">&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(_OUT_.trim() === 'true', 'console.log(10 > 5) should print true');\r\n</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"quiz\" data-a=\"2\"><span class=\"exq\"><b>Exercise 3.</b> Which operator checks whether two values are <b>equal</b>?</span>\r\n<ol class=\"opts\">\r\n<li><code>=</code></li>\r\n<li><code>&gt;</code></li>\r\n<li><code>===</code></li>\r\n<li><code>=!</code></li>\r\n</ol></div>\r\n\r\n<h4>2. Arrays — ordered lists</h4>\r\n<p>An <b>array</b> holds many values in order, written in square brackets. Reach an item by its <b>index</b> (counting from 0): <code>fruits[0]</code> is the first. <code>fruits.length</code> is how many there are, and <code>fruits.push(x)</code> adds one to the end.</p>\r\n<pre class=\"snippet\">let fruits = [\"apple\", \"banana\", \"cherry\"];\r\nconsole.log(fruits[0]);        // apple\r\nconsole.log(fruits.length);    // 3\r\nfruits.push(\"date\");           // now 4 items</pre>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 4. ✍️ Your turn.</b> Create an array <code>nums</code> holding <code>10, 20, 30</code>, then <code>console.log(nums.length)</code> (should print <code>3</code>).</span>\r\n<template class=\"st\">&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(Array.isArray(nums) && nums.length === 3, 'create nums = [10, 20, 30]');\r\nassert(_OUT_.trim() === '3', 'console.log(nums.length) should print 3');\r\n</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 5. ✍️ Your turn.</b> Print the first item. Given the array, <code>console.log</code> the element at index <code>0</code> (should print <code>red</code>).</span>\r\n<template class=\"st\">&lt;script&gt;\r\nlet colors = [\"red\", \"green\", \"blue\"];\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(_OUT_.trim() === 'red', 'console.log(colors[0]) should print red');\r\n</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 6. ✍️ Your turn.</b> Add an item. <code>push</code> the string <code>blue</code> onto the array, then <code>console.log(colors.length)</code> (should print <code>3</code>).</span>\r\n<template class=\"st\">&lt;script&gt;\r\nlet colors = [\"red\", \"green\"];\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(colors.length === 3 && colors[2] === 'blue', 'push \"blue\" onto colors');\r\nassert(_OUT_.trim() === '3', 'console.log(colors.length) should print 3');\r\n</template>\r\n</div>\r\n\r\n<h4>3. Loops — repeat without repeating yourself</h4>\r\n<p>A <code>for</code> loop repeats a block. The classic form counts: <code>for (let i = 1; i &lt;= 5; i++)</code>. To walk through an array's items, the cleaner <code>for … of</code> loop hands you each element in turn.</p>\r\n<pre class=\"snippet\">let sum = 0;\r\nfor (let i = 1; i &lt;= 5; i++) {\r\n  sum = sum + i;\r\n}\r\nconsole.log(sum);   // 15\r\n\r\nfor (let name of [\"Mai\", \"Nam\"]) {\r\n  console.log(name);\r\n}</pre>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 7. ✍️ Your turn.</b> Add up 1 to 5. Use a <code>for</code> loop to build <code>sum</code>, then <code>console.log(sum)</code> (should print <code>15</code>).</span>\r\n<template class=\"st\">&lt;script&gt;\r\nlet sum = 0;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(_OUT_.trim() === '15', 'loop 1..5 adding to sum, then log it — should print 15');\r\n</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 8. ✍️ Your turn.</b> Print each name. Use a <code>for … of</code> loop to <code>console.log</code> every name in the array (each on its own line).</span>\r\n<template class=\"st\">&lt;script&gt;\r\nlet names = [\"Mai\", \"Nam\", \"Lan\"];\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(_OUT_.trim() === 'Mai\\nNam\\nLan', 'log each name in order, one per line');\r\n</template>\r\n</div>\r\n\r\n<h4>4. Objects — labelled records</h4>\r\n<p>An <b>object</b> stores values under names (<b>keys</b>), in curly braces. Read a value with a dot: <code>user.name</code>. Objects are how you model a \"thing\" with several properties.</p>\r\n<pre class=\"snippet\">let user = { name: \"Mai\", age: 20 };\r\nconsole.log(user.name);   // Mai\r\nconsole.log(user.age);    // 20</pre>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 9. ✍️ Your turn.</b> Create an object <code>book</code> with a key <code>title</code> set to <code>Dune</code>, then <code>console.log(book.title)</code> (should print <code>Dune</code>).</span>\r\n<template class=\"st\">&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(book && book.title === 'Dune', 'create book = { title: \"Dune\" }');\r\nassert(_OUT_.trim() === 'Dune', 'console.log(book.title) should print Dune');\r\n</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 10. ✍️ Your turn.</b> Two properties. Create <code>let car = { make: \"Toyota\", year: 2020 };</code> and print exactly <code>Toyota 2020</code> using a template literal.</span>\r\n<template class=\"st\">&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(car && car.make === 'Toyota' && car.year === 2020, 'create car = { make: \"Toyota\", year: 2020 }');\r\nassert(_OUT_.trim() === 'Toyota 2020', 'print \"Toyota 2020\" using `${car.make} ${car.year}`');\r\n</template>\r\n</div>\r\n\r\n<h4>5. Put it together</h4>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 11. ✍️ Your turn.</b> Total a cart. Loop over the <code>prices</code> array, add them into <code>total</code>, then set <code>document.body.textContent</code> to <code>Total: 90</code> (use a template literal).</span>\r\n<template class=\"st\">&lt;script&gt;\r\nlet prices = [20, 30, 40];\r\nlet total = 0;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(document.body.textContent.trim() === 'Total: 90', 'sum the prices (90) and show \"Total: 90\" on the page');\r\n</template>\r\n</div>\r\n<div class=\"ex stretch\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 12. 🔥 Stretch — ✍️ your turn.</b> Count the cheap books. You have an array of book objects. Loop over them and count how many have <code>price &lt; 100</code>; <code>console.log</code> that count (it should print <code>2</code>).</span>\r\n<template class=\"st\">&lt;script&gt;\r\nlet books = [\r\n  { title: \"Dune\", price: 120 },\r\n  { title: \"Emma\", price: 80 },\r\n  { title: \"1984\", price: 95 }\r\n];\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(_OUT_.trim() === '2', 'count books with price < 100 (there are 2) and log the count');\r\n</template>\r\n</div>\r\n\r\n<h4>🏠 Homework</h4>\r\n<p>Four take-home exercises, auto-graded — all hands-on. The last one is a stretch.</p>\r\n<div class=\"ex homework\" data-kind=\"quiz\" data-a=\"0\"><span class=\"exq\"><b>Exercise 1.</b> In the array <code>[\"a\", \"b\", \"c\"]</code>, what is the index of <code>\"a\"</code>?</span>\r\n<ol class=\"opts\">\r\n<li><code>0</code></li>\r\n<li><code>1</code></li>\r\n<li><code>3</code></li>\r\n<li><code>\"a\"</code></li>\r\n</ol></div>\r\n<div class=\"ex homework\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 2. ✍️</b> Create an array <code>days</code> with <code>\"Mon\", \"Tue\", \"Wed\"</code>, then <code>console.log</code> the last one using <code>days[2]</code> (should print <code>Wed</code>).</span>\r\n<template class=\"st\">&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(Array.isArray(days) && days.length === 3, 'create days = [\"Mon\", \"Tue\", \"Wed\"]');\r\nassert(_OUT_.trim() === 'Wed', 'console.log(days[2]) should print Wed');\r\n</template>\r\n</div>\r\n<div class=\"ex homework\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 3. ✍️</b> Loop from 1 to 3 and <code>console.log</code> each number (each on its own line: <code>1</code>, <code>2</code>, <code>3</code>).</span>\r\n<template class=\"st\">&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(_OUT_.trim() === '1\\n2\\n3', 'log 1, 2, 3 each on its own line');\r\n</template>\r\n</div>\r\n<div class=\"ex homework stretch\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 4. 🔥 Stretch — ✍️</b> The array <code>temps</code> holds daily temperatures. Loop over it, add them up, and set <code>document.body.textContent</code> to <code>Total: 90</code> (the sum).</span>\r\n<template class=\"st\">&lt;script&gt;\r\nlet temps = [30, 28, 32];\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(document.body.textContent.trim() === 'Total: 90', 'sum temps (90) and show \"Total: 90\" on the page');\r\n</template>\r\n</div>"}},{"t":{"vi":"Hàm trong JavaScript","en":"JavaScript functions"},"kind":"free","html":{"vi":"<h3>Bài 12 — Hàm trong JavaScript</h3>\r\n<p>Khi chương trình lớn dần, bạn thấy mình viết đi viết lại cùng vài dòng — định dạng một mức giá, chào một người dùng, tính tổng giỏ hàng. Một <b>hàm (function)</b> là một khối code có tên, dùng lại được: bạn viết các bước một lần, đặt cho nó một cái tên, rồi <i>gọi</i> tên đó bất cứ khi nào cần làm việc đó. Hàm là cách code thật giữ được ngắn gọn, có tổ chức và DRY (Đừng Lặp Lại Chính Mình).</p>\r\n<p>Một hàm có hai sức mạnh. Nó có thể nhận <b>đầu vào</b> — gọi là <b>tham số (parameter)</b> — để cùng một hàm làm việc trên dữ liệu khác nhau (<code>greet(\"Mai\")</code> so với <code>greet(\"Nam\")</code>). Và nó có thể trả lại một kết quả bằng <b>return</b>, để bạn dùng câu trả lời ở nơi khác (<code>let tax = calcTax(price)</code>). Đầu vào vào, một giá trị ra — đó là toàn bộ ý tưởng.</p>\r\n<p>Bạn sẽ định nghĩa hàm và gọi chúng ngay, xem kết quả trong ô Kết quả in ra hoặc trên trang. Khi đã quen ở đây, các bài DOM phía trước trở nên dễ — chúng chỉ là các hàm phản ứng với người dùng. Dựng code dùng lại được nào.</p>\r\n\r\n<h4>1. Định nghĩa và gọi một hàm</h4>\r\n<p>Viết <code>function name() { … }</code> để <b>định nghĩa</b> nó, rồi <code>name()</code> để <b>gọi</b> (chạy) nó. Định nghĩa một hàm không chạy nó — gọi mới chạy.</p>\r\n<pre class=\"snippet\">function sayHi() {\r\n  console.log(\"Hi there!\");\r\n}\r\nsayHi();   // chạy nó → in Hi there!</pre>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 1. ✍️ Đến lượt bạn.</b> Định nghĩa một hàm <code>greet</code> <code>console.log</code> ra <code>Hello!</code>, rồi <b>gọi</b> nó.</span>\r\n<template class=\"st\">&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(typeof greet === 'function', 'định nghĩa một hàm tên greet');\r\nassert(_OUT_.trim() === 'Hello!', 'gọi greet() phải in \"Hello!\"');\r\n</template>\r\n</div>\r\n\r\n<h4>2. Tham số — đầu vào</h4>\r\n<p>Đặt các tên trong ngoặc đơn để nhận <b>đầu vào</b>. Bên trong hàm, các tên đó giữ bất cứ gì bạn truyền vào khi gọi.</p>\r\n<pre class=\"snippet\">function greet(name) {\r\n  console.log(\"Hello, \" + name);\r\n}\r\ngreet(\"Mai\");   // Hello, Mai\r\ngreet(\"Nam\");   // Hello, Nam</pre>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 2. ✍️ Đến lượt bạn.</b> Định nghĩa <code>greet(name)</code> <code>console.log</code> ra <code>Hello, </code> theo sau là tên, rồi gọi <code>greet(\"Dojo\")</code> (phải in <code>Hello, Dojo</code>).</span>\r\n<template class=\"st\">&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(typeof greet === 'function', 'định nghĩa greet(name)');\r\nassert(_OUT_.trim() === 'Hello, Dojo', 'greet(\"Dojo\") phải in \"Hello, Dojo\"');\r\n</template>\r\n</div>\r\n\r\n<h4>3. return — trả lại một giá trị</h4>\r\n<p>Phần lớn hàm <b>tính</b> ra thứ gì đó chứ không in nó. Dùng <code>return</code> để gửi một giá trị về cho nơi đã gọi hàm, để bạn lưu hoặc dùng lại.</p>\r\n<pre class=\"snippet\">function double(n) {\r\n  return n * 2;\r\n}\r\nlet result = double(5);\r\nconsole.log(result);   // 10</pre>\r\n<div class=\"ex\" data-kind=\"quiz\" data-a=\"2\"><span class=\"exq\"><b>Bài tập 3.</b> Từ khóa nào gửi một giá trị <b>về</b> từ một hàm đến nơi nó được gọi?</span>\r\n<ol class=\"opts\">\r\n<li><code>log</code></li>\r\n<li><code>function</code></li>\r\n<li><code>return</code></li>\r\n<li><code>let</code></li>\r\n</ol></div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 4. ✍️ Đến lượt bạn.</b> Định nghĩa <code>double(n)</code> <b>trả về</b> <code>n * 2</code>. (Đừng log — chỉ return.)</span>\r\n<template class=\"st\">&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(typeof double === 'function', 'định nghĩa double(n)');\r\nassert(double(5) === 10, 'double(5) phải trả về 10');\r\nassert(double(0) === 0, 'double(0) phải trả
