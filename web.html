về 0');\r\n</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 5. ✍️ Đến lượt bạn.</b> Định nghĩa <code>add(a, b)</code> <b>trả về</b> tổng <code>a + b</code>.</span>\r\n<template class=\"st\">&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(typeof add === 'function', 'định nghĩa add(a, b)');\r\nassert(add(2, 3) === 5, 'add(2, 3) phải trả về 5');\r\nassert(add(10, 15) === 25, 'add(10, 15) phải trả về 25');\r\n</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 6. ✍️ Đến lượt bạn.</b> Định nghĩa <code>welcome(name)</code> <b>trả về</b> chuỗi <code>Hello, </code> + name + <code>!</code> (ví dụ <code>welcome(\"Mai\")</code> trả về <code>Hello, Mai!</code>). Template literal là dễ nhất.</span>\r\n<template class=\"st\">&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(typeof welcome === 'function', 'định nghĩa welcome(name)');\r\nassert(welcome('Mai') === 'Hello, Mai!', 'welcome(\"Mai\") phải trả về \"Hello, Mai!\"');\r\nassert(welcome('Nam') === 'Hello, Nam!', 'welcome(\"Nam\") phải trả về \"Hello, Nam!\"');\r\n</template>\r\n</div>\r\n\r\n<h4>4. Arrow function — dạng ngắn hơn</h4>\r\n<p>JavaScript hiện đại có cách viết gọn cho các hàm nhỏ: <b>arrow function</b>. <code>const square = (n) =&gt; n * n;</code> nghĩa giống một <code>function</code> trả về <code>n * n</code>. Bạn sẽ thấy cách viết tắt này ở khắp nơi.</p>\r\n<pre class=\"snippet\">const square = (n) =&gt; n * n;\r\nconsole.log(square(4));   // 16</pre>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 7. ✍️ Đến lượt bạn.</b> Viết một <b>arrow function</b> <code>triple</code> trả về <code>n * 3</code> (dùng <code>const triple = (n) =&gt; …</code>).</span>\r\n<template class=\"st\">&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(typeof triple === 'function', 'định nghĩa một arrow function triple');\r\nassert(triple(3) === 9, 'triple(3) phải trả về 9');\r\nassert(triple(10) === 30, 'triple(10) phải trả về 30');\r\n</template>\r\n</div>\r\n\r\n<h4>5. Hàm biết quyết định</h4>\r\n<p>Kết hợp một hàm với một <code>if</code> (hoặc một phép so sánh) để trả lời câu hỏi có/không.</p>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 8. ✍️ Đến lượt bạn.</b> Định nghĩa <code>isAdult(age)</code> <b>trả về</b> <code>true</code> khi <code>age &gt;= 18</code>, ngược lại <code>false</code>. (Mẹo: <code>return age &gt;= 18;</code> chạy trực tiếp.)</span>\r\n<template class=\"st\">&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(typeof isAdult === 'function', 'định nghĩa isAdult(age)');\r\nassert(isAdult(20) === true, 'isAdult(20) phải là true');\r\nassert(isAdult(15) === false, 'isAdult(15) phải là false');\r\n</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 9. ✍️ Đến lượt bạn.</b> Định nghĩa <code>total(prices)</code> nhận một mảng số, lặp qua nó, và <b>trả về</b> tổng của chúng. (ví dụ <code>total([10, 20, 30])</code> trả về <code>60</code>.)</span>\r\n<template class=\"st\">&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(typeof total === 'function', 'định nghĩa total(prices)');\r\nassert(total([10, 20, 30]) === 60, 'total([10, 20, 30]) phải trả về 60');\r\nassert(total([5]) === 5, 'total([5]) phải trả về 5');\r\n</template>\r\n</div>\r\n\r\n<h4>6. Hàm cập nhật trang</h4>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 10. ✍️ Đến lượt bạn.</b> Định nghĩa <code>show(msg)</code> gán <code>document.body.textContent</code> thành <code>msg</code>. Rồi gọi <code>show(\"Done!\")</code> — bạn sẽ thấy nó trong ô xem trước.</span>\r\n<template class=\"st\">&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(typeof show === 'function', 'định nghĩa show(msg)');\r\nassert(document.body.textContent.trim() === 'Done!', 'gọi show(\"Done!\") phải đặt \"Done!\" lên trang');\r\n</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 11. ✍️ Đến lượt bạn.</b> Định nghĩa <code>price(item, cost)</code> <b>trả về</b> một chuỗi như <code>Coffee: 25000</code>. Rồi gọi nó và gán <code>document.body.textContent</code> thành <code>price(\"Coffee\", 25000)</code>.</span>\r\n<template class=\"st\">&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(typeof price === 'function', 'định nghĩa price(item, cost)');\r\nassert(price('Tea', 30000) === 'Tea: 30000', 'price(\"Tea\", 30000) phải trả về \"Tea: 30000\"');\r\nassert(document.body.textContent.trim() === 'Coffee: 25000', 'hiện price(\"Coffee\", 25000) lên trang');\r\n</template>\r\n</div>\r\n<div class=\"ex stretch\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 12. 🔥 Nâng cao — ✍️ đến lượt bạn.</b> Định nghĩa <code>makeCard(title, author)</code> <b>trả về</b> một chuỗi HTML <code>&lt;h3&gt;title&lt;/h3&gt;&lt;p&gt;author&lt;/p&gt;</code> (với các giá trị điền vào). Rồi gán <code>document.body.innerHTML</code> thành <code>makeCard(\"Dune\", \"Herbert\")</code> — một thẻ thật hiện ra.</span>\r\n<template class=\"st\">&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(typeof makeCard === 'function', 'định nghĩa makeCard(title, author)');\r\nassert(makeCard('Emma', 'Austen').replace(/\\s+/g,'') === '<h3>Emma</h3><p>Austen</p>', 'makeCard phải trả về \"<h3>title</h3><p>author</p>\"');\r\nassert(document.querySelector('h3') && document.querySelector('h3').textContent.trim() === 'Dune', 'render makeCard(\"Dune\", \"Herbert\") — một h3 \"Dune\" phải hiện ra');\r\nassert(document.querySelector('p') && document.querySelector('p').textContent.trim() === 'Herbert', 'một p \"Herbert\" phải hiện ra');\r\n</template>\r\n</div>\r\n\r\n<h4>🏠 Bài tập về nhà</h4>\r\n<p>Bốn bài mang về nhà, chấm tự động — tất cả đều thực hành. Bài cuối là bài nâng cao.</p>\r\n<div class=\"ex homework\" data-kind=\"quiz\" data-a=\"1\"><span class=\"exq\"><b>Bài tập 1.</b> <b>Gọi</b> một hàm nghĩa là gì?</span>\r\n<ol class=\"opts\">\r\n<li>Định nghĩa nó để dùng sau</li>\r\n<li>Chạy nó ngay bây giờ</li>\r\n<li>Xóa nó</li>\r\n<li>Đặt tên một biến</li>\r\n</ol></div>\r\n<div class=\"ex homework\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 2. ✍️</b> Định nghĩa <code>square(n)</code> <b>trả về</b> <code>n * n</code>.</span>\r\n<template class=\"st\">&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(typeof square === 'function', 'định nghĩa square(n)');\r\nassert(square(6) === 36, 'square(6) phải trả về 36');\r\n</template>\r\n</div>\r\n<div class=\"ex homework\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 3. ✍️</b> Định nghĩa <code>subtract(a, b)</code> <b>trả về</b> <code>a - b</code>, rồi <code>console.log(subtract(10, 4))</code> (phải in <code>6</code>).</span>\r\n<template class=\"st\">&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(typeof subtract === 'function' && subtract(10, 4) === 6, 'subtract(10, 4) phải trả về 6');\r\nassert(_OUT_.trim() === '6', 'console.log(subtract(10, 4)) phải in 6');\r\n</template>\r\n</div>\r\n<div class=\"ex homework stretch\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 4. 🔥 Nâng cao — ✍️</b> Định nghĩa <code>grade(score)</code> <b>trả về</b> <code>Pass</code> khi <code>score &gt;= 50</code> và <code>Fail</code> nếu không. Rồi gán <code>document.body.textContent</code> thành <code>grade(72)</code>.</span>\r\n<template class=\"st\">&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(typeof grade === 'function', 'định nghĩa grade(score)');\r\nassert(grade(72) === 'Pass', 'grade(72) phải trả về \"Pass\"');\r\nassert(grade(30) === 'Fail', 'grade(30) phải trả về \"Fail\"');\r\nassert(document.body.textContent.trim() === 'Pass', 'hiện grade(72) → \"Pass\" lên trang');\r\n</template>\r\n</div>","en":"<h3>Lesson 12 — JavaScript functions</h3>\r\n<p>As programs grow, you find yourself writing the same few lines again and again — format a price, greet a user, total a cart. A <b>function</b> is a named, reusable block of code: you write the steps once, give them a name, and then <i>call</i> that name whenever you need the work done. Functions are how real code stays short, organised and DRY (Don't Repeat Yourself).</p>\r\n<p>A function has two superpowers. It can take <b>inputs</b> — called <b>parameters</b> — so the same function works on different data (<code>greet(\"Mai\")</code> vs <code>greet(\"Nam\")</code>). And it can hand back a result with <b>return</b>, so you can use the answer elsewhere (<code>let tax = calcTax(price)</code>). Inputs in, a value out — that's the whole idea.</p>\r\n<p>You'll define functions and immediately call them, watching results in the Output box or on the page. Once you're comfortable here, the DOM lessons ahead become easy — they're just functions reacting to the user. Let's build reusable code.</p>\r\n\r\n<h4>1. Defining and calling a function</h4>\r\n<p>Write <code>function name() { … }</code> to <b>define</b> it, then <code>name()</code> to <b>call</b> (run) it. Defining a function doesn't run it — calling does.</p>\r\n<pre class=\"snippet\">function sayHi() {\r\n  console.log(\"Hi there!\");\r\n}\r\nsayHi();   // runs it → prints Hi there!</pre>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 1. ✍️ Your turn.</b> Define a function <code>greet</code> that <code>console.log</code>s <code>Hello!</code>, then <b>call</b> it.</span>\r\n<template class=\"st\">&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(typeof greet === 'function', 'define a function called greet');\r\nassert(_OUT_.trim() === 'Hello!', 'calling greet() should print \"Hello!\"');\r\n</template>\r\n</div>\r\n\r\n<h4>2. Parameters — inputs</h4>\r\n<p>Put names in the parentheses to accept <b>inputs</b>. Inside the function, those names hold whatever you pass when you call it.</p>\r\n<pre class=\"snippet\">function greet(name) {\r\n  console.log(\"Hello, \" + name);\r\n}\r\ngreet(\"Mai\");   // Hello, Mai\r\ngreet(\"Nam\");   // Hello, Nam</pre>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 2. ✍️ Your turn.</b> Define <code>greet(name)</code> that <code>console.log</code>s <code>Hello, </code> followed by the name, then call <code>greet(\"Dojo\")</code> (should print <code>Hello, Dojo</code>).</span>\r\n<template class=\"st\">&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(typeof greet === 'function', 'define greet(name)');\r\nassert(_OUT_.trim() === 'Hello, Dojo', 'greet(\"Dojo\") should print \"Hello, Dojo\"');\r\n</template>\r\n</div>\r\n\r\n<h4>3. return — handing back a value</h4>\r\n<p>Most functions <b>compute</b> something rather than print it. Use <code>return</code> to send a value back to whoever called the function, so you can store or reuse it.</p>\r\n<pre class=\"snippet\">function double(n) {\r\n  return n * 2;\r\n}\r\nlet result = double(5);\r\nconsole.log(result);   // 10</pre>\r\n<div class=\"ex\" data-kind=\"quiz\" data-a=\"2\"><span class=\"exq\"><b>Exercise 3.</b> Which keyword sends a value <b>back</b> from a function to where it was called?</span>\r\n<ol class=\"opts\">\r\n<li><code>log</code></li>\r\n<li><code>function</code></li>\r\n<li><code>return</code></li>\r\n<li><code>let</code></li>\r\n</ol></div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 4. ✍️ Your turn.</b> Define <code>double(n)</code> that <b>returns</b> <code>n * 2</code>. (Don't log — just return.)</span>\r\n<template class=\"st\">&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(typeof double === 'function', 'define double(n)');\r\nassert(double(5) === 10, 'double(5) should return 10');\r\nassert(double(0) === 0, 'double(0) should return 0');\r\n</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 5. ✍️ Your turn.</b> Define <code>add(a, b)</code> that <b>returns</b> the sum <code>a + b</code>.</span>\r\n<template class=\"st\">&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(typeof add === 'function', 'define add(a, b)');\r\nassert(add(2, 3) === 5, 'add(2, 3) should return 5');\r\nassert(add(10, 15) === 25, 'add(10, 15) should return 25');\r\n</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 6. ✍️ Your turn.</b> Define <code>welcome(name)</code> that <b>returns</b> the string <code>Hello, </code> + name + <code>!</code> (e.g. <code>welcome(\"Mai\")</code> returns <code>Hello, Mai!</code>). A template literal is easiest.</span>\r\n<template class=\"st\">&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(typeof welcome === 'function', 'define welcome(name)');\r\nassert(welcome('Mai') === 'Hello, Mai!', 'welcome(\"Mai\") should return \"Hello, Mai!\"');\r\nassert(welcome('Nam') === 'Hello, Nam!', 'welcome(\"Nam\") should return \"Hello, Nam!\"');\r\n</template>\r\n</div>\r\n\r\n<h4>4. Arrow functions — a shorter form</h4>\r\n<p>Modern JavaScript has a compact way to write small functions: the <b>arrow function</b>. <code>const square = (n) =&gt; n * n;</code> means the same as a <code>function</code> that returns <code>n * n</code>. You'll see this shorthand everywhere.</p>\r\n<pre class=\"snippet\">const square = (n) =&gt; n * n;\r\nconsole.log(square(4));   // 16</pre>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 7. ✍️ Your turn.</b> Write an <b>arrow function</b> <code>triple</code> that returns <code>n * 3</code> (use <code>const triple = (n) =&gt; …</code>).</span>\r\n<template class=\"st\">&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(typeof triple === 'function', 'define an arrow function triple');\r\nassert(triple(3) === 9, 'triple(3) should return 9');\r\nassert(triple(10) === 30, 'triple(10) should return 30');\r\n</template>\r\n</div>\r\n\r\n<h4>5. Functions that decide</h4>\r\n<p>Combine a function with an <code>if</code> (or a comparison) to answer yes/no questions.</p>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 8. ✍️ Your turn.</b> Define <code>isAdult(age)</code> that <b>returns</b> <code>true</code> when <code>age &gt;= 18</code>, otherwise <code>false</code>. (Tip: <code>return age &gt;= 18;</code> works directly.)</span>\r\n<template class=\"st\">&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(typeof isAdult === 'function', 'define isAdult(age)');\r\nassert(isAdult(20) === true, 'isAdult(20) should be true');\r\nassert(isAdult(15) === false, 'isAdult(15) should be false');\r\n</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 9. ✍️ Your turn.</b> Define <code>total(prices)</code> that takes an array of numbers, loops over it, and <b>returns</b> their sum. (e.g. <code>total([10, 20, 30])</code> returns <code>60</code>.)</span>\r\n<template class=\"st\">&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(typeof total === 'function', 'define total(prices)');\r\nassert(total([10, 20, 30]) === 60, 'total([10, 20, 30]) should return 60');\r\nassert(total([5]) === 5, 'total([5]) should return 5');\r\n</template>\r\n</div>\r\n\r\n<h4>6. Functions that update the page</h4>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 10. ✍️ Your turn.</b> Define <code>show(msg)</code> that sets <code>document.body.textContent</code> to <code>msg</code>. Then call <code>show(\"Done!\")</code> — you'll see it in the preview.</span>\r\n<template class=\"st\">&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(typeof show === 'function', 'define show(msg)');\r\nassert(document.body.textContent.trim() === 'Done!', 'calling show(\"Done!\") should put \"Done!\" on the page');\r\n</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 11. ✍️ Your turn.</b> Define <code>price(item, cost)</code> that <b>returns</b> a string like <code>Coffee: 25000</code>. Then call it and set <code>document.body.textContent</code> to <code>price(\"Coffee\", 25000)</code>.</span>\r\n<template class=\"st\">&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(typeof price === 'function', 'define price(item, cost)');\r\nassert(price('Tea', 30000) === 'Tea: 30000', 'price(\"Tea\", 30000) should return \"Tea: 30000\"');\r\nassert(document.body.textContent.trim() === 'Coffee: 25000', 'show price(\"Coffee\", 25000) on the page');\r\n</template>\r\n</div>\r\n<div class=\"ex stretch\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 12. 🔥 Stretch — ✍️ your turn.</b> Define <code>makeCard(title, author)</code> that <b>returns</b> an HTML string <code>&lt;h3&gt;title&lt;/h3&gt;&lt;p&gt;author&lt;/p&gt;</code> (with the values filled in). Then set <code>document.body.innerHTML</code> to <code>makeCard(\"Dune\", \"Herbert\")</code> — a real card appears.</span>\r\n<template class=\"st\">&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(typeof makeCard === 'function', 'define makeCard(title, author)');\r\nassert(makeCard('Emma', 'Austen').replace(/\\s+/g,'') === '<h3>Emma</h3><p>Austen</p>', 'makeCard should return \"<h3>title</h3><p>author</p>\"');\r\nassert(document.querySelector('h3') && document.querySelector('h3').textContent.trim() === 'Dune', 'render makeCard(\"Dune\", \"Herbert\") — an h3 \"Dune\" should appear');\r\nassert(document.querySelector('p') && document.querySelector('p').textContent.trim() === 'Herbert', 'a p \"Herbert\" should appear');\r\n</template>\r\n</div>\r\n\r\n<h4>🏠 Homework</h4>\r\n<p>Four take-home exercises, auto-graded — all hands-on. The last one is a stretch.</p>\r\n<div class=\"ex homework\" data-kind=\"quiz\" data-a=\"1\"><span class=\"exq\"><b>Exercise 1.</b> What does <b>calling</b> a function mean?</span>\r\n<ol class=\"opts\">\r\n<li>Defining it for later</li>\r\n<li>Running it now</li>\r\n<li>Deleting it</li>\r\n<li>Naming a variable</li>\r\n</ol></div>\r\n<div class=\"ex homework\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 2. ✍️</b> Define <code>square(n)</code> that <b>returns</b> <code>n * n</code>.</span>\r\n<template class=\"st\">&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(typeof square === 'function', 'define square(n)');\r\nassert(square(6) === 36, 'square(6) should return 36');\r\n</template>\r\n</div>\r\n<div class=\"ex homework\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 3. ✍️</b> Define <code>subtract(a, b)</code> that <b>returns</b> <code>a - b</code>, then <code>console.log(subtract(10, 4))</code> (should print <code>6</code>).</span>\r\n<template class=\"st\">&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(typeof subtract === 'function' && subtract(10, 4) === 6, 'subtract(10, 4) should return 6');\r\nassert(_OUT_.trim() === '6', 'console.log(subtract(10, 4)) should print 6');\r\n</template>\r\n</div>\r\n<div class=\"ex homework stretch\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 4. 🔥 Stretch — ✍️</b> Define <code>grade(score)</code> that <b>returns</b> <code>Pass</code> when <code>score &gt;= 50</code> and <code>Fail</code> otherwise. Then set <code>document.body.textContent</code> to <code>grade(72)</code>.</span>\r\n<template class=\"st\">&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(typeof grade === 'function', 'define grade(score)');\r\nassert(grade(72) === 'Pass', 'grade(72) should return \"Pass\"');\r\nassert(grade(30) === 'Fail', 'grade(30) should return \"Fail\"');\r\nassert(document.body.textContent.trim() === 'Pass', 'show grade(72) → \"Pass\" on the page');\r\n</template>\r\n</div>"}},{"t":{"vi":"DOM — chọn & thay đổi phần tử","en":"The DOM — select & change elements"},"kind":"free","html":{"vi":"<h3>Bài 13 — DOM: chọn &amp; thay đổi phần tử</h3>\r\n<p>Đây là lúc JavaScript bắt đầu thấy như phép màu: nó có thể vươn vào một trang đang sống và <b>thay đổi nó</b> — đổi chữ, đổi màu một hộp, thêm phần tử, ẩn thứ gì đó — tất cả sau khi trang đã tải. Cây cầu làm được điều này là <b>DOM</b> (Document Object Model): trình duyệt biến HTML của bạn thành một cây các <b>đối tượng (object)</b> mà JavaScript có thể đọc và viết lại.</p>\r\n<p>Làm việc với DOM luôn là điệu nhảy hai bước như nhau: <b>chọn (select)</b> phần tử bạn muốn, rồi <b>thay đổi</b> nó. Để chọn, bạn dùng <code>document.querySelector(\"…\")</code> với một CSS selector — đúng những selector bạn đã học cho CSS (<code>h1</code>, <code>.box</code>, <code>#title</code>). Khi đã có phần tử, bạn đổi <b>chữ</b> (<code>.textContent</code>), <b>HTML</b> (<code>.innerHTML</code>), <b>kiểu</b> (<code>.style.color</code>), hoặc <b>class</b> (<code>.classList</code>).</p>\r\n<p>Đây là bài trực quan nhất từ trước tới giờ — mỗi bài tập hiển thị thay đổi của bạn ngay trong ô xem trước. Bạn sẽ tóm các phần tử và viết lại chúng ngay tức thì. Chọn, thay đổi, xem nó xảy ra.</p>\r\n\r\n<h4>1. Trang là một cây các object</h4>\r\n<figure class=\"diagram\">\r\n<svg viewBox=\"0 0 420 170\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"IBM Plex Mono, monospace\" font-size=\"12\">\r\n  <rect x=\"170\" y=\"10\" width=\"80\" height=\"26\" rx=\"5\" fill=\"#121C30\" stroke=\"#F5B942\"/><text x=\"210\" y=\"27\" text-anchor=\"middle\" fill=\"#F5B942\">body</text>\r\n  <line x1=\"210\" y1=\"36\" x2=\"110\" y2=\"70\" stroke=\"#22304C\"/><line x1=\"210\" y1=\"36\" x2=\"310\" y2=\"70\" stroke=\"#22304C\"/>\r\n  <rect x=\"70\" y=\"70\" width=\"80\" height=\"26\" rx=\"5\" fill=\"#101a2e\" stroke=\"#7FD1C0\"/><text x=\"110\" y=\"87\" text-anchor=\"middle\" fill=\"#7FD1C0\">h1</text>\r\n  <rect x=\"270\" y=\"70\" width=\"80\" height=\"26\" rx=\"5\" fill=\"#101a2e\" stroke=\"#7FD1C0\"/><text x=\"310\" y=\"87\" text-anchor=\"middle\" fill=\"#7FD1C0\">div</text>\r\n  <line x1=\"310\" y1=\"96\" x2=\"260\" y2=\"130\" stroke=\"#22304C\"/><line x1=\"310\" y1=\"96\" x2=\"360\" y2=\"130\" stroke=\"#22304C\"/>\r\n  <rect x=\"220\" y=\"130\" width=\"80\" height=\"26\" rx=\"5\" fill=\"#101a2e\" stroke=\"#8FA0BC\"/><text x=\"260\" y=\"147\" text-anchor=\"middle\" fill=\"#8FA0BC\">p</text>\r\n  <rect x=\"320\" y=\"130\" width=\"80\" height=\"26\" rx=\"5\" fill=\"#101a2e\" stroke=\"#8FA0BC\"/><text x=\"360\" y=\"147\" text-anchor=\"middle\" fill=\"#8FA0BC\">button</text>\r\n</svg>\r\n<figcaption>Trình duyệt biến HTML của bạn thành một cây các object phần tử — DOM.</figcaption>\r\n</figure>\r\n<div class=\"ex\" data-kind=\"web\"><span class=\"exq\"><b>Bài tập 1.</b> Chạy cái này. Một script đổi tiêu đề <i>sau khi</i> trang tải — đó là DOM đang hoạt động.</span>\r\n<template class=\"st\">&lt;h1 id=\"title\"&gt;Original&lt;/h1&gt;\r\n&lt;script&gt;\r\n  document.querySelector(\"#title\").textContent = \"Changed by JavaScript!\";\r\n&lt;/script&gt;</template>\r\n</div>\r\n\r\n<h4>2. Chọn một phần tử</h4>\r\n<p><code>document.querySelector(\"selector\")</code> tìm phần tử <b>đầu tiên</b> khớp với một CSS selector và trao lại cho bạn để làm việc. <code>querySelector(\"h1\")</code>, <code>querySelector(\".box\")</code>, <code>querySelector(\"#title\")</code>.</p>\r\n<div class=\"ex\" data-kind=\"quiz\" data-a=\"1\"><span class=\"exq\"><b>Bài tập 2.</b> Lệnh nào chọn phần tử có <code>id=\"title\"</code>?</span>\r\n<ol class=\"opts\">\r\n<li><code>document.querySelector(\"title\")</code></li>\r\n<li><code>document.querySelector(\"#title\")</code></li>\r\n<li><code>document.querySelector(\".title\")</code></li>\r\n<li><code>document.getTitle()</code></li>\r\n</ol></div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 3. ✍️ Đến lượt bạn.</b> Chọn <code>&lt;h1&gt;</code> và đổi chữ của nó. Trong script, gán <code>textContent</code> của h1 thành <code>Welcome!</code></span>\r\n<template class=\"st\">&lt;h1&gt;Old heading&lt;/h1&gt;\r\n&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(document.querySelector('h1').textContent.trim() === 'Welcome!', 'gán textContent của h1 thành \"Welcome!\"');\r\n</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 4. ✍️ Đến lượt bạn.</b> Chọn theo id. Đổi phần tử có <code>id=\"msg\"</code> sao cho <code>textContent</code> của nó là <code>Saved</code>.</span>\r\n<template class=\"st\">&lt;p id=\"msg\"&gt;…&lt;/p&gt;\r\n&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(document.querySelector('#msg').textContent.trim() === 'Saved', 'gán textContent của #msg thành \"Saved\"');\r\n</template>\r\n</div>\r\n\r\n<h4>3. Đổi chữ và HTML</h4>\r\n<p><code>.textContent</code> đặt chữ thuần. <code>.innerHTML</code> đặt HTML — trình duyệt phân tích nó, nên bạn có thể chèn cả phần tử. Dùng <code>textContent</code> cho từ ngữ, <code>innerHTML</code> khi cần thẻ.</p>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 5. ✍️ Đến lượt bạn.</b> Chèn HTML. Gán <code>innerHTML</code> của phần tử <code>#box</code> thành <code>&lt;h2&gt;Hi&lt;/h2&gt;</code> — một tiêu đề thật sẽ hiện bên trong nó.</span>\r\n<template class=\"st\">&lt;div id=\"box\"&gt;&lt;/div&gt;\r\n&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nvar h2 = document.querySelector('#box h2');\r\nassert(h2 && h2.textContent.trim() === 'Hi', 'gán innerHTML của #box thành \"<h2>Hi</h2>\"');\r\n</template>\r\n</div>\r\n\r\n<h4>4. Đổi kiểu</h4>\r\n<p>Mỗi phần tử có một <code>.style</code> bạn có thể ghi vào. Tên thuộc tính là tên CSS ở dạng camelCase: <code>.style.color</code>, <code>.style.backgroundColor</code>, <code>.style.fontSize</code>.</p>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 6. ✍️ Đến lượt bạn.</b> Đổi màu tiêu đề. Gán <code>.style.color</code> của <code>&lt;h1&gt;</code> thành <code>red</code>.</span>\r\n<template class=\"st\">&lt;h1&gt;Alert&lt;/h1&gt;\r\n&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(document.querySelector('h1').style.color === 'red', \"gán style.color của h1 thành 'red'\");\r\n</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 7. ✍️ Đến lượt bạn.</b> Đặt một nền. Gán <code>.style.backgroundColor</code> của phần tử <code>#panel</code> thành <code>gold</code>.</span>\r\n<template class=\"st\">&lt;div id=\"panel\"&gt;Panel&lt;/div&gt;\r\n&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(document.querySelector('#panel').style.backgroundColor === 'gold', \"gán style.backgroundColor của #panel thành 'gold'\");\r\n</template>\r\n</div>\r\n\r\n<h4>5. Class và thuộc tính</h4>\r\n<p>Thay vì đặt nhiều style bằng tay, thêm một class dựng sẵn bằng <code>.classList.add(\"name\")</code>. Và đổi bất kỳ thuộc tính nào bằng <code>.setAttribute(\"attr\", \"value\")</code> — tiện cho <code>src</code> của ảnh hay <code>href</code> của liên kết.</p>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 8. ✍️ Đến lượt bạn.</b> Thêm một class. Trên phần tử <code>#box</code>, dùng <code>classList.add</code> để thêm class <code>active</code>.</span>\r\n<template class=\"st\">&lt;div id=\"box\"&gt;Box&lt;/div&gt;\r\n&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(document.querySelector('#box').classList.contains('active'), \"dùng classList.add('active') trên #box\");\r\n</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 9. ✍️ Đến lượt bạn.</b> Đổi một thuộc tính. Gán <code>src</code> của ảnh thành <code>photo.jpg</code> bằng <code>setAttribute</code>.</span>\r\n<template class=\"st\">&lt;img id=\"pic\" alt=\"a photo\"&gt;\r\n&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(document.querySelector('#pic').getAttribute('src') === 'photo.jpg', \"setAttribute('src', 'photo.jpg') trên ảnh\");\r\n</template>\r\n</div>\r\n\r\n<h4>6. Ghép lại</h4>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 10. ✍️ Đến lượt bạn.</b> Đọc một phần tử, viết vào phần tử khác. Lấy chữ bên trong <code>#name</code> và đặt vào <code>#greeting</code> sao cho nó ghi <code>Hi Mai</code> (dùng template literal <code>Hi ${…}</code>).</span>\r\n<template class=\"st\">&lt;span id=\"name\"&gt;Mai&lt;/span&gt;\r\n&lt;p id=\"greeting\"&gt;&lt;/p&gt;\r\n&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(document.querySelector('#greeting').textContent.trim() === 'Hi Mai', 'đọc #name và gán #greeting thành \"Hi Mai\"');\r\n</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 11. ✍️ Đến lượt bạn.</b> Kiểu và chữ cùng lúc. Chọn <code>#status</code>, gán <code>textContent</code> của nó thành <code>Online</code>, và <code>.style.color</code> thành <code>green</code>.</span>\r\n<template class=\"st\">&lt;span id=\"status\"&gt;…&lt;/span&gt;\r\n&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nvar el = document.querySelector('#status');\r\nassert(el.textContent.trim() === 'Online', 'gán chữ #status thành \"Online\"');\r\nassert(el.style.color === 'green', \"gán style.color của #status thành 'green'\");\r\n</template>\r\n</div>\r\n<div class=\"ex stretch\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 12. 🔥 Nâng cao — ✍️ đến lượt bạn.</b> Đổ đầy một danh sách từ dữ liệu. Lặp qua mảng <code>books</code> và dựng <code>innerHTML</code> của <code>#list</code> thành ba mục <code>&lt;li&gt;</code> (mỗi tựa một mục). Ba mục danh sách sẽ hiện ra.</span>\r\n<template class=\"st\">&lt;ul id=\"list\"&gt;&lt;/ul&gt;\r\n&lt;script&gt;\r\nlet books = [\"Dune\", \"Emma\", \"1984\"];\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nvar items = document.querySelectorAll('#list li');\r\nassert(items.length === 3, 'danh sách phải có ba mục <li>');\r\nassert(items[0].textContent.trim() === 'Dune' && items[1].textContent.trim() === 'Emma' && items[2].textContent.trim() === '1984', 'các mục phải là Dune, Emma, 1984 theo thứ tự');\r\n</template>\r\n</div>\r\n\r\n<h4>🏠 Bài tập về nhà</h4>\r\n<p>Bốn bài mang về nhà, chấm tự động — tất cả đều thực hành. Bài cuối là bài nâng cao.</p>\r\n<div class=\"ex homework\" data-kind=\"quiz\" data-a=\"2\"><span class=\"exq\"><b>Bài tập 1.</b> Thuộc tính nào đổi <b>chữ thuần</b> bên trong một phần tử?</span>\r\n<ol class=\"opts\">\r\n<li><code>.style</code></li>\r\n<li><code>.classList</code></li>\r\n<li><code>.textContent</code></li>\r\n<li><code>.href</code></li>\r\n</ol></div>\r\n<div class=\"ex homework\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 2. ✍️</b> Chọn phần tử <code>#title</code> và gán <code>textContent</code> của nó thành <code>My Blog</code>.</span>\r\n<template class=\"st\">&lt;h1 id=\"title\"&gt;…&lt;/h1&gt;\r\n&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(document.querySelector('#title').textContent.trim() === 'My Blog', 'gán chữ #title thành \"My Blog\"');\r\n</template>\r\n</div>\r\n<div class=\"ex homework\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 3. ✍️</b> Chọn <code>#note</code>, gán <code>textContent</code> của nó thành <code>Warning</code> và <code>.style.color</code> thành <code>red</code>.</span>\r\n<template class=\"st\">&lt;p id=\"note\"&gt;…&lt;/p&gt;\r\n&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nvar el = document.querySelector('#note');\r\nassert(el.textContent.trim() === 'Warning', 'gán chữ #note thành \"Warning\"');\r\nassert(el.style.color === 'red', \"gán style.color của #note thành 'red'\");\r\n</template>\r\n</div>\r\n<div class=\"ex homework stretch\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 4. 🔥 Nâng cao — ✍️</b> Lặp qua mảng <code>tags</code> và gán <code>innerHTML</code> của <code>#tags</code> thành một <code>&lt;span&gt;</code> mỗi tag. Ba span sẽ hiện ra.</span>\r\n<template class=\"st\">&lt;div id=\"tags\"&gt;&lt;/div&gt;\r\n&lt;script&gt;\r\nlet tags = [\"new\", \"sale\", \"hot\"];\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nvar spans = document.querySelectorAll('#tags span');\r\nassert(spans.length === 3, 'phải có ba thẻ <span>');\r\nassert(spans[0].textContent.trim() === 'new' && spans[2].textContent.trim() === 'hot', 'các span phải chứa các từ tag theo thứ tự');\r\n</template>\r\n</div>","en":"<h3>Lesson 13 — The DOM: select &amp; change elements</h3>\r\n<p>Here's where JavaScript starts to feel magic: it can reach into a live page and <b>change it</b> — swap text, recolour a box, add elements, hide things — all after the page has loaded. The bridge that makes this possible is the <b>DOM</b> (Document Object Model): the browser turns your HTML into a tree of <b>objects</b> that JavaScript can read and rewrite.</p>\r\n<p>Working with the DOM is always the same two-step dance: <b>select</b> the element you want, then <b>change</b> it. To select, you use <code>document.querySelector(\"…\")</code> with a CSS selector — the exact same selectors you learned for CSS (<code>h1</code>, <code>.box</code>, <code>#title</code>). Once you have the element, you change its <b>text</b> (<code>.textContent</code>), its <b>HTML</b> (<code>.innerHTML</code>), its <b>style</b> (<code>.style.color</code>), or its <b>classes</b> (<code>.classList</code>).</p>\r\n<p>This is the most visual lesson yet — every exercise renders your change live in the preview. You'll grab elements and rewrite them on the fly. Select, change, watch it happen.</p>\r\n\r\n<h4>1. The page is a tree of objects</h4>\r\n<figure class=\"diagram\">\r\n<svg viewBox=\"0 0 420 170\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"IBM Plex Mono, monospace\" font-size=\"12\">\r\n  <rect x=\"170\" y=\"10\" width=\"80\" height=\"26\" rx=\"5\" fill=\"#121C30\" stroke=\"#F5B942\"/><text x=\"210\" y=\"27\" text-anchor=\"middle\" fill=\"#F5B942\">body</text>\r\n  <line x1=\"210\" y1=\"36\" x2=\"110\" y2=\"70\" stroke=\"#22304C\"/><line x1=\"210\" y1=\"36\" x2=\"310\" y2=\"70\" stroke=\"#22304C\"/>\r\n  <rect x=\"70\" y=\"70\" width=\"80\" height=\"26\" rx=\"5\" fill=\"#101a2e\" stroke=\"#7FD1C0\"/><text x=\"110\" y=\"87\" text-anchor=\"middle\" fill=\"#7FD1C0\">h1</text>\r\n  <rect x=\"270\" y=\"70\" width=\"80\" height=\"26\" rx=\"5\" fill=\"#101a2e\" stroke=\"#7FD1C0\"/><text x=\"310\" y=\"87\" text-anchor=\"middle\" fill=\"#7FD1C0\">div</text>\r\n  <line x1=\"310\" y1=\"96\" x2=\"260\" y2=\"130\" stroke=\"#22304C\"/><line x1=\"310\" y1=\"96\" x2=\"360\" y2=\"130\" stroke=\"#22304C\"/>\r\n  <rect x=\"220\" y=\"130\" width=\"80\" height=\"26\" rx=\"5\" fill=\"#101a2e\" stroke=\"#8FA0BC\"/><text x=\"260\" y=\"147\" text-anchor=\"middle\" fill=\"#8FA0BC\">p</text>\r\n  <rect x=\"320\" y=\"130\" width=\"80\" height=\"26\" rx=\"5\" fill=\"#101a2e\" stroke=\"#8FA0BC\"/><text x=\"360\" y=\"147\" text-anchor=\"middle\" fill=\"#8FA0BC\">button</text>\r\n</svg>\r\n<figcaption>The browser turns your HTML into a tree of element objects — the DOM.</figcaption>\r\n</figure>\r\n<div class=\"ex\" data-kind=\"web\"><span class=\"exq\"><b>Exercise 1.</b> Run this. A script changes the heading <i>after</i> the page loads — that's the DOM in action.</span>\r\n<template class=\"st\">&lt;h1 id=\"title\"&gt;Original&lt;/h1&gt;\r\n&lt;script&gt;\r\n  document.querySelector(\"#title\").textContent = \"Changed by JavaScript!\";\r\n&lt;/script&gt;</template>\r\n</div>\r\n\r\n<h4>2. Selecting an element</h4>\r\n<p><code>document.querySelector(\"selector\")</code> finds the <b>first</b> element matching a CSS selector and hands it back so you can work with it. <code>querySelector(\"h1\")</code>, <code>querySelector(\".box\")</code>, <code>querySelector(\"#title\")</code>.</p>\r\n<div class=\"ex\" data-kind=\"quiz\" data-a=\"1\"><span class=\"exq\"><b>Exercise 2.</b> Which call selects the element with <code>id=\"title\"</code>?</span>\r\n<ol class=\"opts\">\r\n<li><code>document.querySelector(\"title\")</code></li>\r\n<li><code>document.querySelector(\"#title\")</code></li>\r\n<li><code>document.querySelector(\".title\")</code></li>\r\n<li><code>document.getTitle()</code></li>\r\n</ol></div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 3. ✍️ Your turn.</b> Select the <code>&lt;h1&gt;</code> and change its text. In the script, set the h1's <code>textContent</code> to <code>Welcome!</code></span>\r\n<template class=\"st\">&lt;h1&gt;Old heading&lt;/h1&gt;\r\n&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(document.querySelector('h1').textContent.trim() === 'Welcome!', 'set the h1 textContent to \"Welcome!\"');\r\n</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 4. ✍️ Your turn.</b> Select by id. Change the element with <code>id=\"msg\"</code> so its <code>textContent</code> is <code>Saved</code>.</span>\r\n<template class=\"st\">&lt;p id=\"msg\"&gt;…&lt;/p&gt;\r\n&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(document.querySelector('#msg').textContent.trim() === 'Saved', 'set #msg textContent to \"Saved\"');\r\n</template>\r\n</div>\r\n\r\n<h4>3. Changing text and HTML</h4>\r\n<p><code>.textContent</code> sets plain text. <code>.innerHTML</code> sets HTML — the browser parses it, so you can inject whole elements. Use <code>textContent</code> for words, <code>innerHTML</code> when you need tags.</p>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 5. ✍️ Your turn.</b> Inject HTML. Set the <code>#box</code> element's <code>innerHTML</code> to <code>&lt;h2&gt;Hi&lt;/h2&gt;</code> — a real heading should appear inside it.</span>\r\n<template class=\"st\">&lt;div id=\"box\"&gt;&lt;/div&gt;\r\n&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nvar h2 = document.querySelector('#box h2');\r\nassert(h2 && h2.textContent.trim() === 'Hi', 'set #box innerHTML to \"<h2>Hi</h2>\"');\r\n</template>\r\n</div>\r\n\r\n<h4>4. Changing style</h4>\r\n<p>Every element has a <code>.style</code> you can write to. The property names are the CSS ones in camelCase: <code>.style.color</code>, <code>.style.backgroundColor</code>, <code>.style.fontSize</code>.</p>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 6. ✍️ Your turn.</b> Recolour the heading. Set the <code>&lt;h1&gt;</code>'s <code>.style.color</code> to <code>red</code>.</span>\r\n<template class=\"st\">&lt;h1&gt;Alert&lt;/h1&gt;\r\n&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(document.querySelector('h1').style.color === 'red', \"set the h1's style.color to 'red'\");\r\n</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 7. ✍️ Your turn.</b> Set a background. Set the <code>#panel</code> element's <code>.style.backgroundColor</code> to <code>gold</code>.</span>\r\n<template class=\"st\">&lt;div id=\"panel\"&gt;Panel&lt;/div&gt;\r\n&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(document.querySelector('#panel').style.backgroundColor === 'gold', \"set #panel style.backgroundColor to 'gold'\");\r\n</template>\r\n</div>\r\n\r\n<h4>5. Classes and attributes</h4>\r\n<p>Instead of setting many styles by hand, add a ready-made class with <code>.classList.add(\"name\")</code>. And change any attribute with <code>.setAttribute(\"attr\", \"value\")</code> — handy for an image's <code>src</code> or a link's <code>href</code>.</p>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 8. ✍️ Your turn.</b> Add a class. On the <code>#box</code> element, use <code>classList.add</code> to add the class <code>active</code>.</span>\r\n<template class=\"st\">&lt;div id=\"box\"&gt;Box&lt;/div&gt;\r\n&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(document.querySelector('#box').classList.contains('active'), \"use classList.add('active') on #box\");\r\n</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 9. ✍️ Your turn.</b> Change an attribute. Set the image's <code>src</code> to <code>photo.jpg</code> using <code>setAttribute</code>.</span>\r\n<template class=\"st\">&lt;img id=\"pic\" alt=\"a photo\"&gt;\r\n&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(document.querySelector('#pic').getAttribute('src') === 'photo.jpg', \"setAttribute('src', 'photo.jpg') on the image\");\r\n</template>\r\n</div>\r\n\r\n<h4>6. Put it together</h4>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 10. ✍️ Your turn.</b> Read one element, write another. Take the text inside <code>#name</code> and place it into <code>#greeting</code> so it reads <code>Hi Mai</code> (use a template literal <code>Hi ${…}</code>).</span>\r\n<template class=\"st\">&lt;span id=\"name\"&gt;Mai&lt;/span&gt;\r\n&lt;p id=\"greeting\"&gt;&lt;/p&gt;\r\n&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(document.querySelector('#greeting').textContent.trim() === 'Hi Mai', 'read #name and set #greeting to \"Hi Mai\"');\r\n</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 11. ✍️ Your turn.</b> Style and text together. Select <code>#status</code>, set its <code>textContent</code> to <code>Online</code>, and its <code>.style.color</code> to <code>green</code>.</span>\r\n<template class=\"st\">&lt;span id=\"status\"&gt;…&lt;/span&gt;\r\n&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nvar el = document.querySelector('#status');\r\nassert(el.textContent.trim() === 'Online', 'set #status text to \"Online\"');\r\nassert(el.style.color === 'green', \"set #status style.color to 'green'\");\r\n</template>\r\n</div>\r\n<div class=\"ex stretch\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 12. 🔥 Stretch — ✍️ your turn.</b> Fill a list from data. Loop over the <code>books</code> array and build the <code>#list</code>'s <code>innerHTML</code> as three <code>&lt;li&gt;</code> items (one per title). Three list items should appear.</span>\r\n<template class=\"st\">&lt;ul id=\"list\"&gt;&lt;/ul&gt;\r\n&lt;script&gt;\r\nlet books = [\"Dune\", \"Emma\", \"1984\"];\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nvar items = document.querySelectorAll('#list li');\r\nassert(items.length === 3, 'the list should have three <li> items');\r\nassert(items[0].textContent.trim() === 'Dune' && items[1].textContent.trim() === 'Emma' && items[2].textContent.trim() === '1984', 'the items should be Dune, Emma, 1984 in order');\r\n</template>\r\n</div>\r\n\r\n<h4>🏠 Homework</h4>\r\n<p>Four take-home exercises, auto-graded — all hands-on. The last one is a stretch.</p>\r\n<div class=\"ex homework\" data-kind=\"quiz\" data-a=\"2\"><span class=\"exq\"><b>Exercise 1.</b> Which property changes the <b>plain text</b> inside an element?</span>\r\n<ol class=\"opts\">\r\n<li><code>.style</code></li>\r\n<li><code>.classList</code></li>\r\n<li><code>.textContent</code></li>\r\n<li><code>.href</code></li>\r\n</ol></div>\r\n<div class=\"ex homework\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 2. ✍️</b> Select the <code>#title</code> element and set its <code>textContent</code> to <code>My Blog</code>.</span>\r\n<template class=\"st\">&lt;h1 id=\"title\"&gt;…&lt;/h1&gt;\r\n&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(document.querySelector('#title').textContent.trim() === 'My Blog', 'set #title text to \"My Blog\"');\r\n</template>\r\n</div>\r\n<div class=\"ex homework\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 3. ✍️</b> Select <code>#note</code>, set its <code>textContent</code> to <code>Warning</code> and its <code>.style.color</code> to <code>red</code>.</span>\r\n<template class=\"st\">&lt;p id=\"note\"&gt;…&lt;/p&gt;\r\n&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nvar el = document.querySelector('#note');\r\nassert(el.textContent.trim() === 'Warning', 'set #note text to \"Warning\"');\r\nassert(el.style.color === 'red', \"set #note style.color to 'red'\");\r\n</template>\r\n</div>\r\n<div class=\"ex homework stretch\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 4. 🔥 Stretch — ✍️</b> Loop over the <code>tags</code> array and set <code>#tags</code>'s <code>innerHTML</code> to a <code>&lt;span&gt;</code> per tag. Three spans should appear.</span>\r\n<template class=\"st\">&lt;div id=\"tags\"&gt;&lt;/div&gt;\r\n&lt;script&gt;\r\nlet tags = [\"new\", \"sale\", \"hot\"];\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nvar spans = document.querySelectorAll('#tags span');\r\nassert(spans.length === 3, 'there should be three <span> tags');\r\nassert(spans[0].textContent.trim() === 'new' && spans[2].textContent.trim() === 'hot', 'the spans should contain the tag words in order');\r\n</template>\r\n</div>"}},{"t":{"vi":"Sự kiện & tương tác","en":"Events & interactivity"},"kind":"free","html":{"vi":"<h3>Bài 14 — Sự kiện &amp; tương tác</h3>\r\n<p>Mọi thứ đến giờ chạy <b>một lần</b>, ngay khi trang tải. Nhưng ứng dụng thật <i>chờ</i> người dùng và phản ứng: một nút chờ được nhấp, một ô chờ bạn gõ, một menu chờ được mở. Sự chờ-và-phản-ứng đó được vận hành bởi <b>sự kiện (event)</b> — các tín hiệu trình duyệt phát ra khi có gì đó xảy ra (\"cái này vừa được nhấp\", \"một phím vừa được nhấn\"). Xử lý sự kiện và trang của bạn trở thành một <b>ứng dụng</b>.</p>\r\n<p>Công cụ là <code>element.addEventListener(\"click\", handler)</code>: bạn bảo một phần tử lắng nghe sự kiện nào và trao cho nó một <b>hàm</b> để chạy mỗi lần sự kiện đó xảy ra. Bên trong handler bạn làm việc — đổi chữ, cập nhật một con đếm, đọc những gì người dùng gõ. Đọc input chỉ là <code>input.value</code>.</p>\r\n<p>Các bài tập này được chấm bằng cách <i>mô phỏng</i> người dùng — bộ chấm nhấp nút của bạn hoặc gõ vào ô của bạn, rồi kiểm tra trang đã phản ứng đúng chưa. Nên bạn được dựng những widget thật sự tương tác: bộ đếm, lời chào, công tắc, một to-do nhỏ. Làm cho trang biết phản hồi nào.</p>\r\n\r\n<h4>1. Phản ứng với một cú nhấp</h4>\r\n<p><code>addEventListener(\"click\", fn)</code> chạy <code>fn</code> mỗi lần phần tử được nhấp. Hàm giữ bất cứ gì cần xảy ra.</p>\r\n<pre class=\"snippet\">let btn = document.querySelector(\"#btn\");\r\nbtn.addEventListener(\"click\", function () {\r\n  document.querySelector(\"#out\").textContent = \"Clicked!\";\r\n});</pre>\r\n<div class=\"ex\" data-kind=\"web\"><span class=\"exq\"><b>Bài tập 1.</b> Chạy, rồi nhấp nút trong ô xem trước — thông báo cập nhật. Đó là một event handler đang hoạt động.</span>\r\n<template class=\"st\">&lt;button id=\"btn\"&gt;Press me&lt;/button&gt;\r\n&lt;p id=\"out\"&gt;Not clicked yet&lt;/p&gt;\r\n&lt;script&gt;\r\n  document.querySelector(\"#btn\").addEventListener(\"click\", function () {\r\n    document.querySelector(\"#out\").textContent = \"You clicked it! 🎉\";\r\n  });\r\n&lt;/script&gt;</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"quiz\" data-a=\"1\"><span class=\"exq\"><b>Bài tập 2.</b> Phương thức nào làm một phần tử lắng nghe một sự kiện?</span>\r\n<ol class=\"opts\">\r\n<li><code>querySelector</code></li>\r\n<li><code>addEventListener</code></li>\r\n<li><code>textContent</code></li>\r\n<li><code>console.log</code></li>\r\n</ol></div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 3. ✍️ Đến lượt bạn.</b> Gắn dây cho nút. Thêm một listener <code>click</code> cho <code>#btn</code> gán <code>textContent</code> của <code>#out</code> thành <code>Done</code>. (Bộ chấm sẽ nhấp giúp bạn.)</span>\r\n<template class=\"st\">&lt;button id=\"btn\"&gt;Go&lt;/button&gt;\r\n&lt;p id=\"out\"&gt;…&lt;/p&gt;\r\n&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\ndocument.querySelector('#btn').click();\r\nassert(document.querySelector('#out').textContent.trim() === 'Done', 'khi nhấp, gán chữ #out thành \"Done\"');\r\n</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 4. ✍️ Đến lượt bạn.</b> Đổi màu khi nhấp. Thêm một listener <code>click</code> cho <code>#btn</code> gán <code>.style.backgroundColor</code> của <code>#box</code> thành <code>gold</code>.</span>\r\n<template class=\"st\">&lt;div id=\"box\"&gt;Box&lt;/div&gt;\r\n&lt;button id=\"btn\"&gt;Paint&lt;/button&gt;\r\n&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\ndocument.querySelector('#btn').click();\r\nassert(document.querySelector('#box').style.backgroundColor === 'gold', \"khi nhấp, gán nền #box thành 'gold'\");\r\n</template>\r\n</div>\r\n\r\n<h4>2. Nhớ giữa các lần nhấp — một bộ đếm</h4>\r\n<p>Giữ một biến bên ngoài handler; mỗi lần nhấp cập nhật nó. Đây là cốt lõi của một bộ đếm, một nút thích, một điểm số.</p>\r\n<div class=\"ex\" data-kind=\"web\"><span class=\"exq\"><b>Bài tập 5.</b> Chạy và nhấp nút vài lần — con đếm tăng mỗi lần nhấp.</span>\r\n<template class=\"st\">&lt;button id=\"btn\"&gt;+1&lt;/button&gt; &lt;span id=\"count\"&gt;0&lt;/span&gt;\r\n&lt;script&gt;\r\n  let count = 0;\r\n  document.querySelector(\"#btn\").addEventListener(\"click\", function () {\r\n    count = count + 1;\r\n    document.querySelector(\"#count\").textContent = count;\r\n  });\r\n&lt;/script&gt;</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 6. ✍️ Đến lượt bạn.</b> Dựng một bộ đếm. Mỗi lần nhấp <code>#btn</code> phải cộng 1 vào con đếm và hiện nó trong <code>#count</code>. (Bộ chấm nhấp hai lần — phải đọc <code>2</code>.)</span>\r\n<template class=\"st\">&lt;button id=\"btn\"&gt;+1&lt;/button&gt; &lt;span id=\"count\"&gt;0&lt;/span&gt;\r\n&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nvar b = document.querySelector('#btn');\r\nb.click(); b.click();\r\nassert(document.querySelector('#count').textContent.trim() === '2', 'sau hai lần nhấp #count phải đọc 2');\r\n</template>\r\n</div>\r\n\r\n<h4>3. Đọc những gì người dùng gõ</h4>\r\n<p>Chữ hiện tại của một input là <code>input.value</code>. Đọc nó bên trong một click handler để phản ứng với bất cứ gì người dùng nhập.</p>\r\n<pre class=\"snippet\">let name = document.querySelector(\"#name\").value;\r\ndocument.querySelector(\"#out\").textContent = \"Hi \" + name;</pre>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 7. ✍️ Đến lượt bạn.</b> Chào người dùng. Khi nhấp <code>#btn</code>, đọc <code>value</code> của <code>#name</code> và gán <code>#out</code> thành <code>Hi </code> + giá trị đó. (Bộ chấm gõ <code>Mai</code>, nên phải đọc <code>Hi Mai</code>.)</span>\r\n<template class=\"st\">&lt;input id=\"name\"&gt;\r\n&lt;button id=\"btn\"&gt;Greet&lt;/button&gt;\r\n&lt;p id=\"out\"&gt;…&lt;/p&gt;\r\n&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\ndocument.querySelector('#name').value = 'Mai';\r\ndocument.querySelector('#btn').click();\r\nassert(document.querySelector('#out').textContent.trim() === 'Hi Mai', 'đọc #name.value khi nhấp và hiện \"Hi Mai\"');\r\n</template>\r\n</div>\r\n\r\n<h4>4. Bật/tắt với classList</h4>\r\n<p><code>classList.toggle(\"name\")</code> thêm một class nếu nó thiếu và bỏ nó nếu nó có — hoàn hảo cho các nút bật/tắt như \"chế độ tối\" hay \"đã thích\".</p>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 8. ✍️ Đến lượt bạn.</b> Khi nhấp <code>#btn</code>, <code>toggle</code> class <code>active</code> trên <code>#box</code>. (Một cú nhấp sẽ thêm nó.)</span>\r\n<template class=\"st\">&lt;div id=\"box\"&gt;Box&lt;/div&gt;\r\n&lt;button id=\"btn\"&gt;Toggle&lt;/button&gt;\r\n&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\ndocument.querySelector('#btn').click();\r\nassert(document.querySelector('#box').classList.contains('active'), 'khi nhấp, toggle class \"active\" lên #box');\r\n</template>\r\n</div>\r\n\r\n<h4>5. Sự kiện input — phản ứng khi gõ</h4>\r\n<p>Một sự kiện <code>input</code> phát ra ở mỗi lần gõ phím. Lắng nghe nó để cập nhật trang <i>trực tiếp</i> khi người dùng gõ.</p>\r\n<div class=\"ex\" data-kind=\"web\"><span class=\"exq\"><b>Bài tập 9.</b> Chạy, rồi gõ vào ô — chữ bên dưới phản chiếu bạn ngay tức thì.</span>\r\n<template class=\"st\">&lt;input id=\"field\" placeholder=\"Type here\"&gt;\r\n&lt;p id=\"echo\"&gt;&lt;/p&gt;\r\n&lt;script&gt;\r\n  document.querySelector(\"#field\").addEventListener(\"input\", function (e) {\r\n    document.querySelector(\"#echo\").textContent = e.target.value;\r\n  });\r\n&lt;/script&gt;</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 10. ✍️ Đến lượt bạn.</b> Gương trực tiếp. Thêm một listener <code>input</code> cho <code>#field</code> chép <code>value</code> của nó vào <code>#echo</code>. (Bộ chấm gõ <code>Hello</code>.)</span>\r\n<template class=\"st\">&lt;input id=\"field\"&gt;\r\n&lt;p id=\"echo\"&gt;…&lt;/p&gt;\r\n&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nvar f = document.querySelector('#field');\r\nf.value = 'Hello';\r\nf.dispatchEvent(new Event('input'));\r\nassert(document.querySelector('#echo').textContent.trim() === 'Hello', 'phản chiếu giá trị đã gõ vào #echo khi có input');\r\n</template>\r\n</div>\r\n\r\n<h4>6. Ghép lại</h4>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 11. ✍️ Đến lượt bạn.</b> Thêm vào danh sách. Khi nhấp <code>#add</code>, đọc value của <code>#item</code> và nối một <code>&lt;li&gt;</code> mới với chữ đó vào <code>#list</code>. (Bộ chấm gõ <code>Milk</code> và nhấp một lần.)</span>\r\n<template class=\"st\">&lt;input id=\"item\"&gt;\r\n&lt;button id=\"add\"&gt;Add&lt;/button&gt;\r\n&lt;ul id=\"list\"&gt;&lt;/ul&gt;\r\n&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\ndocument.querySelector('#item').value = 'Milk';\r\ndocument.querySelector('#add').click();\r\nvar items = document.querySelectorAll('#list li');\r\nassert(items.length === 1 && items[0].textContent.trim() === 'Milk', 'nhấp Add phải nối một <li> ghi \"Milk\"');\r\n</template>\r\n</div>\r\n<div class=\"ex stretch\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 12. 🔥 Nâng cao — ✍️ đến lượt bạn.</b> Một to-do nhỏ. Mỗi lần nhấp <code>#add</code>, nối value của <code>#task</code> thành một <code>&lt;li&gt;</code> mới trong <code>#todo</code>. (Bộ chấm thêm hai việc khác nhau — danh sách phải kết thúc với hai mục theo thứ tự.)</span>\r\n<template class=\"st\">&lt;input id=\"task\"&gt;\r\n&lt;button id=\"add\"&gt;Add task&lt;/button&gt;\r\n&lt;ul id=\"todo\"&gt;&lt;/ul&gt;\r\n&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nvar t = document.querySelector('#task'), add = document.querySelector('#add');\r\nt.value = 'Buy milk'; add.click();\r\nt.value = 'Call Nam'; add.click();\r\nvar items = document.querySelectorAll('#todo li');\r\nassert(items.length === 2, 'danh sách to-do phải có hai mục');\r\nassert(items[0].textContent.trim() === 'Buy milk' && items[1].textContent.trim() === 'Call Nam', 'các mục phải là \"Buy milk\" rồi \"Call Nam\"');\r\n</template>\r\n</div>\r\n\r\n<h4>🏠 Bài tập về nhà</h4>\r\n<p>Bốn bài mang về nhà, chấm tự động — tất cả đều thực hành. Bài cuối là bài nâng cao.</p>\r\n<div class=\"ex homework\" data-kind=\"quiz\" data-a=\"2\"><span class=\"exq\"><b>Bài tập 1.</b> Bạn đọc chữ hiện tại người dùng đã gõ vào một <code>&lt;input&gt;</code> ở đâu?</span>\r\n<ol class=\"opts\">\r\n<li><code>input.textContent</code></li>\r\n<li><code>input.innerHTML</code></li>\r\n<li><code>input.value</code></li>\r\n<li><code>input.class</code></li>\r\n</ol></div>\r\n<div class=\"ex homework\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 2. ✍️</b> Khi nhấp <code>#btn</code>, gán <code>textContent</code> của <code>#msg</code> thành <code>Saved!</code>.</span>\r\n<template class=\"st\">&lt;button id=\"btn\"&gt;Save&lt;/button&gt;\r\n&lt;p id=\"msg\"&gt;…&lt;/p&gt;\r\n&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\ndocument.querySelector('#btn').click();\r\nassert(document.querySelector('#msg').textContent.trim() === 'Saved!', 'khi nhấp, gán #msg thành \"Saved!\"');\r\n</template>\r\n</div>\r\n<div class=\"ex homework\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 3. ✍️</b> Dựng một bộ đếm trên <code>#btn</code> hiện con đếm trong <code>#n</code>. (Bộ chấm nhấp ba lần — phải đọc <code>3</code>.)</span>\r\n<template class=\"st\">&lt;button id=\"btn\"&gt;+1&lt;/button&gt; &lt;span id=\"n\"&gt;0&lt;/span&gt;\r\n&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nvar b = document.querySelector('#btn');\r\nb.click(); b.click(); b.click();\r\nassert(document.querySelector('#n').textContent.trim() === '3', 'sau ba lần nhấp #n phải đọc 3');\r\n</template>\r\n</div>\r\n<div class=\"ex homework stretch\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 4. 🔥 Nâng cao — ✍️</b> Khi nhấp <code>#btn</code>, <code>toggle</code> class <code>on</code> trên <code>#lamp</code>. (Bộ chấm nhấp hai lần, nên phải kết thúc <b>tắt</b> — class bị bỏ.)</span>\r\n<template class=\"st\">&lt;div id=\"lamp\"&gt;💡&lt;/div&gt;\r\n&lt;button id=\"btn\"&gt;Switch&lt;/button&gt;\r\n&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nvar b = document.querySelector('#btn');\r\nb.click(); b.click();\r\nassert(!document.querySelector('#lamp').classList.contains('on'), 'sau hai lần toggle class \"on\" phải bị bỏ');\r\n</template>\r\n</div>","en":"<h3>Lesson 14 — Events &amp; interactivity</h3>\r\n<p>Everything so far ran <b>once</b>, the moment the page loaded. But real apps <i>wait</i> for the user and react: a button waits to be clicked, a box waits for you to type, a menu waits to be opened. That waiting-and-reacting is powered by <b>events</b> — signals the browser fires when something happens (\"this was clicked\", \"a key was pressed\"). Handle events and your page becomes an <b>app</b>.</p>\r\n<p>The tool is <code>element.addEventListener(\"click\", handler)</code>: you tell an element which event to listen for and give it a <b>function</b> to run each time that event happens. Inside the handler you do the work — change text, update a count, read what the user typed. Reading input is just <code>input.value</code>.</p>\r\n<p>These exercises are graded by <i>simulating</i> the user — the grader clicks your button or types into your box, then checks that your page reacted correctly. So you get to build genuinely interactive widgets: counters, greeters, toggles, a mini to-do. Let's make the page respond.</p>\r\n\r\n<h4>1. Reacting to a click</h4>\r\n<p><code>addEventListener(\"click\", fn)</code> runs <code>fn</code> every time the element is clicked. The function holds whatever should happen.</p>\r\n<pre class=\"snippet\">let btn = document.querySelector(\"#btn\");\r\nbtn.addEventListener(\"click\", function () {\r\n  document.querySelector(\"#out\").textContent = \"Clicked!\";\r\n});</pre>\r\n<div class=\"ex\" data-kind=\"web\"><span class=\"exq\"><b>Exercise 1.</b> Run, then click the button in the preview — the message updates. That's an event handler at work.</span>\r\n<template class=\"st\">&lt;button id=\"btn\"&gt;Press me&lt;/button&gt;\r\n&lt;p id=\"out\"&gt;Not clicked yet&lt;/p&gt;\r\n&lt;script&gt;\r\n  document.querySelector(\"#btn\").addEventListener(\"click\", function () {\r\n    document.querySelector(\"#out\").textContent = \"You clicked it! 🎉\";\r\n  });\r\n&lt;/script&gt;</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"quiz\" data-a=\"1\"><span class=\"exq\"><b>Exercise 2.</b> Which method makes an element listen for an event?</span>\r\n<ol class=\"opts\">\r\n<li><code>querySelector</code></li>\r\n<li><code>addEventListener</code></li>\r\n<li><code>textContent</code></li>\r\n<li><code>console.log</code></li>\r\n</ol></div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 3. ✍️ Your turn.</b> Wire the button. Add a <code>click</code> listener to <code>#btn</code> that sets <code>#out</code>'s <code>textContent</code> to <code>Done</code>. (The grader will click it for you.)</span>\r\n<template class=\"st\">&lt;button id=\"btn\"&gt;Go&lt;/button&gt;\r\n&lt;p id=\"out\"&gt;…&lt;/p&gt;\r\n&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\ndocument.querySelector('#btn').click();\r\nassert(document.querySelector('#out').textContent.trim() === 'Done', 'on click, set #out text to \"Done\"');\r\n</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 4. ✍️ Your turn.</b> Change a colour on click. Add a <code>click</code> listener to <code>#btn</code> that sets <code>#box</code>'s <code>.style.backgroundColor</code> to <code>gold</code>.</span>\r\n<template class=\"st\">&lt;div id=\"box\"&gt;Box&lt;/div&gt;\r\n&lt;button id=\"btn\"&gt;Paint&lt;/button&gt;\r\n&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\ndocument.querySelector('#btn').click();\r\nassert(document.querySelector('#box').style.backgroundColor === 'gold', \"on click, set #box background to 'gold'\");\r\n</template>\r\n</div>\r\n\r\n<h4>2. Remembering between clicks — a counter</h4>\r\n<p>Keep a variable outside the handler; each click updates it. This is the heart of a counter, a like button, a score.</p>\r\n<div class=\"ex\" data-kind=\"web\"><span class=\"exq\"><b>Exercise 5.</b> Run and click the button a few times — the count goes up each click.</span>\r\n<template class=\"st\">&lt;button id=\"btn\"&gt;+1&lt;/button&gt; &lt;span id=\"count\"&gt;0&lt;/span&gt;\r\n&lt;script&gt;\r\n  let count = 0;\r\n  document.querySelector(\"#btn\").addEventListener(\"click\", function () {\r\n    count = count + 1;\r\n    document.querySelector(\"#count\").textContent = count;\r\n  });\r\n&lt;/script&gt;</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 6. ✍️ Your turn.</b> Build a counter. Each click of <code>#btn</code> should add 1 to a count and show it in <code>#count</code>. (The grader clicks twice — it should read <code>2</code>.)</span>\r\n<template class=\"st\">&lt;button id=\"btn\"&gt;+1&lt;/button&gt; &lt;span id=\"count\"&gt;0&lt;/span&gt;\r\n&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nvar b = document.querySelector('#btn');\r\nb.click(); b.click();\r\nassert(document.querySelector('#count').textContent.trim() === '2', 'after two clicks #count should read 2');\r\n</template>\r\n</div>\r\n\r\n<h4>3. Reading what the user typed</h4>\r\n<p>An input's current text is <code>input.value</code>. Read it inside a click handler to react to whatever the user entered.</p>\r\n<pre class=\"snippet\">let name = document.querySelector(\"#name\").value;\r\ndocument.querySelector(\"#out\").textContent = \"Hi \" + name;</pre>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 7. ✍️ Your turn.</b> Greet the user. On click of <code>#btn</code>, read <code>#name</code>'s <code>value</code> and set <code>#out</code> to <code>Hi </code> + that value. (The grader types <code>Mai</code>, so it should read <code>Hi Mai</code>.)</span>\r\n<template class=\"st\">&lt;input id=\"name\"&gt;\r\n&lt;button id=\"btn\"&gt;Greet&lt;/button&gt;\r\n&lt;p id=\"out\"&gt;…&lt;/p&gt;\r\n&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\ndocument.querySelector('#name').value = 'Mai';\r\ndocument.querySelector('#btn').click();\r\nassert(document.querySelector('#out').textContent.trim() === 'Hi Mai', 'read #name.value on click and show \"Hi Mai\"');\r\n</template>\r\n</div>\r\n\r\n<h4>4. Toggling with classList</h4>\r\n<p><code>classList.toggle(\"name\")</code> adds a class if it's missing and removes it if it's there — perfect for on/off buttons like \"dark mode\" or \"liked\".</p>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 8. ✍️ Your turn.</b> On click of <code>#btn</code>, <code>toggle</code> the class <code>active</code> on <code>#box</code>. (One click should add it.)</span>\r\n<template class=\"st\">&lt;div id=\"box\"&gt;Box&lt;/div&gt;\r\n&lt;button id=\"btn\"&gt;Toggle&lt;/button&gt;\r\n&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\ndocument.querySelector('#btn').click();\r\nassert(document.querySelector('#box').classList.contains('active'), 'on click, toggle the \"active\" class onto #box');\r\n</template>\r\n</div>\r\n\r\n<h4>5. The input event — react as they type</h4>\r\n<p>An <code>input</code> event fires on every keystroke. Listen for it to update the page <i>live</i> as the user types.</p>\r\n<div class=\"ex\" data-kind=\"web\"><span class=\"exq\"><b>Exercise 9.</b> Run, then type in the box — the text below mirrors you instantly.</span>\r\n<template class=\"st\">&lt;input id=\"field\" placeholder=\"Type here\"&gt;\r\n&lt;p id=\"echo\"&gt;&lt;/p&gt;\r\n&lt;script&gt;\r\n  document.querySelector(\"#field\").addEventListener(\"input\", function (e) {\r\n    document.querySelector(\"#echo\").textContent = e.target.value;\r\n  });\r\n&lt;/script&gt;</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 10. ✍️ Your turn.</b> Live mirror. Add an <code>input</code> listener to <code>#field</code> that copies its <code>value</code> into <code>#echo</code>. (The grader types <code>Hello</code>.)</span>\r\n<template class=\"st\">&lt;input id=\"field\"&gt;\r\n&lt;p id=\"echo\"&gt;…&lt;/p&gt;\r\n&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nvar f = document.querySelector('#field');\r\nf.value = 'Hello';\r\nf.dispatchEvent(new Event('input'));\r\nassert(document.querySelector('#echo').textContent.trim() === 'Hello', 'mirror the typed value into #echo on input');\r\n</template>\r\n</div>\r\n\r\n<h4>6. Put it together</h4>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 11. ✍️ Your turn.</b> Add to a list. On click of <code>#add</code>, read <code>#item</code>'s value and append a new <code>&lt;li&gt;</code> with that text to <code>#list</code>. (The grader types <code>Milk</code> and clicks once.)</span>\r\n<template class=\"st\">&lt;input id=\"item\"&gt;\r\n&lt;button id=\"add\"&gt;Add&lt;/button&gt;\r\n&lt;ul id=\"list\"&gt;&lt;/ul&gt;\r\n&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\ndocument.querySelector('#item').value = 'Milk';\r\ndocument.querySelector('#add').click();\r\nvar items = document.querySelectorAll('#list li');\r\nassert(items.length === 1 && items[0].textContent.trim() === 'Milk', 'clicking Add should append an <li> reading \"Milk\"');\r\n</template>\r\n</div>\r\n<div class=\"ex stretch\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 12. 🔥 Stretch — ✍️ your turn.</b> A mini to-do. On each click of <code>#add</code>, append the <code>#task</code> value as a new <code>&lt;li&gt;</code> in <code>#todo</code>. (The grader adds two different tasks — the list should end with two items in order.)</span>\r\n<template class=\"st\">&lt;input id=\"task\"&gt;\r\n&lt;button id=\"add\"&gt;Add task&lt;/button&gt;\r\n&lt;ul id=\"todo\"&gt;&lt;/ul&gt;\r\n&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nvar t = document.querySelector('#task'), add = document.querySelector('#add');\r\nt.value = 'Buy milk'; add.click();\r\nt.value = 'Call Nam'; add.click();\r\nvar items = document.querySelectorAll('#todo li');\r\nassert(items.length === 2, 'the to-do list should have two items');\r\nassert(items[0].textContent.trim() === 'Buy milk' && items[1].textContent.trim() === 'Call Nam', 'the items should be \"Buy milk\" then \"Call Nam\"');\r\n</template>\r\n</div>\r\n\r\n<h4>🏠 Homework</h4>\r\n<p>Four take-home exercises, auto-graded — all hands-on. The last one is a stretch.</p>\r\n<div class=\"ex homework\" data-kind=\"quiz\" data-a=\"2\"><span class=\"exq\"><b>Exercise 1.</b> Where do you read the current text a user has typed into an <code>&lt;input&gt;</code>?</span>\r\n<ol class=\"opts\">\r\n<li><code>input.textContent</code></li>\r\n<li><code>input.innerHTML</code></li>\r\n<li><code>input.value</code></li>\r\n<li><code>input.class</code></li>\r\n</ol></div>\r\n<div class=\"ex homework\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 2. ✍️</b> On click of <code>#btn</code>, set <code>#msg</code>'s <code>textContent</code> to <code>Saved!</code>.</span>\r\n<template class=\"st\">&lt;button id=\"btn\"&gt;Save&lt;/button&gt;\r\n&lt;p id=\"msg\"&gt;…&lt;/p&gt;\r\n&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\ndocument.querySelector('#btn').click();\r\nassert(document.querySelector('#msg').textContent.trim() === 'Saved!', 'on click, set #msg to \"Saved!\"');\r\n</template>\r\n</div>\r\n<div class=\"ex homework\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 3. ✍️</b> Build a counter on <code>#btn</code> that shows the count in <code>#n</code>. (The grader clicks three times — it should read <code>3</code>.)</span>\r\n<template class=\"st\">&lt;button id=\"btn\"&gt;+1&lt;/button&gt; &lt;span id=\"n\"&gt;0&lt;/span&gt;\r\n&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nvar b = document.querySelector('#btn');\r\nb.click(); b.click(); b.click();\r\nassert(document.querySelector('#n').textContent.trim() === '3', 'after three clicks #n should read 3');\r\n</template>\r\n</div>\r\n<div class=\"ex homework stretch\" data-kind=\"webjs\"><span class=\"exq\"><b>Exercise 4. 🔥 Stretch — ✍️</b> On click of <code>#btn</code>, <code>toggle</code> the class <code>on</code> on <code>#lamp</code>. (The grader clicks twice, so it should end <b>off</b> — the class removed.)</span>\r\n<template class=\"st\">&lt;div id=\"lamp\"&gt;💡&lt;/div&gt;\r\n&lt;button id=\"btn\"&gt;Switch&lt;/button&gt;\r\n&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nvar b = document.querySelector('#btn');\r\nb.click(); b.click();\r\nassert(!document.querySelector('#lamp').classList.contains('on'), 'after two toggles the \"on\" class should be removed');\r\n</template>\r\n</div>"}},{"t":{"vi":"Form, kiểm tra dữ liệu & fetch","en":"Forms, validation & fetch"},"kind":"free","html":{"vi":"<h3>Bài 15 — Form, kiểm tra dữ liệu &amp; fetch</h3>\r\n<p>Form là cách web thu thập thông tin thật — đăng nhập, đăng ký, tìm kiếm, thanh toán. Bạn đã biết dựng HTML của một form; giờ bạn sẽ làm nó <i>hoạt động</i> bằng JavaScript: bắt sự kiện submit, đọc những gì được gõ, và <b>kiểm tra (validate)</b> nó (email đã điền chưa? mật khẩu đủ dài chưa?) trước khi làm gì. Kiểm tra dữ liệu tốt là thứ tách một món đồ chơi khỏi một sản phẩm thật.</p>\r\n<p>Bạn cũng sẽ gặp hai thứ cho phép một trang nói chuyện với thế giới bên ngoài. <b>JSON</b> là định dạng văn bản phổ quát cho dữ liệu — mọi API trên đời đều nói nó — và JavaScript có thể biến văn bản JSON thành object (<code>JSON.parse</code>) và ngược lại (<code>JSON.stringify</code>). Và <b>fetch</b> là hàm yêu cầu dữ liệu từ một máy chủ mà không tải lại trang, kỹ thuật đứng sau tìm kiếm trực tiếp, bảng tin và các nút \"tải thêm\".</p>\r\n<p>Bạn sẽ gắn dây các handler submit, chặn form rỗng bằng thông báo lỗi rõ ràng, và biến JSON thành một danh sách được hiển thị — đúng những gì một ứng dụng thật làm với dữ liệu nó fetch về. Xử lý dữ liệu thật nào.</p>\r\n\r\n<h4>1. Xử lý submit form</h4>\r\n<p>Khi một form được submit, mặc định nó cố <b>tải lại trang</b>. Trong một ứng dụng JavaScript, bạn chặn điều đó bằng <code>event.preventDefault()</code>, rồi tự xử lý mọi thứ trong một listener <code>submit</code>.</p>\r\n<pre class=\"snippet\">let form = document.querySelector(\"form\");\r\nform.addEventListener(\"submit\", function (e) {\r\n  e.preventDefault();               // chặn tải lại\r\n  document.querySelector(\"#out\").textContent = \"Submitted!\";\r\n});</pre>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 1. ✍️ Đến lượt bạn.</b> Bắt submit. Thêm một listener <code>submit</code> cho form gọi <code>e.preventDefault()</code> và gán <code>#out</code> thành <code>Sent</code>. (Bộ chấm submit form.)</span>\r\n<template class=\"st\">&lt;form&gt;&lt;input&gt;&lt;button&gt;Send&lt;/button&gt;&lt;/form&gt;\r\n&lt;p id=\"out\"&gt;…&lt;/p&gt;\r\n&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\ndocument.querySelector('form').dispatchEvent(new Event('submit'));\r\nassert(document.querySelector('#out').textContent.trim() === 'Sent', 'khi submit, gán #out thành \"Sent\"');\r\n</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"quiz\" data-a=\"1\"><span class=\"exq\"><b>Bài tập 2.</b> Lệnh nào chặn một form tải lại trang khi submit?</span>\r\n<ol class=\"opts\">\r\n<li><code>e.stop()</code></li>\r\n<li><code>e.preventDefault()</code></li>\r\n<li><code>form.reload()</code></li>\r\n<li><code>return true</code></li>\r\n</ol></div>\r\n\r\n<h4>2. Đọc các ô &amp; kiểm tra</h4>\r\n<p>Bên trong handler submit, đọc <code>.value</code> của từng ô và kiểm tra nó. Nếu có gì sai, hiện một thông báo và dừng; nếu không thì tiếp tục. Đây là <b>validation</b>.</p>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 3. ✍️ Đến lượt bạn.</b> Bắt buộc có tên. Khi submit, nếu value của <code>#name</code> rỗng, gán <code>#err</code> thành <code>Required</code>; ngược lại gán <code>OK</code>. (Bộ chấm thử cả ô rỗng và ô đã điền.)</span>\r\n<template class=\"st\">&lt;form&gt;&lt;input id=\"name\"&gt;&lt;button&gt;Go&lt;/button&gt;&lt;/form&gt;\r\n&lt;p id=\"err\"&gt;&lt;/p&gt;\r\n&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nvar form = document.querySelector('form'), name = document.querySelector('#name'), err = document.querySelector('#err');\r\nname.value = ''; form.dispatchEvent(new Event('submit'));\r\nassert(err.textContent.trim() === 'Required', 'tên rỗng phải hiện \"Required\"');\r\nname.value = 'Mai'; form.dispatchEvent(new Event('submit'));\r\nassert(err.textContent.trim() === 'OK', 'tên đã điền phải hiện \"OK\"');\r\n</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 4. ✍️ Đến lượt bạn.</b> Kiểm tra độ dài. Khi submit, nếu value của <code>#pw</code> có ít hơn 6 ký tự (<code>.length &lt; 6</code>), gán <code>#err</code> thành <code>Too short</code>; ngược lại <code>Good</code>.</span>\r\n<template class=\"st\">&lt;form&gt;&lt;input id=\"pw\"&gt;&lt;button&gt;Set&lt;/button&gt;&lt;/form&gt;\r\n&lt;p id=\"err\"&gt;&lt;/p&gt;\r\n&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nvar form = document.querySelector('form'), pw = document.querySelector('#pw'), err = document.querySelector('#err');\r\npw.value = '123'; form.dispatchEvent(new Event('submit'));\r\nassert(err.textContent.trim() === 'Too short', 'mật khẩu 3 ký tự phải hiện \"Too short\"');\r\npw.value = 'longenough'; form.dispatchEvent(new Event('submit'));\r\nassert(err.textContent.trim() === 'Good', 'mật khẩu dài phải hiện \"Good\"');\r\n</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 5. ✍️ Đến lượt bạn.</b> Kiểm tra email trông hợp lệ. Khi submit, nếu value của <code>#email</code> <b>không</b> chứa <code>@</code> (dùng <code>.includes(\"@\")</code>), gán <code>#err</code> thành <code>Invalid</code>; ngược lại <code>Valid</code>.</span>\r\n<template class=\"st\">&lt;form&gt;&lt;input id=\"email\"&gt;&lt;button&gt;Check&lt;/button&gt;&lt;/form&gt;\r\n&lt;p id=\"err\"&gt;&lt;/p&gt;\r\n&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nvar form = document.querySelector('form'), email = document.querySelector('#email'), err = document.querySelector('#err');\r\nemail.value = 'nope'; form.dispatchEvent(new Event('submit'));\r\nassert(err.textContent.trim() === 'Invalid', 'địa chỉ không có @ phải hiện \"Invalid\"');\r\nemail.value = 'me@dojo.dev'; form.dispatchEvent(new Event('submit'));\r\nassert(err.textContent.trim() === 'Valid', 'địa chỉ đúng phải hiện \"Valid\"');\r\n</template>\r\n</div>\r\n\r\n<h4>3. JSON — ngôn ngữ của dữ liệu</h4>\r\n<p><b>JSON</b> là văn bản trông như object và mảng JavaScript. <code>JSON.parse(text)</code> biến một chuỗi JSON thành một object thật để bạn đọc; <code>JSON.stringify(obj)</code> làm ngược lại. Đây là cách dữ liệu di chuyển giữa các ứng dụng và máy chủ.</p>\r\n<pre class=\"snippet\">let text = '{\"name\":\"Mai\",\"age\":20}';\r\nlet user = JSON.parse(text);\r\nconsole.log(user.name);            // Mai\r\nconsole.log(JSON.stringify(user)); // trở lại thành text</pre>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 6. ✍️ Đến lượt bạn.</b> Parse JSON. Biến <code>text</code> là một chuỗi JSON. <code>JSON.parse</code> nó thành <code>user</code>, rồi <code>console.log(user.city)</code> (phải in <code>Hanoi</code>).</span>\r\n<template class=\"st\">&lt;script&gt;\r\nlet text = '{\"city\":\"Hanoi\",\"population\":8000000}';\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(_OUT_.trim() === 'Hanoi', 'parse text và console.log(user.city) → \"Hanoi\"');\r\n</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 7. ✍️ Đến lượt bạn.</b> Tạo JSON. Tạo <code>let book = { title: \"Dune\" };</code>, rồi <code>console.log(JSON.stringify(book))</code> (phải in <code>{\"title\":\"Dune\"}</code>).</span>\r\n<template class=\"st\">&lt;script&gt;\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nassert(_OUT_.trim() === '{\"title\":\"Dune\"}', 'console.log(JSON.stringify(book)) phải in {\"title\":\"Dune\"}');\r\n</template>\r\n</div>\r\n<div class=\"ex\" data-kind=\"webjs\"><span class=\"exq\"><b>Bài tập 8. ✍️ Đến lượt bạn.</b> Hiển thị dữ liệu kiểu-fetch. <code>text</code> là một mảng JSON các object sách. Parse nó, rồi lặp để đổ đầy <code>#list</code> với một <code>&lt;li&gt;</code> mỗi tựa. (Ba mục sẽ hiện ra.)</span>\r\n<template class=\"st\">&lt;ul id=\"list\"&gt;&lt;/ul&gt;\r\n&lt;script&gt;\r\nlet text = '[{\"title\":\"Dune\"},{\"title\":\"Emma\"},{\"title\":\"1984\"}]';\r\n\r\n&lt;/script&gt;</template>\r\n<template class=\"ts\">\r\nvar items = document.querySelectorAll('#list li');\r\nassert(items.length === 3, 'parse JSON và render ba mục <li>');\r\nassert(items[0].textContent.trim() === 'Dune' && items[2].textContent.trim() === '1984', 'các mục phải là các tựa sách theo thứ tự');\r\n</template>\r\n</div>\r\n\r\n<h4>4. fetch — dữ liệu từ máy chủ</h4>\r\n<p>Để tải dữ liệu từ một API mà không tải lại, bạn dùng <code>fetch(url)</code>. Nó trả về một <b>promise</b>, nên bạn nối <code>.then()</code> để xử lý phản hồi khi nó về — trước tiên biến nó thành JSON, rồi dùng nó:</p>\r\n<pre class=\"snippet\">fetch(\"https://api.example.com/books\")\r\n  .then(response =&gt; response.json())   // parse phần thân JSON\r\n  .then(data =&gt; {\r\n    console.log(data);                 // giờ dùng dữ liệu\r\n  });</pre>\r\n<p>Dữ liệu bạn nhận về là JSON — đúng thứ bạn vừa luyện parse ở trên. (Ô này không thể ra mạng, nên request thật là chuyện của trang đã triển khai, nhưng hình dạng luôn là như vậy.)</p>\r\n<div class=\"ex\" data-kind=\"quiz\" data-a=\"1\"><span class=\"exq\"><b>Bài tập 9.</b> Sau <code>fetch(url)</code>, bạn gọi gì để biến phần thân phản hồi thành một object dùng được?</span>\r\n<ol class=\"opts\">\r\n<li>chỉ <code>response.text</code></li>\r\n<li><code>response.json()</code></li>\r\n<li><code>JSON.fetch()</code></l
